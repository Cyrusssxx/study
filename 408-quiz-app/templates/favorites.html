{% extends "base.html" %}
{% block title %}收藏夹 - 408刷题{% endblock %}
{% block content %}
<div class="page-header">
    <h1>收藏夹</h1>
    <p>收藏重要的题目，随时回顾</p>
</div>

<!-- 筛选栏 -->
<div class="filter-bar">
    <select id="subjectFilter" onchange="loadFavorites()">
        <option value="">全部科目</option>
        {% for key, info in subjects.items() %}
        <option value="{{ key }}">{{ info.name }}</option>
        {% endfor %}
    </select>
    <button class="btn btn-primary" onclick="startFavPractice()">开始收藏练习</button>
</div>

<!-- 收藏列表 -->
<div class="question-list" id="favList">
    <div class="loading">加载中...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadFavorites() {
        const subject = document.getElementById('subjectFilter').value;
        const params = new URLSearchParams();
        if (subject) params.set('subject', subject);
        
        try {
            const resp = await fetch(`/api/favorites?${params}`);
            const data = await resp.json();
            renderFavList(data.favorites);
        } catch (e) {
            document.getElementById('favList').innerHTML = `<div class="error">加载失败</div>`;
        }
    }

    function renderFavList(questions) {
        const container = document.getElementById('favList');
        
        if (questions.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>暂无收藏</h3>
                    <p>在刷题时点击 ☆ 即可收藏题目</p>
                </div>
            `;
            return;
        }

        let html = `<div class="list-header"><span>共 ${questions.length} 道收藏</span></div>`;
        
        for (const q of questions) {
            const subjectName = q.subject === 'os' ? '操作系统' : 
                               q.subject === 'co' ? '计算机组成原理' :
                               q.subject === 'ds' ? '数据结构' : '计算机网络';
            html += `
                <div class="list-item">
                    <div class="item-header">
                        <span class="item-subject">${subjectName}</span>
                        <button class="btn-icon favorited" onclick="removeFav('${q.question_id}')">★</button>
                    </div>
                    <div class="item-content">${q.content}</div>
                    <div class="item-options">
                        ${Object.entries(q.options || {}).map(([k,v]) => `<span class="mini-option">${k}. ${v}</span>`).join('')}
                    </div>
                    ${q.answer ? `<div class="item-answer">正确答案: ${q.answer}</div>` : ''}
                </div>
            `;
        }
        
        container.innerHTML = html;
    }

    async function removeFav(questionId) {
        await fetch(`/api/favorite/${questionId}`, {method: 'POST'});
        loadFavorites();
    }

    function startFavPractice() {
        const subject = document.getElementById('subjectFilter').value;
        if (subject) {
            window.location.href = `/quiz/${subject}?mode=favorite`;
        } else {
            alert('请先选择一个科目');
        }
    }

    loadFavorites();
</script>
{% endblock %}
