{% extends "base.html" %}
{% block title %}搜题 - 408刷题{% endblock %}
{% block content %}
<div class="page-header">
    <h1>搜题</h1>
    <p>按关键词搜索题干、选项和解析</p>
</div>

<!-- 搜索栏 -->
<div class="filter-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="输入关键词，如：页面置换 / TCP拥塞 / 哈夫曼..." onkeydown="if(event.key==='Enter')doSearch()">
    <select id="subjectFilter" onchange="doSearch()">
        <option value="">全部科目</option>
        {% for key, info in subjects.items() %}
        <option value="{{ key }}">{{ info.name }}</option>
        {% endfor %}
    </select>
    <button class="btn btn-primary" onclick="doSearch()">搜索</button>
</div>

<!-- 结果列表 -->
<div class="question-list" id="searchResults">
    <div class="empty-state">
        <h3>输入关键词开始搜索</h3>
        <p>支持题干、选项、解析全文匹配，最多显示 50 条结果</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function doSearch() {
        const kw = document.getElementById('searchInput').value.trim();
        const subject = document.getElementById('subjectFilter').value;
        const container = document.getElementById('searchResults');
        if (!kw) return;

        container.innerHTML = '<div class="loading">搜索中...</div>';
        try {
            const params = new URLSearchParams({ q: kw });
            if (subject) params.set('subject', subject);
            const resp = await fetch(`/api/search?${params}`);
            const data = await resp.json();
            renderResults(data.results, kw);
        } catch (e) {
            container.innerHTML = '<div class="error">搜索失败</div>';
        }
    }

    function escapeReg(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // 在纯文本节点里高亮关键词（结果内容本身可能带HTML标签，先粗暴替换文本）
    function highlight(html, kw) {
        try {
            return html.replace(new RegExp(escapeReg(kw), 'gi'), m => `<mark>${m}</mark>`);
        } catch (e) { return html; }
    }

    function renderResults(results, kw) {
        const container = document.getElementById('searchResults');
        if (results.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>没有找到相关题目</h3>
                    <p>换个关键词试试，比如更短的词</p>
                </div>`;
            return;
        }

        let html = `<div class="list-header"><span>找到 ${results.length} 道题${results.length >= 50 ? '（已达上限，可换更精确的关键词）' : ''}，点击进入对应题目</span></div>`;
        for (const q of results) {
            html += `
                <div class="list-item list-item-link" onclick="location.href='/quiz/${q.subject}?mode=sequential&goto=${q.id}'">
                    <div class="item-header">
                        <span class="item-subject">${q.subject_name}</span>
                        ${q.is_real_exam ? '<span class="badge-real">统考真题</span>' : ''}
                        <span class="item-info">${q.chapter || ''}${q.section ? ' · ' + q.section : ''}</span>
                    </div>
                    <div class="item-content">${highlight(q.content, kw)}</div>
                    <div class="item-options">
                        ${Object.entries(q.options || {}).map(([k,v]) => `<span class="mini-option">${k}. ${highlight(v, kw)}</span>`).join('')}
                    </div>
                </div>`;
        }
        container.innerHTML = html;
    }

    document.getElementById('searchInput').focus();
</script>
{% endblock %}
