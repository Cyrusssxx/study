<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}408刷题{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/wrong" class="nav-link">错题本</a>
                <a href="/favorites" class="nav-link">收藏夹</a>
                <a href="/exam" class="nav-link">模拟考试</a>
                <a href="/stats" class="nav-link">学习统计</a>
                <a href="/search" class="nav-link">搜题</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="开启后答对自动进入下一题">
                    答对自动跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
