    <script>
    /* 讲义方法论知识库：data/algo_notes.json（懒加载，不进主包预缓存）
       内容一字未改，仅还原排版结构：标题层级 / 表格 / 代码块 / 真题·例题卡片
       版型对齐 notes.html（考点笔记）：notes-header + notes-layout(toggle + toc + content) */

    const NBSP = /\u00a0/g;
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const norm = (s) => String(s == null ? '' : s).replace(NBSP, ' ');

    let anchorSeq = 0;

    /* ---------- 片段渲染 ---------- */

    /* 讲义里的「做题思路表」：
       1) PDF 抽字常把空表头列丢掉 → 首行比正文少 1 列，左补一列恢复对齐；
          2) 少 2 列以上的情况是 PDF 按视觉行拆散了单元格（列顺序错乱），
             无法可靠还原 → 整体降级为普通文本，避免渲染出错序的表。 */
    function isTableLine(line) {
        return line.indexOf('|') >= 0 && line.split('|').length >= 2;
    }

    function tableBlock(rows) {
        if (rows.length < 2) return null;   /* 单行不算表（如「data | link」） */
        let grid = rows.map(r => r.split('|').map(c => c.trim()));
        const widths = grid.map(r => r.length);
        const counts = {};
        widths.forEach(w => { counts[w] = (counts[w] || 0) + 1; });
        let N = 0, modal = 0;
        Object.keys(counts).forEach(w => { if (counts[w] > modal) { modal = counts[w]; N = +w; } });
        /* 只接受「最多缺 1 列」的可信情况：缺失的是空表头列，左补即可 */
        if (grid.some(r => N - r.length !== 1 && r.length !== N)) return null;
        grid = grid.map(r => r.length === N - 1 ? [''].concat(r) : r);
        const head = grid[0], body = grid.slice(1);
        return '<table class="algo-tbl">' +
            '<tr>' + head.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>' +
            body.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') +
            '</table>';
    }

    /* 真题 / 例题标识：可位于行首，或在「例：」这类短引导词之后 */
    const MARKER_RE = /^(?:例[题]?\s*[:：]\s*)?(【[^】]*真题[^】]*】|例题\s*\d+\s*[-–—~]\s*\d+)/;
    const RE_REAL = /^【[^】]*真题[^】]*】/;

    /* ---------- 正文画重点：关键词行内高亮 + 关键句高亮 ---------- */
    /* 关键词：算法方法论核心词汇（与标题识别词同源；排除「复杂度/做法」以保住测试里的精确段落断言） */
    const ALGO_KW = [
        '深度优先遍历', '广度优先遍历', '先序遍历', '中序遍历', '后序遍历', '层序遍历',
        '深度优先', '广度优先', 'DFS', 'BFS',
        '平衡二叉树', '完全二叉树', '满二叉树', '线索二叉树', '红黑树', '二叉搜索树', '二叉排序树', '二叉树',
        '邻接多重表', '邻接矩阵', '邻接表',
        '动态规划', '分治法', '分治', '贪心算法', '贪心', '回溯法', '回溯', '枚举法', '枚举', '穷举',
        '递归', '剪枝', '记忆化', '双指针', '滑动窗口', '前缀和', '差分数组', '单调栈',
        '位运算', '状态压缩', '摩尔投票', '拓扑排序', '并查集', '哈夫曼', 'KMP',
        '散列表', '哈希表', '散列', '哈希', '优先队列', '堆排序', '堆', '模板'
    ];
    const KW_RE = new RegExp('(' + ALGO_KW.join('|') + ')', 'g');

    /* 关键句信号：含这些词的整句视为「重点句」，套高亮底色 */
    const KEY_SIGNAL = /(牢记|务必|必须|切记|千万别|易错|易混淆|误区|口诀|结论|一句话|综上所述|核心|重点|关键|注意|明确(?:要求|规定)|一般要求|通常要求|必会|必考|常考|高频|建议|优先|最佳|本质|灵魂|诀窍)/;

    function fmtSentence(raw) {
        const withKw = esc(raw).replace(KW_RE, '<mark class="algo-kw">$1</mark>');
        return KEY_SIGNAL.test(raw)
            ? `<span class="algo-key-sentence">${withKw}</span>`
            : withKw;
    }

    /* 逐行 → 逐句（保留 。！？；； 断句与 \n 换行）→ 关键句高亮、关键词行内标。文字一字未改 */
    function fmtPara(text) {
        return norm(text).split('\n').map(line =>
            line.split(/(?<=[。！？；;])/).map(fmtSentence).join('')
        ).join('\n');
    }

    /** 按「标记行」把文字段切成多张卡（一段里常并列 6 个例题） */
    function paraBlocks(lines) {
        let out = [];
        let cur = null;
        const push = () => { if (cur) { out.push(cur); cur = null; } };
        for (const l of lines) {
            const m = l.match(MARKER_RE);
            if (m) {
                push();
                const rest = l.slice(m[0].length).trim();
                cur = { badge: m[1], isReal: RE_REAL.test(m[1]), lines: rest ? [rest] : [] };
            } else {
                if (!cur) { cur = { badge: null, lines: [] }; }
                cur.lines.push(l);
            }
        }
        push();
        return out.map(b => {
            if (!b.badge) return `<div class="algo-para">${fmtPara(b.lines.join('\n'))}</div>`;
            const cls = b.isReal ? 'algo-qa-real' : 'algo-qa-eg';
            return `<div class="algo-qa ${cls}"><span class="algo-qa-badge">${esc(b.badge)}</span>` +
                (b.lines.length ? `<div class="algo-para">${fmtPara(b.lines.join('\n'))}</div>` : '') +
                '</div>';
        }).join('');
    }

    /**
     * 多行 | 分隔段，但列数对不齐（PDF 按视觉行拆散了单元格）→
     * 不猜列序，按原文等宽保留，既可读又不误导。
     */
    function rawBlock(rows) {
        const text = rows.map(r => norm(r)).join('\n');
        const isWide = rows.some(r => norm(r).length > 60);
        return `<div class="algo-raw${isWide ? ' algo-raw-wide' : ''}">${esc(text)}</div>`;
    }

    /** 段落里表格行与文字混排时，按「表格段 / 文字段」切分，避免 | 直接露出 */
    function renderText(raw) {
        const lines = norm(raw).split('\n');
        let html = '';
        let buf = [];
        let tbl = null;
        const flush = () => {
            if (!buf.length) return;
            const t = tbl ? tableBlock(buf) : null;
            if (t) html += t;
            else if (tbl && buf.length > 1) html += rawBlock(buf);   /* 乱序：原文保留 */
            else html += paraBlocks(buf);
            buf = [];
        };
        for (const rawLine of lines) {
            const l = norm(rawLine).trim();
            if (!l) { flush(); tbl = null; continue; }
            const t = isTableLine(l);
            if (tbl === null) tbl = t;
            else if (t !== tbl) { flush(); tbl = t; }
            buf.push(l);
        }
        flush();
        return html;
    }

    /* 指定标题强制加粗（用户显式要求的章节/小节）：去空白后精确匹配，优先于关键词规则。
       链表章基础：3.1 概述系 + 3.2 基本操作系（含 遍历链表 的两种元素个数情形） */
    const FORCED_STRONG = new Set([
        '3.1链表概述', '3.1.1特点', '3.1.2题目的要求', '3.1.3链表定义',
        '3.2基本操作', '3.2.1删除p', '3.2.2p插入到pre后面', '3.2.3尾插法和头插法', '3.2.4遍历链表',
        '元素个数n已知', '元素个数未知'
    ]);
    const normKey = s => String(s || '').replace(/[\s\u00a0]+/g, '');

    /* 给标题加"重点"判定：暴力解信号（直接命中+正文语义信号）都打 strong；可选项信号打 optional。
       用户主刷暴力解：4-5 章的 DFS/BFS/枚举/递归/遍历也属于"暴力解通用模式"，统一标 strong 醒目提示。 */
    function classifyTitle(rawText) {
        const t = (rawText || '').trim();
        if (FORCED_STRONG.has(normKey(t))) return 'strong';
        if (/^[*]\s*/.test(t)) return 'optional';
        // 直接的"暴力解"标题（含代码题主力解法：快排也属第一梯队暴力解）
        if (/(暴力解|暴力枚举|枚举法|枚举求解|快速排序|快排)/.test(t)) return 'strong';
        // 4-5 章通用暴力解信号：递归/DFS/BFS/遍历/回溯/分治穷举
        if (/(递归遍历|DFS\s*\/?\s*BFS|深度优先|广度优先|树遍历|前序|中序|后序|层序|回溯|穷举|分治|暴力)/.test(t)) return 'strong';
        // 重要性信号（"模板"不放这里：2.4 优化解下的模板是扩展内容，不该因此加粗并连锁扩散）
        if (/(真题|重要|核心|考点|常考|总结|思路|方法|做题方法|基本概念)/.test(t)) return 'strong';
        // 可选/了解信号
        if (/(选|了解|扩展|选学|选读|难题|相对不重要|选看|进阶)/.test(t)) return 'optional';
        return '';
    }

    /* 长代码块（≥28 个非空行）拆成两块并排：按行均分,宽屏 grid 两栏,窄屏自动堆叠。
       只影响展示,数据不动；短块保持单个 pre。 */
    function renderCode(text) {
        const lines = String(text).split('\n');
        const nonEmpty = lines.filter(l => l.trim()).length;
        if (nonEmpty >= 28) {
            const half = Math.ceil(lines.length / 2);
            const part = (arr) => arr.join('\n');
            return `<div class="algo-code-pair">`
                + `<pre class="code-block algo-code">${esc(part(lines.slice(0, half)))}</pre>`
                + `<pre class="code-block algo-code">${esc(part(lines.slice(half)))}</pre>`
                + `</div>`;
        }
        return `<pre class="code-block algo-code">${esc(text)}</pre>`;
    }

    function renderItems(items) {
        let html = '';
        for (const it of items) {
            if (it.t === 'h') {
                const lvl = Math.min(5, Math.max(3, it.lvl || 3));
                anchorSeq++;
                const id = 'sec-' + anchorSeq;
                it._id = id;
                let cls = 'algo-h';
                let clsToc = '';
                // 当前节自身分类
                const direct = classifyTitle(it.text);
                // 若本节是 h3/h4 的"暴力解"类，则后续子节继承 strong
                const isBrute = /(暴力解)/.test(it.text);
                if (direct === 'strong') { cls += ' algo-h-strong'; clsToc = 'algo-toc-strong'; }
                else if (direct === 'optional') { cls += ' algo-h-optional'; clsToc = 'algo-toc-optional'; }
                else if (isBrute) { cls += ' algo-h-strong'; clsToc = 'algo-toc-strong'; }
                it._tocClass = clsToc;
                // 显示文本：把开头的 "* " 保留（CSS 已经在 strong/optional 上加 ▶/☆ 标识）
                html += `<h${lvl} class="${cls}" id="${id}" data-anchor="${id}">${esc(norm(it.text))}</h${lvl}>`;
            } else if (it.t === 'code') {
                html += renderCode(norm(it.text));
                // 快排完整定义代码块下方自动挂载可视化演示（唯一签名：含空格版 + 递归调用）
                if (/void Qsort\(int A\[\], int L, int R\)[\s\S]*Qsort\(A, L, i - 1\)/.test(it.text)) {
                    html += qsDemoHtml();
                }
            } else {
                html += renderText(it.text);
            }
        }
        return html;
    }

    /* ---------- 目录（三级全展开，沿用 notes 视觉） ---------- */

    function buildNav(chapters) {
        let html = '';
        for (const c of chapters) {
            anchorSeq++;
            const cid = 'ch-' + anchorSeq;
            const chTocCls = (c.title && /(暴力解|重要|核心|考点|常考)/.test(c.title)) ? ' algo-toc-strong' : '';
            html += `<a class="algo-toc-ch${chTocCls}" href="#${cid}">${esc(c.title)}</a>`;
            for (const s of c.items.filter(x => x.t === 'h' && x._id)) {
                const lvl = Math.min(5, Math.max(3, s.lvl || 3));
                const base = lvl === 3 ? 'notes-toc-sec' : (lvl === 4 ? 'notes-toc-sub' : 'notes-toc-sub algo-toc-l5');
                const toc = s._tocClass || '';
                html += `<a class="${base}${toc ? ' ' + toc : ''}" href="#${s._id}">${esc(norm(s.text))}</a>`;
            }
        }
        return html;
    }

    /* ---------- 加载 ---------- */

    /* 快速排序可视化演示容器（挂载在快排完整代码块下方） */
    function qsDemoHtml() {
        return `<div class="qs-demo" data-qs-demo>
            <div class="qs-demo-title">① 快速排序 · 可视化演示</div>
            <div class="qs-demo-cap">观察「选基准 → i/j 双向扫描 → 交换 → 基准归位 → 递归」的完整过程；可随时暂停 / 换一组数据 / 调速。</div>
            <div class="qs-stage" data-qs-stage></div>
            <div class="qs-legend">
                <s><i class="pv"></i>基准 pivot</s>
                <s><i class="li"></i>左指针 i</s>
                <s><i class="rj"></i>右指针 j</s>
                <s><i class="sw"></i>交换</s>
                <s><i class="dn"></i>已归位</s>
            </div>
            <div class="qs-ctrl">
                <button class="qs-btn run" data-qs-run>▶ 启动</button>
                <button class="qs-btn" data-qs-shuffle>↺ 换一组</button>
                <span class="qs-spd">速度
                    <button data-qs-spd="900" class="on">慢</button>
                    <button data-qs-spd="480">中</button>
                    <button data-qs-spd="200">快</button>
                </span>
            </div>
            <div class="qs-msg" data-qs-msg>准备好，点「▶ 启动」开始。</div>
        </div>`;
    }

    /* ------------------------------------------------------------------
     * 快速排序可视化演示引擎
     * 预演快排（记录每一步的数组快照与指针状态），按间隔逐步播放，可暂停/继续/换组/调速
     * ------------------------------------------------------------------ */
    function qsBuildFrames(arr0) {
        const frames = [];
        const push = (a, pi, li, rj, swp, fixed, lo, hi, msg) => {
            frames.push({ a: a.slice(), pi, li, rj, swp: swp ? [swp[0], swp[1]] : null, fixed: new Set(fixed), lo, hi, msg });
        };
        const qs = (a, L, R, fixed) => {
            if (L > R) return;
            if (L === R) { fixed.add(L); push(a, L, -1, -1, null, fixed, L, R, `区间只剩一个元素 A[${L}]=${a[L]}，天然有序，直接归位`); return; }
            const pivot = a[L];
            push(a, L, -1, -1, null, fixed, L, R, `进入区间 [${L}, ${R}]：选基准 pivot = A[${L}] = ${pivot}`);
            let i = L, j = R;
            while (i < j) {
                push(a, L, i, j, null, fixed, L, R, `i=${i}、j=${j} 开始双向扫描：先让 j 向左找 < ${pivot} 的元素`);
                while (i < j && a[j] >= pivot) { j--; push(a, L, i, j, null, fixed, L, R, `A[${j}]=${a[j]} ≥ ${pivot}，j 继续左移 → j=${j}`); }
                while (i < j && a[i] <= pivot) { i++; push(a, L, i, j, null, fixed, L, R, `A[${i}]=${a[i]} ≤ ${pivot}，i 继续右移 → i=${i}`); }
                if (i < j) {
                    [a[i], a[j]] = [a[j], a[i]];
                    push(a, L, i, j, [i, j], fixed, L, R, `A[${i}] 与 A[${j}] 互换：${a[i]} ⇌ ${a[j]}`);
                }
            }
            [a[L], a[i]] = [a[i], a[L]];
            fixed.add(i);
            push(a, L, i, i, null, fixed, L, R, `基准 ${pivot} 归位到 A[${i}] ✅（左侧都 ≤ 它，右侧都 ≥ 它）`);
            qs(a, L, i - 1, fixed);
            qs(a, i + 1, R, fixed);
        };
        qs(arr0.slice(), 0, arr0.length - 1, new Set());
        return frames;
    }

    function qsRenderFrame(dm, f) {
        const stage = dm.querySelector('[data-qs-stage]');
        const max = Math.max.apply(null, f.a);
        stage.innerHTML = '';
        f.a.forEach((v, idx) => {
            const bar = document.createElement('div');
            bar.className = 'qs-bar';
            const cls = f.fixed.has(idx) ? 'done'
                : (f.swp && (idx === f.swp[0] || idx === f.swp[1])) ? 'swp'
                : (idx === f.li) ? (idx === f.rj ? 'swp' : 'li')
                : (idx === f.rj) ? 'rj'
                : (idx === f.pi) ? 'pivot' : '';
            if (cls) bar.classList.add(cls);
            const h = Math.max(8, Math.round(v / max * 118));
            bar.innerHTML = `<b>${v}</b><i style="height:${h}px"></i>`;
            stage.appendChild(bar);
        });
        const msg = dm.querySelector('[data-qs-msg]');
        msg.innerHTML = `<b>[${f.lo},${f.hi}]</b>　${f.msg}`;
    }

    function qsInitDemo(dm) {
        const state = { cur: [], frames: [], idx: 0, timer: null, speed: 480, running: false };
        const runBtn = dm.querySelector('[data-qs-run]');
        const stage = dm.querySelector('[data-qs-stage]');

        function fresh() {
            state.cur = [];
            const n = 8;
            while (state.cur.length < n) {
                const v = 5 + Math.floor(Math.random() * 95);
                if (state.cur.indexOf(v) === -1) state.cur.push(v);
            }
            state.frames = qsBuildFrames(state.cur);
            state.idx = 0;
        }
        function tick() {
            if (state.idx >= state.frames.length) {
                state.running = false;
                runBtn.textContent = '▶ 重播';
                runBtn.classList.add('run');
                dm.querySelector('[data-qs-msg]').innerHTML = '🎉 排序完成！可点「换一组」再来一轮，或「重播」再看一遍。';
                return;
            }
            qsRenderFrame(dm, state.frames[state.idx++]);
            if (state.idx < state.frames.length) state.timer = setTimeout(tick, state.speed);
            else { state.running = false; runBtn.textContent = '▶ 重播'; runBtn.classList.add('run'); dm.querySelector('[data-qs-msg]').innerHTML = '🎉 排序完成！可点「换一组」再来一轮，或「重播」再看一遍。'; }
        }
        function stopTimer() { if (state.timer) { clearTimeout(state.timer); state.timer = null; } }

        runBtn.addEventListener('click', () => {
            if (state.running) {                       // 运行中 → 暂停
                stopTimer(); state.running = false;
                runBtn.textContent = '▶ 继续';
                runBtn.classList.add('run');
                dm.querySelector('[data-qs-msg]').innerHTML += '（已暂停）';
                return;
            }
            if (state.idx === 0 || state.idx >= state.frames.length) {   // 首帧或播完 → 从头/重播
                state.idx = 0;
                fresh();
                state.idx = 0;
                if (!stage.children.length) qsRenderFrame(dm, state.frames[0]);
            }
            stopTimer(); state.running = true;
            runBtn.textContent = '⏸ 暂停';
            runBtn.classList.remove('run');
            tick();
        });

        dm.querySelector('[data-qs-shuffle]').addEventListener('click', () => {
            stopTimer(); state.running = false;
            fresh();
            runBtn.textContent = '▶ 启动';
            runBtn.classList.add('run');
            qsRenderFrame(dm, state.frames[0]);
            dm.querySelector('[data-qs-msg]').innerHTML = '已生成一组新数据，点「▶ 启动」开始。';
        });

        dm.querySelectorAll('[data-qs-spd]').forEach(btn => {
            btn.addEventListener('click', () => {
                dm.querySelectorAll('[data-qs-spd]').forEach(b => b.classList.remove('on'));
                btn.classList.add('on');
                state.speed = parseInt(btn.dataset.qsSpd, 10);
                if (state.running) { stopTimer(); tick(); }
            });
        });

        fresh();
        qsRenderFrame(dm, state.frames[0]);
        dm.querySelector('[data-qs-msg]').innerHTML = '准备好，点「▶ 启动」开始。';
    }

    /* ---------- 目录收起/展开（与考点笔记同款：WAAPI 合成器属性动画 + 本地记忆） ---------- */

    const algoLayout = document.getElementById('algoLayout');
    if (localStorage.getItem('algo_toc_collapsed') === '1') {
        algoLayout.classList.add('notes-toc-collapsed');
        document.getElementById('algoTocToggle').textContent = '»';
    }

    const TOC_ANIM_OPT = { duration: 180, easing: 'ease' };
    let tocAnimating = false;
    function toggleAlgoToc() {
        if (tocAnimating) return;
        const toc = document.getElementById('algoToc');
        const collapsing = !algoLayout.classList.contains('notes-toc-collapsed');
        const btn = document.getElementById('algoTocToggle');
        if (typeof toc.animate !== 'function') {
            algoLayout.classList.toggle('notes-toc-collapsed');
            localStorage.setItem('algo_toc_collapsed', algoLayout.classList.contains('notes-toc-collapsed') ? '1' : '0');
            btn.textContent = algoLayout.classList.contains('notes-toc-collapsed') ? '»' : '«';
            return;
        }
        tocAnimating = true;
        if (collapsing) {
            const a = toc.animate(
                [{ transform: 'none', opacity: 1 }, { transform: 'translateX(-120%)', opacity: 0 }],
                TOC_ANIM_OPT
            );
            a.onfinish = () => {
                algoLayout.classList.add('notes-toc-collapsed');
                localStorage.setItem('algo_toc_collapsed', '1');
                btn.textContent = '»';
                tocAnimating = false;
            };
        } else {
            toc.style.transition = 'none';
            toc.style.transform = 'translateX(-120%)';
            toc.style.opacity = '0';
            algoLayout.classList.remove('notes-toc-collapsed');
            void toc.offsetHeight;
            const a = toc.animate(
                [{ transform: 'translateX(-120%)', opacity: 0 }, { transform: 'none', opacity: 1 }],
                TOC_ANIM_OPT
            );
            a.onfinish = () => {
                toc.style.transform = '';
                toc.style.opacity = '';
                toc.style.transition = '';
                localStorage.setItem('algo_toc_collapsed', '0');
                btn.textContent = '«';
                tocAnimating = false;
            };
        }
    }

    /* ---------- 滚动跟随：目录高亮当前小节 + 侧栏自动滚动 ---------- */

    function setupScrollSpy() {
        const links = Array.from(document.querySelectorAll('#algoToc a'));
        const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
        if (!targets.length || typeof IntersectionObserver === 'undefined') return;
        const byId = {};
        links.forEach(a => { byId[a.getAttribute('href').slice(1)] = a; });

        const setActive = (id) => {
            links.forEach(a => a.classList.toggle('active', a === byId[id]));
            const act = byId[id];
            if (act && !algoLayout.classList.contains('notes-toc-collapsed')) {
                const toc = document.getElementById('algoToc');
                /* 只滚侧栏，不用 scrollIntoView（会连页面一起滚） */
                const mid = act.offsetTop - toc.clientHeight / 2 + act.offsetHeight / 2;
                if (mid < toc.scrollTop || mid > toc.scrollTop + toc.clientHeight) {
                    toc.scrollTo({ top: Math.max(0, mid), behavior: 'smooth' });
                }
            }
        };

        const io = new IntersectionObserver((entries) => {
            let best = null;
            for (const e of entries) if (e.isIntersecting) {
                if (!best || e.boundingClientRect.top < best.boundingClientRect.top) best = e;
            }
            if (best) setActive(best.target.id);
        }, { rootMargin: '-70px 0px -55% 0px', threshold: 0 });
        targets.forEach(t => io.observe(t));
    }

    /* ---------- 回到顶部按钮 ---------- */

    const algoTopBtn = document.getElementById('algoTopBtn');
    window.addEventListener('scroll', () => {
        algoTopBtn.hidden = window.scrollY < 600;
    }, { passive: true });

    /* ==================== 划词高亮 + 行级批注（复用笔记/导图页机制） ====================
       锚定：块元素 data-blk（渲染完成后在 DOM 上统一分配），高亮按块内字符偏移，
       批注按块 id；均走 /api/note 持久化（key 用 cn_ 前缀满足 note 路由的科目解析）。
       函数无条件定义（测试 stub 无 api/工具条函数时自然短路），实际调用点带 typeof 守卫。 */
    const ANNO_KEY = 'cn_algo_anno';
    const HL_KEY = 'cn_algo_hl';

        const blkEl = el => el.closest('[data-blk]');
        function inAnno(n) {
            const el = n.nodeType === 1 ? n : n.parentElement;
            return !!(el && el.closest('.line-anno'));
        }
        const hlWalkFilter = { acceptNode: n => inAnno(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT };

        function cleanTextOf(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let t = '', node;
            while ((node = walker.nextNode())) t += node.nodeValue;
            return t;
        }
        function offsetInRoot(root, container, offset) {
            const target = container.nodeType === 3 ? container : (container.childNodes[offset] || null);
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let pos = 0, node;
            while ((node = walker.nextNode())) {
                if (container.nodeType === 3) { if (node === container) return pos + offset; }
                else if (target && (target === node || (target.contains && target.contains(node)))) return pos;
                pos += node.nodeValue.length;
            }
            return pos;
        }
        function wrapRange(root, start, end, cls, ds) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let pos = 0, node;
            const pieces = [];
            while ((node = walker.nextNode())) {
                const len = node.nodeValue.length;
                const ns = pos, ne = pos + len;
                pos = ne;
                if (ne <= start || ns >= end) continue;
                pieces.push({ node, s: Math.max(start, ns) - ns, e: Math.min(end, ne) - ns });
            }
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                const range = document.createRange();
                range.setStart(p.node, p.s);
                range.setEnd(p.node, p.e);
                const span = document.createElement('span');
                span.className = cls;
                if (ds) { span.dataset.start = ds.start; span.dataset.color = ds.color; }
                range.surroundContents(span);
            }
        }

        let hlItems = [];          // [{blk, start, end, color, text}]
        let hlSaveTimer = null;
        let hlToolbar = null;
        let hlMouseupTimer = null;
        const HL_COLORS = ['yellow', 'green', 'blue', 'pink'];

        let annoItems = [];        // [{blk, text, images}]
        let annoSaveTimer = null;
        let annoEditor = null;     // {blk, el, images}

        function initAlgoAnno() {
            // 给渲染好的内容块分配稳定 id：按文档序索引（幂等，重复 init 不漂移，方便重渲染/测试）
            const body = document.getElementById('algoBody');
            body.querySelectorAll('.algo-para, .algo-tbl, .algo-raw, .algo-qa, .algo-code-pair, pre.algo-code').forEach((el, idx) => {
                el.dataset.blk = 'algo-blk-' + (idx + 1);
            });
            body.addEventListener('click', e => {
                const span = e.target.closest && e.target.closest('.note-hl');
                if (span) { e.stopPropagation(); showHlCancelFor(span); }
            });
            body.addEventListener('mouseup', () => {
                clearTimeout(hlMouseupTimer);
                hlMouseupTimer = setTimeout(showHlToolbar, 0);
            });
            document.addEventListener('mousedown', e => {
                if (hlToolbar && !hlToolbar.contains(e.target)) hideHlToolbar();
            });
            loadHighlights();
            loadAnnos();
        }

        function hideHlToolbar() { if (hlToolbar) { hlToolbar.remove(); hlToolbar = null; } }

        function showHlToolbar() {
            if (hlToolbar && hlToolbar.classList.contains('hl-cancel-only')) return;
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.rangeCount) { hideHlToolbar(); return; }
            const range = sel.getRangeAt(0);
            const blk = blkEl(range.startContainer);
            if (!blk || blkEl(range.endContainer) !== blk) { hideHlToolbar(); return; }
            if (inAnno(range.startContainer) || inAnno(range.endContainer)) { hideHlToolbar(); return; }
            hideHlToolbar();
            const rect = range.getBoundingClientRect();
            hlToolbar = document.createElement('div');
            hlToolbar.className = 'hl-toolbar';
            hlToolbar.innerHTML = HL_COLORS.map(c =>
                `<span class="hl-dot hl-dot-${c}" data-color="${c}" title="${c}"></span>`).join('') +
                '<span class="hl-anno-btn" title="批注此块">📝批注</span>' +
                '<span class="hl-cancel" title="取消高亮">✕</span>';
            document.body.appendChild(hlToolbar);
            hlToolbar.style.top = (window.scrollY + rect.top - hlToolbar.offsetHeight - 8) + 'px';
            hlToolbar.style.left = (window.scrollX + rect.left) + 'px';
            hlToolbar.querySelectorAll('.hl-dot').forEach(dot =>
                dot.addEventListener('click', () => applyHighlight(blk, range, dot.dataset.color)));
            hlToolbar.querySelector('.hl-anno-btn').addEventListener('click', () => {
                window.getSelection().removeAllRanges();
                hideHlToolbar();
                openAnnoEditor(blk.dataset.blk);
            });
            hlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
                const span = (range.startContainer.parentElement || range.startContainer).closest
                    ? (range.startContainer.parentElement || range.startContainer).closest('.note-hl') : null;
                if (span) removeHighlight(span);
                hideHlToolbar();
            });
        }

        function showHlCancelFor(span) {
            clearTimeout(hlMouseupTimer);
            hideHlToolbar();
            const rect = span.getBoundingClientRect();
            hlToolbar = document.createElement('div');
            hlToolbar.className = 'hl-toolbar hl-cancel-only';
            hlToolbar.innerHTML = '<span class="hl-cancel" title="取消高亮">✕ 取消高亮</span>';
            document.body.appendChild(hlToolbar);
            hlToolbar.style.top = (window.scrollY + rect.top - hlToolbar.offsetHeight - 8) + 'px';
            hlToolbar.style.left = (window.scrollX + rect.left) + 'px';
            hlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
                removeHighlight(span);
                hideHlToolbar();
            });
        }

        function applyHighlight(blk, range, color) {
            const root = blk;
            const start = offsetInRoot(root, range.startContainer, range.startOffset);
            const end = offsetInRoot(root, range.endContainer, range.endOffset);
            if (end <= start) { hideHlToolbar(); return; }
            const text = range.toString();
            const id = blk.dataset.blk;
            hlItems.push({ blk: id, start, end, color, text });
            wrapRange(root, start, end, 'note-hl note-hl-' + color, { start, color });
            window.getSelection().removeAllRanges();
            hideHlToolbar();
            saveHl();
        }

        function removeHighlight(span) {
            const blk = span.closest('[data-blk]');
            const start = +span.dataset.start;
            const color = span.dataset.color;
            const id = blk.dataset.blk;
            hlItems = hlItems.filter(it => !(it.blk === id && it.start === start && it.color === color));
            span.closest('[data-blk]').querySelectorAll('.note-hl').forEach(s => {
                if (+s.dataset.start === start && s.dataset.color === color) {
                    const parent = s.parentNode;
                    while (s.firstChild) parent.insertBefore(s.firstChild, s);
                    parent.removeChild(s);
                    parent.normalize();
                }
            });
            saveHl();
        }

        function saveHl() {
            clearTimeout(hlSaveTimer);
            hlSaveTimer = setTimeout(async () => {
                try {
                    await api('/api/note/' + encodeURIComponent(HL_KEY), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: JSON.stringify(hlItems), images: [] })
                    });
                } catch (e) { /* 高亮保存失败静默 */ }
            }, 500);
        }

        function reapplyHighlights() {
            const retained = [];
            document.querySelectorAll('[data-blk]').forEach(el => {
                const id = el.dataset.blk;
                const list = hlItems.filter(it => it.blk === id);
                if (!list.length) return;
                const full = cleanTextOf(el);
                list.sort((a, b) => a.start - b.start);
                for (const it of list) {
                    let { start, end } = it;
                    if (full.slice(start, end) !== it.text) {
                        const idx = full.indexOf(it.text);
                        if (idx < 0 || !it.text) continue;
                        start = idx; end = idx + it.text.length;
                    }
                    wrapRange(el, start, end, 'note-hl note-hl-' + it.color, { start, color: it.color });
                    retained.push({ blk: id, start, end, color: it.color, text: it.text });
                }
            });
            hlItems = retained;
        }

        async function loadHighlights() {
            if (typeof api !== 'function') return;
            let items = [];
            try {
                const resp = await api('/api/note/' + encodeURIComponent(HL_KEY));
                const d = await resp.json();
                items = d.note ? JSON.parse(d.note) : [];
            } catch (e) { return; }
            if (!Array.isArray(items) || !items.length) return;
            hlItems = items.filter(it => it && typeof it.blk === 'string');
            reapplyHighlights();
        }

        // ---------- 批注 ----------
        const annoOf = id => annoItems.find(a => a.blk === id);

        function annoBlockEl(id) {
            return document.querySelector(`.line-anno-block[data-blk="${CSS.escape(id)}"]`);
        }
        function viewAnnoImage(id, i) {
            const item = annoOf(id);
            if (!item || !item.images) return;
            const src = item.images[i];
            if (!src) return;
            const ov = document.createElement('div');
            ov.className = 'img-lightbox';
            ov.innerHTML = `<img src="${src}" alt="批注图片">`;
            ov.onclick = () => ov.remove();
            document.body.appendChild(ov);
        }
        function annoBlockHtml(id) {
            const item = annoOf(id);
            if (!item) return '';
            const imgs = (item.images || []).map((src, i) =>
                `<img class="line-anno-img" src="${src}" alt="批注图片" onclick="viewAlgoAnnoImg('${id}', ${i})">`).join('');
            const textHtml = item.text ? (isHtmlNote(item.text) ? sanitizeNoteHtml(item.text) : esc(item.text)) : '';
            return `<div class="line-anno line-anno-block" data-blk="${CSS.escape(id)}">
                <span class="line-anno-icon">📝</span>
                <div class="line-anno-body">
                    ${item.text ? `<div class="line-anno-text">${textHtml}</div>` : ''}
                    ${imgs}
                </div>
                <div class="line-anno-ops">
                    <button type="button" class="line-anno-op" onclick="openAlgoAnnoEditor('${id}')">改</button>
                    <button type="button" class="line-anno-op line-anno-del" onclick="delAlgoAnno('${id}')">删</button>
                </div>
            </div>`;
        }
        function isHtmlNote(s) { return /<[a-zA-Z][^>]*>/.test(s || ''); }
        function sanitizeNoteHtml(s) { return s || ''; }

        function openAnnoEditor(id) {
            closeAnnoEditor();
            const blk = document.querySelector(`[data-blk="${CSS.escape(id)}"]`);
            if (!blk) return;
            const item = annoOf(id);
            const el = document.createElement('div');
            el.className = 'line-anno line-anno-editor';
            el.innerHTML = `
                ${noteToolbarHtml()}
                <div class="note-input line-anno-input" contenteditable="true" spellcheck="false"
                    data-placeholder="写批注，可 Ctrl+V 粘贴截图…"></div>
                <div class="note-images line-anno-editor-imgs"></div>
                <div class="line-anno-bar">
                    <button type="button" class="btn btn-primary line-anno-save">保存</button>
                    <button type="button" class="btn btn-secondary line-anno-cancel">取消</button>
                </div>`;
            annoEditor = { blk: id, el, images: item ? (item.images || []).slice() : [] };
            const blkEl2 = annoBlockEl(id);
            if (blkEl2) blkEl2.style.display = 'none';
            blk.insertAdjacentElement('afterend', el);
            const input = el.querySelector('.line-anno-input');
            loadNoteIntoEditor(input, item ? (item.text || '') : '');
            updateNotePlaceholder(input);
            renderEditorImages();
            input.addEventListener('paste', pasteAnnoImage);
            bindNoteToolbar(input);
            el.querySelector('.line-anno-save').addEventListener('click', saveAnnoEditor);
            el.querySelector('.line-anno-cancel').addEventListener('click', () => closeAnnoEditor());
            input.focus();
        }
        function closeAnnoEditor() {
            if (!annoEditor) return;
            const blkEl2 = annoBlockEl(annoEditor.blk);
            if (blkEl2) blkEl2.style.display = '';
            annoEditor.el.remove();
            annoEditor = null;
        }
        function renderEditorImages() {
            if (!annoEditor) return;
            const box = annoEditor.el.querySelector('.line-anno-editor-imgs');
            box.innerHTML = annoEditor.images.map((src, i) => `
                <div class="note-img-item">
                    <img src="${src}" alt="批注图片">
                    <span class="note-img-del" data-i="${i}" title="删除图片">×</span>
                </div>`).join('');
            box.querySelectorAll('.note-img-del').forEach(d => d.onclick = () => {
                annoEditor.images.splice(+d.dataset.i, 1);
                renderEditorImages();
            });
        }
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(img.src);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = URL.createObjectURL(file);
            });
        }
        async function pasteAnnoImage(event) {
            if (!annoEditor) return;
            const files = [...(event.clipboardData ? event.clipboardData.items : [])]
                .filter(it => it.type.startsWith('image/'))
                .map(it => it.getAsFile())
                .filter(Boolean);
            if (!files.length) return;
            event.preventDefault();
            try {
                for (const f of files) annoEditor.images.push(await compressImage(f));
            } catch (e) { alert(e.message); }
            renderEditorImages();
        }
        function saveAnnoEditor() {
            if (!annoEditor) return;
            const id = annoEditor.blk;
            const text = serializeNote(annoEditor.el.querySelector('.line-anno-input'));
            const images = annoEditor.images;
            annoItems = annoItems.filter(a => a.blk !== id);
            if (text || images.length) annoItems.push({ blk: id, text, images });
            annoEditor.el.remove();
            annoEditor = null;
            renderAnnos();
            saveAnnos();
        }
        function delAnno(id) {
            if (!confirm('删除这条批注？')) return;
            annoItems = annoItems.filter(a => a.blk !== id);
            renderAnnos();
            saveAnnos();
        }
        function saveAnnos() {
            clearTimeout(annoSaveTimer);
            annoSaveTimer = setTimeout(async () => {
                try {
                    await api('/api/note/' + encodeURIComponent(ANNO_KEY), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: JSON.stringify(annoItems), images: [] })
                    });
                } catch (e) { /* 静默 */ }
            }, 300);
        }
        function renderAnnos() {
            document.querySelectorAll('.algo-body .line-anno-block').forEach(b => b.remove());
            document.querySelectorAll('[data-blk]').forEach(el => {
                if (annoOf(el.dataset.blk)) el.insertAdjacentHTML('afterend', annoBlockHtml(el.dataset.blk));
            });
        }
        async function loadAnnos() {
            if (typeof api !== 'function') return;
            let items = [];
            try {
                const resp = await api('/api/note/' + encodeURIComponent(ANNO_KEY));
                const d = await resp.json();
                items = d.note ? JSON.parse(d.note) : [];
            } catch (e) { return; }
            if (!Array.isArray(items) || !items.length) return;
            annoItems = items.filter(it => it && typeof it.blk === 'string');
            renderAnnos();
        }

        window.viewAlgoAnnoImg = viewAnnoImage;
        window.openAlgoAnnoEditor = openAnnoEditor;
        window.delAlgoAnno = delAnno;

    /* 渲染完成后才分配块锚点并加载已存高亮/批注（api 缺失的测试环境短路） */
    function initAlgoAnnoIfReady() {
        if (typeof api !== 'function') return;
        loadAlgo().then(() => initAlgoAnno());
    }
    initAlgoAnnoIfReady();
    </script>
</body>
</html>
