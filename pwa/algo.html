<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法讲义 · 做题方法 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="daka.html" class="nav-link">强化打卡</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="code.html" class="nav-link">代码题</a>
                <a href="algo.html" class="nav-link active">算法讲义</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>📘 算法讲义 · 知识点与做题方法</h1>
            <p id="algoMeta">加载中…</p>
        </div>

        <div class="ol-layout">
            <aside class="ol-nav" id="algoNav"></aside>
            <button class="ol-nav-tab" id="algoNavTab" onclick="toggleAlgoNav()" title="展开目录">☰ 目录</button>
            <div class="question-list" id="algoBody">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </main>

    <button class="ol-nav-fab" id="algoNavFab" onclick="openAlgoNav()" title="打开目录">☰ 目录</button>
    <div class="ol-nav-mask" id="algoNavMask" onclick="closeAlgoNav()"></div>

    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script>
    /* 讲义方法论知识库：data/algo_notes.json（懒加载，不进主包预缓存）
       内容一字未改，仅还原排版结构：标题层级 / 代码块 / 表格 */

    const NBSP = /\u00a0/g;
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let anchorSeq = 0;

    /** 段落里若每行都含 ' | '，视为表格（讲义的做题思路表等） */
    function renderText(raw) {
        const text = String(raw || '').replace(NBSP, ' ');
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        const tableLike = lines.length >= 2 && lines.every(l => l.indexOf('|') >= 0);
        if (tableLike) {
            const rows = lines.map(l => l.split('|').map(c => c.trim()));
            const head = rows[0], body = rows.slice(1);
            return '<table class="sol-score algo-tbl">' +
                '<tr>' + head.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>' +
                body.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') +
                '</table>';
        }
        return `<div class="algo-para">${esc(text)}</div>`;
    }

    function renderItems(items) {
        let html = '';
        for (const it of items) {
            if (it.t === 'h') {
                const lvl = Math.min(6, Math.max(3, it.lvl || 3));
                anchorSeq++;
                const id = 'sec-' + anchorSeq;
                it._id = id;                       // 供目录生成后回填
                html += `<h${lvl} class="algo-h" id="${id}" data-anchor="${id}">${esc(it.text)}</h${lvl}>`;
            } else if (it.t === 'code') {
                html += `<pre class="code-block algo-code">${esc(String(it.text || '').replace(NBSP, ' '))}</pre>`;
            } else {
                html += renderText(it.text);
            }
        }
        return html;
    }

    function buildNav(chapters) {
        let html = '<div class="ol-nav-head" onclick="toggleAlgoNav()">目录<span class="ol-nav-toggle">«</span></div>';
        for (const c of chapters) {
            const subs = c.items.filter(x => x.t === 'h');
            html += `<div class="ol-nav-chapter">${esc(c.title)}</div>`;
            for (const s of subs) {
                if (!s._id) continue;
                const indent = (s.lvl || 3) - 3;
                html += `<a class="ol-nav-link algo-nav-link" style="padding-left:${10 + indent * 12}px" ` +
                        `href="#${s._id}" onclick="closeAlgoNav()">${esc(s.text)}</a>`;
            }
        }
        return html;
    }

    async function loadAlgo() {
        const body = document.getElementById('algoBody');
        let data;
        try {
            const resp = await fetch('data/algo_notes.json');
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            data = await resp.json();
        } catch (e) {
            body.innerHTML = `<div class="loading">讲义加载失败：${esc(e.message)}<br>请检查网络后刷新重试。</div>`;
            return;
        }

        const meta = data.meta || {};
        document.getElementById('algoMeta').textContent =
            `${meta.source || ''}　·　方法论部分（共 ${meta.pages || '?'} 页）　·　${meta.note || ''}`;

        let html = '';
        for (const c of data.chapters) {
            html += `<section class="algo-chapter"><h2 class="algo-h2">${esc(c.title)}</h2>` +
                    renderItems(c.items) + '</section>';
        }
        body.innerHTML = html;
        document.getElementById('algoNav').innerHTML = buildNav(data.chapters);
    }

    /* 目录展开/收起（与代码题页同款交互） */
    function toggleAlgoNav() {
        document.getElementById('algoNav').classList.toggle('open');
        document.getElementById('algoNavMask').classList.toggle('open');
    }
    function openAlgoNav() {
        document.getElementById('algoNav').classList.add('open');
        document.getElementById('algoNavMask').classList.add('open');
    }
    function closeAlgoNav() {
        document.getElementById('algoNav').classList.remove('open');
        document.getElementById('algoNavMask').classList.remove('open');
    }

    loadAlgo();
    </script>
</body>
</html>
