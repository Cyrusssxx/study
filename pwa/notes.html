        </div>
        <div class="notes-layout" id="notesLayout">
            <button class="notes-toc-toggle" id="notesTocToggle" onclick="toggleNotesToc()" title="收起/展开目录" aria-label="收起/展开目录">«</button>
            <aside class="notes-toc" id="notesToc"></aside>
            <div class="notes-content" id="notesContent"></div>
        </div>
        <button class="notes-top-btn" id="notesTopBtn" title="回到开头" hidden
            onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">↑</button>
    </main>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
        // PWA 版：客户端 fetch 笔记 JSON 渲染（Flask 版为服务端 Jinja 渲染的镜像）
        const _params = new URLSearchParams(location.search);
        const SUBJECT = _params.get('subject') || 'co';
        const GOTO = _params.get('goto');
        const LINE = _params.get('line');   // 跳到该节第 N 行（data-line）
        const Q = _params.get('q');         // 关键词/题干片段：节内(+全局兜底)模糊定位最相关的小知识点并高亮
        // 笔记批注 / 高亮持久化走现有笔记链路（api() 拦截 IndexedDB）
        const noteApi = (url, opts) => api(url, opts);

        // 左侧目录可收起（状态持久化）
        const notesLayout = document.getElementById('notesLayout');
        if (localStorage.getItem('notes_toc_collapsed') === '1') {
            notesLayout.classList.add('notes-toc-collapsed');
            document.getElementById('notesTocToggle').textContent = '»';
        }
        // 目录收起/展开：用 Web Animations API（transform+opacity，合成器属性）驱动动画，
        // 动画帧零布局重排（避免 width 动画导致长文档每帧 reflow 卡顿）；
        // 宽度归零/恢复在动画结束帧一次性完成（单帧布局，视觉无感）。
        const TOC_ANIM_OPT = { duration: 180, easing: 'ease' };
        let tocAnimating = false; // 动画进行中忽略重复点击，避免动画叠加错乱
        function toggleNotesToc() {
            if (tocAnimating) return;
            const toc = document.getElementById('notesToc');
            const collapsing = !notesLayout.classList.contains('notes-toc-collapsed');
            const btn = document.getElementById('notesTocToggle');
            // 老浏览器无 WAAPI 时回退：直接切换（无动画）
            if (typeof toc.animate !== 'function') {
                const done = () => {
                    notesLayout.classList.toggle('notes-toc-collapsed');
                    localStorage.setItem('notes_toc_collapsed', notesLayout.classList.contains('notes-toc-collapsed') ? '1' : '0');
                    btn.textContent = notesLayout.classList.contains('notes-toc-collapsed') ? '»' : '«';
                };
                done();
                return;
            }
            tocAnimating = true;
            if (collapsing) {
                // ① 滑出 + 淡出（transform/opacity，合成器属性，动画帧零重排；动画期间目录仍占位，内容区不动）
                const a = toc.animate(
                    [{ transform: 'none', opacity: 1 }, { transform: 'translateX(-120%)', opacity: 0 }],
                    TOC_ANIM_OPT
                );
                // ② 动画结束后：宽度归零（单帧一次 reflow）+ 持久化
                a.onfinish = () => {
                    notesLayout.classList.add('notes-toc-collapsed');
                    localStorage.setItem('notes_toc_collapsed', '1');
                    btn.textContent = '»';
                    tocAnimating = false;
                };
            } else {
                // ① 先把目录藏到左侧（不可见），再恢复占位宽度，避免闪烁
                toc.style.transition = 'none';
                toc.style.transform = 'translateX(-120%)';
                toc.style.opacity = '0';
                notesLayout.classList.remove('notes-toc-collapsed');
                void toc.offsetHeight; // 强制应用隐藏起点
                // ② 滑入 + 淡入
                const a = toc.animate(
                    [{ transform: 'translateX(-120%)', opacity: 0 }, { transform: 'none', opacity: 1 }],
                    TOC_ANIM_OPT
                );
                a.onfinish = () => {
                    toc.style.transform = '';
                    toc.style.opacity = '';
                    toc.style.transition = '';
                    localStorage.setItem('notes_toc_collapsed', '0');
                    btn.textContent = '«';
                    tocAnimating = false;
                };
            }
        }

        // 题目旧 section 名（王道）→ 笔记新 section 名（袁书/新版）映射表
        const SEC_ALIASES = {
            // 计组（CO）映射
            "1.2 计算机系统层次结构": "1.3 计算机系统层次结构",
            "1.3 计算机的性能指标": "1.2 计算机系统的基本组成",
            "2.1 数制与编码": "2.1 数制和编码",
            "2.2 运算方法和运算电路": "3.2 定点数运算",
            "2.3 浮点数的表示与运算": "2.3 浮点数表示与运算",
            "3.1 存储器概述": "7.1 存储器层次结构概述",
            "3.2 主存储器": "7.2 主存储器",
            "3.3 主存储器与CPU的连接": "7.2 主存储器",
            "3.4 外部存储器": "8.4 外部存储器",
            "3.5 高速缓冲存储器": "7.3 高速缓冲存储器(Cache)",
            "3.6 虚拟存储器": "7.4 虚拟存储器",
            "4.1 指令系统": "4.1 指令格式和指令系统",
            "4.2 指令的寻址方式": "4.2 指令寻址方式",
            "4.3 程序的机器级代码表示": "4.3 程序的机器级代码表示",
            "4.4 CISC和RISC的基本概念": "4.4 指令集结构设计",
            "5.1 CPU的功能和基本结构": "5.1 CPU的基本组成",
            "5.2 指令执行过程": "5.3 指令执行过程",
            "5.3 数据通路的功能和基本结构": "5.2 数据通路",
            "5.4 控制器的功能和工作原理": "5.4 控制单元",
            "5.5 异常和中断机制": "8.3 I/O控制方式",
            "5.6 指令流水线": "6.1 流水线概念与分类",
            "5.7 多处理器的基本概念": "9.2 多处理器系统",
            "6.1 总线概述": "8.2 总线",
            "6.2 总线事务和定时": "8.2 总线",
            "7.1 I/O系统基本概念": "8.1 系统互连及I/O系统概述",
            "7.2 I/O接口": "8.1 系统互连及I/O系统概述",
            "7.3 I/O方式": "8.3 I/O控制方式",
            // 计算机网络（CN）映射
            "4.7 网络层设备": "4.8 本章小结及疑难点",
            // 操作系统（OS）映射
            "1.1 操作系统的基本概念": "1.2 操作系统发展历程",
            "2.1 进程与线程简介": "2.2 CPU调度",
            "71.3 文件系统": "4.3 文件系统的实现",
        };

        // 章节名含 / 等字符，锚点定位统一走 data-sec 属性匹配，不用 id 选择器
        // 支持：1) 精确匹配 2) 别名映射（旧section→新section）3) 编号前缀模糊匹配 4) 关键词兜底
        // 匹配范围含小节(.notes-sub)，节名跳节容器、小节名跳小节容器
        function jumpTo(name, highlight) {
            const sections = Array.from(document.querySelectorAll('.notes-section, .notes-sub'));
            const tocLinks = Array.from(document.querySelectorAll('.notes-toc-sec, .notes-toc-sub'));

            // 0) 别名映射转换（题目旧名 → 笔记新名）
            const mapped = SEC_ALIASES[name] || name;

            // 1) 精确匹配（先匹配原名，再匹配映射名）
            let target = sections.find(s => s.dataset.sec === name)
                      || sections.find(s => s.dataset.sec === mapped);

            // 2) 按编号前缀模糊匹配
            if (!target) {
                const numMatch = (mapped || name).match(/^(\d+\.\d+)/);
                if (numMatch) {
                    const prefix = numMatch[1];
                    const candidates = sections.filter(s => s.dataset.sec.startsWith(prefix));
                    if (candidates.length === 1) {
                        target = candidates[0];
                    } else if (candidates.length > 1) {
                        const titleKw = (mapped || name).replace(/^(\d+\.\d+\s*)+/, '').replace(/[的与及和和或]+/g, ' ').trim().split(/\s+/).filter(w => w.length > 1);
                        let bestScore = 0;
                        for (const c of candidates) {
                            const secTitle = c.dataset.sec.replace(/^\d+\.\d+\s*/, '');
                            let score = 0;
                            for (const kw of titleKw) {
                                if (secTitle.includes(kw)) score += kw.length;
                            }
                            if (score > bestScore) { bestScore = score; target = c; }
                        }
                        if (bestScore === 0) target = candidates[0];
                    }
                }
            }

            // 3) 关键词兜底匹配
            if (!target) {
                const kw = (mapped || name).replace(/^\d+\.[\d\s]*/, '').trim();
                if (kw.length >= 2) {
                    target = sections.find(s => s.dataset.sec.includes(kw));
                }
            }

            if (!target) return;
            expandTocSec(target.dataset.sec);   // 跳到节/小节时确保其节列表展开
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            tocLinks.forEach(l => l.classList.toggle('active', l.dataset.sec === target.dataset.sec));
            // 目录侧栏跟随：收起则展开；高亮项滚动到目录可视区中部
            const layout = document.getElementById('notesLayout');
            if (layout && layout.classList.contains('notes-toc-collapsed')) {
                layout.classList.remove('notes-toc-collapsed');
                const tbtn = document.getElementById('notesTocToggle');
                if (tbtn) tbtn.textContent = '«';
                localStorage.setItem('notes_toc_collapsed', '0');
            }
            requestAnimationFrame(() => {
                const actLink = document.querySelector('.notes-toc-sec.active, .notes-toc-sub.active');
                const toc = document.getElementById('notesToc');
                if (!actLink || !toc) return;
                const tr = toc.getBoundingClientRect(), lr = actLink.getBoundingClientRect();
                if (lr.top < tr.top + 8 || lr.bottom > tr.bottom - 8)
                    toc.scrollTop += lr.top - tr.top - tr.height / 2 + lr.height;
            });
            if (highlight) {
                target.classList.remove('goto-highlight');
                void target.offsetWidth;
                target.classList.add('goto-highlight');
            }
        }

        // ---------- 目录小节列表：展开/收起 + 状态记忆 ----------
        let tocSecState = {};
        try { tocSecState = JSON.parse(localStorage.getItem('notes_toc_sec') || '{}'); } catch (e) { tocSecState = {}; }
        function saveTocSecState() {
            try { localStorage.setItem('notes_toc_sec', JSON.stringify(tocSecState)); } catch (e) { }
        }
        function toggleTocSec(link) {
            const box = link.nextElementSibling;
            if (!box || !box.classList.contains('notes-toc-subs')) return;
            const collapsed = box.classList.toggle('collapsed');
            link.classList.toggle('collapsed', collapsed);
            tocSecState[link.dataset.sec] = collapsed;
            saveTocSecState();
        }
        function expandTocSec(secName) {
            // 目标是节：展开其小节列表；目标是小节：反查其所属节再展开
            let secKey = secName;
            const subEl = document.querySelector(`.notes-sub[data-sec="${CSS.escape(secName)}"]`);
            if (subEl) {
                const secEl = subEl.closest('.notes-section');
                if (secEl) secKey = secEl.dataset.sec;
            }
            const link = document.querySelector(`.notes-toc-sec[data-sec="${CSS.escape(secKey)}"]`);
            if (!link || !link.dataset.hassub) return;
            const box = link.nextElementSibling;
            if (box && box.classList.contains('collapsed')) {
                box.classList.remove('collapsed');
                link.classList.remove('collapsed');
                delete tocSecState[secKey];
                saveTocSecState();
            }
        }
        function initTocSecStates() {
            document.querySelectorAll('.notes-toc-sec[data-hassub]').forEach(link => {
                if (tocSecState[link.dataset.sec]) {
                    const box = link.nextElementSibling;
                    if (box) box.classList.add('collapsed');
                    link.classList.add('collapsed');
                }
            });
        }

        // 仅按名称解析出 section/subsection 元素（供细粒度跳转复用 jumpTo 的匹配逻辑）
        function resolveSectionEl(name) {
            const sections = Array.from(document.querySelectorAll('.notes-section, .notes-sub'));
            const mapped = SEC_ALIASES[name] || name;
            let target = sections.find(s => s.dataset.sec === name)
                          || sections.find(s => s.dataset.sec === mapped);
            if (!target) {
                const numMatch = (mapped || name).match(/^(\d+\.\d+)/);
                if (numMatch) {
                    const prefix = numMatch[1];
                    const candidates = sections.filter(s => s.dataset.sec.startsWith(prefix));
                    if (candidates.length === 1) {
                        target = candidates[0];
                    } else if (candidates.length > 1) {
                        const titleKw = (mapped || name).replace(/^(\d+\.\d+\s*)+/, '').replace(/[的与及和和或]+/g, ' ').trim().split(/\s+/).filter(w => w.length > 1);
                        let bestScore = 0;
                        for (const c of candidates) {
                            const secTitle = c.dataset.sec.replace(/^\d+\.\d+\s*/, '');
                            let score = 0;
                            for (const kw of titleKw) if (secTitle.includes(kw)) score += kw.length;
                            if (score > bestScore) { bestScore = score; target = c; }
                        }
                        if (bestScore === 0) target = candidates[0];
                    }
                }
            }
            if (!target) {
                const kw = (mapped || name).replace(/^\d+\.[\d\s]*/, '').trim();
                if (kw.length >= 2) target = sections.find(s => s.dataset.sec.includes(kw));
            }
            return target || null;
        }

        // 跳到该节内的具体某一行（data-line），并闪烁高亮
        function jumpToLine(secName, lineNo) {
            const sec = resolveSectionEl(secName);
            if (!sec) return false;
            const el = sec.querySelector('.anno-line[data-line="' + lineNo + '"]');
            if (!el) return false;
            el.scrollIntoView({ block: 'center', behavior: 'smooth' });
            const tsec = sec.dataset.sec;
            el.classList.add('locate-flash');
            setTimeout(() => el.classList.remove('locate-flash'), 1800);
            document.querySelectorAll('.notes-toc-sec').forEach(l => l.classList.toggle('active', l.dataset.sec === tsec));
            return true;
        }

        // 关键词/题干片段 → 定位到最相关的小知识点行（细粒度跳转）
        // 策略：在「题目所属节」内优先定位；节内无命中才全局兜底。
        // 评分 = 题干与笔记行共享的「稀有长字串」加权求和（IDF），天然压低
        //       "下列关于…的叙述中，正确的是"等通用套话；例题题干行降权。
        // strict=true 时仅限节内匹配（从 quiz 📖 链接进入用），
        //   防止通用题干在别的节碰巧高分→跳到"奇怪的地方"
        let _bgCache = null;
        function bgIndex() {
            if (_bgCache) return _bgCache;
            const lines = Array.from(document.querySelectorAll('.notes-content .anno-line'));
            const N = lines.length;
            const df = {};
            const recs = lines.map(el => {
                const t = cleanTextOf(el).toLowerCase();
                const grams = new Set();
                for (let ln = 2; ln <= 5; ln++)            // 2~5 字子串语料，计算文档频率
                    for (let i = 0; i + ln <= t.length; i++) grams.add(t.slice(i, i + ln));
                for (const g of grams) df[g] = (df[g] || 0) + 1;
                const isEx = /^(?:[（(]?\s*)?(?:例\s*[0-9０-９]+|例题|经典例题|经典题|典例演算)/.test(t)
                            || /的叙述中，正确的是/.test(t) || /下列关于/.test(t);
                return { el, t, grams, isEx };
            });
            _bgCache = { N, df, recs };
            return _bgCache;
        }
        function _scoreLine(q, rec, N, df) {
            const ql = String(q).toLowerCase();
            if (ql.length < 2) return { score: 0, hits: 0 };
            const matched = new Set();
            for (let ln = 5; ln >= 2; ln--)               // 先长后短，去重收集题干与行共享的子串
                for (let i = 0; i + ln <= ql.length; i++) {
                    const sub = ql.slice(i, i + ln);
                    if (rec.grams.has(sub)) matched.add(sub);
                }
            let score = 0, hits = 0;
            const rareTh = Math.max(3, N * 0.02);
            for (const sub of matched) {
                if (sub.length < 2) continue;
                const d = df[sub] || 0;
                if (!(sub.length >= 3 || d <= rareTh)) continue;   // 仅奖励较长或稀有的字串
                score += sub.length * Math.log((N + 1) / (d + 1));  // IDF 加权
                hits++;
            }
            if (ql && rec.t.indexOf(ql) >= 0) score += 8;          // 整句命中再加成
            return { score, hits };
        }
        function gotoSpecific(q, preferSecEl, strict) {
            const idx = bgIndex();
            const N = idx.N, df = idx.df;
            let bestIn = null, bestInScore = -1, bestInLen = 1e9;
            let bestGl = null, bestGlScore = -1, bestGlLen = 1e9;
            for (const rec of idx.recs) {
                const r = _scoreLine(q, rec, N, df);
                if (!r.hits) continue;
                let sc = r.score;
                if (rec.isEx) sc *= 0.4;                          // 例题题干行降权
                if (sc > bestGlScore || (sc === bestGlScore && rec.t.length < bestGlLen)) {
                    bestGlScore = sc; bestGl = rec.el; bestGlLen = rec.t.length;
                }
                if (preferSecEl && preferSecEl.contains(rec.el)) {
                    if (sc > bestInScore || (sc === bestInScore && rec.t.length < bestInLen)) {
                        bestInScore = sc; bestIn = rec.el; bestInLen = rec.t.length;
                    }
                }
            }
            const target = strict ? bestIn : (bestIn || bestGl);   // strict: 禁止全局兜底，防跳到别的节
            if (!target) return false;
            const tsec = target.closest('.notes-section');
            const tsub = target.closest('.notes-sub');             // 命中行所属小节（题目跳转精准到小章节）
            if (tsub) expandTocSec(tsub.dataset.sec);
            else if (tsec) expandTocSec(tsec.dataset.sec);
            target.scrollIntoView({ block: 'center', behavior: 'smooth' });
            target.classList.add('locate-flash');
            setTimeout(() => target.classList.remove('locate-flash'), 1800);
            const hlName = tsub ? tsub.dataset.sec : (tsec ? tsec.dataset.sec : '');
            if (hlName) document.querySelectorAll('.notes-toc-sec, .notes-toc-sub').forEach(l =>
                l.classList.toggle('active', l.dataset.sec === hlName));
            return true;
        }

        // ---------- 笔记排版优化：序号分行 / 例题卡片 ----------
        const ENUM_MARK = '[①②③④⑤⑥⑦⑧⑨⑩⑪⑫]';
        const SPLIT_RE = new RegExp(
            '^(?=' + ENUM_MARK + ')|' +
            '(?<=^|[\\s\\u3000：；。，、！？:;])' +
            '(?=' + ENUM_MARK + '|（\\d+）|\\(\\d+\\)|\\d{1,2}(?:[.、．](?![0-9])))'
        );
        // ---------- 例题卡片辅助：识别前缀、吸收解答步骤、校正碎 <b> ----------
        function stripTags(s) { return (s || '').replace(/<[^>]*>/g, ''); }

        function isExampleOpener(pHtml) {
            const text = stripTags(pHtml).trim();
            return /^(?:【\s*)?(?:例题\s*(?:[0-9０-９]+|[一二三四五六七八九十])?|经典例题\s*(?:[0-9０-９]+|[①-⑫])?|经典题|典例演算|例\s*[0-9０-９]+)/.test(text);
        }

        function isSolutionPara(pHtml) {
            const text = stripTags(pHtml).trim();
            if (!text) return false;
            return /^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫]|^（[0-9０-９]+）|^\([0-9０-９]+\)|^解[：:]/.test(text);
        }

        function fmtExampleText(s) {
            return (s || '').replace(/<\/?b>/g, '')
                .replace(/([A-EＡ-Ｅ])\s*([.．、])(?=\s*[^\s<])/g, '<br>$1$2');
        }

        function buildExampleCard(parts) {
            const first = parts[0];
            const nm = stripTags(first).match(/^(?:【\s*)?(例题|经典例题|经典题|典例演算|例)\s*([0-9０-９]+|[一二三四五六七八九十]|[①-⑫])?/);
            const num = nm ? (nm[1] === '例' ? '例' + (nm[2] || '') : nm[1] + (nm[2] || '')) : '例题';
            let rest = first.replace(/^\s*<p\b[^>]*>\s*(?:<b[^>]*>\s*)?/, '');
            const bracketed = /^【/.test(rest);
            rest = rest.replace(/^(?:【\s*)?(?:例题\s*(?:[0-9０-９]+|[一二三四五六七八九十])?|经典例题\s*(?:[0-9０-９]+|[①-⑫])?|经典题|典例演算|例\s*[0-9０-９]+)\s*/, '');
            rest = bracketed
                ? rest.replace(/^[^】]*】/, '')
                : rest.replace(/^[·:：、]?\s*/, '');
            rest = rest.replace(/<\/p>\s*$/, '');
            let year = '';
            const ym = rest.match(/【[^】]*】/);
            if (ym) {
                year = '<span class="note-example-year">' + ym[0] + '</span>';
                rest = rest.replace(/\s*【[^】]*】/, '');
            }
            let expl = '';
            const explIdx = rest.search(/(?:推理|解析)[：:]/);
            if (explIdx >= 0) {
                expl = rest.slice(explIdx);
                rest = rest.slice(0, explIdx);
            }
            const ansify = s => s
                .replace(/<b>(选[A-EＡ-Ｅ])<\/b>/g, '$1')
                .replace(/(选)([A-EＡ-Ｅ])/g, '<b class="note-ans">$1$2</b>');
            const stem = fmtExampleText(rest);
            expl = ansify(fmtExampleText(expl));
            const steps = parts.slice(1).map(p => {
                const s = p.replace(/^\s*<p(?:\s+[^>]*)?>\s*/, '').replace(/\s*<\/p>\s*$/, '');
                const step = ansify(fmtExampleText(s));
                if (!step.trim()) return '';
                return '<p class="note-example-step">' + step + '</p>';
            }).join('');
            return '<div class="note-example">'
                + '<div class="note-example-head"><span class="note-example-num">' + num + '</span>'
                + year + '</div>'
                + '<p class="note-example-stem">' + stem + '</p>'
                + (expl ? '<p class="note-example-expl">' + expl + '</p>' : '')
                + (steps ? '<div class="note-example-steps">' + steps + '</div>' : '')
                + '</div>';
        }

        function wrapExamples(html) {
            const tokens = [];
            const pRe = /<p(?:\s+[^>]*)?>[\s\S]*?<\/p>/g;
            let last = 0, m;
            while ((m = pRe.exec(html))) {
                if (m.index > last) tokens.push(html.slice(last, m.index));
                tokens.push(m[0]);
                last = m.index + m[0].length;
            }
            if (last < html.length) tokens.push(html.slice(last));
            let out = '';
            for (let i = 0; i < tokens.length; i++) {
                const t = tokens[i];
                const isP = /^<p/.test(t) && /<\/p>$/.test(t);
                if (isP && isExampleOpener(t)) {
                    const parts = [t];
                    let j = i + 1;
                    while (j < tokens.length && /^<p/.test(tokens[j]) && /<\/p>$/.test(tokens[j])
                           && isSolutionPara(tokens[j]) && !isExampleOpener(tokens[j])) {
                        parts.push(tokens[j]);
                        j++;
                    }
                    out += buildExampleCard(parts);
                    i = j - 1;
                } else {
                    out += t;
                }
            }
            return out;
        }

        function fmtNotes(html) {
            if (!html) return html;
            // 1) 内联序号（①②…、1.…、（1）…）单独成行
            html = html.replace(/<p>[\s\S]*?<\/p>/g, pt => {
                const inner = pt.slice(3, -4);
                if (!SPLIT_RE.test(inner)) return pt;
                const parts = inner.split(SPLIT_RE);
                let out = '', carry = '';
                parts.forEach((seg, i) => {
                    seg = carry + seg; carry = '';
                    seg = seg.replace(/^[\s\u3000]+/, '').replace(/[\s\u3000]+$/, '');
                    if (!seg) return;
                    // 段尾被切开的未闭合 <b> 移到下一段，避免出现 <b></p> 碎标签
                    if (/<b>\s*$/.test(seg)) { carry = '<b>'; seg = seg.replace(/<b>\s*$/, ''); }
                    if (!seg) return;
                    out += i === 0 ? '<p>' + seg + '</p>' : '<p class="note-li">' + seg + '</p>';
                });
                return out || pt;
            });
            // 2) 例题段 → 结构化卡片（题目与全部解答步骤都包进框里）
            html = wrapExamples(html);
            // 3) 超长段落按全角分号（；）分行，避免整段挤成一坨（ASCII ; 不受影响）。
            //    例题卡片内的步骤段落（note-example-step）同样分行，保持类名以便解析按步展示。
            html = html.replace(/<p(?:\s+class="note-example-step")?>[\s\S]*?<\/p>/g, pt => {
                const isStep = /note-example-step/.test(pt);
                const inner = pt.slice(pt.indexOf('>') + 1, -4);
                if (/<(?:pre|table|ul|ol|li)\b|br\s*\/?>/i.test(inner)) return pt;
                const text = inner.replace(/<[^>]*>/g, '');
                if (text.length < 40 || !text.includes('；')) return pt;
                const parts = inner.split(/(?<=；)/);
                if (parts.length < 2) return pt;
                let out = '';
                parts.forEach((seg, i) => {
                    seg = seg.replace(/^[\s\u3000]+/, '').replace(/[\s\u3000]+$/, '');
                    if (!seg) return;
                    if (isStep) out += '<p class="note-example-step">' + seg + '</p>';
                    else out += i === 0 ? '<p>' + seg + '</p>' : '<p class="note-li">' + seg + '</p>';
                });
                return out;
            });
            // 4) 长代码片段（≥50字符）提升为独立代码块，短代码保持内联；段首尾空白修剪。
            html = html.replace(/<p[^>]*>[\s\S]*?<\/p>|<li>[\s\S]*?<\/li>/g, seg => {
                const m = seg.match(/^<([a-z]+)([^>]*)>/);
                if (!m) return seg;
                const tag = m[1], open = m[0], close = '</' + tag + '>';
                const inner = seg.slice(open.length, seg.length - close.length);
                if (tag === 'li' && /<(?:ul|ol|li)\b/.test(inner)) return seg;
                if (!/<code>[\s\S]*?<\/code>/.test(inner)) return seg;
                const pieces = inner.split(/(<code>[\s\S]*?<\/code>)/);
                let changed = false;
                const parts = pieces.map(piece => {
                    const cm = piece.match(/^<code>([\s\S]*?)<\/code>$/);
                    if (!cm) return piece;
                    if (cm[1].replace(/<[^>]*>/g, '').length < 50) return piece;
                    changed = true;
                    return '\u0000' + cm[1] + '\u0001';
                });
                if (!changed) return seg;
                let out = '', buf = '';
                const flush = () => {
                    let t = buf.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
                    if (/<\/div>$/.test(out)) t = t.replace(/^[。；，、：:；]+/, '');
                    if (t) out += open + t + close;
                    buf = '';
                };
                for (const piece of parts) {
                    if (piece.startsWith('\u0000')) { flush(); out += '<div class="code-block">' + piece.slice(1, -1) + '</div>'; }
                    else buf += piece;
                }
                flush();
                return out;
            });
            return html;
        }

        async function loadNotes() {
            let notes;
            try {
                const resp = await fetch(`data/notes/${SUBJECT}_notes.json`);
                if (!resp.ok) throw new Error(resp.status);
                notes = await resp.json();
            } catch (e) {
                document.getElementById('notesHeader').innerHTML =
                    '<h1>📖 考点笔记</h1><p class="notes-source">该科目暂无考点笔记</p>';
                return;
            }
            document.getElementById('notesHeader').innerHTML =
                `<h1>📖 ${notes.title}</h1><p class="notes-source">${notes.source}</p>`;
            document.title = `${notes.title} - 408刷题`;

            let toc = `<div class="notes-search" id="notesSearchBox" hidden>
                <input type="search" id="notesSearchInput" placeholder="🔍 搜索考点、章节、批注…" autocomplete="off"
                    oninput="doNoteSearch(this.value)" onfocus="doNoteSearch(this.value)">
                <div class="notes-search-results" id="notesSearchResults" hidden></div>
            </div>`;
            let body = '';
            for (const ch of notes.chapters) {
                toc += `<div class="notes-toc-ch">${ch.chapter}</div>`;
                body += `<h2 class="notes-ch-title">${ch.chapter}</h2>`;
                for (const sec of ch.sections) {
                    const subs = sec.subsections || [];
                    const hasSub = subs.length > 0;
                    // 目录：有子节的可点击展开/收起，无子节的点击跳转（事件委托见下方，避免内联onclick引号嵌套bug）
                    toc += `<a class="notes-toc-sec" data-sec="${sec.section}"${hasSub ? ' data-hassub="1"' : ''}>${hasSub ? '<span class="toc-sec-arrow">▾</span>' : ''}${sec.section}</a>`;
                    if (hasSub) {
                        toc += `<div class="notes-toc-subs">` + subs.map(s =>
                            `<a class="notes-toc-sub${s.important ? ' notes-toc-sub-strong' : ''}" data-sec="${s.section}">${s.section}</a>`
                        ).join('') + `</div>`;
                    }
                    // 正文：节标题 + (小节 + 节尾)
                    body += `
                    <section class="notes-section" data-sec="${sec.section}">
                        <div class="notes-sec-head">
                            <h3 class="notes-sec-title">${sec.section}</h3>
                            <a class="notes-prac-link" href="quiz.html?subject=${SUBJECT}&mode=sequential&chapter=${encodeURIComponent(ch.chapter)}&section=${encodeURIComponent(sec.section)}" target="_blank" title="新窗口打开该节对应的练习题">📝 相关题目</a>
                        </div>
                        <div class="notes-body">`;
                    if (hasSub) {
                        body += subs.map(s => `
                        <div class="notes-sub${s.important ? ' notes-sub-strong' : ''}" data-sec="${s.section}">
                            <h4 class="notes-sub-title">${s.section}</h4>
                            <div class="notes-sub-body">${fmtNotes(s.html)}</div>
                        </div>`).join('');
                    }
                    body += `${fmtNotes(sec.html)}
                        </div>
                    </section>`;
                }
            }
            document.getElementById('notesToc').innerHTML = toc;
            document.getElementById('notesContent').innerHTML = body;

            // 目录点击事件委托：有子节的节=展开/收起，节/小节=跳转
            const tocBox = document.getElementById('notesToc');
            tocBox.onclick = e => {
                const subLink = e.target.closest('.notes-toc-sub');
                if (subLink) { jumpTo(subLink.dataset.sec, false); return; }
                const secLink = e.target.closest('.notes-toc-sec');
                if (!secLink) return;
                if (secLink.dataset.hassub) toggleTocSec(secLink);
                else jumpTo(secLink.dataset.sec, false);
            };

            initTocSecStates();

            // 滚动时目录跟随高亮（节+小节均参与，DOM顺序靠后者优先→天然偏向最深可见项）
            const sections = Array.from(document.querySelectorAll('.notes-section, .notes-sub'));
            const tocLinks = Array.from(document.querySelectorAll('.notes-toc-sec, .notes-toc-sub'));
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    ticking = false;
                    let current = null;
                    for (const s of sections) {
                        if (s.getBoundingClientRect().top <= 90) current = s.dataset.sec;
                    }
                    if (current) tocLinks.forEach(l => l.classList.toggle('active', l.dataset.sec === current));
                });
            }, { passive: true });

            // 细粒度跳转：?line=N 跳该节某行；?goto=节/小节名 精确落位；
            // 仅当 goto 无法解析时才用 ?q= 题干片段做模糊定位兜底（不再默认"搜索式"跳行）
            if (GOTO) setTimeout(() => {
                let done = false;
                const secEl = resolveSectionEl(GOTO);
                if (LINE) done = jumpToLine(GOTO, parseInt(LINE, 10) || 0);
                if (!done && secEl) { jumpTo(GOTO, true); done = true; }   // 精确落位：直接跳到节/小节
                if (!done && Q) done = gotoSpecific(Q, secEl, true);       // 兜底：节内模糊定位
                if (!done) jumpTo(GOTO, true);
            }, 100);
            // 长表格加横向滚动包裹，防止移动端列被压扁
            document.querySelectorAll('.notes-body table').forEach(t => {
                const wrap = document.createElement('div');
                wrap.className = 'notes-table-wrap';
                t.parentNode.insertBefore(wrap, t);
                wrap.appendChild(t);
            });
            initAnnoAndHl();

            // 状态持久化：恢复上次搜索词（自动重放搜索）与滚动位置
            // 带 GOTO 进入（刷题📖跳转）时：不重放搜索、不恢复旧滚动位置（否则追滚会打断锚点跳转）
            const ps = PS.get({ q: '' });
            if (ps.q && !GOTO) {
                const si = document.getElementById('notesSearchInput');
                if (si) { si.value = ps.q; doNoteSearch(ps.q); }
            }
            if (!GOTO && !LINE) PS.restoreScroll();
        }

        // ==================== 考点笔记：行级批注 + 划词高亮 ====================
        // 合成 question_id 复用做题笔记链路：批注整科一条(_kn)、高亮整科一条(_hl)，走 /api/note
        let annoItems = [];     // [{sec, line, text, images}]，一行至多一条批注
        let annoSaveTimer = null;
        let annoEditor = null;  // 当前打开的编辑器 {el, sec, line, images}
        let hlItems = [];       // [{sec, start, end, color, text}]
        let hlSaveTimer = null;

        const annoKey = () => SUBJECT + '_kn';
        const hlKey = () => SUBJECT + '_hl';

        // 批注块混排在正文里，高亮的偏移/文本计算一律跳过批注子树，保证批注增删不影响高亮定位
        function inAnno(n) {
            const el = n.nodeType === 1 ? n : n.parentElement;
            return !!(el && el.closest('.line-anno'));
        }
        const hlWalkFilter = { acceptNode: n => inAnno(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT };

        // 过滤批注后的正文纯文本（与 offsetInRoot / wrapRange 同一计数口径）
        function cleanTextOf(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let t = '', node;
            while ((node = walker.nextNode())) t += node.nodeValue;
            return t;
        }

        // ==================== 本科考点搜索：标题/章节/正文行 + 我的批注，命中精确定位 ====================
        let noteIndex = [], invertedIndex = new Map(), lastNoteHits = [];
        const NOTE_HIST_KEY = 'notesSearchHistory';

        function nsEsc(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        // 高亮关键词（安全转义后用 <mark> 包裹）
        function hlKeyword(text, kw) {
            if (!kw) return nsEsc(text);
            const safeKw = kw.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const re = new RegExp(`(${safeKw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return nsEsc(text).replace(re, '<mark class="notes-hl-kw">$1</mark>');
        }

        // 渲染后建索引：章标题(w=0)、节标题(w=1)、正文行(w=2)；批注在搜索时实时读 annoItems
        function buildNoteIndex() {
            noteIndex = [];
            invertedIndex = new Map();
            let order = 0;
            document.querySelectorAll('.notes-content > .notes-ch-title, .notes-content > .notes-section').forEach(node => {
                if (node.classList.contains('notes-ch-title')) {
                    const txt = node.textContent.trim();
                    noteIndex.push({ text: txt, path: '章', w: 0, r: 0, order: order++ });
                    addToInverted(txt, noteIndex[noteIndex.length - 1]);
                    return;
                }
                const sec = node.dataset.sec;
                const t = node.querySelector('.notes-sec-title');
                if (t) {
                    const txt = t.textContent.trim();
                    noteIndex.push({ text: txt, path: '节', sec, w: 1, r: 0, order: order++ });
                    addToInverted(txt, noteIndex[noteIndex.length - 1]);
                }
                node.querySelectorAll('.notes-body li, .notes-body p').forEach(el => {
                    const txt = cleanTextOf(el).trim().replace(/\s+/g, ' ');
                    if (txt) {
                        noteIndex.push({ text: txt, path: sec, sec, w: 2, r: 0, order: order++ });
                        addToInverted(txt, noteIndex[noteIndex.length - 1]);
                    }
                });
            });
        }

        // 倒排索引：分词后建立词项到索引项的映射
        function addToInverted(text, item) {
            const words = text.toLowerCase().split(/[\s,，。、；：！？""''（）()【】]+/);
            words.forEach(w => {
                if (w.length < 2) return;
                if (!invertedIndex.has(w)) invertedIndex.set(w, []);
                invertedIndex.get(w).push(item);
            });
        }

        function doNoteSearch(q) {
            PS.set({ q: q || '' });
            const box = document.getElementById('notesSearchResults');
            if (!box) return;
            q = q.trim().toLowerCase();
            if (!q) { showNoteHistory(); return; }
            const hits = [];
            const seen = new Set();
            // 我的批注排最前（r=-1）
            annoItems.forEach(it => {
                if (it.text && it.text.toLowerCase().includes(q)) {
                    const key = 'anno:' + it.sec + ':' + it.line;
                    if (!seen.has(key)) {
                        hits.push({ text: '📝 ' + it.text, path: '我的批注', sec: it.sec, w: 0, r: -1, order: 0 });
                        seen.add(key);
                    }
                }
            });
            // 倒排索引命中 + 回退子串匹配（兼顾模糊）
            const candidates = invertedIndex.get(q);
            if (candidates) {
                candidates.forEach(it => {
                    const key = it.order;
                    if (!seen.has(key)) { hits.push(it); seen.add(key); }
                });
            } else {
                noteIndex.forEach(it => {
                    if (it.text.toLowerCase().includes(q)) {
                        const key = it.order;
                        if (!seen.has(key)) { hits.push(it); seen.add(key); }
                    }
                });
            }
            // 排序：批注在前 → 章/节/正文 → 原文顺序，取前 40 条
            hits.sort((a, b) => a.r - b.r || a.w - b.w || a.order - b.order);
            const top = hits.slice(0, 40);
            lastNoteHits = top;
            box.hidden = false;
            box.innerHTML = top.length === 0 ? '<div class="notes-sr-empty">无结果</div>' :
                top.map((h, i) => `<div class="notes-sr-item" onclick="locateNoteHit(${i})">
                    <span class="notes-sr-path">${nsEsc(h.path || '')}</span>
                    <span class="notes-sr-text">${hlKeyword(h.text.slice(0, 80), q)}</span></div>`).join('');
        }

        // 点结果：记历史 + 收起下拉 + 定位到命中块
        function locateNoteHit(i) {
            const h = lastNoteHits[i];
            if (!h) return;
            saveNoteHist(document.getElementById('notesSearchInput').value);
            clearNoteSearch();
            locateNoteBlock(h.text);
        }

        // 找文本最短的命中块(=最精确)，瞬时滚到屏幕中央并闪烁 1.8s
        function locateNoteBlock(text) {
            const plain = text.replace(/^📝 /, '').trim();
            if (plain.length < 2) return;
            let best = null;
            document.querySelectorAll('.notes-content h2, .notes-content .notes-sec-title, .notes-content .notes-body li, .notes-content .notes-body p, .notes-content .notes-body td, .line-anno-text').forEach(b => {
                if (b.textContent.includes(plain) && (!best || b.textContent.length < best.textContent.length)) best = b;
            });
            if (!best) return;
            best.scrollIntoView({ block: 'center', behavior: 'instant' });
            best.classList.add('locate-flash');
            setTimeout(() => best.classList.remove('locate-flash'), 1800);
        }

        function clearNoteSearch() {
            const input = document.getElementById('notesSearchInput');
            if (input) input.value = '';
            const box = document.getElementById('notesSearchResults');
            if (box) { box.hidden = true; box.innerHTML = ''; }
        }

        // ---------- 搜索历史（localStorage 最多 5 条，可单删/清空） ----------
        const getNoteHist = () => { try { return JSON.parse(localStorage.getItem(NOTE_HIST_KEY)) || []; } catch (e) { return []; } };

        function saveNoteHist(term) {
            term = (term || '').trim();
            if (!term) return;
            const h = getNoteHist().filter(t => t !== term);   // 去重后提到最前
            h.unshift(term);
            localStorage.setItem(NOTE_HIST_KEY, JSON.stringify(h.slice(0, 5)));
        }

        // 输入框为空时展示历史列表（聚焦/清空输入时触发）
        function showNoteHistory() {
            const box = document.getElementById('notesSearchResults');
            if (!box) return;
            const h = getNoteHist();
            if (!h.length) { box.hidden = true; box.innerHTML = ''; return; }
            box.hidden = false;
            box.innerHTML = `<div class="notes-sh-head">搜索历史<button class="notes-sh-clear" onclick="clearNoteHist()">清空</button></div>` +
                h.slice(0, 5).map((t, i) => `<div class="notes-sh-item" onclick="useNoteHist(${i})">
                    <span class="notes-sh-term">${nsEsc(t)}</span>
                    <button class="notes-sh-del" onclick="delNoteHist(event, ${i})" title="删除这条">×</button></div>`).join('');
        }

        function useNoteHist(i) {
            const t = getNoteHist()[i];
            if (t == null) return;
            document.getElementById('notesSearchInput').value = t;
            doNoteSearch(t);
        }

        function delNoteHist(e, i) {
            e.stopPropagation();   // 别触发整行的 useNoteHist
            const h = getNoteHist();
            h.splice(i, 1);
            localStorage.setItem(NOTE_HIST_KEY, JSON.stringify(h));
            showNoteHistory();
        }

        function clearNoteHist() {
            localStorage.removeItem(NOTE_HIST_KEY);
            const box = document.getElementById('notesSearchResults');
            if (box) { box.hidden = true; box.innerHTML = ''; }
        }

        // 点搜索区外部 → 收起下拉
        document.addEventListener('click', e => {
            if (!e.target.closest('.notes-search')) {
                const box = document.getElementById('notesSearchResults');
                if (box) box.hidden = true;
            }
        });

        // ---------- 行级批注：划词后工具条点 📝批注，批注挂在该行正下方 ----------
        function initAnnoAndHl() {
            // 给正文里的 li / p 编行号作批注锚点（笔记内容静态，行号稳定）
            document.querySelectorAll('.notes-section').forEach(section => {
                section.querySelectorAll('.notes-body li, .notes-body p').forEach((el, i) => {
                    el.classList.add('anno-line');
                    el.dataset.line = i;
                });
            });
            buildNoteIndex();
            const sb = document.getElementById('notesSearchBox');
            if (sb) sb.hidden = false;
            initHighlight();
            loadAnnos();
            loadHighlights();
        }

        function lineEl(sec, line) {
            const section = Array.from(document.querySelectorAll('.notes-section')).find(s => s.dataset.sec === sec);
            return section ? section.querySelector('.anno-line[data-line="' + line + '"]') : null;
        }

        function annoBlockEl(sec, line) {
            return document.querySelector('.line-anno-block[data-sec="' + CSS.escape(sec) + '"][data-line="' + line + '"]');
        }

        // li 的批注放行内末尾（跟随缩进），p 等其它行放元素后面
        function attachBelow(line, el) {
            if (line.tagName === 'LI') line.appendChild(el);
            else line.insertAdjacentElement('afterend', el);
        }

        function openAnnoEditor(line, item) {
            closeAnnoEditor();
            const sec = line.closest('.notes-section').dataset.sec;
            const idx = +line.dataset.line;
            const el = document.createElement('div');
            el.className = 'line-anno line-anno-editor';
            el.innerHTML = `
                <textarea class="note-input line-anno-input" placeholder="写批注，可 Ctrl+V 粘贴截图…"></textarea>
                <div class="note-images line-anno-editor-imgs"></div>
                <div class="line-anno-bar">
                    <button type="button" class="btn btn-primary line-anno-save">保存</button>
                    <button type="button" class="btn btn-secondary line-anno-cancel">取消</button>
                </div>`;
            annoEditor = { el, sec, line: idx, images: item ? (item.images || []).slice() : [] };
            const blk = annoBlockEl(sec, idx);
            if (blk) blk.style.display = 'none';   // 编辑期间隐藏原批注块
            attachBelow(line, el);
            const input = el.querySelector('.line-anno-input');
            input.value = item ? (item.text || '') : '';
            renderEditorImages();
            input.addEventListener('paste', pasteAnnoImage);
            el.querySelector('.line-anno-save').addEventListener('click', saveAnnoEditor);
            el.querySelector('.line-anno-cancel').addEventListener('click', () => closeAnnoEditor());
            input.focus();
        }

        function closeAnnoEditor() {
            if (!annoEditor) return;
            const blk = annoBlockEl(annoEditor.sec, annoEditor.line);
            if (blk) blk.style.display = '';
            annoEditor.el.remove();
            annoEditor = null;
        }

        function renderEditorImages() {
            const box = annoEditor.el.querySelector('.line-anno-editor-imgs');
            box.innerHTML = annoEditor.images.map((src, i) => `
                <div class="note-img-item">
                    <img src="${src}" alt="批注图片">
                    <span class="note-img-del" data-i="${i}" title="删除图片">×</span>
                </div>`).join('');
            box.querySelectorAll('img').forEach(img => img.onclick = () => viewAnnoImage(img.src));
            box.querySelectorAll('.note-img-del').forEach(d => d.onclick = () => {
                annoEditor.images.splice(+d.dataset.i, 1);
                renderEditorImages();
            });
        }

        // 压缩成最长边1200px的JPEG，控制入库体积（透明底先铺白）
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(img.src);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = URL.createObjectURL(file);
            });
        }

        // 从剪贴板粘贴图片（截图后在批注框 Ctrl+V），压缩后随批注入库
        async function pasteAnnoImage(event) {
            if (!annoEditor) return;
            const files = [...(event.clipboardData ? event.clipboardData.items : [])]
                .filter(it => it.type.startsWith('image/'))
                .map(it => it.getAsFile())
                .filter(Boolean);
            if (!files.length) return;
            event.preventDefault();
            try {
                for (const f of files) annoEditor.images.push(await compressImage(f));
            } catch (e) { alert(e.message); }
            renderEditorImages();
        }

        function viewAnnoImage(src) {
            if (!src) return;
            const ov = document.createElement('div');
            ov.className = 'img-lightbox';
            ov.innerHTML = `<img src="${src}" alt="批注图片">`;
            ov.onclick = () => ov.remove();
            document.body.appendChild(ov);
        }

        function saveAnnoEditor() {
            if (!annoEditor) return;
            const { sec, line, images } = annoEditor;
            const text = annoEditor.el.querySelector('.line-anno-input').value.trim();
            annoItems = annoItems.filter(it => !(it.sec === sec && it.line === line));
            const old = annoBlockEl(sec, line);
            if (old) old.remove();
            if (text || images.length) {
                const item = { sec, line, text, images };
                annoItems.push(item);
                renderAnnoBlock(item);
            }
            annoEditor.el.remove();
            annoEditor = null;
            saveAnnos();
        }

        // 已保存批注条：📝 + 文字/贴图 + 改/删（常驻显示在行下方）
        function renderAnnoBlock(item) {
            const line = lineEl(item.sec, item.line);
            if (!line) return;
            const el = document.createElement('div');
            el.className = 'line-anno line-anno-block';
            el.dataset.sec = item.sec;
            el.dataset.line = item.line;
            const imgs = (item.images || []).map(src =>
                `<img class="line-anno-img" src="${src}" alt="批注图片">`).join('');
            el.innerHTML = `
                <span class="line-anno-icon">📝</span>
                <div class="line-anno-body">
                    ${item.text ? `<div class="line-anno-text"></div>` : ''}
                    ${imgs}
                </div>
                <div class="line-anno-ops">
                    <button type="button" class="line-anno-op line-anno-edit">改</button>
                    <button type="button" class="line-anno-op line-anno-del">删</button>
                </div>`;
            if (item.text) el.querySelector('.line-anno-text').textContent = item.text;  // textContent 防注入
            el.querySelectorAll('.line-anno-img').forEach(img => img.onclick = () => viewAnnoImage(img.src));
            el.querySelector('.line-anno-edit').onclick = () => openAnnoEditor(line, item);
            el.querySelector('.line-anno-del').onclick = () => {
                if (!confirm('删除这条批注？')) return;
                annoItems = annoItems.filter(it => !(it.sec === item.sec && it.line === item.line));
                el.remove();
                saveAnnos();
            };
            attachBelow(line, el);
        }

        function saveAnnos() {
            clearTimeout(annoSaveTimer);
            annoSaveTimer = setTimeout(async () => {
                try {
                    await noteApi('/api/note/' + encodeURIComponent(annoKey()), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: JSON.stringify(annoItems), images: [] })
                    });
                } catch (e) { alert('批注保存失败: ' + e.message); }
            }, 300);
        }

        // 整科一次 GET 还原所有行批注
        async function loadAnnos() {
            let items = [];
            try {
                const resp = await noteApi('/api/note/' + encodeURIComponent(annoKey()));
                const d = await resp.json();
                items = d.note ? JSON.parse(d.note) : [];
            } catch (e) { return; }
            if (!Array.isArray(items) || !items.length) return;
            annoItems = items.filter(it => it && typeof it.line === 'number');
            annoItems.forEach(renderAnnoBlock);
        }

        // ---------- 划词高亮 ----------
        const HL_COLORS = ['yellow', 'green', 'blue', 'pink'];

        // 选区端点相对 root 的纯文本字符偏移（跳过批注子树，与 cleanTextOf / wrapRange 同口径）
        function offsetInRoot(root, container, offset) {
            const target = container.nodeType === 3 ? container
                : (container.childNodes[offset] || null);   // 元素端点取子节点边界
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let pos = 0, node;
            while ((node = walker.nextNode())) {
                if (container.nodeType === 3) {
                    if (node === container) return pos + offset;
                } else if (target && (target === node || (target.contains && target.contains(node)))) {
                    return pos;   // 落到边界子节点起点
                }
                pos += node.nodeValue.length;
            }
            return pos;
        }

        // 将 [start,end) 内的文本节点片段包进 span（逐片段包裹，支持跨内联标签，跳过批注子树）
        function wrapRange(root, start, end, cls, ds) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let pos = 0, node;
            const pieces = [];
            while ((node = walker.nextNode())) {
                const len = node.nodeValue.length;
                const ns = pos, ne = pos + len;
                pos = ne;
                if (ne <= start || ns >= end) continue;
                pieces.push({ node, s: Math.max(start, ns) - ns, e: Math.min(end, ne) - ns });
            }
            // 从后往前包，避免已收集节点偏移失效
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                const range = document.createRange();
                range.setStart(p.node, p.s);
                range.setEnd(p.node, p.e);
                const span = document.createElement('span');
                span.className = cls;
                if (ds) { span.dataset.start = ds.start; span.dataset.color = ds.color; }
                range.surroundContents(span);   // 单文本节点区间，包裹安全
            }
        }

        function bodyOf(n) {
            const el = n.nodeType === 1 ? n : n.parentElement;
            return el ? el.closest('.notes-body') : null;
        }

        let hlToolbar = null;
        let hlMouseupTimer = null;
        function initHighlight() {
            const content = document.getElementById('notesContent');
            // 点已有高亮→弹出"取消高亮"按钮，点按钮才真正取消（避免误触一键清掉）
            content.addEventListener('click', e => {
                const span = e.target.closest && e.target.closest('.note-hl');
                if (span) { e.stopPropagation(); showHlCancelFor(span); }
            });
            content.addEventListener('mouseup', () => {
                // 划词结束时再决定是否弹颜色工具条；用 timer 以便点击高亮弹取消条时能取消它
                clearTimeout(hlMouseupTimer);
                hlMouseupTimer = setTimeout(showHlToolbar, 0);
            });
            document.addEventListener('mousedown', e => {
                if (hlToolbar && !hlToolbar.contains(e.target)) hideHlToolbar();
            });
        }

        function hideHlToolbar() { if (hlToolbar) { hlToolbar.remove(); hlToolbar = null; } }

        function showHlToolbar() {
            // 若当前正显示"取消高亮"工具条，不要覆盖它（避免点高亮后工具条被误关）
            if (hlToolbar && hlToolbar.classList.contains('hl-cancel-only')) return;
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.rangeCount) { hideHlToolbar(); return; }
            const range = sel.getRangeAt(0);
            const body = bodyOf(range.startContainer);
            // 选区必须完全落在同一 .notes-body 内，且不落进批注块
            if (!body || bodyOf(range.endContainer) !== body) { hideHlToolbar(); return; }
            if (inAnno(range.startContainer) || inAnno(range.endContainer)) { hideHlToolbar(); return; }
            hideHlToolbar();
            const rect = range.getBoundingClientRect();
            hlToolbar = document.createElement('div');
            hlToolbar.className = 'hl-toolbar';
            hlToolbar.innerHTML = HL_COLORS.map(c =>
                `<span class="hl-dot hl-dot-${c}" data-color="${c}" title="${c}"></span>`).join('') +
                '<span class="hl-anno-btn" title="批注此行">📝批注</span>' +
                '<span class="hl-cancel" title="取消高亮">✕</span>';
            document.body.appendChild(hlToolbar);
            hlToolbar.style.top = (window.scrollY + rect.top - hlToolbar.offsetHeight - 8) + 'px';
            hlToolbar.style.left = (window.scrollX + rect.left) + 'px';
            hlToolbar.querySelectorAll('.hl-dot').forEach(dot =>
                dot.addEventListener('click', () => applyHighlight(body, range, dot.dataset.color)));
            // 划词后点📝批注：定位到选区起点所在行，在其正下方开编辑框
            hlToolbar.querySelector('.hl-anno-btn').addEventListener('click', () => {
                const el = range.startContainer.nodeType === 1
                    ? range.startContainer : range.startContainer.parentElement;
                const line = el && el.closest('.anno-line');
                window.getSelection().removeAllRanges();
                hideHlToolbar();
                if (!line) return;
                const sec = line.closest('.notes-section').dataset.sec;
                const idx = +line.dataset.line;
                openAnnoEditor(line, annoItems.find(it => it.sec === sec && it.line === idx) || null);
            });
            hlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
                // 选区内已有高亮则取消
                const span = (range.startContainer.parentElement || range.startContainer).closest
                    ? (range.startContainer.parentElement || range.startContainer).closest('.note-hl') : null;
                if (span) removeHighlight(span);
                hideHlToolbar();
            });
        }

        // 点击已有高亮 span 时，弹出一个仅含"取消高亮"按钮的小工具条；点按钮才删除
        function showHlCancelFor(span) {
            clearTimeout(hlMouseupTimer);   // 取消划词 mouseup 可能挂起的 showHlToolbar，避免覆盖本工具条
            hideHlToolbar();
            const rect = span.getBoundingClientRect();
            hlToolbar = document.createElement('div');
            hlToolbar.className = 'hl-toolbar hl-cancel-only';
            hlToolbar.innerHTML = '<span class="hl-cancel" title="取消高亮">✕ 取消高亮</span>';
            document.body.appendChild(hlToolbar);
            hlToolbar.style.top = (window.scrollY + rect.top - hlToolbar.offsetHeight - 8) + 'px';
            hlToolbar.style.left = (window.scrollX + rect.left) + 'px';
            hlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
                removeHighlight(span);
                hideHlToolbar();
            });
        }

        function applyHighlight(body, range, color) {
            const start = offsetInRoot(body, range.startContainer, range.startOffset);
            const end = offsetInRoot(body, range.endContainer, range.endOffset);
            if (end <= start) { hideHlToolbar(); return; }
            const text = range.toString();
            const sec = body.closest('.notes-section').dataset.sec;
            hlItems.push({ sec, start, end, color, text });
            wrapRange(body, start, end, 'note-hl note-hl-' + color, { start, color });
            window.getSelection().removeAllRanges();
            hideHlToolbar();
            saveHl();
        }

        function removeHighlight(span) {
            const section = span.closest('.notes-section');
            const sec = section.dataset.sec;
            const start = +span.dataset.start;
            const color = span.dataset.color;
            hlItems = hlItems.filter(it => !(it.sec === sec && it.start === start && it.color === color));
            // 同一高亮可能跨内联标签拆成多个 span（data-start/color 相同），须全部移除，避免残留孤儿
            section.querySelectorAll('.note-hl').forEach(s => {
                if (+s.dataset.start === start && s.dataset.color === color) {
                    const parent = s.parentNode;
                    while (s.firstChild) parent.insertBefore(s.firstChild, s);
                    parent.removeChild(s);
                    parent.normalize();
                }
            });
            saveHl();
        }

        function saveHl() {
            clearTimeout(hlSaveTimer);
            hlSaveTimer = setTimeout(async () => {
                try {
                    await noteApi('/api/note/' + encodeURIComponent(hlKey()), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: JSON.stringify(hlItems), images: [] })
                    });
                } catch (e) { /* 高亮保存失败静默，不阻断阅读 */ }
            }, 500);
        }

        // 整科一次 GET 还原所有节高亮
        async function loadHighlights() {
            let items = [];
            try {
                const resp = await noteApi('/api/note/' + encodeURIComponent(hlKey()));
                const d = await resp.json();
                items = d.note ? JSON.parse(d.note) : [];
            } catch (e) { return; }
            if (!Array.isArray(items) || !items.length) return;
            hlItems = [];
            // 按节分桶
            const bySec = {};
            for (const it of items) (bySec[it.sec] = bySec[it.sec] || []).push(it);
            document.querySelectorAll('.notes-section').forEach(section => {
                const sec = section.dataset.sec;
                const list = bySec[sec];
                if (!list) return;
                const body = section.querySelector('.notes-body');
                const full = cleanTextOf(body);
                list.sort((a, b) => a.start - b.start);
                for (const it of list) {
                    let { start, end } = it;
                    // 偏移漂移降级：校验不符则 indexOf 兑底，仍失败静默跳过
                    if (full.slice(start, end) !== it.text) {
                        const idx = full.indexOf(it.text);
                        if (idx < 0 || !it.text) continue;
                        start = idx; end = idx + it.text.length;
                    }
                    wrapRange(body, start, end, 'note-hl note-hl-' + it.color, { start, color: it.color });
                    hlItems.push({ sec, start, end, color: it.color, text: it.text });
                }
            });
        }

        // 悬浮回顶按钮：下滑超过 400px 才出现，避免开头就挡内容
        (function () {
            const topBtn = document.getElementById('notesTopBtn');
            if (!topBtn) return;
            window.addEventListener('scroll', () => {
                topBtn.hidden = window.scrollY < 400;
            }, { passive: true });
        })();

        loadNotes();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
