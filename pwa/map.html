<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计组强化思维导图 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <div class="timer-controls">
                    <button class="timer-btn" id="timerPauseBtn" onclick="toggleTimer()" title="暂停/继续计时">⏸️ 暂停</button>
                    <button class="timer-btn" onclick="resetTimer()" title="重置计时器">🔄 重置</button>
                </div>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="map-header">
            <h1>🗺️ 计组强化思维导图</h1>
            <p class="notes-source" id="mapSubtitle">加载中...</p>
            <div class="map-stats" id="mapStats"></div>
        </div>
        <div class="map-toolbar">
            <input class="search-input map-search" id="mapSearch" type="search"
                placeholder="🔍 搜索知识点 / 真题年份 / 硬件编号（如 ALU、CF、Tag）…" oninput="onMapSearch()">
            <button class="btn btn-secondary btn-sm" onclick="toggleAllSections(true)">全部展开</button>
            <button class="btn btn-secondary btn-sm" onclick="toggleAllSections(false)">收起全部</button>
            <button class="btn btn-secondary btn-sm" onclick="clearMastered()">清空掌握</button>
            <div class="map-progress" id="mapProgress"><div class="map-progress-bar" id="mapProgressBar"></div></div>
        </div>
        <div class="map-search-hint" id="mapSearchHint"></div>
        <div id="mapRoot"><div class="map-empty">加载中…</div></div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
        const _params = new URLSearchParams(location.search);
        const SUBJECT = _params.get('subject') || 'co';

        let MAP = null;
        let mastered = {};
        let totalNodes = 0;
        let searchQ = '';
        let matchIds = new Set();
        let collapsedSecs = new Set();

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function assignIds(node, parent, parentNode) {
            node._id = parent == null ? String(node._idx) : parent + '-' + node._idx;
            node._parent = parentNode;
            totalNodes++;
            (node.c || []).forEach((ch, i) => { ch._idx = i; assignIds(ch, node._id, node); });
        }

        function findNode(id) {
            for (const r of MAP.roots) { const f = findInNode(r, id); if (f) return f; }
            return null;
        }
        function findInNode(node, id) {
            if (node._id === id) return node;
            for (const c of (node.c || [])) { const f = findInNode(c, id); if (f) return f; }
            return null;
        }

        function countMastered(node) {
            let c = mastered[node._id] ? 1 : 0;
            for (const k of (node.c || [])) c += countMastered(k);
            return c;
        }
        function countTotal(node) {
            return 1 + (node.c || []).reduce((s, k) => s + countTotal(k), 0);
        }

        function loadMastered() {
            try { mastered = JSON.parse(localStorage.getItem('comap_mastered') || '{}'); } catch { mastered = {}; }
            for (const id of Object.keys(mastered)) if (!findNode(id)) delete mastered[id];
        }

        function saveMastered() {
            localStorage.setItem('comap_mastered', JSON.stringify(mastered));
        }

        function updateStats() {
            let n = 0;
            for (const id of Object.keys(mastered)) if (findNode(id)) n++;
            const pct = totalNodes ? Math.round(n / totalNodes * 100) : 0;
            document.getElementById('mapStats').textContent = `共 ${totalNodes} 个知识点 · 已掌握 ${n}（${pct}%）`;
            document.getElementById('mapProgressBar').style.width = pct + '%';
        }

        // ==================== 大纲渲染 ====================

        function renderNode(node, depth) {
            const isMastered = !!mastered[node._id];
            const isMatch = matchIds.has(node._id);
            const isAncestor = forcedOpen.has(node._id);
            let cls = 'ol-node ol-lv' + Math.min(depth, 6);
            if (isMastered) cls += ' mastered';
            if (searchQ) {
                if (isMatch) cls += ' hit';
                else if (!isAncestor) cls += ' dim';
            }
            let row = `<div class="${cls}" style="--d:${depth}" data-id="${node._id}">
                <label class="ol-check" title="${isMastered ? '已掌握，点击取消' : '标记为已掌握'}">
                    <input type="checkbox" onchange="toggleMastered('${node._id}')" ${isMastered ? 'checked' : ''}>
                </label>
                <div class="ol-row">
                    <span class="ol-name">${esc(node.n)}</span>
                    ${node.tag ? `<span class="ol-tag">${esc(node.tag)}</span>` : ''}
                    ${node.d ? `<span class="ol-detail">${esc(node.d)}</span>` : ''}
                </div>
            </div>`;
            let out = row;
            for (const k of (node.c || [])) out += renderNode(k, depth + 1);
            return out;
        }

        function renderSection(r, idx) {
            const collapsed = collapsedSecs.has(idx);
            const mc = countMastered(r), tc = countTotal(r);
            const allDone = mc === tc;
            return `<section class="ol-sec">
                <div class="ol-sec-head${allDone ? ' done' : ''}" onclick="toggleSection(${idx})">
                    <span class="ol-caret">${collapsed ? '▸' : '▾'}</span>
                    <span class="ol-sec-title">${esc(r.n)}</span>
                    ${r.tag ? `<span class="ol-tag">${esc(r.tag)}</span>` : ''}
                    <span class="ol-sec-progress">✔ ${mc}/${tc}</span>
                </div>
                <div class="ol-sec-body${collapsed ? ' collapsed' : ''}">${renderNode(r, 0)}</div>
            </section>`;
        }

        let forcedOpen = new Set();

        function renderAll() {
            const root = document.getElementById('mapRoot');
            if (!MAP) { root.innerHTML = '<div class="map-empty">加载失败，请检查网络后刷新。</div>'; return; }
            root.innerHTML = MAP.roots.map(renderSection).join('');
            const hint = document.getElementById('mapSearchHint');
            if (searchQ) {
                hint.style.display = '';
                hint.textContent = `🔍 找到 ${matchIds.size} 个知识点`;
                const first = root.querySelector('.ol-node.hit');
                if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                hint.style.display = 'none';
            }
        }

        function toggleSection(idx) {
            if (collapsedSecs.has(idx)) collapsedSecs.delete(idx); else collapsedSecs.add(idx);
            renderAll();
        }

        function toggleAllSections(open) {
            collapsedSecs.clear();
            if (!open) for (let i = 0; i < MAP.roots.length; i++) collapsedSecs.add(i);
            renderAll();
        }

        function toggleMastered(id) {
            const node = findNode(id);
            if (!node) return;
            if (mastered[id]) delete mastered[id]; else mastered[id] = true;
            saveMastered();
            updateStats();
            renderAll();
        }

        function clearMastered() {
            if (!confirm('确定清空所有“已掌握”标记吗？')) return;
            mastered = {};
            saveMastered();
            updateStats();
            renderAll();
        }

        function onMapSearch() {
            searchQ = document.getElementById('mapSearch').value.trim().toLowerCase();
            matchIds.clear(); forcedOpen.clear();
            if (searchQ) {
                (function walk(nodes) {
                    nodes.forEach(n => {
                        const s = (n.n + ' ' + (n.d || '')).toLowerCase();
                        if (s.includes(searchQ)) matchIds.add(n._id);
                        walk(n.c || []);
                    });
                })(MAP.roots);
                (function build(nodes, path) {
                    nodes.forEach(n => {
                        const p = path.concat(n._id);
                        if (matchIds.has(n._id)) p.forEach(id => forcedOpen.add(id));
                        build(n.c || [], p);
                    });
                })(MAP.roots, []);
            }
            renderAll();
        }

        async function loadMap() {
            try {
                const resp = await fetch(`data/${SUBJECT}_map.json`);
                if (!resp.ok) throw new Error(resp.status);
                MAP = await resp.json();
                document.getElementById('mapSubtitle').textContent = MAP.subtitle || '';
                MAP.roots.forEach((r, i) => { r._idx = i; assignIds(r, null, null); });
                loadMastered();
                renderAll();
                updateStats();
            } catch (err) {
                document.getElementById('mapSubtitle').textContent = '导图数据加载失败：' + err.message;
                document.getElementById('mapRoot').innerHTML = '<div class="map-empty">加载失败，请检查网络后刷新。</div>';
            }
        }

        loadMap();
    </script>
</body>
</html>
