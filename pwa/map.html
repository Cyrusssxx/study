    <meta charset="UTF-8">

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>

            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <div class="timer-controls">
                    <button class="timer-btn" id="timerPauseBtn" onclick="toggleTimer()" title="暂停/继续计时">⏸️ 暂停</button>
                    <button class="timer-btn" onclick="resetTimer()" title="重置计时器">🔄 重置</button>
                </div>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>

    <main class="container">
        <div class="map-header">
            <h1>🗺️ 计组强化思维导图</h1>
            <p class="notes-source" id="mapSubtitle">加载中...</p>
            <p class="map-anno-tip">📝 选中文字会弹出工具条：可划词高亮（黄/绿/蓝/粉）或点「📝批注」添加批注（可 Ctrl+V 粘贴截图，与笔记页同款）</p>
        </div>
        <div class="map-toolbar">
            <input class="search-input map-search" id="mapSearch" type="search"
                placeholder="🔍 搜索知识点 / 真题年份 / 硬件编号（如 ALU、CF、Tag）…" oninput="onMapSearch()">
        </div>
        <div class="map-search-hint" id="mapSearchHint"></div>
        <div class="ol-layout">
            <aside class="ol-nav" id="olNav"></aside>
            <button class="ol-nav-tab" id="olNavTab" onclick="expandOlNav()" title="展开目录">☰ 目录</button>
            <div id="mapRoot"><div class="map-empty">加载中…</div></div>
        </div>
    </main>
    <button class="ol-nav-fab" id="olNavFab" onclick="openOlNav()" title="目录">☰ 目录</button>
    <div class="ol-nav-mask" id="olNavMask" onclick="closeOlNav()"></div>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
        const _params = new URLSearchParams(location.search);
        const SUBJECT = _params.get('subject') || 'co';

        let MAP = null;
        let totalNodes = 0;
        let searchQ = '';
        let matchIds = new Set();
        let forcedOpen = new Set();
        let olNavCollapsed = localStorage.getItem('comap_nav_collapsed') === '1';

        // 行级批注 + 划词高亮（复用笔记界面批注方式）：批注按节点 id 锚定，高亮按节内字符偏移，均走 /api/note 持久化
        let annoItems = [];        // [{id, text, images}]
        let annoSaveTimer = null;
        let annoEditor = null;     // {id, el, images}
        const annoKey = () => SUBJECT + '_map_anno';
        let hlItems = [];          // [{sec, start, end, color, text}]
        let hlSaveTimer = null;
        let hlToolbar = null;
        const hlKey = () => SUBJECT + '_map_hl';

        // 批注块混排在大纲里，高亮的偏移/文本计算一律跳过批注子树，保证批注增删不影响高亮定位
        function inAnno(n) {
            const el = n.nodeType === 1 ? n : n.parentElement;
            return !!(el && el.closest('.line-anno'));
        }
        const hlWalkFilter = { acceptNode: n => inAnno(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT };

        function cleanTextOf(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let t = '', node;
            while ((node = walker.nextNode())) t += node.nodeValue;
            return t;
        }

        function offsetInRoot(root, container, offset) {
            const target = container.nodeType === 3 ? container
                : (container.childNodes[offset] || null);
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let pos = 0, node;
            while ((node = walker.nextNode())) {
                if (container.nodeType === 3) {
                    if (node === container) return pos + offset;
                } else if (target && (target === node || (target.contains && target.contains(node)))) {
                    return pos;
                }
                pos += node.nodeValue.length;
            }
            return pos;
        }

        function wrapRange(root, start, end, cls, ds) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, hlWalkFilter);
            let pos = 0, node;
            const pieces = [];
            while ((node = walker.nextNode())) {
                const len = node.nodeValue.length;
                const ns = pos, ne = pos + len;
                pos = ne;
                if (ne <= start || ns >= end) continue;
                pieces.push({ node, s: Math.max(start, ns) - ns, e: Math.min(end, ne) - ns });
            }
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                const range = document.createRange();
                range.setStart(p.node, p.s);
                range.setEnd(p.node, p.e);
                const span = document.createElement('span');
                span.className = cls;
                if (ds) { span.dataset.start = ds.start; span.dataset.color = ds.color; }
                range.surroundContents(span);
            }
        }

        function bodyOf(n) {
            const el = n.nodeType === 1 ? n : n.parentElement;
            return el ? el.closest('.ol-sec-body') : null;
        }

        // ==================== 划词工具条：高亮 + 📝批注 ====================
        const HL_COLORS = ['yellow', 'green', 'blue', 'pink'];

        function initHl() {
            const root = document.getElementById('mapRoot');
            root.addEventListener('click', e => {
                const span = e.target.closest && e.target.closest('.note-hl');
                if (span) { e.stopPropagation(); removeHighlight(span); }
            });
            root.addEventListener('mouseup', () => setTimeout(showHlToolbar, 0));
            document.addEventListener('mousedown', e => {
                if (hlToolbar && !hlToolbar.contains(e.target)) hideHlToolbar();
            });
        }

        function hideHlToolbar() { if (hlToolbar) { hlToolbar.remove(); hlToolbar = null; } }

        function showHlToolbar() {
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.rangeCount) { hideHlToolbar(); return; }
            const range = sel.getRangeAt(0);
            const body = bodyOf(range.startContainer);
            if (!body || bodyOf(range.endContainer) !== body) { hideHlToolbar(); return; }
            if (inAnno(range.startContainer) || inAnno(range.endContainer)) { hideHlToolbar(); return; }
            hideHlToolbar();
            const rect = range.getBoundingClientRect();
            hlToolbar = document.createElement('div');
            hlToolbar.className = 'hl-toolbar';
            hlToolbar.innerHTML = HL_COLORS.map(c =>
                `<span class="hl-dot hl-dot-${c}" data-color="${c}" title="${c}"></span>`).join('') +
                '<span class="hl-anno-btn" title="批注此行">📝批注</span>' +
                '<span class="hl-cancel" title="取消高亮">✕</span>';
            document.body.appendChild(hlToolbar);
            hlToolbar.style.top = (window.scrollY + rect.top - hlToolbar.offsetHeight - 8) + 'px';
            hlToolbar.style.left = (window.scrollX + rect.left) + 'px';
            hlToolbar.querySelectorAll('.hl-dot').forEach(dot =>
                dot.addEventListener('click', () => applyHighlight(body, range, dot.dataset.color)));
            hlToolbar.querySelector('.hl-anno-btn').addEventListener('click', () => {
                const el = range.startContainer.nodeType === 1
                    ? range.startContainer : range.startContainer.parentElement;
                const row = el && el.closest('.ol-node');
                window.getSelection().removeAllRanges();
                hideHlToolbar();
                if (!row) return;
                openAnnoEditor(row.dataset.id);
            });
            hlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
                const span = (range.startContainer.parentElement || range.startContainer).closest
                    ? (range.startContainer.parentElement || range.startContainer).closest('.note-hl') : null;
                if (span) removeHighlight(span);
                hideHlToolbar();
            });
        }

        function applyHighlight(body, range, color) {
            const start = offsetInRoot(body, range.startContainer, range.startOffset);
            const end = offsetInRoot(body, range.endContainer, range.endOffset);
            if (end <= start) { hideHlToolbar(); return; }
            const text = range.toString();
            const sec = body.parentElement.id;
            hlItems.push({ sec, start, end, color, text });
            wrapRange(body, start, end, 'note-hl note-hl-' + color, { start, color });
            window.getSelection().removeAllRanges();
            hideHlToolbar();
            saveHl();
        }

        function removeHighlight(span) {
            const sec = span.closest('.ol-sec-body').parentElement.id;
            const start = +span.dataset.start;
            const color = span.dataset.color;
            hlItems = hlItems.filter(it => !(it.sec === sec && it.start === start && it.color === color));
            const parent = span.parentNode;
            while (span.firstChild) parent.insertBefore(span.firstChild, span);
            parent.removeChild(span);
            parent.normalize();
            saveHl();
        }

        function saveHl() {
            clearTimeout(hlSaveTimer);
            hlSaveTimer = setTimeout(async () => {
                try {
                    await api('/api/note/' + encodeURIComponent(hlKey()), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: JSON.stringify(hlItems), images: [] })
                    });
                } catch (e) { /* 高亮保存失败静默，不阻断阅读 */ }
            }, 500);
        }

        // 重渲染后按偏移重新上色（导图内容静态，偏移稳定）
        function reapplyHighlights() {
            document.querySelectorAll('.ol-sec').forEach(section => {
                const sec = section.id;
                const list = hlItems.filter(it => it.sec === sec);
                if (!list.length) return;
                const body = section.querySelector('.ol-sec-body');
                const full = cleanTextOf(body);
                list.sort((a, b) => a.start - b.start);
                for (const it of list) {
                    let { start, end } = it;
                    if (full.slice(start, end) !== it.text) {
                        const idx = full.indexOf(it.text);
                        if (idx < 0 || !it.text) continue;
                        start = idx; end = idx + it.text.length;
                    }
                    wrapRange(body, start, end, 'note-hl note-hl-' + it.color, { start, color: it.color });
                }
            });
        }

        async function loadHighlights() {
            let items = [];
            try {
                const resp = await api('/api/note/' + encodeURIComponent(hlKey()));
                const d = await resp.json();
                items = d.note ? JSON.parse(d.note) : [];
            } catch (e) { return; }
            if (!Array.isArray(items) || !items.length) return;
            hlItems = items.filter(it => it && typeof it.sec === 'string');
            reapplyHighlights();
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function assignIds(node, parent) {
            node._id = parent == null ? String(node._idx) : parent + '-' + node._idx;
            totalNodes++;
            (node.c || []).forEach((ch, i) => { ch._idx = i; assignIds(ch, node._id); });
        }

        // ==================== 大纲渲染 ====================

        function renderNode(node, depth) {
            const isMatch = matchIds.has(node._id);
            const isAncestor = forcedOpen.has(node._id);
            let cls = 'ol-node ol-lv' + Math.min(depth, 6);
            if (searchQ) {
                if (isMatch) cls += ' hit';
                else if (!isAncestor) cls += ' dim';
            }
            const d = node.d || '';
            const raw = d.split(/([。；])/);
            const segs = [];
            for (let i = 0; i < raw.length; i += 2) {
                const t = (raw[i] + (raw[i + 1] || '')).trim();
                if (t) segs.push(t);
            }
            let inner;
            const isLeaf = !(node.c || []).length;
            const dot = isLeaf ? '<span class="ol-dot"></span>' : '';
            if (segs.length > 1) {
                cls += ' multi';
                inner = `<div class="ol-main">${dot}<span class="ol-name">${esc(node.n)}</span>
                    ${node.tag ? `<span class="ol-tag">${esc(node.tag)}</span>` : ''}</div>
                    <div class="ol-detail">${segs.map(s => `<div class="ol-dline">${esc(s)}</div>`).join('')}</div>`;
            } else {
                inner = `${dot}<span class="ol-name">${esc(node.n)}</span>
                    ${node.tag ? `<span class="ol-tag">${esc(node.tag)}</span>` : ''}
                    ${node.d ? `<span class="ol-detail">${esc(node.d)}</span>` : ''}`;
            }
            return `<div class="${cls}" style="--d:${depth}" data-id="${node._id}">${inner}</div>`
                + annoBlockHtml(node._id, depth)
                + (node.c || []).map(k => renderNode(k, depth + 1)).join('');
        }

        function renderSection(r, idx) {
            const kids = (r.c || []).map(k => renderNode(k, 1)).join('');
            return `<section class="ol-sec" id="sec-${idx}">
                <h2 class="ol-sec-title">${esc(r.n)}</h2>
                <div class="ol-sec-body">${kids || '<div class="map-empty">（无内容）</div>'}</div>
            </section>`;
        }

        function renderAll() {
            const root = document.getElementById('mapRoot');
            if (!MAP) { root.innerHTML = '<div class="map-empty">加载失败，请检查网络后刷新。</div>'; return; }
            root.innerHTML = MAP.roots.map(renderSection).join('');
            reapplyHighlights();
            renderNav();
            const hint = document.getElementById('mapSearchHint');
            if (searchQ) {
                hint.style.display = '';
                hint.textContent = `🔍 找到 ${matchIds.size} 个知识点`;
                const first = root.querySelector('.ol-node.hit');
                if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                hint.style.display = 'none';
            }
        }

        // ==================== 左侧可收起导航 ====================

        function renderNav() {
            const nav = document.getElementById('olNav');
            if (!MAP) return;
            const body = MAP.roots.map((r, idx) => {
                const subs = (r.c || []).map(k =>
                    `<a class="ol-nav-item sub" data-target="${k._id}" title="${esc(k.n)}">${esc(k.n)}</a>`
                ).join('');
                return `<div class="ol-nav-sec">
                    <a class="ol-nav-item root" data-target="sec-${idx}">${esc(r.n)}</a>
                    <div class="ol-nav-subs">${subs}</div>
                </div>`;
            }).join('');
            nav.innerHTML = `<div class="ol-nav-head" onclick="toggleOlNav()">目录<span class="ol-nav-toggle">«</span></div>
                <div class="ol-nav-body">${body}</div>`;
            nav.classList.toggle('collapsed', olNavCollapsed);
            nav.querySelectorAll('.ol-nav-item').forEach(a => {
                a.addEventListener('click', () => gotoNode(a.dataset.target));
            });
        }

        function toggleOlNav() {
            olNavCollapsed = !olNavCollapsed;
            localStorage.setItem('comap_nav_collapsed', olNavCollapsed ? '1' : '0');
            const nav = document.getElementById('olNav');
            if (nav) nav.classList.toggle('collapsed', olNavCollapsed);
        }

        function expandOlNav() {
            olNavCollapsed = false;
            localStorage.setItem('comap_nav_collapsed', '0');
            const nav = document.getElementById('olNav');
            if (nav) nav.classList.remove('collapsed');
        }

        function openOlNav() {
            document.getElementById('olNav').classList.add('open');
            document.getElementById('olNavMask').classList.add('open');
        }

        function closeOlNav() {
            document.getElementById('olNav').classList.remove('open');
            document.getElementById('olNavMask').classList.remove('open');
        }

        function gotoNode(target) {
            const el = document.getElementById(target) || document.querySelector(`[data-id="${target}"]`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                el.classList.add('map-flash');
                setTimeout(() => el.classList.remove('map-flash'), 1500);
            }
            closeOlNav();
        }

        // ==================== 搜索 ====================

        function onMapSearch() {
            searchQ = document.getElementById('mapSearch').value.trim().toLowerCase();
            matchIds.clear(); forcedOpen.clear();
            if (searchQ) {
                (function walk(nodes) {
                    nodes.forEach(n => {
                        const s = (n.n + ' ' + (n.d || '')).toLowerCase();
                        if (s.includes(searchQ)) matchIds.add(n._id);
                        walk(n.c || []);
                    });
                })(MAP.roots);
                (function build(nodes, path) {
                    nodes.forEach(n => {
                        const p = path.concat(n._id);
                        if (matchIds.has(n._id)) p.forEach(id => forcedOpen.add(id));
                        build(n.c || [], p);
                    });
                })(MAP.roots, []);
            }
            renderAll();
        }

        async function loadMap() {
            try {
                const resp = await fetch(`data/${SUBJECT}_map.json`);
                if (resp.status === 404) {
                    document.getElementById('mapSubtitle').textContent = '该科目思维导图正在制作中，敬请期待…';
                    document.getElementById('mapRoot').innerHTML = '<div class="map-empty">📭 暂无导图内容</div>';
                    document.getElementById('olNav').innerHTML = '';
                    return;
                }
                if (!resp.ok) throw new Error(resp.status);
                MAP = await resp.json();
                MAP.roots.forEach((r, i) => { r._idx = i; assignIds(r, null); });
                document.getElementById('mapSubtitle').textContent = (MAP.subtitle ? MAP.subtitle + ' · ' : '') + `共 ${totalNodes} 个知识点`;
                renderAll();
                initHl();
                loadAnnos();
                loadHighlights();
            } catch (err) {
                document.getElementById('mapSubtitle').textContent = '导图数据加载失败：' + err.message;
                document.getElementById('mapRoot').innerHTML = '<div class="map-empty">加载失败，请检查网络后刷新。</div>';
            }
        }

        // ==================== 行级批注（与笔记页同款） ====================

        function annoOf(id) {
            return annoItems.find(a => a.id === id);
        }

        // 已保存批注条：📝 + 文字/贴图 + 改/删，常驻显示在节点行下方
        function annoBlockHtml(id, depth) {
            const item = annoOf(id);
            if (!item) return '';
            const imgs = (item.images || []).map((src, i) =>
                `<img class="line-anno-img" src="${src}" alt="批注图片" onclick="viewAnnoImage('${id}', ${i})">`).join('');
            return `<div class="line-anno line-anno-block" data-id="${CSS.escape(id)}" style="--d:${depth}">
                <span class="line-anno-icon">📝</span>
                <div class="line-anno-body">
                    ${item.text ? `<div class="line-anno-text">${esc(item.text)}</div>` : ''}
                    ${imgs}
                </div>
                <div class="line-anno-ops">
                    <button type="button" class="line-anno-op" onclick="openAnnoEditor('${id}')">改</button>
                    <button type="button" class="line-anno-op line-anno-del" onclick="delAnno('${id}')">删</button>
                </div>
            </div>`;
        }

        function annoNodeEl(id) {
            return document.querySelector(`.ol-node[data-id="${CSS.escape(id)}"]`);
        }
        function annoBlockEl(id) {
            return document.querySelector(`.line-anno-block[data-id="${CSS.escape(id)}"]`);
        }

        function openAnnoEditor(id) {
            closeAnnoEditor();
            const row = annoNodeEl(id);
            if (!row) return;
            const item = annoOf(id);
            const el = document.createElement('div');
            el.className = 'line-anno line-anno-editor';
            el.style.setProperty('--d', row.style.getPropertyValue('--d') || 0);
            el.innerHTML = `
                <textarea class="note-input line-anno-input" placeholder="写批注，可 Ctrl+V 粘贴截图…"></textarea>
                <div class="note-images line-anno-editor-imgs"></div>
                <div class="line-anno-bar">
                    <button type="button" class="btn btn-primary line-anno-save">保存</button>
                    <button type="button" class="btn btn-secondary line-anno-cancel">取消</button>
                </div>`;
            annoEditor = { id, el, images: item ? (item.images || []).slice() : [] };
            const blk = annoBlockEl(id);
            if (blk) blk.style.display = 'none';
            row.insertAdjacentElement('afterend', el);
            const input = el.querySelector('.line-anno-input');
            input.value = item ? (item.text || '') : '';
            renderEditorImages();
            input.addEventListener('paste', pasteAnnoImage);
            el.querySelector('.line-anno-save').addEventListener('click', saveAnnoEditor);
            el.querySelector('.line-anno-cancel').addEventListener('click', () => closeAnnoEditor());
            input.focus();
        }

        function closeAnnoEditor() {
            if (!annoEditor) return;
            const blk = annoBlockEl(annoEditor.id);
            if (blk) blk.style.display = '';
            annoEditor.el.remove();
            annoEditor = null;
        }

        function renderEditorImages() {
            if (!annoEditor) return;
            const box = annoEditor.el.querySelector('.line-anno-editor-imgs');
            box.innerHTML = annoEditor.images.map((src, i) => `
                <div class="note-img-item">
                    <img src="${src}" alt="批注图片">
                    <span class="note-img-del" data-i="${i}" title="删除图片">×</span>
                </div>`).join('');
            box.querySelectorAll('.note-img-del').forEach(d => d.onclick = () => {
                annoEditor.images.splice(+d.dataset.i, 1);
                renderEditorImages();
            });
        }

        // 压缩成最长边1200px的JPEG，控制入库体积（透明底先铺白）
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(img.src);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => reject(new Error('图片读取失败'));
                img.src = URL.createObjectURL(file);
            });
        }

        async function pasteAnnoImage(event) {
            if (!annoEditor) return;
            const files = [...(event.clipboardData ? event.clipboardData.items : [])]
                .filter(it => it.type.startsWith('image/'))
                .map(it => it.getAsFile())
                .filter(Boolean);
            if (!files.length) return;
            event.preventDefault();
            try {
                for (const f of files) annoEditor.images.push(await compressImage(f));
            } catch (e) { alert(e.message); }
            renderEditorImages();
        }

        function viewAnnoImage(id, i) {
            const item = annoOf(id);
            if (!item || !item.images) return;
            const src = item.images[i];
            if (!src) return;
            const ov = document.createElement('div');
            ov.className = 'img-lightbox';
            ov.innerHTML = `<img src="${src}" alt="批注图片">`;
            ov.onclick = () => ov.remove();
            document.body.appendChild(ov);
        }

        function saveAnnoEditor() {
            if (!annoEditor) return;
            const id = annoEditor.id;
            const text = annoEditor.el.querySelector('.line-anno-input').value.trim();
            const images = annoEditor.images;
            annoItems = annoItems.filter(a => a.id !== id);
            if (text || images.length) annoItems.push({ id, text, images });
            annoEditor.el.remove();
            annoEditor = null;
            renderAll();
            saveAnnos();
        }

        function delAnno(id) {
            if (!confirm('删除这条批注？')) return;
            annoItems = annoItems.filter(a => a.id !== id);
            renderAll();
            saveAnnos();
        }

        function saveAnnos() {
            clearTimeout(annoSaveTimer);
            annoSaveTimer = setTimeout(async () => {
                try {
                    await api('/api/note/' + encodeURIComponent(annoKey()), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: JSON.stringify(annoItems), images: [] })
                    });
                } catch (e) { alert('批注保存失败: ' + e.message); }
            }, 300);
        }

        async function loadAnnos() {
            let items = [];
            try {
                const resp = await api('/api/note/' + encodeURIComponent(annoKey()));
                const d = await resp.json();
                items = d.note ? JSON.parse(d.note) : [];
            } catch (e) { return; }
            if (!Array.isArray(items) || !items.length) return;
            annoItems = items.filter(it => it && typeof it.id === 'string');
            renderAll();
        }

        loadMap();
    </script>
</body>
</html>
