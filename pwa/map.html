<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计组强化思维导图 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <div class="timer-controls">
                    <button class="timer-btn" id="timerPauseBtn" onclick="toggleTimer()" title="暂停/继续计时">⏸️ 暂停</button>
                    <button class="timer-btn" onclick="resetTimer()" title="重置计时器">🔄 重置</button>
                </div>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="map-header">
            <h1>🗺️ 计组强化思维导图</h1>
            <p class="notes-source" id="mapSubtitle">加载中...</p>
        </div>
        <div class="map-toolbar">
            <input class="search-input map-search" id="mapSearch" type="search"
                placeholder="🔍 搜索知识点 / 真题年份 / 硬件编号（如 ALU、CF、Tag）…" oninput="onMapSearch()">
        </div>
        <div class="map-search-hint" id="mapSearchHint"></div>
        <div class="ol-layout">
            <aside class="ol-nav" id="olNav"></aside>
            <div id="mapRoot"><div class="map-empty">加载中…</div></div>
        </div>
    </main>
    <button class="ol-nav-fab" id="olNavFab" onclick="openOlNav()" title="目录">☰ 目录</button>
    <div class="ol-nav-mask" id="olNavMask" onclick="closeOlNav()"></div>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
        const _params = new URLSearchParams(location.search);
        const SUBJECT = _params.get('subject') || 'co';

        let MAP = null;
        let totalNodes = 0;
        let searchQ = '';
        let matchIds = new Set();
        let forcedOpen = new Set();
        let olNavCollapsed = localStorage.getItem('comap_nav_collapsed') === '1';

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function assignIds(node, parent) {
            node._id = parent == null ? String(node._idx) : parent + '-' + node._idx;
            totalNodes++;
            (node.c || []).forEach((ch, i) => { ch._idx = i; assignIds(ch, node._id); });
        }

        // ==================== 大纲渲染 ====================

        function renderNode(node, depth) {
            const isMatch = matchIds.has(node._id);
            const isAncestor = forcedOpen.has(node._id);
            let cls = 'ol-node ol-lv' + Math.min(depth, 6);
            if (searchQ) {
                if (isMatch) cls += ' hit';
                else if (!isAncestor) cls += ' dim';
            }
            const d = node.d || '';
            const raw = d.split(/([。；])/);
            const segs = [];
            for (let i = 0; i < raw.length; i += 2) {
                const t = (raw[i] + (raw[i + 1] || '')).trim();
                if (t) segs.push(t);
            }
            let inner;
            const isLeaf = !(node.c || []).length;
            const dot = isLeaf ? '<span class="ol-dot"></span>' : '';
            if (segs.length > 1) {
                cls += ' multi';
                inner = `<div class="ol-main">${dot}<span class="ol-name">${esc(node.n)}</span>
                    ${node.tag ? `<span class="ol-tag">${esc(node.tag)}</span>` : ''}</div>
                    <div class="ol-detail">${segs.map(s => `<div class="ol-dline">${esc(s)}</div>`).join('')}</div>`;
            } else {
                inner = `${dot}<span class="ol-name">${esc(node.n)}</span>
                    ${node.tag ? `<span class="ol-tag">${esc(node.tag)}</span>` : ''}
                    ${node.d ? `<span class="ol-detail">${esc(node.d)}</span>` : ''}`;
            }
            return `<div class="${cls}" style="--d:${depth}" data-id="${node._id}">${inner}</div>`
                + (node.c || []).map(k => renderNode(k, depth + 1)).join('');
        }

        function renderSection(r, idx) {
            const kids = (r.c || []).map(k => renderNode(k, 1)).join('');
            return `<section class="ol-sec" id="sec-${idx}">
                <h2 class="ol-sec-title">${esc(r.n)}</h2>
                <div class="ol-sec-body">${kids || '<div class="map-empty">（无内容）</div>'}</div>
            </section>`;
        }

        function renderAll() {
            const root = document.getElementById('mapRoot');
            if (!MAP) { root.innerHTML = '<div class="map-empty">加载失败，请检查网络后刷新。</div>'; return; }
            root.innerHTML = MAP.roots.map(renderSection).join('');
            renderNav();
            const hint = document.getElementById('mapSearchHint');
            if (searchQ) {
                hint.style.display = '';
                hint.textContent = `🔍 找到 ${matchIds.size} 个知识点`;
                const first = root.querySelector('.ol-node.hit');
                if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                hint.style.display = 'none';
            }
        }

        // ==================== 左侧可收起导航 ====================

        function renderNav() {
            const nav = document.getElementById('olNav');
            if (!MAP) return;
            const body = MAP.roots.map((r, idx) => {
                const subs = (r.c || []).map(k =>
                    `<a class="ol-nav-item sub" data-target="${k._id}" title="${esc(k.n)}">${esc(k.n)}</a>`
                ).join('');
                return `<div class="ol-nav-sec">
                    <a class="ol-nav-item root" data-target="sec-${idx}">${esc(r.n)}</a>
                    <div class="ol-nav-subs">${subs}</div>
                </div>`;
            }).join('');
            nav.innerHTML = `<div class="ol-nav-head" onclick="toggleOlNav()">目录<span class="ol-nav-toggle">▾</span></div>
                <div class="ol-nav-body">${body}</div>`;
            nav.classList.toggle('collapsed', olNavCollapsed);
            nav.querySelectorAll('.ol-nav-item').forEach(a => {
                a.addEventListener('click', () => gotoNode(a.dataset.target));
            });
        }

        function toggleOlNav() {
            olNavCollapsed = !olNavCollapsed;
            localStorage.setItem('comap_nav_collapsed', olNavCollapsed ? '1' : '0');
            const nav = document.getElementById('olNav');
            if (nav) nav.classList.toggle('collapsed', olNavCollapsed);
        }

        function openOlNav() {
            document.getElementById('olNav').classList.add('open');
            document.getElementById('olNavMask').classList.add('open');
        }

        function closeOlNav() {
            document.getElementById('olNav').classList.remove('open');
            document.getElementById('olNavMask').classList.remove('open');
        }

        function gotoNode(target) {
            const el = document.getElementById(target) || document.querySelector(`[data-id="${target}"]`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                el.classList.add('map-flash');
                setTimeout(() => el.classList.remove('map-flash'), 1500);
            }
            closeOlNav();
        }

        // ==================== 搜索 ====================

        function onMapSearch() {
            searchQ = document.getElementById('mapSearch').value.trim().toLowerCase();
            matchIds.clear(); forcedOpen.clear();
            if (searchQ) {
                (function walk(nodes) {
                    nodes.forEach(n => {
                        const s = (n.n + ' ' + (n.d || '')).toLowerCase();
                        if (s.includes(searchQ)) matchIds.add(n._id);
                        walk(n.c || []);
                    });
                })(MAP.roots);
                (function build(nodes, path) {
                    nodes.forEach(n => {
                        const p = path.concat(n._id);
                        if (matchIds.has(n._id)) p.forEach(id => forcedOpen.add(id));
                        build(n.c || [], p);
                    });
                })(MAP.roots, []);
            }
            renderAll();
        }

        async function loadMap() {
            try {
                const resp = await fetch(`data/${SUBJECT}_map.json`);
                if (!resp.ok) throw new Error(resp.status);
                MAP = await resp.json();
                MAP.roots.forEach((r, i) => { r._idx = i; assignIds(r, null); });
                document.getElementById('mapSubtitle').textContent = (MAP.subtitle ? MAP.subtitle + ' · ' : '') + `共 ${totalNodes} 个知识点`;
                renderAll();
            } catch (err) {
                document.getElementById('mapSubtitle').textContent = '导图数据加载失败：' + err.message;
                document.getElementById('mapRoot').innerHTML = '<div class="map-empty">加载失败，请检查网络后刷新。</div>';
            }
        }

        loadMap();
    </script>
</body>
</html>
