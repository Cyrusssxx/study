<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大题专项 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dati-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 14px; }
        .dati-tab { flex: 1; min-width: 120px; }
        .dati-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .dati-subject { display: none; }
        .dati-subject.active { display: block; }
        /* 控制条默认折叠：只留一行 summary，题目本身占据首屏；折叠状态存 localStorage */
        .dati-tools {
            margin: 0 0 12px; border: 1px solid var(--border);
            border-radius: var(--radius); background: var(--card-bg);
        }
        .dati-tools > summary {
            list-style: none; cursor: pointer; user-select: none;
            padding: 7px 12px; font-size: .82rem; font-weight: 600;
            color: var(--text-light); display: flex; align-items: center; gap: 8px;
        }
        .dati-tools > summary::-webkit-details-marker { display: none; }
        .dati-tools > summary::after { content: '▾'; margin-left: auto; font-size: .72rem; }
        .dati-tools[open] > summary { border-bottom: 1px solid var(--border); color: var(--text); }
        .dati-tools[open] > summary::after { content: '▴'; }
        .dati-tools-brief { margin-left: auto; font-weight: 400; font-size: .76rem; color: var(--text-light); }
        .dati-tools-sum-txt { flex: 0 0 auto; }
        .dati-tools .dati-filters {
            margin-bottom: 0; border: none; border-radius: 0;
            background: transparent; padding: 10px 12px;
        }
        .dati-filters {
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 18px; padding: 10px 12px;
            background: rgba(74, 122, 184, .045);
            border: 1px solid var(--border); border-radius: var(--radius);
        }
        .dati-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .dati-bar-filter { padding-top: 8px; border-top: 1px solid var(--border); }
        .dati-bar-label {
            flex: 0 0 auto; min-width: 30px; font-size: .78rem; font-weight: 600;
            color: var(--text-light); letter-spacing: .05em;
        }
        .dati-chip {
            padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer;
            background: var(--card-bg); color: var(--text); font-size: 13px; line-height: 1.4;
            transition: background .15s, border-color .15s, color .15s;
        }
        .dati-chip:hover:not(.active) { border-color: var(--primary); }
        .dati-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .dati-chip .dati-count { font-size: 11px; opacity: .8; margin-left: 2px; }
        .dati-chip .dati-count.zero { opacity: .4; }
        .dati-year {
            padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
            background: var(--card-bg); color: var(--text);
        }
        .dati-overview {
            margin-left: auto; font-size: .82rem; color: var(--text-light);
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .dati-overview b { color: var(--primary); font-weight: 700; }
        .dati-qcard {
            border: 1px solid var(--border); border-left: 3px solid var(--primary);
            border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
            background: var(--card-bg);
        }
        .dati-qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .dati-qnum { font-weight: 700; }
        /* 题卡头部：把原来传进来却从未使用的 secName 显示出来，长列表里能看出题目归属 */
        .dati-qsec {
            font-size: .8rem; color: var(--text-light);
            max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dati-state { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
        .dati-state:empty { display: none; }
        .dati-state-i {
            font-size: .74rem; line-height: 1.5; padding: 1px 8px; border-radius: 999px;
            border: 1px solid var(--border); color: var(--text-light); background: transparent;
        }
        .dati-state-i.is-done { color: var(--primary); border-color: var(--primary); background: rgba(74,122,184,.08); }
        .dati-state-i.is-unfam { color: #a68a1a; border-color: #d4af37; background: rgba(212,175,55,.14); }
        .dati-state-i.is-dk { color: #c82333; border-color: #dc3545; background: rgba(220,53,69,.12); }
        .dati-state-i.is-note { color: #8a6d1a; border-color: #e6d9a8; }
        .dati-real {
            background: #fde68a; color: #92400e; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600;
        }
        .dark .dati-real { background: #4d3800; color: #fde68a; }
        .dark .dati-state-i.is-unfam { color: #e6c74f; border-color: #e6c74f; }
        .dark .dati-state-i.is-dk { color: #ff6b6b; border-color: #ff6b6b; }
        .dati-fav {
            margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: #cbd5e1;
            line-height: 1; padding: 2px 6px;
        }
        .dati-fav.on { color: #f59e0b; }
        .dati-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .dati-done-btn { min-width: 84px; }
        .dati-done-btn.done { color: var(--primary); border-color: var(--primary); }
        .dati-note-btn.has-note { color: #8a6d1a; border-color: #e6d9a8; }
        .dati-note-btn.active { color: var(--primary); border-color: var(--primary); }
        /* 不熟（黄）/ 不会（红）标记按钮：与刷题页同一套语义色 */
        .dati-mark-btn.on-unfam { background: rgba(212, 175, 55, .18); border-color: #d4af37; color: #a68a1a; font-weight: 600; }
        .dati-mark-btn.on-dk { background: rgba(220, 53, 69, .14); border-color: #dc3545; color: #c82333; font-weight: 600; }
        /* 标记态自己的 hover：不落到 .btn-secondary:hover 的灰底（两者同优先级，避免顺序敏感） */
        .dati-mark-btn.on-unfam:hover { background: rgba(212, 175, 55, .3); border-color: #d4af37; color: #8f7716; }
        .dati-mark-btn.on-dk:hover { background: rgba(220, 53, 69, .24); border-color: #dc3545; color: #b21f2d; }
        .dark .dati-mark-btn.on-unfam { background: rgba(230, 199, 79, .16); border-color: #e6c74f; color: #e6c74f; }
        .dark .dati-mark-btn.on-dk { background: rgba(255, 107, 107, .16); border-color: #ff6b6b; color: #ff6b6b; }
        .dark .dati-mark-btn.on-unfam:hover { background: rgba(230, 199, 79, .26); }
        .dark .dati-mark-btn.on-dk:hover { background: rgba(255, 107, 107, .26); }
        .dati-qbody img, .dati-abody img { max-width: 100%; height: auto; display: block; margin-bottom: 6px; border-radius: 6px; }
        .dati-ans-btn { margin-top: 4px; }
        /* 答案面板：淡底 + 细边框 + 圆角，与笔记面板同一层级语言（原来是光秃秃一条虚线） */
        .dati-abody {
            margin-top: 10px; padding: 10px 12px; display: none;
            background: rgba(74, 122, 184, .05);
            border: 1px solid var(--border); border-radius: 8px;
        }
        .dark .dati-abody { background: rgba(74, 122, 184, .10); }
        .dati-abody.open { display: block; }
        .dati-none { color: #888; padding: 20px 0; text-align: center; }
        .dark .dati-none { color: #999; }

        /* 题面/答案与真题套卷页同一套排版（question-content / explanation-body 来自 style.css） */
        .dati-qbody.question-content { padding: 2px 0 4px; }
        .dati-abody .explanation-title { margin-top: 0; }
        .dati-abody .explanation-body { padding: 0; }
        .dati-abody .zt-svgholder { min-height: 56px; }
        .dati-qsec { max-width: 40%; }

        /* ============ 题目导航（常驻窄条 · 切题时全部题目始终可见） ============ */
        /* 对齐 zhenti 的 .zt-fq：半透明窄条贴在右侧，宽版靠 FAB / 头部展开。
           旧实现是默认收起的 300px 抽屉，切一次题就要重新点开，看不到全量题号。 */
        .dati-layout { display: block; }   /* 主区占满宽度，导航改为固定窄条 */
        #datiRoot { min-width: 0; }
        .dati-nav {
            position: fixed; right: 4px; top: 74px; bottom: 76px;
            width: 88px; max-width: 86vw;
            background: transparent; border: none;
            z-index: 45; overflow: hidden;
            display: flex; flex-direction: column;
            pointer-events: none;            /* 只有条条本身可交互，不挡题目 */
            transition: width .15s ease;
        }
        /* 常驻窄条占 88px：题目区与「下一题」箭头都要让位，避免互相压住/盖住题号 */
        @media (min-width: 901px) {
            #datiRoot { margin-right: 96px; }
            .dati-arrow.next { right: 100px; }
        }
        .dati-nav.open {
            width: 300px; background: var(--card-bg);
            border-left: 1px solid var(--border); border-radius: 10px 0 0 10px;
            box-shadow: -6px 0 18px rgba(0,0,0,.20);
            z-index: 300; pointer-events: auto;
        }
        .dati-nav-head {
            pointer-events: auto; flex: 0 0 auto;
            padding: 7px 4px; font-weight: 600; font-size: 0.95rem;
            border-bottom: 1px solid var(--border);
            background: rgba(var(--card-rgb), .72);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .dati-nav-prog { font-size: .66rem; color: var(--primary); font-variant-numeric: tabular-nums; }
        .dati-nav-head .close-x { color: var(--text-light); font-size: 1.15rem; line-height: 1; }
        .dati-nav-body {
            pointer-events: auto; flex: 1; min-height: 0;
            padding: 3px 4px 8px; overflow-y: auto;
            scrollbar-width: none; overscroll-behavior: contain;
        }
        .dati-nav-body::-webkit-scrollbar { display: none; }
        .dati-nav-sec {
            font-size: 0.82rem; color: var(--primary); font-weight: 600;
            margin: 12px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dati-nav-sec .dati-count { color: var(--text-light); font-weight: 400; margin-left: 4px; }
        /* 窄条：只显示按年份横排的精简题号带（一屏看全），完整分组留给宽版 */
        .dati-nav:not(.open) .dati-nav-body { display: none; }
        .dati-nav.open .dati-nav-mini { display: none; }
        .dati-nav:not(.open) .dati-nav-head {
            padding: 6px 2px; flex-direction: column; gap: 1px; font-size: .66rem;
        }
        .dati-nav:not(.open) .dati-nav-head .close-x { display: none; }
        .dati-nav-mini {
            pointer-events: auto; flex: 1; min-height: 0;
            padding: 3px 2px 8px; overflow-y: auto;
            scrollbar-width: none; overscroll-behavior: contain;
        }
        .dati-nav-mini::-webkit-scrollbar { display: none; }
        .dati-nav-mini-row {
            display: flex; align-items: center; gap: 2px; margin-bottom: 3px;
        }
        .dati-nav-mini-y {
            flex: 0 0 16px; text-align: center; font-size: 9px;
            color: var(--text-light); font-variant-numeric: tabular-nums;
        }
        .dati-nav-mini-btn {
            flex: 1 1 0; min-width: 0; height: 20px; padding: 0;
            font-size: 10px; line-height: 18px; text-align: center;
            border: 1px solid var(--border); border-radius: 4px;
            background: rgba(var(--card-rgb), .72); color: var(--text-light);
            cursor: pointer; font-variant-numeric: tabular-nums;
            transition: background .14s, color .14s, border-color .14s;
        }
        .dati-nav-mini-btn:hover { border-color: var(--primary); color: var(--primary); }
        .dati-nav-mini-btn.done { background: rgba(46, 125, 50, .18); border-color: #81c784; color: #1b5e20; }
        .dati-nav-mini-btn.current {
            background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700;
        }
        .dati-nav-mini-empty { font-size: .72rem; color: var(--text-light); text-align: center; padding: 8px 0; }
        .dati-nav.open .dati-nav-body { padding: 4px 12px 18px; }
        .dati-flash { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
        .dati-nav-fab {
            display: block; position: fixed; right: 14px; bottom: 20px; z-index: 290;
            border: none; background: var(--primary); color: #fff;
            padding: 10px 16px; border-radius: 24px; font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(74,144,217,.4); cursor: pointer;
        }
        .dati-nav-fab.hide { display: none; }
        .dati-nav-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; }
        .dati-nav-mask.open { display: block; }
        @media (max-width: 900px) {
            /* 窄屏不常驻窄条（会压住题干），改回浮钮 → 宽版抽屉；仍可一键看到全部题目 */
            .dati-nav:not(.open) { display: none; }
            #datiRoot { margin-right: 0; }
            .dati-nav.open { bottom: 66px; }
        }

        /* ============ 单题模式（一题一题加载） ============ */
        .dati-view-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
        .dati-single-top {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin: 0 0 10px; font-size: .86rem; color: var(--text-light);
        }
        .dati-single-crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 72%; }
        .dati-single-crumb b { color: var(--text); font-weight: 600; }
        .dati-single-prog {
            margin-left: auto; font-weight: 700; color: var(--primary);
            font-variant-numeric: tabular-nums;
        }
        /* ============ 单题模式：左右悬浮箭头（原底部工具栏已弃用） ============ */
        /* 固定两侧、垂直居中、滚动时恒在；窄屏缩小贴边，避免压住题干 */
        .dati-arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; padding: 0 0 3px;   /* 3px 光学居中 ‹ › */
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-light);
            font-size: 22px; line-height: 1; font-family: Georgia, serif;
            cursor: pointer; z-index: 60;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            transition: background .15s, color .15s, border-color .15s, box-shadow .15s, opacity .15s;
        }
        .dati-arrow:hover:not(:disabled) {
            background: var(--primary); border-color: var(--primary); color: #fff;
            box-shadow: 0 4px 14px rgba(74, 122, 184, .32);
        }
        .dati-arrow:active:not(:disabled) { transform: translateY(-50%) scale(.94); }
        .dati-arrow:disabled { opacity: .32; cursor: default; }
        .dati-arrow.prev { left: 10px; }
        .dati-arrow.next { right: 10px; }
        @media (max-width: 900px) {
            .dati-arrow { width: 34px; height: 34px; font-size: 19px; }
            .dati-arrow.prev { left: 3px; }
            .dati-arrow.next { right: 3px; }
        }
        .num-btn.current { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }

        /* ===== 题号栏状态色：不熟（黄）/ 不会（红） =====
           与刷题页 mark-btn、真题页 zt-fq 同一套语义色。规则置于 done/current 之后，
           让主观标记压过「已练」底色；当前题另用主色描边保留定位（描边不被标记色覆盖）。 */
        .dati-nav-mini-btn.un,
        #datiNav .num-btn.un {
            background: rgba(234, 179, 8, .24); border-color: #d4af37;
            color: #8a6a00; font-weight: 700;
        }
        .dati-nav-mini-btn.dk,
        #datiNav .num-btn.dk {
            background: rgba(198, 40, 40, .18); border-color: #dc3545;
            color: #b02a37; font-weight: 700;
        }
        .dark .dati-nav-mini-btn.un,
        .dark #datiNav .num-btn.un {
            background: rgba(234, 179, 8, .26); border-color: #e6c74f; color: #fde047;
        }
        .dark .dati-nav-mini-btn.dk,
        .dark #datiNav .num-btn.dk {
            background: rgba(239, 83, 80, .26); border-color: #ff6b6b; color: #ff8a80;
        }
        /* 当前题即使被标了不熟/不会，也要一眼定位 */
        .dati-nav-mini-btn.current,
        #datiNav .num-btn.current { outline: 2px solid var(--primary); outline-offset: -2px; }
        /* 宽版图例：说明三种状态色，窄条空间不够就不放 */
        .dati-nav-legend {
            display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
            font-size: .72rem; color: var(--text-light);
            margin: 2px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
        }
        .dati-nav-legend i {
            display: inline-block; width: 9px; height: 9px; border-radius: 2px;
            margin-right: 4px; vertical-align: -1px;
        }
        .dati-nav-legend .lg-done { background: #81c784; }
        .dati-nav-legend .lg-un { background: #d4af37; }
        .dati-nav-legend .lg-dk { background: #dc3545; }
        /* 分组标题右侧题数：每年题数不同（真题各科分布本就不均），标出来免得看成漏题。
           用伪元素而非文本节点，保证 .num-group-title 的 textContent 仍是纯年份（既有测试依赖） */
        .num-group-title .dati-gcount::after {
            content: attr(data-count); font-weight: 400; color: var(--text-light); opacity: .8;
        }
    </style>
</head>

    <main class="container">
        <div class="dati-tabs" id="datiTabs"></div>

            <summary class="dati-tools-sum" title="排序 / 显示方式 / 练习状态筛选（折叠状态会被记住）">
                <span class="dati-tools-sum-txt">⚙ 排序与筛选</span>
                <span class="dati-tools-brief" id="datiToolsBrief"></span>
            </summary>
            <div class="dati-filters" id="datiFilters">
            <div class="dati-bar">
                <span class="dati-bar-label">排序</span>
                <button class="dati-chip" id="fModeChapter" onclick="setMode('chapter')" title="按章节顺序浏览（第 1 章 → 第 n 章）">📚 按章节</button>
                <button class="dati-chip" id="fModeYear" onclick="setMode('year')" title="按年份倒序浏览（最新年份优先），可只看某一年">📅 按年份</button>
                <select class="dati-year" id="yearSel" onchange="setYear(this.value)" style="display:none" title="只看某一年（仅「按年份」排序时生效）"></select>
                <select class="dati-year" id="chapterSel" onchange="setChapter(this.value)" style="display:none" title="只做某一章（仅「按章节」排序时生效）"></select>
                <span class="dati-view-sep"></span>
                <span class="dati-bar-label">显示</span>
                <button class="dati-chip dati-view-chip" id="fSingle" onclick="setView('single')" title="一次只做一道题，题目图逐题加载（省流量）">📄 单题</button>
                <button class="dati-chip dati-view-chip" id="fList" onclick="setView('list')" title="整章列表浏览，章节折叠展开">📃 列表</button>
                <button class="dati-chip" id="datiExpandAll" onclick="toggleAllChapters()" title="展开 / 收起全部分组">展开全部</button>
            </div>
            <div class="dati-bar dati-bar-filter">
                <span class="dati-bar-label">筛选</span>
                <button class="dati-chip" id="fStatusAll" onclick="setFilter('all')" title="清除状态筛选，显示全部题目">全部</button>
                <button class="dati-chip" id="fFav" onclick="setFilter('fav')">★ 我的收藏 <span class="dati-count" id="cntFav"></span></button>
                <button class="dati-chip" id="fTodo" onclick="setFilter('todo')">○ 未练 <span class="dati-count" id="cntTodo"></span></button>
                <button class="dati-chip" id="fDone" onclick="setFilter('done')">✅ 已练 <span class="dati-count" id="cntDone"></span></button>
                <button class="dati-chip" id="fUnfam" onclick="setFilter('unfam')">🟡 不熟 <span class="dati-count" id="cntUnfam"></span></button>
                <button class="dati-chip" id="fDontknow" onclick="setFilter('dontknow')">🔴 不会 <span class="dati-count" id="cntDontknow"></span></button>
                <span class="dati-overview" id="datiOverview"></span>
            </div>
            </div>
        </details>
        <div class="dati-layout">
            <div id="datiRoot">
                <div class="loading">加载中...</div>
            </div>
            <aside class="dati-nav" id="datiNav"></aside>
        </div>
    </main>
    <button class="dati-nav-fab" id="datiNavFab" onclick="openNavMobile()" title="题目导航">☰ 导航</button>
    <div class="dati-nav-mask" id="datiNavMask" onclick="closeNavMobile()"></div>
    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/note_richtext.js"></script>
    <script>
    let DATI = null;
    let activeSubject = localStorage.getItem('datiSubject') || 'os';
    let filter = localStorage.getItem('datiFilter') || 'all';   // all | fav | todo | done | unfam | dontknow
    let mode = localStorage.getItem('datiMode') || 'chapter';   // chapter（按章节）| year（按年份倒序）
    if (mode !== 'year') mode = 'chapter';
    if (filter === 'real') filter = 'all';                      // 旧版"统考真题"筛选已并入模式，归一
    let year = localStorage.getItem('datiYear') || '';          // '' = 全部年份（仅 year 模式生效）
    let chapter = localStorage.getItem('datiChapter') || '';    // '' = 全部章节（仅 chapter 模式生效）
    let chapterIds = null;   // 选中章的题目 id 集合；null = 不限章（passFilter / 计数 / 总览共用）
    let LEGACY = {};             // 旧 dati_* id → zhenti iid（一次性迁移做题记录，data/dati_zt.json 提供）
    const svgCache = {};          // zt_svg 名 → SVG 文本（与 zhenti.js 同源，切题不重复请求）
    const noteTimer = {};         // qid -> 防抖定时器，笔记停顿即自动保存
    let favSet = new Set();      // 已收藏的题 id（题库全局，与真题页同一套 key）
    const ansTpl = {};           // 答案 HTML 模板，首次展开时注入
    let noteMap = {};            // qid -> {content, images}，dati 题笔记
    let noteOpen = new Set(JSON.parse(localStorage.getItem('datiNoteOpen') || '[]'));  // 展开中的笔记面板 qid
    let ansOpen = new Set(JSON.parse(localStorage.getItem('datiAnsOpen') || '[]'));    // 展开中的答案面板 qid
    let openChapters = new Set(JSON.parse(localStorage.getItem('datiOpenCh') || '[]'));  // 已展开的章节（默认收起，按需加载图片）
    let doneSet = new Set(JSON.parse(localStorage.getItem('datiDone') || '[]'));        // 已练过的大题 qid（只看未练筛选用）
    let unfamSet = new Set();      // 标了「不熟」的大题 qid（存后端 unfamiliar 库，与刷题页同一套）
    let dontknowSet = new Set();   // 标了「不会」的大题 qid（存后端 dontknow 库）
    let lastSeenQ = localStorage.getItem('datiLastSeenQ') || '';                         // 上次浏览/跳转的题（刷新后自动定位）
    let viewMode = localStorage.getItem('datiView') || 'single';                         // single（默认，一题一题做）| list（整章列表）
    let singleQid = localStorage.getItem('datiSingleQ') || '';                           // 单题模式当前题 id
    // 单题模式导航＝左右悬浮箭头（原底部工具栏已弃用，仅保留键盘 ← → 与箭头）

    // 当前科目 + 当前筛选下的有序题目（带章节/小节上下文）——单题模式与列表模式共用
    // 「统考真题」筛选下改为**按年份倒序**（2025 → 2009），同年内保持章节顺序：
    // 刷真题的主线是「最近年份优先」，按章节顺序会一年一年跳着出现。
    function flatItems() {
        const sub = DATI.find(s => s.key === activeSubject);
        if (!sub) return [];
        const out = [];
        for (const ch of sub.chapters)
            for (const sec of ch.sections)
                for (const q of sec.questions)
                    if (passFilter(q)) out.push({ q, chName: ch.name, secName: sec.name });
        if (mode === 'year') out.sort((a, b) => (Number(b.q.year) || 0) - (Number(a.q.year) || 0));
        return out;
    }

    // 真题模式按年份分组：[{ year, title, items:[{q,chName,secName}] }]，年份倒序。
    // 列表模式与右侧导航共用，保证「排序」与「分组」口径一致。
    function yearGroups() {
        const map = new Map();
        for (const it of flatItems()) {
            const y = it.q.year || '未知';
            if (!map.has(y)) map.set(y, []);
            map.get(y).push(it);
        }
        return [...map.keys()]
            .sort((a, b) => (Number(b) || 0) - (Number(a) || 0))
            .map(y => ({ year: y, title: `${y} 年统考真题`, items: map.get(y) }));
    }

    // 切题前把未保存的笔记落库（单题模式下切换/跳题前调用），避免输入内容丢失
    function flushDatiNote() {
        const openPanel = [...document.querySelectorAll('.dati-note-panel[data-note]')]
            .find(p => p.style.display !== 'none');
        if (!openPanel) return;
        const qid = openPanel.dataset.note;
        const el = openPanel.querySelector('.dati-note-input');
        if (!el) return;
        const cur = noteMap[qid] || { content: '', images: [] };
        const html = serializeNote(el);
        if (noteTimer[qid]) { clearTimeout(noteTimer[qid]); delete noteTimer[qid]; }
        if (html === (cur.content || '')) return;          // 内容有变动才写库
        // 自动保存不负责清空：DOM 空而库里有内容时不写。
        // /api/note 收到空 content 且无图片会直接 dbDelete，误写一次笔记就没了。
        if (!html && (cur.content || '').trim()) return;
        saveNote(qid);
    }

    // 输入（含工具条格式、高亮、粘贴图）后停顿 700ms 自动落库，
    // 与真题套卷页 onNoteInput 同源。工具条点击时 note_richtext 会无参回调本函数。
    function onNoteInput(el) {
        if (!el || !el.dataset || !el.dataset.noteInput) el = document.activeElement;
        if (!el || !el.dataset || !el.dataset.noteInput) {
            // 工具条点击时焦点可能已离开编辑器 → 从当前展开的笔记面板兜底取 qid
            el = document.querySelector('.dati-note-panel:not([style*="display:none"]) .dati-note-input')
                || document.querySelector('.dati-note-input');
        }
        if (!el || !el.dataset || !el.dataset.noteInput) return;
        const qid = el.dataset.noteInput;
        const btn = document.querySelector(`[data-note-save="${qid}"]`);
        if (btn) btn.classList.remove('saved');
        clearTimeout(noteTimer[qid]);
        noteTimer[qid] = setTimeout(() => {
            delete noteTimer[qid];
            const cur = noteMap[qid] || { content: '', images: [] };
            const html = serializeNote(el);
            if (!html && (cur.content || '').trim()) return;   // 自动保存不删除已有笔记
            saveNote(qid);
        }, 700);
    }

    // 关页 / 切后台时把还挂在防抖窗口里的笔记立刻落库（与 zhenti.js / quiz.html 同源）。
    // 没有这条的话，「写完就刷新 / 关标签」会把最后一次编辑一起丢掉，
    // 下次打开就是「笔记没了」。visibilitychange 比 pagehide 更早，多给点写入时间。
    window.addEventListener('pagehide', flushDatiNote);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushDatiNote();
    });

    function saveDoneSet() {
        localStorage.setItem('datiDone', JSON.stringify([...doneSet]));
    }

    function saveOpenChapters() {
        localStorage.setItem('datiOpenCh', JSON.stringify([...openChapters]));
    }
    function saveAnsOpen() {
        localStorage.setItem('datiAnsOpen', JSON.stringify([...ansOpen]));
    }
    function saveNoteOpen() {
        localStorage.setItem('datiNoteOpen', JSON.stringify([...noteOpen]));
    }

    // 旧截图版（data/dati.json 回退）的图片模板：题干 data-src 惰挂载，答案直接带 src
    const qimg = (key, fn) => `<img data-src="data/dati_figs/${key}/${fn}" loading="lazy" alt="大题截图">`;
    const aimg = (key, fn) => `<img src="data/dati_figs/${key}/${fn}" loading="lazy" alt="大题答案">`;

    // 真源 dati_zt.json 的 q.q / q.a 是与真题套卷页同源的 HTML 字符串；
    // 旧 dati.json 给的是截图文件名数组。两种格式都渲染，离线回退不会白屏。
    function questionHtml(q, subKey) {
        if (Array.isArray(q.q)) return q.q.map(fn => qimg(subKey, fn)).join('');
        return typeof q.q === 'string' ? q.q : '';
    }
    function answerHtml(q, subKey) {
        if (Array.isArray(q.a)) {
            return q.a.length ? q.a.map(fn => aimg(subKey, fn)).join('')
                : '<div class="dati-none">本题暂无答案截图</div>';
        }
        const raw = typeof q.a === 'string' ? q.a : '';
        // .dati-abody 本身就是淡底容器，内部只放 title/body，避免「框中框」
        return `<div class="explanation-title">参考答案与解析</div>
                <div class="explanation-body">${raw || '<div class="explanation-empty">该题暂无详细解析</div>'}</div>`;
    }
    // 预取下一题用到的外置资源（真题 SVG / 打卡表教材原图），切题时图已就绪
    function prefetchSrcsIn(html) {
        for (const m of String(html || '').matchAll(/<img[^>]+src="(data\/daka_figs\/[^"]+)"/g)) {
            new Image().src = m[1];
        }
    }

    // ==================== 与真题套卷页同源（iid / 记录同步） ====================
    // zhenti.js buildFlat() 的 id 公式：it.qid || sid + '_zt' + year + '_' + i
    // data/dati_zt.json 已经按这个公式生成 id，所以本页与真题页的
    // 收藏 / 不熟 / 不会 / 笔记落在同一个 IndexedDB 键上，天然双向同步。
    function allQuestions() {
        const out = [];
        if (!DATI) return out;
        for (const s of DATI) for (const c of s.chapters) for (const sec of c.sections)
            for (const q of sec.questions) out.push(q);
        return out;
    }

    // 旧 dati_* 记录一次性迁移：已练 / 笔记展开 / 答案展开 / 上次所在题
    // （旧 favorites/unfamiliar/dontknow/notes 里的 dati_* 键由 migrateLegacyStores 处理）
    function migrateLegacyLocal() {
        if (!Object.keys(LEGACY).length) return;
        const map = k => LEGACY[k] || k;
        const sets = [
            ['doneSet', () => doneSet, v => { doneSet = v; }, saveDoneSet, 'datiDone'],
            ['noteOpen', () => noteOpen, v => { noteOpen = v; }, saveNoteOpen, 'datiNoteOpen'],
            ['ansOpen', () => ansOpen, v => { ansOpen = v; }, saveAnsOpen, 'datiAnsOpen'],
        ];
        for (const [, get, set, save] of sets) {
            const arr = [...get()];
            const next = [...new Set(arr.map(map))];
            if (next.join('|') !== arr.join('|')) { set(new Set(next)); save(); }
        }
        if (LEGACY[singleQid]) { singleQid = LEGACY[singleQid]; localStorage.setItem('datiSingleQ', singleQid); }
        if (LEGACY[lastSeenQ]) { lastSeenQ = LEGACY[lastSeenQ]; localStorage.setItem('datiLastSeenQ', lastSeenQ); }
    }

    // 旧 dati_* 的收藏 / 标记 / 笔记补写一条新 id 记录；旧记录保留，绝不删除（备份优先）
    async function migrateLegacyStores() {
        if (!Object.keys(LEGACY).length) return;
        for (const store of ['favorites', 'unfamiliar', 'dontknow', 'notes']) {
            let rows = [];
            try { rows = await dbAll(store); } catch (e) { continue; }
            for (const r of rows) {
                const oldId = r.question_id;
                if (!oldId || !LEGACY[oldId]) continue;
                const newId = LEGACY[oldId];
                // 笔记写规范键 zt{年}_{题号}（与 zhenti 的 noteKeyOf 一致）
                const key = store === 'notes' ? noteKeyOf(newId) : newId;
                try { if (await dbGet(store, key)) continue; } catch (e) { continue; }
                const rec = Object.assign({}, r, { question_id: key });
                rec.subject = store === 'notes' ? '' : String(key).split('_')[0];
                try { await dbPut(store, rec); } catch (e) { /* 降级库缺 store 时静默跳过 */ }
            }
        }
    }

    // 真源＝dati_zt.json（zhenti 同源 126 题）；取不到时回退旧的截图版 dati.json，
    // 保证离线/旧缓存打开页面不会白屏。
    async function fetchDatiSource() {
        try {
            const j = await fetch('data/dati_zt.json').then(r => r.json());
            if (j && Array.isArray(j.subjects) && j.subjects.length && j.legacy) return j;
        } catch (e) { /* 落到旧数据 */ }
        return fetch('data/dati.json').then(r => r.json());
    }

    // ==================== 真题外置 SVG（与 zhenti.js injectSvgs 同源） ====================
    async function fetchSvg(name) {
        if (svgCache[name] != null) return svgCache[name];
        try {
            const r = await fetch('data/zt_svg/' + name + '.svg');
            const t = r.ok && typeof r.text === 'function' ? await r.text() : '';
            svgCache[name] = t;
            return t;
        } catch (e) { svgCache[name] = ''; return ''; }
    }
    function applyDatiSvg(holder, t) {
        if (!holder || !holder.isConnected) return;
        if (!t) { holder.innerHTML = '<span class="zt-svg-fail">[图加载失败，可刷新重试]</span>'; return; }
        if (holder.classList.contains('zt-svg-inline')) { holder.innerHTML = t; return; }
        const wrap = document.createElement('div');
        wrap.className = 'zt-svg-wrap';
        wrap.innerHTML = t;
        holder.replaceWith(wrap);
    }
    function injectDatiSvgs(root) {
        const host = root || document;
        for (const h of host.querySelectorAll('.zt-svgholder[data-svg]')) {
            if (h.dataset.done) continue;
            const ans = h.closest('.dati-abody');
            if (ans && !ans.classList.contains('open')) continue;   // 答案未展开不发请求
            h.dataset.done = '1';
            const name = h.dataset.svg;
            if (svgCache[name] != null) { applyDatiSvg(h, svgCache[name]); continue; }
            fetchSvg(name).then(t => applyDatiSvg(h, t));
        }
    }

    // ==================== 折叠控制条（默认折叠 + 状态持久化） ====================
    function initTools() {
        const d = document.getElementById('datiTools');
        if (!d) return;
        const collapsed = localStorage.getItem('datiBarCollapsed');
        d.open = collapsed === '0';      // 缺省 / '1' → 默认折叠（历史上用户已存 1）
        d.addEventListener('toggle', () => {
            localStorage.setItem('datiBarCollapsed', d.open ? '0' : '1');
            syncToolsBrief();
        });
        syncToolsBrief();
    }
    function syncToolsBrief() {
        const el = document.getElementById('datiToolsBrief');
        if (!el || !DATI) return;
        const sub = DATI.find(s => s.key === activeSubject);
        const fName = { all: '', fav: '收藏', todo: '未练', done: '已练', unfam: '不熟', dontknow: '不会' }[filter] || '';
        el.textContent = `${sub ? sub.name : ''}${fName ? ' · ' + fName : ''} · ${flatItems().length} 题`;
    }

    // ==================== 数据与收藏 ====================
    async function loadDati() {
        try {
            const src = await fetchDatiSource();
            DATI = src.subjects;
            LEGACY = src.legacy || {};
            migrateLegacyLocal();
            await loadNoteAlias();   // 先取跨页笔记映射，loadNotes 才能回填规范键
            await migrateLegacyStores();
            await loadFavs();
            await loadNotes();
            await loadMarks();
            renderTabs();
            renderYearOptions();
            renderChapterOptions();
            initTools();
            // 恢复上次的筛选 / 年份 / 章节 / 视图模式 UI 状态
            syncFilterChips();
            document.getElementById('yearSel').value = year;
            syncViewChips();
            render();
            restoreLastSeen();
        } catch (e) {
            document.getElementById('datiRoot').innerHTML = `<div class="error">加载失败</div>`;
        }
    }

    async function loadFavs() {
        const rows = await dbAll('favorites');
        favSet = new Set(rows.map(r => r.question_id));
    }

    // 跨页笔记：与 zhenti/daka 共用规范键 zt{年}_{卷面题号}（data/note_alias.json）
    let NOTE_ALIAS = {};
    const noteKeyOf = k => NOTE_ALIAS[k] || k;
    async function loadNoteAlias() {
        try { NOTE_ALIAS = await fetch('data/note_alias.json').then(r => r.json()); } catch (e) { NOTE_ALIAS = {}; }
    }

    async function loadNotes() {
        const rows = await dbAll('notes');
        noteMap = {};
        const byKey = {};
        for (const n of rows) byKey[n.question_id] = { content: n.content || '', images: n.images || [] };
        // 两页笔记互通：真键是规范键 zt{年}_{题号}。历史上部分笔记写在「本地 id」上
        // （旧 dati_* 或真题 iid，如 co_zt2014_44），这里做双向补齐：
        //   ① 规范键有内容 → 回填给本地 id（老页面也能读到）
        //   ② 只有本地 id 有内容 → 补写一条规范键（旧记录保留，绝不删除）
        const pairs = [];
        for (const local in NOTE_ALIAS) {
            if (!local.startsWith('dati_')) continue;
            pairs.push([local, NOTE_ALIAS[local]]);
        }
        for (const q of allQuestions()) pairs.push([q.id, noteKeyOf(q.id)]);
        const todo = [], seen = new Set();
        for (const [local, spec] of pairs) {
            if (!spec || spec === local) continue;
            if (byKey[spec]) { if (!byKey[local]) byKey[local] = byKey[spec]; continue; }
            if (byKey[local] && !seen.has(spec)) { seen.add(spec); todo.push([spec, byKey[local]]); }
        }
        for (const [spec, rec] of todo) {
            dbPut('notes', { question_id: spec, subject: '', content: rec.content || '', images: rec.images || [], updated_at: now() })
                .catch(() => { });
        }
        // 题目 id 已换成 zhenti 的 iid；优先读规范键，本地 id 作为历史兜底
        for (const q of allQuestions()) noteMap[q.id] = byKey[noteKeyOf(q.id)] || byKey[q.id] || {};
    }

    // 不熟 / 不会：复用后端 unfamiliar / dontknow 库（与真题页/刷题页同一套数据、同一套 id）
    async function loadMarks() {
        const [u, d] = [await dbAll('unfamiliar'), await dbAll('dontknow')];
        unfamSet = new Set(u.map(r => r.question_id));
        dontknowSet = new Set(d.map(r => r.question_id));
    }

    // 标记「不熟 / 不会」：互斥（标一个自动清另一个），再点已选中的即取消
    async function toggleMark(qid, kind) {
        const isU = kind === 'unfamiliar';
        const store = isU ? 'unfamiliar' : 'dontknow';
        const otherStore = isU ? 'dontknow' : 'unfamiliar';
        const set = isU ? unfamSet : dontknowSet;
        const otherSet = isU ? dontknowSet : unfamSet;
        const ex = await dbGet(store, qid);
        if (ex) {
            await dbDelete(store, qid);
            set.delete(qid);
        } else {
            await dbDelete(otherStore, qid);   // 互斥：清掉另一种标记
            otherSet.delete(qid);
            await dbPut(store, { question_id: qid, subject: activeSubject, added_at: now() });
            set.add(qid);
        }
        syncMarkBtns(qid);
        if (typeof syncStateRow === 'function') syncStateRow(qid);
        updateCounts();
        // 当前就在「不熟 / 不会」筛选下 → 取消标记后该题要移出列表，整体重渲染
        if (filter === 'unfam' || filter === 'dontknow') { render(); return; }
        renderNav();
    }

    // 就地刷新某题的两个标记按钮（不整卡重渲染，避免列表滚动位置跳动）
    function syncMarkBtns(qid) {
        const u = document.querySelector(`.dati-mark-u[data-qid="${qid}"]`);
        const d = document.querySelector(`.dati-mark-d[data-qid="${qid}"]`);
        if (u) { u.classList.toggle('on-unfam', unfamSet.has(qid)); u.title = unfamSet.has(qid) ? '取消「不熟」标记' : '标记为不熟（黄）'; }
        if (d) { d.classList.toggle('on-dk', dontknowSet.has(qid)); d.title = dontknowSet.has(qid) ? '取消「不会」标记' : '标记为不会（红）'; }
    }

    async function toggleFav(qid, subKey) {
        const ex = await dbGet('favorites', qid);
        if (ex) {
            await dbDelete('favorites', qid);
            favSet.delete(qid);
        } else {
            await dbPut('favorites', { question_id: qid, subject: subKey, added_at: now() });
            favSet.add(qid);
        }
        const btn = document.querySelector(`.dati-fav[data-qid="${qid}"]`);
        if (btn) {
            btn.textContent = favSet.has(qid) ? '★' : '☆';
            btn.classList.toggle('on', favSet.has(qid));
        }
        if (typeof syncStateRow === 'function') syncStateRow(qid);
        updateCounts();
        if (filter === 'fav') render();
    }

    // ==================== 渲染 ====================
    function renderTabs() {
        document.getElementById('datiTabs').innerHTML = DATI.map(s => `
            <button class="btn btn-secondary dati-tab${s.key === activeSubject ? ' active' : ''}"
                    onclick="switchSubject('${s.key}')">${s.name}</button>`).join('');
    }

    function switchSubject(key) {
        activeSubject = key;
        localStorage.setItem('datiSubject', key);
        chapter = '';                                   // 不同科目章名不同，旧选择必须作废
        localStorage.setItem('datiChapter', '');
        renderChapterOptions();
        renderTabs();
        loadFavs().then(() => { updateCounts(); render(); });
    }

    function renderYearOptions() {
        const years = new Set();
        for (const s of DATI) for (const c of s.chapters) for (const sec of c.sections)
            for (const q of sec.questions) if (q.real && q.year) years.add(q.year);
        const sel = document.getElementById('yearSel');
        sel.innerHTML = `<option value="">全部年份</option>` +
            [...years].sort((a, b) => b - a).map(y => `<option value="${y}">${y}年</option>`).join('');
    }

    // 「只做某一章」：下拉按当前科目的章名生成，选中后单题进度 / 列表分组 /
    // 题号导航 / 状态计数 / 顶部总览全部只在该章内（passFilter 用 chapterIds 统一门控）。
    function renderChapterOptions() {
        const sub = DATI.find(s => s.key === activeSubject);
        const sel = document.getElementById('chapterSel');
        if (!sel || !sub) return;
        const opts = sub.chapters
            .map(ch => ({ name: ch.name, n: ch.sections.reduce((k, sec) => k + sec.questions.length, 0) }))
            .filter(x => x.n > 0);                  // 0 题的骨架章不列，避免选完一片空白
        sel.innerHTML = `<option value="">全部章节</option>` +
            opts.map(x => `<option value="${x.name}">${x.name}（${x.n} 题）</option>`).join('');
        if (![...sel.options].some(o => o.value === chapter)) chapter = '';   // 切科目后旧章名失效
        sel.value = chapter;
        syncChapterIds();
    }

    function syncChapterIds() {
        const sub = DATI.find(s => s.key === activeSubject);
        chapterIds = null;
        if (!chapter || !sub) return;
        const hit = sub.chapters.find(ch => ch.name === chapter);
        if (!hit) { chapter = ''; return; }
        chapterIds = new Set();
        for (const sec of hit.sections) for (const q of sec.questions) chapterIds.add(q.id);
    }

    function setChapter(v) {
        flushDatiNote();
        chapter = v;
        localStorage.setItem('datiChapter', v);
        syncChapterIds();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // 筛选按钮/年份下拉的 UI 同步（初始化、切筛选、切模式、单题模式兜底改筛选时复用）
    function syncFilterChips() {
        document.getElementById('yearSel').style.display = mode === 'year' ? '' : 'none';
        document.getElementById('chapterSel').style.display = mode === 'chapter' ? '' : 'none';
        document.getElementById('fModeChapter').classList.toggle('active', mode === 'chapter');
        document.getElementById('fModeYear').classList.toggle('active', mode === 'year');
        document.getElementById('fStatusAll').classList.toggle('active', filter === 'all');
        document.getElementById('fFav').classList.toggle('active', filter === 'fav');
        document.getElementById('fTodo').classList.toggle('active', filter === 'todo');
        document.getElementById('fDone').classList.toggle('active', filter === 'done');
        document.getElementById('fUnfam').classList.toggle('active', filter === 'unfam');
        document.getElementById('fDontknow').classList.toggle('active', filter === 'dontknow');
    }

    // 章节模式 / 真题模式切换（只影响分组与排序，不影响题目集合）
    function setMode(m) {
        if (m !== 'chapter' && m !== 'year') return;
        if (m === mode) return;
        flushDatiNote();
        mode = m;
        localStorage.setItem('datiMode', m);
        if (m === 'year' && filter === 'fav') filter = 'all';   // 进年份视图时退出收藏等状态筛选
        syncFilterChips();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function setFilter(f) {
        // 再点一次已选中的状态即回到「全部」——原来点进「收藏/未练/不熟」后没有任何出口，
        // 只能刷新页面或靠切到年份模式兜底重置。现在「全部」胶囊与 toggle 双保险。
        if (f !== 'all' && f === filter) f = 'all';
        filter = f;
        localStorage.setItem('datiFilter', f);
        syncFilterChips();
        render();
    }

    function setYear(v) { year = v; localStorage.setItem('datiYear', v); render(); }

    function passFilter(q) {
        // 章节下拉只在「按章节」排序时生效；typeof 守卫兼容把本函数抽到沙箱单测的 harness
        if (mode === 'chapter' && typeof chapterIds !== 'undefined' && chapterIds && !chapterIds.has(q.id)) return false;
        if (mode === 'year' && year && String(q.year) !== String(year)) return false;   // 年份下拉只在真题模式生效
        if (filter === 'fav') return favSet.has(q.id);
        if (filter === 'todo') return !doneSet.has(q.id);
        if (filter === 'done') return doneSet.has(q.id);
        if (filter === 'unfam') return unfamSet.has(q.id);
        if (filter === 'dontknow') return dontknowSet.has(q.id);
        return true;
    }

    function visibleQuestionsOf(sub, pred) {
        const list = [];
        for (const c of sub.chapters) for (const sec of c.sections) for (const q of sec.questions)
            if (pred(q)) list.push(q);
        return list;
    }

    function updateCounts() {
        const sub = DATI.find(s => s.key === activeSubject);
        if (!sub) return;
        // 计数口径跟随当前排序范围：按年份且选定某年、或按章节且选定某章时只统计该范围，
        // 否则徽标显示全科全年份的数字、与列表实际条数对不上。
        const inScope = q => {
            if (mode === 'year' && year && String(q.year) !== String(year)) return false;
            if (mode === 'chapter' && typeof chapterIds !== 'undefined' && chapterIds && !chapterIds.has(q.id)) return false;
            return true;
        };
        const n = pred => visibleQuestionsOf(sub, q => inScope(q) && pred(q)).length;
        document.getElementById('cntFav').textContent = n(q => favSet.has(q.id));
        document.getElementById('cntTodo').textContent = n(q => !doneSet.has(q.id));
        document.getElementById('cntDone').textContent = n(q => doneSet.has(q.id));
        document.getElementById('cntUnfam').textContent = n(q => unfamSet.has(q.id));
        document.getElementById('cntDontknow').textContent = n(q => dontknowSet.has(q.id));
        ['cntFav', 'cntTodo', 'cntDone', 'cntUnfam', 'cntDontknow'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('zero', el.textContent === '0');
        });
    }

    // 顶部总览：当前筛选实际显示几题 / 当前排序范围共几题（随筛选实时更新）
    function updateOverview() {
        const el = document.getElementById('datiOverview');
        const sub = DATI && DATI.find(s => s.key === activeSubject);
        if (!el || !sub) return;
        const inScope = q => {
            if (mode === 'year' && year && String(q.year) !== String(year)) return false;
            if (mode === 'chapter' && typeof chapterIds !== 'undefined' && chapterIds && !chapterIds.has(q.id)) return false;
            return true;
        };
        const total = visibleQuestionsOf(sub, inScope).length;
        el.innerHTML = `当前 <b>${flatItems().length}</b> 题 · 范围共 ${total} 题`;
    }

    // ==================== 已练标记（P3：只看未练） ====================
    function toggleDone(qid) {
        if (doneSet.has(qid)) doneSet.delete(qid); else doneSet.add(qid);
        saveDoneSet();
        const btn = document.querySelector(`.dati-done-btn[data-qid="${qid}"]`);
        if (btn) {
            const done = doneSet.has(qid);
            btn.textContent = done ? '✅ 已练' : '○ 未练';
            btn.classList.toggle('done', done);
        }
        if (typeof syncStateRow === 'function') syncStateRow(qid);
        updateCounts();
        if (filter === 'todo' || filter === 'done') { render(); return; }
        renderNav();   // 其它筛选下题单不变，但导航的已练标识要刷新
    }


    function questionCard(subKey, secName, q, isFav) {
        const qid = q.id;
        ansTpl[qid] = answerHtml(q, subKey);
        const note = noteMap[qid] || {};
        const hasNote = !!(note.content || (note.images || []).length);
        const done = doneSet.has(qid);
        return `
        <div class="dati-qcard" id="q${qid}">
            <div class="dati-qhead">
                <span class="dati-qnum">${q.year ? q.year + ' 年第 ' : '第 '}${q.num} 题${q.score ? ' · ' + q.score + ' 分' : ''}</span>
                <span class="dati-qsec" title="${secName}">${secName}</span>
                ${q.real ? `<span class="dati-real">${q.year} 统考真题</span>` : ''}
                <button class="dati-fav${isFav ? ' on' : ''}" data-qid="${qid}" title="收藏本题"
                        onclick="toggleFav('${qid}', '${subKey}')">${isFav ? '★' : '☆'}</button>
            </div>
            <div class="dati-state" data-state="${qid}"></div>
            <div class="dati-qbody question-content">${questionHtml(q, subKey)}</div>
            <div class="dati-actions">
                <button class="btn btn-secondary dati-done-btn${done ? ' done' : ''}" data-qid="${qid}" title="标记是否已练过本题"
                        onclick="toggleDone('${qid}')">${done ? '✅ 已练' : '○ 未练'}</button>
                <button class="btn btn-secondary dati-ans-btn" data-qid="${qid}" onclick="toggleAnswer('${qid}')">查看答案</button>
                <button class="btn btn-secondary dati-note-btn${hasNote ? ' has-note' : ''}" data-qid="${qid}" title="我的笔记"
                        onclick="toggleNotePanel('${qid}')">📝 笔记${hasNote ? ' ●' : ''}</button>
                <button class="btn btn-secondary dati-mark-btn dati-mark-u${unfamSet.has(qid) ? ' on-unfam' : ''}" data-qid="${qid}"
                        title="${unfamSet.has(qid) ? '取消「不熟」标记' : '标记为不熟（黄）'}"
                        onclick="toggleMark('${qid}', 'unfamiliar')">🟡 不熟</button>
                <button class="btn btn-secondary dati-mark-btn dati-mark-d${dontknowSet.has(qid) ? ' on-dk' : ''}" data-qid="${qid}"
                        title="${dontknowSet.has(qid) ? '取消「不会」标记' : '标记为不会（红）'}"
                        onclick="toggleMark('${qid}', 'dontknow')">🔴 不会</button>
            </div>
            <div class="note-panel dati-note-panel" data-note="${qid}" style="${noteOpen.has(qid) ? '' : 'display:none'}">
                <div class="note-title">我的笔记</div>
                ${noteToolbarHtml()}
                <div class="note-input dati-note-input" contenteditable="true" spellcheck="false"
                    data-note-input="${qid}" data-placeholder="记下你的解题思路、易错点...（Ctrl+V 可直接粘贴截图；清空内容保存即删除笔记）"
                    onfocus="onNoteEdit('${qid}')"
                    onpaste="pasteNoteImage(event, '${qid}')"></div>
                <div class="note-images" data-note-imgs="${qid}"></div>
                <div class="note-actions">
                    <button class="btn btn-primary btn-sm note-save-btn${hasNote ? ' saved' : ''}" data-note-save="${qid}"
                            onclick="saveNote('${qid}')">保存笔记</button>
                    <span class="note-hint" data-note-hint="${qid}"></span>
                </div>
            </div>
            <div class="dati-abody" data-ans="${qid}"></div>
        </div>`;
    }

    // 展开面板一律「原地展开」：面板节点早已在 DOM 里（.dati-abody / .dati-note-panel），
    // 点按钮只切 display / open 类，**不做任何滚动**。
    // 历史三代实现都被否决：scrollIntoView({block:'nearest'}) 会向上滚把按钮顶出屏幕；
    // 按按钮位置补最小滚动量，按钮贴底时仍要滚 100+px，画面「跟着动」。
    // 现在点一下，屏幕上位置完全不变（2026-11-10，与 zhenti.js 同源）。

    function toggleAnswer(qid) {
        const box = document.querySelector(`.dati-abody[data-ans="${qid}"]`);
        const btn = document.querySelector(`.dati-ans-btn[data-qid="${qid}"]`);
        if (!box) return;
        if (box.classList.contains('open')) {
            box.classList.remove('open');
            ansOpen.delete(qid);
            saveAnsOpen();
            if (btn) btn.textContent = '查看答案';
            return;
        }
        if (!box.dataset.filled) {
            box.innerHTML = ansTpl[qid] || '';
            box.dataset.filled = '1';
        }
        box.classList.add('open');
        ansOpen.add(qid);
        saveAnsOpen();
        if (btn) btn.textContent = '收起答案';
        injectDatiSvgs(box);   // 答案里的外置 SVG 展开后才按需注入
    }

    // 单题模式：左右两枚悬浮圆形箭头（垂直居中、两侧贴边、滚动恒在）。
    // 原底部工具栏已弃用——它的「看答案」「选题」都有替代入口：题卡操作区「查看答案」
    // 与右下角「☰ 导航」浮钮；进度在看板顶部 .dati-single-prog。
    function singleArrowsHtml() {
        const items = flatItems();
        let idx = items.findIndex(it => it.q.id === singleQid);
        if (idx < 0) idx = 0;
        const atFirst = idx === 0;
        const atLast = idx === items.length - 1;
        return `<button class="dati-arrow prev" id="datiArrowPrev" onclick="singleStep(-1)"${atFirst ? ' disabled' : ''}
                    title="上一题（←）" aria-label="上一题">‹</button>
                <button class="dati-arrow next" id="datiArrowNext" onclick="singleStep(1)"${atLast ? ' disabled' : ''}
                    title="下一题（→）" aria-label="下一题">›</button>`;
    }

    // ==================== 渲染分派：单题（默认） / 列表 ====================
    function render() {
        updateCounts();     // 两种模式共用筛选条计数（单题模式无列表渲染，不能漏）
        updateOverview();   // 顶部「当前 N / 范围共 M 题」总览
        syncToolsBrief();   // 折叠条上的摘要跟着筛选/科目刷新
        if (viewMode === 'single') renderSingle(); else renderList();
        renderNav();
    }

    function setView(m) {
        if (m !== 'single' && m !== 'list') return;
        if (m === viewMode) return;
        flushDatiNote();
        viewMode = m;
        localStorage.setItem('datiView', m);
        syncViewChips();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function syncViewChips() {
        const s = document.getElementById('fSingle'), l = document.getElementById('fList');
        if (s) s.classList.toggle('active', viewMode === 'single');
        if (l) l.classList.toggle('active', viewMode === 'list');
        // 仅列表模式需要「展开全部」；单题模式下无意义
        const exp = document.getElementById('datiExpandAll');
        if (exp) exp.style.display = viewMode === 'list' ? '' : 'none';
    }

    // ---------- 单题模式：一次只渲染一道题，图片逐题按需加载 ----------
    function renderSingle() {
        const root = document.getElementById('datiRoot');
        const items = flatItems();
        if (!items.length) {
            root.innerHTML = `<div class="dati-none">该筛选条件下暂无题目</div>`;
            return;
        }
        let idx = items.findIndex(it => it.q.id === singleQid);
        if (idx < 0) idx = 0;                       // 上次的题不在当前筛选集内 → 回到第一题
        const cur = items[idx];
        singleQid = cur.q.id;
        localStorage.setItem('datiSingleQ', singleQid);
        localStorage.setItem('datiLastSeenQ', singleQid);
        const q = cur.q;
        root.innerHTML = `
            <div class="dati-single-top">
                <span class="dati-single-crumb"><b>${cur.chName}</b> · ${cur.secName}</span>
                <span class="dati-single-prog">${idx + 1} / ${items.length}</span>
            </div>
            ${questionCard(activeSubject, cur.secName, q, favSet.has(q.id))}
            ${singleArrowsHtml()}`;
        afterRender();
        activateChapterImgs(root);   // 题干图：本模式仅当前一题在 DOM 中，直接挂图
        primeAnswer(q.id);           // 答案图：与题干一并加载（节点已在 DOM、但不展开）
        prefetchSingleNeighbor(idx, items);
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // 答案图随题干一并加载：先把答案节点填进 DOM（.dati-abody 默认 display:none，不显示），
    // 于是点「看答案」只是展开、不必再等网络。列表模式不这么做——一屏多题，全量填图会把
    // 整章的答案图都拉下来，那里仍保持"点开才注入"。
    function primeAnswer(qid) {
        const box = document.querySelector(`.dati-abody[data-ans="${qid}"]`);
        if (!box || box.dataset.filled) return;   // 已展开过的题（ansOpen 恢复）无需重复填充
        box.innerHTML = ansTpl[qid] || '';
        box.dataset.filled = '1';
    }

    // 预取下一题资源：真源（真题 HTML）预取教材原图 + 外置 SVG；
    // 旧截图版回退仍预取题干首图 + 答案首图。总量固定，切题时图已就绪。
    function prefetchSingleNeighbor(idx, items) {
        const next = items[idx + 1];
        if (!next) return;
        const q = next.q;
        if (Array.isArray(q.q) && q.q[0]) new Image().src = `data/dati_figs/${activeSubject}/${q.q[0]}`;
        if (Array.isArray(q.a) && q.a[0]) new Image().src = `data/dati_figs/${activeSubject}/${q.a[0]}`;
        if (typeof q.q === 'string') prefetchSrcsIn(q.q);
        if (typeof q.a === 'string') prefetchSrcsIn(q.a);
        for (const name of (q.svgs || [])) fetchSvg(name);
    }

    // 单题模式下按顺序切题（d=±1）
    function singleStep(d) {
        const items = flatItems();
        if (!items.length) return;
        let idx = items.findIndex(it => it.q.id === singleQid);
        if (idx < 0) idx = 0;
        const t = idx + d;
        if (t < 0 || t >= items.length) return;
        flushDatiNote();
        singleQid = items[t].q.id;
        renderSingle();
        renderNav();
    }

    // 在全库按 id 找题（含所属科目）——收藏夹 / 错题本 / 搜题等入口可能跨科目跳转
    function findQuestion(qid) {
        if (!DATI) return null;
        for (const s of DATI) for (const c of s.chapters) for (const sec of c.sections)
            for (const q of sec.questions) if (q.id === qid) return { q, subKey: s.key };
        return null;
    }

    // 单题模式下直接跳到指定题（侧栏导航/收藏夹等入口复用）
    function singleGoTo(qid) {
        const hit = findQuestion(qid);
        if (!hit) return;                       // 库里没有这题，不做任何定位
        flushDatiNote();
        // 跨科目跳转：先切到该题所属科目，否则 flatItems() 里根本找不到，会静默回到第一题
        if (hit.subKey !== activeSubject) {
            activeSubject = hit.subKey;
            localStorage.setItem('datiSubject', activeSubject);
            chapter = '';
            localStorage.setItem('datiChapter', '');
            renderTabs();
            renderChapterOptions();
        }
        if (!flatItems().some(it => it.q.id === qid)) {
            // 该题不在当前筛选集内：退回「全部」状态筛选 + 全部章节后再定位，避免点了没反应
            filter = 'all';
            localStorage.setItem('datiFilter', 'all');
            year = '';
            localStorage.setItem('datiYear', '');
            chapter = '';
            localStorage.setItem('datiChapter', '');
            renderChapterOptions();
            syncFilterChips();
        }
        singleQid = qid;
        renderSingle();
        renderNav();
    }

    function renderList() {
        const sub = DATI.find(s => s.key === activeSubject);
        const root = document.getElementById('datiRoot');
        if (!sub) return;
        updateCounts();
        if (mode === 'year') { renderYearList(root); afterRender(); return; }   // 真题模式：按年份分组
        const chaptersHtml = [];
        for (const ch of sub.chapters) {
            const secHtml = [];
            for (const sec of ch.sections) {
                const qs = sec.questions.filter(q => passFilter(q));
                if (!qs.length) continue;
                const qcards = qs.map(q => questionCard(sub.key, sec.name, q, favSet.has(q.id))).join('');
                secHtml.push(`<div class="daka-card">
                    <div class="daka-card-header"><span class="dati-section-name">${sec.name}</span>
                        <span class="dati-count">${qs.length} 题</span></div>
                    ${qcards}
                </div>`);
            }
            if (!secHtml.length) continue;
            const n = secHtml.length;
            const ckey = activeSubject + '::' + ch.name;
            chaptersHtml.push(`<details class="daka-group"${openChapters.has(ckey) ? ' open' : ''} data-chkey="${ckey}">
                <summary class="daka-group-title">${ch.name}（${n} 节）</summary>
                ${secHtml.join('')}
            </details>`);
        }
        root.innerHTML = chaptersHtml.length
            ? chaptersHtml.join('')
            : `<div class="dati-none">该筛选条件下暂无题目</div>`;
        afterRender();
    }

    // 真题模式（列表）：按年份分组（每年一个可折叠组，默认收起，展开才拉题图——与章节组同一套懒加载）
    function renderYearList(root) {
        const groups = yearGroups();
        if (!groups.length) {
            root.innerHTML = `<div class="dati-none">该筛选条件下暂无题目</div>`;
            return;
        }
        root.innerHTML = groups.map(g => {
            const ckey = activeSubject + '::year::' + g.year;
            const qcards = g.items.map(it => questionCard(activeSubject, it.secName, it.q, favSet.has(it.q.id))).join('');
            return `<details class="daka-group"${openChapters.has(ckey) ? ' open' : ''} data-chkey="${ckey}">
                <summary class="daka-group-title">${g.title}（${g.items.length} 题）</summary>
                ${qcards}
            </details>`;
        }).join('');
    }

    // ==================== 题目导航栏 ====================

    function renderNav() {
        const sub = DATI.find(s => s.key === activeSubject);
        const nav = document.getElementById('datiNav');
        if (!sub) return;
        // 每年真题的卷面题号都是 41~47，只显示数字会全是一串重复的 45/46。
        // 窄条用 label（如 25-45）区分年份；旧 dati.json 无 label 时回退纯题号。
        const chip = (q, tip) => {
            const isCur = viewMode === 'single' && q.id === singleQid;
            const un = unfamSet.has(q.id), dk = dontknowSet.has(q.id);
            const txt = q.label || q.num;
            const full = `${q.year ? q.year + ' 年' : ''}第 ${q.num} 题${tip ? ' · ' + tip : ''}`;
            return `<button class="num-btn${doneSet.has(q.id) ? ' done' : ''}${un ? ' un' : ''}${dk ? ' dk' : ''}${isCur ? ' current' : ''}" data-jump="${q.id}" onclick="jumpTo('${q.id}')" title="${full}${doneSet.has(q.id) ? ' · 已练' : ''}${un ? ' · 不熟' : ''}${dk ? ' · 不会' : ''}${isCur ? ' · 当前' : ''}">${doneSet.has(q.id) ? '✅' : ''}${txt}</button>`;
        };
        const body = [];
        if (mode === 'year') {
            // 真题模式：按年份分组出题号（与单题/列表的年份倒序口径一致）
            // 每年题数是「该科目在该年的大题数」，真题各科分布本就不均（如 2016 计组只有第 44 题），
            // 标出题数避免被误看成漏题/排错。
            for (const g of yearGroups()) {
                body.push(`<div class="num-group-title" title="该年本科共 ${g.items.length} 道大题">${g.title}<span class="dati-gcount" data-count=" · ${g.items.length} 题"></span></div>
                    <div class="num-grid">${g.items.map(({ q, secName }) => chip(q, secName)).join('')}</div>`);
            }
        } else {
            for (const ch of sub.chapters) {
                const secs = [];
                for (const sec of ch.sections) {
                    const qs = sec.questions.filter(q => passFilter(q));
                    if (!qs.length) continue;
                    secs.push(`<div class="dati-nav-sec">${sec.name}<span class="dati-count">${qs.length}</span></div>
                        <div class="num-grid">${qs.map(q => chip(q, sec.name)).join('')}</div>`);
                }
                if (secs.length) body.push(`<div class="num-group-title">${ch.name}</div>${secs.join('')}`);
            }
        }
        const items = flatItems();
        const curIdx = items.findIndex(it => it.q.id === singleQid);
        // 常驻窄条用的精简题号带：按年份倒序，每年一行横排（每年仅 1~3 道大题），
        // 18 行即可铺满全卷，切题时「全部题目」都在眼前，不必滚动、不必点开抽屉。
        const byYear = new Map();
        for (const { q } of items) {
            const y = q.year || '未知';
            if (!byYear.has(y)) byYear.set(y, []);
            byYear.get(y).push(q);
        }
        const miniRows = [...byYear.keys()].sort((a, b) => (Number(b) || 0) - (Number(a) || 0)).map(y => {
            const qs = byYear.get(y).sort((a, b) => a.num - b.num);
            return `<div class="dati-nav-mini-row">
                <span class="dati-nav-mini-y">${String(y).slice(-2)}</span>
                ${qs.map(q => `<button class="dati-nav-mini-btn${doneSet.has(q.id) ? ' done' : ''}${unfamSet.has(q.id) ? ' un' : ''}${dontknowSet.has(q.id) ? ' dk' : ''}${viewMode === 'single' && q.id === singleQid ? ' current' : ''}"
                    data-jump="${q.id}" onclick="jumpTo('${q.id}')" title="${y} 年第 ${q.num} 题${unfamSet.has(q.id) ? ' · 不熟' : ''}${dontknowSet.has(q.id) ? ' · 不会' : ''}">${q.num}</button>`).join('')}
            </div>`;
        }).join('');
        nav.innerHTML = `<div class="dati-nav-head" onclick="toggleNav()">
                <span>题目导航</span>
                <span class="dati-nav-prog">${items.length ? (Math.max(curIdx, 0) + 1) + '/' + items.length : '0/0'}</span>
                <span class="close-x">✕</span></div>
            <div class="dati-nav-mini">${miniRows || '<div class="dati-nav-mini-empty">无题目</div>'}</div>
            <div class="dati-nav-body"><div class="dati-nav-legend">
                <span><i class="lg-done"></i>已练</span>
                <span><i class="lg-un"></i>不熟</span>
                <span><i class="lg-dk"></i>不会</span>
            </div>${body.join('')}</div>`;
        // 切题后回到常驻窄条（宽版展开会盖住题目）；setNav 同步收掉遮罩并恢复 FAB
        setNav(false);
        // 切题后把当前题号滚进可视区（窄条可滚动，但当前题必须一眼可见）
        const miniBox = nav.querySelector('.dati-nav-mini');
        const cur = nav.querySelector('.dati-nav-mini-btn.current');
        if (miniBox && cur) {
            const ar = cur.getBoundingClientRect(), br = miniBox.getBoundingClientRect();
            if (ar.height && br.height) {
                if (ar.top < br.top + 6) miniBox.scrollTop += ar.top - br.top - 6;
                else if (ar.bottom > br.bottom - 6) miniBox.scrollTop += ar.bottom - br.bottom + 6;
            }
        }
    }

    function setNav(open) {
        const nav = document.getElementById('datiNav');
        const fab = document.getElementById('datiNavFab');
        const mask = document.getElementById('datiNavMask');
        if (nav) nav.classList.toggle('open', open);
        if (mask) mask.classList.toggle('open', open);
        if (fab) fab.classList.toggle('hide', open);
    }

    function toggleNav() {
        const nav = document.getElementById('datiNav');
        setNav(nav ? !nav.classList.contains('open') : true);
    }

    function jumpTo(qid) {
        // 单题模式：切到该题并重渲染（只有当前题在 DOM 中，故不用滚动定位）
        if (viewMode === 'single') {
            singleGoTo(qid);
            closeNavMobile();
            return;
        }
        // 列表模式跨科目：先切科目 + 清筛选再重渲染，否则目标题卡根本不在 DOM 里
        const hit = findQuestion(qid);
        if (hit && hit.subKey !== activeSubject) {
            flushDatiNote();
            activeSubject = hit.subKey;
            localStorage.setItem('datiSubject', activeSubject);
            chapter = ''; year = ''; filter = 'all';
            localStorage.setItem('datiChapter', '');
            localStorage.setItem('datiYear', '');
            localStorage.setItem('datiFilter', 'all');
            renderTabs(); renderChapterOptions(); syncFilterChips(); render();
        }
        const el = document.getElementById('q' + qid);
        if (el) {
            const d = el.closest('details.daka-group');
            if (d) {
                if (!d.open) {
                    d.open = true;
                    activateChapterImgs(d);
                }
                openChapters.add(d.dataset.chkey);
                saveOpenChapters();
                syncExpandBtn();
            }
            localStorage.setItem('datiLastSeenQ', qid);   // E2：记住上次浏览/跳转的题
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.add('dati-flash');
            setTimeout(() => el.classList.remove('dati-flash'), 1500);
        }
        closeNavMobile();
    }

    // E2：刷新后自动定位到上次浏览的题（从收藏/未练等筛选下也能恢复）
    // 延迟到渲染与滚动恢复完成后执行，避免被 PS.restoreScroll 覆盖
    function restoreLastSeen() {
        // 单题模式：当前题已在 renderSingle 中按 singleQid 定位，无需滚动恢复
        if (viewMode === 'single') return;
        if (!lastSeenQ || filter === 'fav') return;
        setTimeout(() => {
            const el = document.getElementById('q' + lastSeenQ);
            if (!el) return;
            const d = el.closest('details.daka-group');
            if (d) {
                if (!d.open) { d.open = true; activateChapterImgs(d); }
                openChapters.add(d.dataset.chkey);
                saveOpenChapters();
                syncExpandBtn();
            }
            el.scrollIntoView({ behavior: 'auto', block: 'start' });
            el.classList.add('dati-flash');
            setTimeout(() => el.classList.remove('dati-flash'), 1500);
        }, 250);
    }

    function openNavMobile() { setNav(true); }

    function closeNavMobile() { setNav(false); }

    // ==================== 题卡状态条 ====================
    // 已练 / 不熟 / 不会 / 有笔记 / 已收藏 汇总在题头，长列表里不必逐个看按钮高亮。
    // 只改这一行的 innerHTML，不整卡重绘，避免列表滚动位置跳动。
    function syncStateRow(qid) {
        const row = document.querySelector(`#q${qid} .dati-state`);
        if (!row) return;
        const note = noteMap[qid] || {};
        const hasNote = !!(note.content || (note.images || []).length);
        row.innerHTML = [
            doneSet.has(qid) ? '<span class="dati-state-i is-done">✅ 已练</span>' : '',
            unfamSet.has(qid) ? '<span class="dati-state-i is-unfam">🟡 不熟</span>' : '',
            dontknowSet.has(qid) ? '<span class="dati-state-i is-dk">🔴 不会</span>' : '',
            hasNote ? '<span class="dati-state-i is-note">📝 有笔记</span>' : '',
            favSet.has(qid) ? '<span class="dati-state-i">★ 已收藏</span>' : '',
        ].filter(Boolean).join('');
    }

    // ==================== 笔记功能（与刷题页同款：文本框 + Ctrl+V 贴图 + 保存） ====================

    // 渲染后回填各笔记面板的文本与图片、恢复展开状态
    function afterRender() {
        const root = document.getElementById('datiRoot');
        root.querySelectorAll('.dati-state[data-state]').forEach(row => syncStateRow(row.dataset.state));
        root.querySelectorAll('.dati-note-panel').forEach(p => {
            const qid = p.dataset.note;
            initDatiNoteEditor(p);
            renderNoteImages(qid, p.querySelector('[data-note-imgs]'));
        });
        // 恢复刷新前已展开的答案面板（填充答案图 + 按钮文案）
        root.querySelectorAll('.dati-abody[data-ans]').forEach(box => {
            const qid = box.dataset.ans;
            if (!ansOpen.has(qid)) return;
            if (!box.dataset.filled) {
                box.innerHTML = ansTpl[qid] || '';
                box.dataset.filled = '1';
            }
            box.classList.add('open');
            const btn = root.querySelector(`.dati-ans-btn[data-qid="${qid}"]`);
            if (btn) btn.textContent = '收起答案';
        });
        // 恢复刷新前已打开的笔记面板的按钮高亮
        root.querySelectorAll('.dati-note-btn[data-qid]').forEach(btn => {
            if (noteOpen.has(btn.dataset.qid)) btn.classList.add('active');
        });
        root.querySelectorAll('details.daka-group').forEach(d => {
            // 已展开的章节立即激活题干图，未展开的等展开时激活（懒加载，收起不发请求）
            if (d.open) activateChapterImgs(d);
            d.addEventListener('toggle', () => {
                const k = d.dataset.chkey;
                if (d.open) { openChapters.add(k); activateChapterImgs(d); } else { openChapters.delete(k); }
                saveOpenChapters();
            });
        });
        syncExpandBtn();
        injectDatiSvgs(root);   // 题干 / 已展开答案里的外置 SVG（未展开的答案不请求）
    }

    // ==================== 章节级懒加载（E1+P2：收起章节 0 请求，展开才下题干图） ====================
    function activateChapterImgs(d) {
        if (!d) return;
        d.querySelectorAll('img[data-src]').forEach(im => {
            im.src = im.dataset.src;
            im.removeAttribute('data-src');
        });
    }

    function toggleAllChapters() {
        const root = document.getElementById('datiRoot');
        const details = [...root.querySelectorAll('details.daka-group')];
        if (!details.length) return;
        const allOpen = details.every(d => d.open);
        openChapters.clear();
        for (const d of details) {
            const willOpen = !allOpen;
            d.open = willOpen;
            if (willOpen) { openChapters.add(d.dataset.chkey); activateChapterImgs(d); }
        }
        saveOpenChapters();
        syncExpandBtn();
    }

    function syncExpandBtn() {
        const btn = document.getElementById('datiExpandAll');
        if (!btn) return;
        const root = document.getElementById('datiRoot');
        const details = [...root.querySelectorAll('details.daka-group')];
        btn.textContent = details.length && details.every(d => d.open) ? '收起全部' : '展开全部';
    }

    function toggleNotePanel(qid) {
        const p = document.querySelector(`.dati-note-panel[data-note="${qid}"]`);
        const btn = document.querySelector(`.dati-note-btn[data-qid="${qid}"]`);
        if (!p) return;
        if (p.style.display === 'none') {
            p.style.display = 'block';
            noteOpen.add(qid);
            saveNoteOpen();
            if (btn) btn.classList.add('active');
            const el = initDatiNoteEditor(p);
            if (el) el.focus({ preventScroll: true });
        } else {
            p.style.display = 'none';
            noteOpen.delete(qid);
            saveNoteOpen();
            if (btn) btn.classList.remove('active');
        }
    }

    // 进入编辑态：恢复保存按钮（取消淡化）
    function onNoteEdit(qid) {
        const btn = document.querySelector(`[data-note-save="${qid}"]`);
        if (btn) btn.classList.remove('saved');
    }

    // 富文本笔记编辑器装载（与刷题页同源）：装载内容 + 绑工具条，防双绑
    function initDatiNoteEditor(panel) {
        const el = panel.querySelector('.dati-note-input');
        if (!el) return null;
        if (!el.dataset.noteReady) {
            el.dataset.noteReady = '1';
            loadNoteIntoEditor(el, (noteMap[panel.dataset.note] || {}).content || '');
            bindNoteToolbar(el);
            el.addEventListener('input', () => onNoteInput(el));
        }
        return el;
    }

    async function saveNote(qid) {
        const el = document.querySelector(`[data-note-input="${qid}"]`);
        if (!el) return;
        const content = serializeNote(el);
        const cur = noteMap[qid] || { content: '', images: [] };
        const images = cur.images || [];
        const hadNote = !!(cur.content || images.length);
        try {
            if (content || images.length) {
                await dbPut('notes', { question_id: noteKeyOf(qid), subject: '', content, images, updated_at: now() });
                noteMap[qid] = { content, images };
            } else {
                await dbDelete('notes', noteKeyOf(qid));
                delete noteMap[qid];
            }
            const hasNote = !!(content || images.length);
            const hint = document.querySelector(`[data-note-hint="${qid}"]`);
            if (hint) {
                hint.textContent = hasNote ? '已保存 ✓' : (hadNote ? '已删除笔记' : '笔记是空的，没有保存');
                setTimeout(() => { if (hint) hint.textContent = ''; }, 2000);
            }
            const btn = document.querySelector(`[data-note-save="${qid}"]`);
            if (btn) btn.classList.toggle('saved', hasNote);
            const nbtn = document.querySelector(`.dati-note-btn[data-qid="${qid}"]`);
            if (nbtn) {
                nbtn.classList.toggle('has-note', hasNote);
                nbtn.textContent = '📝 笔记' + (hasNote ? ' ●' : '');
            }
            if (typeof syncStateRow === 'function') syncStateRow(qid);   // 同步「📝 有笔记」状态徽标
        } catch (e) {
            alert('笔记保存失败: ' + e.message);
        }
    }

    function renderNoteImages(qid, box) {
        if (!box) box = document.querySelector(`[data-note-imgs="${qid}"]`);
        if (!box) return;
        const note = noteMap[qid] || {};
        const imgs = note.images || [];
        box.innerHTML = imgs.map((src, i) => `
            <div class="note-img-item">
                <img src="${src}" alt="笔记图片" onclick="viewNoteImage('${qid}', ${i})">
                <span class="note-img-del" onclick="delNoteImage('${qid}', ${i})" title="删除图片">×</span>
            </div>`).join('');
    }

    // 压缩成最长边1200px的JPEG，控制入库体积（透明底先铺白）
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(img.src);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => reject(new Error('图片读取失败'));
            img.src = URL.createObjectURL(file);
        });
    }

    // 从剪贴板粘贴图片（截图后在笔记框 Ctrl+V），压缩后随笔记入库；纯文字粘贴不受影响
    async function pasteNoteImage(event, qid) {
        const files = [...(event.clipboardData ? event.clipboardData.items : [])]
            .filter(it => it.type.startsWith('image/'))
            .map(it => it.getAsFile())
            .filter(Boolean);
        if (!files.length) return;
        event.preventDefault();
        try {
            const cur = noteMap[qid] || { content: '', images: [] };
            for (const f of files) {
                cur.images = cur.images || [];
                cur.images.push(await compressImage(f));
            }
            noteMap[qid] = cur;
        } catch (e) { alert(e.message); }
        renderNoteImages(qid);
        saveNote(qid);   // 贴图后立即随笔记入库
    }

    function delNoteImage(qid, i) {
        const cur = noteMap[qid];
        if (!cur || !cur.images) return;
        cur.images.splice(i, 1);
        noteMap[qid] = cur;
        renderNoteImages(qid);
        saveNote(qid);
    }

    function viewNoteImage(qid, i) {
        const cur = noteMap[qid];
        if (!cur || !cur.images) return;
        const src = cur.images[i];
        if (!src) return;
        const ov = document.createElement('div');
        ov.className = 'img-lightbox';
        ov.innerHTML = `<img src="${src}" alt="笔记图片">`;
        ov.onclick = () => ov.remove();
        document.body.appendChild(ov);
    }

    // 单题模式键盘导航：← / → 切换上一题 / 下一题
    // 在笔记输入框内不拦截，避免打断输入；左右键原本无页面级行为，不与其他快捷键冲突
    document.addEventListener('keydown', e => {
        if (viewMode !== 'single') return;
        const t = e.target;
        // 编辑器（含富文本 contenteditable，jsdom 下 isContentEditable 不可靠时用 closest 兜底）
        const inEditor = t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable ||
            (t.closest && t.closest('[contenteditable="true"]')));
        if (inEditor) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); singleStep(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); singleStep(1); }
    });

    loadDati();
    // 状态持久化：页面交互状态已持久化，此处补滚动位置恢复（数据渲染完成后）
    PS.restoreScroll();
    </script>
</body>
