<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大题专项 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dati-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
        .dati-tab { flex: 1; min-width: 120px; }
        .dati-tab.active { background: #4f46e5; color: #fff; }
        .dati-subject { display: none; }
        .dati-subject.active { display: block; }
        .dati-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .dati-chip {
            padding: 6px 14px; border-radius: 999px; border: 1px solid #ccc; cursor: pointer;
            background: #fff; color: #444; font-size: 13px; line-height: 1.4;
        }
        .dark .dati-chip { background: #1e1e2e; border-color: #444; color: #ccc; }
        .dati-chip.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }
        .dati-chip .dati-count { font-size: 11px; opacity: .8; margin-left: 2px; }
        .dati-year { padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; }
        .dark .dati-year { background: #1e1e2e; border-color: #444; color: #ccc; }
        .dati-qcard {
            border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 14px;
            background: #fff;
        }
        .dark .dati-qcard { background: #1e1e2e; border-color: #333; }
        .dati-qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .dati-qnum { font-weight: 700; }
        .dati-real {
            background: #fde68a; color: #92400e; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600;
        }
        .dark .dati-real { background: #4d3800; color: #fde68a; }
        .dati-fav {
            margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: #cbd5e1;
            line-height: 1; padding: 2px 6px;
        }
        .dati-fav.on { color: #f59e0b; }
        .dati-actions { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .dati-done-btn { min-width: 84px; }
        .dati-done-btn.done { color: var(--primary); border-color: var(--primary); }
        .dati-note-btn.has-note { color: #8a6d1a; border-color: #e6d9a8; }
        .dati-note-btn.active { color: var(--primary); border-color: var(--primary); }
        /* 不熟（黄）/ 不会（红）标记按钮：与刷题页同一套语义色 */
        .dati-mark-btn.on-unfam { background: rgba(212, 175, 55, .18); border-color: #d4af37; color: #a68a1a; font-weight: 600; }
        .dati-mark-btn.on-dk { background: rgba(220, 53, 69, .14); border-color: #dc3545; color: #c82333; font-weight: 600; }
        /* 标记态自己的 hover：不落到 .btn-secondary:hover 的灰底（两者同优先级，避免顺序敏感） */
        .dati-mark-btn.on-unfam:hover { background: rgba(212, 175, 55, .3); border-color: #d4af37; color: #8f7716; }
        .dati-mark-btn.on-dk:hover { background: rgba(220, 53, 69, .24); border-color: #dc3545; color: #b21f2d; }
        .dark .dati-mark-btn.on-unfam { background: rgba(230, 199, 79, .16); border-color: #e6c74f; color: #e6c74f; }
        .dark .dati-mark-btn.on-dk { background: rgba(255, 107, 107, .16); border-color: #ff6b6b; color: #ff6b6b; }
        .dark .dati-mark-btn.on-unfam:hover { background: rgba(230, 199, 79, .26); }
        .dark .dati-mark-btn.on-dk:hover { background: rgba(255, 107, 107, .26); }
        .dati-qbody img, .dati-abody img { max-width: 100%; height: auto; display: block; margin-bottom: 6px; border-radius: 6px; }
        .dati-ans-btn { margin-top: 4px; }
        .dati-abody { margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 10px; display: none; }
        .dark .dati-abody { border-color: #444; }
        .dati-abody.open { display: block; }
        .dati-none { color: #888; padding: 20px 0; text-align: center; }
        .dark .dati-none { color: #999; }

        /* ============ 题目导航（右抽屉，默认收起） ============ */
        .dati-layout { display: block; }   /* 主区占满宽度，导航改为固定抽屉 */
        #datiRoot { min-width: 0; }
        .dati-nav {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 300px; max-width: 86vw;
            background: var(--card-bg);
            border-left: 1px solid var(--border);
            box-shadow: -6px 0 18px rgba(0,0,0,.20);
            transform: translateX(100%);          /* 默认收起到右侧屏外 */
            transition: transform .25s ease;
            z-index: 300;
            overflow-y: auto;
            display: flex; flex-direction: column;
        }
        .dati-nav.open { transform: translateX(0); }   /* 滑出 */
        .dati-nav-head {
            position: sticky; top: 0;
            padding: 12px 14px; font-weight: 600; font-size: 0.95rem;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .dati-nav-head .close-x { color: var(--text-light); font-size: 1.15rem; line-height: 1; }
        .dati-nav-body { padding: 4px 12px 18px; }
        .dati-nav-sec {
            font-size: 0.82rem; color: var(--primary); font-weight: 600;
            margin: 12px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .dati-nav-sec .dati-count { color: var(--text-light); font-weight: 400; margin-left: 4px; }
        .dati-flash { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
        .dati-nav-fab {
            display: block; position: fixed; right: 14px; bottom: 20px; z-index: 290;
            border: none; background: var(--primary); color: #fff;
            padding: 10px 16px; border-radius: 24px; font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(74,144,217,.4); cursor: pointer;
        }
        .dati-nav-fab.hide { display: none; }
        .dati-nav-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; }
        .dati-nav-mask.open { display: block; }

        /* ============ 单题模式（一题一题加载） ============ */
        .dati-view-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
        .dati-single-top {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin: 0 0 10px; font-size: .86rem; color: var(--text-light);
        }
        .dati-single-crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 72%; }
        .dati-single-crumb b { color: var(--text); font-weight: 600; }
        .dati-single-prog {
            margin-left: auto; font-weight: 700; color: var(--primary);
            font-variant-numeric: tabular-nums;
        }
        /* ============ 单题模式：左右悬浮箭头（原底部工具栏已弃用） ============ */
        /* 固定两侧、垂直居中、滚动时恒在；窄屏缩小贴边，避免压住题干 */
        .dati-arrow {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; padding: 0 0 3px;   /* 3px 光学居中 ‹ › */
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-light);
            font-size: 22px; line-height: 1; font-family: Georgia, serif;
            cursor: pointer; z-index: 60;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            transition: background .15s, color .15s, border-color .15s, box-shadow .15s, opacity .15s;
        }
        .dati-arrow:hover:not(:disabled) {
            background: var(--primary); border-color: var(--primary); color: #fff;
            box-shadow: 0 4px 14px rgba(79,70,229,.32);
        }
        .dati-arrow:active:not(:disabled) { transform: translateY(-50%) scale(.94); }
        .dati-arrow:disabled { opacity: .32; cursor: default; }
        .dati-arrow.prev { left: 10px; }
        .dati-arrow.next { right: 10px; }
        @media (max-width: 900px) {
            .dati-arrow { width: 34px; height: 34px; font-size: 19px; }
            .dati-arrow.prev { left: 3px; }
            .dati-arrow.next { right: 3px; }
        }
        .num-btn.current { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
    </style>
</head>

            <button class="dati-chip" id="fUnfam" onclick="setFilter('unfam')">🟡 不熟 <span class="dati-count" id="cntUnfam"></span></button>

    <button class="dati-nav-fab" id="datiNavFab" onclick="openNavMobile()" title="题目导航">☰ 导航</button>

    <script src="js/common.js"></script>

    <script src="js/note_richtext.js"></script>
    <script>
    let DATI = null;
    let activeSubject = localStorage.getItem('datiSubject') || 'os';
    let filter = localStorage.getItem('datiFilter') || 'all';   // all | fav | todo | done | unfam | dontknow
    let mode = localStorage.getItem('datiMode') || 'chapter';   // chapter（按章节）| year（按年份倒序）
    if (mode !== 'year') mode = 'chapter';
    if (filter === 'real') filter = 'all';                      // 旧版"统考真题"筛选已并入模式，归一
    let year = localStorage.getItem('datiYear') || '';          // '' = 全部年份（仅 year 模式生效）
    let favSet = new Set();      // 当前科目已收藏的题 id
    const ansTpl = {};           // 答案图片 HTML 模板，首次展开时注入
    let noteMap = {};            // qid -> {content, images}，dati 题笔记
    let noteOpen = new Set(JSON.parse(localStorage.getItem('datiNoteOpen') || '[]'));  // 展开中的笔记面板 qid
    let ansOpen = new Set(JSON.parse(localStorage.getItem('datiAnsOpen') || '[]'));    // 展开中的答案面板 qid
    let openChapters = new Set(JSON.parse(localStorage.getItem('datiOpenCh') || '[]'));  // 已展开的章节（默认收起，按需加载图片）
    let doneSet = new Set(JSON.parse(localStorage.getItem('datiDone') || '[]'));        // 已练过的大题 qid（只看未练筛选用）
    let unfamSet = new Set();      // 标了「不熟」的大题 qid（存后端 unfamiliar 库，与刷题页同一套）
    let dontknowSet = new Set();   // 标了「不会」的大题 qid（存后端 dontknow 库）
    let lastSeenQ = localStorage.getItem('datiLastSeenQ') || '';                         // 上次浏览/跳转的题（刷新后自动定位）
    let viewMode = localStorage.getItem('datiView') || 'single';                         // single（默认，一题一题做）| list（整章列表）
    let singleQid = localStorage.getItem('datiSingleQ') || '';                           // 单题模式当前题 id
    // 单题模式导航＝左右悬浮箭头（原底部工具栏已弃用，仅保留键盘 ← → 与箭头）

    // 当前科目 + 当前筛选下的有序题目（带章节/小节上下文）——单题模式与列表模式共用
    // 「统考真题」筛选下改为**按年份倒序**（2025 → 2009），同年内保持章节顺序：
    // 刷真题的主线是「最近年份优先」，按章节顺序会一年一年跳着出现。
    function flatItems() {
        const sub = DATI.find(s => s.key === activeSubject);
        if (!sub) return [];
        const out = [];
        for (const ch of sub.chapters)
            for (const sec of ch.sections)
                for (const q of sec.questions)
                    if (passFilter(q)) out.push({ q, chName: ch.name, secName: sec.name });
        if (mode === 'year') out.sort((a, b) => (Number(b.q.year) || 0) - (Number(a.q.year) || 0));
        return out;
    }

    // 真题模式按年份分组：[{ year, title, items:[{q,chName,secName}] }]，年份倒序。
    // 列表模式与右侧导航共用，保证「排序」与「分组」口径一致。
    function yearGroups() {
        const map = new Map();
        for (const it of flatItems()) {
            const y = it.q.year || '未知';
            if (!map.has(y)) map.set(y, []);
            map.get(y).push(it);
        }
        return [...map.keys()]
            .sort((a, b) => (Number(b) || 0) - (Number(a) || 0))
            .map(y => ({ year: y, title: `${y} 年统考真题`, items: map.get(y) }));
    }

    // 切题前把未保存的笔记落库（单题模式下切换/跳题前调用），避免输入内容丢失
    function flushDatiNote() {
        const openPanel = [...document.querySelectorAll('.dati-note-panel[data-note]')]
            .find(p => p.style.display !== 'none');
        if (!openPanel) return;
        const qid = openPanel.dataset.note;
        const el = openPanel.querySelector('.dati-note-input');
        if (!el) return;
        const cur = noteMap[qid] || { content: '', images: [] };
        if (serializeNote(el) !== (cur.content || '')) saveNote(qid);   // 内容有变动才写库
    }

    function saveDoneSet() {
        localStorage.setItem('datiDone', JSON.stringify([...doneSet]));
    }

    function saveOpenChapters() {
        localStorage.setItem('datiOpenCh', JSON.stringify([...openChapters]));
    }
    function saveAnsOpen() {
        localStorage.setItem('datiAnsOpen', JSON.stringify([...ansOpen]));
    }
    function saveNoteOpen() {
        localStorage.setItem('datiNoteOpen', JSON.stringify([...noteOpen]));
    }

    // 题干图：data-src 惰挂载（章节收起时不发请求，展开时才激活为 src——见 activateChapterImgs）
    const qimg = (key, fn) => `<img data-src="data/dati_figs/${key}/${fn}" loading="lazy" alt="大题截图">`;
    // 答案图：答案面板本身惰性注入，展开时才进 DOM，直接带 src
    const aimg = (key, fn) => `<img src="data/dati_figs/${key}/${fn}" loading="lazy" alt="大题答案">`;

    // ==================== 数据与收藏 ====================
    async function loadDati() {
        try {
            const resp = await fetch('data/dati.json');
            DATI = (await resp.json()).subjects;
            await loadFavs();
            await loadNoteAlias();   // 先取跨页笔记映射，loadNotes 才能把规范键回填到本地键
            await loadNotes();
            await loadMarks();
            renderTabs();
            renderYearOptions();
            // 恢复上次的筛选/年份/视图模式 UI 状态
            syncFilterChips();
            document.getElementById('yearSel').value = year;
            syncViewChips();
            render();
            restoreLastSeen();
        } catch (e) {
            document.getElementById('datiRoot').innerHTML = `<div class="error">加载失败</div>`;
        }
    }

    async function loadFavs() {
        const rows = await dbAll('favorites');
        favSet = new Set(rows.filter(r => (r.question_id || '').startsWith('dati_')).map(r => r.question_id));
    }

    // 跨页笔记：与 zhenti/daka 共用规范键 zt{年}_{卷面题号}（data/note_alias.json）
    let NOTE_ALIAS = {};
    const noteKeyOf = k => NOTE_ALIAS[k] || k;
    async function loadNoteAlias() {
        try { NOTE_ALIAS = await fetch('data/note_alias.json').then(r => r.json()); } catch (e) { NOTE_ALIAS = {}; }
    }

    async function loadNotes() {
        const rows = await dbAll('notes');
        noteMap = {};
        const byKey = {};
        for (const n of rows) byKey[n.question_id] = { content: n.content || '', images: n.images || [] };
        // 规范键（真题页/打卡表写的）回填到本题的 dati_* 键；dati_* 独有内容静默迁移到规范键
        const todo = [];
        for (const local in NOTE_ALIAS) {
            if (!local.startsWith('dati_')) continue;
            const spec = NOTE_ALIAS[local];
            if (!spec || spec === local) continue;
            if (byKey[spec]) { if (!byKey[local]) byKey[local] = byKey[spec]; continue; }
            if (byKey[local]) todo.push([spec, byKey[local]]);
        }
        for (const [spec, rec] of todo) {
            dbPut('notes', { question_id: spec, subject: 'dati', content: rec.content || '', images: rec.images || [], updated_at: now() })
                .catch(() => { });
        }
        for (const k in byKey) if (k.startsWith('dati_')) noteMap[k] = byKey[k];
    }

    // 不熟 / 不会：复用后端 unfamiliar / dontknow 库（与刷题页同一套数据），只取大题（dati_ 前缀）
    async function loadMarks() {
        const [u, d] = [await dbAll('unfamiliar'), await dbAll('dontknow')];
        unfamSet = new Set(u.filter(r => (r.question_id || '').startsWith('dati_')).map(r => r.question_id));
        dontknowSet = new Set(d.filter(r => (r.question_id || '').startsWith('dati_')).map(r => r.question_id));
    }

    // 标记「不熟 / 不会」：互斥（标一个自动清另一个），再点已选中的即取消
    async function toggleMark(qid, kind) {
        const isU = kind === 'unfamiliar';
        const store = isU ? 'unfamiliar' : 'dontknow';
        const otherStore = isU ? 'dontknow' : 'unfamiliar';
        const set = isU ? unfamSet : dontknowSet;
        const otherSet = isU ? dontknowSet : unfamSet;
        const ex = await dbGet(store, qid);
        if (ex) {
            await dbDelete(store, qid);
            set.delete(qid);
        } else {
            await dbDelete(otherStore, qid);   // 互斥：清掉另一种标记
            otherSet.delete(qid);
            await dbPut(store, { question_id: qid, subject: activeSubject, added_at: now() });
            set.add(qid);
        }
        syncMarkBtns(qid);
        updateCounts();
        // 当前就在「不熟 / 不会」筛选下 → 取消标记后该题要移出列表，整体重渲染
        if (filter === 'unfam' || filter === 'dontknow') { render(); return; }
        renderNav();
    }

    // 就地刷新某题的两个标记按钮（不整卡重渲染，避免列表滚动位置跳动）
    function syncMarkBtns(qid) {
        const u = document.querySelector(`.dati-mark-u[data-qid="${qid}"]`);
        const d = document.querySelector(`.dati-mark-d[data-qid="${qid}"]`);
        if (u) { u.classList.toggle('on-unfam', unfamSet.has(qid)); u.title = unfamSet.has(qid) ? '取消「不熟」标记' : '标记为不熟（黄）'; }
        if (d) { d.classList.toggle('on-dk', dontknowSet.has(qid)); d.title = dontknowSet.has(qid) ? '取消「不会」标记' : '标记为不会（红）'; }
    }

    async function toggleFav(qid, subKey) {
        const ex = await dbGet('favorites', qid);
        if (ex) {
            await dbDelete('favorites', qid);
            favSet.delete(qid);
        } else {
            await dbPut('favorites', { question_id: qid, subject: subKey, added_at: now() });
            favSet.add(qid);
        }
        const btn = document.querySelector(`.dati-fav[data-qid="${qid}"]`);
        if (btn) {
            btn.textContent = favSet.has(qid) ? '★' : '☆';
            btn.classList.toggle('on', favSet.has(qid));
        }
        updateCounts();
        if (filter === 'fav') render();
    }

    // ==================== 渲染 ====================
    function renderTabs() {
        document.getElementById('datiTabs').innerHTML = DATI.map(s => `
            <button class="btn btn-secondary dati-tab${s.key === activeSubject ? ' active' : ''}"
                    onclick="switchSubject('${s.key}')">${s.name}</button>`).join('');
    }

    function switchSubject(key) {
        activeSubject = key;
        localStorage.setItem('datiSubject', key);
        renderTabs();
        loadFavs().then(() => { updateCounts(); render(); });
    }

    function renderYearOptions() {
        const years = new Set();
        for (const s of DATI) for (const c of s.chapters) for (const sec of c.sections)
            for (const q of sec.questions) if (q.real && q.year) years.add(q.year);
        const sel = document.getElementById('yearSel');
        sel.innerHTML = `<option value="">全部年份</option>` +
            [...years].sort((a, b) => b - a).map(y => `<option value="${y}">${y}年</option>`).join('');
    }

    // 筛选按钮/年份下拉的 UI 同步（初始化、切筛选、切模式、单题模式兜底改筛选时复用）
    function syncFilterChips() {
        document.getElementById('yearSel').style.display = mode === 'year' ? '' : 'none';
        document.getElementById('fModeChapter').classList.toggle('active', mode === 'chapter');
        document.getElementById('fModeYear').classList.toggle('active', mode === 'year');
        document.getElementById('fFav').classList.toggle('active', filter === 'fav');
        document.getElementById('fTodo').classList.toggle('active', filter === 'todo');
        document.getElementById('fDone').classList.toggle('active', filter === 'done');
        document.getElementById('fUnfam').classList.toggle('active', filter === 'unfam');
        document.getElementById('fDontknow').classList.toggle('active', filter === 'dontknow');
    }

    // 章节模式 / 真题模式切换（只影响分组与排序，不影响题目集合）
    function setMode(m) {
        if (m !== 'chapter' && m !== 'year') return;
        if (m === mode) return;
        flushDatiNote();
        mode = m;
        localStorage.setItem('datiMode', m);
        if (m === 'year' && filter === 'fav') filter = 'all';   // 进年份视图时退出收藏等状态筛选
        syncFilterChips();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function setFilter(f) {
        filter = f;
        localStorage.setItem('datiFilter', f);
        syncFilterChips();
        render();
    }

    function setYear(v) { year = v; localStorage.setItem('datiYear', v); render(); }

    function passFilter(q) {
        if (mode === 'year' && year && String(q.year) !== String(year)) return false;   // 年份下拉只在真题模式生效
        if (filter === 'fav') return favSet.has(q.id);
        if (filter === 'todo') return !doneSet.has(q.id);
        if (filter === 'done') return doneSet.has(q.id);
        if (filter === 'unfam') return unfamSet.has(q.id);
        if (filter === 'dontknow') return dontknowSet.has(q.id);
        return true;
    }

    function visibleQuestionsOf(sub, pred) {
        const list = [];
        for (const c of sub.chapters) for (const sec of c.sections) for (const q of sec.questions)
            if (pred(q)) list.push(q);
        return list;
    }

    function updateCounts() {
        const sub = DATI.find(s => s.key === activeSubject);
        if (!sub) return;
        document.getElementById('cntFav').textContent = visibleQuestionsOf(sub, q => favSet.has(q.id)).length;
        document.getElementById('cntTodo').textContent = visibleQuestionsOf(sub, q => !doneSet.has(q.id)).length;
        document.getElementById('cntDone').textContent = visibleQuestionsOf(sub, q => doneSet.has(q.id)).length;
        document.getElementById('cntUnfam').textContent = visibleQuestionsOf(sub, q => unfamSet.has(q.id)).length;
        document.getElementById('cntDontknow').textContent = visibleQuestionsOf(sub, q => dontknowSet.has(q.id)).length;
    }

    // ==================== 已练标记（P3：只看未练） ====================
    function toggleDone(qid) {
        if (doneSet.has(qid)) doneSet.delete(qid); else doneSet.add(qid);
        saveDoneSet();
        const btn = document.querySelector(`.dati-done-btn[data-qid="${qid}"]`);
        if (btn) {
            const done = doneSet.has(qid);
            btn.textContent = done ? '✅ 已练' : '○ 未练';
            btn.classList.toggle('done', done);
        }
        updateCounts();
        if (filter === 'todo' || filter === 'done') { render(); return; }
        renderNav();   // 其它筛选下题单不变，但导航的已练标识要刷新
    }


    function questionCard(subKey, secName, q, isFav) {
        const qid = q.id;
        ansTpl[qid] = q.a.length ? q.a.map(fn => aimg(subKey, fn)).join('') : '<div class="dati-none">本题暂无答案截图</div>';
        const note = noteMap[qid] || {};
        const hasNote = !!(note.content || (note.images || []).length);
        const done = doneSet.has(qid);
        return `
        <div class="dati-qcard" id="q${qid}">
            <div class="dati-qhead">
                <span class="dati-qnum">第 ${q.num} 题</span>
                ${q.real ? `<span class="dati-real">【${q.year}统考真题】</span>` : ''}
                <button class="dati-fav${isFav ? ' on' : ''}" data-qid="${qid}" title="收藏本题"
                        onclick="toggleFav('${qid}', '${subKey}')">${isFav ? '★' : '☆'}</button>
            </div>
            <div class="dati-qbody">${q.q.map(fn => qimg(subKey, fn)).join('')}</div>
            <div class="dati-actions">
                <button class="btn btn-secondary dati-done-btn${done ? ' done' : ''}" data-qid="${qid}" title="标记是否已练过本题"
                        onclick="toggleDone('${qid}')">${done ? '✅ 已练' : '○ 未练'}</button>
                <button class="btn btn-secondary dati-ans-btn" data-qid="${qid}" onclick="toggleAnswer('${qid}')">查看答案</button>
                <button class="btn btn-secondary dati-note-btn${hasNote ? ' has-note' : ''}" data-qid="${qid}" title="我的笔记"
                        onclick="toggleNotePanel('${qid}')">📝 笔记${hasNote ? ' ●' : ''}</button>
                <button class="btn btn-secondary dati-mark-btn dati-mark-u${unfamSet.has(qid) ? ' on-unfam' : ''}" data-qid="${qid}"
                        title="${unfamSet.has(qid) ? '取消「不熟」标记' : '标记为不熟（黄）'}"
                        onclick="toggleMark('${qid}', 'unfamiliar')">🟡 不熟</button>
                <button class="btn btn-secondary dati-mark-btn dati-mark-d${dontknowSet.has(qid) ? ' on-dk' : ''}" data-qid="${qid}"
                        title="${dontknowSet.has(qid) ? '取消「不会」标记' : '标记为不会（红）'}"
                        onclick="toggleMark('${qid}', 'dontknow')">🔴 不会</button>
            </div>
            <div class="note-panel dati-note-panel" data-note="${qid}" style="${noteOpen.has(qid) ? '' : 'display:none'}">
                <div class="note-title">我的笔记</div>
                ${noteToolbarHtml()}
                <div class="note-input dati-note-input" contenteditable="true" spellcheck="false"
                    data-note-input="${qid}" data-placeholder="记下你的解题思路、易错点...（Ctrl+V 可直接粘贴截图；清空内容保存即删除笔记）"
                    onfocus="onNoteEdit('${qid}')"
                    onpaste="pasteNoteImage(event, '${qid}')"></div>
                <div class="note-images" data-note-imgs="${qid}"></div>
                <div class="note-actions">
                    <button class="btn btn-primary btn-sm note-save-btn${hasNote ? ' saved' : ''}" data-note-save="${qid}"
                            onclick="saveNote('${qid}')">保存笔记</button>
                    <span class="note-hint" data-note-hint="${qid}"></span>
                </div>
            </div>
            <div class="dati-abody" data-ans="${qid}"></div>
        </div>`;
    }

    function toggleAnswer(qid) {
        const box = document.querySelector(`.dati-abody[data-ans="${qid}"]`);
        const btn = document.querySelector(`.dati-ans-btn[data-qid="${qid}"]`);
        if (!box) return;
        if (box.classList.contains('open')) {
            box.classList.remove('open');
            ansOpen.delete(qid);
            saveAnsOpen();
            if (btn) btn.textContent = '查看答案';
            return;
        }
        if (!box.dataset.filled) {
            box.innerHTML = ansTpl[qid] || '';
            box.dataset.filled = '1';
        }
        box.classList.add('open');
        ansOpen.add(qid);
        saveAnsOpen();
        if (btn) btn.textContent = '收起答案';
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 单题模式：左右两枚悬浮圆形箭头（垂直居中、两侧贴边、滚动恒在）。
    // 原底部工具栏已弃用——它的「看答案」「选题」都有替代入口：题卡操作区「查看答案」
    // 与右下角「☰ 导航」浮钮；进度在看板顶部 .dati-single-prog。
    function singleArrowsHtml() {
        const items = flatItems();
        let idx = items.findIndex(it => it.q.id === singleQid);
        if (idx < 0) idx = 0;
        const atFirst = idx === 0;
        const atLast = idx === items.length - 1;
        return `<button class="dati-arrow prev" id="datiArrowPrev" onclick="singleStep(-1)"${atFirst ? ' disabled' : ''}
                    title="上一题（←）" aria-label="上一题">‹</button>
                <button class="dati-arrow next" id="datiArrowNext" onclick="singleStep(1)"${atLast ? ' disabled' : ''}
                    title="下一题（→）" aria-label="下一题">›</button>`;
    }

    // ==================== 渲染分派：单题（默认） / 列表 ====================
    function render() {
        updateCounts();   // 两种模式共用筛选条计数（单题模式无列表渲染，不能漏）
        if (viewMode === 'single') renderSingle(); else renderList();
        renderNav();
    }

    function setView(m) {
        if (m !== 'single' && m !== 'list') return;
        if (m === viewMode) return;
        flushDatiNote();
        viewMode = m;
        localStorage.setItem('datiView', m);
        syncViewChips();
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function syncViewChips() {
        const s = document.getElementById('fSingle'), l = document.getElementById('fList');
        if (s) s.classList.toggle('active', viewMode === 'single');
        if (l) l.classList.toggle('active', viewMode === 'list');
        // 仅列表模式需要「展开全部」；单题模式下无意义
        const exp = document.getElementById('datiExpandAll');
        if (exp) exp.style.display = viewMode === 'list' ? '' : 'none';
    }

    // ---------- 单题模式：一次只渲染一道题，图片逐题按需加载 ----------
    function renderSingle() {
        const root = document.getElementById('datiRoot');
        const items = flatItems();
        if (!items.length) {
            root.innerHTML = `<div class="dati-none">该筛选条件下暂无题目</div>`;
            return;
        }
        let idx = items.findIndex(it => it.q.id === singleQid);
        if (idx < 0) idx = 0;                       // 上次的题不在当前筛选集内 → 回到第一题
        const cur = items[idx];
        singleQid = cur.q.id;
        localStorage.setItem('datiSingleQ', singleQid);
        localStorage.setItem('datiLastSeenQ', singleQid);
        const q = cur.q;
        root.innerHTML = `
            <div class="dati-single-top">
                <span class="dati-single-crumb"><b>${cur.chName}</b> · ${cur.secName}</span>
                <span class="dati-single-prog">${idx + 1} / ${items.length}</span>
            </div>
            ${questionCard(activeSubject, cur.secName, q, favSet.has(q.id))}
            ${singleArrowsHtml()}`;
        afterRender();
        activateChapterImgs(root);   // 题干图：本模式仅当前一题在 DOM 中，直接挂图
        primeAnswer(q.id);           // 答案图：与题干一并加载（节点已在 DOM、但不展开）
        prefetchSingleNeighbor(idx, items);
        window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // 答案图随题干一并加载：先把答案节点填进 DOM（.dati-abody 默认 display:none，不显示），
    // 于是点「看答案」只是展开、不必再等网络。列表模式不这么做——一屏多题，全量填图会把
    // 整章的答案图都拉下来，那里仍保持"点开才注入"。
    function primeAnswer(qid) {
        const box = document.querySelector(`.dati-abody[data-ans="${qid}"]`);
        if (!box || box.dataset.filled) return;   // 已展开过的题（ansOpen 恢复）无需重复填充
        box.innerHTML = ansTpl[qid] || '';
        box.dataset.filled = '1';
    }

    // 预取下一题的题干首图 + 答案首图（各 1 张）：切到下一题时题干与答案都已就绪
    // 总量固定 2 张，仍属逐题加载，不会累积整章请求
    function prefetchSingleNeighbor(idx, items) {
        const next = items[idx + 1];
        if (!next) return;
        const firstQ = next.q.q[0];
        if (firstQ) new Image().src = `data/dati_figs/${activeSubject}/${firstQ}`;
        const firstA = next.q.a && next.q.a[0];
        if (firstA) new Image().src = `data/dati_figs/${activeSubject}/${firstA}`;
    }

    // 单题模式下按顺序切题（d=±1）
    function singleStep(d) {
        const items = flatItems();
        if (!items.length) return;
        let idx = items.findIndex(it => it.q.id === singleQid);
        if (idx < 0) idx = 0;
        const t = idx + d;
        if (t < 0 || t >= items.length) return;
        flushDatiNote();
        singleQid = items[t].q.id;
        renderSingle();
        renderNav();
    }

    // 单题模式下直接跳到指定题（侧栏导航/收藏夹等入口复用）
    function singleGoTo(qid) {
        const items = flatItems();
        if (!items.some(it => it.q.id === qid)) {
            // 该题不在当前筛选集内：退回「全部」筛选后再定位，避免点了没反应
            flushDatiNote();
            filter = 'all';
            localStorage.setItem('datiFilter', 'all');
            syncFilterChips();
        }
        flushDatiNote();
        singleQid = qid;
        renderSingle();
        renderNav();
    }

    function renderList() {
        const sub = DATI.find(s => s.key === activeSubject);
        const root = document.getElementById('datiRoot');
        if (!sub) return;
        updateCounts();
        if (mode === 'year') { renderYearList(root); afterRender(); return; }   // 真题模式：按年份分组
        const chaptersHtml = [];
        for (const ch of sub.chapters) {
            const secHtml = [];
            for (const sec of ch.sections) {
                const qs = sec.questions.filter(q => passFilter(q));
                if (!qs.length) continue;
                const qcards = qs.map(q => questionCard(sub.key, sec.name, q, favSet.has(q.id))).join('');
                secHtml.push(`<div class="daka-card">
                    <div class="daka-card-header"><span class="dati-section-name">${sec.name}</span>
                        <span class="dati-count">${qs.length} 题</span></div>
                    ${qcards}
                </div>`);
            }
            if (!secHtml.length) continue;
            const n = secHtml.length;
            const ckey = activeSubject + '::' + ch.name;
            chaptersHtml.push(`<details class="daka-group"${openChapters.has(ckey) ? ' open' : ''} data-chkey="${ckey}">
                <summary class="daka-group-title">${ch.name}（${n} 节）</summary>
                ${secHtml.join('')}
            </details>`);
        }
        root.innerHTML = chaptersHtml.length
            ? chaptersHtml.join('')
            : `<div class="dati-none">该筛选条件下暂无题目</div>`;
        afterRender();
    }

    // 真题模式（列表）：按年份分组（每年一个可折叠组，默认收起，展开才拉题图——与章节组同一套懒加载）
    function renderYearList(root) {
        const groups = yearGroups();
        if (!groups.length) {
            root.innerHTML = `<div class="dati-none">该筛选条件下暂无题目</div>`;
            return;
        }
        root.innerHTML = groups.map(g => {
            const ckey = activeSubject + '::year::' + g.year;
            const qcards = g.items.map(it => questionCard(activeSubject, it.secName, it.q, favSet.has(it.q.id))).join('');
            return `<details class="daka-group"${openChapters.has(ckey) ? ' open' : ''} data-chkey="${ckey}">
                <summary class="daka-group-title">${g.title}（${g.items.length} 题）</summary>
                ${qcards}
            </details>`;
        }).join('');
    }

    // ==================== 题目导航栏 ====================

    function renderNav() {
        const sub = DATI.find(s => s.key === activeSubject);
        const nav = document.getElementById('datiNav');
        if (!sub) return;
        const chip = (q, tip) => {
            const isCur = viewMode === 'single' && q.id === singleQid;
            return `<button class="num-btn${doneSet.has(q.id) ? ' done' : ''}${isCur ? ' current' : ''}" data-jump="${q.id}" onclick="jumpTo('${q.id}')" title="${tip}${doneSet.has(q.id) ? ' · 已练' : ''}${isCur ? ' · 当前' : ''}">${doneSet.has(q.id) ? '✅' : ''}${q.num}</button>`;
        };
        const body = [];
        if (mode === 'year') {
            // 真题模式：按年份分组出题号（与单题/列表的年份倒序口径一致）
            for (const g of yearGroups()) {
                body.push(`<div class="num-group-title">${g.title}</div>
                    <div class="num-grid">${g.items.map(({ q, secName }) => chip(q, secName)).join('')}</div>`);
            }
        } else {
            for (const ch of sub.chapters) {
                const secs = [];
                for (const sec of ch.sections) {
                    const qs = sec.questions.filter(q => passFilter(q));
                    if (!qs.length) continue;
                    secs.push(`<div class="dati-nav-sec">${sec.name}<span class="dati-count">${qs.length}</span></div>
                        <div class="num-grid">${qs.map(q => chip(q, sec.name)).join('')}</div>`);
                }
                if (secs.length) body.push(`<div class="num-group-title">${ch.name}</div>${secs.join('')}`);
            }
        }
        nav.innerHTML = `<div class="dati-nav-head" onclick="toggleNav()">题目导航<span class="close-x">✕</span></div>
            <div class="dati-nav-body">${body.join('')}</div>`;
        nav.classList.remove('open');   // 每次重渲染后保持收起
    }

    function setNav(open) {
        const nav = document.getElementById('datiNav');
        const fab = document.getElementById('datiNavFab');
        const mask = document.getElementById('datiNavMask');
        if (nav) nav.classList.toggle('open', open);
        if (mask) mask.classList.toggle('open', open);
        if (fab) fab.classList.toggle('hide', open);
    }

    function toggleNav() {
        const nav = document.getElementById('datiNav');
        setNav(nav ? !nav.classList.contains('open') : true);
    }

    function jumpTo(qid) {
        // 单题模式：切到该题并重渲染（只有当前题在 DOM 中，故不用滚动定位）
        if (viewMode === 'single') {
            singleGoTo(qid);
            closeNavMobile();
            return;
        }
        const el = document.getElementById('q' + qid);
        if (el) {
            const d = el.closest('details.daka-group');
            if (d) {
                if (!d.open) {
                    d.open = true;
                    activateChapterImgs(d);
                }
                openChapters.add(d.dataset.chkey);
                saveOpenChapters();
                syncExpandBtn();
            }
            localStorage.setItem('datiLastSeenQ', qid);   // E2：记住上次浏览/跳转的题
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.add('dati-flash');
            setTimeout(() => el.classList.remove('dati-flash'), 1500);
        }
        closeNavMobile();
    }

    // E2：刷新后自动定位到上次浏览的题（从收藏/未练等筛选下也能恢复）
    // 延迟到渲染与滚动恢复完成后执行，避免被 PS.restoreScroll 覆盖
    function restoreLastSeen() {
        // 单题模式：当前题已在 renderSingle 中按 singleQid 定位，无需滚动恢复
        if (viewMode === 'single') return;
        if (!lastSeenQ || filter === 'fav') return;
        setTimeout(() => {
            const el = document.getElementById('q' + lastSeenQ);
            if (!el) return;
            const d = el.closest('details.daka-group');
            if (d) {
                if (!d.open) { d.open = true; activateChapterImgs(d); }
                openChapters.add(d.dataset.chkey);
                saveOpenChapters();
                syncExpandBtn();
            }
            el.scrollIntoView({ behavior: 'auto', block: 'start' });
            el.classList.add('dati-flash');
            setTimeout(() => el.classList.remove('dati-flash'), 1500);
        }, 250);
    }

    function openNavMobile() { setNav(true); }

    function closeNavMobile() { setNav(false); }

    // ==================== 笔记功能（与刷题页同款：文本框 + Ctrl+V 贴图 + 保存） ====================

    // 渲染后回填各笔记面板的文本与图片、恢复展开状态
    function afterRender() {
        const root = document.getElementById('datiRoot');
        root.querySelectorAll('.dati-note-panel').forEach(p => {
            const qid = p.dataset.note;
            initDatiNoteEditor(p);
            renderNoteImages(qid, p.querySelector('[data-note-imgs]'));
        });
        // 恢复刷新前已展开的答案面板（填充答案图 + 按钮文案）
        root.querySelectorAll('.dati-abody[data-ans]').forEach(box => {
            const qid = box.dataset.ans;
            if (!ansOpen.has(qid)) return;
            if (!box.dataset.filled) {
                box.innerHTML = ansTpl[qid] || '';
                box.dataset.filled = '1';
            }
            box.classList.add('open');
            const btn = root.querySelector(`.dati-ans-btn[data-qid="${qid}"]`);
            if (btn) btn.textContent = '收起答案';
        });
        // 恢复刷新前已打开的笔记面板的按钮高亮
        root.querySelectorAll('.dati-note-btn[data-qid]').forEach(btn => {
            if (noteOpen.has(btn.dataset.qid)) btn.classList.add('active');
        });
        root.querySelectorAll('details.daka-group').forEach(d => {
            // 已展开的章节立即激活题干图，未展开的等展开时激活（懒加载，收起不发请求）
            if (d.open) activateChapterImgs(d);
            d.addEventListener('toggle', () => {
                const k = d.dataset.chkey;
                if (d.open) { openChapters.add(k); activateChapterImgs(d); } else { openChapters.delete(k); }
                saveOpenChapters();
            });
        });
        syncExpandBtn();
    }

    // ==================== 章节级懒加载（E1+P2：收起章节 0 请求，展开才下题干图） ====================
    function activateChapterImgs(d) {
        if (!d) return;
        d.querySelectorAll('img[data-src]').forEach(im => {
            im.src = im.dataset.src;
            im.removeAttribute('data-src');
        });
    }

    function toggleAllChapters() {
        const root = document.getElementById('datiRoot');
        const details = [...root.querySelectorAll('details.daka-group')];
        if (!details.length) return;
        const allOpen = details.every(d => d.open);
        openChapters.clear();
        for (const d of details) {
            const willOpen = !allOpen;
            d.open = willOpen;
            if (willOpen) { openChapters.add(d.dataset.chkey); activateChapterImgs(d); }
        }
        saveOpenChapters();
        syncExpandBtn();
    }

    function syncExpandBtn() {
        const btn = document.getElementById('datiExpandAll');
        if (!btn) return;
        const root = document.getElementById('datiRoot');
        const details = [...root.querySelectorAll('details.daka-group')];
        btn.textContent = details.length && details.every(d => d.open) ? '收起全部' : '展开全部';
    }

    function toggleNotePanel(qid) {
        const p = document.querySelector(`.dati-note-panel[data-note="${qid}"]`);
        const btn = document.querySelector(`.dati-note-btn[data-qid="${qid}"]`);
        if (!p) return;
        if (p.style.display === 'none') {
            p.style.display = 'block';
            noteOpen.add(qid);
            saveNoteOpen();
            if (btn) btn.classList.add('active');
            const el = initDatiNoteEditor(p);
            if (el) el.focus();
        } else {
            p.style.display = 'none';
            noteOpen.delete(qid);
            saveNoteOpen();
            if (btn) btn.classList.remove('active');
        }
    }

    // 进入编辑态：恢复保存按钮（取消淡化）
    function onNoteEdit(qid) {
        const btn = document.querySelector(`[data-note-save="${qid}"]`);
        if (btn) btn.classList.remove('saved');
    }

    // 富文本笔记编辑器装载（与刷题页同源）：装载内容 + 绑工具条，防双绑
    function initDatiNoteEditor(panel) {
        const el = panel.querySelector('.dati-note-input');
        if (!el) return null;
        if (!el.dataset.noteReady) {
            el.dataset.noteReady = '1';
            loadNoteIntoEditor(el, (noteMap[panel.dataset.note] || {}).content || '');
            bindNoteToolbar(el);
        }
        return el;
    }

    async function saveNote(qid) {
        const el = document.querySelector(`[data-note-input="${qid}"]`);
        if (!el) return;
        const content = serializeNote(el);
        const cur = noteMap[qid] || { content: '', images: [] };
        const images = cur.images || [];
        const hadNote = !!(cur.content || images.length);
        try {
            if (content || images.length) {
                await dbPut('notes', { question_id: noteKeyOf(qid), subject: 'dati', content, images, updated_at: now() });
                noteMap[qid] = { content, images };
            } else {
                await dbDelete('notes', noteKeyOf(qid));
                delete noteMap[qid];
            }
            const hasNote = !!(content || images.length);
            const hint = document.querySelector(`[data-note-hint="${qid}"]`);
            if (hint) {
                hint.textContent = hasNote ? '已保存 ✓' : (hadNote ? '已删除笔记' : '笔记是空的，没有保存');
                setTimeout(() => { if (hint) hint.textContent = ''; }, 2000);
            }
            const btn = document.querySelector(`[data-note-save="${qid}"]`);
            if (btn) btn.classList.toggle('saved', hasNote);
            const nbtn = document.querySelector(`.dati-note-btn[data-qid="${qid}"]`);
            if (nbtn) {
                nbtn.classList.toggle('has-note', hasNote);
                nbtn.textContent = '📝 笔记' + (hasNote ? ' ●' : '');
            }
        } catch (e) {
            alert('笔记保存失败: ' + e.message);
        }
    }

    function renderNoteImages(qid, box) {
        if (!box) box = document.querySelector(`[data-note-imgs="${qid}"]`);
        if (!box) return;
        const note = noteMap[qid] || {};
        const imgs = note.images || [];
        box.innerHTML = imgs.map((src, i) => `
            <div class="note-img-item">
                <img src="${src}" alt="笔记图片" onclick="viewNoteImage('${qid}', ${i})">
                <span class="note-img-del" onclick="delNoteImage('${qid}', ${i})" title="删除图片">×</span>
            </div>`).join('');
    }

    // 压缩成最长边1200px的JPEG，控制入库体积（透明底先铺白）
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(img.src);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => reject(new Error('图片读取失败'));
            img.src = URL.createObjectURL(file);
        });
    }

    // 从剪贴板粘贴图片（截图后在笔记框 Ctrl+V），压缩后随笔记入库；纯文字粘贴不受影响
    async function pasteNoteImage(event, qid) {
        const files = [...(event.clipboardData ? event.clipboardData.items : [])]
            .filter(it => it.type.startsWith('image/'))
            .map(it => it.getAsFile())
            .filter(Boolean);
        if (!files.length) return;
        event.preventDefault();
        try {
            const cur = noteMap[qid] || { content: '', images: [] };
            for (const f of files) {
                cur.images = cur.images || [];
                cur.images.push(await compressImage(f));
            }
            noteMap[qid] = cur;
        } catch (e) { alert(e.message); }
        renderNoteImages(qid);
        saveNote(qid);   // 贴图后立即随笔记入库
    }

    function delNoteImage(qid, i) {
        const cur = noteMap[qid];
        if (!cur || !cur.images) return;
        cur.images.splice(i, 1);
        noteMap[qid] = cur;
        renderNoteImages(qid);
        saveNote(qid);
    }

    function viewNoteImage(qid, i) {
        const cur = noteMap[qid];
        if (!cur || !cur.images) return;
        const src = cur.images[i];
        if (!src) return;
        const ov = document.createElement('div');
        ov.className = 'img-lightbox';
        ov.innerHTML = `<img src="${src}" alt="笔记图片">`;
        ov.onclick = () => ov.remove();
        document.body.appendChild(ov);
    }

    // 单题模式键盘导航：← / → 切换上一题 / 下一题
    // 在笔记输入框内不拦截，避免打断输入；左右键原本无页面级行为，不与其他快捷键冲突
    document.addEventListener('keydown', e => {
        if (viewMode !== 'single') return;
        const t = e.target;
        // 编辑器（含富文本 contenteditable，jsdom 下 isContentEditable 不可靠时用 closest 兜底）
        const inEditor = t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable ||
            (t.closest && t.closest('[contenteditable="true"]')));
        if (inEditor) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); singleStep(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); singleStep(1); }
    });

    loadDati();
    // 状态持久化：页面交互状态已持久化，此处补滚动位置恢复（数据渲染完成后）
    PS.restoreScroll();
    </script>
</body>
</html>
