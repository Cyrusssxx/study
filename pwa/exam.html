<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟考试 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <!-- 组卷设置视图 -->
        <div id="setupView">
            <div class="page-header">
                <h1>模拟考试</h1>
                <p>限时作答，交卷统一评分</p>
            </div>

            <div class="exam-setup-card">
                <div class="setup-row">
                    <label>考试模式</label>
                    <select id="examMode" onchange="onModeChange()">
                        <option value="full">完整 408 模拟（按分值比例：数构45 · 组成45 · OS35 · 网络25）</option>
                        <option value="os">单科：操作系统</option>
                        <option value="co">单科：计算机组成原理</option>
                        <option value="ds">单科：数据结构</option>
                        <option value="cn">单科：计算机网络</option>
                        <option value="favorites">仅收藏题</option>
                        <option value="wrong">仅错题</option>
                    </select>
                </div>
                <div class="setup-row">
                    <label>题目数量</label>
                    <input type="number" id="examCount" value="40" min="5" max="150">
                    <span class="setup-hint" id="countHint">完整模拟 10-150 题，默认 40</span>
                </div>
                <div class="setup-row" id="sourceInfo" style="display:none;">
                    <label>题目来源</label>
                    <span class="source-text" id="sourceText"></span>
                </div>
                <div class="setup-row">
                    <label>考试时长</label>
                    <input type="number" id="examMinutes" placeholder="留空 = 每题1分钟">
                    <span class="setup-hint">单位：分钟</span>
                </div>
                <div class="setup-row">
                    <label>错题入本</label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="recordWrong" checked onchange="localStorage.setItem('examRecordWrong', this.checked ? '1' : '0')">
                        错题自动记入错题本
                    </label>
                </div>
                <button class="btn btn-primary btn-lg" onclick="startExam()">开始考试</button>
            </div>

            <div class="stats-section">
                <h2>历史成绩</h2>
                <div id="historyList"><div class="loading">加载中...</div></div>
            </div>
        </div>

        <!-- 答题视图 -->
        <div id="examView" style="display:none">
            <div class="exam-topbar">
                <span class="exam-timer" id="examTimer">--:--</span>
                <span class="exam-progress" id="examProgress">已答 0/0</span>
                <button class="btn btn-danger" onclick="confirmSubmit()">交卷</button>
            </div>
            <div class="exam-layout">
                <div class="exam-main" id="examQuestionArea"></div>
                <aside class="exam-numbers">
                    <div class="num-grid" id="examNumberPanel"></div>
                </aside>
            </div>
            <div class="exam-nav">
                <button class="btn btn-secondary" onclick="examPrev()">← 上一题</button>
                <button class="btn btn-secondary" onclick="examNext()">下一题 →</button>
            </div>
        </div>

        <!-- 成绩单 / 历史试卷回顾视图 -->
        <div id="resultView" style="display:none">
            <div class="page-header">
                <h1 id="resultTitle">考试成绩单</h1>
            </div>
            <div id="resultArea"></div>
            <div class="exam-nav">
                <button class="btn btn-primary" id="btnResultBack" onclick="backToSetup()">再来一场</button>
            </div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
    const MODE_NAMES = { 
        full: '完整408模拟', 
        os: '操作系统', 
        co: '计算机组成原理', 
        ds: '数据结构', 
        cn: '计算机网络',
        favorites: '仅收藏题',
        wrong: '仅错题'
    };
    let examId = null;
    let examQuestions = [];
    let examAnswers = {};   // {qid: 'A'}
    let examIndex = 0;
    let remainingSec = 0;
    let timerHandle = null;

    function show(view) {
        for (const id of ['setupView', 'examView', 'resultView']) {
            document.getElementById(id).style.display = id === view ? '' : 'none';
        }
    }

    async function onModeChange() {
        const mode = document.getElementById('examMode').value;
        const isFull = mode === 'full';
        const isSpecial = mode === 'favorites' || mode === 'wrong';
        const cnt = document.getElementById('examCount');
        const sourceInfo = document.getElementById('sourceInfo');
        const sourceText = document.getElementById('sourceText');
        const durationRow = document.querySelectorAll('.setup-row')[3]; // 考试时长的行
        
        if (mode === 'favorites' || mode === 'wrong') {
            cnt.min = 5;
            cnt.max = 100;
            cnt.value = 20;
            document.getElementById('countHint').textContent = mode === 'favorites' ? '收藏题 5-100 题，默认 20' : '错题 5-100 题，默认 20';
            sourceInfo.style.display = 'flex';
            sourceText.textContent = '正在读取…';
            durationRow.style.display = 'none';
            document.getElementById('recordWrong').parentElement.parentElement.style.display = 'none';
            try {
                const isFav = mode === 'favorites';
                const resp = await api(isFav ? '/api/favorites' : '/api/wrong');
                const d = await resp.json();
                const n = (isFav ? (d.favorites || []) : (d.wrong_questions || [])).length;
                sourceText.textContent = isFav
                    ? `从您收藏的题目中组卷（本浏览器当前可组 ${n} 题）`
                    : `从您的错题本中组卷（本浏览器当前 ${n} 题）`;
                cnt.max = Math.max(5, n);
                if (cnt.value > cnt.max) cnt.value = cnt.max;
            } catch (e) {
                sourceText.textContent = '读取失败';
            }
        } else {
            cnt.min = isFull ? 10 : 5;
            cnt.max = isFull ? 150 : 100;
            cnt.value = isFull ? 40 : 20;
            document.getElementById('countHint').textContent = isFull ? '完整模拟 10-150 题，默认 40' : '单科 5-100 题，默认 20';
            sourceInfo.style.display = 'none';
            durationRow.style.display = 'flex';
            document.getElementById('recordWrong').parentElement.parentElement.style.display = 'flex';
        }
    }

    // ============ 组卷 / 恢复 ============
    async function startExam() {
        const mode = document.getElementById('examMode').value;
        
        // 收藏题/错题模式：检查是否有足够的题目
        if (mode === 'favorites' || mode === 'wrong') {
            const checkUrl = mode === 'favorites' ? '/api/favorites' : '/api/wrong';
            const checkResp = await api(checkUrl);
            const checkData = await checkResp.json();
            const pool = mode === 'favorites' ? (checkData.favorites || []) : (checkData.wrong_questions || []);
            if (pool.length === 0) {
                alert(mode === 'favorites' ? '您还没有收藏任何题目，无法进行收藏题考试。' : '您还没有错题，无法进行错题考试。');
                return;
            }
        }
        
        // 越界题量直接收拢到范围内并回写输入框，避免后端静默修正造成"改了没反应"
        const isSpecial = mode === 'favorites' || mode === 'wrong';
        const [lo, hi, dft] = (mode === 'full') ? [10, 150, 40] : [5, 100, 20];
        const count = Math.min(Math.max(parseInt(document.getElementById('examCount').value, 10) || dft, lo), hi);
        document.getElementById('examCount').value = count;
        const minutes = parseInt(document.getElementById('examMinutes').value || '0', 10);
        const body = { mode, count, record_wrong: isSpecial ? true : document.getElementById('recordWrong').checked };
        if (minutes > 0) body.duration_sec = minutes * 60;
        // 特殊模式默认每题1分钟
        if (isSpecial && !minutes) body.duration_sec = count * 60;

        const resp = await api('/api/exam/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (data.error) { alert(data.error); return; }
        enterExam(data.exam_id, data.questions, {}, data.duration_sec);
    }

    async function checkActive() {
        const resp = await api('/api/exam/active');
        const data = await resp.json();
        if (data.auto_submitted) {
            // 上次考试超时，已自动交卷，直接看成绩
            resultWrongOnly = true;
            renderResult(data.auto_submitted);
            show('resultView');
            return;
        }
        if (data.active) {
            const a = data.active;
            if (confirm(`检测到未完成的考试（${MODE_NAMES[a.mode] || a.mode}，剩余 ${Math.ceil(a.remaining_sec / 60)} 分钟），是否继续？\n取消将放弃该场考试。`)) {
                enterExam(a.exam_id, a.questions, a.answers || {}, a.remaining_sec);
                return;
            }
            // 放弃：静默废弃——重新组卷时会自动置为abandoned
        }
        loadHistory();
    }

    function enterExam(id, questions, answers, remaining) {
        examId = id;
        examQuestions = questions;
        examAnswers = answers;
        examIndex = 0;
        remainingSec = remaining;
        
        // 更新考试标题
        const mode = document.getElementById('examMode').value;
        const examTitle = getExamTitle(mode);
        document.getElementById('resultTitle').textContent = examTitle + ' - 成绩单';
        show('examView');
        renderExamQuestion();
        startTimer();
    }

    // ============ 倒计时 ============
    function startTimer() {
        clearInterval(timerHandle);
        updateTimerText();
        timerHandle = setInterval(() => {
            remainingSec--;
            updateTimerText();
            if (remainingSec <= 0) {
                clearInterval(timerHandle);
                alert('考试时间到，自动交卷！');
                doSubmit();
            }
        }, 1000);
    }

    function updateTimerText() {
        const s = Math.max(0, remainingSec);
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        const el = document.getElementById('examTimer');
        el.textContent = `⏳ ${mm}:${ss}`;
        el.classList.toggle('timer-warning', s <= 300);
    }

    // ============ 答题 ============
    function renderExamQuestion() {
        const q = examQuestions[examIndex];
        const ua = examAnswers[q.id];
        const isMulti = !!q.multi_blank;
        let optionsHtml = '';
        for (const [key, value] of Object.entries(q.options || {})) {
            optionsHtml += `
                <label class="option-item ${ua === key ? 'selected' : ''}">
                    <input type="radio" name="examAnswer" value="${key}" ${ua === key ? 'checked' : ''} onchange="pickAnswer('${q.id}', '${key}')">
                    <span class="option-letter">${key}</span>
                    <span class="option-text">${value}</span>
                </label>`;
        }
        let multiTpl = '';
        if (isMulti) {
            const optHtml = ['<option value=""></option>']
                .concat(Object.keys(q.options || {}).map(k => `<option value="${k}">${k}</option>`))
                .join('');
            const selHtml = `<select class="blank-select" onchange="pickMultiAnswer()">${optHtml}</select>`;
            multiTpl = fmtContent(q.content).replace(/<pre\b[\s\S]*?<\/pre>|(?<![A-Za-z0-9_])\(\s*\)/g, m =>
                /^<pre/i.test(m) ? m : selHtml);
        }
        document.getElementById('examQuestionArea').innerHTML = `
            <div class="question-card">
                <div class="question-header">
                    <div class="question-meta">
                        <span class="question-number">第 ${examIndex + 1} / ${examQuestions.length} 题</span>
                        ${q.chapter ? `<span class="chapter-badge">${q.chapter}</span>` : ''}
                    </div>
                </div>
                <div class="question-content">${isMulti ? multiTpl : fmtContent(q.content)}</div>
                ${isMulti ? '<div class="multi-hint">请在题干的每个（ ）下拉框中选择答案，全部选完该题才算作答</div>' : `<div class="options-list">${optionsHtml}</div>`}
            </div>`;
        // 多空题回填已选答案
        if (isMulti && ua) {
            document.querySelectorAll('.blank-select').forEach((sel, i) => { sel.value = ua[i] || ''; });
        }
        renderExamNumbers();
        updateProgress();
    }

    // 多空题：下拉全部选完才记录该题答案（避免提交不完整的序列）
    function pickMultiAnswer() {
        const q = examQuestions[examIndex];
        const vals = [...document.querySelectorAll('.blank-select')].map(s => s.value);
        if (vals.some(v => !v)) return;
        pickAnswer(q.id, vals.join(''));
    }

    function renderExamNumbers() {
        let html = '';
        examQuestions.forEach((q, i) => {
            let cls = 'num-btn';
            if (examAnswers[q.id]) cls += ' done';
            if (i === examIndex) cls += ' current';
            html += `<button class="${cls}" onclick="examGoto(${i})">${i + 1}</button>`;
        });
        document.getElementById('examNumberPanel').innerHTML = html;
    }

    function updateProgress() {
        const done = Object.keys(examAnswers).filter(k => examAnswers[k]).length;
        document.getElementById('examProgress').textContent = `已答 ${done}/${examQuestions.length}`;
    }

    async function pickAnswer(qid, key) {
        examAnswers[qid] = key;
        renderExamNumbers();
        updateProgress();
        // 随选随存，崩溃/刷新可恢复
        try {
            await api('/api/exam/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({exam_id: examId, answers: examAnswers})
            });
        } catch (e) { /* 保存异常不打断作答，交卷时以最终 answers 为准 */ }
    }

    function examGoto(i) { examIndex = i; renderExamQuestion(); }
    function examPrev() { if (examIndex > 0) { examIndex--; renderExamQuestion(); } }
    function examNext() { if (examIndex < examQuestions.length - 1) { examIndex++; renderExamQuestion(); } }

    // ============ 交卷 ============
    function confirmSubmit() {
        const done = Object.keys(examAnswers).filter(k => examAnswers[k]).length;
        const left = examQuestions.length - done;
        if (!confirm(left > 0 ? `还有 ${left} 题未作答，确定交卷吗？` : '确定交卷吗？')) return;
        doSubmit();
    }

    async function doSubmit() {
        clearInterval(timerHandle);
        const resp = await api('/api/exam/submit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({exam_id: examId, answers: examAnswers})
        });
        const result = await resp.json();
        if (result.error) { alert(result.error); backToSetup(); return; }
        resultWrongOnly = true;
        renderResult(result);
        show('resultView');
    }

    // ============ 成绩单 / 历史试卷回顾（同一套渲染） ============
    let lastResult = null;       // 当前展示的成绩数据（交卷成绩单或历史明细）
    let lastFromHistory = false; // true=从历史成绩进入的回顾视图
    let resultWrongOnly = true;  // 逐题回顾默认只看错题

    function practiceLink(d) {
        // 跳到练习页对应题（复用 quiz 页 ?goto= 定位）
        return `quiz.html?subject=${d.id.split('_')[0]}&mode=sequential&goto=${d.id}`;
    }

    // 多空题的答案序列显示为 B、A、C、D
    function fmtSeq(s) {
        return s ? [...String(s)].join('、') : '—';
    }

    function setResultFilter(wrongOnly) {
        resultWrongOnly = wrongOnly;
        renderResult(lastResult, lastFromHistory);
    }

    function renderResult(r, fromHistory) {
        lastResult = r;
        lastFromHistory = !!fromHistory;
        document.getElementById('resultTitle').textContent = fromHistory ? '试卷回顾' : '考试成绩单';
        document.getElementById('btnResultBack').textContent = fromHistory ? '← 返回历史成绩' : '再来一场';
        let html = `
            <div class="result-score-card">
                <div class="score-big">${r.score}<span class="score-unit">分</span></div>
                <div class="score-sub">答对 ${r.correct} / ${r.total} 题${fromHistory ? ` · ${MODE_NAMES[r.mode] || r.mode} · ${r.submitted_at || ''}` : ''}</div>
            </div>`;

        if (r.per_subject && r.per_subject.length > 1) {
            html += `<div class="stats-section"><h2>各科得分</h2><div class="result-subjects">`;
            for (const s of r.per_subject) {
                const pct = s.total ? Math.round(s.correct / s.total * 100) : 0;
                html += `
                    <div class="mastery-row">
                        <span class="mastery-name">${s.name}</span>
                        <div class="mastery-track"><div class="mastery-fill-correct" style="width: ${pct}%"></div></div>
                        <span class="mastery-pct">${s.correct}/${s.total} · ${pct}%</span>
                    </div>`;
            }
            html += `</div></div>`;
        }

        if (r.chapter_loss && r.chapter_loss.length) {
            html += `<div class="stats-section"><h2>失分章节</h2><div class="loss-list">`;
            for (const c of r.chapter_loss) {
                html += `<div class="loss-item"><span class="item-subject">${c.subject}</span> ${c.chapter} <span class="loss-count">丢 ${c.wrong}/${c.total} 题</span></div>`;
            }
            html += `</div></div>`;
        }

        // 逐题回顾：默认只看错题，可切全部；错题一律可看解析 + 跳转练习
        const wrongCnt = r.details.filter(d => !d.is_correct).length;
        html += `<div class="stats-section"><h2>逐题回顾${fromHistory ? '' : '（错题已自动记入错题本）'}</h2>
            <div class="result-filter">
                <button class="btn btn-sm ${resultWrongOnly ? 'btn-primary' : 'btn-secondary'}" onclick="setResultFilter(true)">只看错题 ${wrongCnt}</button>
                <button class="btn btn-sm ${resultWrongOnly ? 'btn-secondary' : 'btn-primary'}" onclick="setResultFilter(false)">全部 ${r.details.length}</button>
            </div>`;
        if (resultWrongOnly && !wrongCnt) {
            html += `<div class="empty-state"><p>本场全对，没有错题 🎉</p></div>`;
        }
        r.details.forEach((d, i) => {
            if (resultWrongOnly && d.is_correct) return;
            html += `
                <div class="list-item ${d.is_correct ? '' : 'exam-wrong'}">
                    <div class="item-header">
                        <span class="item-info">第 ${i + 1} 题${d.chapter ? ' · ' + d.chapter : ''}</span>
                        <span class="${d.is_correct ? 'badge-resolved' : 'badge-wrong'}">${d.is_correct ? '✓ 答对' : (d.user_answer ? `✗ 你选 ${d.multi_blank ? fmtSeq(d.user_answer) : d.user_answer}` : '未作答')} · 正确答案 ${d.multi_blank ? fmtSeq(d.correct_answer) : (d.correct_answer || '—')}</span>
                    </div>
                    <div class="item-content">${fmtContent(d.content)}</div>
                    <div class="item-options">
                        ${Object.entries(d.options || {}).map(([k,v]) => `<span class="mini-option">${k}. ${v}</span>`).join('')}
                    </div>
                    ${!d.is_correct && d.number != null ? `<details class="exam-expl"><summary>查看解析</summary><div>${d.explanation || '（该题暂无详细解析）'}</div></details>` : ''}
                    ${!d.is_correct && d.number != null ? `<a class="btn-goto" href="${practiceLink(d)}">去练习该题 →</a>` : ''}
                </div>`;
        });
        html += `</div>`;
        document.getElementById('resultArea').innerHTML = html;
    }

    // ============ 历史成绩 ============
    async function loadHistory() {
        const resp = await api('/api/exam/history');
        const { records } = await resp.json();
        const el = document.getElementById('historyList');
        if (!records.length) {
            el.innerHTML = '<div class="empty-state"><p>还没有考试记录，来一场试试</p></div>';
            return;
        }
        let html = '<table class="history-table"><tr><th>时间</th><th>模式</th><th>得分</th><th>答对</th><th>时长</th><th>回顾</th></tr>';
        for (const rec of records) {
            html += `<tr>
                <td>${rec.submitted_at || rec.started_at}</td>
                <td>${MODE_NAMES[rec.mode] || rec.mode}</td>
                <td class="score-cell">${rec.score}</td>
                <td>${rec.correct_count}/${rec.total_count}</td>
                <td>${Math.round(rec.duration_sec / 60)} 分钟</td>
                <td><button class="btn btn-sm btn-secondary" onclick="viewDetail(${rec.id})">查看</button></td>
            </tr>`;
        }
        el.innerHTML = html + '</table>';
    }

    // 按场次回看试卷：默认只看错题，可切全部看答过的每一题
    async function viewDetail(id) {
        const resp = await api(`/api/exam/detail/${id}`);
        const r = await resp.json();
        if (r.error) { alert(r.error); return; }
        resultWrongOnly = true;
        renderResult(r, true);
        show('resultView');
        window.scrollTo(0, 0);
    }

    function backToSetup() {
        show('setupView');
        loadHistory();
    }

    // 恢复上次的"错题入本"选择（默认开启）
    document.getElementById('recordWrong').checked = localStorage.getItem('examRecordWrong') !== '0';
    checkActive();
    
    // ============ 辅助函数 ============
    function getRandomItems(array, count) {
        const shuffled = [...array].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }
    
    function getWrongQuestionsFromDB() {
        // 从IndexedDB获取错题数据
        return new Promise((resolve) => {
            const request = indexedDB.open('wrong_db', 1);
            request.onsuccess = function(event) {
                const db = event.target.result;
                const transaction = db.transaction(['wrong'], 'readonly');
                const store = transaction.objectStore('wrong');
                const getAll = store.getAll();
                
                getAll.onsuccess = function() {
                    const wrongQuestions = getAll.result.map(item => item.q);
                    resolve(wrongQuestions);
                };
                
                getAll.onerror = function() {
                    resolve([]); // 获取失败返回空数组
                };
            };
            
            request.onerror = function() {
                resolve([]); // 数据库打开失败返回空数组
            };
        });
    }
    
    // 处理特殊模式的考试标题
    function getExamTitle(mode) {
        if (mode === 'favorites') return '收藏题考试';
        if (mode === 'wrong') return '错题考试';
        return MODE_NAMES[mode] || '模拟考试';
    }
</script>
