<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408刷题 - 首页</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="code.html" class="nav-link">代码题</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="hero">
            <h1>408 计算机考研刷题</h1>
            <p class="subtitle">操作系统 · 计算机组成原理 · 数据结构 · 计算机网络</p>
        </div>

        <!-- 总体统计 -->
        <div class="stats-bar" id="statsBar">
            <div class="loading">加载中...</div>
        </div>

        <!-- 科目列表 + 打卡/大题工具卡 -->
        <div class="subjects-grid" id="subjectsGrid"></div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
        // 首页原为服务端渲染，PWA 版改为客户端调 /api/stats 渲染
        const SUBJECT_ORDER = ['os', 'co', 'ds', 'cn'];

        async function loadHome() {
            try {
                const resp = await api('/api/stats');
                const data = await resp.json();
                const s = data.overall;
                document.getElementById('statsBar').innerHTML = `
                    <div class="stat-item">
                        <span class="stat-number">${s.total_answered}</span>
                        <span class="stat-label">已做题目</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.accuracy}%</span>
                        <span class="stat-label">正确率</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.wrong_count}</span>
                        <span class="stat-label">错题数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.due_review_count}</span>
                        <span class="stat-label">今日待复习</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.favorite_count}</span>
                        <span class="stat-label">收藏数</span>
                    </div>`;

                let cards = '';
                for (const key of SUBJECT_ORDER) {
                    const sub = data.subjects[key];
                    if (!sub) continue;
                    const pct = sub.total_questions > 0 ? sub.total_answered / sub.total_questions * 100 : 0;
                    cards += `
                    <div class="subject-card">
                        <div class="card-header">
                            <h2>${sub.name}</h2>
                            <span class="badge">${sub.total_questions} 题</span>
                        </div>
                        <div class="card-stats">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${pct}%"></div>
                            </div>
                            <p class="progress-text">已完成 ${sub.total_answered}/${sub.total_questions} · 正确率 ${sub.accuracy}%</p>
                        </div>
                        <div class="card-actions">
                            <a class="btn btn-primary btn-resume" data-subject="${key}" href="quiz.html?subject=${key}&mode=sequential">继续刷题</a>
                            <a href="quiz.html?subject=${key}&mode=sequential&fresh=1" class="btn btn-secondary">顺序刷题</a>
                            <a href="quiz.html?subject=${key}&mode=wrong" class="btn btn-danger">错题重刷 (${sub.wrong_count})</a>
                            <a href="quiz.html?subject=${key}&mode=random" class="btn btn-secondary">随机抽题</a>
                            <a href="quiz.html?subject=${key}&mode=favorite" class="btn btn-warning">收藏练习</a>
                            <a href="quiz.html?subject=${key}&mode=real" class="btn btn-secondary">统考真题</a>
                        </div>
                        ${(sub.due_review_count > 0 || sub.review_upcoming > 0) ? `
                        <div class="review-chips" title="艾宾浩斯记忆曲线：错题按1/2/4/7/15天间隔到期复习，连对5次毕业">
                            <span class="review-chips-label">📅 复习：</span>
                            ${sub.due_review_count > 0 ? `<a class="review-chip review-chip-all" href="quiz.html?subject=${key}&mode=review">全部到期 · ${sub.due_review_count}</a>` : ''}
                            ${[1, 2, 4, 7, 15].map(iv => (sub.review_stages && sub.review_stages[iv] || []).length
                                ? `<a class="review-chip" href="quiz.html?subject=${key}&mode=review&stage=${iv}" title="当前处于 ${iv} 天间隔阶段的到期题">${iv}天期 · ${(sub.review_stages[iv]).length}</a>`
                                : '').join('')}
                            ${sub.review_upcoming ? `<span class="review-chip review-chip-upcoming" title="未来3天内将到期的题数">即将到期 +${sub.review_upcoming}</span>` : ''}
                        </div>` : ''}
                        <div class="card-note-row">
                            <a href="notes.html?subject=${key}" class="btn btn-note">📖 知识笔记</a>
                            <a href="map.html?subject=${key}" class="btn btn-map" title="思维导图：大纲式阅读 + 划词高亮批注">🗺️ 思维导图</a>
                        </div>
                    </div>`;
                }
                cards += `
                <div class="subject-card">
                    <div class="card-header">
                        <h2>📌 数据结构强化打卡</h2>
                        <span class="badge">代码大题</span>
                    </div>
                    <div class="card-stats">
                        <p class="progress-text">王道打卡表精选代码大题，必做与高优先级置顶</p>
                        <p class="daka-home-progress" id="dakaHomeProgress">已打卡 <b>-</b> / - 题</p>
                    </div>
                    <div class="card-actions">
                        <a href="daka.html" class="btn btn-primary">进入打卡</a>
                    </div>
                </div>
                <div class="subject-card">
                    <div class="card-header">
                        <h2>📝 大题专项</h2>
                        <span class="badge">真题</span>
                    </div>
                    <div class="card-stats">
                        <p class="progress-text">王道综合应用题真题截图，按科目/章节查看题目与答案</p>
                    </div>
                    <div class="card-actions">
                        <a href="dati.html" class="btn btn-primary">查看大题</a>
                    </div>
                </div>`;
                document.getElementById('subjectsGrid').innerHTML = cards;
                fillResumeLinks();
            } catch (e) {
                document.getElementById('statsBar').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
            }
            loadDakaHome();
        }

        // 打卡板块进度：题库总数（meta.json，免下 146KB ds_daka.json）+ IndexedDB 完成数
        async function loadDakaHome() {
            try {
                const [metaResp, pResp] = await Promise.all([
                    fetch('data/meta.json'),
                    api('/api/daka/progress')
                ]);
                const meta = await metaResp.json();
                const total = meta.ds_daka || 0;
                const progress = (await pResp.json()).progress || {};
                document.getElementById('dakaHomeProgress').innerHTML =
                    `已打卡 <b>${Object.keys(progress).length}</b> / ${total} 题`;
            } catch (e) { /* 题库缺失时保持占位 */ }
        }

        // 继续刷题：读做题页记录的 practiceHistory（本机 localStorage），回填每科「继续刷题」按钮 href
        function fillResumeLinks() {
            let list = [];
            try { list = JSON.parse(localStorage.getItem('practiceHistory')) || []; } catch (e) {}
            if (!list.length) return;
            // list 已按时间倒序，取每科第一个（最新）；跳过收藏模式——避免点「继续刷题」被拉回收藏模式出不来
            const latest = {};
            for (const e of list) {
                if (e.mode === 'favorite') continue;
                if (!latest[e.subject]) latest[e.subject] = e;
            }
            const link = e => `quiz.html?subject=${e.subject}&mode=${e.mode}${e.chapter ? '&chapter=' + encodeURIComponent(e.chapter) : ''}${e.section ? '&section=' + encodeURIComponent(e.section) : ''}&goto=${e.qid}`;
            document.querySelectorAll('.btn-resume').forEach(btn => {
                const e = latest[btn.dataset.subject];
                if (e) btn.href = link(e);
            });
        }

        loadHome();
    </script>
</body>
</html>
