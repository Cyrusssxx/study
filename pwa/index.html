<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408刷题 - 首页</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">首页</a>
                <a href="quiz.html" class="nav-link">刷题</a>
                <a href="zhenti.html" class="nav-link">真题套卷</a>
                <a href="daily.html" class="nav-link">每日一题</a>
                <a href="cards.html" class="nav-link">记忆卡</a>
                <a href="daka.html" class="nav-link">打卡表</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="algo.html" class="nav-link">算法讲义</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="hero">
            <h1>408 计算机考研刷题</h1>
            <p class="subtitle">操作系统 · 计算机组成原理 · 数据结构 · 计算机网络</p>
        </div>

        <!-- 总体统计 -->
        <div class="stats-bar" id="statsBar">
            <div class="loading">加载中...</div>
        </div>

        <!-- 科目列表 + 打卡/大题工具卡 -->
        <div class="subjects-grid" id="subjectsGrid"></div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/backend.js"></script>
    <script>
        // 首页原为服务端渲染，PWA 版改为客户端调 /api/stats 渲染
        const SUBJECT_ORDER = ['os', 'co', 'ds', 'cn'];
        const SUBJECT_NAMES = { os: '操作系统', co: '计算机组成原理', ds: '数据结构', cn: '计算机网络' };
        const num = v => (typeof v === 'number' && isFinite(v) ? v : 0);

        // 统计接口异常时降级：用 data/meta.json 的总题数兜底，首页入口全部保持可用
        // （旧实现不检查 resp.ok / data.error，接口 500 时读 data.overall 直接抛
        //  "Cannot read properties of undefined (reading 'total_answered')"，整个首页空白）
        async function loadHome() {
            let data = null, apiErr = '';
            try {
                const resp = await api('/api/stats');
                const j = await resp.json().catch(() => null);
                if (j && j.error) apiErr = j.error;
                else if (j && j.overall && j.subjects) data = j;
                else apiErr = '返回数据不完整';
            } catch (e) {
                apiErr = (e && e.message) ? e.message : String(e);
            }
            let fallbackTotals = {};
            if (!data) {
                try { fallbackTotals = await (await fetch('data/meta.json')).json(); } catch (e) { fallbackTotals = {}; }
            }
            const s = (data && data.overall) || {};
            const subjects = (data && data.subjects) || {};
            // meta.json 结构：{ subjects: { os: {total}, ... }, ds_daka }
            const fbTotal = k => num(fallbackTotals[k])
                || num(fallbackTotals.subjects && fallbackTotals.subjects[k] && fallbackTotals.subjects[k].total);

            // 统计为 0 有两种可能：真没数据（浏览器清了站点数据 / 换了设备）或读不出来（库被占用/损坏）。
            // 必须明示是哪一种——静默显示 0 会让人误以为记录被清空。
            const warnings = (data && data.warnings) || [];
            const stores = (data && data.stores) || null;
            // 关键三项（progress/wrong/favorites）全为 -1 → 本地存储整体打不开（无痕/被占用/被禁）
            const storesDown = !!(stores && stores.progress === -1 && stores.wrong === -1 && stores.favorites === -1);
            const looksEmpty = !apiErr && !warnings.length && num(s.total_answered) === 0
                && num(s.favorite_count) === 0 && num(s.wrong_count) === 0
                && (!stores || (stores.progress === 0 && stores.wrong === 0 && stores.favorites === 0));

            document.getElementById('statsBar').innerHTML = `
                <div class="stat-item"><span class="stat-number">${num(s.total_answered)}</span><span class="stat-label">已做题目</span></div>
                <div class="stat-item"><span class="stat-number">${num(s.accuracy)}%</span><span class="stat-label">正确率</span></div>
                <div class="stat-item"><span class="stat-number">${num(s.wrong_count)}</span><span class="stat-label">错题数</span></div>
                <div class="stat-item"><span class="stat-number">${num(s.due_review_count)}</span><span class="stat-label">今日待复习</span></div>
                <div class="stat-item"><span class="stat-number">${num(s.favorite_count)}</span><span class="stat-label">收藏数</span></div>
                ${apiErr ? `<div class="stat-warn">⚠ 统计接口异常：${apiErr}
                    <button class="stat-retry" onclick="loadHome()">重试</button>
                    <span class="stat-warn-hint">其余入口照常可用；多次重试仍失败，请按 F12 看 Console 里 api error 的详情</span></div>` : ''}
                ${(!apiErr && warnings.length) ? `<div class="stat-warn">⚠ ${storesDown
                    ? '本地存储打不开（无痕模式 / 被其它标签页占用 / 被浏览器禁用）——数字暂显示 0，数据通常还在'
                    : '部分统计读取失败（显示可能不完整）：' + warnings.slice(0, 3).join('；') + (warnings.length > 3 ? ` 等 ${warnings.length} 项` : '')}
                    <button class="stat-retry" onclick="loadHome()">重试</button>
                    <span class="stat-warn-hint">若是「其它标签页占用」：关闭本站其它标签页后刷新即可。${storesDown ? '数据通常还在，<b>先别导入备份</b>（以免覆盖）' : ''}</span></div>` : ''}
                ${looksEmpty ? `<div class="stat-empty">📭 没读到答题记录（已做 / 收藏 / 错题全为 0）
                    <button class="stat-retry" onclick="document.getElementById('homeImportFile').click()">导入备份恢复</button>
                    <span class="stat-warn-hint">当前地址 <code>${location.origin}</code>：数据按访问地址隔离存储，换了域名 / 端口 / IP 就看不到旧的。若有 <code>408quiz-backup-*.json</code> 可直接还原</span>
                    <input type="file" id="homeImportFile" accept=".json,application/json" style="display:none"></div>` : ''}`;

            let cards = '';
            for (const key of SUBJECT_ORDER) {
                const sub = subjects[key] || {
                    name: SUBJECT_NAMES[key],
                    total_questions: fbTotal(key),
                    total_answered: 0, accuracy: 0, wrong_count: 0,
                    due_review_count: 0, review_upcoming: 0
                };
                const pct = sub.total_questions > 0 ? sub.total_answered / sub.total_questions * 100 : 0;
                    cards += `
                    <div class="subject-card">
                        <div class="card-header">
                            <h2>${sub.name}</h2>
                            <span class="badge">${sub.total_questions} 题</span>
                        </div>
                        <div class="card-stats">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${pct}%"></div>
                            </div>
                            <p class="progress-text">已完成 ${sub.total_answered}/${sub.total_questions} · 正确率 ${sub.accuracy}%</p>
                        </div>
                        <div class="card-actions">
                            <a class="btn btn-primary btn-resume" data-subject="${key}" href="quiz.html?subject=${key}&mode=sequential">继续刷题</a>
                            <a href="quiz.html?subject=${key}&mode=wrong" class="btn btn-danger">错题重刷 (${sub.wrong_count})</a>
                            <a href="quiz.html?subject=${key}&mode=random" class="btn btn-secondary">随机抽题</a>
                            <a href="quiz.html?subject=${key}&mode=favorite" class="btn btn-warning">收藏练习</a>
                            <a href="quiz.html?subject=${key}&mode=real" class="btn btn-secondary">统考真题</a>
                        </div>
                        ${(sub.due_review_count > 0 || sub.review_upcoming > 0) ? `
                        <div class="review-chips" title="艾宾浩斯记忆曲线：错题按2/4/7/15天间隔到期复习，连对4次毕业">
                            <span class="review-chips-label">📅 复习：</span>
                            ${sub.due_review_count > 0 ? `<a class="review-chip review-chip-all" href="quiz.html?subject=${key}&mode=review">全部到期 · ${sub.due_review_count}</a>` : ''}
                            ${[2, 4, 7, 15].map(iv => (sub.review_stages && sub.review_stages[iv] || []).length
                                ? `<a class="review-chip" href="quiz.html?subject=${key}&mode=review&stage=${iv}" title="当前处于 ${iv} 天间隔阶段的到期题">${iv}天期 · ${(sub.review_stages[iv]).length}</a>`
                                : '').join('')}
                            ${sub.review_upcoming ? `<span class="review-chip review-chip-upcoming" title="未来3天内将到期的题数">即将到期 +${sub.review_upcoming}</span>` : ''}
                        </div>` : ''}
                        <div class="card-note-row">
                            <a href="notes.html?subject=${key}" class="btn btn-note">📖 知识笔记</a>
                            ${key === 'cn'
                                ? `<a href="cn_graph.html" class="btn btn-map" title="计网分层考点图谱：自顶向下五层贯通 · OSI七层/四层/五层对照 · 全是考点">🧭 分层考点图谱</a>`
                                : `<a href="map.html?subject=${key}" class="btn btn-map" title="思维导图：大纲式阅读 + 划词高亮批注">🗺️ 思维导图</a>`}
                        </div>
                    </div>`;
                }
                cards += `
                <div class="subject-card">
                    <div class="card-header">
                        <h2>📝 大题专项</h2>
                        <span class="badge">真题</span>
                    </div>
                    <div class="card-stats">
                        <p class="progress-text">王道综合应用题真题截图，按科目/章节查看题目与答案</p>
                    </div>
                    <div class="card-actions">
                        <a href="dati.html" class="btn btn-primary">查看大题</a>
                    </div>
                    <div class="card-sub-block">
                        <div class="card-sub-head">
                            <h3>📌 数据结构强化打卡</h3>
                            <span class="badge">代码大题</span>
                        </div>
                        <p class="progress-text">王道打卡表精选代码大题，必做与高优先级置顶</p>
                        <p class="daka-home-progress" id="dakaHomeProgress">已打卡 <b>-</b> / - 题</p>
                        <div class="card-actions">
                            <a href="daka.html" class="btn btn-primary">进入打卡</a>
                            <a href="code.html" class="btn btn-secondary" title="全部数据结构代码真题(2009-2026)与教材习题，含完整讲义">💻 代码题</a>
                        </div>
                    </div>
                </div>
                <div class="subject-card">
                    <div class="card-header">
                        <h2>🗓 考研冲刺计划</h2>
                        <span class="badge">10/12 – 12/18</span>
                    </div>
                    <div class="card-stats">
                        <p class="progress-text">68 天冲刺节奏：408 套卷一刷/二刷 · 数学每日 30 题 · 英语阅读重做 / 翻译 / 作文</p>
                    </div>
                    <div class="card-actions">
                        <a href="plan.html" class="btn btn-primary">打开计划</a>
                    </div>
                </div>`;
                document.getElementById('subjectsGrid').innerHTML = cards;
                fillResumeLinks();
            loadDakaHome();
        }

        // 打卡板块进度：题库总数（meta.json，免下 146KB ds_daka.json）+ IndexedDB 完成数
        async function loadDakaHome() {
            try {
                const [metaResp, pResp] = await Promise.all([
                    fetch('data/meta.json'),
                    api('/api/daka/progress')
                ]);
                const meta = await metaResp.json();
                const total = meta.ds_daka || 0;
                const progress = (await pResp.json()).progress || {};
                document.getElementById('dakaHomeProgress').innerHTML =
                    `已打卡 <b>${Object.keys(progress).length}</b> / ${total} 题`;
            } catch (e) { /* 题库缺失时保持占位 */ }
        }

        // 继续刷题：读做题页记录的 practiceHistory（本机 localStorage），回填每科「继续刷题」按钮 href
        function fillResumeLinks() {
            let list = [];
            try { list = JSON.parse(localStorage.getItem('practiceHistory')) || []; } catch (e) {}
            if (!list.length) return;
            // list 已按时间倒序，取每科第一个（最新）；跳过收藏系模式（favorite/fav_real）
            // ——收藏与收藏+真题都是受限子集，点「继续刷题」被拉回去会出不来（fav_real 漏判导致
            //    用户从首页继续时被静默带进收藏+真题，点章节又一直保持该模式）
            const latest = {};
            for (const e of list) {
                if (e.mode === 'favorite' || e.mode === 'fav_real') continue;
                if (!latest[e.subject]) latest[e.subject] = e;
            }
            const link = e => `quiz.html?subject=${e.subject}&mode=${e.mode}${e.chapter ? '&chapter=' + encodeURIComponent(e.chapter) : ''}${e.section ? '&section=' + encodeURIComponent(e.section) : ''}&goto=${e.qid}`;
            document.querySelectorAll('.btn-resume').forEach(btn => {
                const e = latest[btn.dataset.subject];
                if (e) btn.href = link(e);
            });
        }

        // 首页一键恢复：与统计页「导入备份文件」同源，全量覆盖当前本地数据
        async function homeImportBackup(file) {
            if (!file) return;
            let data;
            try { data = JSON.parse(await file.text()); }
            catch (e) { alert('文件不是有效的 JSON'); return; }
            if (!Array.isArray(data.progress)) { alert('备份文件格式不正确（缺少 progress 数组）'); return; }
            const msg = `将全量覆盖当前数据：答题 ${data.progress.length} 条、错题 ${(data.wrong || []).length} 条、`
                + `收藏 ${(data.favorites || []).length} 条、笔记 ${(data.notes || []).length} 条、打卡 ${(data.daka || []).length} 条。确定导入？`;
            if (!confirm(msg)) return;
            try {
                const resp = await api('/api/backup/import', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                });
                const r = await resp.json();
                if (resp.ok && r.success) {
                    alert('导入成功，页面即将刷新');
                    setTimeout(() => location.reload(), 600);
                } else {
                    alert('导入失败：' + (r.error || '未知错误'));
                }
            } catch (e) { alert('导入失败：' + ((e && e.message) || e)); }
        }
        // 文件选择框是动态插入的，用事件委托绑定
        document.addEventListener('change', e => {
            if (e.target && e.target.id === 'homeImportFile') {
                homeImportBackup(e.target.files && e.target.files[0]);
                e.target.value = '';
            }
        });

        loadHome();
    </script>
</body>
</html>
