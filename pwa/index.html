<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408刷题 - 首页</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="hero">
            <h1>408 计算机考研刷题</h1>
            <p class="subtitle">操作系统 · 计算机组成原理 · 数据结构 · 计算机网络</p>
        </div>

        <!-- 继续上次练习 / 最近练习（本机 localStorage 记录，做过题才显示） -->
        <div class="resume-section" id="resumeSection" style="display:none"></div>

        <!-- 总体统计 -->
        <div class="stats-bar" id="statsBar">
            <div class="loading">加载中...</div>
        </div>

        <!-- 科目列表 -->
        <div class="subjects-grid" id="subjectsGrid"></div>

        <!-- 数据结构强化打卡 -->
        <div class="daka-home-section">
            <div class="daka-home-info">
                <h2>📌 数据结构强化打卡</h2>
                <p>王道打卡表精选代码大题，必做与高优先级置顶</p>
                <p class="daka-home-progress" id="dakaHomeProgress">已打卡 - / - 题</p>
            </div>
            <a href="daka.html" class="btn btn-primary">进入打卡</a>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
        // 首页原为服务端渲染，PWA 版改为客户端调 /api/stats 渲染
        const SUBJECT_ORDER = ['os', 'co', 'ds', 'cn'];

        async function loadHome() {
            try {
                const resp = await api('/api/stats');
                const data = await resp.json();
                const s = data.overall;
                document.getElementById('statsBar').innerHTML = `
                    <div class="stat-item">
                        <span class="stat-number">${s.total_answered}</span>
                        <span class="stat-label">已做题目</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.accuracy}%</span>
                        <span class="stat-label">正确率</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.wrong_count}</span>
                        <span class="stat-label">错题数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.due_review_count}</span>
                        <span class="stat-label">今日待复习</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${s.favorite_count}</span>
                        <span class="stat-label">收藏数</span>
                    </div>`;

                let cards = '';
                for (const key of SUBJECT_ORDER) {
                    const sub = data.subjects[key];
                    if (!sub) continue;
                    const pct = sub.total_questions > 0 ? sub.total_answered / sub.total_questions * 100 : 0;
                    cards += `
                    <div class="subject-card">
                        <div class="card-header">
                            <h2>${sub.name}</h2>
                            <span class="badge">${sub.total_questions} 题</span>
                        </div>
                        <div class="card-stats">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${pct}%"></div>
                            </div>
                            <p class="progress-text">已完成 ${sub.total_answered}/${sub.total_questions} · 正确率 ${sub.accuracy}%</p>
                        </div>
                        <div class="card-actions">
                            <a href="quiz.html?subject=${key}&mode=sequential" class="btn btn-primary">顺序刷题</a>
                            <a href="quiz.html?subject=${key}&mode=smart" class="btn btn-smart" title="薄弱章节优先：正确率越低、未做题越多的章节越先出题">智能刷题</a>
                            <a href="quiz.html?subject=${key}&mode=random" class="btn btn-secondary">随机抽题</a>
                            <a href="quiz.html?subject=${key}&mode=wrong" class="btn btn-danger">错题重刷 (${sub.wrong_count})</a>
                            <a href="quiz.html?subject=${key}&mode=review" class="btn btn-review ${sub.due_review_count > 0 ? 'has-due' : ''}" title="艾宾浩斯记忆曲线：错题按1/2/4/7/15天间隔到期复习，连对5次毕业">今日复习 (${sub.due_review_count})</a>
                            <a href="quiz.html?subject=${key}&mode=favorite" class="btn btn-warning">收藏练习</a>
                            <a href="quiz.html?subject=${key}&mode=real" class="btn btn-secondary">统考真题</a>
                            <a href="quiz.html?subject=${key}&mode=code" class="btn btn-secondary" title="只刷含代码的题目">代码专项</a>
                            ${key === 'co' ? '<a href="notes.html?subject=co" class="btn btn-notes" title="按考纲章节整理的 27 节考点笔记，做题时点知识点徽章可直达对应节">📖 知识笔记</a>' : ''}
                        </div>
                    </div>`;
                }
                document.getElementById('subjectsGrid').innerHTML = cards;
            } catch (e) {
                document.getElementById('statsBar').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
            }
            loadDakaHome();
        }

        // 打卡板块进度：题库总数 + IndexedDB 完成数
        async function loadDakaHome() {
            try {
                const [qResp, pResp] = await Promise.all([
                    fetch('data/ds_daka.json'),
                    api('/api/daka/progress')
                ]);
                const total = (await qResp.json()).total;
                const progress = (await pResp.json()).progress || {};
                document.getElementById('dakaHomeProgress').innerHTML =
                    `已打卡 <b>${Object.keys(progress).length}</b> / ${total} 题`;
            } catch (e) { /* 题库缺失时保持占位 */ }
        }

        // 首页「继续上次练习」+「最近练习」：读做题页记录的 practiceHistory（本机 localStorage）
        (function renderResume() {
            const SUBJ_NAMES = { os: '操作系统', co: '计算机组成原理', ds: '数据结构', cn: '计算机网络' };
            const MODE_NAMES = { sequential: '顺序模式', random: '随机模式', wrong: '错题模式', favorite: '收藏模式', unanswered: '未做模式', real: '真题模式', code: '代码专项', smart: '智能模式', review: '复习模式' };
            let list = [];
            try { list = JSON.parse(localStorage.getItem('practiceHistory')) || []; } catch (e) {}
            if (!list.length) return;
            const ago = ts => {
                const m = Math.floor((Date.now() - ts) / 60000);
                if (m < 1) return '刚刚';
                if (m < 60) return `${m} 分钟前`;
                if (m < 1440) return `${Math.floor(m / 60)} 小时前`;
                return `${Math.floor(m / 1440)} 天前`;
            };
            const link = e => `quiz.html?subject=${e.subject}&mode=${e.mode}${e.chapter ? '&chapter=' + encodeURIComponent(e.chapter) : ''}${e.section ? '&section=' + encodeURIComponent(e.section) : ''}&goto=${e.qid}`;
            const label = e => `${SUBJ_NAMES[e.subject] || e.subject} · ${MODE_NAMES[e.mode] || e.mode}${e.chapter ? ' · ' + e.chapter : ''}`;
            const cur = list[0];
            const pct = cur.total ? Math.round((cur.idx + 1) / cur.total * 100) : 0;
            let html = `
                <div class="resume-card">
                    <div class="resume-info">
                        <div class="resume-title">⏵ 继续上次练习</div>
                        <div class="resume-desc">${label(cur)} — 上次做到第 ${cur.idx + 1} / ${cur.total} 题 · ${ago(cur.ts)}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                    </div>
                    <a class="btn btn-primary" href="${link(cur)}">继续刷题</a>
                </div>`;
            if (list.length > 1) {
                html += '<div class="resume-history">' + list.slice(1).map(e => `
                    <a class="resume-history-item" href="${link(e)}">
                        <span>${label(e)}</span>
                        <span class="rh-meta">第 ${e.idx + 1}/${e.total} 题 · ${ago(e.ts)} · 继续 →</span>
                    </a>`).join('') + '</div>';
            }
            const box = document.getElementById('resumeSection');
            box.innerHTML = html;
            box.style.display = '';
        })();

        loadHome();
    </script>
</body>
</html>
