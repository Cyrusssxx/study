<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真题套卷 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <details class="nav-dd">
                <summary class="nav-link nav-dd-sum" title="知识点笔记：下拉选择科目，直达该科考点">知识点 <span class="nav-dd-arrow">▾</span></summary>
                <div class="nav-dd-menu">
                    <a href="notes.html?subject=ds">数据结构</a>
                    <a href="notes.html?subject=co">计算机组成原理</a>
                    <a href="notes.html?subject=os">操作系统</a>
                    <a href="notes.html?subject=cn">计算机网络</a>
                </div>
            </details>
            <div class="nav-links">
                <a href="quiz.html" class="nav-link">刷题</a>
                <a href="zhenti.html" class="nav-link active">真题套卷</a>
                <a href="daily.html" class="nav-link">每日一题</a>
                <a href="cards.html" class="nav-link">记忆卡</a>
                <a href="daka.html" class="nav-link">打卡表</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="algo.html" class="nav-link">算法讲义</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
            </div>
            <div class="nav-tools">
                <!-- 做题模式开关：从套卷工具栏移到顶栏（状态由 js/zhenti.js 的 syncExamModeBtn 同步） -->
                <button class="zt-btn" id="ztExamModeBtn" onclick="toggleExamMode()" title="做题模式：隐藏答案、历史记录与笔记">做题模式</button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container toc-fixed zt-page">
        <div class="ol-layout">
            <!-- 左：历年套卷（贴左固定，复用 .ol-nav；收起后留窄竖条） -->
            <aside class="ol-nav" id="ztNav">
                <div class="ol-nav-head" onclick="toggleZtNav()">历年套卷<span class="ol-nav-toggle">«</span></div>
                <div class="ol-nav-body" id="yearList">
                    <div class="loading">加载中…</div>
                </div>
            </aside>
            <button class="ol-nav-tab" id="ztNavTab" onclick="expandZtNav()" title="展开年份列表">☰ 年份</button>

            <!-- 中：当前套卷题目流 -->
            <div class="question-list" id="ztMain">
                <div class="loading">加载中…</div>
            </div>
        </div>
    </main>

    <!-- 本卷备注：工具栏小按钮 → 悬浮窗编辑；保存后直接显示在试卷最上方 -->
    <div class="zt-pn-mask" id="ztPnMask" hidden onclick="if(event.target===this) closePaperNote()"></div>
    <div class="zt-pn-modal" id="ztPnModal" role="dialog" aria-modal="true" aria-labelledby="ztPnTitle" hidden>
        <div class="zt-pn-head">
            <h3 id="ztPnTitle">📝 本卷备注</h3>
            <span class="zt-pn-year" id="ztPnYear"></span>
        </div>
        <p class="zt-pn-desc">写这卷的失分点、时间分配、下次注意什么。可选中文字后设字色 / 高亮 / 粗斜 / 标题。</p>
        <div class="note-editor zt-pn-editor" id="ztPnEditor">
            <div id="ztPnToolbarSlot"></div>
            <div class="note-input zt-pn-input" id="ztPnInput" contenteditable="true" spellcheck="false"
                data-placeholder="点这里开始写：这卷的失分点、时间分配、下次注意什么…"></div>
        </div>
        <div class="zt-pn-foot">
            <span class="zt-pn-hint">存在本机，跟着「⬇ 导出数据」一起备份</span>
            <div class="zt-pn-btns">
                <button class="btn btn-sm" onclick="closePaperNote()">取消</button>
                <button class="btn btn-sm btn-primary" onclick="savePaperNote()">保存</button>
            </div>
        </div>
    </div>

    <!-- 右：悬浮题号导航（照试卷题号 1..N） -->
    <div class="zt-fq" id="ztFq">
        <div class="zt-fq-head" onclick="toggleFq()">
            <span class="zt-fq-no" id="fqNo">—</span>
            <span class="zt-fq-prog" id="fqProg">0/0</span>
            <span class="zt-fq-arrow" id="fqArrow">▲</span>
        </div>
        <div class="zt-fq-body" id="fqList"></div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/note_richtext.js"></script>
    <script src="js/zhenti.js"></script>
</body>
</html>
