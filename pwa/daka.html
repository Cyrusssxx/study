<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据结构强化打卡 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="code.html" class="nav-link">代码题</a>
                <a href="algo.html" class="nav-link">算法讲义</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="page-header">
            <h1>📌 数据结构强化打卡</h1>
            <p>王道打卡表精选代码大题，按优先级排序，完成一题打卡一题</p>
            <p class="daka-hint">💡 不想全刷？点上方筛选条只选「算法类型 / 题型 / 优先级」，选择会自动记住；图片按需加载，展开哪组才下哪组。</p>
        </div>

        <div class="daka-summary" id="dakaSummary"></div>

        <!-- 分类筛选：算法类型 / 题型 / 优先级 / 完成状态 -->
        <div class="daka-filters">
            <div class="daka-filter-row">
                <span class="daka-filter-label">算法类型</span>
                <div class="daka-chips" id="dakaFilterModule"></div>
            </div>
            <div class="daka-filter-row">
                <span class="daka-filter-label">题型 / 状态</span>
                <div class="daka-chips" id="dakaFilterSheet"></div>
                <div class="daka-chips" id="dakaFilterDone"></div>
            </div>
            <div class="daka-filter-row">
                <span class="daka-filter-label">优先级</span>
                <div class="daka-chips" id="dakaFilterPriority"></div>
            </div>
        </div>

        <div class="ol-layout">
            <aside class="ol-nav" id="dakaNav"></aside>
            <button class="ol-nav-tab" id="dakaNavTab" onclick="expandDakaNav()" title="展开目录">☰ 目录</button>
            <div class="question-list" id="dakaList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </main>
    <button class="ol-nav-fab" id="dakaNavFab" onclick="openDakaNav()" title="定位题目">☰ 定位</button>
    <div class="ol-nav-mask" id="dakaNavMask" onclick="closeDakaNav()"></div>
    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/note_richtext.js"></script>
    <script>
    let dakaQuestions = [];
    let dakaProgress = {};
    let dakaGroups = [];
    let dakaNavCollapsed = localStorage.getItem('daka_nav_collapsed') === '1';
    // 筛选状态：算法类型 / 题型 / 优先级 / 完成状态(默认 all)
    let dakaFilter = { module: '全部', sheet: '全部', priority: '全部', done: '全部' };
    // 代码题讲义映射：daka 题 source（如"王道书 2.3.7_大题_17"）→ ds_code.json 完整讲义条目
    let codeBySource = new Map();
    // 「📷 解答原图」独立展开状态（仅真题卡片有此按钮），刷新后保持
    let dakaAnsfigOpen = new Set(JSON.parse(localStorage.getItem('daka_ansfig_open') || '[]'));

    // 从题目元数据推导可用的算法类型（module），
    // 但由于 module 文案带"基于“X”的算法训练"，统一映射为短分类；
    // 应用题为真题，单独归"真题训练"。
    function dakaModules(qs) {
        const order = [];
        const seen = new Set();
        for (const q of qs) {
            const m = q.module || '未分类';
            if (!seen.has(m)) { seen.add(m); order.push(m); }
        }
        return order;
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadDaka() {
        try {
            const [qResp, pResp, cResp, eResp] = await Promise.all([
                fetch('data/ds_daka.json'),
                api('/api/daka/progress'),
                fetch('data/ds_code.json'),
                fetch('data/ds_code_extra.json')
            ]);
            dakaQuestions = (await qResp.json()).questions;
            dakaProgress = (await pResp.json()).progress || {};
            // 按 source 建立 daka 卡 → 代码题讲义 的映射（source 形如"王道书 2.3.7_大题_17"，两边逐字一致）
            // 真题讲义 ds_code.json + 教材习题讲义 ds_code_extra.json 合并（source 互不冲突）
            codeBySource = new Map();
            for (const c of (await cResp.json()).questions || []) if (c.source) codeBySource.set(c.source, c);
            for (const c of (await eResp.json()).questions || []) if (c.source) codeBySource.set(c.source, c);
            restoreDakaFilter();
            renderFilters(true);
            renderDaka();
            // 首次渲染完成后启用批注（分配锚点已在 renderCard 中写死 data-blk，此处加载已存高亮/笔记）
            initDakaAnno();
        } catch (e) {
            document.getElementById('dakaList').innerHTML = `<div class="error">加载失败</div>`;
        }
    }

    function renderFilters(force) {
        // 根据当前题库重建各筛选维度的选项（去重、固定顺序）
        const mods = dakaModules(dakaQuestions);
        const sheets = ['全部'].concat([...new Set(dakaQuestions.map(q => q.sheet || '未分类'))]);
        const prios = ['全部'].concat([...new Set(dakaQuestions.map(q => q.priority_label || '未分类'))]);
        const dones = ['全部', '已完成', '未完成'];
        if (!force && dakaFilter.module !== '全部' && !mods.includes(dakaFilter.module)) dakaFilter.module = '全部';
        if (!force && dakaFilter.sheet !== '全部' && !sheets.includes(dakaFilter.sheet)) dakaFilter.sheet = '全部';
        if (!force && dakaFilter.priority !== '全部' && !prios.includes(dakaFilter.priority)) dakaFilter.priority = '全部';

        const chip = (list, active, dim, label) => list.map(v => {
            const on = v === active;
            return `<a class="review-chip ${on ? 'review-chip-all' : ''}" data-dim="${dim}" data-val="${esc(v)}"
                onclick="setDakaFilter('${dim}','${esc(v)}')">${label ? esc(v) : esc(v)}</a>`;
        }).join('');

        document.getElementById('dakaFilterModule').innerHTML = chip(mods, dakaFilter.module, 'module');
        document.getElementById('dakaFilterSheet').innerHTML = chip(sheets, dakaFilter.sheet, 'sheet');
        document.getElementById('dakaFilterDone').innerHTML = chip(dones, dakaFilter.done, 'done');
        document.getElementById('dakaFilterPriority').innerHTML = chip(prios, dakaFilter.priority, 'priority');
    }

    function setDakaFilter(dim, val) {
        dakaFilter[dim] = val;
        localStorage.setItem('daka_filter_' + dim, val);
        renderFilters();
        renderDaka();
    }

    function filteredDaka() {
        return dakaQuestions.filter(q =>
            (dakaFilter.module === '全部' || q.module === dakaFilter.module) &&
            (dakaFilter.sheet === '全部' || q.sheet === dakaFilter.sheet) &&
            (dakaFilter.priority === '全部' || q.priority_label === dakaFilter.priority) &&
            (dakaFilter.done === '全部' ||
                (dakaFilter.done === '已完成' ? !!dakaProgress[q.id] : !dakaProgress[q.id]))
        );
    }

    function restoreDakaFilter() {
        const def = { module: '全部', sheet: '全部', priority: '全部', done: '全部' };
        for (const k of Object.keys(def)) {
            const v = localStorage.getItem('daka_filter_' + k);
            if (v) dakaFilter[k] = v;
        }
    }

    function renderDaka() {
        const list = filteredDaka();
        const allCount = list.length;
        const doneCount = list.filter(q => dakaProgress[q.id]).length;
        document.getElementById('dakaSummary').innerHTML =
            `已打卡 <b>${doneCount}</b> / ${allCount} 题` +
            (allCount < dakaQuestions.length ? ` <span class="daka-filtered-hint">（已按筛选显示 ${allCount}/${dakaQuestions.length}）</span>` : '');

        // 按优先级分组，默认全部收起，通过左侧导航定位题目
        const groups = new Map();
        for (const q of list) {
            if (!groups.has(q.priority_label)) groups.set(q.priority_label, []);
            groups.get(q.priority_label).push(q);
        }
        let html = '';
        let nav = '';
        dakaGroups = [];
        let gi = 0;
        for (const [label, qs] of groups) {
            dakaGroups.push({label, qs});
            const gDone = qs.filter(q => dakaProgress[q.id]).length;
            const subs = qs.map(q => {
                const done = !!dakaProgress[q.id];
                const year = (q.real || '').match(/\d{4}/);
                // 左目录项：真题只留年份（如 2009），教材习题去掉「王道书」前缀（如 2.3.7_大题_1）
                let item;
                if (year) item = year[0];
                else item = (q.source || '').replace(/^王道书\s*/, '');
                return `<a class="ol-nav-item sub${done ? ' daka-nav-done' : ''}" data-target="card-${q.id}" data-label="${esc(item)}"
                    title="${esc(q.module)} / ${esc(q.kaodian)} · ${esc(q.real || q.source || '')}">${done ? '✓ ' : ''}${esc(item)}</a>`;
            }).join('');
            nav += `<div class="ol-nav-sec">
                <a class="ol-nav-item root" data-group="${gi}">${esc(label)}（${gDone}/${qs.length}）</a>
                <div class="ol-nav-subs">${subs}</div>
            </div>`;
            html += `<details class="daka-group" id="group-${gi}">
                <summary class="daka-group-title">${esc(label)}（${gDone}/${qs.length}）</summary>
                ${qs.map(renderCard).join('')}
            </details>`;
            gi++;
        }
        const navEl = document.getElementById('dakaNav');
        navEl.innerHTML = `<div class="ol-nav-head" onclick="toggleDakaNav()">定位<span class="ol-nav-toggle">«</span></div>
            <div class="ol-nav-body">${nav}</div>`;
        navEl.classList.toggle('collapsed', dakaNavCollapsed);
        navEl.querySelectorAll('.ol-nav-item.sub').forEach(a => {
            a.addEventListener('click', () => gotoDaka(a.dataset.target));
        });
        navEl.querySelectorAll('.ol-nav-item.root').forEach(a => {
            a.addEventListener('click', () => toggleDakaGroup(parseInt(a.dataset.group, 10)));
        });
        document.getElementById('dakaList').innerHTML = list.length === 0
            ? `<div class="daka-empty">该筛选条件下没有题目，换个条件试试</div>`
            : html;
        // 视口驱动预热：只对"即将进入视口"的图触发 SW 缓存（常见场景是展开某组时预取其图），
        // 不再一次性 fetch 全库 162 张图（那是首屏慢的根源）。滚动/展开时会按需继续预热。
        warmVisibleFigures('#dakaList img');
        // 重渲染后重放划词高亮与已存笔记（DOM 被重建，锚点/高亮/笔记块需重新挂载）
        refreshDakaAnno();
    }

    let _dakaWarmObs = null;
    function warmVisibleFigures(selector) {
        const imgs = [...document.querySelectorAll(selector)];
        if (!imgs.length) return;
        if (typeof IntersectionObserver === 'undefined') {   // 降级：不预热（浏览 lazy 仍按需加载）
            return;
        }
        if (_dakaWarmObs) _dakaWarmObs.disconnect();
        _dakaWarmObs = new IntersectionObserver((entries) => {
            const need = [];
            for (const en of entries) {
                if (!en.isIntersecting) continue;
                const src = en.target.getAttribute('src') || en.target.getAttribute('data-src');
                if (src) need.push(src);
                _dakaWarmObs.unobserve(en.target);
            }
            if (need.length) warmFigureCache(need);
        }, { rootMargin: '600px' });
        imgs.forEach(im => _dakaWarmObs.observe(im));
    }

    function toggleDakaNav() {
        dakaNavCollapsed = !dakaNavCollapsed;
        localStorage.setItem('daka_nav_collapsed', dakaNavCollapsed ? '1' : '0');
        document.getElementById('dakaNav').classList.toggle('collapsed', dakaNavCollapsed);
    }

    function expandDakaNav() {
        dakaNavCollapsed = false;
        localStorage.setItem('daka_nav_collapsed', '0');
        document.getElementById('dakaNav').classList.remove('collapsed');
    }

    function openDakaNav() {
        document.getElementById('dakaNav').classList.add('open');
        document.getElementById('dakaNavMask').classList.add('open');
    }

    function closeDakaNav() {
        document.getElementById('dakaNav').classList.remove('open');
        document.getElementById('dakaNavMask').classList.remove('open');
    }

    function toggleDakaGroup(idx) {
        const det = document.getElementById('group-' + idx);
        if (det) {
            det.open = !det.open;
            void det.offsetHeight;
            scrollToEl(det);
        }
    }

    function gotoDaka(target) {
        const card = document.getElementById(target);
        if (card) {
            const det = card.closest('details.daka-group');
            if (det && !det.open) {
                det.open = true;
                void det.offsetHeight;
            }
            scrollToEl(card);
            card.classList.add('map-flash');
            setTimeout(() => card.classList.remove('map-flash'), 1500);
        }
        closeDakaNav();
    }

    // 手动定位：避开顶部 sticky 导航栏（约60px），保证标题可见
    function scrollToEl(el) {
        const top = el.getBoundingClientRect().top + window.scrollY - 76;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }

    function badgeClass(p) {
        return p === 0 ? 'badge-must' : p === 1 ? 'badge-high' : p === 4 ? 'badge-low' : 'badge-mid';
    }

    // 代码题讲义解法渲染（与 code.html 同构：多解法 → 思路/代码/复杂度，样式由 style.css 的 .sol-* 提供）
    function solHtml(q) {
        const s = q.solutions || {};
        const list = s.list || [];
        if (!list.length) {
            const b = q.brute;
            if (!b) return '';
            return `<div class="code-brute">
                <div class="code-brute-head">💪 ${esc(b.method || '暴力解')} <span class="sol-tag-fb">自生成</span></div>
                <div class="sol-sec">基本设计思想</div>
                <div class="sol-text">${b.idea || ''}</div>
                <div class="sol-sec">代码</div>
                <pre class="code-block">${esc(b.code || '')}</pre>
            </div>`;
        }
        const table = (s.score_rows || []).length ? `
            <table class="sol-score">
                <tr><th>做题思路</th><th>方法</th><th>预计得分</th></tr>
                ${s.score_rows.map(r => `<tr><td>${esc(r.approach)}</td><td>${esc(r.method)}</td><td class="sol-score-num">${esc(r.score)}</td></tr>`).join('')}
            </table>` : '';
        return `<div class="sol-wrap">
            <div class="sol-source">📘 ${esc(s.source || '')}</div>
            ${table}
            ${list.map((x, i) => `
                <details class="sol-fold"${i === 0 ? ' open' : ''}>
                    <summary class="sol-head">${esc(x.tag || ('解法' + (i + 1)))}${x.kind ? ' · ' + esc(x.kind) : ''}${x.name ? ' · ' + esc(x.name) : ''}</summary>
                    <div class="sol-item">
                    ${x.analysis ? `<div class="sol-sec">解析</div><div class="sol-text">${esc(x.analysis)}</div>` : ''}
                    ${x.thought ? `<div class="sol-sec">基本设计思想</div><div class="sol-text">${esc(x.thought)}</div>` : ''}
                    ${x.code ? `<div class="sol-sec">代码</div><pre class="code-block">${esc(x.code)}</pre>` : ''}
                    ${x.complexity ? `<div class="sol-cx">${esc(x.complexity)}</div>` : ''}
                    ${x.note ? `<div class="sol-note">${esc(x.note)}</div>` : ''}
                    </div>
                </details>`).join('')}
        </div>`;
    }

    function renderCard(q) {
        const done = !!dakaProgress[q.id];
        const figs = q.figs || {content: [], answer: []};
        const img = n => `<img src="data/daka_figs/${n}" loading="lazy" alt="教材原图" onclick="openFigLightbox(this.src)">`;
        const figWrap = (arr, label) => arr && arr.length ? `<div class="code-figs"><div class="code-figs-label">📷 ${label}</div>${arr.map(img).join('')}</div>` : '';
        // 打卡表已改纯教材原图：ds_daka.json 不再存题目/答案文字，卡片只渲染教材原图。
        // 文字字段仍兼容（若有则排在图前）；图与文字都缺时给占位，避免出现空白卡片。
        const content = [fmtContent(q.content || ''), figWrap(figs.content, '题目教材原图')].join('') || '（题目见教材原图）';
        // 打卡表算法题若在代码题讲义(ds_code.json)中有映射(source 逐字一致)，
        // 答案折叠区升级为 code.html 同款完整讲义：考点分析·易错点 + 各解法(思路/代码/复杂度) + 保留解答教材原图。
        const cd = codeBySource.get(q.source);
        const hasLecture = cd && (cd.solutions || {}).list && cd.solutions.list.length;
        // 真题（real 含 4 位年份）卡片：解答教材原图拆出为独立的「📷 解答原图」按钮区，
        // 点按钮只看该图，不用展开整个讲义/答案面板（与代码题页面一致）。
        const isReal = !!(q.real && /\d{4}/.test(q.real));
        const hasAnsFig = (figs.answer || []).length > 0;
        let summary = '查看答案';
        let answer = [fmtAnswer(q.answer || ''), figWrap(figs.answer, '解答教材原图')].join('') || '（解答见教材原图）';
        if (hasLecture) {
            summary = '考点分析 · 易错点 · 讲义解法';
            answer = `
                <div class="daka-analysis">${esc((cd.analysis || '').replace('易错点：', '\n易错点：'))}</div>
                ${solHtml(cd)}${isReal ? '' : figWrap(figs.answer, '解答教材原图')}`;
        } else if (isReal) {
            answer = [fmtAnswer(q.answer || '')].join('') || '（解答见上方「解答原图」）';
        }
        const ansfigOpen = dakaAnsfigOpen.has(q.id);
        // 按钮紧贴折叠标题右侧；点击只切换原图区，不展开/收起面板（preventDefault + stopPropagation）
        const ansfigBtn = (isReal && hasAnsFig) ? `<button class="btn-daka ansfig-toggle${ansfigOpen ? ' checked' : ''}" onclick="event.preventDefault();event.stopPropagation();toggleAnsFig('${q.id}')" title="只看解答教材原图">
                    📷 解答原图${ansfigOpen ? ' ▴' : ' ▾'}
                </button>` : '';
        const ansfigBlock = (isReal && hasAnsFig) ? `
                <div class="code-ansfig" id="ansfig-${q.id}"${ansfigOpen ? '' : ' hidden'}>
                    ${figWrap(figs.answer, '解答教材原图')}
                </div>` : '';
        // 批注按钮：与「📷 解答原图」并排放在折叠标题旁；卡片顶部 .daka-notes 承载已存笔记
        const annoBtn = `<button class="btn-daka anno-toggle" onclick="event.preventDefault();event.stopPropagation();openDakaAnnoEditor('${q.id}')" title="写批注（支持 Ctrl+V 粘贴截图）">📝 批注</button>`;
        return `
            <div class="daka-card${done ? ' daka-done' : ''}" id="card-${q.id}" data-blk="${esc(q.id)}">
                <div class="daka-card-header">
                    <span class="daka-badge ${badgeClass(q.priority)}">${q.priority_label}</span>
                    <span class="daka-source">${q.source}${q.real ? ' · ' + q.real : ''}</span>
                    <button class="btn-daka${done ? ' checked' : ''}" onclick="toggleDaka('${q.id}')">
                        ${done ? '已打卡 ✓' : '打卡'}
                    </button>
                </div>
                <div class="daka-kaodian">${q.module} / ${q.kaodian}</div>
                <div class="daka-content">${content}</div>
                <div class="daka-notes"></div>
                <details class="daka-answer">
                    <summary>${summary}${annoBtn}${ansfigBtn}</summary>
                    <div class="daka-answer-body">${answer}</div>
                </details>
                ${ansfigBlock}
            </div>
        `;
    }

    function toggleAnsFig(qid) {
        const block = document.getElementById('ansfig-' + qid);
        const btn = document.querySelector(`button.ansfig-toggle[onclick*="${qid}"]`);
        if (!block) return;
        const open = block.hasAttribute('hidden');
        block.hidden = !open;
        if (btn) {
            btn.classList.toggle('checked', open);
            btn.textContent = '📷 解答原图' + (open ? ' ▴' : ' ▾');
        }
        if (open) dakaAnsfigOpen.add(qid); else dakaAnsfigOpen.delete(qid);
        localStorage.setItem('daka_ansfig_open', JSON.stringify([...dakaAnsfigOpen]));
    }

    async function toggleDaka(qid) {
        const done = !dakaProgress[qid];
        try {
            await api('/api/daka/progress', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question_id: qid, done: done})
            });
            if (done) dakaProgress[qid] = new Date().toISOString();
            else delete dakaProgress[qid];
            updateDakaCard(qid);
        } catch (e) {
            alert('打卡失败，请重试');
        }
    }

    // 打卡后只更新对应卡片/汇总/组标题/导航项，不重渲染整表（避免打开的组被收起、滚动跳回顶部）
    function updateDakaCard(qid) {
        const done = !!dakaProgress[qid];
        const card = document.getElementById('card-' + qid);
        if (card) {
            card.classList.toggle('daka-done', done);
            const btn = card.querySelector('.btn-daka');
            if (btn) {
                btn.classList.toggle('checked', done);
                btn.textContent = done ? '已打卡 ✓' : '打卡';
            }
        }
        const doneCount = dakaQuestions.filter(q => dakaProgress[q.id]).length;
        const sum = document.getElementById('dakaSummary');
        if (sum) sum.innerHTML = `已打卡 <b>${doneCount}</b> / ${dakaQuestions.length} 题`;
        const gIdx = dakaGroups.findIndex(g => g.qs.some(q => q.id === qid));
        if (gIdx >= 0) {
            const group = dakaGroups[gIdx];
            const gDone = group.qs.filter(q => dakaProgress[q.id]).length;
            const title = `${group.label}（${gDone}/${group.qs.length}）`;
            if (card) {
                const det = card.closest('details.daka-group');
                const sumEl = det ? det.querySelector('summary.daka-group-title') : null;
                if (sumEl) sumEl.textContent = title;
            }
            const navRoot = document.querySelector(`.ol-nav-item.root[data-group="${gIdx}"]`);
            if (navRoot) navRoot.textContent = title;
        }
        const navItem = document.querySelector(`.ol-nav-item.sub[data-target="card-${qid}"]`);
        if (navItem) {
            navItem.classList.toggle('daka-nav-done', done);
            navItem.innerHTML = (done ? '✓ ' : '') + esc(navItem.getAttribute('data-label') || '');
        }
    }

    /* ==================== 划词高亮 + 行级批注（复用笔记主页机制） ====================
       锚定：每张卡片 .daka-card 即一个块，data-blk = 题目 id（筛选/重渲染后仍稳定）；
       高亮按卡片内字符偏移，批注按卡片 id；均走 /api/note 持久化（key 用 cn_ 前缀满足 note 路由的科目解析）。
       已存笔记统一渲染到卡片顶部 .daka-notes（位于「考点分析·易错点·讲义解法」折叠标题上方），
       入口按钮「📝 批注」与「📷 解答原图」并排在折叠标题右侧。
       函数无条件定义（无 api/工具条函数的环境自然短路），调用点带 typeof 守卫。 */
    const DAKA_ANNO_KEY = 'cn_daka_anno';
    const DAKA_HL_KEY = 'cn_daka_hl';

    const dakaBlkEl = el => el.closest ? el.closest('[data-blk]') : null;
    function dakaInAnno(n) {
        const el = n.nodeType === 1 ? n : n.parentElement;
        return !!(el && el.closest && el.closest('.line-anno'));
    }
    const dakaHlFilter = { acceptNode: n => dakaInAnno(n) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT };

    function dakaCleanText(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, dakaHlFilter);
        let t = '', node;
        while ((node = walker.nextNode())) t += node.nodeValue;
        return t;
    }
    function dakaOffsetIn(root, container, offset) {
        const target = container.nodeType === 3 ? container : (container.childNodes[offset] || null);
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, dakaHlFilter);
        let pos = 0, node;
        while ((node = walker.nextNode())) {
            if (container.nodeType === 3) { if (node === container) return pos + offset; }
            else if (target && (target === node || (target.contains && target.contains(node)))) return pos;
            pos += node.nodeValue.length;
        }
        return pos;
    }
    function dakaWrapRange(root, start, end, cls, ds) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, dakaHlFilter);
        let pos = 0, node;
        const pieces = [];
        while ((node = walker.nextNode())) {
            const len = node.nodeValue.length;
            const ns = pos, ne = pos + len;
            pos = ne;
            if (ne <= start || ns >= end) continue;
            pieces.push({ node, s: Math.max(start, ns) - ns, e: Math.min(end, ne) - ns });
        }
        for (let i = pieces.length - 1; i >= 0; i--) {
            const p = pieces[i];
            const range = document.createRange();
            range.setStart(p.node, p.s);
            range.setEnd(p.node, p.e);
            const span = document.createElement('span');
            span.className = cls;
            if (ds) { span.dataset.start = ds.start; span.dataset.color = ds.color; }
            range.surroundContents(span);
        }
    }

    let dakaHlItems = [];        // [{blk, start, end, color, text}]
    let dakaHlTimer = null, dakaHlToolbar = null, dakaHlMouseupTimer = null;
    const DAKA_HL_COLORS = ['yellow', 'green', 'blue', 'pink'];

    let dakaAnnoItems = [];      // [{blk, text, images}]
    let dakaAnnoTimer = null;
    let dakaAnnoEditor = null;   // {blk, el, images}
    let dakaAnnoReady = false;

    /* 事件只绑一次（容器常驻，内容重渲染不影响委托） */
    let dakaAnnoEventsBound = false;
    function initDakaAnnoEvents() {
        if (dakaAnnoEventsBound) return;
        dakaAnnoEventsBound = true;
        const list = document.getElementById('dakaList');
        if (!list) return;
        list.addEventListener('click', e => {
            const span = e.target.closest && e.target.closest('.note-hl');
            if (span) { e.stopPropagation(); showDakaHlCancelFor(span); }
        });
        list.addEventListener('mouseup', () => {
            clearTimeout(dakaHlMouseupTimer);
            dakaHlMouseupTimer = setTimeout(showDakaHlToolbar, 0);
        });
        document.addEventListener('mousedown', e => {
            if (dakaHlToolbar && !dakaHlToolbar.contains(e.target)) hideDakaHlToolbar();
        });
    }

    function hideDakaHlToolbar() { if (dakaHlToolbar) { dakaHlToolbar.remove(); dakaHlToolbar = null; } }

    function showDakaHlToolbar() {
        if (dakaHlToolbar && dakaHlToolbar.classList.contains('hl-cancel-only')) return;
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || !sel.rangeCount) { hideDakaHlToolbar(); return; }
        const range = sel.getRangeAt(0);
        const blk = dakaBlkEl(range.startContainer);
        if (!blk || dakaBlkEl(range.endContainer) !== blk) { hideDakaHlToolbar(); return; }
        if (dakaInAnno(range.startContainer) || dakaInAnno(range.endContainer)) { hideDakaHlToolbar(); return; }
        hideDakaHlToolbar();
        const rect = range.getBoundingClientRect();
        dakaHlToolbar = document.createElement('div');
        dakaHlToolbar.className = 'hl-toolbar';
        dakaHlToolbar.innerHTML = DAKA_HL_COLORS.map(c =>
            `<span class="hl-dot hl-dot-${c}" data-color="${c}" title="${c}"></span>`).join('') +
            '<span class="hl-anno-btn" title="批注此块">📝批注</span>' +
            '<span class="hl-cancel" title="取消高亮">✕</span>';
        document.body.appendChild(dakaHlToolbar);
        dakaHlToolbar.style.top = (window.scrollY + rect.top - dakaHlToolbar.offsetHeight - 8) + 'px';
        dakaHlToolbar.style.left = (window.scrollX + rect.left) + 'px';
        dakaHlToolbar.querySelectorAll('.hl-dot').forEach(dot =>
            dot.addEventListener('click', () => applyDakaHighlight(blk, range, dot.dataset.color)));
        dakaHlToolbar.querySelector('.hl-anno-btn').addEventListener('click', () => {
            window.getSelection().removeAllRanges();
            hideDakaHlToolbar();
            openDakaAnnoEditor(blk.dataset.blk);
        });
        dakaHlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
            const parent = range.startContainer.parentElement || range.startContainer;
            const span = parent.closest ? parent.closest('.note-hl') : null;
            if (span) removeDakaHighlight(span);
            hideDakaHlToolbar();
        });
    }

    function showDakaHlCancelFor(span) {
        clearTimeout(dakaHlMouseupTimer);
        hideDakaHlToolbar();
        const rect = span.getBoundingClientRect();
        dakaHlToolbar = document.createElement('div');
        dakaHlToolbar.className = 'hl-toolbar hl-cancel-only';
        dakaHlToolbar.innerHTML = '<span class="hl-cancel" title="取消高亮">✕ 取消高亮</span>';
        document.body.appendChild(dakaHlToolbar);
        dakaHlToolbar.style.top = (window.scrollY + rect.top - dakaHlToolbar.offsetHeight - 8) + 'px';
        dakaHlToolbar.style.left = (window.scrollX + rect.left) + 'px';
        dakaHlToolbar.querySelector('.hl-cancel').addEventListener('click', () => {
            removeDakaHighlight(span);
            hideDakaHlToolbar();
        });
    }

    function applyDakaHighlight(blk, range, color) {
        const start = dakaOffsetIn(blk, range.startContainer, range.startOffset);
        const end = dakaOffsetIn(blk, range.endContainer, range.endOffset);
        if (end <= start) { hideDakaHlToolbar(); return; }
        const text = range.toString();
        const id = blk.dataset.blk;
        dakaHlItems.push({ blk: id, start, end, color, text });
        dakaWrapRange(blk, start, end, 'note-hl note-hl-' + color, { start, color });
        window.getSelection().removeAllRanges();
        hideDakaHlToolbar();
        saveDakaHl();
    }

    function removeDakaHighlight(span) {
        const blk = dakaBlkEl(span);
        if (!blk) return;
        const start = +span.dataset.start;
        const color = span.dataset.color;
        const id = blk.dataset.blk;
        dakaHlItems = dakaHlItems.filter(it => !(it.blk === id && it.start === start && it.color === color));
        blk.querySelectorAll('.note-hl').forEach(s => {
            if (+s.dataset.start === start && s.dataset.color === color) {
                const parent = s.parentNode;
                while (s.firstChild) parent.insertBefore(s.firstChild, s);
                parent.removeChild(s);
                parent.normalize();
            }
        });
        saveDakaHl();
    }

    function saveDakaHl() {
        clearTimeout(dakaHlTimer);
        dakaHlTimer = setTimeout(async () => {
            try {
                await api('/api/note/' + encodeURIComponent(DAKA_HL_KEY), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: JSON.stringify(dakaHlItems), images: [] })
                });
            } catch (e) { /* 高亮保存失败静默 */ }
        }, 500);
    }

    function reapplyDakaHighlights() {
        const retained = [];
        document.querySelectorAll('[data-blk]').forEach(el => {
            const id = el.dataset.blk;
            const list = dakaHlItems.filter(it => it.blk === id);
            if (!list.length) return;
            const full = dakaCleanText(el);
            list.sort((a, b) => a.start - b.start);
            for (const it of list) {
                let { start, end } = it;
                if (full.slice(start, end) !== it.text) {
                    const idx = full.indexOf(it.text);
                    if (idx < 0 || !it.text) continue;
                    start = idx; end = idx + it.text.length;
                }
                dakaWrapRange(el, start, end, 'note-hl note-hl-' + it.color, { start, color: it.color });
                retained.push({ blk: id, start, end, color: it.color, text: it.text });
            }
        });
        dakaHlItems = retained;
    }

    async function loadDakaHighlights() {
        if (typeof api !== 'function') return;
        let items = [];
        try {
            const resp = await api('/api/note/' + encodeURIComponent(DAKA_HL_KEY));
            const d = await resp.json();
            items = d.note ? JSON.parse(d.note) : [];
        } catch (e) { return; }
        if (!Array.isArray(items) || !items.length) return;
        dakaHlItems = items.filter(it => it && typeof it.blk === 'string');
        reapplyDakaHighlights();
    }

    // ---------- 批注 ----------
    const dakaAnnoOf = id => dakaAnnoItems.find(a => a.blk === id);
    const dakaNotesBox = id => {
        const el = document.querySelector(`[data-blk="${CSS.escape(id)}"]`);
        return el ? el.querySelector('.daka-notes') : null;
    };

    function viewDakaAnnoImg(id, i) {
        const item = dakaAnnoOf(id);
        if (!item || !item.images || !item.images[i]) return;
        const ov = document.createElement('div');
        ov.className = 'img-lightbox';
        ov.innerHTML = `<img src="${item.images[i]}" alt="批注图片">`;
        ov.onclick = () => ov.remove();
        document.body.appendChild(ov);
    }

    function isDakaHtmlNote(s) { return /<[a-zA-Z][^>]*>/.test(s || ''); }

    function dakaAnnoBlockHtml(id) {
        const item = dakaAnnoOf(id);
        if (!item) return '';
        const imgs = (item.images || []).map((src, i) =>
            `<img class="line-anno-img" src="${src}" alt="批注图片" onclick="viewDakaAnnoImg('${id}', ${i})">`).join('');
        const textHtml = item.text ? (isDakaHtmlNote(item.text) ? item.text : esc(item.text)) : '';
        return `<div class="line-anno line-anno-block" data-blk="${CSS.escape(id)}">
            <span class="line-anno-icon">📝</span>
            <div class="line-anno-body">
                ${item.text ? `<div class="line-anno-text">${textHtml}</div>` : ''}
                ${imgs}
            </div>
            <div class="line-anno-ops">
                <button type="button" class="line-anno-op" onclick="openDakaAnnoEditor('${id}')">改</button>
                <button type="button" class="line-anno-op line-anno-del" onclick="delDakaAnno('${id}')">删</button>
            </div>
        </div>`;
    }

    function openDakaAnnoEditor(id) {
        closeDakaAnnoEditor();
        const blk = document.querySelector(`[data-blk="${CSS.escape(id)}"]`);
        const box = dakaNotesBox(id);
        if (!blk || !box) return;
        const item = dakaAnnoOf(id);
        const el = document.createElement('div');
        el.className = 'line-anno line-anno-editor';
        el.innerHTML = `
            ${noteToolbarHtml()}
            <div class="note-input line-anno-input" contenteditable="true" spellcheck="false"
                data-placeholder="写批注，可 Ctrl+V 粘贴截图…"></div>
            <div class="note-images line-anno-editor-imgs"></div>
            <div class="line-anno-bar">
                <button type="button" class="btn btn-primary line-anno-save">保存</button>
                <button type="button" class="btn btn-secondary line-anno-cancel">取消</button>
            </div>`;
        dakaAnnoEditor = { blk: id, el, images: item ? (item.images || []).slice() : [] };
        const existing = box.querySelector('.line-anno-block');
        if (existing) existing.style.display = 'none';
        box.insertAdjacentElement('beforeend', el);
        const input = el.querySelector('.line-anno-input');
        loadNoteIntoEditor(input, item ? (item.text || '') : '');
        updateNotePlaceholder(input);
        renderDakaEditorImages();
        input.addEventListener('paste', pasteDakaAnnoImage);
        bindNoteToolbar(input);
        el.querySelector('.line-anno-save').addEventListener('click', saveDakaAnnoEditor);
        el.querySelector('.line-anno-cancel').addEventListener('click', () => closeDakaAnnoEditor());
        input.focus();
    }
    function closeDakaAnnoEditor() {
        if (!dakaAnnoEditor) return;
        const box = dakaNotesBox(dakaAnnoEditor.blk);
        const existing = box && box.querySelector('.line-anno-block');
        if (existing) existing.style.display = '';
        dakaAnnoEditor.el.remove();
        dakaAnnoEditor = null;
    }
    function renderDakaEditorImages() {
        if (!dakaAnnoEditor) return;
        const box = dakaAnnoEditor.el.querySelector('.line-anno-editor-imgs');
        box.innerHTML = (dakaAnnoEditor.images || []).map((src, i) => `
            <div class="note-img-item">
                <img src="${src}" alt="批注图片">
                <span class="note-img-del" data-i="${i}" title="删除图片">×</span>
            </div>`).join('');
        box.querySelectorAll('.note-img-del').forEach(d => d.onclick = () => {
            dakaAnnoEditor.images.splice(+d.dataset.i, 1);
            renderDakaEditorImages();
        });
    }
    function dakaCompressImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                if (ctx) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }
                URL.revokeObjectURL(img.src);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => reject(new Error('图片读取失败'));
            img.src = URL.createObjectURL(file);
        });
    }
    async function pasteDakaAnnoImage(event) {
        if (!dakaAnnoEditor) return;
        const files = [...(event.clipboardData ? event.clipboardData.items : [])]
            .filter(it => it.type.startsWith('image/'))
            .map(it => it.getAsFile())
            .filter(Boolean);
        if (!files.length) return;
        event.preventDefault();
        try {
            for (const f of files) dakaAnnoEditor.images.push(await dakaCompressImage(f));
        } catch (e) { if (typeof alert === 'function') alert(e.message); }
        renderDakaEditorImages();
    }
    function saveDakaAnnoEditor() {
        if (!dakaAnnoEditor) return;
        const id = dakaAnnoEditor.blk;
        const text = serializeNote(dakaAnnoEditor.el.querySelector('.line-anno-input'));
        const images = dakaAnnoEditor.images;
        dakaAnnoItems = dakaAnnoItems.filter(a => a.blk !== id);
        if (text || images.length) dakaAnnoItems.push({ blk: id, text, images });
        dakaAnnoEditor.el.remove();
        dakaAnnoEditor = null;
        renderDakaAnnos();
        saveDakaAnnos();
    }
    function delDakaAnno(id) {
        if (typeof confirm === 'function' && !confirm('删除这条批注？')) return;
        dakaAnnoItems = dakaAnnoItems.filter(a => a.blk !== id);
        renderDakaAnnos();
        saveDakaAnnos();
    }
    function saveDakaAnnos() {
        clearTimeout(dakaAnnoTimer);
        dakaAnnoTimer = setTimeout(async () => {
            try {
                await api('/api/note/' + encodeURIComponent(DAKA_ANNO_KEY), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: JSON.stringify(dakaAnnoItems), images: [] })
                });
            } catch (e) { /* 静默 */ }
        }, 300);
    }
    /* 已存笔记统一渲染到卡片顶部 .daka-notes（折叠标题 / 解答原图按钮上方） */
    function renderDakaAnnos() {
        document.querySelectorAll('[data-blk] .daka-notes').forEach(box => {
            const id = box.closest('[data-blk]').dataset.blk;
            box.innerHTML = dakaAnnoOf(id) ? dakaAnnoBlockHtml(id) : '';
        });
    }
    async function loadDakaAnnos() {
        if (typeof api !== 'function') return;
        let items = [];
        try {
            const resp = await api('/api/note/' + encodeURIComponent(DAKA_ANNO_KEY));
            const d = await resp.json();
            items = d.note ? JSON.parse(d.note) : [];
        } catch (e) { return; }
        if (!Array.isArray(items) || !items.length) return;
        dakaAnnoItems = items.filter(it => it && typeof it.blk === 'string');
        renderDakaAnnos();
    }

    /* 渲染（含筛选重渲染）后重放高亮与批注；首屏由 loadDaka 启用 */
    function refreshDakaAnno() {
        if (!dakaAnnoReady) return;
        reapplyDakaHighlights();
        renderDakaAnnos();
    }

    function initDakaAnno() {
        dakaAnnoReady = true;
        initDakaAnnoEvents();
        loadDakaHighlights();
        loadDakaAnnos();
    }

    window.viewDakaAnnoImg = viewDakaAnnoImg;
    window.openDakaAnnoEditor = openDakaAnnoEditor;
    window.delDakaAnno = delDakaAnno;

    loadDaka();
    // 状态持久化：恢复组展开状态（折叠面板）+ 滚动位置；离开时保存
    const grp = PS.get({ groups: null }).groups;
    if (Array.isArray(grp)) {
        document.querySelectorAll('details[id^="group-"]').forEach(d => { d.open = grp.includes(d.id); });
    }
    window.addEventListener('pagehide', () => PS.set({
        groups: [...document.querySelectorAll('details[id^="group-"]')].filter(d => d.open).map(d => d.id)
    }));
    PS.restoreScroll();
    </script>
</body>
