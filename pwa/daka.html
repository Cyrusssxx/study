<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据结构强化打卡 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="code.html" class="nav-link">代码题</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="page-header">
            <h1>📌 数据结构强化打卡</h1>
            <p>王道打卡表精选代码大题，按优先级排序，完成一题打卡一题</p>
        </div>

        <div class="daka-summary" id="dakaSummary"></div>

        <div class="ol-layout">
            <aside class="ol-nav" id="dakaNav"></aside>
            <button class="ol-nav-tab" id="dakaNavTab" onclick="expandDakaNav()" title="展开目录">☰ 目录</button>
            <div class="question-list" id="dakaList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </main>
    <button class="ol-nav-fab" id="dakaNavFab" onclick="openDakaNav()" title="定位题目">☰ 定位</button>
    <div class="ol-nav-mask" id="dakaNavMask" onclick="closeDakaNav()"></div>
    <script src="js/common.js"></script>
    <script src="js/backend.js"></script>
    <script>
    let dakaQuestions = [];
    let dakaProgress = {};
    let dakaGroups = [];
    let dakaNavCollapsed = localStorage.getItem('daka_nav_collapsed') === '1';

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadDaka() {
        try {
            const [qResp, pResp] = await Promise.all([
                fetch('data/ds_daka.json'),
                api('/api/daka/progress')
            ]);
            dakaQuestions = (await qResp.json()).questions;
            dakaProgress = (await pResp.json()).progress || {};
            renderDaka();
        } catch (e) {
            document.getElementById('dakaList').innerHTML = `<div class="error">加载失败</div>`;
        }
    }

    function renderDaka() {
        const doneCount = dakaQuestions.filter(q => dakaProgress[q.id]).length;
        document.getElementById('dakaSummary').innerHTML =
            `已打卡 <b>${doneCount}</b> / ${dakaQuestions.length} 题`;

        // 按优先级分组，默认全部收起，通过左侧导航定位题目
        const groups = new Map();
        for (const q of dakaQuestions) {
            if (!groups.has(q.priority_label)) groups.set(q.priority_label, []);
            groups.get(q.priority_label).push(q);
        }
        let html = '';
        let nav = '';
        dakaGroups = [];
        let gi = 0;
        for (const [label, qs] of groups) {
            dakaGroups.push({label, qs});
            const gDone = qs.filter(q => dakaProgress[q.id]).length;
            const subs = qs.map(q => {
                const done = !!dakaProgress[q.id];
                const year = (q.real || '').match(/\d{4}/);
                const item = `${q.source}${year ? ' · ' + year[0] : ''}`;
                return `<a class="ol-nav-item sub${done ? ' daka-nav-done' : ''}" data-target="card-${q.id}" data-label="${esc(item)}"
                    title="${esc(q.module)} / ${esc(q.kaodian)} · ${esc(q.real || '')}">${done ? '✓ ' : ''}${esc(item)}</a>`;
            }).join('');
            nav += `<div class="ol-nav-sec">
                <a class="ol-nav-item root" data-group="${gi}">${esc(label)}（${gDone}/${qs.length}）</a>
                <div class="ol-nav-subs">${subs}</div>
            </div>`;
            html += `<details class="daka-group" id="group-${gi}">
                <summary class="daka-group-title">${esc(label)}（${gDone}/${qs.length}）</summary>
                ${qs.map(renderCard).join('')}
            </details>`;
            gi++;
        }
        const navEl = document.getElementById('dakaNav');
        navEl.innerHTML = `<div class="ol-nav-head" onclick="toggleDakaNav()">定位<span class="ol-nav-toggle">«</span></div>
            <div class="ol-nav-body">${nav}</div>`;
        navEl.classList.toggle('collapsed', dakaNavCollapsed);
        navEl.querySelectorAll('.ol-nav-item.sub').forEach(a => {
            a.addEventListener('click', () => gotoDaka(a.dataset.target));
        });
        navEl.querySelectorAll('.ol-nav-item.root').forEach(a => {
            a.addEventListener('click', () => toggleDakaGroup(parseInt(a.dataset.group, 10)));
        });
        document.getElementById('dakaList').innerHTML = html;
        // 预热打卡原图到 SW 缓存，离线查看不裂图（P0-1）
        warmFigureCache([...document.querySelectorAll('#dakaList img')].map(i => i.src));
    }

    function toggleDakaNav() {
        dakaNavCollapsed = !dakaNavCollapsed;
        localStorage.setItem('daka_nav_collapsed', dakaNavCollapsed ? '1' : '0');
        document.getElementById('dakaNav').classList.toggle('collapsed', dakaNavCollapsed);
    }

    function expandDakaNav() {
        dakaNavCollapsed = false;
        localStorage.setItem('daka_nav_collapsed', '0');
        document.getElementById('dakaNav').classList.remove('collapsed');
    }

    function openDakaNav() {
        document.getElementById('dakaNav').classList.add('open');
        document.getElementById('dakaNavMask').classList.add('open');
    }

    function closeDakaNav() {
        document.getElementById('dakaNav').classList.remove('open');
        document.getElementById('dakaNavMask').classList.remove('open');
    }

    function toggleDakaGroup(idx) {
        const det = document.getElementById('group-' + idx);
        if (det) {
            det.open = !det.open;
            void det.offsetHeight;
            scrollToEl(det);
        }
    }

    function gotoDaka(target) {
        const card = document.getElementById(target);
        if (card) {
            const det = card.closest('details.daka-group');
            if (det && !det.open) {
                det.open = true;
                void det.offsetHeight;
            }
            scrollToEl(card);
            card.classList.add('map-flash');
            setTimeout(() => card.classList.remove('map-flash'), 1500);
        }
        closeDakaNav();
    }

    // 手动定位：避开顶部 sticky 导航栏（约60px），保证标题可见
    function scrollToEl(el) {
        const top = el.getBoundingClientRect().top + window.scrollY - 76;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }

    function badgeClass(p) {
        return p === 0 ? 'badge-must' : p === 1 ? 'badge-high' : p === 4 ? 'badge-low' : 'badge-mid';
    }

    function renderCard(q) {
        const done = !!dakaProgress[q.id];
        const figs = q.figs || {content: [], answer: []};
        const img = n => `<img src="data/daka_figs/${n}" loading="lazy" alt="教材原图">`;
        // 题面/解答直接用教材原图，无图时才回退到提取文本
        const content = figs.content.length ? figs.content.map(img).join('') : q.content;
        const answer = figs.answer.length ? figs.answer.map(img).join('') : (q.answer || '（解答见教材）');
        return `
            <div class="daka-card${done ? ' daka-done' : ''}" id="card-${q.id}">
                <div class="daka-card-header">
                    <span class="daka-badge ${badgeClass(q.priority)}">${q.priority_label}</span>
                    <span class="daka-source">${q.source}${q.real ? ' · ' + q.real : ''}</span>
                    <button class="btn-daka${done ? ' checked' : ''}" onclick="toggleDaka('${q.id}')">
                        ${done ? '已打卡 ✓' : '打卡'}
                    </button>
                </div>
                <div class="daka-kaodian">${q.module} / ${q.kaodian}</div>
                <div class="daka-content">${fmtContent(content)}</div>
                <details class="daka-answer">
                    <summary>查看答案</summary>
                    <div class="daka-answer-body">${answer}</div>
                </details>
            </div>
        `;
    }

    async function toggleDaka(qid) {
        const done = !dakaProgress[qid];
        try {
            await api('/api/daka/progress', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question_id: qid, done: done})
            });
            if (done) dakaProgress[qid] = new Date().toISOString();
            else delete dakaProgress[qid];
            updateDakaCard(qid);
        } catch (e) {
            alert('打卡失败，请重试');
        }
    }

    // 打卡后只更新对应卡片/汇总/组标题/导航项，不重渲染整表（避免打开的组被收起、滚动跳回顶部）
    function updateDakaCard(qid) {
        const done = !!dakaProgress[qid];
        const card = document.getElementById('card-' + qid);
        if (card) {
            card.classList.toggle('daka-done', done);
            const btn = card.querySelector('.btn-daka');
            if (btn) {
                btn.classList.toggle('checked', done);
                btn.textContent = done ? '已打卡 ✓' : '打卡';
            }
        }
        const doneCount = dakaQuestions.filter(q => dakaProgress[q.id]).length;
        const sum = document.getElementById('dakaSummary');
        if (sum) sum.innerHTML = `已打卡 <b>${doneCount}</b> / ${dakaQuestions.length} 题`;
        const gIdx = dakaGroups.findIndex(g => g.qs.some(q => q.id === qid));
        if (gIdx >= 0) {
            const group = dakaGroups[gIdx];
            const gDone = group.qs.filter(q => dakaProgress[q.id]).length;
            const title = `${group.label}（${gDone}/${group.qs.length}）`;
            if (card) {
                const det = card.closest('details.daka-group');
                const sumEl = det ? det.querySelector('summary.daka-group-title') : null;
                if (sumEl) sumEl.textContent = title;
            }
            const navRoot = document.querySelector(`.ol-nav-item.root[data-group="${gIdx}"]`);
            if (navRoot) navRoot.textContent = title;
        }
        const navItem = document.querySelector(`.ol-nav-item.sub[data-target="card-${qid}"]`);
        if (navItem) {
            navItem.classList.toggle('daka-nav-done', done);
            navItem.innerHTML = (done ? '✓ ' : '') + esc(navItem.getAttribute('data-label') || '');
        }
    }

    loadDaka();
    </script>
</body>
</html>
