<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">总线结构演进 · 从单总线到片上集成</text>
  <text x="20" y="48" font-size="12" fill="#64748b">每一次演进都在解决同一个矛盾：所有设备抢一条总线</text>

  <rect x="16" y="62" width="316" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="84" font-size="12.5" font-weight="700" fill="#1e40af">① 单总线结构</text>
  <rect x="34" y="96" width="66" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="67" y="117" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">CPU</text>
  <rect x="128" y="96" width="66" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="161" y="117" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">主存</text>
  <rect x="222" y="96" width="86" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="265" y="117" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">I/O 设备</text>
  <line x1="40" y1="152" x2="308" y2="152" stroke="#4f46e5" stroke-width="4"/>
  <line x1="67" y1="128" x2="67" y2="150" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="161" y1="128" x2="161" y2="150" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="265" y1="128" x2="265" y2="150" stroke="#818cf8" stroke-width="1.5"/>
  <text x="174" y="170" font-size="10.5" fill="#4f46e5" text-anchor="middle">系统总线</text>
  <text x="30" y="192" font-size="10.5" fill="#64748b">简单便宜，但全部设备分时竞争，冲突频繁、效率最低</text>
  <text x="30" y="206" font-size="10.5" fill="#94a3b8">早期 CPU 的瓶颈就在这条线上</text>

  <rect x="348" y="62" width="316" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="362" y="84" font-size="12.5" font-weight="700" fill="#1e40af">② 双总线 / 三总线</text>
  <rect x="366" y="96" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="396" y="116" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">CPU</text>
  <rect x="452" y="96" width="60" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="482" y="116" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">主存</text>
  <rect x="546" y="96" width="86" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="589" y="116" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">I/O</text>
  <line x1="372" y1="146" x2="638" y2="146" stroke="#4f46e5" stroke-width="3.5"/>
  <text x="650" y="150" font-size="10" fill="#4f46e5">主存总线</text>
  <line x1="372" y1="176" x2="638" y2="176" stroke="#059669" stroke-width="3.5"/>
  <text x="650" y="180" font-size="10" fill="#059669">I/O 总线</text>
  <line x1="396" y1="126" x2="396" y2="144" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="482" y1="126" x2="482" y2="144" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="589" y1="126" x2="589" y2="174" stroke="#34d399" stroke-width="1.5"/>
  <text x="362" y="196" font-size="10.5" fill="#64748b">三总线再加 DMA 总线，允许高速外设与主存直接成块传送</text>
  <text x="362" y="210" font-size="10.5" fill="#94a3b8">双总线下 I/O 与主存交换仍需 CPU 中转</text>

  <rect x="16" y="222" width="316" height="158" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="244" font-size="12.5" font-weight="700" fill="#1e40af">③ 南北桥（Pentium 4 ~ 早期 Core）</text>
  <rect x="34" y="256" width="58" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="63" y="276" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">CPU</text>
  <rect x="122" y="250" width="86" height="42" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="165" y="268" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">北桥 MCH</text>
  <text x="165" y="283" font-size="9.5" fill="#78350f" text-anchor="middle">存储控制中心</text>
  <rect x="238" y="240" width="76" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="276" y="257" font-size="10.5" fill="#1e40af" text-anchor="middle">主存</text>
  <rect x="238" y="276" width="76" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="276" y="293" font-size="10.5" fill="#1e40af" text-anchor="middle">显卡</text>
  <rect x="122" y="312" width="86" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="165" y="330" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">南桥 ICH</text>
  <text x="165" y="345" font-size="9.5" fill="#4338ca" text-anchor="middle">I/O 控制器集线器</text>
  <rect x="240" y="320" width="74" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="277" y="337" font-size="10.5" fill="#1e40af" text-anchor="middle">USB/SATA…</text>
  <line x1="92" y1="271" x2="120" y2="271" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="106" y="264" font-size="9" fill="#64748b" text-anchor="middle">FSB</text>
  <line x1="208" y1="266" x2="236" y2="254" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="208" y1="280" x2="236" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="165" y1="292" x2="165" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="208" y1="332" x2="238" y2="332" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="30" y="370" font-size="10.5" fill="#64748b">内存访问、显卡通信、I/O 传输全部经北桥，北桥成为整个系统的咽喉</text>

  <rect x="348" y="222" width="316" height="158" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="362" y="244" font-size="12.5" font-weight="700" fill="#1e40af">④ 现代集成（Core i7 起）</text>
  <rect x="366" y="256" width="140" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="436" y="276" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">CPU</text>
  <rect x="376" y="284" width="120" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="436" y="297" font-size="9.5" fill="#1e40af" text-anchor="middle">片上存储器控制器</text>
  <rect x="376" y="306" width="120" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="436" y="319" font-size="9.5" fill="#1e40af" text-anchor="middle">PCIe 控制器</text>
  <rect x="532" y="258" width="116" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="590" y="275" font-size="10.5" fill="#1e40af" text-anchor="middle">主存（多通道）</text>
  <rect x="532" y="292" width="116" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="590" y="309" font-size="10.5" fill="#1e40af" text-anchor="middle">显卡 / SSD</text>
  <rect x="420" y="348" width="120" height="26" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="480" y="365" font-size="10.5" fill="#312e81" text-anchor="middle">PCH（新一代南桥）</text>
  <line x1="506" y1="271" x2="530" y2="271" stroke="#059669" stroke-width="2"/>
  <line x1="506" y1="305" x2="530" y2="305" stroke="#059669" stroke-width="2"/>
  <line x1="436" y1="332" x2="436" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="366" y="370" font-size="10" fill="#94a3b8">QPI 点对点链路</text>

  <rect x="16" y="394" width="648" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="28" y="412" font-size="11.5" fill="#312e81">三大变化：①内存控制器进 CPU，访存路径最短；②QPI 等点对点链路替代共享总线；③PCIe 直连 CPU，高速外设绕开南桥</text>
  <text x="28" y="428" font-size="11.5" fill="#312e81">北桥消失＝存储器控制中心被「搬进」CPU，剩下的低速 I/O 归 PCH</text>

  <text x="20" y="458" font-size="11.5" fill="#475569">总线使用原则：多个部件只能<tspan font-weight="700">分时发送</tspan>、可同时接收；地址总线单向（CPU→主存/外设），数据总线双向。</text>
  <text x="20" y="478" font-size="11.5" fill="#475569">采用总线结构的收益＝减少连线、便于增减外设；代价＝降低并行性与传输速度。</text>
  <text x="20" y="496" font-size="10.5" fill="#94a3b8">注：I/O 与主存在双总线下仍需 CPU 中转，这是三总线引入 DMA 总线的直接原因。</text>
</svg>
