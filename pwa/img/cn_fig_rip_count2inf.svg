<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 578" width="680" height="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="578" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">RIP 的「计数到无穷」· 一条链路断了，为什么 15 轮之后才知道</text>
  <text x="20" y="48" font-size="12" fill="#64748b">根因：B 的下一跳是 C，C 又相信了 B 的通告 —— 两个路由器互相把对方当成「还有路」</text>

  <rect x="60" y="76" width="76" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="98" y="101" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">A</text>
  <rect x="228" y="76" width="76" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="266" y="101" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">B</text>
  <rect x="396" y="76" width="76" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="434" y="101" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">C</text>
  <rect x="548" y="76" width="92" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="594" y="101" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">网络 N</text>

  <line x1="136" y1="96" x2="228" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="304" y1="96" x2="396" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="472" y1="96" x2="548" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="182" y="88" font-size="10" fill="#64748b" text-anchor="middle">1</text>
  <text x="350" y="88" font-size="10" fill="#64748b" text-anchor="middle">1</text>
  <text x="510" y="88" font-size="10" fill="#64748b" text-anchor="middle">1</text>
  <text x="505" y="132" font-size="10" fill="#b91c1c" text-anchor="middle">×</text>
  <text x="505" y="148" font-size="9.5" fill="#b91c1c" text-anchor="middle">C 到 N 断开</text>

  <text x="40" y="176" font-size="11" font-weight="700" fill="#334155">断开后每一轮通告，距离就 +1（C 从 B 学、B 又从 C 学，来回抬价）</text>

  <rect x="60" y="184" width="120" height="28" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="120" y="203" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">交换次数</text>
  <rect x="180" y="184" width="200" height="28" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="280" y="203" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">C 记到的「到 N 距离」</text>
  <rect x="380" y="184" width="200" height="28" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="480" y="203" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">B 记到的「到 N 距离」</text>

  <rect x="60" y="212" width="120" height="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="212" width="200" height="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="212" width="200" height="26" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="230" font-size="10.5" fill="#334155" text-anchor="middle">断开瞬间</text>
  <text x="280" y="230" font-size="10.5" fill="#334155" text-anchor="middle">16（直连没了，本该不可达）</text>
  <text x="480" y="230" font-size="10.5" fill="#334155" text-anchor="middle">1（仍以为经 C 可达）</text>

  <rect x="60" y="238" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="238" width="200" height="26" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <rect x="380" y="238" width="200" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="256" font-size="10.5" fill="#334155" text-anchor="middle">第 1 次</text>
  <text x="280" y="256" font-size="10.5" fill="#7f1d1d" text-anchor="middle">2（学自 B：1 + 1）</text>
  <text x="480" y="256" font-size="10.5" fill="#334155" text-anchor="middle">1</text>

  <rect x="60" y="264" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="264" width="200" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="264" width="200" height="26" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="120" y="282" font-size="10.5" fill="#334155" text-anchor="middle">第 2 次</text>
  <text x="280" y="282" font-size="10.5" fill="#334155" text-anchor="middle">2</text>
  <text x="480" y="282" font-size="10.5" fill="#7f1d1d" text-anchor="middle">3（学自 C：2 + 1）</text>

  <rect x="60" y="290" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="290" width="200" height="26" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <rect x="380" y="290" width="200" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="308" font-size="10.5" fill="#334155" text-anchor="middle">第 3 次</text>
  <text x="280" y="308" font-size="10.5" fill="#7f1d1d" text-anchor="middle">4（学自 B：3 + 1）</text>
  <text x="480" y="308" font-size="10.5" fill="#334155" text-anchor="middle">3</text>

  <rect x="60" y="316" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="316" width="200" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="316" width="200" height="26" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="120" y="334" font-size="10.5" fill="#334155" text-anchor="middle">第 4 次</text>
  <text x="280" y="334" font-size="10.5" fill="#334155" text-anchor="middle">4</text>
  <text x="480" y="334" font-size="10.5" fill="#7f1d1d" text-anchor="middle">5（学自 C：4 + 1）</text>

  <rect x="60" y="342" width="120" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="180" y="342" width="200" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="380" y="342" width="200" height="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="360" font-size="10.5" fill="#64748b" text-anchor="middle">…</text>
  <text x="280" y="360" font-size="10" fill="#64748b" text-anchor="middle">每交换一次 +2（双方各 +1）</text>
  <text x="480" y="360" font-size="10" fill="#64748b" text-anchor="middle">…</text>

  <rect x="60" y="368" width="120" height="26" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="180" y="368" width="200" height="26" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <rect x="380" y="368" width="200" height="26" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="120" y="386" font-size="10.5" fill="#166534" text-anchor="middle">第 15 次</text>
  <text x="280" y="386" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">16 ＝ 不可达，收敛</text>
  <text x="480" y="386" font-size="10.5" fill="#166534" text-anchor="middle">15</text>

  <text x="20" y="416" font-size="11.5" fill="#334155">代价：这 15 轮（每 30 s 一轮）里，去往 N 的数据包在 A—B—C 之间<tspan font-weight="700">来回打转</tspan>，最长可能绕 7 分钟。</text>
  <text x="20" y="436" font-size="11.5" fill="#334155">RIP 用「16 = 不可达」把这个循环强行截断 —— 这就是为什么 RIP 只能支持 <tspan font-weight="700">15 跳</tspan>的网络。</text>

  <rect x="20" y="452" width="640" height="112" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="472" font-size="11.5" font-weight="700" fill="#312e81">三条补救措施（背名字 + 一句话）：</text>
  <text x="34" y="492" font-size="11.5" fill="#3730a3">① <tspan font-weight="700">水平分割</tspan>：从某接口学到的路由，不再从这个接口通告回去 —— 从源头断掉互相引用。</text>
  <text x="34" y="512" font-size="11.5" fill="#3730a3">② <tspan font-weight="700">毒性逆转</tspan>：从某接口学到的路由，通告回去时直接说「距离 16」，比不说更彻底。</text>
  <text x="34" y="532" font-size="11.5" fill="#3730a3">③ <tspan font-weight="700">触发更新</tspan>：拓扑一变立刻发通告，不等到 30 s 周期 —— 只是加快，治不了环。</text>
  <text x="34" y="552" font-size="11.5" fill="#3730a3">注意：这三条都是<tspan font-weight="700">缓解</tspan>，RIP 本身没有环路检测；真要无环得靠 OSPF 的链路状态算法。</text>
</svg>
