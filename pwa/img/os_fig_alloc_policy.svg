<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 502" width="680" height="502" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="502" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">分配策略 × 置换策略 = 四种组合，其中一种是死路</text>
  <text x="20" y="46" font-size="12" fill="#64748b">固定/可变说的是「帧数变不变」，局部/全局说的是「能换谁的页」</text>

  <text x="36" y="76" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">固定分配</text>
  <text x="398" y="76" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">可变分配</text>
  <text x="16" y="170" font-size="10.5" font-weight="700" fill="#334155">局部置换</text>
  <text x="16" y="310" font-size="10.5" font-weight="700" fill="#334155">全局置换</text>

  <rect x="60" y="88" width="256" height="120" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="76" y="110" font-size="11.5" font-weight="700" fill="#166534">固定 + 局部　✓ 可行、常见</text>
  <text x="76" y="132" font-size="10" fill="#14532d">帧数运行期恒定，缺页只换本进程自己的页。</text>
  <text x="76" y="150" font-size="10" fill="#14532d">实现最简单，驻留集大小从头到尾不变。</text>
  <text x="76" y="172" font-size="10" font-weight="700" fill="#92400e">难点：初始帧数难定——</text>
  <text x="76" y="190" font-size="10" fill="#92400e">给少了频繁缺页，给多了浪费内存、挤压并发度。</text>

  <rect x="320" y="88" width="256" height="120" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="336" y="110" font-size="11.5" font-weight="700" fill="#991b1b">固定 + 全局　✗ 理论上不可行</text>
  <text x="336" y="132" font-size="10" fill="#7f1d1d">两个条件自相矛盾：</text>
  <text x="336" y="150" font-size="10" fill="#7f1d1d">「固定」要求帧数<tspan font-weight="700">不许变</tspan>，</text>
  <text x="336" y="168" font-size="10" fill="#7f1d1d">「全局」允许换出别人的页 → 帧数<tspan font-weight="700">必然变</tspan>。</text>
  <text x="336" y="190" font-size="10" font-weight="700" fill="#991b1b">题里出现这个组合，先怀疑是不是陷阱。</text>

  <rect x="60" y="228" width="256" height="120" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="76" y="250" font-size="11.5" font-weight="700" fill="#1e40af">可变 + 局部　✓ 可行</text>
  <text x="76" y="272" font-size="10" fill="#1e3a8a">只换自己的页，但按缺页率动态加减帧：</text>
  <text x="76" y="290" font-size="10" fill="#1e3a8a">缺页率高就多给几帧，低就回收几帧。</text>
  <text x="76" y="312" font-size="10" fill="#1e3a8a">能抑制抖动、又不牺牲太多并发度，</text>
  <text x="76" y="330" font-size="10" font-weight="700" fill="#92400e">代价是实现复杂、开销较大。</text>

  <rect x="320" y="228" width="256" height="120" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="336" y="250" font-size="11.5" font-weight="700" fill="#166534">可变 + 全局　✓ 现代 OS 常用</text>
  <text x="336" y="272" font-size="10" fill="#14532d">缺页先取空闲帧；空闲用光就允许换出任一进程的页，</text>
  <text x="336" y="290" font-size="10" fill="#14532d">每次缺页都可能顺手扩充自己的驻留集。</text>
  <text x="336" y="312" font-size="10" fill="#14532d">灵活、吞吐好，多道程序并发能力最强。</text>
  <text x="336" y="330" font-size="10" font-weight="700" fill="#991b1b">风险：活跃进程驻留集膨胀、抢别人页框。</text>

  <rect x="20" y="362" width="640" height="62" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="382" font-size="11" font-weight="700" fill="#92400e">最小页框数不是随口给的，它由指令格式决定</text>
  <text x="34" y="402" font-size="10.5" fill="#92400e">单地址 + 直接寻址 → 2 帧（指令 + 数据）；支持间接寻址 → 3 帧（指令 + 指针 + 数据）；</text>
  <text x="34" y="418" font-size="10.5" fill="#92400e">一条指令连同两个操作数各自跨页 → 最坏涉及 <tspan font-weight="700">6 个页面</tspan>，少于 6 帧这条指令根本执行不完。</text>

  <rect x="20" y="434" width="640" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="454" font-size="10.5" fill="#334155"><tspan font-weight="700">驻留集</tspan>＝此刻真正分给该进程、装得下页面的页框集合（⊆ 内存）；</text>
  <text x="34" y="474" font-size="10.5" fill="#334155"><tspan font-weight="700">工作集</tspan>＝最近 k 次访问里出现过的页号集合，是「该给多少帧」的依据。两者关系：<tspan font-weight="700">工作集 ⊆ 驻留集</tspan>。</text>
</svg>
