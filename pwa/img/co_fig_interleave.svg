<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" width="680" height="428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ilTime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="428" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">四体低位交叉编址 · 轮流启动的流水访问时序</text>
  <text x="20" y="48" font-size="12" fill="#64748b">低位地址选模块、高位地址选体内位置：连续地址落在相邻模块，才能并行流水</text>

  <text x="20" y="76" font-size="12.5" font-weight="700" fill="#312e81">① 地址映射（m = 4，模块号 = 地址 mod 4）</text>
  <g>
    <rect x="20" y="86" width="76" height="38" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
    <text x="58" y="103" font-size="11" fill="#312e81" text-anchor="middle">地址 0</text>
    <text x="58" y="118" font-size="10.5" fill="#4f46e5" text-anchor="middle">M0 · 体内 0</text>
    <rect x="102" y="86" width="76" height="38" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="140" y="103" font-size="11" fill="#065f46" text-anchor="middle">地址 1</text>
    <text x="140" y="118" font-size="10.5" fill="#059669" text-anchor="middle">M1 · 体内 0</text>
    <rect x="184" y="86" width="76" height="38" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="222" y="103" font-size="11" fill="#92400e" text-anchor="middle">地址 2</text>
    <text x="222" y="118" font-size="10.5" fill="#b45309" text-anchor="middle">M2 · 体内 0</text>
    <rect x="266" y="86" width="76" height="38" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="304" y="103" font-size="11" fill="#991b1b" text-anchor="middle">地址 3</text>
    <text x="304" y="118" font-size="10.5" fill="#dc2626" text-anchor="middle">M3 · 体内 0</text>
    <rect x="348" y="86" width="76" height="38" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
    <text x="386" y="103" font-size="11" fill="#312e81" text-anchor="middle">地址 4</text>
    <text x="386" y="118" font-size="10.5" fill="#4f46e5" text-anchor="middle">M0 · 体内 1</text>
    <rect x="430" y="86" width="76" height="38" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="468" y="103" font-size="11" fill="#065f46" text-anchor="middle">地址 5</text>
    <text x="468" y="118" font-size="10.5" fill="#059669" text-anchor="middle">M1 · 体内 1</text>
    <text x="524" y="112" font-size="12" fill="#64748b">… 高位体内地址递增</text>
  </g>
  <text x="20" y="146" font-size="11" fill="#475569">高位交叉（顺序方式）：高位选模块，连续地址落在同一模块 → 无法并行；低位交叉才能流水。</text>

  <text x="20" y="176" font-size="12.5" font-weight="700" fill="#312e81">② 时序：存取周期 T = 4r，每隔总线周期 r 启动一个模块</text>
  <line x1="128" y1="192" x2="648" y2="192" stroke="#cbd5e1" stroke-width="1" marker-end="url(#ilTime)"/>
  <text x="20" y="196" font-size="11" fill="#94a3b8">时间 →</text>
  <text x="128" y="188" font-size="10.5" fill="#94a3b8" text-anchor="middle">0</text>
  <text x="258" y="188" font-size="10.5" fill="#94a3b8" text-anchor="middle">r</text>
  <text x="388" y="188" font-size="10.5" fill="#94a3b8" text-anchor="middle">2r</text>
  <text x="518" y="188" font-size="10.5" fill="#94a3b8" text-anchor="middle">3r</text>
  <text x="648" y="188" font-size="10.5" fill="#94a3b8" text-anchor="middle">T</text>

  <g>
    <text x="24" y="222" font-size="11.5" font-weight="700" fill="#4f46e5">M0</text>
    <rect x="128" y="206" width="520" height="26" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
    <text x="388" y="224" font-size="11" fill="#312e81" text-anchor="middle">读出地址 0（占用一个存取周期 T）</text>

    <text x="24" y="258" font-size="11.5" font-weight="700" fill="#059669">M1</text>
    <rect x="258" y="242" width="390" height="26" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="453" y="260" font-size="11" fill="#065f46" text-anchor="middle">地址 1：延迟 r 启动</text>

    <text x="24" y="294" font-size="11.5" font-weight="700" fill="#b45309">M2</text>
    <rect x="388" y="278" width="260" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
    <text x="518" y="296" font-size="11" fill="#92400e" text-anchor="middle">地址 2：延迟 2r</text>

    <text x="24" y="330" font-size="11.5" font-weight="700" fill="#dc2626">M3</text>
    <rect x="518" y="314" width="130" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="583" y="332" font-size="11" fill="#991b1b" text-anchor="middle">地址 3：延迟 3r</text>
  </g>
  <text x="20" y="358" font-size="11.5" fill="#475569">连续取 m 个字耗时 = T + (m−1)·r；顺序（高位交叉）方式需要 mT，速度提高近 m 倍。</text>

  <rect x="20" y="370" width="640" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="391" font-size="11.5" font-weight="700" fill="#312e81">易错：模块数必须 m ≥ T ÷ r，否则轮不完一圈就回头访问未读完的模块 → 访存冲突要延迟</text>
  <text x="34" y="409" font-size="11.5" fill="#3730a3">同时启动方式：8 个 16M×8 芯片并行给出 64 位，跨块未对齐的数据需两次访问（这就是数据要对齐的原因）。</text>
</svg>
