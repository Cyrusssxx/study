<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">TCP 四次挥手 · 为什么主动方要多等 2MSL</text>
  <text x="20" y="48" font-size="12" fill="#64748b">被动方收到 FIN 只回 ACK，等自己数据发完才发 FIN —— 所以「断开」比「建立」多一次</text>

  <text x="196" y="80" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">主动关闭方 A</text>
  <text x="492" y="80" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">被动关闭方 B</text>
  <line x1="200" y1="92" x2="200" y2="520" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="492" y1="92" x2="492" y2="520" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M200 520 L194 510 L206 510 Z" fill="#94a3b8"/>
  <path d="M492 520 L486 510 L498 510 Z" fill="#94a3b8"/>

  <rect x="96" y="96" width="104" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.1"/>
  <text x="148" y="114" font-size="10.5" fill="#3730a3" text-anchor="middle">ESTABLISHED</text>
  <rect x="540" y="96" width="104" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.1"/>
  <text x="592" y="114" font-size="10.5" fill="#3730a3" text-anchor="middle">ESTABLISHED</text>

  <line x1="200" y1="150" x2="492" y2="150" stroke="#4338ca" stroke-width="1.8"/>
  <path d="M484 146 L493 150 L484 154" fill="#4338ca"/>
  <text x="346" y="142" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">① FIN=1, seq=u</text>

  <line x1="492" y1="196" x2="200" y2="196" stroke="#60a5fa" stroke-width="1.8"/>
  <path d="M208 192 L199 196 L208 200" fill="#60a5fa"/>
  <text x="346" y="188" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">② ACK=1, ack=u+1</text>

  <line x1="492" y1="240" x2="200" y2="240" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <path d="M208 236 L199 240 L208 244" fill="#94a3b8"/>
  <text x="346" y="232" font-size="11" fill="#64748b" text-anchor="middle">B 把剩余数据发完（半关闭，B 仍可发）</text>

  <line x1="492" y1="292" x2="200" y2="292" stroke="#4338ca" stroke-width="1.8"/>
  <path d="M208 288 L199 292 L208 296" fill="#4338ca"/>
  <text x="346" y="284" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">③ FIN=1, seq=w, ack=u+1</text>

  <line x1="200" y1="338" x2="492" y2="338" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M484 334 L493 338 L484 342" fill="#16a34a"/>
  <text x="346" y="330" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">④ ACK=1, ack=w+1</text>

  <rect x="150" y="338" width="100" height="96" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.3"/>
  <text x="200" y="374" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">TIME_WAIT</text>
  <text x="200" y="392" font-size="10.5" fill="#a16207" text-anchor="middle">等 2MSL</text>
  <text x="200" y="410" font-size="10.5" fill="#a16207" text-anchor="middle">≈ 2 分钟</text>
  <text x="200" y="428" font-size="10" fill="#a16207" text-anchor="middle">（MSL=2min）</text>
  <path d="M142 400 L150 400" stroke="#eab308" stroke-width="1.2"/>
  <path d="M142 400 L148 397 L148 403 Z" fill="#eab308"/>
  <path d="M142 440 L150 440" stroke="#eab308" stroke-width="1.2"/>

  <rect x="96" y="470" width="104" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="148" y="488" font-size="10.5" fill="#475569" text-anchor="middle">CLOSED</text>
  <rect x="540" y="360" width="104" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="592" y="378" font-size="10.5" fill="#475569" text-anchor="middle">CLOSED</text>
  <path d="M492 386 L492 470" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3" fill="none"/>
  <path d="M492 470 L592 470 L592 390" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="4 3" fill="none"/>

  <text x="96" y="452" font-size="10" fill="#64748b">FIN-WAIT-1 → FIN-WAIT-2</text>
  <text x="514" y="326" font-size="10" fill="#64748b">LAST-ACK</text>
  <text x="514" y="152" font-size="10" fill="#64748b">CLOSE-WAIT</text>

  <rect x="20" y="528" width="640" height="64" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="548" font-size="11.5" font-weight="700" fill="#312e81">2MSL 的两条理由（必背）</text>
  <text x="34" y="568" font-size="11.5" fill="#3730a3">① 最后一个 ACK 若丢失，B 会超时重发 FIN，A 还在 TIME_WAIT 才能再回一次 ACK；</text>
  <text x="34" y="586" font-size="11.5" fill="#3730a3">② 让本条连接在网络中的<tspan font-weight="700">残余报文段全部消散</tspan>，不污染之后复用同一四元组的新连接。</text>
</svg>
