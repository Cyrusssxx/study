<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="590" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#312e81">邻接多重表 · 无向图的链式存储</text>
  <text x="24" y="54" font-size="12" fill="#64748b">每条边只存一个边结点、被两个顶点共享 —— 删边/标记边方便</text>

  <text x="24" y="88" font-size="12.5" font-weight="700" fill="#312e81">① 示例无向图　三条边 v0—v1，v0—v2，v1—v2</text>
  <line x1="140" y1="150" x2="296" y2="150" stroke="#475569" stroke-width="1.6"/>
  <line x1="132" y1="163" x2="278" y2="195" stroke="#475569" stroke-width="1.6"/>
  <line x1="304" y1="163" x2="158" y2="195" stroke="#475569" stroke-width="1.6"/>
  <circle cx="118" cy="150" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="118" y="156" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">v0</text>
  <circle cx="310" cy="150" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="310" y="156" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">v1</text>
  <circle cx="214" cy="205" r="24" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="214" y="211" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">v2</text>

  <rect x="452" y="92" width="284" height="24" rx="4" fill="#eef2ff"/>
  <rect x="458" y="99" width="26" height="10" rx="3" fill="#4338ca"/>
  <text x="494" y="109" font-size="12" fill="#312e81">ivex 侧链：ilink（同一 ivex 的下一条边）</text>
  <rect x="452" y="122" width="284" height="24" rx="4" fill="#fff7ed"/>
  <rect x="458" y="129" width="26" height="10" rx="3" fill="#c2410c"/>
  <text x="494" y="139" font-size="12" fill="#9a3412">jvex 侧链：jlink（同一 jvex 的下一条边）</text>
  <rect x="452" y="154" width="284" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="466" y="174" font-size="12" font-weight="700" fill="#065f46">关键：一条边只用一个结点</text>
  <text x="466" y="191" font-size="11.5" fill="#065f46">被 ivex / jvex 两顶点共享，不重复</text>

  <text x="24" y="248" font-size="12.5" font-weight="700" fill="#312e81">② 顶点结点数组　data | firstedge</text>
  <g font-size="12">
    <rect x="60" y="262" width="188" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="154" y1="262" x2="154" y2="326" stroke="#cbd5e1"/>
    <text x="107" y="288" font-size="11" fill="#64748b" text-anchor="middle">data</text>
    <text x="171" y="288" font-size="11" fill="#64748b" text-anchor="middle">firstedge</text>
    <text x="107" y="312" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">v0</text>
    <rect x="157" y="299" width="28" height="18" rx="5" fill="#4338ca"/>
    <text x="171" y="312" font-size="11" fill="#ffffff" text-anchor="middle">①</text>

    <rect x="286" y="262" width="188" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="380" y1="262" x2="380" y2="326" stroke="#cbd5e1"/>
    <text x="333" y="288" font-size="11" fill="#64748b" text-anchor="middle">data</text>
    <text x="397" y="288" font-size="11" fill="#64748b" text-anchor="middle">firstedge</text>
    <text x="333" y="312" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">v1</text>
    <rect x="383" y="299" width="28" height="18" rx="5" fill="#4338ca"/>
    <text x="397" y="312" font-size="11" fill="#ffffff" text-anchor="middle">①</text>

    <rect x="512" y="262" width="188" height="64" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="606" y1="262" x2="606" y2="326" stroke="#cbd5e1"/>
    <text x="559" y="288" font-size="11" fill="#64748b" text-anchor="middle">data</text>
    <text x="623" y="288" font-size="11" fill="#64748b" text-anchor="middle">firstedge</text>
    <text x="559" y="312" font-size="14" font-weight="700" fill="#312e81" text-anchor="middle">v2</text>
    <rect x="609" y="299" width="28" height="18" rx="5" fill="#4338ca"/>
    <text x="623" y="312" font-size="11" fill="#ffffff" text-anchor="middle">②</text>
  </g>

  <text x="24" y="356" font-size="12.5" font-weight="700" fill="#312e81">③ 边结点　ivex | ilink | jvex | jlink | info</text>
  <g font-size="12" text-anchor="middle">
    <rect x="110" y="368" width="100" height="26" fill="#eef2ff"/>
    <rect x="210" y="368" width="100" height="26" fill="#eef2ff"/>
    <rect x="310" y="368" width="100" height="26" fill="#fff7ed"/>
    <rect x="410" y="368" width="100" height="26" fill="#fff7ed"/>
    <rect x="510" y="368" width="100" height="26" fill="#e2e8f0"/>
    <text x="160" y="385" font-size="11" fill="#312e81">ivex</text>
    <text x="260" y="385" font-size="11" fill="#312e81">ilink</text>
    <text x="360" y="385" font-size="11" fill="#9a3412">jvex</text>
    <text x="460" y="385" font-size="11" fill="#9a3412">jlink</text>
    <text x="560" y="385" font-size="11" fill="#475569">info</text>

    <g>
      <rect x="110" y="396" width="500" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <line x1="210" y1="396" x2="210" y2="436" stroke="#cbd5e1"/>
      <line x1="310" y1="396" x2="310" y2="436" stroke="#cbd5e1"/>
      <line x1="410" y1="396" x2="410" y2="436" stroke="#cbd5e1"/>
      <line x1="510" y1="396" x2="510" y2="436" stroke="#cbd5e1"/>
      <text x="160" y="422" font-size="13" font-weight="700" fill="#312e81">v0</text>
      <rect x="228" y="409" width="28" height="18" rx="5" fill="#4338ca"/>
      <text x="242" y="422" font-size="11" fill="#ffffff">②</text>
      <text x="360" y="422" font-size="13" font-weight="700" fill="#9a3412">v1</text>
      <rect x="428" y="409" width="28" height="18" rx="5" fill="#c2410c"/>
      <text x="442" y="422" font-size="11" fill="#ffffff">③</text>
      <text x="560" y="422" font-size="12" fill="#94a3b8">—</text>
      <text x="102" y="421" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">①</text>
    </g>
    <g>
      <rect x="110" y="440" width="500" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <line x1="210" y1="440" x2="210" y2="480" stroke="#cbd5e1"/>
      <line x1="310" y1="440" x2="310" y2="480" stroke="#cbd5e1"/>
      <line x1="410" y1="440" x2="410" y2="480" stroke="#cbd5e1"/>
      <line x1="510" y1="440" x2="510" y2="480" stroke="#cbd5e1"/>
      <text x="160" y="466" font-size="13" font-weight="700" fill="#312e81">v0</text>
      <text x="260" y="466" font-size="12" fill="#94a3b8">∧</text>
      <text x="360" y="466" font-size="13" font-weight="700" fill="#9a3412">v2</text>
      <rect x="428" y="453" width="28" height="18" rx="5" fill="#c2410c"/>
      <text x="442" y="466" font-size="11" fill="#ffffff">③</text>
      <text x="560" y="466" font-size="12" fill="#94a3b8">—</text>
      <text x="102" y="465" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">②</text>
    </g>
    <g>
      <rect x="110" y="484" width="500" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <line x1="210" y1="484" x2="210" y2="524" stroke="#cbd5e1"/>
      <line x1="310" y1="484" x2="310" y2="524" stroke="#cbd5e1"/>
      <line x1="410" y1="484" x2="410" y2="524" stroke="#cbd5e1"/>
      <line x1="510" y1="484" x2="510" y2="524" stroke="#cbd5e1"/>
      <text x="160" y="510" font-size="13" font-weight="700" fill="#312e81">v1</text>
      <text x="260" y="510" font-size="12" fill="#94a3b8">∧</text>
      <text x="360" y="510" font-size="13" font-weight="700" fill="#9a3412">v2</text>
      <text x="460" y="510" font-size="12" fill="#94a3b8">∧</text>
      <text x="560" y="510" font-size="12" fill="#94a3b8">—</text>
      <text x="102" y="509" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">③</text>
    </g>
  </g>
  <rect x="24" y="540" width="712" height="38" rx="6" fill="#f1f5f9"/>
  <text x="38" y="556" font-size="11.5" fill="#475569">求某顶点 v 的度：沿 firstedge 出发，数 ivex = v 或 jvex = v 的边结点个数（2024 真题 Q341）</text>
  <text x="38" y="572" font-size="11.5" fill="#475569">删边方便：删一条边只删一个边结点，再把两侧链上的指针改接即可</text>
</svg>
