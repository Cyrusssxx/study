<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 406" width="680" height="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="scArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="406" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">进程调度 = 存现场 → 选进程 → 移控制权</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">调度程序由排队器、分派器、上下文切换器三段拼成；真正要背的是「什么时候能调、什么时候不能调」</text>

  <text x="20" y="70" font-size="9.5" font-weight="700" fill="#334155">调度程序的三段分工</text>

  <rect x="20" y="78" width="196" height="70" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="34" y="97" font-size="10.5" font-weight="700" fill="#1e3a8a">① 排队器</text>
  <text x="34" y="115" font-size="8.5" fill="#334155">按策略把就绪进程组织成一个或</text>
  <text x="34" y="129" font-size="8.5" fill="#334155">多个就绪队列，转就绪就插队</text>
  <text x="34" y="143" font-size="8" fill="#64748b">只决定「谁排在前面」</text>

  <path d="M 220 113 L 238 113" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#scArr)"/>

  <rect x="242" y="78" width="196" height="70" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.3"/>
  <text x="256" y="97" font-size="10.5" font-weight="700" fill="#166534">② 分派器</text>
  <text x="256" y="115" font-size="8.5" fill="#334155">按算法选一个进程，就绪 → 运行</text>
  <text x="256" y="129" font-size="8.5" fill="#334155">触发上下文切换、移交控制权</text>
  <text x="256" y="143" font-size="8" fill="#64748b">真正执行「分配 CPU」的那一步</text>

  <path d="M 442 113 L 460 113" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#scArr)"/>

  <rect x="464" y="78" width="196" height="70" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="478" y="97" font-size="10.5" font-weight="700" fill="#92400e">③ 上下文切换器</text>
  <text x="478" y="115" font-size="8.5" fill="#334155">保存旧进程现场到 PCB，再装入</text>
  <text x="478" y="129" font-size="8.5" fill="#334155">新进程现场 —— 两对 load/store</text>
  <text x="478" y="143" font-size="8" fill="#b45309">开销最大的一步（两组寄存器可省）</text>

  <text x="20" y="172" font-size="9.5" font-weight="700" fill="#334155">调度时机：记住「四可以、三不可以」</text>

  <rect x="20" y="180" width="310" height="138" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="34" y="199" font-size="10" font-weight="700" fill="#166534">✓ 需要调度与切换</text>
  <text x="34" y="219" font-size="8.5" fill="#334155">① 创建新进程后 —— 父子都就绪，谁先跑</text>
  <text x="34" y="237" font-size="8.5" fill="#334155">② 进程正常/异常终止后 —— 从就绪队列补</text>
  <text x="34" y="255" font-size="8.5" fill="#334155">③ 因 I/O、信号量等被阻塞时 —— 必须让出</text>
  <text x="34" y="273" font-size="8.5" fill="#334155">④ I/O 就绪中断后 —— 阻塞转就绪要重选</text>
  <text x="34" y="295" font-size="8" fill="#15803d">抢占式系统里，更高优先级就绪或时间片用完也触发</text>
  <text x="34" y="307" font-size="8" fill="#64748b">没有就绪进程时跑闲逛进程（PID 0，优先级最低）</text>

  <rect x="346" y="180" width="314" height="138" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="360" y="199" font-size="10" font-weight="700" fill="#b91c1c">✗ 不能调度与切换</text>
  <text x="360" y="219" font-size="8.5" fill="#7f1d1d">① 处理中断的过程中（中断处理不隶属任何进程）</text>
  <text x="360" y="237" font-size="8.5" fill="#7f1d1d">② 执行原子操作时（加锁/解锁需屏蔽中断）</text>
  <text x="360" y="255" font-size="8.5" fill="#7f1d1d">③ 进程在内核临界区中（会让内核数据不一致）</text>
  <text x="360" y="277" font-size="8.5" fill="#b45309">关键区分：普通临界区里是可以被调度的，</text>
  <text x="360" y="291" font-size="8.5" fill="#b45309">只是别的进程也进不了同一个临界区。</text>
  <text x="360" y="307" font-size="8" fill="#64748b">不可调度期间来了调度请求 → 先置标志，事后补做</text>

  <rect x="20" y="328" width="640" height="44" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="32" y="347" font-size="9.5" fill="#1e40af"><tspan font-weight="700">抢占与非抢占只差一句</tspan>：非抢占等进程自己让出（实现简单、适合早期批处理）；抢占可被更高优先级、短进程、时间片打断（分时与实时系统必需）。</text>
  <text x="32" y="362" font-size="9.5" fill="#1e40af">三级调度里只有低级调度（进程调度）最频繁；用户级线程的切换根本不经过内核，所以开销远小于内核级线程。</text>

  <text x="20" y="390" font-size="8.5" fill="#64748b">上下文切换的代价是可以算的：一次切换 = 保存 N 个寄存器的 load/store，硬件有两组寄存器时只需改指针。</text>
</svg>
