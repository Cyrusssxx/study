<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" width="800" height="486" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 z" fill="#5a6b7d"/>
    </marker>
  </defs>
  <rect width="800" height="486" fill="#fbfcfe"/>

  <text x="24" y="28" font-size="14.5" font-weight="700" fill="#2c4a6b">Dijkstra 手算格式：n 个顶点只要 n−1 轮，每轮「定一个、松一圈」</text>
  <text x="24" y="47" font-size="10.5" fill="#6b7a8d">左：本节自构的 5 顶点例（源点 1）　右：按轮次逐格填 dist，这是手算题的<tspan font-weight="700">标准答法</tspan>格式</text>

  <!-- ========== 左：图 ========== -->
  <text x="24" y="76" font-size="10" fill="#8b98a8">例图（边权即距离）</text>

  <!-- 边 -->
  <line x1="85" y1="118" x2="193" y2="107" stroke="#5a6b7d" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="66" y1="140" x2="73" y2="243" stroke="#5a6b7d" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="88" y1="250" x2="200" y2="122" stroke="#5a6b7d" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="95" y1="268" x2="173" y2="281" stroke="#5a6b7d" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="228" y1="120" x2="285" y2="184" stroke="#5a6b7d" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="211" y1="272" x2="283" y2="214" stroke="#5a6b7d" stroke-width="1.3" marker-end="url(#ah)"/>

  <!-- 边权（白底衬，防被线穿过） -->
  <rect x="125" y="92" width="24" height="14" fill="#fbfcfe"/>
  <text x="137" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">10</text>

  <rect x="40" y="182" width="20" height="14" fill="#fbfcfe"/>
  <text x="50" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">5</text>

  <rect x="138" y="184" width="20" height="14" fill="#fbfcfe"/>
  <text x="148" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">3</text>

  <rect x="124" y="260" width="20" height="14" fill="#fbfcfe"/>
  <text x="134" y="271" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">2</text>

  <rect x="262" y="130" width="20" height="14" fill="#fbfcfe"/>
  <text x="272" y="141" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">3</text>

  <rect x="236" y="250" width="20" height="14" fill="#fbfcfe"/>
  <text x="246" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">6</text>

  <!-- 顶点 -->
  <circle cx="65" cy="120" r="20" fill="#fdf3e5" stroke="#d9822b" stroke-width="1.8"/>
  <text x="65" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#a55a12">1</text>
  <text x="42" y="124" text-anchor="end" font-size="9.5" fill="#d9822b">源点</text>

  <circle cx="215" cy="105" r="20" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.5"/>
  <text x="215" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#2c4a6b">2</text>

  <circle cx="300" cy="200" r="20" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.5"/>
  <text x="300" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#2c4a6b">3</text>

  <circle cx="195" cy="285" r="20" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.5"/>
  <text x="195" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#2c4a6b">4</text>

  <circle cx="75" cy="265" r="20" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.5"/>
  <text x="75" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#2c4a6b">5</text>

  <!-- ========== 右：演算表 ========== -->
  <text x="350" y="76" font-size="10" fill="#8b98a8">逐轮 dist 表（橙＝本轮被改小）</text>

  <!-- 表头 -->
  <rect x="350" y="88" width="420" height="28" fill="#e6eef8" stroke="#c9d9ec"/>
  <text x="384" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">步骤</text>
  <text x="447" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">dist[1]</text>
  <text x="505" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">dist[2]</text>
  <text x="563" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">dist[3]</text>
  <text x="621" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">dist[4]</text>
  <text x="679" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">dist[5]</text>
  <text x="739" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">本轮选中</text>

  <!-- 初始 -->
  <rect x="350" y="116" width="420" height="28" fill="#fbfcfe" stroke="#dce4ee"/>
  <text x="384" y="134" text-anchor="middle" font-size="10.5" fill="#4a5568">初始</text>
  <text x="447" y="134" text-anchor="middle" font-size="11" fill="#4a5568">0</text>
  <text x="505" y="134" text-anchor="middle" font-size="11" fill="#4a5568">10</text>
  <text x="563" y="134" text-anchor="middle" font-size="11" fill="#8b98a8">∞</text>
  <text x="621" y="134" text-anchor="middle" font-size="11" fill="#8b98a8">∞</text>
  <text x="679" y="134" text-anchor="middle" font-size="11" fill="#4a5568">5</text>
  <text x="739" y="134" text-anchor="middle" font-size="10.5" fill="#8b98a8">—</text>

  <!-- 第 1 轮 -->
  <rect x="350" y="144" width="420" height="28" fill="#fbfcfe" stroke="#dce4ee"/>
  <text x="384" y="162" text-anchor="middle" font-size="10.5" fill="#4a5568">第 1 轮</text>
  <text x="447" y="162" text-anchor="middle" font-size="11" fill="#4a5568">0</text>
  <text x="505" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#d9822b">8</text>
  <text x="563" y="162" text-anchor="middle" font-size="11" fill="#8b98a8">∞</text>
  <text x="621" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#d9822b">7</text>
  <text x="679" y="162" text-anchor="middle" font-size="11" fill="#4a5568">5</text>
  <text x="739" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">⑤</text>

  <!-- 第 2 轮 -->
  <rect x="350" y="172" width="420" height="28" fill="#fbfcfe" stroke="#dce4ee"/>
  <text x="384" y="190" text-anchor="middle" font-size="10.5" fill="#4a5568">第 2 轮</text>
  <text x="447" y="190" text-anchor="middle" font-size="11" fill="#4a5568">0</text>
  <text x="505" y="190" text-anchor="middle" font-size="11" fill="#4a5568">8</text>
  <text x="563" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#d9822b">13</text>
  <text x="621" y="190" text-anchor="middle" font-size="11" fill="#4a5568">7</text>
  <text x="679" y="190" text-anchor="middle" font-size="11" fill="#4a5568">5</text>
  <text x="739" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">④</text>

  <!-- 第 3 轮 -->
  <rect x="350" y="200" width="420" height="28" fill="#fbfcfe" stroke="#dce4ee"/>
  <text x="384" y="218" text-anchor="middle" font-size="10.5" fill="#4a5568">第 3 轮</text>
  <text x="447" y="218" text-anchor="middle" font-size="11" fill="#4a5568">0</text>
  <text x="505" y="218" text-anchor="middle" font-size="11" fill="#4a5568">8</text>
  <text x="563" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#d9822b">11</text>
  <text x="621" y="218" text-anchor="middle" font-size="11" fill="#4a5568">7</text>
  <text x="679" y="218" text-anchor="middle" font-size="11" fill="#4a5568">5</text>
  <text x="739" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">②</text>

  <!-- 第 4 轮 -->
  <rect x="350" y="228" width="420" height="28" fill="#f7f9fc" stroke="#dce4ee"/>
  <text x="384" y="246" text-anchor="middle" font-size="10.5" fill="#8b98a8">第 4 轮</text>
  <text x="447" y="246" text-anchor="middle" font-size="11" fill="#8b98a8">0</text>
  <text x="505" y="246" text-anchor="middle" font-size="11" fill="#8b98a8">8</text>
  <text x="563" y="246" text-anchor="middle" font-size="11" fill="#8b98a8">11</text>
  <text x="621" y="246" text-anchor="middle" font-size="11" fill="#8b98a8">7</text>
  <text x="679" y="246" text-anchor="middle" font-size="11" fill="#8b98a8">5</text>
  <text x="739" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">③</text>

  <text x="350" y="274" font-size="9.5" fill="#8b98a8">表里每一格只在「本轮选中顶点的出边」上可能变；3 号被选完、5 个顶点全部定完，算法结束。</text>

  <!-- ========== 底部结论 ========== -->
  <rect x="24" y="292" width="752" height="176" rx="4" fill="#eef4fb" stroke="#c9d9ec"/>
  <rect x="24" y="292" width="4" height="176" fill="#4a7ab8"/>
  <text x="40" y="316" font-size="12" font-weight="700" fill="#2c4a6b">三条铁律（手算时逐条对照，就能自查）</text>
  <text x="40" y="340" font-size="11" fill="#2c4a6b">① <tspan font-weight="700">轮数 = n − 1</tspan>：每轮只<tspan font-weight="700">确定一个</tspan>顶点的最终最短距离，定了就不再变；本题 5 个顶点，4 轮定完剩下的 4 个。</text>
  <text x="40" y="364" font-size="11" fill="#2c4a6b">② <tspan font-weight="700">只拿刚确定的那个顶点去松一圈</tspan>：⑤ 定了才有 8 和 7，④ 定了才有 13，② 定了才把 13 改成 11。没被选的顶点不参与本轮修改。</text>
  <text x="40" y="388" font-size="11" fill="#2c4a6b">③ <tspan font-weight="700">dist 只会变小、不会变大</tspan>：改小说明经由新定顶点绕过去更近；<tspan font-weight="700">若你算出「变大」，一定是漏了边权或写错了源点</tspan>。</text>
  <text x="40" y="414" font-size="10.5" fill="#a55a12">Dijkstra 不能有负权边：有负权时，已确定的顶点还可能被后来的路径改小，贪心前提就垮了；Floyd 才能处理负权（但不能有负权回路）。</text>
  <text x="40" y="438" font-size="10.5" fill="#4a5568">答题模板：画这张表 → 最后一列写出「目标顶点顺序」→ 按顺序回溯每条的<tspan font-family="Consolas,monospace">前驱</tspan>就能还原路径（只问长度时不必回溯）。</text>
  <text x="40" y="458" font-size="10.5" fill="#4a5568">表头的 ∞ 是「当前不可达」，不是无穷大在参与运算；对角线 dist[1]=0 不参与每轮「选最小」的比较。</text>
</svg>
