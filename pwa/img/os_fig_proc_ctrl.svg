<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="pcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="pcArrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">进程控制原语 · 创建从 PCB 开始，撤销到 PCB 结束</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">五个动作全是原语：关中断保证原子，PCB 队列才不会被并发改乱</text>

  <!-- 左卡：创建 / 撤销 -->
  <rect x="24" y="60" width="316" height="300" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="82" font-size="11" font-weight="700" fill="#1e40af">创建四步（左）与撤销五步（右）</text>

  <text x="40" y="102" font-size="10" font-weight="700" fill="#166534">创建</text>
  <rect x="40" y="108" width="140" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="46" y="125" font-size="9.5" fill="#166534">① 申请空白 PCB（PID）</text>
  <path d="M 110 134 L 110 142" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="40" y="144" width="140" height="26" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="46" y="161" font-size="9.5" fill="#334155">② 分配内存 / 文件 / 设备</text>
  <path d="M 110 170 L 110 178" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="40" y="180" width="140" height="26" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="46" y="197" font-size="9.5" fill="#334155">③ 初始化 PCB（置就绪）</text>
  <path d="M 110 206 L 110 214" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="40" y="216" width="140" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.3"/>
  <text x="46" y="233" font-size="9.5" font-weight="700" fill="#166534">④ 入就绪队列</text>

  <text x="196" y="102" font-size="10" font-weight="700" fill="#991b1b">撤销</text>
  <rect x="196" y="108" width="144" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="202" y="125" font-size="9.5" fill="#334155">① 按 PID 检索 PCB</text>
  <path d="M 268 134 L 268 140" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="196" y="142" width="144" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="202" y="159" font-size="9.5" fill="#334155">② 运行态则剥夺 CPU</text>
  <path d="M 268 168 L 268 174" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="196" y="176" width="144" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="202" y="193" font-size="9.5" fill="#334155">③ 释放全部资源</text>
  <path d="M 268 202 L 268 208" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="196" y="210" width="144" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="202" y="227" font-size="9.5" fill="#334155">④ 级联终止子孙进程</text>
  <path d="M 268 236 L 268 242" fill="none" stroke="#475569" stroke-width="1.1" marker-end="url(#pcArrow)"/>
  <rect x="196" y="244" width="144" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.3"/>
  <text x="202" y="261" font-size="9.5" font-weight="700" fill="#991b1b">⑤ 移出队列并回收 PCB</text>

  <text x="40" y="308" font-size="9" fill="#166534">创建的第一步是申请 PCB，PCB 耗尽则创建失败</text>
  <text x="40" y="324" font-size="9" fill="#991b1b">撤销的最后一步才回收 PCB（级联与否看系统支持）</text>
  <text x="40" y="344" font-size="9" fill="#b45309">四步里没有「分配 CPU」—— 谁上 CPU 归调度器</text>

  <!-- 右卡：Block / Wakeup -->
  <rect x="352" y="60" width="304" height="300" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="368" y="82" font-size="11" font-weight="700" fill="#92400e">阻塞与唤醒：一对反向原语，必须成对</text>

  <rect x="368" y="94" width="272" height="106" rx="5" fill="#ffffff" stroke="#fb923c" stroke-width="1.1"/>
  <text x="380" y="112" font-size="10" font-weight="700" fill="#9a3412">Block（主动 · 只有运行态能调）</text>
  <text x="380" y="132" font-size="9.5" fill="#334155">① 保存 CPU 现场到自己的 PCB</text>
  <text x="380" y="150" font-size="9.5" fill="#334155">② 置阻塞态，挂到该事件的等待队列</text>
  <text x="380" y="168" font-size="9.5" fill="#334155">③ 调调度程序，从就绪队列挑下一个</text>
  <text x="380" y="190" font-size="9" fill="#64748b">典型事件：等 I/O、等数据、等信号量</text>

  <path d="M 504 200 L 504 216" fill="none" stroke="#b45309" stroke-width="1.2" marker-end="url(#pcArrowB)"/>

  <rect x="368" y="218" width="272" height="106" rx="5" fill="#ffffff" stroke="#4ade80" stroke-width="1.1"/>
  <text x="380" y="236" font-size="10" font-weight="700" fill="#166534">Wakeup（被动 · 中断或协作进程调）</text>
  <text x="380" y="256" font-size="9.5" fill="#334155">① 在等待队列里找到目标 PCB</text>
  <text x="380" y="274" font-size="9.5" fill="#334155">② 移出等待队列，状态改为就绪</text>
  <text x="380" y="292" font-size="9.5" fill="#334155">③ 插入就绪队列，等待被调度</text>
  <text x="380" y="314" font-size="9" fill="#64748b">自己不能唤醒自己：一定是别人来叫</text>

  <text x="368" y="342" font-size="9" fill="#991b1b">没有对应 Wakeup 的 Block ＝ 永久阻塞</text>

  <text x="20" y="392" font-size="9" fill="#64748b">原语的原子性靠「关中断」实现：单 CPU 关中断后不会被抢占，一段代码自然跑完</text>
  <text x="20" y="408" font-size="9" fill="#b45309">PCB 是进程存在的唯一标志 —— 创建时最先有它，撤销时最后没它</text>
</svg>
