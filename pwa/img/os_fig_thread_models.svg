<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="680" height="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="444" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">三种多线程模型：n 个用户级线程映射到 m 个内核级线程</text>
  <text x="20" y="46" font-size="12" fill="#64748b">内核只认内核级线程（KLT）——只有 KLT 才能被内核同时调度到多个核心上并行执行。</text>

  <rect x="20" y="58" width="200" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="78" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">多对一模型（纯 ULT）</text>
  <text x="120" y="100" font-size="9.5" fill="#475569" text-anchor="middle">用户级线程（线程库管理）</text>
  <circle cx="78" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="78" y="126" font-size="9" fill="#1e40af" text-anchor="middle">1</text>
  <circle cx="106" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="106" y="126" font-size="9" fill="#1e40af" text-anchor="middle">2</text>
  <circle cx="134" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="134" y="126" font-size="9" fill="#1e40af" text-anchor="middle">3</text>
  <circle cx="162" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="162" y="126" font-size="9" fill="#1e40af" text-anchor="middle">4</text>
  <line x1="78" y1="132" x2="112" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="106" y1="132" x2="116" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="134" y1="132" x2="124" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="162" y1="132" x2="128" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <rect x="100" y="158" width="40" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="120" y="173" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">KLT×1</text>
  <text x="120" y="200" font-size="9.5" fill="#475569" text-anchor="middle">内核级线程（m = 1）</text>
  <text x="120" y="222" font-size="9.5" fill="#991b1b" text-anchor="middle">一阻全阻：任一线程阻塞</text>
  <text x="120" y="238" font-size="9.5" fill="#991b1b" text-anchor="middle">整个进程挂起，不能多核</text>

  <rect x="240" y="58" width="200" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="78" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">一对一模型</text>
  <text x="340" y="100" font-size="9.5" fill="#475569" text-anchor="middle">用户级线程（线程库管理）</text>
  <circle cx="298" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="298" y="126" font-size="9" fill="#1e40af" text-anchor="middle">1</text>
  <circle cx="326" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="326" y="126" font-size="9" fill="#1e40af" text-anchor="middle">2</text>
  <circle cx="354" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="354" y="126" font-size="9" fill="#1e40af" text-anchor="middle">3</text>
  <circle cx="382" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="382" y="126" font-size="9" fill="#1e40af" text-anchor="middle">4</text>
  <line x1="298" y1="132" x2="298" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="326" y1="132" x2="326" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="354" y1="132" x2="354" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="382" y1="132" x2="382" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <rect x="282" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="298" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K1</text>
  <rect x="310" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="326" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K2</text>
  <rect x="338" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="354" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K3</text>
  <rect x="366" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="382" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K4</text>
  <text x="340" y="200" font-size="9.5" fill="#475569" text-anchor="middle">内核级线程（m = n）</text>
  <text x="340" y="222" font-size="9.5" fill="#166534" text-anchor="middle">阻塞隔离、可真正多核并行</text>
  <text x="340" y="238" font-size="9.5" fill="#991b1b" text-anchor="middle">但每建一个 ULT 就建一个 KLT</text>

  <rect x="460" y="58" width="200" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="560" y="78" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">多对多模型（n ≥ m）</text>
  <text x="560" y="100" font-size="9.5" fill="#475569" text-anchor="middle">用户级线程（应用程序调度）</text>
  <circle cx="518" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="518" y="126" font-size="9" fill="#1e40af" text-anchor="middle">1</text>
  <circle cx="546" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="546" y="126" font-size="9" fill="#1e40af" text-anchor="middle">2</text>
  <circle cx="574" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="574" y="126" font-size="9" fill="#1e40af" text-anchor="middle">3</text>
  <circle cx="602" cy="122" r="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="602" y="126" font-size="9" fill="#1e40af" text-anchor="middle">4</text>
  <line x1="518" y1="132" x2="532" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="546" y1="132" x2="560" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="574" y1="132" x2="588" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <line x1="602" y1="132" x2="588" y2="156" stroke="#94a3b8" stroke-width="1"/>
  <rect x="516" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="532" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K1</text>
  <rect x="544" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="560" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K2</text>
  <rect x="572" y="158" width="32" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="588" y="173" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">K3</text>
  <text x="560" y="200" font-size="9.5" fill="#475569" text-anchor="middle">内核级线程（m &lt; n）</text>
  <text x="560" y="222" font-size="9.5" fill="#166534" text-anchor="middle">切换高效 + 可多核并行</text>
  <text x="560" y="238" font-size="9.5" fill="#166534" text-anchor="middle">两级模型＝现代系统折中方案</text>

  <text x="20" y="278" font-size="10.5" fill="#334155">三种模型的差别就是 m 的取值：多对一 m = 1、一对一 m = n、多对多 m &lt; n；n 是用户级线程数。</text>
  <text x="20" y="298" font-size="10.5" fill="#334155">用户级线程切换只发生在用户态、不陷内核，所以快；但内核看到的调度单位是「进程」而非线程。</text>
  <text x="20" y="318" font-size="10.5" fill="#334155">内核级线程才是处理机分配的真正单位——只有它能被内核放到另一个核上真正并行。</text>

  <rect x="20" y="332" width="640" height="90" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="352" font-size="10.5" fill="#92400e">① 多对一＝纯 ULT 实现：任一线程发阻塞型系统调用 → 内核以为「进程」阻塞 → 全进程挂起（一阻全阻）。</text>
  <text x="34" y="372" font-size="10.5" fill="#92400e">② 一对一：线程数受内核对象数量限制，创建/切换都要陷内核，数量一多开销压不住。</text>
  <text x="34" y="392" font-size="10.5" fill="#92400e">③ 多对多的用户级线程由<tspan font-weight="700">应用</tspan>调度、内核级线程由<tspan font-weight="700">内核</tspan>调度到多核，两层调度各管一段。</text>
  <text x="34" y="412" font-size="10.5" fill="#92400e">④ 同一个进程内的线程切换不换页表；跨进程的线程切换照样要换地址空间、更新页表基址。</text>
</svg>
