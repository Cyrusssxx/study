<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 552" width="680" height="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="552" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">银行家算法 · T0 时刻安全性检查（5 进程 3 资源，总 (10,5,7)）</text>
  <text x="20" y="46" font-size="12" fill="#64748b">先算 Need = Max − Allocation，再用 Work 向量一个一个试——试成功的进程就能进安全序列</text>

  <text x="24" y="72" font-size="11" font-weight="700" fill="#334155">① 建表（Need 必须是减出来的，不是抄的）</text>

  <rect x="24" y="80" width="300" height="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="49" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">进程</text>
  <text x="111" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">Max</text>
  <text x="186" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">Allocation</text>
  <text x="274" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">Need</text>

  <rect x="24" y="104" width="300" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="49" y="120" font-size="10" fill="#334155" text-anchor="middle">P0</text>
  <text x="111" y="120" font-size="10" fill="#475569" text-anchor="middle">7 5 3</text>
  <text x="186" y="120" font-size="10" fill="#475569" text-anchor="middle">0 1 0</text>
  <text x="274" y="120" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">7 4 3</text>

  <rect x="24" y="128" width="300" height="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="49" y="144" font-size="10" fill="#166534" text-anchor="middle">P1</text>
  <text x="111" y="144" font-size="10" fill="#14532d" text-anchor="middle">3 2 2</text>
  <text x="186" y="144" font-size="10" fill="#14532d" text-anchor="middle">2 0 0</text>
  <text x="274" y="144" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">1 2 2</text>

  <rect x="24" y="152" width="300" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="49" y="168" font-size="10" fill="#334155" text-anchor="middle">P2</text>
  <text x="111" y="168" font-size="10" fill="#475569" text-anchor="middle">9 0 2</text>
  <text x="186" y="168" font-size="10" fill="#475569" text-anchor="middle">3 0 2</text>
  <text x="274" y="168" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">6 0 0</text>

  <rect x="24" y="176" width="300" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="49" y="192" font-size="10" fill="#334155" text-anchor="middle">P3</text>
  <text x="111" y="192" font-size="10" fill="#475569" text-anchor="middle">2 2 2</text>
  <text x="186" y="192" font-size="10" fill="#475569" text-anchor="middle">2 1 1</text>
  <text x="274" y="192" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">0 1 1</text>

  <rect x="24" y="200" width="300" height="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="49" y="216" font-size="10" fill="#334155" text-anchor="middle">P4</text>
  <text x="111" y="216" font-size="10" fill="#475569" text-anchor="middle">4 3 3</text>
  <text x="186" y="216" font-size="10" fill="#475569" text-anchor="middle">0 0 2</text>
  <text x="274" y="216" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">4 3 1</text>

  <rect x="24" y="224" width="300" height="26" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="49" y="241" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">合计</text>
  <text x="111" y="241" font-size="10" fill="#92400e" text-anchor="middle">总量 10 5 7</text>
  <text x="186" y="241" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">已分 7 2 5</text>
  <text x="274" y="241" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Available 3 3 2</text>

  <text x="24" y="270" font-size="10" fill="#64748b">Available 只能由「总量 − Allocation 列和」得到；用 Max 列和反推是错的。</text>

  <text x="344" y="72" font-size="11" font-weight="700" fill="#334155">② Work 递推（绿色的能一次试成功）</text>

  <rect x="344" y="80" width="312" height="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="378" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">选中</text>
  <text x="472" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">Need ≤ Work ?</text>
  <text x="600" y="96" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">Work 变为</text>

  <rect x="344" y="104" width="312" height="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="378" y="120" font-size="10" fill="#64748b" text-anchor="middle">初始</text>
  <text x="472" y="120" font-size="10" fill="#64748b" text-anchor="middle">—</text>
  <text x="600" y="120" font-size="10" fill="#334155" text-anchor="middle">3 3 2</text>

  <rect x="344" y="128" width="312" height="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="378" y="144" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">P1</text>
  <text x="472" y="144" font-size="10" fill="#14532d" text-anchor="middle">1 2 2 ≤ 3 3 2 ✓</text>
  <text x="600" y="144" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">5 3 2</text>

  <rect x="344" y="152" width="312" height="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="378" y="168" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">P3</text>
  <text x="472" y="168" font-size="10" fill="#14532d" text-anchor="middle">0 1 1 ≤ 5 3 2 ✓</text>
  <text x="600" y="168" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">7 4 3</text>

  <rect x="344" y="176" width="312" height="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="378" y="192" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">P4</text>
  <text x="472" y="192" font-size="10" fill="#14532d" text-anchor="middle">4 3 1 ≤ 7 4 3 ✓</text>
  <text x="600" y="192" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">7 4 5</text>

  <rect x="344" y="200" width="312" height="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="378" y="216" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">P2</text>
  <text x="472" y="216" font-size="10" fill="#14532d" text-anchor="middle">6 0 0 ≤ 7 4 5 ✓</text>
  <text x="600" y="216" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">10 4 7</text>

  <rect x="344" y="224" width="312" height="26" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="378" y="241" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">P0</text>
  <text x="472" y="241" font-size="10" fill="#14532d" text-anchor="middle">7 4 3 ≤ 10 4 7 ✓</text>
  <text x="600" y="241" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">10 5 7</text>

  <text x="344" y="270" font-size="10" fill="#64748b">每步：Work = Work + Allocation被选中进程</text>

  <line x1="24" y1="286" x2="656" y2="286" stroke="#e2e8f0" stroke-width="1"/>

  <text x="24" y="308" font-size="11" font-weight="700" fill="#334155">③ 结论</text>
  <rect x="24" y="318" width="632" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="40" y="342" font-size="12" font-weight="700" fill="#166534">安全序列 ( P1 → P3 → P4 → P2 → P0 )，系统处于安全状态，不会死锁。</text>

  <text x="24" y="380" font-size="11" font-weight="700" fill="#334155">④ 来了新请求怎么判（P0 请求 (0,1,0)）</text>
  <rect x="24" y="390" width="150" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="36" y="409" font-size="10" font-weight="700" fill="#334155">① 合法性</text>
  <text x="36" y="425" font-size="10" fill="#475569">(0,1,0) ≤ Need0(7,4,3)</text>
  <text x="36" y="443" font-size="10" font-weight="700" fill="#166534">通过</text>

  <rect x="190" y="390" width="150" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="202" y="409" font-size="10" font-weight="700" fill="#334155">② 可用性</text>
  <text x="202" y="425" font-size="10" fill="#475569">(0,1,0) ≤ Avail(3,3,2)</text>
  <text x="202" y="443" font-size="10" font-weight="700" fill="#166534">通过</text>

  <rect x="356" y="390" width="150" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="368" y="409" font-size="10" font-weight="700" fill="#334155">③ 试探分配</text>
  <text x="368" y="425" font-size="9.5" fill="#475569">Avail(3,2,2) Alloc0(0,2,0)</text>
  <text x="368" y="443" font-size="9.5" fill="#475569">Need0(7,3,3)</text>

  <rect x="522" y="390" width="134" height="64" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="534" y="409" font-size="10" font-weight="700" fill="#92400e">④ 安全性检查</text>
  <text x="534" y="425" font-size="9.5" fill="#92400e">重跑一遍，仍找到</text>
  <text x="534" y="443" font-size="9.5" font-weight="700" fill="#92400e">(P1,P3,P4,P2,P0) → 批准</text>

  <rect x="24" y="466" width="632" height="72" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="40" y="486" font-size="11" font-weight="700" fill="#991b1b">易错</text>
  <text x="40" y="506" font-size="10.5" fill="#7f1d1d">① 试探分配必须改三个量（Available 减、Allocation 加、Need 减），漏改 Need 会让安全性检查偏乐观。</text>
  <text x="40" y="524" font-size="10.5" fill="#7f1d1d">② 安全性检查失败要<tspan font-weight="700">撤销试探、恢复原值</tspan>再让进程等，不是直接判死锁；③ 安全序列可能不止一个，写出任一个即对。</text>
</svg>
