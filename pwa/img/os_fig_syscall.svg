<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="424" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">系统调用四步：传参 → Trap 陷入 → 查表执行 → IRET 返回</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">Trap 指令在用户态执行；保存 PC/PSW、置模式位由硬件做，保存通用寄存器、执行服务例程由 OS 做。</text>

  <rect x="40" y="88" width="140" height="108" rx="5" fill="#fffdf5" stroke="#fcd34d" stroke-width="1"/>
  <rect x="48" y="94" width="124" height="16" rx="8" fill="#fef3c7"/>
  <text x="110" y="105" font-size="8.4" font-weight="700" fill="#92400e" text-anchor="middle">用户态</text>
  <text x="110" y="132" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">① 传参</text>
  <text x="110" y="151" font-size="9" fill="#78350f" text-anchor="middle">系统调用号 + 参数</text>
  <text x="110" y="167" font-size="9" fill="#78350f" text-anchor="middle">放寄存器或压栈</text>
  <text x="110" y="184" font-size="8.6" fill="#a16207" text-anchor="middle">服务程序按约定取</text>

  <rect x="200" y="88" width="140" height="108" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <rect x="208" y="94" width="124" height="16" rx="8" fill="#fcd34d"/>
  <text x="270" y="105" font-size="8.4" font-weight="700" fill="#78350f" text-anchor="middle">用户态 → 内核态</text>
  <text x="270" y="132" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">② Trap 访管</text>
  <text x="270" y="151" font-size="9" fill="#78350f" text-anchor="middle">陷入指令在用户态执行</text>
  <text x="270" y="167" font-size="9" fill="#78350f" text-anchor="middle">它是非特权指令</text>
  <text x="270" y="184" font-size="8.6" fill="#a16207" text-anchor="middle">执行完已在内核态</text>

  <rect x="360" y="88" width="140" height="108" rx="5" fill="#f8fbff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="368" y="94" width="124" height="16" rx="8" fill="#dbeafe"/>
  <text x="430" y="105" font-size="8.4" font-weight="700" fill="#1e3a8a" text-anchor="middle">内核态</text>
  <text x="430" y="132" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">③ 查表 + 执行</text>
  <text x="430" y="151" font-size="9" fill="#1e40af" text-anchor="middle">按调用号查系统调用表</text>
  <text x="430" y="167" font-size="9" fill="#1e40af" text-anchor="middle">执行对应服务例程</text>
  <text x="430" y="184" font-size="8.6" fill="#3b82f6" text-anchor="middle">可能按调度换进程</text>

  <rect x="520" y="88" width="140" height="108" rx="5" fill="#f8fbff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="528" y="94" width="124" height="16" rx="8" fill="#bfdbfe"/>
  <text x="590" y="105" font-size="8.4" font-weight="700" fill="#1e3a8a" text-anchor="middle">内核态 → 用户态</text>
  <text x="590" y="132" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">④ IRET 返回</text>
  <text x="590" y="151" font-size="9" fill="#1e40af" text-anchor="middle">恢复被中断的现场</text>
  <text x="590" y="167" font-size="9" fill="#1e40af" text-anchor="middle">模式位置 1</text>
  <text x="590" y="184" font-size="8.6" fill="#3b82f6" text-anchor="middle">回到断点的下一条</text>

  <line x1="180" y1="145" x2="198" y2="145" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="200,145 191,140 191,150" fill="#94a3b8"/>
  <line x1="340" y1="145" x2="358" y2="145" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="360,145 351,140 351,150" fill="#94a3b8"/>
  <line x1="500" y1="145" x2="518" y2="145" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="520,145 511,140 511,150" fill="#94a3b8"/>

  <line x1="270" y1="196" x2="270" y2="214" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="430" y1="196" x2="430" y2="214" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="200" y="214" width="140" height="72" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="210" y="232" font-size="9" font-weight="700" fill="#991b1b">硬件（中断隐指令）</text>
  <text x="210" y="250" font-size="8.6" fill="#7f1d1d">保存断点 PC 与 PSW</text>
  <text x="210" y="264" font-size="8.6" fill="#7f1d1d">把模式位置 0</text>
  <text x="210" y="278" font-size="8.6" fill="#7f1d1d">查向量表得入口地址</text>
  <rect x="360" y="214" width="140" height="72" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="370" y="232" font-size="9" font-weight="700" fill="#1e3a8a">OS（内核软件）</text>
  <text x="370" y="250" font-size="8.6" fill="#1e40af">保存通用寄存器与屏蔽字</text>
  <text x="370" y="264" font-size="8.6" fill="#1e40af">按调用号查系统调用表</text>
  <text x="370" y="278" font-size="8.6" fill="#1e40af">执行例程、恢复现场</text>

  <rect x="40" y="298" width="620" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="318" font-size="9.5" font-weight="700" fill="#334155">系统调用按功能分五类</text>
  <text x="52" y="336" font-size="9" fill="#475569">设备管理（请求/释放/启动）｜文件管理（读/写/创建/删除）｜进程控制（创建/撤销/阻塞/唤醒）</text>
  <text x="52" y="352" font-size="9" fill="#475569">进程通信（消息传递/信号）｜内存管理（分配与回收、取得作业内存区大小和起始地址）</text>
  <line x1="52" y1="364" x2="648" y2="364" stroke="#e2e8f0" stroke-width="1"/>
  <text x="52" y="382" font-size="9.5" font-weight="700" fill="#334155">用户态 → 内核态的四种情形</text>
  <text x="52" y="400" font-size="9" fill="#475569">系统调用（主动陷入）｜外中断（I/O 完成、时钟）｜异常（除零、缺页）｜用户程序执行特权指令触发异常</text>
</svg>
