<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" width="680" height="570" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="570" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">败者树 · k = 5 路归并选最小值，只要 3 次比较</text>
  <text x="20" y="48" font-size="12" fill="#64748b">内部结点存「这一场的败者」，胜者继续往上打；根上额外加一格 ls[0] 记冠军，从 5 个里挑最小不用比 4 次</text>

  <g stroke="#cbd5e1" stroke-width="1.4">
    <line x1="340" y1="81" x2="340" y2="113"/>
    <line x1="340" y1="143" x2="215" y2="181"/>
    <line x1="340" y1="143" x2="465" y2="181"/>
    <line x1="215" y1="211" x2="145" y2="249"/>
    <line x1="215" y1="211" x2="285" y2="249"/>
    <line x1="145" y1="279" x2="100" y2="317"/>
    <line x1="145" y1="279" x2="190" y2="317"/>
    <line x1="465" y1="211" x2="395" y2="249"/>
    <line x1="465" y1="211" x2="535" y2="249"/>
  </g>

  <rect x="302" y="51" width="76" height="30" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.8"/>
  <text x="340" y="71" font-size="11" font-weight="700" fill="#312e81" text-anchor="middle">ls[0] = 2</text>
  <text x="392" y="71" font-size="10" fill="#4338ca">← 冠军是 b2（值 5）</text>

  <rect x="307" y="113" width="66" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="340" y="133" font-size="11" fill="#312e81" text-anchor="middle">ls[1] = 4</text>

  <rect x="182" y="181" width="66" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="215" y="201" font-size="11" fill="#312e81" text-anchor="middle">ls[2] = 1</text>
  <rect x="432" y="181" width="66" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="465" y="201" font-size="11" fill="#312e81" text-anchor="middle">ls[3] = 3</text>

  <rect x="112" y="249" width="66" height="30" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="145" y="269" font-size="11" fill="#312e81" text-anchor="middle">ls[4] = 0</text>

  <rect x="255" y="249" width="60" height="30" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="285" y="262" font-size="9" fill="#166534" text-anchor="middle">b1</text>
  <text x="285" y="274" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">12</text>

  <rect x="365" y="249" width="60" height="30" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="395" y="262" font-size="9" fill="#92400e" text-anchor="middle">b2</text>
  <text x="395" y="274" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">5</text>

  <rect x="505" y="249" width="60" height="30" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="535" y="262" font-size="9" fill="#166534" text-anchor="middle">b3</text>
  <text x="535" y="274" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">18</text>

  <rect x="70" y="317" width="60" height="30" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="100" y="330" font-size="9" fill="#166534" text-anchor="middle">b0</text>
  <text x="100" y="342" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">27</text>

  <rect x="160" y="317" width="60" height="30" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="190" y="330" font-size="9" fill="#166534" text-anchor="middle">b4</text>
  <text x="190" y="342" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">9</text>

  <text x="572" y="106" font-size="10" fill="#475569">b0~b4 是 5 个</text>
  <text x="572" y="122" font-size="10" fill="#475569">归并段的首元素</text>

  <text x="20" y="372" font-size="11.5" fill="#334155">读法：ls[i] 里记的是「这一场谁输了」的段号 —— ls[4] = 0 说明 b0(27) 输给 b4(9)；</text>
  <text x="20" y="390" font-size="11.5" fill="#334155">ls[1] = 4 说明 b4(9) 又输给 b2(5)，一路读到根，冠军就是 b2。</text>
  <text x="20" y="408" font-size="11.5" fill="#334155">调整：取走 b2 的 5 之后，只从 b2 这个叶子沿<tspan font-weight="700">一条路径</tspan>往上重比即可，不用整棵树重来。</text>

  <rect x="20" y="422" width="316" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="441" font-size="11" font-weight="700" fill="#312e81">比较次数对比</text>
  <text x="34" y="459" font-size="10.5" fill="#3730a3">暴力比较：k − 1 = 4 次</text>
  <text x="34" y="473" font-size="10.5" fill="#3730a3">败者树：⌈log₂k⌉ = ⌈log₂5⌉ = 3 次</text>

  <rect x="348" y="422" width="312" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="362" y="441" font-size="11" font-weight="700" fill="#166534">为什么比堆更省</text>
  <text x="362" y="459" font-size="10.5" fill="#14532d">堆调整一次要和<tspan font-weight="700">两个孩子都</tspan>比；败者树</text>
  <text x="362" y="473" font-size="10.5" fill="#14532d">每层只比一次（对手已确定），路径固定。</text>

  <rect x="20" y="490" width="640" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="509" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="528" font-size="11.5" fill="#7f1d1d">① 内部结点存<tspan font-weight="700">败者</tspan>不存胜者，冠军要单开 ls[0]；k 个归并段对应 k 个叶子 + k−1 个内部结点。</text>
  <text x="34" y="546" font-size="11.5" fill="#7f1d1d">② 败者树省的是比较次数，建树仍要 O(k)，整个外部排序时间还是 O(n log k)。</text>
</svg>
