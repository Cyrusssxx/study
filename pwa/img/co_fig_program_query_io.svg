<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#312e81">程序查询方式 · CPU 执行程序全程控制 I/O</text>
  <text x="24" y="54" font-size="12" fill="#64748b">接口含数据缓冲寄存器（数据端口）+ 设备状态寄存器（状态端口）；CPU 读状态决定传不传</text>

  <text x="24" y="86" font-size="12.5" font-weight="700" fill="#312e81">① 工作流程（2018-43 大题）</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="30" y="102" width="120" height="50" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
    <text x="90" y="123" font-weight="700" fill="#312e81">①初始化</text>
    <text x="90" y="141" font-size="10.5" fill="#4338ca">起始地址·数据量</text>

    <rect x="182" y="102" width="120" height="50" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
    <text x="242" y="123" font-weight="700" fill="#312e81">②发命令字</text>
    <text x="242" y="141" font-size="10.5" fill="#4338ca">启动外设</text>

    <rect x="334" y="102" width="120" height="50" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
    <text x="394" y="123" font-weight="700" fill="#854d0e">③读状态</text>
    <text x="394" y="141" font-size="10.5" fill="#a16207">状态寄存器</text>

    <polygon points="560,98 632,127 560,156 488,127" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
    <text x="560" y="123" font-weight="700" fill="#854d0e">就绪？</text>
    <text x="560" y="140" font-size="10" fill="#a16207">未就绪→再查</text>
  </g>

  <line x1="150" y1="127" x2="180" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="302" y1="127" x2="332" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="454" y1="127" x2="486" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>

  <path d="M560,156 L560,180 L394,180 L394,152" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#arb)"/>
  <text x="470" y="194" font-size="10.5" font-weight="700" fill="#c2410c" text-anchor="middle">未就绪：循环重查（忙等）</text>

  <polygon points="560,98 632,127 560,156 488,127" fill="none" stroke="none"/>
  <line x1="632" y1="127" x2="700" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="662" y="206" width="0" height="0"/>

  <g font-size="11.5" text-anchor="middle">
    <rect x="600" y="212" width="136" height="50" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
    <text x="668" y="233" font-weight="700" fill="#065f46">④传送一个数据</text>
    <text x="668" y="251" font-size="10.5" fill="#047857">数据缓冲寄存器</text>

    <rect x="424" y="212" width="136" height="50" rx="7" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
    <text x="492" y="233" font-weight="700" fill="#312e81">⑤改参数</text>
    <text x="492" y="251" font-size="10.5" fill="#4338ca">地址+1 计数−1</text>

    <polygon points="300,212 372,237 300,262 228,237" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
    <text x="300" y="233" font-weight="700" fill="#854d0e">⑥传完？</text>
    <text x="300" y="250" font-size="10" fill="#a16207">计数=0</text>

    <rect x="60" y="212" width="128" height="50" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="124" y="241" font-weight="700" fill="#334155">结束</text>
  </g>

  <line x1="668" y1="156" x2="668" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="690" y="186" font-size="10.5" font-weight="700" fill="#059669">就绪</text>
  <line x1="600" y1="237" x2="374" y2="237" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="228" y1="237" x2="190" y2="237" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M300,262 L300,290 L394,290 L394,152" fill="none" stroke="#4338ca" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="350" y="304" font-size="10.5" font-weight="700" fill="#4338ca" text-anchor="middle">未完成 → 回③继续查询</text>

  <rect x="24" y="322" width="340" height="120" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/>
  <text x="38" y="344" font-size="12" font-weight="700" fill="#9a3412">② 两类查询策略</text>
  <text x="38" y="366" font-size="11.5" font-weight="700" fill="#9a3412">独占查询</text>
  <text x="38" y="384" font-size="11" fill="#78350f">启动后连续查询至完成，CPU 忙等</text>
  <text x="38" y="400" font-size="11" fill="#78350f">CPU 与外设完全串行，利用率最低</text>
  <text x="38" y="422" font-size="11.5" font-weight="700" fill="#9a3412">定时查询</text>
  <text x="38" y="440" font-size="11" fill="#78350f">固定间隔查一次，就绪传一个就返回用户程序</text>

  <rect x="380" y="322" width="356" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="394" y="344" font-size="12" font-weight="700" fill="#991b1b">易错：定时查询的间隔必须够短</text>
  <text x="394" y="366" font-size="11.5" fill="#991b1b">间隔 ≤ 外设填满数据缓冲寄存器的时间</text>
  <text x="394" y="386" font-size="11.5" fill="#b91c1c">例（正文同源）：4B ÷ 2MB/s = 2μs</text>
  <text x="394" y="406" font-size="11" fill="#7f1d1d">间隔过大 → 新数据覆盖未取走的旧数据</text>
  <text x="394" y="428" font-size="11" fill="#7f1d1d">独占查询硬件开销最小但 CPU 全程被占用</text>

  <rect x="24" y="456" width="712" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="38" y="478" font-size="12" font-weight="700" fill="#312e81">③ 查询开销计算（正文 2011 例题同源）</text>
  <text x="38" y="500" font-size="11.5" fill="#334155">每秒查询次数 = 1s ÷ 2μs = 5×10⁵ 次　　I/O 周期 = 5×10⁵ × 10 条 × CPI 4 = 2×10⁷</text>
  <text x="38" y="522" font-size="11.5" fill="#334155">主频 500MHz = 5×10⁸ 周期/秒　→　I/O 时间占比 = 2×10⁷ ÷ 5×10⁸ = <tspan font-weight="700" fill="#c2410c">4%</tspan></text>
  <text x="38" y="548" font-size="11" fill="#475569">另一真题口径：50MHz、每秒查 200 次 × 500 周期 = 10⁵ 周期 → 占比 0.20%（Q584）</text>
  <text x="38" y="570" font-size="11" fill="#475569">评价：优点是设计简单、硬件开销小；缺点是 CPU 大量时间花在查询等待，效率低</text>
</svg>
