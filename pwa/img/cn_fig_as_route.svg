<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="asArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#92400e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">分层次的路由选择 · 域内算细节（IGP），域间只报可达（EGP）</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">互联网太大，全局跑一个链路状态协议既算不动也存不下，各 AS 也不愿暴露内部拓扑</text>

  <!-- 左卡：AS 拓扑 -->
  <rect x="24" y="60" width="316" height="300" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="82" font-size="11" font-weight="700" fill="#1e40af">三个自治系统的分工</text>

  <rect x="44" y="96" width="140" height="76" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="114" y="118" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">AS 1</text>
  <text x="114" y="136" font-size="9" fill="#1e40af" text-anchor="middle">内部跑 OSPF</text>
  <text x="114" y="152" font-size="9" fill="#64748b" text-anchor="middle">链路状态 · 划分区域</text>
  <text x="114" y="166" font-size="9" fill="#64748b" text-anchor="middle">知道每个网段的细节</text>

  <rect x="44" y="204" width="140" height="76" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="114" y="226" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">AS 2</text>
  <text x="114" y="244" font-size="9" fill="#1e40af" text-anchor="middle">内部跑 RIP</text>
  <text x="114" y="260" font-size="9" fill="#64748b" text-anchor="middle">距离向量 · 跳数 ≤ 15</text>
  <text x="114" y="274" font-size="9" fill="#64748b" text-anchor="middle">只适合小网</text>

  <rect x="212" y="150" width="112" height="76" rx="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.3"/>
  <text x="268" y="172" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">AS 3</text>
  <text x="268" y="190" font-size="9" fill="#3730a3" text-anchor="middle">内部同样有 IGP</text>
  <text x="268" y="206" font-size="9" fill="#64748b" text-anchor="middle">对外只报「能到哪」</text>

  <line x1="114" y1="174" x2="114" y2="202" stroke="#92400e" stroke-width="1.8"
        marker-start="url(#asArrow)" marker-end="url(#asArrow)"/>
  <text x="120" y="198" font-size="9" font-weight="700" fill="#92400e">BGP · TCP 179</text>
  <line x1="186" y1="134" x2="210" y2="164" stroke="#92400e" stroke-width="1.6" stroke-dasharray="4 3"
        marker-start="url(#asArrow)" marker-end="url(#asArrow)"/>
  <line x1="186" y1="242" x2="210" y2="212" stroke="#92400e" stroke-width="1.6" stroke-dasharray="4 3"
        marker-start="url(#asArrow)" marker-end="url(#asArrow)"/>
  <text x="212" y="246" font-size="9" fill="#92400e">AS 之间只交换</text>
  <text x="212" y="260" font-size="9" fill="#92400e">AS 路径与属性</text>

  <text x="40" y="312" font-size="9" fill="#1e40af">域内：把每条链路的代价算清楚（细）</text>
  <text x="40" y="328" font-size="9" fill="#92400e">域间：只告诉对方「这个前缀我能到达」（粗）</text>
  <text x="40" y="346" font-size="9" fill="#64748b">出口 AS 之外的路由，一律靠 BGP 学</text>

  <!-- 右卡：三协议 -->
  <rect x="352" y="60" width="304" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="368" y="82" font-size="11" font-weight="700" fill="#0f172a">三个协议一眼分辨</text>

  <rect x="368" y="92" width="272" height="80" rx="5" fill="#ffffff" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="380" y="110" font-size="10" font-weight="700" fill="#1e40af">RIP · AS 内（IGP）</text>
  <text x="380" y="127" font-size="9.5" fill="#334155">距离向量，交换整张路由表</text>
  <text x="380" y="144" font-size="9.5" fill="#334155">承载：UDP 520；跳数 ≤ 15</text>
  <text x="380" y="162" font-size="9" fill="#64748b">小网够用，收敛慢、有计数到无穷</text>

  <rect x="368" y="180" width="272" height="80" rx="5" fill="#ffffff" stroke="#4ade80" stroke-width="1.1"/>
  <text x="380" y="198" font-size="10" font-weight="700" fill="#166534">OSPF · AS 内（IGP）</text>
  <text x="380" y="215" font-size="9.5" fill="#334155">链路状态 + Dijkstra，洪泛 LSA</text>
  <text x="380" y="232" font-size="9.5" fill="#334155">承载：直接用 IP，协议号 89</text>
  <text x="380" y="250" font-size="9" fill="#64748b">可划分区域，规模大；不走 TCP/UDP</text>

  <rect x="368" y="268" width="272" height="80" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="380" y="286" font-size="10" font-weight="700" fill="#92400e">BGP · AS 间（EGP）</text>
  <text x="380" y="303" font-size="9.5" fill="#334155">路径向量，交换 AS 路径 + 属性</text>
  <text x="380" y="320" font-size="9.5" fill="#334155">承载：TCP 179（要可靠、要增量）</text>
  <text x="380" y="338" font-size="9" fill="#64748b">选路看策略，不数跳数</text>

  <text x="20" y="380" font-size="9" fill="#b45309">2017 真题的坑就在承载：RIP→UDP、OSPF→IP（协议号 89）、BGP→TCP</text>
  <text x="20" y="394" font-size="9" fill="#64748b">RIP 的「距离」是跳数，OSPF 的「代价」按带宽算，BGP 的「距离」其实是路径属性</text>
</svg>
