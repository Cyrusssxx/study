<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" width="680" height="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="bpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <pattern id="bpIdle" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fca5a5" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="680" height="384" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">单道批处理 vs 多道批处理 · 差的就是「CPU 等不等 I/O」</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">同样一段作业流，只多一道程序驻留内存，CPU 的空白就被另一道填上了</text>

  <!-- 左卡：单道 -->
  <rect x="24" y="60" width="316" height="252" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="40" y="82" font-size="11" font-weight="700" fill="#991b1b">单道批处理：内存里只有一道</text>
  <text x="40" y="100" font-size="9" fill="#64748b">作业成批放在磁带上，监督程序逐个调入</text>

  <text x="40" y="134" font-size="10" font-weight="700" fill="#334155">CPU</text>
  <text x="40" y="170" font-size="10" font-weight="700" fill="#334155">I/O</text>

  <rect x="96" y="118" width="76" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="134" y="134" font-size="9.5" fill="#1e3a8a" text-anchor="middle">作业 1 运行</text>
  <rect x="172" y="118" width="95" height="24" rx="3" fill="url(#bpIdle)" stroke="#f87171" stroke-width="1"/>
  <text x="219" y="134" font-size="9" fill="#991b1b" text-anchor="middle">CPU 空转</text>
  <rect x="267" y="118" width="57" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="295" y="134" font-size="9.5" fill="#1e3a8a" text-anchor="middle">作业 1</text>

  <rect x="172" y="154" width="95" height="24" rx="3" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="219" y="170" font-size="9.5" fill="#9a3412" text-anchor="middle">作业 1 做 I/O</text>
  <rect x="96" y="154" width="76" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="134" y="170" font-size="9" fill="#64748b" text-anchor="middle">无 I/O</text>
  <rect x="267" y="154" width="57" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="295" y="170" font-size="9" fill="#64748b" text-anchor="middle">无 I/O</text>

  <line x1="96" y1="190" x2="324" y2="190" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 219 190 L 219 208" fill="none" stroke="#dc2626" stroke-width="1.2" marker-end="url(#bpArrow)"/>
  <text x="40" y="224" font-size="9" fill="#991b1b">作业 1 一发 I/O 请求，高速 CPU 只能干等低速设备</text>
  <text x="40" y="240" font-size="9" fill="#64748b">作业 2 要等作业 1 彻底跑完才能装进来（顺序性）</text>

  <rect x="40" y="252" width="284" height="46" rx="4" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="269" font-size="9.5" fill="#334155">三特征：自动性 · 顺序性 · 单道性</text>
  <text x="52" y="286" font-size="9.5" fill="#991b1b">代价：资源利用率低、吞吐量小</text>

  <!-- 右卡：多道 -->
  <rect x="352" y="60" width="304" height="252" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="368" y="82" font-size="11" font-weight="700" fill="#166534">多道批处理：I/O 时就切走</text>
  <text x="368" y="100" font-size="9" fill="#64748b">作业先进后备队列，由作业调度挑若干道入内存</text>

  <text x="368" y="134" font-size="10" font-weight="700" fill="#334155">A</text>
  <text x="368" y="174" font-size="10" font-weight="700" fill="#334155">B</text>

  <rect x="384" y="118" width="70" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="419" y="134" font-size="9.5" fill="#1e3a8a" text-anchor="middle">A 运行</text>
  <rect x="454" y="118" width="90" height="24" rx="3" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="499" y="134" font-size="9.5" fill="#9a3412" text-anchor="middle">A 做 I/O</text>
  <rect x="544" y="118" width="96" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="592" y="134" font-size="9.5" fill="#1e3a8a" text-anchor="middle">A 再运行</text>

  <rect x="384" y="158" width="70" height="24" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="419" y="174" font-size="9" fill="#64748b" text-anchor="middle">B 就绪等待</text>
  <rect x="454" y="158" width="90" height="24" rx="3" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="499" y="174" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">B 抢占 CPU</text>
  <rect x="544" y="158" width="96" height="24" rx="3" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="592" y="174" font-size="9.5" fill="#9a3412" text-anchor="middle">B 做 I/O</text>

  <line x1="384" y1="190" x2="640" y2="190" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="368" y="224" font-size="9" fill="#166534">A 做 I/O 的这段，CPU 交给 B —— 两者在时间上重叠</text>
  <text x="368" y="240" font-size="9" fill="#64748b">宏观上并行（都在推进）、微观上串行（轮流占 CPU）</text>

  <rect x="368" y="252" width="272" height="46" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="380" y="269" font-size="9.5" fill="#334155">前提：<tspan font-weight="700">系统必须支持中断</tspan>，否则切不出去</text>
  <text x="380" y="286" font-size="9.5" fill="#166534">收益：利用率与吞吐量；代价：调度开销、无交互</text>

  <text x="20" y="338" font-size="9" fill="#64748b">两者的共同短板都是「没有交互」——用户不能在中途干预；交互能力是分时系统才补上的</text>
  <text x="20" y="356" font-size="9" fill="#b45309">脱机 I/O 是批处理的前置技术：输入/输出各用一台外围机先落到磁带，主机只在磁带与内存之间搬运</text>
</svg>
