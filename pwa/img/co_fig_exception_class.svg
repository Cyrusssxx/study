<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 z" fill="#d9822b"/>
    </marker>
    <marker id="a7g" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 z" fill="#2f8f5b"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#fbfcfe"/>

  <text x="24" y="28" font-size="14.5" font-weight="700" fill="#2c4a6b">异常和中断的唯一分水岭：处理完<tspan font-weight="700" fill="#a55a12">回到哪条指令</tspan></text>
  <text x="24" y="47" font-size="10.5" fill="#6b7a8d">故障回<tspan font-weight="700" fill="#a55a12">当前这条</tspan>重执行；自陷与外部中断都回<tspan font-weight="700" fill="#2f6b48">下一条</tspan>；终止根本不返回 —— 记住这一条，断点题全对</text>

  <!-- 指令流 -->
  <text x="24" y="74" font-size="9.5" fill="#8b98a8">指令流</text>

  <rect x="100" y="84" width="115" height="38" rx="3" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="157" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2c4a6b">I1</text>

  <rect x="235" y="84" width="115" height="38" rx="3" fill="#fdeacf" stroke="#d9822b" stroke-width="1.5"/>
  <text x="292" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#a55a12">I2</text>

  <rect x="370" y="84" width="115" height="38" rx="3" fill="#eaf6ee" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="427" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6b48">I3</text>

  <rect x="505" y="84" width="115" height="38" rx="3" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="562" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#2c4a6b">I4</text>

  <!-- 终止：I1 上方 -->
  <text x="157" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">✕</text>
  <text x="178" y="72" font-size="9" fill="#c0392b">终止：不返回</text>

  <!-- 故障：I2 下方回环 -->
  <path d="M330 122V164H250V126" fill="none" stroke="#d9822b" stroke-width="1.5" marker-end="url(#a7)"/>
  <text x="340" y="145" font-size="9" fill="#a55a12">故障（缺页/越界/除0/溢出）</text>
  <text x="340" y="158" font-size="9" font-weight="700" fill="#a55a12">→ 处理完重新执行 I2 本条</text>

  <!-- 自陷 / 外中断：I3 → I4 -->
  <path d="M470 122V186H515V128" fill="none" stroke="#2f8f5b" stroke-width="1.5" marker-end="url(#a7g)"/>
  <text x="528" y="180" font-size="9" fill="#2f6b48">自陷（trap：int/断点/系统调用）</text>
  <text x="528" y="193" font-size="9" font-weight="700" fill="#2f6b48">外部中断（I3 执行结束时响应）→ 都回 I4</text>

  <!-- ===== 分类 ===== -->
  <text x="24" y="216" font-size="10" fill="#8b98a8">分类（「内/外」看来源，与当前指令有没有关系）</text>

  <!-- 异常框 -->
  <rect x="24" y="220" width="366" height="172" rx="4" fill="#fdf7ee" stroke="#e5c8a2"/>
  <text x="38" y="240" font-size="11" font-weight="700" fill="#a55a12">异常＝内中断（CPU 内部检测，<tspan font-weight="700">不可屏蔽</tspan>）</text>

  <rect x="36" y="248" width="342" height="42" rx="3" fill="#fbfcfe" stroke="#e0b681"/>
  <text x="48" y="264" font-size="10" font-weight="700" fill="#2c4a6b">故障 fault</text>
  <text x="48" y="280" font-size="9.5" fill="#4a5568">缺页、地址越界、除数为 0、溢出　→ 回<tspan font-weight="700" fill="#a55a12">当前指令</tspan></text>

  <rect x="36" y="294" width="342" height="42" rx="3" fill="#fbfcfe" stroke="#a8d0b8"/>
  <text x="48" y="310" font-size="10" font-weight="700" fill="#2c4a6b">自陷 trap（陷阱）</text>
  <text x="48" y="326" font-size="9.5" fill="#4a5568">int 指令、断点、系统调用　→ 回<tspan font-weight="700" fill="#2f6b48">下一条指令</tspan></text>

  <rect x="36" y="340" width="342" height="42" rx="3" fill="#fbfcfe" stroke="#c9ccd2"/>
  <text x="48" y="356" font-size="10" font-weight="700" fill="#2c4a6b">终止 abort</text>
  <text x="48" y="372" font-size="9.5" fill="#4a5568">存储器校验错等硬件故障　→ <tspan font-weight="700" fill="#c0392b">不返回</tspan>，程序无法继续</text>

  <!-- 中断框 -->
  <rect x="410" y="220" width="366" height="172" rx="4" fill="#f2f8f4" stroke="#a8d0b8"/>
  <text x="424" y="240" font-size="11" font-weight="700" fill="#2f6b48">中断＝外中断（CPU 外部请求，与当前指令无关）</text>

  <rect x="422" y="248" width="342" height="42" rx="3" fill="#fbfcfe" stroke="#b9dcc5"/>
  <text x="434" y="264" font-size="10" font-weight="700" fill="#2c4a6b">可屏蔽中断</text>
  <text x="434" y="280" font-size="9.5" fill="#4a5568">打印机缺纸、键盘缓冲满、定时器到　→ 可被 INTR 屏蔽</text>

  <rect x="422" y="294" width="342" height="42" rx="3" fill="#fbfcfe" stroke="#c9ccd2"/>
  <text x="434" y="310" font-size="10" font-weight="700" fill="#2c4a6b">不可屏蔽中断 NMI</text>
  <text x="434" y="326" font-size="9.5" fill="#4a5568">电源故障等紧急事件　→ 不受屏蔽控制</text>

  <text x="434" y="360" font-size="9.5" fill="#8b98a8">响应时机都统一：<tspan font-weight="700" fill="#2c4a6b">一条指令执行结束</tspan></text>
  <text x="434" y="376" font-size="9.5" fill="#8b98a8">（外部中断的断点＝刚执行完那条的下一条，不是中途插进去）</text>

  <!-- ===== 底部 ===== -->
  <rect x="24" y="404" width="752" height="84" rx="4" fill="#eef4fb" stroke="#c9d9ec"/>
  <rect x="24" y="404" width="4" height="84" fill="#4a7ab8"/>
  <text x="40" y="426" font-size="11" fill="#2c4a6b">① <tspan font-weight="700">Cache 缺失不算异常</tspan>：由硬件自动重取，不进入异常处理程序；<tspan font-weight="700">无效操作码</tspan>才是内部异常（自陷/故障类）。</text>
  <text x="40" y="448" font-size="11" fill="#2c4a6b">② <tspan font-weight="700">中断需要「中断回答」、异常不需要</tspan>：中断源可能同时多个，CPU 要取回优先级最高的；异常是内部产生的，编号当场就知道。</text>
  <text x="40" y="472" font-size="10.5" fill="#4a5568">③ 判断题口诀：看它<tspan font-weight="700">与当前指令有没有关系</tspan> —— 有（越界、除 0、缺页、断点、无效码）是异常；没有（外设、定时器、电源）是中断。</text>
</svg>
