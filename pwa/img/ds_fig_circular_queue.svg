<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="476" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">循环队列 · 判空判满与元素个数</text>
  <text x="20" y="48" font-size="12" fill="#64748b">环上「指针相等」既可能是空也可能是满，三种方案的区别只在怎么打破这个二义性</text>

  <text x="20" y="78" font-size="12.5" font-weight="700" fill="#312e81">MaxSize = 8，牺牲 1 单元法，front = 6、rear = 2</text>

  <circle cx="168" cy="236" r="98" fill="none" stroke="#e2e8f0" stroke-width="10"/>

  <circle cx="70" cy="236" r="17" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="70" y="241" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">6</text>
  <circle cx="99" cy="167" r="17" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="99" y="172" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">7</text>
  <circle cx="168" cy="138" r="17" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="168" y="143" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">0</text>
  <circle cx="237" cy="167" r="17" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="237" y="172" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">1</text>
  <circle cx="266" cy="236" r="17" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="266" y="241" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">2</text>
  <circle cx="237" cy="305" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="237" y="310" font-size="11.5" fill="#94a3b8" text-anchor="middle">3</text>
  <circle cx="168" cy="334" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="168" y="339" font-size="11.5" fill="#94a3b8" text-anchor="middle">4</text>
  <circle cx="99" cy="305" r="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="99" y="310" font-size="11.5" fill="#94a3b8" text-anchor="middle">5</text>

  <text x="52" y="241" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="end">front</text>
  <text x="286" y="241" font-size="11.5" font-weight="700" fill="#059669">rear</text>
  <text x="286" y="258" font-size="10" fill="#94a3b8">队尾的下一位置</text>

  <text x="168" y="236" font-size="11.5" font-weight="700" fill="#4338ca" text-anchor="middle">L = 4</text>
  <text x="168" y="222" font-size="10" fill="#64748b" text-anchor="middle">占用 6→7→0→1</text>
  <text x="168" y="382" font-size="11" fill="#64748b" text-anchor="middle">环上跨过 max 下标自动回绕，物理上不移动元素</text>

  <rect x="330" y="72" width="330" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="344" y="92" font-size="11.5" font-weight="700" fill="#065f46">方案 A · 牺牲 1 个单元（最常考）</text>
  <text x="344" y="112" font-size="11" fill="#166534">空：front == rear　　满：(rear+1)%M == front</text>
  <text x="344" y="132" font-size="11" fill="#166534">元素个数 = (rear − front + M) % M　<tspan font-weight="700">最多存 M−1 个</tspan></text>

  <rect x="330" y="160" width="330" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="344" y="180" font-size="11.5" font-weight="700" fill="#1e40af">方案 B · 增设 size 计数器</text>
  <text x="344" y="200" font-size="11" fill="#1e3a8a">空：size == 0　　满：size == M</text>
  <text x="344" y="220" font-size="11" fill="#1e3a8a">每次入队 +1、出队 −1　<tspan font-weight="700">可存满 M 个</tspan></text>

  <rect x="330" y="248" width="330" height="78" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="344" y="268" font-size="11.5" font-weight="700" fill="#9a3412">方案 C · 增设 tag 标志</text>
  <text x="344" y="288" font-size="11" fill="#9a3412">front == rear 且 tag == 0 → 空</text>
  <text x="344" y="308" font-size="11" fill="#9a3412">front == rear 且 tag == 1 → 满<tspan font-weight="700">（出队置 0、入队置 1）</tspan></text>

  <text x="20" y="410" font-size="11.5" fill="#334155">入队 <tspan font-weight="700">rear = (rear+1) % M</tspan>　出队 <tspan font-weight="700">front = (front+1) % M</tspan>　长度 <tspan font-weight="700">L = (rear − front + M) % M</tspan></text>
  <text x="20" y="430" font-size="11" fill="#475569">例：M=10、front=3、rear=8 → L=(8−3+10)%10=5，最多存 9 个；反向求 rear = (front + L) % M。</text>

  <rect x="20" y="440" width="640" height="30" rx="7" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="460" font-size="11.5" font-weight="700" fill="#312e81">易错：题目给 A[0…n] 时容量是 n+1，公式里的 M 要代 n+1；判满用取模比较，别写成 rear+1 == front。</text>
</svg>
