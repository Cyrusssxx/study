  <rect x="570" y="100" width="72" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="74" y="126" font-size="12.5" fill="#334155" text-anchor="middle">278</text>
  <text x="150" y="126" font-size="12.5" fill="#334155" text-anchor="middle">109</text>
  <text x="226" y="126" font-size="12.5" fill="#334155" text-anchor="middle">063</text>
  <text x="302" y="126" font-size="12.5" fill="#334155" text-anchor="middle">930</text>
  <text x="378" y="126" font-size="12.5" fill="#334155" text-anchor="middle">589</text>
  <text x="454" y="126" font-size="12.5" fill="#334155" text-anchor="middle">184</text>
  <text x="530" y="126" font-size="12.5" fill="#334155" text-anchor="middle">505</text>
  <text x="606" y="126" font-size="12.5" fill="#334155" text-anchor="middle">269</text>

  <text x="38" y="178" font-size="11" fill="#64748b">① 按个位分配 + 收集（按桶号 0…9 顺序取出）</text>
  <rect x="38" y="186" width="72" height="40" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="114" y="186" width="72" height="40" rx="4" fill="#fef2f2" stroke="#fecaca"/>
