  <rect x="418" y="272" width="72" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="494" y="272" width="72" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="570" y="272" width="72" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="74" y="298" font-size="12.5" fill="#334155" text-anchor="middle">5<tspan fill="#1d4ed8" font-weight="700">0</tspan>5</text>
  <text x="150" y="298" font-size="12.5" fill="#334155" text-anchor="middle">1<tspan fill="#1d4ed8" font-weight="700">0</tspan>9</text>
  <text x="226" y="298" font-size="12.5" fill="#334155" text-anchor="middle">9<tspan fill="#1d4ed8" font-weight="700">3</tspan>0</text>
  <text x="302" y="298" font-size="12.5" fill="#334155" text-anchor="middle">0<tspan fill="#1d4ed8" font-weight="700">6</tspan>3</text>
  <text x="378" y="298" font-size="12.5" fill="#334155" text-anchor="middle">2<tspan fill="#1d4ed8" font-weight="700">6</tspan>9</text>
  <text x="454" y="298" font-size="12.5" fill="#334155" text-anchor="middle">2<tspan fill="#1d4ed8" font-weight="700">7</tspan>8</text>
