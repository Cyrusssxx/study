  <rect x="418" y="186" width="72" height="40" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="494" y="186" width="72" height="40" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="570" y="186" width="72" height="40" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="74" y="212" font-size="12.5" fill="#334155" text-anchor="middle">93<tspan fill="#b91c1c" font-weight="700">0</tspan></text>
  <text x="150" y="212" font-size="12.5" fill="#334155" text-anchor="middle">06<tspan fill="#b91c1c" font-weight="700">3</tspan></text>
  <text x="226" y="212" font-size="12.5" fill="#334155" text-anchor="middle">18<tspan fill="#b91c1c" font-weight="700">4</tspan></text>
  <text x="302" y="212" font-size="12.5" fill="#334155" text-anchor="middle">50<tspan fill="#b91c1c" font-weight="700">5</tspan></text>
  <text x="378" y="212" font-size="12.5" fill="#334155" text-anchor="middle">27<tspan fill="#b91c1c" font-weight="700">8</tspan></text>
  <text x="454" y="212" font-size="12.5" fill="#334155" text-anchor="middle">10<tspan fill="#b91c1c" font-weight="700">9</tspan></text>
  <text x="530" y="212" font-size="12.5" fill="#334155" text-anchor="middle">58<tspan fill="#b91c1c" font-weight="700">9</tspan></text>
  <text x="606" y="212" font-size="12.5" fill="#334155" text-anchor="middle">26<tspan fill="#b91c1c" font-weight="700">9</tspan></text>

  <text x="38" y="264" font-size="11" fill="#64748b">② 按十位分配 + 收集</text>
