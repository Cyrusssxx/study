  <text x="38" y="350" font-size="11" fill="#64748b">③ 按百位分配 + 收集（完成）</text>
  <rect x="38" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="114" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="190" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="266" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="342" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="418" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="494" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="570" y="358" width="72" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="74" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">0</tspan>63</text>
  <text x="150" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">1</tspan>09</text>
  <text x="226" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">1</tspan>84</text>
  <text x="302" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">2</tspan>69</text>
  <text x="378" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">2</tspan>78</text>
  <text x="454" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">5</tspan>05</text>
  <text x="530" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">5</tspan>89</text>
  <text x="606" y="384" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle"><tspan fill="#b45309">9</tspan>30</text>

  <text x="20" y="424" font-size="11.5" fill="#334155">每趟都是「分配进 r 个队列 + 按队列顺序收集」，本质是一次<tspan font-weight="700">稳定</tspan>排序；前几趟排好的次序靠稳定性保住。</text>

  <rect x="20" y="440" width="640" height="92" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="460" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="478" font-size="11.2" fill="#7f1d1d">① 时间 O(d(n+r))、空间 O(r)；d 是位数、r 是基数。不基于比较，所以不受 O(n log n) 下界约束。</text>
  <text x="34" y="496" font-size="11.2" fill="#7f1d1d">② 任何一趟不稳定，前面所有趟都白排 —— 它的正确性完全依赖稳定性。</text>
  <text x="34" y="514" font-size="11.2" fill="#7f1d1d">③ 适合位数少、取值范围小的整数 / 字符串；位数一多，d(n+r) 就不如快排了。</text>
</svg>
