<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="550" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">基数排序 LSD · 三位数三趟</text>
  <text x="20" y="48" font-size="12" fill="#64748b">个位 → 十位 → 百位，每趟「分配进 10 个队列 + 顺序收集」，红字是这一趟看的位</text>

