<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 662" width="680" height="662" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="662" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">TCP 零窗口与坚持定时器 · rwnd 收缩到 0 之后，怎么知道它又开了</text>
  <text x="20" y="48" font-size="12" fill="#64748b">发送窗口 = min(rwnd, cwnd)：接收方用 rwnd 管「别把我淹了」，拥塞控制用 cwnd 管「别把网络淹了」</text>

  <text x="20" y="76" font-size="11" font-weight="700" fill="#1e3a8a">一、接收方通告的 rwnd 逐步收缩（本笔记 5.3.5 的例子：400 → 300 → 100 → 0）</text>

  <text x="112" y="102" font-size="10.5" font-weight="700" fill="#166534" text-anchor="end">400</text>
  <rect x="120" y="90" width="420" height="20" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="330" y="104" font-size="10" fill="#166534" text-anchor="middle">还能收 400 B</text>

  <text x="112" y="132" font-size="10.5" font-weight="700" fill="#166534" text-anchor="end">300</text>
  <rect x="120" y="120" width="315" height="20" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="277" y="134" font-size="10" fill="#166534" text-anchor="middle">300 B</text>
  <text x="444" y="134" font-size="9.5" fill="#94a3b8">已确认 100 B，缓存被占</text>

  <text x="112" y="162" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="end">100</text>
  <rect x="120" y="150" width="105" height="20" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="172" y="164" font-size="10" fill="#92400e" text-anchor="middle">100 B</text>

  <text x="112" y="192" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="end">0</text>
  <rect x="120" y="180" width="420" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="330" y="194" font-size="10" fill="#b91c1c" text-anchor="middle">缓存已满 → rwnd = 0，发送方必须停发</text>

  <text x="20" y="222" font-size="11.5" fill="#334155">注意 <tspan font-weight="700">rwnd 是接收方「主动」告诉发送方的</tspan>，不是发送方自己算的；发送方只是被动遵守最新的那个值。</text>

  <text x="20" y="252" font-size="11" font-weight="700" fill="#1e3a8a">二、零窗口之后：靠持续计时器（persist timer）打破死锁</text>

  <rect x="130" y="262" width="40" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="150" y="279" font-size="11" font-weight="700" fill="#312e81" text-anchor="middle">A</text>
  <rect x="520" y="262" width="40" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="540" y="279" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">B</text>
  <line x1="150" y1="286" x2="150" y2="470" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="540" y1="286" x2="540" y2="470" stroke="#cbd5e1" stroke-width="1.2"/>

  <line x1="540" y1="300" x2="156" y2="300" stroke="#166534" stroke-width="1.3"/>
  <path d="M150 300 L160 296 L160 304 Z" fill="#166534"/>
  <text x="345" y="294" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">ACK，rwnd = 0（窗口关闭）</text>

  <circle cx="150" cy="328" r="3.5" fill="#b45309"/>
  <text x="164" y="332" font-size="10.5" fill="#b45309">A 收到 0 窗口 → <tspan font-weight="700">启动持续计时器</tspan>（此时不能靠重传计时器，因为压根没数据在途）</text>

  <line x1="150" y1="356" x2="534" y2="356" stroke="#4a7ab8" stroke-width="1.3"/>
  <path d="M540 356 L530 352 L530 360 Z" fill="#4a7ab8"/>
  <text x="345" y="350" font-size="10.5" fill="#1e3a8a" text-anchor="middle">计时器超时 → 发<tspan font-weight="700">零窗口探测</tspan>（1 字节，seq = 2001）</text>

  <line x1="540" y1="384" x2="156" y2="384" stroke="#166534" stroke-width="1.3"/>
  <path d="M150 384 L160 380 L160 388 Z" fill="#166534"/>
  <text x="345" y="378" font-size="10.5" fill="#166534" text-anchor="middle">ACK，rwnd = 0（还是没空间，探测白跑一趟）</text>

  <circle cx="150" cy="412" r="3.5" fill="#b45309"/>
  <text x="164" y="416" font-size="10.5" fill="#b45309">A <tspan font-weight="700">重设计时器</tspan>，循环探测 —— 这就是「坚持」的含义</text>

  <line x1="540" y1="440" x2="156" y2="440" stroke="#166534" stroke-width="1.3"/>
  <path d="M150 440 L160 436 L160 444 Z" fill="#166534"/>
  <text x="345" y="434" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">ACK，rwnd = 200（缓存释放了！）</text>

  <line x1="150" y1="466" x2="534" y2="466" stroke="#4a7ab8" stroke-width="1.3"/>
  <path d="M540 466 L530 462 L530 470 Z" fill="#4a7ab8"/>
  <text x="345" y="460" font-size="10.5" fill="#1e3a8a" text-anchor="middle">A 恢复发送（窗口 200）</text>

  <text x="20" y="498" font-size="11.5" fill="#334155">为什么不用重传计时器：<tspan font-weight="700">重传计时器只在「有未确认数据」时才算</tspan>；零窗口时在途数据为 0，它根本不会超时。</text>
  <text x="20" y="518" font-size="11.5" fill="#334155">如果没有坚持定时器，B 的「窗口重开」报文一旦丢失，双方就永久互等 —— 这就是零窗口死锁。</text>

  <rect x="20" y="534" width="640" height="112" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="554" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="574" font-size="11.5" fill="#7f1d1d">① 发送窗口取 <tspan font-weight="700">min(rwnd, cwnd)</tspan>，两个都要看；只写 rwnd 是漏了拥塞控制这一半。</text>
  <text x="34" y="594" font-size="11.5" fill="#7f1d1d">② 零窗口探测报文<tspan font-weight="700">只有 1 字节</tspan>，且要占一个序号（所以后面 seq 会跟着走）。</text>
  <text x="34" y="614" font-size="11.5" fill="#7f1d1d">③ 链路层滑动窗口大小固定，传输层随接收缓存动态变 —— 这是两层流量控制最本质的区别。</text>
  <text x="34" y="634" font-size="11.5" fill="#7f1d1d">④ rwnd 缩小到 0 是「接收方缓存满」，不是「网络拥塞」；网络拥塞看的是 cwnd，别混为一谈。</text>
</svg>
