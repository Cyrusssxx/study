<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="sbArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="sbArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">单总线结构数据通路 · 一条总线分时复用</text>
  <text x="20" y="48" font-size="12" fill="#64748b">所有部件经三态门挂到同一条内部总线，任一时刻只允许一个输出</text>

  <rect x="40" y="76" width="104" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="92" y="105" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">PC</text>
  <rect x="160" y="76" width="104" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="212" y="105" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">MAR</text>
  <rect x="280" y="76" width="104" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="332" y="105" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">MDR</text>
  <rect x="400" y="76" width="104" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="452" y="105" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">IR</text>
  <rect x="520" y="76" width="120" height="48" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="580" y="105" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">通用寄存器堆</text>

  <line x1="92" y1="124" x2="92" y2="148" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="212" y1="124" x2="212" y2="148" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="332" y1="124" x2="332" y2="148" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="452" y1="124" x2="452" y2="148" stroke="#818cf8" stroke-width="1.5"/>
  <line x1="580" y1="124" x2="580" y2="148" stroke="#818cf8" stroke-width="1.5"/>
  <text x="596" y="140" font-size="10.5" fill="#94a3b8">每个连接处设三态门</text>

  <rect x="40" y="150" width="600" height="18" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="340" y="163" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">内部总线（同一时刻只能传一个数据）</text>

  <text x="40" y="196" font-size="12.5" font-weight="700" fill="#334155">ALU 两侧的暂存器——单总线结构的必需品</text>

  <line x1="340" y1="168" x2="340" y2="228" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#sbArrow)"/>
  <rect x="280" y="230" width="120" height="36" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="340" y="253" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Y（输入暂存）</text>

  <line x1="310" y1="266" x2="310" y2="290" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#sbArrow)"/>
  <path d="M466,168 L466,306 L402,306" fill="none" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#sbArrow)"/>
  <text x="474" y="240" font-size="10.5" fill="#4f46e5">另一操作数直接来自总线</text>

  <path d="M280,290 L400,290 L400,322 L280,322 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="340" y="311" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">ALU</text>

  <line x1="340" y1="322" x2="340" y2="344" stroke="#059669" stroke-width="1.5" marker-end="url(#sbArrowG)"/>
  <rect x="280" y="346" width="120" height="36" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="340" y="369" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Z（输出暂存）</text>
  <path d="M400,364 L560,364 L560,170" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#sbArrowG)"/>
  <text x="566" y="300" font-size="10.5" fill="#059669">结果稳定后才回总线</text>

  <text x="40" y="410" font-size="12" font-weight="700" fill="#334155">取指阶段（读主存 5 拍时共 7 拍）</text>
  <text x="40" y="430" font-size="11.5" fill="#475569">① (PC)→MAR：PCout, MARin　② MEM(MAR)→MDR：MDRin, read　③ (MDR)→IR：MDRout, IRin</text>
  <text x="40" y="450" font-size="12" font-weight="700" fill="#334155">执行阶段</text>
  <text x="40" y="470" font-size="11.5" fill="#475569">加法 ① (rs)→Y ② (rs)+(rd)→Z ③ (Z)→rd　｜　取数 ① (rs)→MAR ② MEM(MAR)→MDR ③ (MDR)→rd</text>
  <text x="40" y="490" font-size="11" fill="#94a3b8">控制信号 = 部件名 + in/out：out 允许该部件输出到总线，in 允许总线写入该部件</text>
</svg>
