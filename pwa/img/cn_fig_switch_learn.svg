<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" width="680" height="610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="610" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">以太网交换机自学习 · A 与 B 第一次通信的三步</text>
  <text x="20" y="48" font-size="12" fill="#64748b">自学习只看「源 MAC 从哪个口进来」；转发表里查的是「目的 MAC 该从哪个口出去」</text>

  <text x="20" y="82" font-size="12" font-weight="700" fill="#1e3a8a">① A 发帧给 B —— 表里没有 B，只能泛洪</text>
  <rect x="254" y="96" width="150" height="52" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="329" y="118" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">交换机</text>
  <text x="329" y="136" font-size="10.5" fill="#4338ca" text-anchor="middle">转发表：空</text>
  <rect x="56" y="100" width="76" height="34" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="94" y="122" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <rect x="56" y="152" width="76" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="94" y="174" font-size="11.5" fill="#475569" text-anchor="middle">C</text>
  <rect x="56" y="196" width="76" height="34" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="94" y="218" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">B</text>

  <path d="M132 117 L254 113" stroke="#4338ca" stroke-width="1.6"/>
  <path d="M248 109 L256 113 L248 117" fill="#4338ca"/>
  <text x="192" y="108" font-size="10" fill="#4338ca" text-anchor="middle">A→B 入端口 1</text>

  <path d="M404 108 L448 108 L448 168 L242 168 L242 168" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <path d="M404 108 L448 108 L448 212 L242 212" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <path d="M249 164 L241 168 L249 172" fill="#f59e0b"/>
  <path d="M249 208 L241 212 L249 216" fill="#f59e0b"/>
  <path d="M138 168 L242 168" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <path d="M138 212 L242 212" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="470" y="150" font-size="10.5" fill="#b45309">目的未知 → 向 2、3 口泛洪</text>
  <text x="470" y="166" font-size="10.5" fill="#b45309">（B 收到，C 也白收一份）</text>

  <rect x="470" y="88" width="190" height="52" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="482" y="106" font-size="10.5" font-weight="700" fill="#312e81">转发表（学到 A）</text>
  <text x="482" y="124" font-size="10.5" fill="#3730a3">A → 端口 <tspan font-weight="700">1</tspan></text>

  <text x="20" y="256" font-size="12" font-weight="700" fill="#1e3a8a">② B 回帧给 A —— 表里有 A，单播直达</text>
  <rect x="254" y="270" width="150" height="52" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="329" y="292" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">交换机</text>
  <text x="329" y="310" font-size="10.5" fill="#4338ca" text-anchor="middle">转发表：A→1</text>
  <rect x="56" y="274" width="76" height="34" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="94" y="296" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <rect x="56" y="326" width="76" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="94" y="348" font-size="11.5" fill="#475569" text-anchor="middle">C</text>
  <rect x="56" y="370" width="76" height="34" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="94" y="392" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">B</text>

  <path d="M132 386 L254 300" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M246 297 L255 296 L252 305" fill="#16a34a"/>
  <text x="150" y="400" font-size="10" fill="#15803d">B→A 入端口 3</text>
  <path d="M254 300 L132 292" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M140 288 L131 292 L140 296" fill="#16a34a"/>
  <text x="176" y="282" font-size="10" fill="#15803d">只转 1 口，C 收不到</text>

  <rect x="470" y="262" width="190" height="70" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="482" y="280" font-size="10.5" font-weight="700" fill="#312e81">转发表（又学到 B）</text>
  <text x="482" y="298" font-size="10.5" fill="#3730a3">A → 端口 <tspan font-weight="700">1</tspan></text>
  <text x="482" y="316" font-size="10.5" fill="#3730a3">B → 端口 <tspan font-weight="700">3</tspan></text>

  <text x="20" y="428" font-size="12" font-weight="700" fill="#1e3a8a">③ 此后 A↔B 双向单播，不再泛洪</text>
  <rect x="254" y="442" width="150" height="52" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="329" y="464" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">交换机</text>
  <text x="329" y="482" font-size="10.5" fill="#4338ca" text-anchor="middle">A→1、B→3</text>
  <rect x="56" y="450" width="76" height="34" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="94" y="472" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <rect x="56" y="502" width="76" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="94" y="524" font-size="11.5" fill="#475569" text-anchor="middle">C</text>
  <rect x="56" y="546" width="76" height="34" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <text x="94" y="568" font-size="11.5" font-weight="700" fill="#166534" text-anchor="middle">B</text>
  <path d="M132 467 L254 467" stroke="#16a34a" stroke-width="1.8"/>
  <path d="M246 463 L255 467 L246 471" fill="#16a34a"/>
  <path d="M254 467 L132 467" stroke="#16a34a" stroke-width="0"/>
  <path d="M404 467 L452 467 L452 563 L136 563" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <path d="M144 559 L135 563 L144 567" fill="#16a34a"/>
  <text x="470" y="500" font-size="10.5" fill="#15803d">C 全程收不到</text>
  <text x="470" y="516" font-size="10.5" fill="#15803d">（冲突域被隔离）</text>

  <rect x="20" y="588" width="640" height="2" rx="1" fill="#ffffff"/>
</svg>
