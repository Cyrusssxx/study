<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="vmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="vmArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">页式虚存：虚地址 → TLB / 页表 → 物理地址</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">TLB 命中就不必访存查页表；页表项有效位为 0 触发缺页异常，OS 调页后重新执行同一条指令</text>

  <!-- 主干 -->
  <rect x="24" y="62" width="378" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="38" y="80" font-size="11" font-weight="700" fill="#1e40af">① CPU 给出的虚地址</text>
  <rect x="38" y="88" width="238" height="24" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="157" y="104" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">虚页号</text>
  <rect x="278" y="88" width="110" height="24" rx="3" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="333" y="104" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">页内偏移</text>

  <path d="M 128 120 L 128 148" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#vmArrow)"/>
  <path d="M 320 120 L 320 148" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#vmArrow)"/>

  <!-- TLB 与页表 -->
  <rect x="24" y="150" width="200" height="96" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="38" y="168" font-size="11" font-weight="700" fill="#5b21b6">② TLB（快表）</text>
  <text x="38" y="186" font-size="9.5" fill="#4c1d95">相联存储器，按虚页号并行比较</text>
  <text x="38" y="201" font-size="9.5" fill="#4c1d95">表项＝虚页号(标记)＋物理页号＋控制位</text>
  <text x="38" y="216" font-size="9.5" fill="#4c1d95">全相联／组相联，与 Cache 同理</text>
  <text x="38" y="234" font-size="9.5" font-weight="700" fill="#5b21b6">命中 → 直接拿到物理页号</text>

  <rect x="238" y="150" width="164" height="96" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="252" y="168" font-size="11" font-weight="700" fill="#9a3412">②′ 页表（慢表）</text>
  <text x="252" y="186" font-size="9.5" fill="#7c2d12">在主存，每进程一张</text>
  <text x="252" y="201" font-size="9.5" fill="#7c2d12">页表基址寄存器 ＋ 虚页号索引</text>
  <text x="252" y="216" font-size="9.5" fill="#7c2d12">TLB 未命中才来查它</text>
  <text x="252" y="234" font-size="9.5" font-weight="700" fill="#9a3412">有效位＝1 → 物理页号</text>

  <path d="M 128 246 L 128 282" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#vmArrow)"/>
  <path d="M 320 246 L 320 282" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#vmArrow)"/>

  <rect x="24" y="284" width="378" height="78" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="38" y="302" font-size="11" font-weight="700" fill="#065f46">③ 物理地址 = 物理页号 ＋ 页内偏移</text>
  <rect x="38" y="310" width="238" height="22" rx="3" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="157" y="325" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">物理页号（页框号）</text>
  <rect x="278" y="310" width="110" height="22" rx="3" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="333" y="325" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">页内偏移</text>
  <text x="38" y="347" font-size="9" fill="#047857">页大小相同 → 页内偏移一位不改，直接照抄</text>

  <path d="M 213 362 L 213 372" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#vmArrow)"/>

  <rect x="24" y="374" width="378" height="56" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="38" y="392" font-size="11" font-weight="700" fill="#1e40af">④ 物理地址送 Cache / 主存</text>
  <text x="38" y="410" font-size="9.5" fill="#334155">物理地址再拆「标记 ｜ 组号 ｜ 块内地址」，组号定位、标记比较</text>
  <text x="38" y="425" font-size="9.5" fill="#334155">Cache 命中取数、未命中访主存（这一层由硬件管，与缺页无关）</text>

  <!-- 缺页异常支路 -->
  <path d="M 402 216 L 432 216" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#vmArrowRed)"/>
  <text x="406" y="208" font-size="9" font-weight="700" fill="#b91c1c">＝0</text>
  <rect x="434" y="150" width="222" height="96" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="448" y="168" font-size="11" font-weight="700" fill="#991b1b">缺页异常（内部异常）</text>
  <text x="448" y="186" font-size="9.5" fill="#7f1d1d">不是外部中断；由 OS 缺页处理程序接手</text>
  <text x="448" y="201" font-size="9.5" fill="#7f1d1d">按页故障地址从外存读入一个整页</text>
  <text x="448" y="216" font-size="9.5" fill="#7f1d1d">更新页表有效位与物理页号，可能淘汰旧页</text>
  <text x="448" y="234" font-size="9.5" font-weight="700" fill="#991b1b">返回后重新执行发生缺页的那条指令</text>

  <!-- 右侧说明卡 -->
  <rect x="434" y="262" width="222" height="168" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="448" y="282" font-size="11" font-weight="700" fill="#1e3a8a">页表项的三种控制位</text>
  <text x="448" y="302" font-size="9.5" fill="#334155"><tspan font-weight="700" fill="#1e3a8a">有效位</tspan>：1＝已在主存，存物理页号</text>
  <text x="448" y="317" font-size="9.5" fill="#334155">　　　　0＝不在主存，存外存地址</text>
  <text x="448" y="337" font-size="9.5" fill="#334155"><tspan font-weight="700" fill="#1e3a8a">脏位</tspan>：页面是否被改写过</text>
  <text x="448" y="352" font-size="9.5" fill="#334155">　　　决定置换时要不要写回磁盘</text>
  <text x="448" y="372" font-size="9.5" fill="#334155"><tspan font-weight="700" fill="#1e3a8a">引用位</tspan>：是否被访问过</text>
  <text x="448" y="387" font-size="9.5" fill="#334155">　　　供 Clock／LRU 等替换算法参考</text>
  <text x="448" y="410" font-size="9" fill="#64748b">页表只能由 OS 与硬件访问，用户程序读不到</text>
</svg>
