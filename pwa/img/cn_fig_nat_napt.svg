<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="nOut" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7ab8"/></marker>
    <marker id="nBack" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d98b1f"/></marker>
  </defs>
  <rect width="780" height="372" fill="#fbfcfe"/>
  <rect x="0" y="0" width="780" height="36" fill="#4a7ab8"/>
  <text x="16" y="24" fill="#ffffff" font-size="15" font-weight="700">NAT / NAPT：多台内网主机共用一个公网 IP，靠端口号区分</text>

  <rect x="20" y="58" width="150" height="30" rx="5" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="95" y="78" text-anchor="middle" fill="#2c4a6b" font-size="12">H1　192.168.1.10:1025</text>
  <rect x="20" y="100" width="150" height="30" rx="5" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="95" y="120" text-anchor="middle" fill="#2c4a6b" font-size="12">H2　192.168.1.11:1025</text>
  <rect x="610" y="76" width="150" height="40" rx="5" fill="#fff4e2" stroke="#d98b1f"/>
  <text x="685" y="94" text-anchor="middle" fill="#8a6a2a" font-size="12" font-weight="700">公网服务器</text>
  <text x="685" y="109" text-anchor="middle" fill="#8a6a2a" font-size="11">203.0.113.5:80</text>

  <rect x="242" y="52" width="296" height="192" rx="8" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="256" y="73" fill="#2c4a6b" font-size="13" font-weight="700">NAT 路由器（外接口 202.1.1.1）</text>
  <text x="256" y="92" fill="#33618f" font-size="11.5" font-weight="700">NAPT 转换表（内网 IP:端口 ↔ 公网 IP:端口）</text>
  <line x1="254" y1="98" x2="526" y2="98" stroke="#c9d9ec"/>
  <g font-size="11.5" fill="#4a5568">
    <text x="258" y="118">192.168.1.10:1025</text><text x="402" y="118">→</text><text x="420" y="118">202.1.1.1:50001</text>
    <text x="258" y="140">192.168.1.11:1025</text><text x="402" y="140">→</text><text x="420" y="140">202.1.1.1:50002</text>
  </g>
  <line x1="254" y1="152" x2="526" y2="152" stroke="#c9d9ec"/>
  <g font-size="11.5" fill="#4a5568">
    <text x="256" y="172">出方向：改写<tspan font-weight="700">源 IP + 源端口</tspan>，重算 IP / TCP 校验和</text>
    <text x="256" y="192">回方向：按<tspan font-weight="700">目的端口</tspan>回查表项，改回内网 IP + 端口</text>
    <text x="256" y="212">只改 IP 与端口；链路层 MAC 逐跳封装，不在表内</text>
    <text x="256" y="232" fill="#c0392b">外网看不到内网拓扑，无法主动发起连接</text>
  </g>

  <line x1="172" y1="73" x2="236" y2="73" stroke="#4a7ab8" stroke-width="2" marker-end="url(#nOut)"/>
  <line x1="172" y1="115" x2="236" y2="115" stroke="#4a7ab8" stroke-width="2" marker-end="url(#nOut)"/>
  <line x1="540" y1="84" x2="604" y2="84" stroke="#4a7ab8" stroke-width="2" marker-end="url(#nOut)"/>
  <line x1="604" y1="112" x2="540" y2="112" stroke="#d98b1f" stroke-width="2" marker-end="url(#nBack)"/>
  <text x="572" y="132" text-anchor="middle" fill="#b06a12" font-size="11">回程按端口回查</text>

  <rect x="20" y="262" width="740" height="96" rx="8" fill="#eef4fb" stroke="#c9d9ec"/>
  <text x="34" y="284" fill="#2c4a6b" font-size="12.5" font-weight="700">一次完整改写的示例（H1 访问公网 80 端口）</text>
  <g font-size="11.5" fill="#4a5568">
    <text x="34" y="306">出：源 192.168.1.10:1025　→　源 202.1.1.1:50001　｜　目的 203.0.113.5:80 保持不变</text>
    <text x="34" y="326">回：目的 202.1.1.1:50001　→　目的 192.168.1.10:1025　｜　源 203.0.113.5:80 保持不变</text>
    <text x="34" y="346" fill="#8a6a2a">作用：节省公网 IP、隐藏内网结构；代价：破坏端到端透明性，需 NAT 穿透才能从外网主动访问。</text>
  </g>
</svg>
