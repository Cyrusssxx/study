<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="680" height="596" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="596" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">CSMA/CD · 为什么最小帧长必须等于争用期 × 数据率</text>
  <text x="20" y="48" font-size="12" fill="#64748b">A 发出的信号要跑到最远端再折返，最快也要 2τ 才能确认「没人跟我撞」</text>

  <text x="40" y="100" font-size="12" font-weight="700" fill="#1e3a8a">站 A</text>
  <text x="40" y="200" font-size="12" font-weight="700" fill="#1e3a8a">站 B</text>
  <line x1="100" y1="96" x2="640" y2="96" stroke="#cbd5e1" stroke-width="1.6"/>
  <line x1="100" y1="196" x2="640" y2="196" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="648" y="100" font-size="10.5" fill="#94a3b8">t</text>
  <text x="648" y="200" font-size="10.5" fill="#94a3b8">t</text>

  <rect x="110" y="80" width="400" height="14" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <text x="310" y="72" font-size="10.5" fill="#4338ca" text-anchor="middle">A 正在发送的长帧（长度 ≥ 2τ 的发送时间）</text>

  <line x1="110" y1="96" x2="290" y2="212" stroke="#4338ca" stroke-width="1.6"/>
  <line x1="270" y1="212" x2="450" y2="96" stroke="#60a5fa" stroke-width="1.6"/>
  <circle cx="290" cy="212" r="5" fill="#dc2626"/>
  <text x="300" y="232" font-size="11" font-weight="700" fill="#b91c1c">碰撞点</text>

  <path d="M288 206 L252 190" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M292 206 L328 190" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="196" y="182" font-size="10.5" fill="#b91c1c" text-anchor="middle">干扰信号回传 B</text>
  <text x="392" y="182" font-size="10.5" fill="#b91c1c" text-anchor="middle">干扰信号回传 A</text>

  <circle cx="110" cy="96" r="4" fill="#4338ca"/>
  <text x="106" y="118" font-size="10.5" fill="#4338ca" text-anchor="middle">A 开播</text>
  <circle cx="270" cy="196" r="4" fill="#60a5fa"/>
  <text x="266" y="228" font-size="10.5" fill="#1d4ed8" text-anchor="middle">B 开播</text>
  <circle cx="450" cy="96" r="4" fill="#dc2626"/>

  <path d="M110 246 L510 246" stroke="#4338ca" stroke-width="1.2"/>
  <path d="M110 240 L110 252" stroke="#4338ca" stroke-width="1.2"/>
  <path d="M510 240 L510 252" stroke="#4338ca" stroke-width="1.2"/>
  <path d="M110 240 L118 244 L110 248" fill="#4338ca"/>
  <path d="M510 240 L502 244 L510 248" fill="#4338ca"/>
  <text x="310" y="266" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">争用期 2τ（往返传播时延）</text>
  <text x="452" y="118" font-size="10.5" fill="#b91c1c">A 此时才确知冲突</text>

  <text x="24" y="306" font-size="12.5" font-weight="700" fill="#334155">最小帧长的来历</text>
  <rect x="24" y="318" width="632" height="66" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="40" y="340" font-size="12" fill="#1e3a8a">最小帧长 ＝ 争用期 2τ × 数据率　（等价于「发送时延 ≥ 往返传播时延」）</text>
  <text x="40" y="362" font-size="11.5" fill="#1e40af">以太网：单程 τ = 25.6 μs ⇒ 2τ = 51.2 μs；数据率 10 Mb/s ⇒ 51.2 μs × 10 Mb/s = <tspan font-weight="700">512 bit = 64 B</tspan></text>
  <text x="40" y="378" font-size="10.5" fill="#64748b">数据率提高时若 τ 不变，最小帧长就要同比放大（100 Mb/s 时 512 bit 不变，但网络跨距必须缩到 1/10）</text>

  <text x="24" y="414" font-size="12.5" font-weight="700" fill="#334155">二进制指数退避：撞了 i 次，等几个争用期？</text>
  <g font-size="11">
    <rect x="24" y="426" width="200" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="124" y="448" font-size="11" fill="#334155" text-anchor="middle">第 1 次冲突 → 从 {0,1} 里取</text>
    <rect x="236" y="426" width="200" height="34" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="336" y="448" font-size="11" fill="#334155" text-anchor="middle">第 i 次 → 从 {0 … 2ⁱ−1} 里取</text>
    <rect x="448" y="426" width="208" height="34" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
    <text x="552" y="448" font-size="11" fill="#854d0e" text-anchor="middle">i ＞ 10 一律按 10 算（窗口封顶）</text>
  </g>
  <text x="24" y="480" font-size="11" fill="#334155">r 个争用期 = r × 512 bit 的发送时间；<tspan font-weight="700">16 次</tspan>冲突仍不成功则丢弃该帧、向上层报错。</text>

  <rect x="20" y="494" width="640" height="88" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="514" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="534" font-size="11.5" fill="#7f1d1d">① 边发边听只能判断「<tspan font-weight="700">发的同时</tspan>是否撞车」；帧发完后再撞就无法感知，这正是最小帧长的意义。</text>
  <text x="34" y="554" font-size="11.5" fill="#7f1d1d">② 退避窗口按<tspan font-weight="700">冲突次数</tspan>翻倍，不是按重传次数无上限翻倍（10 次封顶）。</text>
  <text x="34" y="574" font-size="11.5" fill="#7f1d1d">③ CSMA/CD 只用于<tspan font-weight="700">半双工</tspan>有线以太网；全双工交换式以太网、无线（802.11 用 CSMA/CA）都不用。</text>
</svg>
