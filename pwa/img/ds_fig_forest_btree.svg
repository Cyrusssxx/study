<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="fb1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7ab8"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#fbfcfe"/>
  <text x="24" y="28" font-size="14.5" font-weight="700" fill="#2c4a6b">树 / 森林 ↔ 二叉树：只记一句<tspan font-weight="700" fill="#a55a12">「左孩子右兄弟」</tspan></text>
  <text x="24" y="47" font-size="10.5" fill="#6b7a8d">左指针连第一个孩子、右指针连下一个兄弟；转换后根必无右孩子。森林接成一串：根的右链串着各棵树的根</text>

  <!-- ① 树 → 二叉树 -->
  <rect x="20" y="62" width="376" height="212" rx="4" fill="#ffffff" stroke="#4a7ab8"/>
  <text x="32" y="82" font-size="11" font-weight="700" fill="#2c4a6b">① 树 → 二叉树：根无右孩子</text>
  <text x="44" y="102" font-size="9.5" fill="#8b98a8">原树（A 有 3 个孩子）</text>
  <text x="240" y="102" font-size="9.5" fill="#8b98a8">转换后（A 的左子树是一条兄弟链）</text>
  <line x1="42" y1="133" x2="66" y2="164" stroke="#4a7ab8" stroke-width="1.3"/>
  <line x1="42" y1="133" x2="110" y2="164" stroke="#4a7ab8" stroke-width="1.3"/>
  <line x1="42" y1="133" x2="154" y2="164" stroke="#4a7ab8" stroke-width="1.3"/>
  <circle cx="42" cy="126" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="42" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">A</text>
  <circle cx="66" cy="176" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="66" y="181" text-anchor="middle" font-size="11" fill="#2c4a6b">B</text>
  <circle cx="110" cy="176" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="110" y="181" text-anchor="middle" font-size="11" fill="#2c4a6b">C</text>
  <circle cx="154" cy="176" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="154" y="181" text-anchor="middle" font-size="11" fill="#2c4a6b">D</text>
  <text x="196" y="158" font-size="20" font-weight="700" fill="#d9822b">⇒</text>
  <line x1="252" y1="138" x2="236" y2="172" stroke="#4a7ab8" stroke-width="1.3"/>
  <line x1="236" y1="190" x2="288" y2="190" stroke="#d9822b" stroke-width="1.5" marker-end="url(#fb1)"/>
  <line x1="288" y1="190" x2="340" y2="190" stroke="#d9822b" stroke-width="1.5" marker-end="url(#fb1)"/>
  <circle cx="252" cy="126" r="13" fill="#fdeacf" stroke="#d9822b" stroke-width="1.4"/>
  <text x="252" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#a55a12">A</text>
  <circle cx="222" cy="190" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="222" y="195" text-anchor="middle" font-size="11" fill="#2c4a6b">B</text>
  <circle cx="302" cy="190" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="302" y="195" text-anchor="middle" font-size="11" fill="#2c4a6b">C</text>
  <circle cx="354" cy="190" r="13" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="354" y="195" text-anchor="middle" font-size="11" fill="#2c4a6b">D</text>
  <text x="232" y="160" font-size="9" fill="#4a7ab8">左</text>
  <text x="252" y="209" font-size="9" fill="#a55a12">右</text>
  <text x="316" y="209" font-size="9" fill="#a55a12">右</text>
  <text x="270" y="150" font-size="9" fill="#b45c5c">右 = ∅</text>
  <text x="32" y="228" font-size="10" fill="#6b7a8d">A 的左指针 → 第一个孩子 B；B 的右指针 → 下一个兄弟 C</text>
  <text x="32" y="246" font-size="10" fill="#a55a12">C 的右指针 → 再下一个兄弟 D；树根没有兄弟，故<tspan font-weight="700">根必无右孩子</tspan></text>
  <text x="32" y="264" font-size="10" fill="#2f6b48">「无左孩子的结点」才对应原树的叶子，数量可能与原叶子数不同</text>

  <!-- ② 森林 → 二叉树 -->
  <rect x="412" y="62" width="368" height="212" rx="4" fill="#ffffff" stroke="#2f8f5b"/>
  <text x="424" y="82" font-size="11" font-weight="700" fill="#2f6b48">② 森林 → 二叉树：第 2 棵起接成根的右子树</text>
  <text x="424" y="102" font-size="9.5" fill="#8b98a8">森林：三棵树（根 R₁ / R₂ / R₃）</text>
  <circle cx="452" cy="132" r="12" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="452" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6b48">R₁</text>
  <circle cx="540" cy="132" r="12" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="540" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6b48">R₂</text>
  <circle cx="628" cy="132" r="12" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="628" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6b48">R₃</text>
  <line x1="452" y1="144" x2="440" y2="159" stroke="#2f8f5b" stroke-width="1.2"/>
  <line x1="452" y1="144" x2="466" y2="159" stroke="#2f8f5b" stroke-width="1.2"/>
  <line x1="540" y1="144" x2="528" y2="159" stroke="#2f8f5b" stroke-width="1.2"/>
  <line x1="540" y1="144" x2="552" y2="159" stroke="#2f8f5b" stroke-width="1.2"/>
  <line x1="628" y1="144" x2="616" y2="159" stroke="#2f8f5b" stroke-width="1.2"/>
  <line x1="628" y1="144" x2="640" y2="159" stroke="#2f8f5b" stroke-width="1.2"/>
  <circle cx="440" cy="164" r="5" fill="#eaf6ee" stroke="#2f8f5b"/>
  <circle cx="466" cy="164" r="5" fill="#eaf6ee" stroke="#2f8f5b"/>
  <circle cx="528" cy="164" r="5" fill="#eaf6ee" stroke="#2f8f5b"/>
  <circle cx="552" cy="164" r="5" fill="#eaf6ee" stroke="#2f8f5b"/>
  <circle cx="616" cy="164" r="5" fill="#eaf6ee" stroke="#2f8f5b"/>
  <circle cx="640" cy="164" r="5" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="452" y="184" text-anchor="middle" font-size="9" fill="#8b98a8">第 1 棵</text>
  <text x="540" y="184" text-anchor="middle" font-size="9" fill="#8b98a8">第 2 棵</text>
  <text x="628" y="184" text-anchor="middle" font-size="9" fill="#8b98a8">第 3 棵</text>
  <circle cx="452" cy="212" r="12" fill="#fdeacf" stroke="#d9822b" stroke-width="1.4"/>
  <text x="452" y="217" text-anchor="middle" font-size="10" font-weight="700" fill="#a55a12">R₁</text>
  <circle cx="540" cy="212" r="12" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="540" y="217" text-anchor="middle" font-size="10" fill="#2f6b48">R₂</text>
  <circle cx="628" cy="212" r="12" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="628" y="217" text-anchor="middle" font-size="10" fill="#2f6b48">R₃</text>
  <line x1="464" y1="212" x2="528" y2="212" stroke="#d9822b" stroke-width="1.6" marker-end="url(#fb1)"/>
  <line x1="552" y1="212" x2="616" y2="212" stroke="#d9822b" stroke-width="1.6" marker-end="url(#fb1)"/>
  <text x="490" y="206" font-size="9" fill="#a55a12">右</text>
  <text x="578" y="206" font-size="9" fill="#a55a12">右</text>
  <text x="424" y="246" font-size="10" font-weight="700" fill="#a55a12">根的右链结点数 = 森林的棵数（Q281 2021）</text>
  <text x="424" y="264" font-size="10" fill="#6b7a8d">断开根的右链即可还原森林：根 + 左子树为第 1 棵，右子树递归还原</text>

  <!-- 数量 & 遍历 -->
  <rect x="20" y="286" width="376" height="104" rx="4" fill="#f3f7fc" stroke="#c9d9ec"/>
  <text x="32" y="306" font-size="11" font-weight="700" fill="#2c4a6b">数量对应题：套这两条就不会错</text>
  <text x="32" y="326" font-size="10" fill="#6b7a8d">森林三棵树 3、4、5 个结点 → 二叉树根右子树含后两棵共 <tspan font-weight="700" fill="#a55a12">9</tspan> 个</text>
  <text x="32" y="345" font-size="10" fill="#6b7a8d">根左子树含第 1 棵除根外 <tspan font-weight="700" fill="#a55a12">2</tspan> 个；二叉树共 m 个结点、根右子树 n 个</text>
  <text x="32" y="364" font-size="10" fill="#2f6b48">⇒ 第 1 棵树 = m − n 个结点（Q266）；森林棵数 = 根沿右链的结点数</text>
  <text x="32" y="382" font-size="9.5" fill="#8b98a8">森林叶结点数 = 二叉树左孩子指针为空的结点数（Q278 2014）</text>

  <rect x="412" y="286" width="368" height="104" rx="4" fill="#eaf6ee" stroke="#c8e2d1"/>
  <text x="424" y="306" font-size="11" font-weight="700" fill="#2f6b48">遍历序列跟着走</text>
  <text x="424" y="328" font-size="10.5" fill="#6b7a8d">树的<tspan font-weight="700" fill="#2c4a6b">先根</tspan>序列 ＝ 对应二叉树的<tspan font-weight="700" fill="#2c4a6b">先序</tspan>序列</text>
  <text x="424" y="349" font-size="10.5" fill="#6b7a8d">树的<tspan font-weight="700" fill="#2c4a6b">后根</tspan>序列 ＝ 对应二叉树的<tspan font-weight="700" fill="#2c4a6b">中序</tspan>序列</text>
  <text x="424" y="370" font-size="10" fill="#a55a12">别记成「后根＝后序」—— 右兄弟链接到中序遍历里去了（Q271、Q279、Q280）</text>
  <text x="424" y="386" font-size="9.5" fill="#8b98a8">森林棵数 = 二叉树根沿右链的结点数（Q272）</text>

  <rect x="20" y="402" width="760" height="80" rx="4" fill="#fdeacf" stroke="#d9822b"/>
  <text x="32" y="422" font-size="10.5" font-weight="700" fill="#a55a12">一句话判据：见「孩子」往左下挂，见「兄弟」往右挂，根永远没有右孩子。</text>
  <text x="32" y="442" font-size="10" fill="#6b7a8d">根右指针指向第 2 棵树（可为空，Q263、Q268）；3 棵树 M₁M₂M₃ → 根右子树 = M₂+M₃（Q264）、根左子树 = M₁−1（Q265）。</text>
  <text x="32" y="461" font-size="10" fill="#6b7a8d">森林有 n 个非终端结点 → 对应二叉树右指针为空 n+1 个（Q269）；16 结点完全二叉树对应森林 → 4 棵树、最大树 9 结点（Q267）。</text>
  <text x="32" y="477" font-size="9.5" fill="#8b98a8">图中 A/B/C/D、R₁/R₂/R₃ 仅为示意结点，数量结论取自本节正文与 ★ 真题条目。</text>
</svg>
