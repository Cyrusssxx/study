<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">完全二叉树 · 顺序编号与父子下标关系</text>
  <text x="20" y="48" font-size="12" fill="#64748b">编号从 1 开始、按层自左向右：父 ⌊i/2⌋、左孩子 2i、右孩子 2i+1 —— 这条关系只在完全二叉树上成立</text>

  <g stroke="#cbd5e1" stroke-width="1.2">
    <line x1="185" y1="92" x2="110" y2="122"/>
    <line x1="185" y1="92" x2="260" y2="122"/>
    <line x1="110" y1="146" x2="66" y2="176"/>
    <line x1="110" y1="146" x2="154" y2="176"/>
    <line x1="260" y1="146" x2="216" y2="176"/>
    <line x1="260" y1="146" x2="304" y2="176"/>
    <line x1="66" y1="200" x2="44" y2="230"/>
    <line x1="66" y1="200" x2="88" y2="230"/>
  </g>
  <g stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="4 3">
    <line x1="154" y1="200" x2="132" y2="230"/>
    <line x1="154" y1="200" x2="176" y2="230"/>
  </g>

  <circle cx="185" cy="80" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="185" y="85" font-size="12" fill="#312e81" text-anchor="middle">1</text>
  <circle cx="110" cy="134" r="14" fill="#c7d2fe" stroke="#4338ca" stroke-width="2.2"/>
  <text x="110" y="139" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">2</text>
  <circle cx="260" cy="134" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="260" y="139" font-size="12" fill="#312e81" text-anchor="middle">3</text>
  <circle cx="66" cy="188" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="66" y="193" font-size="12" fill="#312e81" text-anchor="middle">4</text>
  <circle cx="154" cy="188" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="154" y="193" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">5</text>
  <circle cx="216" cy="188" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="216" y="193" font-size="12" fill="#312e81" text-anchor="middle">6</text>
  <circle cx="304" cy="188" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="304" y="193" font-size="12" fill="#312e81" text-anchor="middle">7</text>
  <circle cx="44" cy="242" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="44" y="247" font-size="12" fill="#312e81" text-anchor="middle">8</text>
  <circle cx="88" cy="242" r="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="88" y="247" font-size="12" fill="#312e81" text-anchor="middle">9</text>
  <circle cx="132" cy="242" r="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="132" y="247" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">10</text>
  <circle cx="176" cy="242" r="14" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="176" y="247" font-size="12" fill="#a8a29e" text-anchor="middle">11</text>

  <text x="185" y="60" font-size="10.5" fill="#94a3b8" text-anchor="middle">第 1 层</text>
  <text x="330" y="138" font-size="10.5" fill="#94a3b8">第 2 层</text>
  <text x="330" y="192" font-size="10.5" fill="#94a3b8">第 3 层</text>
  <text x="210" y="246" font-size="10.5" fill="#94a3b8">第 4 层</text>

  <text x="150" y="270" font-size="11.5" font-weight="700" fill="#92400e">以 i = 5 为例：父 = ⌊5/2⌋ = 2，左 = 2×5 = 10，右 = 2×5+1 = 11</text>
  <text x="150" y="288" font-size="10.5" fill="#78716c">图中实线为已存在结点，虚线为「按编号应有但本例未画」的位置</text>

  <rect x="376" y="68" width="284" height="250" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="392" y="90" font-size="12" font-weight="700" fill="#312e81">必背性质（n 为结点数，h 为高度）</text>
  <text x="392" y="114" font-size="11" fill="#334155">第 i 层最多 <tspan font-weight="700">2^(i−1)</tspan> 个结点</text>
  <text x="392" y="136" font-size="11" fill="#334155">高 h 的二叉树最多 <tspan font-weight="700">2^h − 1</tspan> 个</text>
  <text x="392" y="158" font-size="11" fill="#334155">叶子数 <tspan font-weight="700">n0 = n2 + 1</tspan>（任何非空二叉树）</text>
  <text x="392" y="180" font-size="11" fill="#334155">n 个结点高 <tspan font-weight="700">h = ⌊log₂n⌋ + 1 = ⌈log₂(n+1)⌉</tspan></text>
  <text x="392" y="202" font-size="11" fill="#334155">完全二叉树 <tspan font-weight="700">n1 ∈ {0,1}</tspan>，<tspan font-weight="700">n0 = ⌈n/2⌉</tspan></text>
  <text x="392" y="222" font-size="10.5" fill="#64748b">　n 偶 → n0 = n/2；n 奇 → n0 = (n+1)/2</text>
  <text x="392" y="248" font-size="11" fill="#334155">i 的层次 <tspan font-weight="700">= ⌊log₂i⌋ + 1</tspan></text>
  <text x="392" y="270" font-size="11" fill="#334155">编号从 0 起：父 ⌊(i−1)/2⌋、左 2i+1、右 2i+2</text>
  <text x="392" y="292" font-size="10.5" fill="#64748b">　三者同时 +1，务必按题目起点选公式</text>

  <rect x="20" y="310" width="640" height="146" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="332" font-size="11.5" font-weight="700" fill="#312e81">易错：</text>
  <text x="34" y="354" font-size="11.5" fill="#3730a3">① <tspan font-weight="700">n0 = n2 + 1 只对二叉树成立</tspan>；一般树要用「度数之和 + 1 = n 且 n0 = 1 + Σ(度−1)·n_度」的思路推。</text>
  <text x="34" y="376" font-size="11.5" fill="#3730a3">② 满二叉树一定是完全二叉树，反之不成立；完全二叉树的最后一层结点全部靠左连续。</text>
  <text x="34" y="398" font-size="11.5" fill="#3730a3">③ 顺序存储的「下标 i」不是结点编号：A[0] 空着（从 1 开始存）与 A[0] 存根（从 0 开始）公式不同。</text>
  <text x="34" y="420" font-size="11.5" fill="#3730a3">④ 高度公式别记反：<tspan font-weight="700">⌊log₂n⌋ + 1</tspan> 是 n 个结点的树高，<tspan font-weight="700">2^h − 1</tspan> 是高 h 的最多结点数。</text>
  <text x="34" y="442" font-size="11.5" fill="#3730a3">⑤ 求 n0 的偷懒法：n0 = ⌈n/2⌉ 对完全二叉树直接用，不必先求 n2。</text>
</svg>
