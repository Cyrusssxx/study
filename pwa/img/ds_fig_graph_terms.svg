<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="490" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">图的术语一图收齐：有向图 G₁、无向完全图 G₂ 与度 / 连通 / 生成树</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">教材图 6.1：G₁ = ({1,2,3}, {⟨1,2⟩,⟨2,1⟩,⟨2,3⟩})；G₂ 为 4 顶点 6 边无向完全图</text>

  <rect x="24" y="62" width="310" height="252" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="179" y="84" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">G₁ 有向图：弧 ⟨v,w⟩ 是顶点的有序对</text>
  <path d="M 104 146 Q 145 112 176 130" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ar2)"/>
  <path d="M 176 146 Q 145 178 104 162" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ar2)"/>
  <path d="M 204 143 L 250 178" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ar2)"/>
  <circle cx="90" cy="154" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="90" y="159" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">1</text>
  <circle cx="190" cy="136" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="190" y="141" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">2</text>
  <circle cx="266" cy="190" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="266" y="195" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="40" y="232" font-size="10" fill="#475569">弧尾 v → 弧头 w（v 邻接到 w）；边与顶点相关联。</text>
  <text x="40" y="254" font-size="10.5" font-weight="700" fill="#1d4ed8">顶点 2：ID = 1、OD = 2、TD = ID + OD = 3</text>
  <text x="40" y="276" font-size="10" fill="#475569">全图 ΣID = ΣOD = 3 = |E|；无向图则是 ΣTD = 2|E|。</text>
  <text x="40" y="298" font-size="10" fill="#475569">强连通需任意两顶点互相可达，最少 n 条边（成环）。</text>

  <rect x="350" y="62" width="306" height="252" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="503" y="84" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">G₂ 无向完全图 K₄（粗线 = 一棵生成树）</text>
  <line x1="410" y1="130" x2="590" y2="130" stroke="#15803d" stroke-width="3"/>
  <line x1="410" y1="130" x2="410" y2="230" stroke="#15803d" stroke-width="3"/>
  <line x1="410" y1="230" x2="590" y2="230" stroke="#15803d" stroke-width="3"/>
  <line x1="410" y1="130" x2="590" y2="230" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="590" y1="130" x2="410" y2="230" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="590" y1="130" x2="590" y2="230" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="410" cy="130" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="410" y="135" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">A</text>
  <circle cx="590" cy="130" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="590" y="135" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">B</text>
  <circle cx="410" cy="230" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="410" y="235" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">C</text>
  <circle cx="590" cy="230" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="590" y="235" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">D</text>
  <text x="360" y="266" font-size="10" fill="#475569">n = 4：无向完全图边数 n(n−1)/2 = 6，有向完全图 n(n−1)。</text>
  <text x="360" y="288" font-size="10" fill="#475569">每顶点度 3，ΣTD = 12 = 2×|E| = 2×6。</text>
  <text x="360" y="308" font-size="10.5" font-weight="700" fill="#15803d">粗线生成树恰 n−1 = 3 条边：删边断、加边成环。</text>

  <rect x="24" y="326" width="632" height="76" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="347" font-size="11.5" font-weight="700" fill="#334155">判据速查</text>
  <text x="40" y="369" font-size="10.5" fill="#475569">完全图：无向 n(n−1)/2 · 有向 n(n−1)；稀疏图一般 |E| &lt; |V|·log₂|V|（相对概念）。</text>
  <text x="40" y="391" font-size="10.5" fill="#475569">n 顶点：边数 &gt; n−1 必有环、&lt; n−1 必不连通；连通最少 n−1 边，强连通最少 n 边。</text>

  <rect x="24" y="414" width="632" height="62" rx="5" fill="#fef9c3" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="436" font-size="10.5" fill="#854d0e">图不可以是空图：V 必须非空、E 可为空；无向图谈连通 / 连通分量，有向图谈强连通 / 强连通分量。</text>
  <text x="40" y="458" font-size="10.5" fill="#854d0e">极大连通子图 = 连通分量（顶点尽量多），极小连通子图 = 生成树（边尽量少）；有向树恰 1 个入度 0、其余入度 1。</text>
</svg>
