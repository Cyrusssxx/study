<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="sm1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7ab8"/>
    </marker>
    <marker id="sm2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2f8f5b"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#fbfcfe"/>
  <text x="24" y="28" font-size="14.5" font-weight="700" fill="#2c4a6b">稀疏矩阵压缩存储：<tspan font-weight="700" fill="#4a7ab8">三元组表</tspan> 与 <tspan font-weight="700" fill="#2f6b48">十字链表</tspan></text>
  <text x="24" y="47" font-size="10.5" fill="#6b7a8d">非零元个数 t 远小于总元素个数 s（t ≪ s）；只存非零元，但要显式存它的行标 i、列标 j 和值 aij</text>

  <!-- 三元组表 -->
  <rect x="20" y="62" width="376" height="288" rx="4" fill="#ffffff" stroke="#4a7ab8"/>
  <text x="32" y="82" font-size="11" font-weight="700" fill="#2c4a6b">① 数组（三元组顺序表）</text>
  <text x="32" y="101" font-size="10" fill="#6b7a8d">所有三元组按某种顺序存于一维数组</text>
  <rect x="32" y="110" width="352" height="30" rx="2" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="42" y="130" font-size="10" fill="#6b7a8d">另存：<tspan font-weight="700" fill="#2c4a6b">矩阵行数、列数、非零元个数</tspan>（支持后续各种操作）</text>
  <rect x="32" y="150" width="352" height="26" rx="2" fill="#dce9f8" stroke="#4a7ab8"/>
  <text x="112" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">行标 i</text>
  <text x="230" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">列标 j</text>
  <text x="330" y="168" text-anchor="middle" font-size="10" font-weight="700" fill="#2c4a6b">值 aij</text>
  <line x1="176" y1="150" x2="176" y2="250" stroke="#4a7ab8" stroke-width="1"/>
  <line x1="288" y1="150" x2="288" y2="250" stroke="#4a7ab8" stroke-width="1"/>
  <rect x="32" y="176" width="352" height="24" rx="0" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="112" y="192" text-anchor="middle" font-size="10" fill="#6b7a8d">i₁</text>
  <text x="230" y="192" text-anchor="middle" font-size="10" fill="#6b7a8d">j₁</text>
  <text x="330" y="192" text-anchor="middle" font-size="10" fill="#6b7a8d">a₁</text>
  <rect x="32" y="200" width="352" height="24" rx="0" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="112" y="216" text-anchor="middle" font-size="10" fill="#6b7a8d">i₂</text>
  <text x="230" y="216" text-anchor="middle" font-size="10" fill="#6b7a8d">j₂</text>
  <text x="330" y="216" text-anchor="middle" font-size="10" fill="#6b7a8d">a₂</text>
  <rect x="32" y="224" width="352" height="24" rx="0" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="208" y="240" text-anchor="middle" font-size="10" fill="#8b98a8">…… 其余非零元依次排列 ……</text>
  <text x="32" y="268" font-size="10" fill="#2f6b48">✓ 简单直接、存储紧凑</text>
  <text x="32" y="286" font-size="10" fill="#a55a12">△ 插入 / 删除效率低（要移动元素）</text>
  <text x="32" y="308" font-size="10.5" font-weight="700" fill="#b45c5c">✕ 压缩后失去随机存取：无法由 (i, j) 直接算出地址，必须查找三元组表</text>

  <!-- 十字链表 -->
  <rect x="412" y="62" width="368" height="288" rx="4" fill="#ffffff" stroke="#2f8f5b"/>
  <text x="424" y="82" font-size="11" font-weight="700" fill="#2f6b48">② 十字链表（见 6.2 节）</text>
  <text x="424" y="101" font-size="10" fill="#6b7a8d">每个非零元结点带 right、down 两个链域</text>
  <rect x="424" y="112" width="344" height="40" rx="2" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="434" y="130" font-size="9.5" fill="#6b7a8d">非零元结点</text>
  <text x="434" y="145" font-size="10" font-weight="700" fill="#2f6b48">行 | 列 | 值 | right | down</text>

  <text x="424" y="170" font-size="9.5" fill="#8b98a8">行表头（沿 right 串成行链表）</text>
  <rect x="424" y="178" width="44" height="22" rx="2" fill="#d7eede" stroke="#2f8f5b"/>
  <text x="446" y="193" text-anchor="middle" font-size="9" fill="#2f6b48">行头</text>
  <line x1="468" y1="189" x2="490" y2="189" stroke="#4a7ab8" stroke-width="1.4" marker-end="url(#sm1)"/>
  <rect x="492" y="178" width="62" height="22" rx="2" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="523" y="193" text-anchor="middle" font-size="9" fill="#2c4a6b">结点 ⓵</text>
  <line x1="554" y1="189" x2="576" y2="189" stroke="#4a7ab8" stroke-width="1.4" marker-end="url(#sm1)"/>
  <rect x="578" y="178" width="62" height="22" rx="2" fill="#eef4fb" stroke="#4a7ab8"/>
  <text x="609" y="193" text-anchor="middle" font-size="9" fill="#2c4a6b">结点 ⓶</text>
  <text x="648" y="193" font-size="9.5" fill="#4a7ab8">right →</text>

  <text x="424" y="220" font-size="9.5" fill="#8b98a8">列表头（沿 down 串成列链表）</text>
  <rect x="424" y="228" width="44" height="22" rx="2" fill="#d7eede" stroke="#2f8f5b"/>
  <text x="446" y="243" text-anchor="middle" font-size="9" fill="#2f6b48">列头</text>
  <line x1="446" y1="250" x2="446" y2="270" stroke="#2f8f5b" stroke-width="1.4" marker-end="url(#sm2)"/>
  <rect x="416" y="272" width="62" height="22" rx="2" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="447" y="287" text-anchor="middle" font-size="9" fill="#2f6b48">结点 ⓵</text>
  <line x1="447" y1="294" x2="447" y2="312" stroke="#2f8f5b" stroke-width="1.4" marker-end="url(#sm2)"/>
  <rect x="416" y="314" width="62" height="22" rx="2" fill="#eaf6ee" stroke="#2f8f5b"/>
  <text x="447" y="329" text-anchor="middle" font-size="9" fill="#2f6b48">结点 ⓷</text>
  <text x="490" y="287" font-size="9.5" fill="#2f6b48">↓ down</text>

  <text x="540" y="248" font-size="10" fill="#6b7a8d">同一结点既在某行链上，</text>
  <text x="540" y="266" font-size="10" fill="#6b7a8d">又在某列链上 ⇒ 十字交叉</text>
  <text x="540" y="290" font-size="10" fill="#2f6b48">✓ 适合非零元动态变化、</text>
  <text x="540" y="308" font-size="10" fill="#2f6b48">　 需频繁插入删除 / 运算的场景</text>
  <text x="540" y="328" font-size="10" fill="#a55a12">△ 有指针开销、结构较复杂</text>

  <!-- 对比 -->
  <rect x="20" y="356" width="760" height="102" rx="4" fill="#f3f7fc" stroke="#c9d9ec"/>
  <text x="32" y="376" font-size="11" font-weight="700" fill="#2c4a6b">最易混：特殊矩阵 vs 稀疏矩阵</text>
  <text x="32" y="395" font-size="10" fill="#6b7a8d"><tspan font-weight="700" fill="#2c4a6b">特殊矩阵</tspan>（对称、三角、对角）：非零/相同元素分布<tspan font-weight="700" fill="#2f6b48">有规律</tspan> → 用下标映射公式压缩，<tspan font-weight="700" fill="#2f6b48">仍可随机存取</tspan>，不需要存位置。</text>
  <text x="32" y="414" font-size="10" fill="#6b7a8d"><tspan font-weight="700" fill="#a55a12">稀疏矩阵</tspan>：分布<tspan font-weight="700" fill="#b45c5c">无规律</tspan> → 三元组表 / 十字链表，<tspan font-weight="700" fill="#b45c5c">失去随机存取</tspan>，必须显式存 i、j。</text>
  <text x="32" y="433" font-size="10" font-weight="700" fill="#a55a12">易错：① 压缩后丧失随机存取（2023 统考考过「缺点」）；② 还要额外存行数、列数、非零元个数。</text>
  <text x="32" y="451" font-size="10" fill="#6b7a8d">③「稀疏」指非零元占比极低，不是元素总数少 —— n 阶三对角矩阵每行非零元虽少但分布有规律，属特殊矩阵。</text>
</svg>
