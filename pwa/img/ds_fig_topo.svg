<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="tpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">拓扑排序：反复取入度为 0 的顶点输出，再删掉它的出边</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">顶点＝活动、弧＝先后关系（AOV 网）；同时有多个零入度点时先取谁都行 —— 所以序列不唯一</text>

  <!-- 左：AOV 网 -->
  <rect x="24" y="60" width="316" height="330" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="80" font-size="11" font-weight="700" fill="#1e3a8a">AOV 网（该做谁、先做谁）</text>

  <path d="M 86.4 115.4 L 143.6 99.5" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>
  <path d="M 83.7 130.1 L 151.3 179.9" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>
  <path d="M 84.4 240.9 L 150.6 199.1" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>
  <path d="M 84.9 258.3 L 145.1 291.7" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>
  <path d="M 172.8 106.2 L 262.2 183.8" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>
  <path d="M 182 190.8 L 258 196.2" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>
  <path d="M 172.5 288.5 L 262.5 206.5" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#tpArrow)"/>

  <circle cx="70" cy="120" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="125" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <circle cx="70" cy="250" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="255" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">B</text>
  <circle cx="160" cy="95" r="16" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="100" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">C</text>
  <circle cx="165" cy="190" r="16" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="165" y="195" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">D</text>
  <circle cx="160" cy="300" r="16" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="305" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">E</text>
  <circle cx="275" cy="195" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="275" y="200" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">F</text>

  <text x="40" y="358" font-size="9" fill="#64748b">A、B 入度为 0（蓝底）为起点；F 入度为 3 是汇聚点。</text>
  <text x="40" y="373" font-size="9" fill="#64748b">若改成 B 先出，则得 B A E D C F —— 同样合法。</text>

  <!-- 右：入度表与过程 -->
  <rect x="356" y="60" width="300" height="330" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="372" y="80" font-size="11" font-weight="700" fill="#1e3a8a">初始入度</text>

  <rect x="372" y="88" width="38" height="34" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="391" y="102" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <text x="391" y="116" font-size="10" fill="#1d4ed8" text-anchor="middle">0</text>
  <rect x="416" y="88" width="38" height="34" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="435" y="102" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">B</text>
  <text x="435" y="116" font-size="10" fill="#1d4ed8" text-anchor="middle">0</text>
  <rect x="460" y="88" width="38" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="479" y="102" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">C</text>
  <text x="479" y="116" font-size="10" fill="#475569" text-anchor="middle">1</text>
  <rect x="504" y="88" width="38" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="523" y="102" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">D</text>
  <text x="523" y="116" font-size="10" fill="#475569" text-anchor="middle">2</text>
  <rect x="548" y="88" width="38" height="34" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="567" y="102" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">E</text>
  <text x="567" y="116" font-size="10" fill="#475569" text-anchor="middle">1</text>
  <rect x="592" y="88" width="38" height="34" rx="3" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="611" y="102" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">F</text>
  <text x="611" y="116" font-size="10" fill="#b45309" text-anchor="middle">3</text>

  <line x1="372" y1="138" x2="640" y2="138" stroke="#e2e8f0" stroke-width="1"/>
  <text x="372" y="158" font-size="10.5" font-weight="700" fill="#1e3a8a">输出过程（栈或队列存零入度点）</text>

  <text x="372" y="180" font-size="9.5" fill="#334155">① 取 <tspan font-weight="700">A</tspan>：删 A→C、A→D，C 1→0，D 2→1</text>
  <text x="372" y="200" font-size="9.5" fill="#334155">② 取 <tspan font-weight="700">B</tspan>：删 B→D、B→E，D 1→0，E 1→0</text>
  <text x="372" y="220" font-size="9.5" fill="#334155">③ 此刻 C、D、E 都是 0，取 <tspan font-weight="700">C</tspan>：F 3→2</text>
  <text x="372" y="240" font-size="9.5" fill="#334155">④ 取 <tspan font-weight="700">D</tspan>：删 D→F，F 2→1</text>
  <text x="372" y="260" font-size="9.5" fill="#334155">⑤ 取 <tspan font-weight="700">E</tspan>：删 E→F，F 1→0</text>
  <text x="372" y="280" font-size="9.5" fill="#334155">⑥ 取 <tspan font-weight="700">F</tspan>，全部输出完毕</text>

  <rect x="372" y="294" width="264" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="382" y="313" font-size="10" font-weight="700" fill="#1e40af">拓扑序列：A B C D E F（第③步可换序）</text>

  <text x="372" y="342" font-size="9" fill="#64748b">输出顶点数 &lt; n ⟹ 图中有环，此即判环手段之一。</text>
  <text x="372" y="357" font-size="9" fill="#64748b">逆拓扑序 = DFS 退栈输出（逆后序），可直接得到。</text>
  <text x="372" y="372" font-size="9" fill="#64748b">时间复杂度：邻接表 O(n+e)，邻接矩阵 O(n²)。</text>
</svg>
