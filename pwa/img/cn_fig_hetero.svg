<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="heArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="452" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">异构网络互连 · 底层帧格式各不相同，向上只交出一个 IP 服务</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">屏蔽差异的活全在网络层做：IP over everything（什么链路都能跑 IP）＋ everything over IP（什么业务都装进 IP）</text>

  <text x="20" y="70" font-size="9.5" font-weight="700" fill="#334155">四种底层链路技术 —— 介质访问方式、帧格式都不一样</text>

  <rect x="20" y="78" width="228" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="99" font-size="9.5" fill="#334155"><tspan font-weight="700">以太网 802.3</tspan><tspan fill="#64748b"> · MAC 帧 / CSMA/CD</tspan></text>

  <rect x="20" y="118" width="228" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="139" font-size="9.5" fill="#334155"><tspan font-weight="700">PPP</tspan><tspan fill="#64748b"> · 点对点拨号/专线，字节填充</tspan></text>

  <rect x="20" y="158" width="228" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="179" font-size="9.5" fill="#334155"><tspan font-weight="700">卫星链路</tspan><tspan fill="#64748b"> · 长传播时延，专用信道协议</tspan></text>

  <rect x="20" y="198" width="228" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="219" font-size="9.5" fill="#334155"><tspan font-weight="700">无线 802.11</tspan><tspan fill="#64748b"> · CSMA/CA，又一套帧</tspan></text>

  <path d="M 248 95 L 262 95 L 262 155" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 248 135 L 262 135" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 248 175 L 262 175 L 262 158" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 248 215 L 262 215 L 262 162" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
  <path d="M 262 155 L 272 155" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#heArr)"/>

  <rect x="274" y="106" width="134" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="341" y="128" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">路由器（IP 层）</text>
  <text x="341" y="148" font-size="9" fill="#1e40af" text-anchor="middle">统一编址 32 位 IP</text>
  <text x="341" y="164" font-size="9" fill="#1e40af" text-anchor="middle">统一转发（按 IP 头）</text>
  <text x="341" y="184" font-size="9" fill="#64748b" text-anchor="middle">拆掉旧帧，重新封装</text>
  <text x="341" y="198" font-size="9" fill="#64748b" text-anchor="middle">不关心底层是什么链路</text>

  <path d="M 410 155 L 432 155" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#heArr)"/>

  <rect x="434" y="112" width="226" height="88" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="447" y="134" font-size="10.5" font-weight="700" fill="#166534">传输层往上看</text>
  <text x="447" y="153" font-size="9.5" fill="#166534">就是一个统一的 IP 网络</text>
  <text x="447" y="172" font-size="9" fill="#15803d">看不到底层是以太网、PPP</text>
  <text x="447" y="187" font-size="9" fill="#15803d">还是卫星 —— 差异被屏蔽在下方</text>

  <line x1="20" y1="250" x2="660" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="270" font-size="9.5" font-weight="700" fill="#334155">网际设备按工作层次落位 —— 层次越高，职能越重</text>

  <rect x="20" y="280" width="112" height="26" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="76" y="297" font-size="9.5" fill="#5b21b6" text-anchor="middle">应用层及以上</text>
  <rect x="140" y="280" width="252" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="297" font-size="9.5" fill="#334155">网关 —— 唯一做协议转换的设备</text>
  <text x="402" y="297" font-size="9" fill="#64748b">能看懂并改写高层协议</text>

  <rect x="20" y="312" width="112" height="26" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="76" y="329" font-size="9.5" fill="#1e3a8a" text-anchor="middle">网络层</text>
  <rect x="140" y="312" width="252" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="329" font-size="9.5" fill="#334155">路由器 —— IP 分组转发 + 选路</text>
  <text x="402" y="329" font-size="9" fill="#64748b">只转发 IP 分组，不转高层协议</text>

  <rect x="20" y="344" width="112" height="26" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="76" y="361" font-size="9.5" fill="#166534" text-anchor="middle">数据链路层</text>
  <rect x="140" y="344" width="252" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="361" font-size="9.5" fill="#334155">网桥 / 交换机 —— 按 MAC 转发</text>
  <text x="402" y="361" font-size="9" fill="#64748b">同一个 IP 网段内部换帧</text>

  <rect x="20" y="376" width="112" height="26" rx="3" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="76" y="393" font-size="9.5" fill="#92400e" text-anchor="middle">物理层</text>
  <rect x="140" y="376" width="252" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="152" y="393" font-size="9.5" fill="#334155">中继器 / 集线器 —— 放大、再生信号</text>
  <text x="402" y="393" font-size="9" fill="#64748b">只搬比特，连帧都不看</text>

  <rect x="20" y="414" width="640" height="26" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="32" y="431" font-size="9.5" fill="#92400e"><tspan font-weight="700">只有网关做协议转换</tspan> —— 路由器只转发 IP 分组、不改高层协议；这条是设备归属题的分水岭。</text>
</svg>
