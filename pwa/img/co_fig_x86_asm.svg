<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">相对转移落点 = 取指后 PC + 偏移量 · Q332 逐字节推演</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">jle 共 2 字节（操作码 1 B + 偏移 1 B），偏移 = 0dH，指令首地址 804846cH</text>

  <rect x="36" y="68" width="180" height="58" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="126" y="90" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">804846cH</text>
  <text x="126" y="112" font-size="10" fill="#3b82f6" text-anchor="middle">jle 操作码（1 B）</text>
  <rect x="232" y="68" width="180" height="58" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="322" y="90" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">804846dH</text>
  <text x="322" y="112" font-size="10" fill="#3b82f6" text-anchor="middle">偏移量 0dH（1 B）</text>
  <rect x="428" y="68" width="216" height="58" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="536" y="90" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">804846eH</text>
  <text x="536" y="112" font-size="10" fill="#15803d" text-anchor="middle">下一条指令 = 取指后 PC</text>
  <text x="36" y="148" font-size="11" font-weight="700" fill="#334155">取指后 PC = 804846cH + 2 = 804846eH（取完 2 字节，PC 已指向下一条）</text>
  <text x="36" y="172" font-size="11.5" font-weight="700" fill="#1d4ed8">目标 = 804846eH + 0dH = 804847bH</text>
  <line x1="340" y1="180" x2="340" y2="196" stroke="#b45309" stroke-width="1.6" marker-end="url(#ar1)"/>
  <rect x="190" y="200" width="300" height="38" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="340" y="225" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">804847bH · jle 的跳转目标</text>
  <rect x="36" y="248" width="608" height="30" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="48" y="268" font-size="10.5" fill="#b91c1c">✗ 典型错答：把 0dH 直接加到当前指令首址 804846cH 上（得 8048479H）——偏移永远相对下一条指令。</text>

  <rect x="24" y="288" width="304" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="310" font-size="12" font-weight="700" fill="#334155">栈：push / pop 与 ESP</text>
  <text x="40" y="332" font-size="10" fill="#64748b">栈向低地址方向增长，栈中元素固定 32 位</text>
  <text x="40" y="355" font-size="10.5" fill="#475569">push：ESP ← ESP − 4，再压入 ESP 所指地址</text>
  <text x="40" y="378" font-size="10.5" fill="#475569">pop：先读 ESP 所指内容，再 ESP ← ESP + 4</text>
  <text x="40" y="401" font-size="10.5" fill="#475569">call 压入返回地址；ret 从栈顶弹出并跳转</text>
  <text x="40" y="420" font-size="9.5" fill="#64748b">EIP 相当于 PC，只能经控制流指令间接修改</text>

  <rect x="352" y="288" width="304" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="368" y="310" font-size="12" font-weight="700" fill="#334155">AT&amp;T 格式 vs Intel 格式（表 4.2）</text>
  <text x="368" y="332" font-size="10.5" fill="#475569">AT&amp;T「源，目的」；Intel「目的，源」</text>
  <text x="368" y="355" font-size="10.5" fill="#475569">AT&amp;T 寄存器加 %、立即数加 $，用 () 寻址</text>
  <text x="368" y="378" font-size="10.5" fill="#475569">Intel 用 []、dword ptr 指定长度，后缀 b/w/l</text>
  <text x="368" y="401" font-size="10.5" fill="#475569">lea 取有效地址（不是内存内容）；word 恒 16 位</text>
  <text x="368" y="420" font-size="9.5" fill="#64748b">统考常涉及 Intel 格式；x86 变长编码，操作码常 1 B</text>

  <rect x="24" y="436" width="632" height="30" rx="5" fill="#fef9c3" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="456" font-size="10.5" fill="#854d0e">mov 两操作数不能同为内存；mul 被乘数隐含 eax、结果 edx:eax；div 被除数 edx:eax → 商 eax、余数 edx。</text>
</svg>
