<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="dAsk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7ab8"/></marker>
    <marker id="dAns" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d98b1f"/></marker>
  </defs>
  <rect width="780" height="400" fill="#fbfcfe"/>
  <rect x="0" y="0" width="780" height="36" fill="#4a7ab8"/>
  <text x="16" y="24" fill="#ffffff" font-size="15" font-weight="700">DNS 解析：客户递归 1 条 + 本地 DNS 迭代 3 条（以 www.example.com 为例）</text>

  <rect x="18" y="56" width="128" height="30" rx="5" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="82" y="76" text-anchor="middle" fill="#2c4a6b" font-size="12">客户机</text>
  <rect x="180" y="56" width="140" height="30" rx="5" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="250" y="76" text-anchor="middle" fill="#2c4a6b" font-size="12">本地 DNS 服务器</text>
  <rect x="392" y="56" width="110" height="30" rx="5" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="447" y="76" text-anchor="middle" fill="#2c4a6b" font-size="12">根域名服务器</text>
  <rect x="524" y="56" width="110" height="30" rx="5" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="579" y="76" text-anchor="middle" fill="#2c4a6b" font-size="12">.com 顶级</text>
  <rect x="650" y="56" width="112" height="30" rx="5" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="706" y="76" text-anchor="middle" fill="#2c4a6b" font-size="11.5">example.com 权限</text>

  <g font-size="11.5">
    <line x1="82" y1="104" x2="244" y2="104" stroke="#4a7ab8" stroke-width="2" marker-end="url(#dAsk)"/>
    <text x="163" y="98" text-anchor="middle" fill="#33618f" font-weight="700">① 递归查询</text>
    <text x="163" y="121" text-anchor="middle" fill="#4a5568">「帮我查到底，给我最终 IP」</text>

    <line x1="250" y1="146" x2="441" y2="146" stroke="#4a7ab8" stroke-width="2" marker-end="url(#dAsk)"/>
    <text x="345" y="140" text-anchor="middle" fill="#33618f" font-weight="700">② 迭代：问根</text>
    <line x1="447" y1="162" x2="256" y2="162" stroke="#d98b1f" stroke-width="1.6" marker-end="url(#dAns)"/>
    <text x="345" y="178" text-anchor="middle" fill="#8a6a2a">返 .com 顶级服务器地址（不给最终答案）</text>

    <line x1="250" y1="204" x2="573" y2="204" stroke="#4a7ab8" stroke-width="2" marker-end="url(#dAsk)"/>
    <text x="412" y="198" text-anchor="middle" fill="#33618f" font-weight="700">③ 迭代：问 .com 顶级</text>
    <line x1="579" y1="220" x2="256" y2="220" stroke="#d98b1f" stroke-width="1.6" marker-end="url(#dAns)"/>
    <text x="412" y="236" text-anchor="middle" fill="#8a6a2a">返 example.com 权限服务器地址</text>

    <line x1="250" y1="262" x2="700" y2="262" stroke="#4a7ab8" stroke-width="2" marker-end="url(#dAsk)"/>
    <text x="470" y="256" text-anchor="middle" fill="#33618f" font-weight="700">④ 迭代：问权限服务器</text>
    <line x1="706" y1="278" x2="256" y2="278" stroke="#d98b1f" stroke-width="1.6" marker-end="url(#dAns)"/>
    <text x="470" y="294" text-anchor="middle" fill="#8a6a2a">终于得到 www 的 IP 地址</text>

    <line x1="250" y1="320" x2="88" y2="320" stroke="#d98b1f" stroke-width="2" marker-end="url(#dAns)"/>
    <text x="169" y="314" text-anchor="middle" fill="#b06a12" font-weight="700">⑤ 本地 DNS 回给客户机（递归兑现）</text>
  </g>

  <rect x="18" y="342" width="744" height="46" rx="6" fill="#fff8e8" stroke="#e8d3a0"/>
  <text x="32" y="360" fill="#8a6a2a" font-size="11.5" font-weight="700">计数口径：用户递归 + 本地迭代 → 用户发 1 条、本地发 3 条；用户递归 + 本地递归 → 各 1 条；全迭代最多 4 条。</text>
  <text x="32" y="379" fill="#8a6a2a" font-size="11.5">每级结果按 TTL 缓存：命中缓存可少问甚至 0 次；域名改 IP 后要等 TTL 过期才全网生效。</text>
</svg>
