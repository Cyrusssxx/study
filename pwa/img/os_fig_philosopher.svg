<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 486" width="680" height="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="486" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">哲学家进餐 · 死锁就藏在「每人各拿一根」这个中间状态里</text>
  <text x="20" y="48" font-size="12" fill="#64748b">5 人围圆桌、5 根筷子，进餐必须同时持有左右两根</text>

  <circle cx="150" cy="200" r="82" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="130" y="108" width="40" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="150" y="123" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">P0</text>
  <rect x="212" y="166" width="40" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="232" y="181" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">P1</text>
  <rect x="186" y="266" width="40" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="206" y="281" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">P2</text>
  <rect x="74" y="266" width="40" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="94" y="281" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">P3</text>
  <rect x="48" y="166" width="40" height="22" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="68" y="181" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">P4</text>

  <rect x="172" y="132" width="6" height="30" fill="#fcd34d" stroke="#d97706" stroke-width="0.8"/>
  <rect x="214" y="196" width="6" height="30" fill="#fcd34d" stroke="#d97706" stroke-width="0.8" transform="rotate(72 217 196)"/>
  <rect x="158" y="238" width="6" height="30" fill="#fcd34d" stroke="#d97706" stroke-width="0.8" transform="rotate(144 161 238)"/>
  <rect x="122" y="238" width="6" height="30" fill="#fcd34d" stroke="#d97706" stroke-width="0.8" transform="rotate(216 125 238)"/>
  <rect x="78" y="196" width="6" height="30" fill="#fcd34d" stroke="#d97706" stroke-width="0.8" transform="rotate(288 81 196)"/>
  <text x="185" y="146" font-size="8.5" fill="#92400e">筷1</text>
  <text x="150" y="200" font-size="10" fill="#94a3b8" text-anchor="middle">5 人 5 筷</text>

  <text x="150" y="300" font-size="10" fill="#64748b" text-anchor="middle">哲学家 i：左手筷 i、右手筷 (i+1) mod 5</text>

  <path d="M232 178 L252 190 L252 220" fill="none" stroke="#f87171" stroke-width="1.4" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect x="290" y="70" width="366" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="304" y="92" font-size="11.5" font-weight="700" fill="#991b1b">朴素实现为什么必死锁</text>
  <text x="304" y="114" font-size="10.5" fill="#7f1d1d">P(chop[i]) 成功之后、P(chop[(i+1)%5]) 之前，是一段</text>
  <text x="304" y="132" font-size="10.5" fill="#7f1d1d">「我已占一根、还在等另一根」的<tspan font-weight="700">中间状态</tspan>。</text>
  <text x="304" y="154" font-size="10.5" fill="#7f1d1d">5 人同时饥饿、同时走完第一个 P：每人手里一根，</text>
  <text x="304" y="172" font-size="10.5" fill="#7f1d1d">围成一圈互等右手边 → <tspan font-weight="700">循环等待</tspan>，谁都不放。</text>

  <text x="290" y="216" font-size="11.5" font-weight="700" fill="#334155">三种破法（都冲着「循环等待」去）</text>

  <rect x="290" y="228" width="366" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="302" y="248" font-size="10.5" font-weight="700" fill="#166534">① 限流：设 seat = 4</text>
  <text x="302" y="266" font-size="10" fill="#14532d">最多 4 人同时在「抢筷」，必有一人能凑齐两根先吃完。</text>

  <rect x="290" y="282" width="366" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="302" y="302" font-size="10.5" font-weight="700" fill="#1e40af">② 定序：奇偶拿法相反</text>
  <text x="302" y="320" font-size="10" fill="#1e3a8a">奇数号先左后右、偶数号先右后左。编号最大的那一位拿法反向，环被剪断。</text>

  <rect x="290" y="336" width="366" height="46" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="302" y="356" font-size="10.5" font-weight="700" fill="#92400e">③ 原子化：一次拿两根</text>
  <text x="302" y="374" font-size="10" fill="#92400e">P(mutex) 把「拿两根」包成一个动作，从根上消灭「持一根等一根」的中间状态。</text>

  <text x="20" y="412" font-size="11.5" fill="#334155">三种破法对应<tspan font-weight="700">破坏循环等待条件</tspan>——不是破坏互斥（筷子本就必须互斥）、也不是破坏不可剥夺（筷子不能强行抢走）。</text>
  <text x="20" y="434" font-size="11.5" fill="#334155">seat 的初值是 <tspan font-weight="700">n−1 = 4</tspan> 而不是 5：若设 5 等于没限流；设 4 才是「至少留一个人能吃完再放开」。</text>
  <text x="20" y="456" font-size="11.5" fill="#64748b">注意：限流方案只能防死锁，不保证无饥饿；题目若问「是否存在饥饿」，答案仍可能是有。</text>
</svg>
