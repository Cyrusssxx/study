  <text x="632" y="82" font-size="10.5" fill="#334155" text-anchor="middle">7</text>

  <text x="92"  y="116" font-size="10" fill="#1e40af" text-anchor="middle">1000</text>
  <text x="128" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1001</text>
  <text x="164" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1010</text>
  <text x="200" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1011</text>
  <text x="236" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1100</text>
  <text x="272" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1101</text>
  <text x="308" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1110</text>
  <text x="344" y="116" font-size="10" fill="#1e40af" text-anchor="middle">1111</text>
  <text x="380" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0000</text>
  <text x="416" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0001</text>
  <text x="452" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0010</text>
  <text x="488" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0011</text>
  <text x="524" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0100</text>
  <text x="560" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0101</text>
  <text x="596" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0110</text>
  <text x="632" y="116" font-size="10" fill="#1e40af" text-anchor="middle">0111</text>

  <text x="92"  y="152" font-size="10" fill="#065f46" text-anchor="middle">0000</text>
  <text x="128" y="152" font-size="10" fill="#065f46" text-anchor="middle">0001</text>
  <text x="164" y="152" font-size="10" fill="#065f46" text-anchor="middle">0010</text>
  <text x="200" y="152" font-size="10" fill="#065f46" text-anchor="middle">0011</text>
  <text x="236" y="152" font-size="10" fill="#065f46" text-anchor="middle">0100</text>
  <text x="272" y="152" font-size="10" fill="#065f46" text-anchor="middle">0101</text>
  <text x="308" y="152" font-size="10" fill="#065f46" text-anchor="middle">0110</text>
  <text x="344" y="152" font-size="10" fill="#065f46" text-anchor="middle">0111</text>
  <text x="380" y="152" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">1000</text>
  <text x="416" y="152" font-size="10" fill="#065f46" text-anchor="middle">1001</text>
  <text x="452" y="152" font-size="10" fill="#065f46" text-anchor="middle">1010</text>
  <text x="488" y="152" font-size="10" fill="#065f46" text-anchor="middle">1011</text>
  <text x="524" y="152" font-size="10" fill="#065f46" text-anchor="middle">1100</text>
  <text x="560" y="152" font-size="10" fill="#065f46" text-anchor="middle">1101</text>
  <text x="596" y="152" font-size="10" fill="#065f46" text-anchor="middle">1110</text>
  <text x="632" y="152" font-size="10" fill="#065f46" text-anchor="middle">1111</text>

  <text x="92"  y="188" font-size="10" fill="#92400e" text-anchor="middle">—</text>
  <text x="128" y="188" font-size="10" fill="#92400e" text-anchor="middle">1111</text>
  <text x="164" y="188" font-size="10" fill="#92400e" text-anchor="middle">1110</text>
  <text x="200" y="188" font-size="10" fill="#92400e" text-anchor="middle">1101</text>
  <text x="236" y="188" font-size="10" fill="#92400e" text-anchor="middle">1100</text>
  <text x="272" y="188" font-size="10" fill="#92400e" text-anchor="middle">1011</text>
  <text x="308" y="188" font-size="10" fill="#92400e" text-anchor="middle">1010</text>
  <text x="344" y="188" font-size="10" fill="#92400e" text-anchor="middle">1001</text>
  <text x="380" y="188" font-size="10" fill="#92400e" text-anchor="middle">0000/1000</text>
  <text x="416" y="188" font-size="10" fill="#92400e" text-anchor="middle">0001</text>
  <text x="452" y="188" font-size="10" fill="#92400e" text-anchor="middle">0010</text>
  <text x="488" y="188" font-size="10" fill="#92400e" text-anchor="middle">0011</text>
  <text x="524" y="188" font-size="10" fill="#92400e" text-anchor="middle">0100</text>
  <text x="560" y="188" font-size="10" fill="#92400e" text-anchor="middle">0101</text>
  <text x="596" y="188" font-size="10" fill="#92400e" text-anchor="middle">0110</text>
  <text x="632" y="188" font-size="10" fill="#92400e" text-anchor="middle">0111</text>

  <rect x="80" y="196" width="36" height="14" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <rect x="368" y="196" width="36" height="14" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="98" y="224" font-size="10" fill="#92400e" text-anchor="middle">原码/反码无 -8</text>
  <text x="386" y="224" font-size="10" fill="#92400e" text-anchor="middle">±0 两种编码</text>

  <text x="20" y="252" font-size="12.5" font-weight="700" fill="#334155">四条换算规则</text>
  <rect x="20" y="262" width="320" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="279" font-size="11" fill="#312e81">正数：原码 = 反码 = 补码（符号位都是 0）</text>
  <rect x="20" y="292" width="320" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="309" font-size="11" fill="#312e81">负数原码 → 补码：数值位取反加 1（符号位不动）</text>
  <rect x="20" y="322" width="320" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="339" font-size="11" fill="#312e81">补码 → 移码：只把符号位取反，其余位不动</text>
  <rect x="20" y="352" width="320" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="369" font-size="11" fill="#312e81">已知补码求真值：符号位为 1 时，除符号位外取反加 1 再添负号</text>

  <rect x="356" y="252" width="304" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="370" y="274" font-size="12" font-weight="700" fill="#1e40af">范围与个数（n+1 位，含 1 位符号位）</text>
  <text x="370" y="296" font-size="10.5" fill="#334155">原码 / 反码：−(2ⁿ−1) ~ +(2ⁿ−1)，共 2ⁿ⁺¹−2 个</text>
  <text x="370" y="316" font-size="10.5" fill="#334155">补码 / 移码：−2ⁿ ~ +(2ⁿ−1)，共 2ⁿ⁺¹ 个</text>
  <text x="370" y="338" font-size="10.5" fill="#dc2626">补码多出的那个数就是 −2ⁿ，它没有原码和反码</text>
  <text x="370" y="358" font-size="10.5" fill="#475569">4 位：原码 15 个数，补码 16 个数（−8 独有）</text>
  <text x="370" y="376" font-size="10.5" fill="#475569">移码全 0 = 最小真值、全 1 = 最大真值 → 可直接当无符号数比大小</text>

  <text x="20" y="404" font-size="11.5" fill="#475569">易错：求补码不要「先取反再加 1 到符号位」，符号位必须保持不变；</text>
  <text x="20" y="422" font-size="11.5" fill="#475569">负数补码比较大小看数值位：数值位越小，绝对值越大（负得越多），所以 <tspan font-weight="700">1000 &lt; 1111</tspan> 对应 −8 &lt; −1。</text>
</svg>
