  <text x="380" y="82" font-size="10.5" fill="#334155" text-anchor="middle">0</text>
  <text x="416" y="82" font-size="10.5" fill="#334155" text-anchor="middle">1</text>
  <text x="452" y="82" font-size="10.5" fill="#334155" text-anchor="middle">2</text>
  <text x="488" y="82" font-size="10.5" fill="#334155" text-anchor="middle">3</text>
  <text x="524" y="82" font-size="10.5" fill="#334155" text-anchor="middle">4</text>
  <text x="560" y="82" font-size="10.5" fill="#334155" text-anchor="middle">5</text>
