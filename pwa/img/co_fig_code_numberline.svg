<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="440" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">四种码的对应关系 · 4 位（含符号位）从小到大的 16 个编码</text>
  <text x="20" y="48" font-size="12" fill="#64748b">补码与移码都是 0 唯一、多表示一个最小负数；移码 = 补码符号位取反，便于比较大小</text>

  <text x="20" y="82" font-size="11.5" font-weight="700" fill="#334155">真值</text>
  <text x="20" y="118" font-size="11.5" font-weight="700" fill="#1e40af">补码</text>
  <text x="20" y="154" font-size="11.5" font-weight="700" fill="#065f46">移码</text>
  <text x="20" y="190" font-size="11.5" font-weight="700" fill="#92400e">原码</text>

  <line x1="76" y1="72" x2="76" y2="200" stroke="#e2e8f0" stroke-width="1"/>

