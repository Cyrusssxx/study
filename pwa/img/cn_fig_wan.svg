<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392">
  <rect x="0" y="0" width="680" height="392" fill="#ffffff"/>
  <rect x="20" y="10" width="640" height="26" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="32" y="28" font-size="11" font-weight="700" fill="#1e40af">广域网内部用节点交换机，网络之间才用路由器 —— 两者作用域不同</text>

  <rect x="20" y="46" width="310" height="164" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="30" y="64" font-size="9.6" font-weight="700" fill="#334155">一个广域网（单一的长距离网络）</text>
  <rect x="42" y="82" width="78" height="32" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="81" y="102" font-size="8.5" fill="#1e40af" text-anchor="middle">节点交换机</text>
  <rect x="230" y="82" width="78" height="32" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="269" y="102" font-size="8.5" fill="#1e40af" text-anchor="middle">节点交换机</text>
  <rect x="42" y="158" width="78" height="32" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="81" y="178" font-size="8.5" fill="#1e40af" text-anchor="middle">节点交换机</text>
  <rect x="230" y="158" width="78" height="32" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="269" y="178" font-size="8.5" fill="#1e40af" text-anchor="middle">节点交换机</text>
  <path d="M 120 98 L 230 98" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 81 114 L 81 158" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 269 114 L 269 158" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 120 174 L 230 174" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 118 110 L 232 162" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 118 164 L 232 110" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <rect x="98" y="123" width="154" height="19" fill="#f8fafc"/>
  <text x="175" y="136" font-size="8.1" fill="#475569" text-anchor="middle">网状拓扑 · 冗余路径 · 存储转发</text>
  <text x="175" y="202" font-size="8.2" fill="#1e40af" text-anchor="middle">点对点链路：PPP / HDLC，不用 CSMA/CD</text>

  <rect x="346" y="46" width="314" height="164" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="356" y="64" font-size="9.6" font-weight="700" fill="#334155">互联网：多个网络经路由器互连</text>
  <rect x="362" y="78" width="88" height="38" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="406" y="95" font-size="8.5" fill="#166534" text-anchor="middle">局域网 LAN 1</text>
  <text x="406" y="109" font-size="7.8" fill="#166534" text-anchor="middle">广播介质</text>
  <rect x="556" y="78" width="88" height="38" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="600" y="95" font-size="8.5" fill="#166534" text-anchor="middle">局域网 LAN 2</text>
  <text x="600" y="109" font-size="7.8" fill="#166534" text-anchor="middle">广播介质</text>
  <rect x="460" y="154" width="90" height="38" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="505" y="171" font-size="8.5" fill="#1e40af" text-anchor="middle">广域网 WAN</text>
  <text x="505" y="185" font-size="7.8" fill="#1e40af" text-anchor="middle">节点交换机</text>
  <rect x="362" y="118" width="70" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="397" y="135" font-size="8.4" font-weight="700" fill="#92400e" text-anchor="middle">路由器</text>
  <rect x="578" y="118" width="66" height="26" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="611" y="135" font-size="8.4" font-weight="700" fill="#92400e" text-anchor="middle">路由器</text>
  <path d="M 406 116 L 397 118" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 600 116 L 611 118" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 432 131 L 460 168" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <path d="M 578 131 L 550 168" stroke="#64748b" stroke-width="1.1" fill="none"/>
  <text x="503" y="147" font-size="8.1" fill="#475569" text-anchor="middle">经路由器互连多个网络</text>
  <text x="503" y="204" font-size="8.2" fill="#92400e" text-anchor="middle">局域网经路由器接入广域网 → 覆盖范围更广</text>

  <rect x="20" y="222" width="310" height="76" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="32" y="241" font-size="9.6" font-weight="700" fill="#1e40af">节点交换机</text>
  <text x="32" y="259" font-size="8.7" fill="#1e40af">工作在<tspan font-weight="700">单个网络（WAN）内部</tspan></text>
  <text x="32" y="275" font-size="8.7" fill="#1e40af">转发分组、原理与路由器相似</text>
  <text x="32" y="291" font-size="8.4" fill="#1e40af">广域网由它们及连接链路组成</text>
  <rect x="346" y="222" width="314" height="76" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="358" y="241" font-size="9.6" font-weight="700" fill="#92400e">路由器</text>
  <text x="358" y="259" font-size="8.7" fill="#92400e">用于<tspan font-weight="700">连接多个网络构成互联网</tspan></text>
  <text x="358" y="275" font-size="8.7" fill="#92400e">LAN 与 WAN（或两个 LAN）互连都靠它</text>
  <text x="358" y="291" font-size="8.4" fill="#92400e">二者都转发分组，别把名字混用</text>

  <rect x="20" y="308" width="640" height="74" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="32" y="326" font-size="8.9" fill="#92400e"><tspan font-weight="700">广域网 ≠ 互联网</tspan>：广域网是单一的长距离网络（首要考虑通信容量）；互联网是互连多个网络的系统，通常通过路由器互连。</text>
  <text x="32" y="342" font-size="8.9" fill="#92400e">WAN 用<tspan font-weight="700">分组交换＋存储转发＋网状拓扑</tspan>（冗余路径、可靠性高），不像 LAN 靠广播介质；差异主要不在距离／速率，而在协议与技术。</text>
  <text x="32" y="358" font-size="8.9" fill="#92400e">PPP（点对点协议）与 HDLC（高层数据链路控制）为长距离点对点链路提供服务：一端只有两个站点、无多点争用，<tspan font-weight="700">不使用 CSMA/CD</tspan>。</text>
  <text x="32" y="374" font-size="8.5" fill="#92400e">真题口径：LAN 与 WAN（或两个 LAN）互连用路由器（网络层设备），不是节点交换机，也不是网桥。</text>
</svg>
