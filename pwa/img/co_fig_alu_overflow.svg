<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="aluArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="436" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">运算部件与溢出判别 · 从一位全加器到 ALU</text>
  <text x="20" y="48" font-size="12" fill="#64748b">硬件只做加法；减法靠补码，乘除靠「加法 + 移位」迭代</text>

  <rect x="20" y="66" width="312" height="168" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="88" font-size="13" font-weight="700" fill="#312e81">① 一位全加器 FA</text>
  <rect x="128" y="102" width="112" height="52" rx="7" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="184" y="124" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">FA</text>
  <text x="184" y="142" font-size="10.5" fill="#4f46e5" text-anchor="middle">第 i 位</text>
  <text x="34" y="116" font-size="11" fill="#475569">Aᵢ、Bᵢ</text>
  <text x="34" y="134" font-size="11" fill="#475569">Cᵢₙ（低位进位）</text>
  <line x1="100" y1="112" x2="128" y2="112" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#aluArrow)"/>
  <line x1="100" y1="130" x2="128" y2="130" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#aluArrow)"/>
  <text x="248" y="116" font-size="11" fill="#475569">Sᵢ = A⊕B⊕Cᵢₙ</text>
  <text x="248" y="136" font-size="11" fill="#475569">Cₒᵤₜ = AB+(A⊕B)Cᵢₙ</text>
  <line x1="240" y1="120" x2="246" y2="120" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#aluArrow)"/>
  <line x1="240" y1="140" x2="246" y2="140" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#aluArrow)"/>
  <rect x="34" y="166" width="284" height="54" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="46" y="186" font-size="11.5" fill="#3730a3">n 个 FA 串成行波加法器 → 带标志加法器</text>
  <text x="46" y="206" font-size="11.5" fill="#3730a3">ALU = 带标志加法器 + 移位器 + 多路选择</text>

  <rect x="348" y="66" width="312" height="168" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="362" y="88" font-size="13" font-weight="700" fill="#312e81">② 四个标志位（PSW）</text>
  <text x="362" y="110" font-size="11.5" fill="#475569">OF 溢出标志：仅对有符号数有意义</text>
  <text x="362" y="130" font-size="11.5" fill="#475569">SF 符号标志：结果最高位，仅有符号</text>
  <text x="362" y="150" font-size="11.5" fill="#475569">ZF 零标志：结果为 0，两类数都能用</text>
  <text x="362" y="170" font-size="11.5" fill="#475569">CF 进位/借位：仅对无符号数有意义</text>
  <rect x="362" y="182" width="284" height="38" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="374" y="206" font-size="11" fill="#475569">ALUop 为 k 位 → 可区分 2ᵏ 种运算</text>

  <text x="20" y="262" font-size="13" font-weight="700" fill="#312e81">③ 溢出判别三法（溢出只发生在同号相加 / 异号相减）</text>
  <rect x="20" y="274" width="206" height="96" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="34" y="296" font-size="12" font-weight="700" fill="#991b1b">法一 · 单符号位</text>
  <text x="34" y="316" font-size="11" fill="#7f1d1d">最高数值位进位 Cₛ</text>
  <text x="34" y="334" font-size="11" fill="#7f1d1d">符号位进位 C_f</text>
  <text x="34" y="356" font-size="11.5" font-weight="700" fill="#991b1b">OF = Cₛ ⊕ C_f</text>

  <rect x="236" y="274" width="206" height="96" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="250" y="296" font-size="12" font-weight="700" fill="#92400e">法二 · 双符号位</text>
  <text x="250" y="316" font-size="11" fill="#78350f">00 正、11 负 → 无溢出</text>
  <text x="250" y="334" font-size="11" fill="#78350f">01 正溢、10 负溢</text>
  <text x="250" y="356" font-size="11.5" font-weight="700" fill="#92400e">最高位仍是真符号</text>

  <rect x="452" y="274" width="208" height="96" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="466" y="296" font-size="12" font-weight="700" fill="#065f46">法三 · 操作数符号</text>
  <text x="466" y="316" font-size="11" fill="#064e3b">同号相加结果变号</text>
  <text x="466" y="334" font-size="11" fill="#064e3b">异号相减结果反常</text>
  <text x="466" y="356" font-size="11.5" font-weight="700" fill="#065f46">机器字长有限是根因</text>

  <rect x="20" y="382" width="640" height="42" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="400" font-size="11.5" font-weight="700" fill="#312e81">易错：x−y 用补码加法实现；OF 与 CF 互不代替（有符号看 OF、无符号看 CF），ZF 两类数通用。</text>
  <text x="34" y="418" font-size="11.5" fill="#3730a3">无符号比较 A &gt; B ⟺ ZF=0 且 CF=0；有符号比较大于 ⟺ ZF=0 且 SF⊕OF=0。</text>
</svg>
