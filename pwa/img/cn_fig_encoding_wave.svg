<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 556" width="680" height="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="556" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">三种基带编码波形 · 同一条比特串 0 1 0 0 1 1 0</text>
  <text x="20" y="48" font-size="12" fill="#64748b">一个比特一个码元宽度；虚线是比特分界，竖线中点是每个码元的正中</text>

  <text x="20" y="76" font-size="11.5" fill="#64748b">比特</text>
  <g font-family="Consolas,'Courier New',monospace" font-size="13" text-anchor="middle" fill="#1e3a8a" font-weight="700">
    <text x="158" y="76">0</text><text x="235" y="76">1</text><text x="312" y="76">0</text>
    <text x="389" y="76">0</text><text x="466" y="76">1</text><text x="543" y="76">1</text><text x="620" y="76">0</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="82" x2="120" y2="356"/>
    <line x1="197" y1="82" x2="197" y2="356"/>
    <line x1="274" y1="82" x2="274" y2="356"/>
    <line x1="351" y1="82" x2="351" y2="356"/>
    <line x1="428" y1="82" x2="428" y2="356"/>
    <line x1="505" y1="82" x2="505" y2="356"/>
    <line x1="582" y1="82" x2="582" y2="356"/>
    <line x1="659" y1="82" x2="659" y2="356"/>
  </g>

  <text x="112" y="94" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">NRZ</text>
  <text x="112" y="110" font-size="10" fill="#94a3b8" text-anchor="end">不归零</text>
  <path d="M120 110 H197 V70 H274 V110 H428 V70 H582 V110 H659" fill="none" stroke="#3b5f96" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="664" y="108" font-size="10" fill="#94a3b8">0</text>
  <text x="664" y="74" font-size="10" fill="#94a3b8">1</text>

  <text x="112" y="200" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">曼彻斯特</text>
  <text x="112" y="216" font-size="10" fill="#94a3b8" text-anchor="end">中间必跳变</text>
  <path d="M120 230 H158.5 V190 H197 M197 190 H235.5 V230 H274 M274 230 H312.5 V190 H351 M351 230 H389.5 V190 H428 M428 190 H466.5 V230 H505 M505 190 H543.5 V230 H582 M582 230 H620.5 V190 H659"
        fill="none" stroke="#3b5f96" stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#0f766e" font-size="9.5" text-anchor="middle">
    <text x="145" y="184">低→高</text><text x="222" y="184">高→低</text><text x="299" y="184">低→高</text>
    <text x="376" y="184">低→高</text><text x="453" y="184">高→低</text><text x="530" y="184">高→低</text>
    <text x="607" y="184">低→高</text>
  </g>

  <text x="112" y="310" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">差分曼彻斯特</text>
  <text x="112" y="326" font-size="10" fill="#94a3b8" text-anchor="end">起始跳变=0</text>
  <path d="M120 310 H158.5 V350 H197 M197 350 H235.5 V310 H274 M274 350 H312.5 V310 H351 M351 350 H389.5 V310 H428 M428 310 H466.5 V350 H505 M505 350 H543.5 V310 H582 M582 350 H620.5 V310 H659"
        fill="none" stroke="#3b5f96" stroke-width="2.4" stroke-linejoin="round"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="145" y="304" fill="#b45309" font-weight="700">跳</text>
    <text x="222" y="344" fill="#94a3b8">无</text>
    <text x="299" y="344" fill="#b45309" font-weight="700">跳</text>
    <text x="376" y="344" fill="#b45309" font-weight="700">跳</text>
    <text x="453" y="304" fill="#94a3b8">无</text>
    <text x="530" y="344" fill="#94a3b8">无</text>
    <text x="607" y="344" fill="#b45309" font-weight="700">跳</text>
  </g>
  <text x="20" y="310" font-size="10.5" fill="#b45309">↑ 每位起始</text>
  <text x="20" y="326" font-size="10.5" fill="#b45309">处有无跳变</text>

  <text x="20" y="384" font-size="11.5" fill="#334155">读法：<tspan font-weight="700">NRZ</tspan> 靠电平本身表示数据，一长串 0 或 1 就是一段平线，接收方没有节拍可用。</text>
  <text x="20" y="404" font-size="11.5" fill="#334155"><tspan font-weight="700">曼彻斯特</tspan> 把数据藏进「中间那次跳变的方向」，跳变同时就是时钟 —— 这叫自同步。</text>
  <text x="20" y="424" font-size="11.5" fill="#334155"><tspan font-weight="700">差分曼彻斯特</tspan> 中间跳变只当时钟，数据看「每位起始处跳没跳」：跳 = 0，不跳 = 1。</text>

  <rect x="20" y="442" width="640" height="94" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="462" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="482" font-size="11.5" fill="#7f1d1d">① 后两种的<tspan font-weight="700">码元速率是比特率的 2 倍</tspan>（一个比特切成两个码元），所需带宽也是 NRZ 的 2 倍 —— 自同步的代价。</text>
  <text x="34" y="502" font-size="11.5" fill="#7f1d1d">② 差分曼彻斯特抗干扰靠「看变化」而非「看电平」：把两根线<tspan font-weight="700">接反了照样能解对</tspan>，曼彻斯特则会全错。</text>
  <text x="34" y="522" font-size="11.5" fill="#7f1d1d">③ 曼彻斯特「高→低=1」是可以约定的，题目若反着约定，波形要整体反过来 —— 先看题干约定。</text>
</svg>
