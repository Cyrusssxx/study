<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 584" width="680" height="584" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="584" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">B 树插入 · 满结点分裂与中间关键字上移（5 阶示例）</text>
  <text x="20" y="48" font-size="12" fill="#64748b">m = 5 → 每个结点最多 4 个关键字、5 个孩子；最少 ⌈5/2⌉−1 = 2 个关键字</text>

  <text x="20" y="90" font-size="11" font-weight="700" fill="#1e40af">① 定位</text>
  <text x="20" y="108" font-size="10.5" fill="#64748b">查到最下层</text>
  <text x="20" y="124" font-size="10.5" fill="#64748b">该结点已满</text>

  <rect x="250" y="94" width="110" height="32" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <line x1="305" y1="94" x2="305" y2="126" stroke="#c7d2fe" stroke-width="1"/>
  <text x="277" y="115" font-size="11.5" fill="#312e81" text-anchor="middle">5</text>
  <text x="332" y="115" font-size="11.5" fill="#312e81" text-anchor="middle">35</text>
  <text x="372" y="115" font-size="10" fill="#64748b">父结点</text>

  <line x1="280" y1="154" x2="285" y2="126" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="330" y1="154" x2="320" y2="126" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="180" y="154" width="170" height="32" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.6"/>
  <line x1="222" y1="154" x2="222" y2="186" stroke="#c7d2fe" stroke-width="1"/>
  <line x1="264" y1="154" x2="264" y2="186" stroke="#c7d2fe" stroke-width="1"/>
  <line x1="306" y1="154" x2="306" y2="186" stroke="#c7d2fe" stroke-width="1"/>
  <text x="201" y="175" font-size="11.5" fill="#312e81" text-anchor="middle">10</text>
  <text x="243" y="175" font-size="11.5" fill="#312e81" text-anchor="middle">20</text>
  <text x="285" y="175" font-size="11.5" fill="#312e81" text-anchor="middle">30</text>
  <text x="327" y="175" font-size="11.5" fill="#312e81" text-anchor="middle">40</text>
  <text x="372" y="175" font-size="10" fill="#dc2626">4 = m−1，满了</text>

  <text x="20" y="228" font-size="11" font-weight="700" fill="#9a3412">② 插入 25</text>

  <rect x="160" y="212" width="210" height="32" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="202" y1="212" x2="202" y2="244" stroke="#fdba74" stroke-width="1"/>
  <line x1="244" y1="212" x2="244" y2="244" stroke="#fdba74" stroke-width="1"/>
  <line x1="286" y1="212" x2="286" y2="244" stroke="#fdba74" stroke-width="1"/>
  <line x1="328" y1="212" x2="328" y2="244" stroke="#fdba74" stroke-width="1"/>
  <text x="181" y="233" font-size="11.5" fill="#9a3412" text-anchor="middle">10</text>
  <text x="223" y="233" font-size="11.5" fill="#9a3412" text-anchor="middle">20</text>
  <text x="265" y="233" font-size="11.5" font-weight="700" fill="#9a3412" text-anchor="middle">25</text>
  <text x="307" y="233" font-size="11.5" fill="#9a3412" text-anchor="middle">30</text>
  <text x="349" y="233" font-size="11.5" fill="#9a3412" text-anchor="middle">40</text>
  <text x="392" y="233" font-size="10" fill="#dc2626">5 &gt; 4 溢出 → 必须分裂</text>

  <text x="265" y="268" font-size="11" fill="#c2410c" text-anchor="middle">↓ 取第 ⌈m/2⌉ = 3 个关键字 25 上移</text>

  <text x="20" y="322" font-size="11" font-weight="700" fill="#166534">③ 分裂</text>

  <rect x="240" y="300" width="150" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <line x1="290" y1="300" x2="290" y2="332" stroke="#86efac" stroke-width="1"/>
  <line x1="340" y1="300" x2="340" y2="332" stroke="#86efac" stroke-width="1"/>
  <text x="265" y="321" font-size="11.5" fill="#14532d" text-anchor="middle">5</text>
  <text x="315" y="321" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">25</text>
  <text x="365" y="321" font-size="11.5" fill="#14532d" text-anchor="middle">35</text>
  <text x="410" y="321" font-size="10" fill="#166534">父结点收下 25，仍 ≤ 4 个</text>

  <line x1="255" y1="356" x2="235" y2="386" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="280" y1="356" x2="345" y2="386" stroke="#cbd5e1" stroke-width="1.4"/>

  <rect x="160" y="386" width="100" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <line x1="210" y1="386" x2="210" y2="418" stroke="#bbf7d0" stroke-width="1"/>
  <text x="185" y="407" font-size="11.5" fill="#14532d" text-anchor="middle">10</text>
  <text x="235" y="407" font-size="11.5" fill="#14532d" text-anchor="middle">20</text>

  <rect x="300" y="386" width="100" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <line x1="350" y1="386" x2="350" y2="418" stroke="#bbf7d0" stroke-width="1"/>
  <text x="325" y="407" font-size="11.5" fill="#14532d" text-anchor="middle">30</text>
  <text x="375" y="407" font-size="11.5" fill="#14532d" text-anchor="middle">40</text>

  <text x="160" y="440" font-size="10.5" fill="#475569">左右两半各留 2 个关键字 = ⌈m/2⌉−1，刚好满足下限</text>

  <rect x="392" y="76" width="268" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="404" y="94" font-size="11" font-weight="700" fill="#334155">核心口径</text>
  <text x="404" y="112" font-size="10.5" fill="#475569">上移的永远是<tspan font-weight="700">中间位置</tspan>的关键字，</text>
  <text x="404" y="128" font-size="10.5" fill="#475569">不是最大/最小；分裂后两边「各让一</text>
  <text x="404" y="144" font-size="10.5" fill="#475569">半」，保证谁都不会低于下限。</text>

  <rect x="20" y="456" width="640" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="474" font-size="11.5" font-weight="700" fill="#312e81">容量关系：</text>
  <text x="34" y="492" font-size="11.5" fill="#3730a3">n 个关键字的结点必带 <tspan font-weight="700">n+1</tspan> 个孩子；m 阶 B 树结点关键字数 ⌈m/2⌉−1 ≤ n ≤ m−1（根可少到 1 个），孩子数 2 ~ m。</text>

  <rect x="20" y="510" width="640" height="64" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="528" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="546" font-size="11.5" fill="#7f1d1d">① 分裂会连锁：父结点也满了就继续往上分，一直分到根时树高 +1。</text>
  <text x="34" y="564" font-size="11.5" fill="#7f1d1d">② B+ 树非叶结点分裂只把中间值「复制」到上层、自己仍保留；B 树是「上移」，原结点不再保留。</text>
</svg>
