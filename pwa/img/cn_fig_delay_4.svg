<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 546" width="680" height="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="546" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">时延的四个分量 · 分组 10000 bit 走两条链路（各 1 Mb/s、1000 km）</text>
  <text x="20" y="48" font-size="12" fill="#64748b">发送时延由「数据量 ÷ 带宽」决定；传播时延由「距离 ÷ 电磁波速度」决定 —— 两者互不相干</text>

  <rect x="58" y="72" width="72" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="94" y="97" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">主机 A</text>
  <rect x="304" y="72" width="72" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="340" y="97" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">路由器</text>
  <rect x="550" y="72" width="72" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="586" y="97" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">主机 B</text>

  <line x1="130" y1="92" x2="304" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="376" y1="92" x2="550" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="217" y="86" font-size="10.5" fill="#64748b" text-anchor="middle">链路 1 · 1000 km</text>
  <text x="463" y="86" font-size="10.5" fill="#64748b" text-anchor="middle">链路 2 · 1000 km</text>
  <text x="340" y="128" font-size="10" fill="#94a3b8" text-anchor="middle">处理 + 排队时延（很小，本例忽略）</text>

  <text x="20" y="158" font-size="11.5" font-weight="700" fill="#334155">时间轴（等比）：从 A 开始发送到 B 完整收到，共 30 ms</text>

  <rect x="90" y="176" width="186.7" height="30" fill="#4a7ab8"/>
  <text x="183" y="196" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">发送 10 ms</text>
  <rect x="276.7" y="176" width="93.3" height="30" fill="#6ee7b7"/>
  <text x="323" y="196" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">传播 5 ms</text>
  <rect x="370" y="176" width="186.7" height="30" fill="#4a7ab8"/>
  <text x="463" y="196" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">发送 10 ms</text>
  <rect x="556.7" y="176" width="93.3" height="30" fill="#6ee7b7"/>
  <text x="603" y="196" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700">传播 5 ms</text>

  <g font-size="9.5" fill="#94a3b8" text-anchor="middle">
    <text x="90" y="222">0</text><text x="276.7" y="222">10</text><text x="370" y="222">15</text>
    <text x="556.7" y="222">25</text>
  </g>
  <text x="650" y="222" font-size="9.5" fill="#94a3b8" text-anchor="end">30 ms</text>
  <text x="20" y="222" font-size="10.5" fill="#64748b">时刻</text>

  <text x="20" y="252" font-size="11.5" font-weight="700" fill="#334155">时延带宽积 = 传播时延 × 带宽 ＝ 这条「管道」里能同时容纳多少比特</text>

  <rect x="90" y="272" width="560" height="52" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="102" y1="282" x2="102" y2="314"/><line x1="116" y1="282" x2="116" y2="314"/>
    <line x1="130" y1="282" x2="130" y2="314"/><line x1="144" y1="282" x2="144" y2="314"/>
    <line x1="158" y1="282" x2="158" y2="314"/><line x1="172" y1="282" x2="172" y2="314"/>
    <line x1="186" y1="282" x2="186" y2="314"/><line x1="200" y1="282" x2="200" y2="314"/>
    <line x1="214" y1="282" x2="214" y2="314"/><line x1="228" y1="282" x2="228" y2="314"/>
    <line x1="242" y1="282" x2="242" y2="314"/><line x1="256" y1="282" x2="256" y2="314"/>
    <line x1="270" y1="282" x2="270" y2="314"/><line x1="284" y1="282" x2="284" y2="314"/>
    <line x1="298" y1="282" x2="298" y2="314"/><line x1="312" y1="282" x2="312" y2="314"/>
    <line x1="326" y1="282" x2="326" y2="314"/><line x1="340" y1="282" x2="340" y2="314"/>
    <line x1="354" y1="282" x2="354" y2="314"/><line x1="368" y1="282" x2="368" y2="314"/>
    <line x1="382" y1="282" x2="382" y2="314"/><line x1="396" y1="282" x2="396" y2="314"/>
    <line x1="410" y1="282" x2="410" y2="314"/><line x1="424" y1="282" x2="424" y2="314"/>
    <line x1="438" y1="282" x2="438" y2="314"/><line x1="452" y1="282" x2="452" y2="314"/>
    <line x1="466" y1="282" x2="466" y2="314"/><line x1="480" y1="282" x2="480" y2="314"/>
    <line x1="494" y1="282" x2="494" y2="314"/><line x1="508" y1="282" x2="508" y2="314"/>
    <line x1="522" y1="282" x2="522" y2="314"/><line x1="536" y1="282" x2="536" y2="314"/>
    <line x1="550" y1="282" x2="550" y2="314"/><line x1="564" y1="282" x2="564" y2="314"/>
    <line x1="578" y1="282" x2="578" y2="314"/><line x1="592" y1="282" x2="592" y2="314"/>
    <line x1="606" y1="282" x2="606" y2="314"/><line x1="620" y1="282" x2="620" y2="314"/>
    <line x1="634" y1="282" x2="634" y2="314"/>
  </g>
  <text x="90" y="268" font-size="10" fill="#1e40af">发送端</text>
  <text x="650" y="268" font-size="10" fill="#1e40af" text-anchor="end">接收端</text>
  <text x="370" y="342" font-size="10.5" fill="#1e40af" text-anchor="middle">长 = 传播时延 5 ms ｜ 粗细 = 带宽 1 Mb/s ｜ 竖线 = 正在路上的比特</text>
  <text x="370" y="360" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">容纳量 = 5 ms × 1 Mb/s = 5000 bit（≈ 625 B）</text>

  <text x="20" y="388" font-size="11.5" fill="#334155">这条式子的意义：<tspan font-weight="700">发送方发完最后一个比特时，第一个比特还没到对端</tspan>，中间 5000 bit 全在链路上「飘」。</text>
  <text x="20" y="408" font-size="11.5" fill="#334155">所以链路越长、带宽越大，需要的<tspan font-weight="700">窗口/缓冲区就越大</tspan> —— 这是 TCP 窗口不能设太小的物理原因。</text>

  <rect x="20" y="424" width="640" height="110" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="444" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="464" font-size="11.5" fill="#7f1d1d">① <tspan font-weight="700">提高带宽不能缩短传播时延</tspan>（只缩短发送时延），传播时延只看距离和介质速度。</text>
  <text x="34" y="484" font-size="11.5" fill="#7f1d1d">② 「发送时延 = 数据长度 ÷ 带宽」里的带宽要用 <tspan font-weight="700">b/s</tspan>，不是 B/s；单位换算错一步就全错。</text>
  <text x="34" y="504" font-size="11.5" fill="#7f1d1d">③ 总时延 = 发送 + 传播 + 处理 + 排队，题目说「忽略处理与排队」才可省；RTT ≈ 2 × 单程传播时延。</text>
  <text x="34" y="524" font-size="11.5" fill="#7f1d1d">④ 时延带宽积单位是 <tspan font-weight="700">bit</tspan>（不是 bit/s），它描述的是「容量」不是「速率」。</text>
</svg>
