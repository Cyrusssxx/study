<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" width="680" height="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="mpArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="mpArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="382" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">内存保护与内存共享 · 界地址寄存器先「比」，重定位寄存器后「加」</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">两个寄存器都只能由特权指令装入；共享的前提是这块区域只读、代码可重入</text>

  <!-- 左卡：越界检查 -->
  <rect x="24" y="60" width="316" height="304" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="82" font-size="11" font-weight="700" fill="#1e40af">① 一次访存的检查顺序</text>

  <rect x="40" y="96" width="120" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="100" y="116" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">CPU · 逻辑地址 A</text>
  <rect x="204" y="96" width="120" height="30" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="264" y="116" font-size="10.5" fill="#1e3a8a" text-anchor="middle">界地址寄存器</text>

  <path d="M 100 126 L 100 150" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#mpArrow)"/>
  <rect x="40" y="152" width="284" height="30" rx="4" fill="#fef9c3" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="182" y="172" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">A &lt; 界长 ?（越界检查）</text>

  <path d="M 264 126 L 264 150" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#mpArrow)"/>

  <path d="M 264 182 L 264 190" fill="none" stroke="#dc2626" stroke-width="1.3" marker-end="url(#mpArrowRed)"/>
  <rect x="204" y="192" width="120" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.1"/>
  <text x="264" y="209" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">越界 → 异常中断</text>

  <path d="M 140 182 L 140 224" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#mpArrowGreen)"/>
  <rect x="40" y="226" width="284" height="28" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="182" y="244" font-size="10.5" fill="#166534" text-anchor="middle">＋ 重定位寄存器（基址）</text>

  <path d="M 182 254 L 182 280" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#mpArrow)"/>
  <rect x="40" y="282" width="284" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="182" y="300" font-size="10.5" fill="#334155" text-anchor="middle">物理地址 ＝ 基址 ＋ A → 主存</text>

  <text x="40" y="336" font-size="9" fill="#0f766e">先比后加：越界必须在加法之前拦下</text>
  <text x="40" y="351" font-size="9" fill="#64748b">否则「基址＋A」会落进别的进程</text>

  <!-- 右卡：内存共享 -->
  <rect x="352" y="60" width="304" height="304" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="368" y="82" font-size="11" font-weight="700" fill="#0f172a">② 哪些区域能共享</text>

  <rect x="380" y="96" width="110" height="26" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.1"/>
  <text x="435" y="113" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">进程 P1</text>
  <rect x="520" y="96" width="110" height="26" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.1"/>
  <text x="575" y="113" font-size="10" font-weight="700" fill="#3730a3" text-anchor="middle">进程 P2</text>

  <path d="M 435 122 L 435 146" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#mpArrow)"/>
  <path d="M 575 122 L 575 146" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#mpArrow)"/>

  <rect x="380" y="148" width="250" height="34" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="505" y="164" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">共享代码段（只读 · 可重入 / 纯代码）</text>
  <text x="505" y="177" font-size="9" fill="#166534" text-anchor="middle">多进程共用同一组物理页框</text>

  <rect x="380" y="200" width="110" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="435" y="217" font-size="10" fill="#92400e" text-anchor="middle">私有数据区 P1</text>
  <rect x="520" y="200" width="110" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.1"/>
  <text x="575" y="217" font-size="10" fill="#92400e" text-anchor="middle">私有数据区 P2</text>
  <path d="M 505 182 L 435 198" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 505 182 L 575 198" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="368" y="246" font-size="9.5" fill="#334155">不共享：(160＋40) × 40 ＝ 8000KB</text>
  <text x="368" y="262" font-size="9.5" font-weight="700" fill="#166534">共享：160 ＋ 40 × 40 ＝ 1760KB</text>
  <text x="368" y="282" font-size="9" fill="#64748b">分页：每个进程 40 个共享页表项</text>
  <text x="368" y="298" font-size="9" fill="#64748b">分段：共享代码只占 1 个段表项</text>
  <text x="368" y="322" font-size="9" fill="#b45309">写操作只落在私有数据区</text>
  <text x="368" y="340" font-size="9" fill="#b45309">共享建立在保护允许的权限之上</text>
</svg>
