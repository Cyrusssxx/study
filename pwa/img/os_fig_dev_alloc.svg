<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="436" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">设备分配：SDT → DCT → COCT → CHCT 一条寻访链</text>
  <text x="20" y="46" font-size="11" fill="#64748b">系统里可能有多条通道，一条通道接多个控制器，一个控制器接多台设备——四张表把这条隶属关系钉死。</text>

  <rect x="20" y="64" width="140" height="130" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="90" y="82" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">SDT 系统设备表</text>
  <text x="90" y="96" font-size="8.5" fill="#a16207" text-anchor="middle">全系统只 1 张（全局入口）</text>
  <text x="30" y="114" font-size="8.5" fill="#78350f">· 设备类型</text>
  <text x="30" y="130" font-size="8.5" fill="#78350f">· 设备标识符</text>
  <text x="30" y="146" font-size="8.5" fill="#78350f">· 指向 DCT 的指针</text>
  <text x="30" y="162" font-size="8.5" fill="#78350f">· 驱动程序入口地址</text>
  <text x="30" y="182" font-size="8" fill="#a16207">按「设备类型」找到设备</text>

  <line x1="160" y1="129" x2="178" y2="129" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="186,129 176,124 176,134" fill="#94a3b8"/>
  <text x="173" y="120" font-size="8" fill="#94a3b8" text-anchor="middle">1:N</text>

  <rect x="186" y="64" width="140" height="130" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="256" y="82" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">DCT 设备控制表</text>
  <text x="256" y="96" font-size="8.5" fill="#3b82f6" text-anchor="middle">每台设备 1 张</text>
  <text x="196" y="114" font-size="8.5" fill="#1e3a8a">· 设备类型 / 标识符</text>
  <text x="196" y="130" font-size="8.5" fill="#1e3a8a">· 状态（忙 / 闲）</text>
  <text x="196" y="146" font-size="8.5" fill="#1e3a8a">· 指向 COCT 的指针</text>
  <text x="196" y="162" font-size="8.5" fill="#1e3a8a">· 重复执行次数或时间</text>
  <text x="196" y="178" font-size="8.5" fill="#1e3a8a">· 设备队列队首指针</text>

  <line x1="326" y1="129" x2="344" y2="129" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="352,129 342,124 342,134" fill="#94a3b8"/>
  <text x="339" y="120" font-size="8" fill="#94a3b8" text-anchor="middle">1:N</text>

  <rect x="352" y="64" width="140" height="130" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="422" y="82" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">COCT 控制器控制表</text>
  <text x="422" y="96" font-size="8.5" fill="#16a34a" text-anchor="middle">每个控制器 1 张</text>
  <text x="362" y="114" font-size="8.5" fill="#14532d">· 控制器标识符</text>
  <text x="362" y="130" font-size="8.5" fill="#14532d">· 状态（忙 / 闲）</text>
  <text x="362" y="146" font-size="8.5" fill="#14532d">· 指向 CHCT 的指针</text>
  <text x="362" y="162" font-size="8.5" fill="#14532d">· 控制器队列 队首 / 队尾</text>
  <text x="362" y="178" font-size="8.5" fill="#14532d">· 指向所辖 DCT 的入口</text>

  <line x1="492" y1="129" x2="510" y2="129" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="518,129 508,124 508,134" fill="#94a3b8"/>
  <text x="505" y="120" font-size="8" fill="#94a3b8" text-anchor="middle">1:N</text>

  <rect x="518" y="64" width="142" height="130" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="589" y="82" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">CHCT 通道控制表</text>
  <text x="589" y="96" font-size="8.5" fill="#9333ea" text-anchor="middle">每个通道 1 张</text>
  <text x="528" y="114" font-size="8.5" fill="#581c87">· 通道标识符</text>
  <text x="528" y="130" font-size="8.5" fill="#581c87">· 状态（忙 / 闲）</text>
  <text x="528" y="146" font-size="8.5" fill="#581c87">· 所辖控制器表首址</text>
  <text x="528" y="162" font-size="8.5" fill="#581c87">· 通道队列 队首 / 队尾</text>
  <text x="528" y="178" font-size="8.5" fill="#581c87">· 通道程序首地址</text>

  <line x1="256" y1="194" x2="256" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="186" y="210" width="140" height="34" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="256" y="226" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">设备等待队列</text>
  <text x="256" y="239" font-size="8" fill="#b91c1c" text-anchor="middle">请求该设备的 PCB 链</text>

  <line x1="422" y1="194" x2="422" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="352" y="210" width="140" height="34" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="422" y="226" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">控制器等待队列</text>
  <text x="422" y="239" font-size="8" fill="#b91c1c" text-anchor="middle">抢同一控制器的 PCB</text>

  <line x1="589" y1="194" x2="589" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="518" y="210" width="142" height="34" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="589" y="226" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">通道等待队列</text>
  <text x="589" y="239" font-size="8" fill="#b91c1c" text-anchor="middle">抢同一通道的 PCB</text>

  <rect x="20" y="258" width="640" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="278" font-size="10.5" font-weight="700" fill="#334155">分配流程（独占设备）：一路向右走，任一环忙就挂队等待</text>
  <text x="34" y="296" font-size="9.5" fill="#475569">① 按物理设备名查 SDT 找到 DCT —— 设备忙则挂设备队列，闲则分配设备</text>
  <text x="34" y="312" font-size="9.5" fill="#475569">② 顺着 DCT 指针查 COCT 分控制器 ③ 再顺着 COCT 指针查 CHCT 分通道；三者全部成功才能启动 I/O</text>

  <text x="20" y="342" font-size="10.5" fill="#334155">回收：设备等待队列不空 → 唤醒队首进程并转给它；队列空 → 把 DCT 状态置「闲」，等待下一次请求。</text>

  <rect x="20" y="356" width="640" height="66" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="376" font-size="10.5" fill="#92400e">设备独立性：用户报<tspan font-weight="700">逻辑设备名</tspan>，经 LUT 映射到物理设备；同类设备只要有一台空闲就能分配，全忙才挂公共队列。</text>
  <text x="34" y="396" font-size="10.5" fill="#92400e">独占设备（打印机）→ 静态分配、一次分完、互斥使用，从根上避免死锁；共享设备（磁盘）→ 动态分配，靠调度算法协调。</text>
  <text x="34" y="414" font-size="10.5" fill="#991b1b">安全分配＝发 I/O 后立即阻塞（绝不「请求并保持」）；不安全分配＝可连续请求多台设备，效率高但可能循环等待。</text>
</svg>
