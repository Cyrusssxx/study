<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="424" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">处理完回到哪条指令：故障回 i，自陷/外中断回 i+1，终止不回</text>
  <text x="20" y="46" font-size="11" fill="#64748b">CPU 在第 i 条指令处被打断；处理程序解决后按类别决定返回点——方向记反是本节最常见的错。</text>

  <rect x="96" y="110" width="84" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="138" y="136" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">i − 1</text>
  <rect x="196" y="110" width="84" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="238" y="136" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">第 i 条</text>
  <rect x="296" y="110" width="84" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="338" y="136" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">i + 1</text>
  <line x1="66" y1="164" x2="356" y2="164" stroke="#94a3b8" stroke-width="1.4"/>
  <polygon points="364,164 354,159 354,169" fill="#94a3b8"/>
  <text x="370" y="168" font-size="9" fill="#94a3b8">时间</text>

  <rect x="40" y="196" width="190" height="56" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="215" font-size="10" font-weight="700" fill="#991b1b">故障 Fault</text>
  <text x="52" y="231" font-size="9" fill="#7f1d1d">缺页、除零、溢出、越界、非法操作码</text>
  <text x="52" y="247" font-size="9" font-weight="700" fill="#b91c1c">→ 重新执行第 i 条（回到出事那条指令）</text>
  <path d="M230 224 L238 224 L238 154" fill="none" stroke="#dc2626" stroke-width="1.4"/>
  <polygon points="238,150 233,160 243,160" fill="#dc2626"/>

  <rect x="40" y="260" width="190" height="56" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="52" y="279" font-size="10" font-weight="700" fill="#1e3a8a">自陷 Trap / 外中断</text>
  <text x="52" y="295" font-size="9" fill="#1e40af">系统调用、断点 / 时钟、I/O 完成、DMA 结束</text>
  <text x="52" y="311" font-size="9" font-weight="700" fill="#1d4ed8">→ 返回第 i+1 条（那条指令已经做完了）</text>
  <path d="M230 288 L338 288 L338 154" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <polygon points="338,150 333,160 343,160" fill="#2563eb"/>

  <rect x="40" y="324" width="190" height="56" rx="5" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1"/>
  <text x="52" y="343" font-size="10" font-weight="700" fill="#334155">终止 Abort</text>
  <text x="52" y="359" font-size="9" fill="#475569">控制器出错、存储器校验错</text>
  <text x="52" y="375" font-size="9" font-weight="700" fill="#b91c1c">→ 不返回，终止当前程序</text>
  <path d="M230 352 L520 352" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="524" y1="344" x2="536" y2="360" stroke="#64748b" stroke-width="2"/>
  <line x1="536" y1="344" x2="524" y2="360" stroke="#64748b" stroke-width="2"/>
  <text x="544" y="356" font-size="9.5" font-weight="700" fill="#475569">没有下一条</text>

  <rect x="396" y="84" width="248" height="212" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="408" y="104" font-size="10.5" font-weight="700" fill="#334155">归属速查（选择题判据）</text>
  <text x="408" y="126" font-size="9" fill="#475569">外中断 = 硬件中断，来自 CPU 外部：</text>
  <text x="408" y="140" font-size="9" fill="#475569">　INTR 可屏蔽，改屏蔽字可实现多重中断；</text>
  <text x="408" y="154" font-size="9" fill="#475569">　NMI 不可屏蔽（电源掉电等紧急故障）。</text>
  <text x="408" y="174" font-size="9" fill="#475569">异常 = 内中断，来自指令执行内部：</text>
  <text x="408" y="188" font-size="9" fill="#475569">　故障 / 自陷 / 终止，共三种。</text>
  <text x="408" y="208" font-size="9" font-weight="700" fill="#991b1b">软/硬件划分：故障、自陷 = 软件中断；</text>
  <text x="408" y="222" font-size="9" font-weight="700" fill="#991b1b">外中断、终止 = 硬件中断。</text>
  <text x="408" y="244" font-size="9" fill="#92400e">异常一律不可屏蔽：自陷是“事先安排的”，</text>
  <text x="408" y="258" font-size="9" fill="#92400e">不等于“可屏蔽”——“软”只是来源分类。</text>
  <text x="408" y="280" font-size="9" fill="#64748b">中断向量表存入口地址，由 OS 初始化。</text>

  <text x="40" y="404" font-size="9" fill="#94a3b8">注：缺页处理完要重访原地址，所以回第 i 条；系统调用是程序主动安排的，做完当然接着往下走。</text>
</svg>
