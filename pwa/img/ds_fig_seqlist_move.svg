<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">顺序表的插入 / 删除 · 移动次数到底搬了几个</text>
  <text x="20" y="48" font-size="12" fill="#64748b">n = 8 的顺序表：插入要腾位、删除要补位，移动的永远是「被搬动的元素」</text>

  <text x="20" y="88" font-size="13" font-weight="700" fill="#4338ca">① 在第 4 位插入 x</text>
  <text x="660" y="88" font-size="11.5" fill="#b91c1c" text-anchor="end">后移 n−i+1 = 8−4+1 = 5 个</text>

  <rect x="90" y="96" width="52" height="34" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <rect x="146" y="96" width="52" height="34" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <rect x="202" y="96" width="52" height="34" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <rect x="258" y="96" width="52" height="34" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.6"/>
  <rect x="314" y="96" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="370" y="96" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="426" y="96" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="482" y="96" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="538" y="96" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="116" y="119" font-size="12.5" fill="#15803d" text-anchor="middle">a1</text>
  <text x="172" y="119" font-size="12.5" fill="#15803d" text-anchor="middle">a2</text>
  <text x="228" y="119" font-size="12.5" fill="#15803d" text-anchor="middle">a3</text>
  <text x="284" y="119" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">x</text>
  <text x="340" y="119" font-size="12.5" fill="#b45309" text-anchor="middle">a4</text>
  <text x="396" y="119" font-size="12.5" fill="#b45309" text-anchor="middle">a5</text>
  <text x="452" y="119" font-size="12.5" fill="#b45309" text-anchor="middle">a6</text>
  <text x="508" y="119" font-size="12.5" fill="#b45309" text-anchor="middle">a7</text>
  <text x="564" y="119" font-size="12.5" fill="#b45309" text-anchor="middle">a8</text>

  <path d="M314 136 L314 141 L590 141 L590 136" stroke="#d97706" stroke-width="1.2" fill="none"/>
  <text x="452" y="158" font-size="11" fill="#b45309" text-anchor="middle">这 5 个整体后移一格（共 <tspan font-weight="700">5 次</tspan>移动）</text>

  <text x="20" y="196" font-size="13" font-weight="700" fill="#4338ca">② 删除第 4 个元素（内容就是 x）</text>
  <text x="660" y="196" font-size="11.5" fill="#b91c1c" text-anchor="end">前移 n−i = 8−4 = 4 个</text>

  <rect x="118" y="204" width="52" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
  <rect x="174" y="204" width="52" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
  <rect x="230" y="204" width="52" height="34" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
  <rect x="286" y="204" width="52" height="34" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="342" y="204" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="398" y="204" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="454" y="204" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <rect x="510" y="204" width="52" height="34" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="144" y="227" font-size="12.5" fill="#64748b" text-anchor="middle">a1</text>
  <text x="200" y="227" font-size="12.5" fill="#64748b" text-anchor="middle">a2</text>
  <text x="256" y="227" font-size="12.5" fill="#64748b" text-anchor="middle">a3</text>
  <text x="312" y="227" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">x</text>
  <text x="368" y="227" font-size="12.5" fill="#b45309" text-anchor="middle">a5</text>
  <text x="424" y="227" font-size="12.5" fill="#b45309" text-anchor="middle">a6</text>
  <text x="480" y="227" font-size="12.5" fill="#b45309" text-anchor="middle">a7</text>
  <text x="536" y="227" font-size="12.5" fill="#b45309" text-anchor="middle">a8</text>
  <line x1="298" y1="221" x2="326" y2="221" stroke="#dc2626" stroke-width="1.4"/>

  <path d="M342 244 L342 249 L562 249 L562 244" stroke="#d97706" stroke-width="1.2" fill="none"/>
  <text x="452" y="266" font-size="11" fill="#b45309" text-anchor="middle">这 4 个整体前移一格（共 <tspan font-weight="700">4 次</tspan>移动）</text>

  <rect x="20" y="288" width="318" height="76" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="309" font-size="11.5" font-weight="700" fill="#312e81">插入：E = (1/(n+1)) · Σ(n−i+1) = n/2</text>
  <text x="34" y="329" font-size="11.2" fill="#3730a3">n = 8 时 E = 4；i = 1（表头插入）最坏，要移动 n 次。</text>
  <text x="34" y="349" font-size="11.2" fill="#3730a3">分母是 n+1 —— 插入位置有 1 … n+1 共 n+1 种。</text>

  <rect x="342" y="288" width="318" height="76" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="356" y="309" font-size="11.5" font-weight="700" fill="#166534">删除：E = (1/n) · Σ(n−i) = (n−1)/2</text>
  <text x="356" y="329" font-size="11.2" fill="#14532d">n = 8 时 E = 3.5；i = 1（删表头）最坏，要移动 n−1 次。</text>
  <text x="356" y="349" font-size="11.2" fill="#14532d">分母是 n —— 删除位置只有 1 … n 共 n 种。</text>

  <rect x="20" y="376" width="640" height="66" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="396" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="415" font-size="11.5" fill="#7f1d1d">① 插入分母 n+1、删除分母 n —— 只差 1，是这一节最常错的地方。</text>
  <text x="34" y="433" font-size="11.5" fill="#7f1d1d">② 顺序表插删平均 O(n)，但按位存取是 O(1)；插删一多就该换链表。</text>
</svg>
