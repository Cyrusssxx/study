<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">目录项瘦身：FCB 64 B → 文件名 14 B + inode 号 2 B</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">盘块 1 KB · 640 个目录项 · UNIX 把描述信息移到磁盘 inode 区，目录只留「按名存取」的入口</text>

  <rect x="24" y="62" width="304" height="272" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="176" y="84" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">传统 FCB 目录：目录项 = 完整 FCB</text>
  <text x="176" y="102" font-size="10" fill="#64748b" text-anchor="middle">FCB 64 B/项 · 1 KB 盘块只放得下 16 项</text>
  <rect x="44" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="74" y="137" font-size="9.5" fill="#991b1b" text-anchor="middle">FCB 64B</text>
  <rect x="112" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="142" y="137" font-size="9.5" fill="#991b1b" text-anchor="middle">FCB 64B</text>
  <rect x="180" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="210" y="137" font-size="9.5" fill="#991b1b" text-anchor="middle">FCB 64B</text>
  <rect x="248" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="278" y="137" font-size="9.5" fill="#991b1b" text-anchor="middle">FCB 64B</text>
  <text x="176" y="168" font-size="9.5" fill="#64748b" text-anchor="middle">每块 16 项（图示 4 项）：文件名 + 权限 + 物理地址 + 长度 …</text>
  <text x="44" y="196" font-size="11" font-weight="700" fill="#991b1b">640 项 ÷ 16 项/块 = 40 块</text>
  <text x="44" y="220" font-size="12" font-weight="700" fill="#b91c1c">平均查找要启动磁盘 20 次</text>
  <text x="44" y="248" font-size="10" fill="#475569">查目录时整块读入：文件名不匹配的那些项，</text>
  <text x="44" y="264" font-size="10" fill="#475569">也把物理地址等描述信息白白调进内存 → I/O 浪费。</text>
  <text x="44" y="292" font-size="10" fill="#475569">三类信息：基本信息 / 存取控制信息 / 使用信息。</text>
  <text x="44" y="316" font-size="10.5" font-weight="700" fill="#991b1b">目录项越大 → 每块装得越少 → 查找 I/O 越多</text>

  <rect x="352" y="62" width="304" height="272" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="504" y="84" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">UNIX 目录项分解：文件名 + inode 编号</text>
  <text x="504" y="102" font-size="10" fill="#64748b" text-anchor="middle">目录项仅 16 B（14 B 文件名 + 2 B 索引结点号）</text>
  <rect x="372" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="402" y="130" font-size="9" fill="#1e3a8a" text-anchor="middle">文件名</text>
  <text x="402" y="144" font-size="9" fill="#3b82f6" text-anchor="middle">14 B</text>
  <rect x="440" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="470" y="130" font-size="9" fill="#1e3a8a" text-anchor="middle">inode 号</text>
  <text x="470" y="144" font-size="9" fill="#3b82f6" text-anchor="middle">2 B</text>
  <rect x="508" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="538" y="130" font-size="9" fill="#1e3a8a" text-anchor="middle">文件名</text>
  <text x="538" y="144" font-size="9" fill="#3b82f6" text-anchor="middle">14 B</text>
  <rect x="576" y="114" width="60" height="36" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="606" y="130" font-size="9" fill="#1e3a8a" text-anchor="middle">inode 号</text>
  <text x="606" y="144" font-size="9" fill="#3b82f6" text-anchor="middle">2 B</text>
  <text x="504" y="168" font-size="9.5" fill="#64748b" text-anchor="middle">每块 64 项（图示 2 项），目录文件大幅缩小</text>
  <text x="372" y="196" font-size="11" font-weight="700" fill="#1e40af">640 项 ÷ 64 项/块 = 10 块</text>
  <text x="372" y="220" font-size="12" font-weight="700" fill="#1d4ed8">平均 5 次，降到原来的 1/4</text>
  <text x="372" y="242" font-size="10" fill="#475569">↓ 命中文件名后，才按编号去取描述信息</text>
  <rect x="372" y="252" width="264" height="66" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="504" y="272" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">磁盘 inode 区（集中、持久、每文件唯一）</text>
  <text x="504" y="290" font-size="9.5" fill="#78350f" text-anchor="middle">文件主 / 类型 / 存取权限 / 13 个地址项</text>
  <text x="504" y="306" font-size="9.5" fill="#78350f" text-anchor="middle">文件长度 / 链接计数 / 存取时间</text>

  <rect x="24" y="348" width="632" height="68" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="369" font-size="11.5" font-weight="700" fill="#334155">两种 inode 形态：别把「内存副本」的字段答进磁盘 inode</text>
  <text x="40" y="389" font-size="10" fill="#475569">磁盘 inode：每个文件唯一、持久存放于磁盘 inode 区，文件打开时才载入内存。</text>
  <text x="40" y="407" font-size="10" fill="#475569">内存 inode 多出的五项：索引结点号 / 状态 / 访问计数 / 逻辑设备号 / 链接指针（Q457 考访问计数）。</text>

  <rect x="24" y="424" width="632" height="34" rx="5" fill="#fef9c3" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="445" font-size="10.5" fill="#854d0e">分解的好处是减少「查找文件」的 I/O 信息量（Q460），不是减少读写文件内容的 I/O 量；新建文件不把权限写进目录（Q526）。</text>
</svg>
