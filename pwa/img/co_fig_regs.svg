<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="396" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">CPU 里的寄存器 · 一条线分开「汇编程序员可见」与「不可见」</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">分界只看一件事：汇编指令能不能直接点名读写它 —— 不是看它在 CPU 内部还是外部</text>

  <!-- 左卡：可见 -->
  <rect x="24" y="62" width="312" height="238" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="84" font-size="11" font-weight="700" fill="#1e3a8a">用户可见（指令里能写名字）</text>

  <rect x="40" y="94" width="280" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="52" y="113" font-size="10" fill="#1e40af">通用寄存器组 GPRs —— 存操作数与中间结果</text>

  <rect x="40" y="130" width="280" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="52" y="149" font-size="10" fill="#1e40af">基址寄存器 / 变址寄存器 —— 参与地址计算</text>

  <rect x="40" y="166" width="280" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="52" y="185" font-size="10" fill="#1e40af">堆栈指针 SP —— 指向栈顶</text>

  <rect x="40" y="202" width="280" height="30" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="52" y="221" font-size="10" font-weight="700" fill="#1e3a8a">程序计数器 PC —— 存下一条指令地址</text>

  <rect x="40" y="238" width="280" height="30" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.1"/>
  <text x="52" y="257" font-size="10" fill="#3730a3">标志寄存器 FR —— 只读型，由 ALU 自动生成</text>

  <text x="40" y="286" font-size="9" fill="#1e40af">PC 的值可以用转移 / 调用指令改，所以它算「可见」</text>

  <!-- 右卡：不可见 -->
  <rect x="348" y="62" width="308" height="238" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="84" font-size="11" font-weight="700" fill="#0f172a">用户不可见（CPU 内部中转站）</text>

  <rect x="364" y="94" width="276" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="376" y="113" font-size="10" fill="#334155">IR 指令寄存器 —— 存当前正在执行的指令</text>

  <rect x="364" y="130" width="276" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="376" y="149" font-size="10" fill="#334155">MAR 地址寄存器 —— 存本次访存的地址</text>

  <rect x="364" y="166" width="276" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="376" y="185" font-size="10" fill="#334155">MDR 数据寄存器 —— 存读出 / 写入的数据</text>

  <rect x="364" y="202" width="276" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="376" y="221" font-size="10" fill="#334155">页表基址寄存器、暂存器 Y / Z 等</text>

  <text x="364" y="252" font-size="9" fill="#64748b">对程序员完全透明：程序既看不见、也改不了</text>
  <text x="364" y="270" font-size="9" fill="#64748b">只在 CPU 硬件或 OS 内核（特权态）里用</text>
  <text x="364" y="288" font-size="9" fill="#b45309">易错：IR / MAR / MDR 常常被错答成「可见」</text>

  <!-- 底部四条位宽判据 -->
  <rect x="24" y="312" width="632" height="66" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="40" y="330" font-size="10" font-weight="700" fill="#166534">位宽不是随便给的</text>
  <text x="40" y="348" font-size="9" fill="#166534">MAR 位数决定可寻址空间（2^MAR）；MDR 位数 ＝ 存储字长 —— 两者可以不等宽</text>
  <text x="40" y="364" font-size="9" fill="#166534">机器字长 ＝ ALU 位数 ＝ 通用寄存器宽度（也就是数据通路宽度）</text>
</svg>
