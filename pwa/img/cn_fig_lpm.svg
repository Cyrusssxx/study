<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" width="680" height="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="lpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="412" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">最长前缀匹配 · 目的 128.1.2.3 同时命中三条，走 /32</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">转发的动作只有两步：目的 IP 与每个表项的掩码按位与 → 命中里面取掩码最长的那个</text>

  <!-- 目的地址 -->
  <rect x="24" y="62" width="300" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="40" y="85" font-size="11" font-weight="700" fill="#1e3a8a">分组目的 IP：128.1.2.3</text>
  <text x="336" y="85" font-size="9" fill="#64748b">比 /16、/24、/32 三条</text>

  <!-- 三行表项 -->
  <text x="24" y="118" font-size="9.5" font-weight="700" fill="#334155">路由表（目的网络 / 掩码 / 下一跳）</text>

  <rect x="24" y="126" width="120" height="30" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="84" y="145" font-size="9.5" fill="#334155" text-anchor="middle">128.1.0.0/16</text>
  <rect x="148" y="126" width="120" height="30" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="208" y="145" font-size="9" fill="#475569" text-anchor="middle">255.255.0.0</text>
  <text x="282" y="145" font-size="9" fill="#475569">→ 128.1.0.0 ✓</text>

  <rect x="24" y="162" width="120" height="30" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="84" y="181" font-size="9.5" fill="#1e40af" text-anchor="middle">128.1.2.0/24</text>
  <rect x="148" y="162" width="120" height="30" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="208" y="181" font-size="9" fill="#1e40af" text-anchor="middle">255.255.255.0</text>
  <text x="282" y="181" font-size="9" fill="#1e40af">→ 128.1.2.0 ✓</text>

  <rect x="24" y="198" width="120" height="30" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="84" y="217" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">128.1.2.3/32</text>
  <rect x="148" y="198" width="120" height="30" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
  <text x="208" y="217" font-size="9" fill="#166534" text-anchor="middle">255.255.255.255</text>
  <text x="282" y="217" font-size="9" font-weight="700" fill="#166534">→ 128.1.2.3 ✓</text>

  <!-- 判决 -->
  <path d="M 174 228 L 174 246" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#lpArrow)"/>
  <rect x="24" y="248" width="380" height="30" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="40" y="267" font-size="9.5" font-weight="700" fill="#92400e">三条都命中 → 取掩码最长者：/32 主机路由胜出</text>

  <text x="24" y="296" font-size="9" fill="#64748b">没有 /32 时才退到 /24（/24 仍比 /16 精确）；一个都不命中就走默认路由 0.0.0.0</text>
  <text x="24" y="312" font-size="9" fill="#64748b">所以「越精确越优先」＝前缀越长越优先，不是「先匹配到的优先」</text>

  <!-- 右卡：跨网段两个地址 -->
  <rect x="424" y="106" width="232" height="172" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="126" font-size="10.5" font-weight="700" fill="#0f172a">跨网段时两个地址的归宿</text>
  <text x="440" y="148" font-size="9" fill="#334155">A（192.168.1.2/24）发给</text>
  <text x="440" y="162" font-size="9" fill="#334155">B（192.168.2.2/24）</text>
  <text x="440" y="184" font-size="9" fill="#1e40af">目的 IP：始终是 192.168.2.2</text>
  <text x="440" y="200" font-size="9" fill="#1e40af">A 发出时目的 MAC ＝ 网关接口</text>
  <text x="440" y="216" font-size="9" fill="#b45309">路由器转发时重写帧头：</text>
  <text x="440" y="231" font-size="9" fill="#b45309">源＝本接口 MAC，目的＝B 的 MAC</text>
  <text x="440" y="256" font-size="9" font-weight="700" fill="#0f766e">一句话：IP 不变，MAC 逐跳换</text>

  <!-- 底部判据 -->
  <rect x="24" y="322" width="632" height="62" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="40" y="341" font-size="9.5" font-weight="700" fill="#166534">两个易错</text>
  <text x="40" y="359" font-size="9" fill="#166534">路由器只按目的 IP 转发，不看 MAC 地址；MAC 只在同一条链路上说话</text>
  <text x="40" y="375" font-size="9" fill="#991b1b">路由表项里没有「输出接口」也别慌：题目常只考「谁匹配、走哪条」</text>
</svg>
