<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">CLOCK（NRU）· 访问位为 1 就清位放行，为 0 就当场淘汰</text>
  <text x="20" y="46" font-size="12" fill="#64748b">页框排成一个环、指针循环扫描；改进型再加一个修改位 M</text>

  <circle cx="200" cy="196" r="106" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="170" y="88" width="60" height="34" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="200" y="103" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">页 3</text>
  <text x="200" y="117" font-size="9" fill="#92400e" text-anchor="middle">A=1</text>

  <rect x="272" y="152" width="60" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="302" y="167" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">页 5</text>
  <text x="302" y="181" font-size="9" fill="#64748b" text-anchor="middle">A=0</text>

  <rect x="238" y="248" width="60" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="268" y="263" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">页 8</text>
  <text x="268" y="277" font-size="9" fill="#64748b" text-anchor="middle">A=1</text>

  <rect x="102" y="248" width="60" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="132" y="263" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">页 9</text>
  <text x="132" y="277" font-size="9" fill="#64748b" text-anchor="middle">A=0</text>

  <rect x="68" y="152" width="60" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="98" y="167" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">页 2</text>
  <text x="98" y="181" font-size="9" fill="#64748b" text-anchor="middle">A=1</text>

  <line x1="200" y1="196" x2="200" y2="126" stroke="#4a7ab8" stroke-width="1.6"/>
  <circle cx="200" cy="196" r="4" fill="#4a7ab8"/>
  <text x="208" y="206" font-size="9.5" font-weight="700" fill="#1d4ed8">替换指针</text>

  <text x="200" y="196" font-size="9" fill="#94a3b8" text-anchor="middle" dy="16">循环队列</text>

  <text x="380" y="92" font-size="11.5" font-weight="700" fill="#334155">缺页时指针怎么做</text>
  <rect x="376" y="102" width="284" height="86" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="388" y="122" font-size="10.5" fill="#14532d">看指针所指页的访问位 A：</text>
  <text x="388" y="142" font-size="10.5" font-weight="700" fill="#166534">A = 0 → 直接淘汰，新页装入并置 A=1</text>
  <text x="388" y="162" font-size="10.5" font-weight="700" fill="#1d4ed8">A = 1 → 清 A=0，指针走下一格</text>
  <text x="388" y="180" font-size="10" fill="#64748b">（给一次「第二次机会」，不淘汰）</text>

  <text x="380" y="216" font-size="11.5" font-weight="700" fill="#334155">为什么叫 NRU</text>
  <rect x="376" y="226" width="284" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="388" y="246" font-size="10.5" fill="#1e3a8a">它只用「最近有没有被用过」这一位粗信息，</text>
  <text x="388" y="264" font-size="10.5" fill="#1e3a8a">不像 LRU 要精确的访问时间戳——开销小得多，</text>
  <text x="388" y="280" font-size="10.5" fill="#1e3a8a">效果介于 FIFO 与 LRU 之间。</text>

  <line x1="20" y1="306" x2="660" y2="306" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="328" font-size="11.5" font-weight="700" fill="#334155">改进型 CLOCK：按（A, M）分四类，查的顺序就是淘汰优先级</text>

  <rect x="20" y="338" width="152" height="60" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="96" y="358" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">(A=0, M=0)</text>
  <text x="96" y="376" font-size="10" fill="#14532d" text-anchor="middle">第 1 类 · 最佳淘汰页</text>
  <text x="96" y="392" font-size="9.5" fill="#64748b" text-anchor="middle">没访问过、没改过</text>

  <rect x="184" y="338" width="152" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="260" y="358" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">(A=0, M=1)</text>
  <text x="260" y="376" font-size="10" fill="#1e3a8a" text-anchor="middle">第 2 类 · 次佳</text>
  <text x="260" y="392" font-size="9.5" fill="#64748b" text-anchor="middle">没访问过但要写回</text>

  <rect x="348" y="338" width="152" height="60" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="424" y="358" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">(A=1, M=0)</text>
  <text x="424" y="376" font-size="10" fill="#92400e" text-anchor="middle">第 3 类</text>
  <text x="424" y="392" font-size="9.5" fill="#a16207" text-anchor="middle">访问过、未修改</text>

  <rect x="512" y="338" width="152" height="60" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="588" y="358" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">(A=1, M=1)</text>
  <text x="588" y="376" font-size="10" fill="#7f1d1d" text-anchor="middle">第 4 类 · 最后才动</text>
  <text x="588" y="392" font-size="9.5" fill="#b91c1c" text-anchor="middle">访问过、还要写回</text>

  <rect x="20" y="412" width="644" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="432" font-size="11" font-weight="700" fill="#334155">三轮扫描（第 1 轮不改位、第 2 轮把经过的 A 全清 0、第 3 轮复位重来）</text>
  <text x="34" y="452" font-size="10.5" fill="#475569">淘汰顺序 (0,0) → (0,1) → (1,0) → (1,1)，<tspan font-weight="700">最多 4 轮必能选出</tspan>；</text>
  <text x="34" y="472" font-size="10.5" fill="#475569">优于简单 CLOCK 之处：<tspan font-weight="700">优先淘汰没被修改的页，少一次磁盘写回</tspan>；代价是多轮扫描、算法自身开销变大。</text>
</svg>
