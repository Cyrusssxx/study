<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="faArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">浮点加减五步骤 · 阶码与尾数分开处理</text>
  <text x="20" y="48" font-size="12" fill="#64748b">对阶 → 尾数加减 → 规格化 → 舍入 → 溢出判断，顺序不能换</text>

  <g>
    <rect x="20" y="66" width="120" height="150" rx="9" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="80" y="90" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">① 对阶</text>
    <text x="32" y="114" font-size="11" fill="#78350f">求阶差 ΔE</text>
    <text x="32" y="134" font-size="11" fill="#78350f">小阶向大阶看齐</text>
    <text x="32" y="154" font-size="11" fill="#78350f">尾数右移 ΔE 位</text>
    <text x="32" y="174" font-size="11" fill="#78350f">阶码增大到一致</text>
    <text x="32" y="198" font-size="10.5" fill="#b45309">丢失低位可舍入修正</text>

    <rect x="150" y="66" width="120" height="150" rx="9" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
    <text x="210" y="90" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">② 尾数加减</text>
    <text x="162" y="114" font-size="11" fill="#3730a3">先补回隐藏位 1</text>
    <text x="162" y="134" font-size="11" fill="#3730a3">尾数按补码运算</text>
    <text x="162" y="154" font-size="11" fill="#3730a3">符号单独处理</text>
    <text x="162" y="174" font-size="11" fill="#3730a3">保留保护位</text>
    <text x="162" y="198" font-size="10.5" fill="#4f46e5">右移是逻辑右移补 0</text>

    <rect x="280" y="66" width="120" height="150" rx="9" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="340" y="90" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">③ 规格化</text>
    <text x="292" y="114" font-size="11" fill="#064e3b">尾数溢出 → 右规</text>
    <text x="292" y="134" font-size="11" fill="#064e3b">尾数右移 1 位、阶码 +1</text>
    <text x="292" y="154" font-size="11" fill="#064e3b">高位非 1 → 左规</text>
    <text x="292" y="174" font-size="11" fill="#064e3b">尾数左移、阶码 −1</text>
    <text x="292" y="198" font-size="10.5" fill="#059669">左规可能阶码下溢</text>

    <rect x="410" y="66" width="120" height="150" rx="9" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="470" y="90" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">④ 舍入</text>
    <text x="422" y="114" font-size="11" fill="#7f1d1d">默认就近舍入</text>
    <text x="422" y="134" font-size="11" fill="#7f1d1d">保护位 G / R / S</text>
    <text x="422" y="154" font-size="11" fill="#7f1d1d">0 舍 1 入、恰半取偶</text>
    <text x="422" y="174" font-size="11" fill="#7f1d1d">舍入后可能再右规</text>
    <text x="422" y="198" font-size="10.5" fill="#dc2626">右规 + 舍入可致阶码上溢</text>

    <rect x="540" y="66" width="120" height="150" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="600" y="90" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">⑤ 溢出判断</text>
    <text x="552" y="114" font-size="11" fill="#475569">只看阶码是否越界</text>
    <text x="552" y="134" font-size="11" fill="#475569">上溢 → ∞ / 中断</text>
    <text x="552" y="154" font-size="11" fill="#475569">下溢 → 机器零</text>
    <text x="552" y="174" font-size="11" fill="#475569">尾数溢出不算溢出</text>
    <text x="552" y="198" font-size="10.5" fill="#64748b">对阶不引起阶码上溢</text>
  </g>

  <line x1="142" y1="141" x2="148" y2="141" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#faArrow)"/>
  <line x1="272" y1="141" x2="278" y2="141" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#faArrow)"/>
  <line x1="402" y1="141" x2="408" y2="141" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#faArrow)"/>
  <line x1="532" y1="141" x2="538" y2="141" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#faArrow)"/>

  <rect x="20" y="232" width="640" height="86" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="254" font-size="13" font-weight="700" fill="#312e81">教材例 2.7 思路：x = 10.5，y = −120.625</text>
  <text x="34" y="275" font-size="11.5" fill="#475569">x = 1.0101×2³，y = −1.1110001×2⁶　→　对阶：x 尾数右移 3 位 = 0.0010101×2⁶</text>
  <text x="34" y="294" font-size="11.5" fill="#475569">尾数相减得 −1.1011100×2⁶（已规格化）→ 舍入 → 阶码未越界，结果为 −110.125</text>
  <text x="34" y="311" font-size="11" fill="#94a3b8">注意：对阶时若让大阶向小阶看齐，会丢失高位、精度错误不可逆</text>

  <rect x="20" y="328" width="640" height="76" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="350" font-size="12.5" font-weight="700" fill="#312e81">一句话记住溢出口径</text>
  <text x="34" y="371" font-size="11.5" fill="#3730a3">真正的浮点溢出只发生在阶码：尾数溢出靠右规修正，不叫溢出；左规可能阶码下溢，右规与舍入可能阶码上溢。</text>
  <text x="34" y="391" font-size="11.5" fill="#3730a3">上溢判断看「阶码 +1 后是否越过最大值」：单精度 11111110 → +1 成 11111111，该编码保留给 ∞ / NaN。</text>
</svg>
