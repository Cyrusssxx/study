<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="stA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="490" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">顺序栈的 top 两种约定 · 共享栈判满</text>
  <text x="20" y="48" font-size="12" fill="#64748b">top 初值不同，入栈出栈写法与判空判满条件全都不同 —— 做题先看清题目给的是哪一种</text>

  <text x="20" y="80" font-size="12.5" font-weight="700" fill="#312e81">① top = −1：top 指向栈顶元素（王道教材约定）</text>
  <g>
    <rect x="48" y="94" width="64" height="40" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
    <text x="80" y="119" font-size="12" fill="#065f46" text-anchor="middle">a1</text>
    <rect x="120" y="94" width="64" height="40" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
    <text x="152" y="119" font-size="12" fill="#065f46" text-anchor="middle">a2</text>
    <rect x="192" y="94" width="64" height="40" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.8"/>
    <text x="224" y="119" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">a3</text>
    <rect x="264" y="94" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="336" y="94" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="408" y="94" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="480" y="94" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">0</text>
    <text x="152" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">1</text>
    <text x="224" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">2</text>
    <text x="296" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">3</text>
    <text x="368" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">4</text>
    <text x="440" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">5</text>
    <text x="512" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">6</text>
    <text x="584" y="150" font-size="10" fill="#94a3b8" text-anchor="middle">7</text>
  </g>
  <line x1="224" y1="172" x2="224" y2="140" stroke="#4338ca" stroke-width="1.6" marker-end="url(#stA)"/>
  <text x="232" y="170" font-size="11.5" font-weight="700" fill="#4338ca">top = 2</text>
  <text x="330" y="122" font-size="11" fill="#475569">进栈 <tspan font-weight="700">data[++top] = x</tspan>　出栈 <tspan font-weight="700">x = data[top--]</tspan></text>
  <text x="330" y="142" font-size="11" fill="#475569">空 top == −1　满 top == MaxSize − 1</text>

  <text x="20" y="200" font-size="12.5" font-weight="700" fill="#312e81">② top = 0：top 指向栈顶元素的下一位置（部分教材 / 408 真题里的另一种约定）</text>
  <g>
    <rect x="48" y="214" width="64" height="40" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
    <text x="80" y="239" font-size="12" fill="#065f46" text-anchor="middle">a1</text>
    <rect x="120" y="214" width="64" height="40" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
    <text x="152" y="239" font-size="12" fill="#065f46" text-anchor="middle">a2</text>
    <rect x="192" y="214" width="64" height="40" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
    <text x="224" y="239" font-size="12" fill="#065f46" text-anchor="middle">a3</text>
    <rect x="264" y="214" width="64" height="40" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.8"/>
    <rect x="336" y="214" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="408" y="214" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="480" y="214" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="552" y="214" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  </g>
  <line x1="296" y1="292" x2="296" y2="260" stroke="#4338ca" stroke-width="1.6" marker-end="url(#stA)"/>
  <text x="304" y="288" font-size="11.5" font-weight="700" fill="#4338ca">top = 3</text>
  <text x="400" y="232" font-size="11" fill="#475569">进栈 <tspan font-weight="700">data[top++] = x</tspan></text>
  <text x="400" y="250" font-size="11" fill="#475569">出栈 <tspan font-weight="700">x = data[--top]</tspan></text>
  <text x="400" y="270" font-size="11" fill="#475569">空 top == 0　满 top == MaxSize</text>

  <text x="20" y="322" font-size="12.5" font-weight="700" fill="#312e81">③ 共享栈：两栈栈底固定在数组两端，栈顶向中间生长（判满看「差 1」）</text>
  <g>
    <rect x="48" y="336" width="64" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="80" y="361" font-size="12" fill="#1e40af" text-anchor="middle">b1</text>
    <rect x="120" y="336" width="64" height="40" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="152" y="361" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">b2</text>
    <rect x="192" y="336" width="64" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="224" y="361" font-size="12" fill="#94a3b8" text-anchor="middle">空</text>
    <rect x="264" y="336" width="64" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="296" y="361" font-size="12" fill="#94a3b8" text-anchor="middle">空</text>
    <rect x="336" y="336" width="64" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="368" y="361" font-size="12" fill="#94a3b8" text-anchor="middle">空</text>
    <rect x="408" y="336" width="64" height="40" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="440" y="361" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">c2</text>
    <rect x="480" y="336" width="64" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="512" y="361" font-size="12" fill="#1e40af" text-anchor="middle">c1</text>
  </g>
  <line x1="152" y1="394" x2="152" y2="384" stroke="#2563eb" stroke-width="1.6" marker-end="url(#stA)"/>
  <text x="120" y="412" font-size="11" fill="#2563eb">top0 = 1</text>
  <line x1="440" y1="394" x2="440" y2="384" stroke="#2563eb" stroke-width="1.6" marker-end="url(#stA)"/>
  <text x="408" y="412" font-size="11" fill="#2563eb">top1 = 6</text>
  <text x="490" y="345" font-size="11" fill="#475569">栈满：<tspan font-weight="700">top1 − top0 == 1</tspan></text>
  <text x="490" y="363" font-size="11" fill="#475569">不必事先判断哪边先满</text>
  <text x="300" y="345" font-size="11" fill="#94a3b8">区间 (top0, top1)</text>

  <rect x="20" y="426" width="640" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="446" font-size="11.5" font-weight="700" fill="#312e81">易错：① 别把 ++top 与 top++ 记混 —— 先动指针还是先取值，完全由 top 初值决定；</text>
  <text x="34" y="466" font-size="11.5" fill="#3730a3">② 共享栈判满是「差 1」不是「相等」，两个栈顶相遇前只剩一格即满；链栈不存在栈满（除内存耗尽）。</text>
</svg>
