<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 556" width="680" height="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="556" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">KMP 的 next / nextval · 模式串 T = abaabc</text>
  <text x="20" y="48" font-size="12" fill="#64748b">next[j] 只由模式串自己决定，与主串无关；nextval 是「同字符就别在同一处再比一次」</text>

  <rect x="20" y="88" width="130" height="28" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="20" y="116" width="130" height="28" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="20" y="144" width="130" height="28" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="20" y="172" width="130" height="28" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="20" y="200" width="130" height="28" fill="#e0e7ff" stroke="#e2e8f0"/>
  <rect x="20" y="228" width="130" height="28" fill="#e0e7ff" stroke="#e2e8f0"/>
  <text x="32" y="107" font-size="11.5" fill="#475569">序号 j</text>
  <text x="32" y="135" font-size="11.5" fill="#475569">T[j]</text>
  <text x="32" y="163" font-size="11.5" fill="#475569">j 前面的子串</text>
  <text x="32" y="191" font-size="11.5" fill="#475569">最长相等前后缀</text>
  <text x="32" y="219" font-size="11.5" font-weight="700" fill="#312e81">next[j]</text>
  <text x="32" y="247" font-size="11.5" font-weight="700" fill="#312e81">nextval[j]</text>

  <g stroke="#e2e8f0" fill="none">
    <rect x="156" y="88" width="78" height="28"/><rect x="234" y="88" width="78" height="28"/>
    <rect x="312" y="88" width="78" height="28"/><rect x="390" y="88" width="78" height="28"/>
    <rect x="468" y="88" width="78" height="28"/><rect x="546" y="88" width="78" height="28"/>

    <rect x="156" y="116" width="78" height="28"/><rect x="234" y="116" width="78" height="28"/>
    <rect x="312" y="116" width="78" height="28"/><rect x="390" y="116" width="78" height="28"/>
    <rect x="468" y="116" width="78" height="28"/><rect x="546" y="116" width="78" height="28"/>

    <rect x="156" y="144" width="78" height="28"/><rect x="234" y="144" width="78" height="28"/>
    <rect x="312" y="144" width="78" height="28"/><rect x="390" y="144" width="78" height="28"/>
    <rect x="468" y="144" width="78" height="28"/><rect x="546" y="144" width="78" height="28"/>

    <rect x="156" y="172" width="78" height="28"/><rect x="234" y="172" width="78" height="28"/>
    <rect x="312" y="172" width="78" height="28"/><rect x="390" y="172" width="78" height="28"/>
    <rect x="468" y="172" width="78" height="28"/><rect x="546" y="172" width="78" height="28"/>
  </g>

  <g fill="#eef2ff" stroke="#c7d2fe">
    <rect x="156" y="200" width="78" height="28"/><rect x="234" y="200" width="78" height="28"/>
    <rect x="312" y="200" width="78" height="28"/><rect x="390" y="200" width="78" height="28"/>
    <rect x="468" y="200" width="78" height="28"/><rect x="546" y="200" width="78" height="28"/>
    <rect x="156" y="228" width="78" height="28"/><rect x="234" y="228" width="78" height="28"/>
    <rect x="312" y="228" width="78" height="28"/><rect x="390" y="228" width="78" height="28"/>
    <rect x="468" y="228" width="78" height="28"/><rect x="546" y="228" width="78" height="28"/>
  </g>

  <g font-size="12" fill="#1e293b" text-anchor="middle">
    <text x="195" y="107">1</text><text x="273" y="107">2</text><text x="351" y="107">3</text>
    <text x="429" y="107">4</text><text x="507" y="107">5</text><text x="585" y="107">6</text>

    <text x="195" y="135" font-weight="700">a</text><text x="273" y="135" font-weight="700">b</text>
    <text x="351" y="135" font-weight="700">a</text><text x="429" y="135" font-weight="700">a</text>
    <text x="507" y="135" font-weight="700">b</text><text x="585" y="135" font-weight="700">c</text>

    <text x="195" y="163" fill="#94a3b8">—</text><text x="273" y="163" fill="#64748b">a</text>
    <text x="351" y="163" fill="#64748b">ab</text><text x="429" y="163" fill="#64748b">aba</text>
    <text x="507" y="163" fill="#64748b">abaa</text><text x="585" y="163" fill="#64748b">abaab</text>

    <text x="195" y="191" fill="#94a3b8">0</text><text x="273" y="191" fill="#64748b">0</text>
    <text x="351" y="191" fill="#64748b">0</text><text x="429" y="191" fill="#0f766e">a · 1</text>
    <text x="507" y="191" fill="#0f766e">a · 1</text><text x="585" y="191" fill="#0f766e">ab · 2</text>

    <text x="195" y="219" font-weight="700" fill="#312e81">0</text><text x="273" y="219" font-weight="700" fill="#312e81">1</text>
    <text x="351" y="219" font-weight="700" fill="#312e81">1</text><text x="429" y="219" font-weight="700" fill="#312e81">2</text>
    <text x="507" y="219" font-weight="700" fill="#312e81">2</text><text x="585" y="219" font-weight="700" fill="#312e81">3</text>

    <text x="195" y="247" font-weight="700" fill="#b91c1c">0</text><text x="273" y="247" font-weight="700" fill="#b91c1c">1</text>
    <text x="351" y="247" font-weight="700" fill="#b91c1c">0</text><text x="429" y="247" font-weight="700" fill="#b91c1c">2</text>
    <text x="507" y="247" font-weight="700" fill="#b91c1c">1</text><text x="585" y="247" font-weight="700" fill="#b91c1c">3</text>
  </g>

  <text x="20" y="282" font-size="12.5" font-weight="700" fill="#4338ca">失配了往哪滑 · s = abaaba，T = abaabc</text>

  <text x="20" y="306" font-size="11" fill="#64748b">主串 s</text>
  <g>
    <rect x="100" y="292" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="158" y="292" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="216" y="292" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="274" y="292" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="332" y="292" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="390" y="292" width="54" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="127" y="313" font-size="12.5" fill="#334155" text-anchor="middle">a</text>
    <text x="185" y="313" font-size="12.5" fill="#334155" text-anchor="middle">b</text>
    <text x="243" y="313" font-size="12.5" fill="#334155" text-anchor="middle">a</text>
    <text x="301" y="313" font-size="12.5" fill="#334155" text-anchor="middle">a</text>
    <text x="359" y="313" font-size="12.5" fill="#334155" text-anchor="middle">b</text>
    <text x="417" y="313" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">a</text>
  </g>

  <text x="20" y="352" font-size="11" fill="#64748b">模式 T</text>
  <g>
    <rect x="100" y="338" width="54" height="32" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="158" y="338" width="54" height="32" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="216" y="338" width="54" height="32" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="274" y="338" width="54" height="32" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="332" y="338" width="54" height="32" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="390" y="338" width="54" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="127" y="359" font-size="12.5" fill="#15803d" text-anchor="middle">a</text>
    <text x="185" y="359" font-size="12.5" fill="#15803d" text-anchor="middle">b</text>
    <text x="243" y="359" font-size="12.5" fill="#15803d" text-anchor="middle">a</text>
    <text x="301" y="359" font-size="12.5" fill="#15803d" text-anchor="middle">a</text>
    <text x="359" y="359" font-size="12.5" fill="#15803d" text-anchor="middle">b</text>
    <text x="417" y="359" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">c</text>
  </g>
  <text x="455" y="359" font-size="11" fill="#b91c1c">← 第 6 位 a ≠ c 失配（j = 6）</text>

  <text x="20" y="392" font-size="11.5" fill="#334155">前 5 个都相等、第 6 位 a ≠ c 失配 → <tspan font-weight="700">i 不动</tspan>，只让 j 回退：j = next[6] = 3，模式串右滑 j − next[j] = 3 位。</text>

  <text x="20" y="430" font-size="11" fill="#64748b">模式 T（右滑 3 位后）</text>
  <g>
    <rect x="274" y="416" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="332" y="416" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="390" y="416" width="54" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="448" y="416" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="506" y="416" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="564" y="416" width="54" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="301" y="437" font-size="12.5" fill="#334155" text-anchor="middle">a</text>
    <text x="359" y="437" font-size="12.5" fill="#334155" text-anchor="middle">b</text>
    <text x="417" y="437" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">a</text>
    <text x="475" y="437" font-size="12.5" fill="#334155" text-anchor="middle">a</text>
    <text x="533" y="437" font-size="12.5" fill="#334155" text-anchor="middle">b</text>
    <text x="591" y="437" font-size="12.5" fill="#334155" text-anchor="middle">c</text>
  </g>
  <text x="20" y="466" font-size="11" fill="#15803d">T3 = a 恰好对上 s6 = a，只需 1 次比较就接上，s 的指针全程没回头</text>

  <rect x="20" y="478" width="640" height="68" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="497" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="515" font-size="11.2" fill="#7f1d1d">① 「j 前面的子串」<tspan font-weight="700">不含 T[j] 本身</tspan>；相等前后缀允许重叠（aaaa → 0,1,2,3）。</text>
  <text x="34" y="533" font-size="11.2" fill="#7f1d1d">② 右滑位数是 <tspan font-weight="700">j − next[j]</tspan>，不是 next[j] 本身；下标从 1 起时 next[1] = nextval[1] = 0。</text>
</svg>
