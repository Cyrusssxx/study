<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 588" width="680" height="588" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="588" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">以太网 V2（DIX）MAC 帧 · 字段宽度与帧长边界</text>
  <text x="20" y="48" font-size="12" fill="#64748b">帧长口径只算「目的 MAC ~ FCS」，前面的 8 B 是物理层加的，不计入 64~1518</text>

  <rect x="24" y="92" width="76" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="112" font-size="10" fill="#64748b" text-anchor="middle">7 B</text>
  <text x="62" y="128" font-size="11" fill="#475569" text-anchor="middle">前导码</text>

  <rect x="100" y="92" width="76" height="46" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="138" y="112" font-size="10" fill="#64748b" text-anchor="middle">1 B</text>
  <text x="138" y="128" font-size="11" fill="#475569" text-anchor="middle">SFD</text>

  <rect x="176" y="92" width="88" height="46" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="220" y="112" font-size="10" fill="#4338ca" text-anchor="middle">6 B</text>
  <text x="220" y="128" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">目的 MAC</text>

  <rect x="264" y="92" width="88" height="46" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="308" y="112" font-size="10" fill="#4338ca" text-anchor="middle">6 B</text>
  <text x="308" y="128" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">源 MAC</text>

  <rect x="352" y="92" width="64" height="46" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="384" y="112" font-size="10" fill="#4338ca" text-anchor="middle">2 B</text>
  <text x="384" y="128" font-size="11.5" font-weight="700" fill="#312e81" text-anchor="middle">类型</text>

  <rect x="416" y="92" width="152" height="46" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="492" y="112" font-size="10" fill="#1d4ed8" text-anchor="middle">46 ~ 1500 B</text>
  <text x="492" y="128" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">数据（网络层分组）</text>

  <rect x="568" y="92" width="88" height="46" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.4"/>
  <text x="612" y="112" font-size="10" fill="#b91c1c" text-anchor="middle">4 B</text>
  <text x="612" y="128" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">FCS</text>

  <path d="M100 152 L100 158 L656 158 L656 152" fill="none" stroke="#4338ca" stroke-width="1.2"/>
  <text x="378" y="176" font-size="11" fill="#3730a3" text-anchor="middle">MAC 帧本体 = 6+6+2+46~1500+4 = <tspan font-weight="700">64 ~ 1518 B</tspan></text>
  <text x="62" y="176" font-size="10.5" fill="#94a3b8" text-anchor="middle">不计入帧长</text>

  <text x="24" y="222" font-size="12.5" font-weight="700" fill="#334155">MAC 地址的 48 位怎么读</text>
  <g font-size="11">
    <rect x="24" y="236" width="90" height="40" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
    <text x="69" y="261" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">第 1 字节</text>
    <rect x="114" y="236" width="90" height="40" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="159" y="261" font-size="12" fill="#3730a3" text-anchor="middle">第 2 字节</text>
    <rect x="204" y="236" width="90" height="40" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="249" y="261" font-size="12" fill="#3730a3" text-anchor="middle">第 3 字节</text>
    <rect x="294" y="236" width="90" height="40" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="339" y="261" font-size="12" fill="#3730a3" text-anchor="middle">第 4 字节</text>
    <rect x="384" y="236" width="90" height="40" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="429" y="261" font-size="12" fill="#3730a3" text-anchor="middle">第 5 字节</text>
    <rect x="474" y="236" width="90" height="40" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="519" y="261" font-size="12" fill="#3730a3" text-anchor="middle">第 6 字节</text>
  </g>
  <text x="576" y="248" font-size="10.5" fill="#64748b">共 48 位</text>
  <text x="576" y="264" font-size="10.5" fill="#64748b">12 位十六进制</text>
  <text x="24" y="298" font-size="11" fill="#334155">只看<tspan font-weight="700">第 1 字节的最低位</tspan>：0 = 单播（某个网卡），1 = 组播；全 48 位为 1（FF-FF-FF-FF-FF-FF）= 广播。</text>

  <rect x="20" y="316" width="640" height="72" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="336" font-size="11.5" font-weight="700" fill="#312e81">最小帧 64 B 是被 CSMA/CD 逼出来的</text>
  <text x="34" y="356" font-size="11.5" fill="#3730a3">发送时间必须 ≥ 争用期 2τ，否则冲突信号还没传回来帧就发完了，发送方无从得知已撞车。</text>
  <text x="34" y="376" font-size="11.5" fill="#3730a3">以太网 2τ = 51.2 μs、10 Mb/s → 512 bit = 64 B；数据字段不足 46 B 时<tspan font-weight="700">填充</tspan>补齐。</text>

  <rect x="20" y="400" width="640" height="160" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="420" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="440" font-size="11.5" fill="#7f1d1d">① 前导码 7 B + SFD 1 B 由<tspan font-weight="700">物理层</tspan>加，不属于 MAC 帧，答题算帧长时不能算进去。</text>
  <text x="34" y="460" font-size="11.5" fill="#7f1d1d">② 最大帧 1518 B 不是「1514 + 4」写错：1500 数据 + 6 + 6 + 2 + 4 = 1518；只说 MAC 帧头尾则是 18 B。</text>
  <text x="34" y="480" font-size="11.5" fill="#7f1d1d">③ 「类型/长度」字段在 V2 里是类型（≥ 0x0600 表上层协议），在 802.3 里是长度；</text>
  <text x="34" y="498" font-size="11.5" fill="#7f1d1d">　　0x0800 = IPv4、0x0806 = ARP、0x86DD = IPv6。</text>
  <text x="34" y="518" font-size="11.5" fill="#7f1d1d">④ FCS 只校验、不纠错：校验失败<tspan font-weight="700">直接丢弃</tspan>，链路层不做重传，重传交给上层。</text>
  <text x="34" y="538" font-size="11.5" fill="#7f1d1d">⑤ 交换机在<tspan font-weight="700">全双工</tspan>下不需要 CSMA/CD，所以最小帧长对它没有约束意义。</text>
</svg>
