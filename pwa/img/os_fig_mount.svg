<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#f0f6ff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16.5" font-weight="700" fill="#2c5282">文件系统挂载：把设备文件系统「接」到目录树的挂载点上</text>
  <text x="360" y="49" text-anchor="middle" font-size="11.5" fill="#5a6b80">挂载前 / 挂载后对照 —— 挂载点原有内容被新文件系统根目录遮盖</text>

  <!-- 左：挂载前 -->
  <rect x="20" y="66" width="325" height="212" rx="8" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="182" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5282">挂载前</text>
  <rect x="112" y="99" width="140" height="32" rx="5" fill="#e6f0fb" stroke="#4a90d9"/>
  <text x="182" y="120" text-anchor="middle" font-size="11.5" fill="#2c5282">根目录 /</text>
  <line x1="182" y1="131" x2="182" y2="149" stroke="#718096"/>
  <line x1="78" y1="149" x2="286" y2="149" stroke="#718096"/>
  <line x1="78" y1="149" x2="78" y2="162" stroke="#718096"/>
  <line x1="182" y1="149" x2="182" y2="162" stroke="#718096"/>
  <line x1="286" y1="149" x2="286" y2="162" stroke="#718096"/>
  <rect x="48" y="162" width="60" height="28" rx="4" fill="#f0f4f8" stroke="#a0aec0"/>
  <text x="78" y="181" text-anchor="middle" font-size="10.5" fill="#4a5568">bin</text>
  <rect x="152" y="162" width="60" height="28" rx="4" fill="#fef3c7" stroke="#d69e2e" stroke-width="1.6"/>
  <text x="182" y="181" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a6a00">mnt（空）</text>
  <rect x="256" y="162" width="60" height="28" rx="4" fill="#f0f4f8" stroke="#a0aec0"/>
  <text x="286" y="181" text-anchor="middle" font-size="10.5" fill="#4a5568">etc</text>
  <!-- 待挂载设备框（放在左栏内下方） -->
  <rect x="40" y="206" width="285" height="60" rx="7" fill="#faf5ff" stroke="#805ad5" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="182" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b46c1">磁盘分区 /dev/sdb1（待挂载）</text>
  <text x="182" y="248" text-anchor="middle" font-size="10.5" fill="#805ad5">自带完整目录树，含 file1、file2 …</text>

  <!-- mount 箭头：从设备框指向 mnt -->
  <path d="M182 206 L182 194" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#am)"/>
  <defs><marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#805ad5"/></marker></defs>

  <!-- 右：挂载后 -->
  <rect x="375" y="66" width="325" height="212" rx="8" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="537" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#2c5282">挂载后（挂载点 = /mnt）</text>
  <rect x="467" y="99" width="140" height="30" rx="5" fill="#e6f0fb" stroke="#4a90d9"/>
  <text x="537" y="119" text-anchor="middle" font-size="11.5" fill="#2c5282">根目录 /</text>
  <line x1="537" y1="129" x2="537" y2="145" stroke="#718096"/>
  <line x1="440" y1="145" x2="634" y2="145" stroke="#718096"/>
  <line x1="440" y1="145" x2="440" y2="158" stroke="#718096"/>
  <line x1="634" y1="145" x2="634" y2="158" stroke="#718096"/>
  <rect x="410" y="158" width="60" height="26" rx="4" fill="#f0f4f8" stroke="#a0aec0"/>
  <text x="440" y="176" text-anchor="middle" font-size="10.5" fill="#4a5568">bin</text>
  <rect x="604" y="158" width="60" height="26" rx="4" fill="#f0f4f8" stroke="#a0aec0"/>
  <text x="634" y="176" text-anchor="middle" font-size="10.5" fill="#4a5568">etc</text>
  <!-- 挂载后的文件系统（在 mnt 位置，紫色） -->
  <rect x="440" y="196" width="194" height="62" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/>
  <text x="537" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#6b46c1">/mnt → sdb1 的根</text>
  <text x="537" y="234" text-anchor="middle" font-size="10" fill="#805ad5">原 /mnt 内容被遮盖</text>
  <text x="537" y="250" text-anchor="middle" font-size="10" fill="#805ad5">内含 file1、file2 …</text>

  <!-- 两句必背（单独横条） -->
  <rect x="20" y="290" width="680" height="66" rx="8" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="36" y="312" font-size="12" font-weight="700" fill="#9a6a00">两句必背（选择陷阱）</text>
  <text x="36" y="334" font-size="11.5" fill="#7a5a00">① 同一个设备可挂到多个不同挂载点（一挂多）　② 同一挂载点同一时刻只能挂一个设备（一点一挂）</text>
  <text x="36" y="351" font-size="10.5" fill="#9a7a2a">挂载点 = 父目录 与 新文件系统根目录 的连接点；访问 /mnt 即访问该设备文件系统。</text>

  <!-- 底部 -->
  <rect x="20" y="368" width="680" height="88" rx="8" fill="#2c5282"/>
  <text x="36" y="392" font-size="12" font-weight="700" fill="#fff">Windows：驱动器号 C:、D: 标识分区，每个分区独立目录树 + 一个已挂载文件系统。</text>
  <text x="36" y="414" font-size="12" font-weight="700" fill="#fff">UNIX：单一根文件系统由内核启动时直接挂载，其余文件系统都必须挂到根下某目录（挂载点）。</text>
  <text x="36" y="436" font-size="12" font-weight="700" fill="#fff">挂载后挂载点目录原有内容被遮盖（隐藏），卸载（unmount）后才重新可见。</text>
</svg>
