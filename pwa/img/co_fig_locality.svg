<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 492" width="680" height="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="lcA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="lcB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="492" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">局部性原理：访问顺序决定命中，块不是越大越好</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">同一个二维数组，按行走与按列走的空间局部性差一个数量级</text>

  <rect x="24" y="62" width="316" height="272" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="182" y="84" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">按行访问 vs 按列访问（一行 = 8192 字节）</text>

  <rect x="56" y="100" width="176" height="26" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="56" y="142" width="176" height="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="56" y="184" width="176" height="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="56" y="226" width="176" height="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="100" y1="100" x2="100" y2="252" stroke="#93c5fd" stroke-width="1"/>
  <line x1="144" y1="100" x2="144" y2="252" stroke="#93c5fd" stroke-width="1"/>
  <line x1="188" y1="100" x2="188" y2="252" stroke="#93c5fd" stroke-width="1"/>
  <text x="240" y="107" font-size="9.5" fill="#475569">行 0</text>
  <text x="240" y="149" font-size="9.5" fill="#475569">行 1（+8192B）</text>
  <text x="240" y="191" font-size="9.5" fill="#475569">行 2</text>
  <text x="240" y="233" font-size="9.5" fill="#475569">行 3</text>

  <path d="M 62 113 L 222 113" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#lcA)"/>
  <text x="56" y="276" font-size="10.5" font-weight="700" fill="#1d4ed8">按行：4 个元素挤在同一块，只缺 1 次</text>
  <text x="56" y="292" font-size="9.5" fill="#475569">a[0][0]→a[0][1]→… 地址连续，块内一次搬齐</text>

  <path d="M 122 132 L 122 224" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#lcB)"/>
  <text x="56" y="312" font-size="10.5" font-weight="700" fill="#b91c1c">按列：每次跨 8192B，每次都可能未命中</text>
  <text x="56" y="328" font-size="9.5" fill="#475569">交换单位小于行大小 → 空间局部性极差</text>

  <rect x="348" y="62" width="308" height="272" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="502" y="84" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">Cache 容量固定：块大小与命中率</text>
  <line x1="390" y1="286" x2="636" y2="286" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="390" y1="286" x2="390" y2="106" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="628" y="302" font-size="9.5" fill="#64748b" text-anchor="end">块大小</text>
  <text x="384" y="104" font-size="9.5" fill="#64748b" text-anchor="end">命中率</text>
  <path d="M 396 274 C 424 196 446 142 486 132 C 526 124 566 168 626 258" fill="none" stroke="#15803d" stroke-width="2.4"/>
  <circle cx="486" cy="132" r="4" fill="#15803d"/>
  <line x1="486" y1="132" x2="486" y2="286" stroke="#86efac" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="486" y="122" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">峰值</text>
  <line x1="432" y1="130" x2="440" y2="210" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="394" y="110" font-size="9.5" fill="#475569">太小：</text>
  <text x="394" y="124" font-size="9.5" fill="#475569">每块只带回一点</text>
  <line x1="588" y1="136" x2="592" y2="200" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="550" y="112" font-size="9.5" fill="#b91c1c">太大：块数变少</text>
  <text x="550" y="126" font-size="9.5" fill="#b91c1c">挤掉有用块</text>
  <text x="372" y="318" font-size="10.5" font-weight="700" fill="#166534">先升后降 —— 存在最优点，不是单调递增</text>

  <rect x="24" y="348" width="632" height="120" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="40" y="370" font-size="11" font-weight="700" fill="#854d0e">两类局部性：看「重复」还是看「相邻」</text>
  <text x="40" y="392" font-size="10.5" fill="#334155"><tspan font-weight="700">时间局部性</tspan>：刚访问的很快再访问 —— 循环变量 i、累加器 sum 每轮都用（Q229、Q255）</text>
  <text x="40" y="412" font-size="10.5" fill="#334155"><tspan font-weight="700">空间局部性</tspan>：访问了某单元，邻近单元也被访问 —— 数组按序访问、指令顺序执行</text>
  <text x="40" y="434" font-size="10.5" fill="#b91c1c"><tspan font-weight="700">反向考点</tspan>：数组元素各访问一次 → 时间局部性差；块过大反而降命中率（Q232、Q248）</text>
  <text x="40" y="456" font-size="9.5" fill="#64748b">指令的空间局部性优于数据：取指天然顺序；Cache 设计正是同时利用这两条性质</text>
</svg>
