<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 528" width="680" height="528" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="528" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">IPv4 首部 20 字节定长部分 · 按 32 位一行排（每格宽度正比于位数）</text>
  <text x="20" y="48" font-size="12" fill="#64748b">背下来的顺序：版本长度服务总长 → 标识标志偏移 → 生存协议校验和 → 源 IP → 目的 IP</text>

  <text x="40" y="76" font-size="9.5" fill="#94a3b8">0</text>
  <text x="190" y="76" font-size="9.5" fill="#94a3b8" text-anchor="middle">8</text>
  <text x="340" y="76" font-size="9.5" fill="#94a3b8" text-anchor="middle">16</text>
  <text x="490" y="76" font-size="9.5" fill="#94a3b8" text-anchor="middle">24</text>
  <text x="640" y="76" font-size="9.5" fill="#94a3b8" text-anchor="end">31</text>
  <line x1="40" y1="82" x2="640" y2="82" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="40" y="88" width="75" height="42" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="77" y="106" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">版本</text>
  <text x="77" y="122" font-size="9" fill="#3730a3" text-anchor="middle">4 = IPv4</text>

  <rect x="115" y="88" width="75" height="42" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="152" y="106" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">首部长度</text>
  <text x="152" y="122" font-size="9" fill="#3730a3" text-anchor="middle">单位 4 B</text>

  <rect x="190" y="88" width="150" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="265" y="106" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">区分服务</text>
  <text x="265" y="122" font-size="9" fill="#64748b" text-anchor="middle">QoS 用，一般全 0</text>

  <rect x="340" y="88" width="300" height="42" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="490" y="106" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">总长度</text>
  <text x="490" y="122" font-size="9" fill="#3730a3" text-anchor="middle">单位 1 B，首部 + 数据，上限 65535 B</text>

  <rect x="40" y="133" width="300" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="151" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">标识</text>
  <text x="190" y="167" font-size="9" fill="#64748b" text-anchor="middle">同一报文的所有分片此值相同</text>

  <rect x="340" y="133" width="56.25" height="42" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="368" y="151" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">标志</text>
  <text x="368" y="167" font-size="8.5" fill="#92400e" text-anchor="middle">DF MF</text>

  <rect x="396.25" y="133" width="243.75" height="42" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="518" y="151" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">片偏移</text>
  <text x="518" y="167" font-size="9" fill="#92400e" text-anchor="middle">单位 8 B，指该片数据在原报文中的位置</text>

  <rect x="40" y="178" width="150" height="42" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="115" y="196" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">生存时间 TTL</text>
  <text x="115" y="212" font-size="9" fill="#3730a3" text-anchor="middle">每跳减 1，0 则丢弃</text>

  <rect x="190" y="178" width="150" height="42" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="265" y="196" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">协议</text>
  <text x="265" y="212" font-size="9" fill="#3730a3" text-anchor="middle">6=TCP 17=UDP 1=ICMP</text>

  <rect x="340" y="178" width="300" height="42" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="490" y="196" font-size="10.5" font-weight="700" fill="#312e81" text-anchor="middle">首部校验和</text>
  <text x="490" y="212" font-size="9" fill="#3730a3" text-anchor="middle">只校验首部，每经过一跳都要重算</text>

  <rect x="40" y="223" width="600" height="42" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="340" y="241" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">源 IP 地址（32 位）</text>
  <text x="340" y="257" font-size="9" fill="#14532d" text-anchor="middle">全程不变（除非用 NAT / 源路由）</text>

  <rect x="40" y="268" width="600" height="42" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="340" y="286" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">目的 IP 地址（32 位）</text>
  <text x="340" y="302" font-size="9" fill="#14532d" text-anchor="middle">路由器只按它查表转发，不看端口</text>

  <text x="40" y="332" font-size="11" fill="#64748b">定长 20 B ＝ 5 行 × 32 位；带选项时最长 60 B，此时「首部长度」字段填 15（15 × 4 = 60）。</text>

  <text x="20" y="362" font-size="11.5" fill="#334155">四个字段<tspan font-weight="700">各有各的计量单位</tspan>，这是本章最高频的失分点：首部长度按 4 B 计、总长度按 1 B 计、</text>
  <text x="20" y="382" font-size="11.5" fill="#334155">片偏移按 8 B 计。同一道题里出现三个数，先问自己「这个数是按什么单位存的」。</text>

  <rect x="20" y="398" width="640" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="418" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="438" font-size="11.5" fill="#7f1d1d">① 首部长度的<tspan font-weight="700">最小值是 5</tspan>（不是 20）——字段里存的是「多少个 4 字节」，问字节数要乘 4。</text>
  <text x="34" y="458" font-size="11.5" fill="#7f1d1d">② TTL 现在实际是<tspan font-weight="700">跳数</tspan>不是秒；它防止的是环路，不是「报文过期」。</text>
  <text x="34" y="478" font-size="11.5" fill="#7f1d1d">③ 首部校验和<tspan font-weight="700">只覆盖首部</tspan>，数据部分错了靠上层（TCP/UDP 校验和）发现，两者不重复。</text>
  <text x="34" y="498" font-size="11.5" fill="#7f1d1d">④ 标志位是 3 位：最高位保留、DF=1 禁止分片、MF=1 表示后面还有片；<tspan font-weight="700">末片 MF=0</tspan>。</text>
</svg>
