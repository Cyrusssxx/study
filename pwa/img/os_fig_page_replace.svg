  <rect x="20" y="396" width="640" height="58" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="416" font-size="10.5" fill="#92400e">① 第 1～3 次访问是<tspan font-weight="700">装入缺页</tspan>（帧还空着），不算置换；<tspan font-weight="700">置换次数 = 缺页次数 − 帧数</tspan>，10−3=7、9−3=6、7−3=4。</text>
  <text x="34" y="436" font-size="10.5" fill="#92400e">② 教材第 5 次 LRU 与 OPT 结果相同只是巧合，<tspan font-weight="700">两个算法没有必然联系</tspan>——LRU 看过去，OPT 看未来。</text>
