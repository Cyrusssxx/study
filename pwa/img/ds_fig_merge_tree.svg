<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" width="800" height="544" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="800" height="544" fill="#fbfcfe"/>

  <text x="24" y="28" font-size="14.5" font-weight="700" fill="#2c4a6b">最佳归并树：先补虚段凑成严格 k 叉树，再按「每次取最小的 k 个」自底向上合并</text>
  <text x="24" y="48" font-size="10.5" fill="#6b7a8d">例：6 个初始段，权值 2,3,4,5,6,7，做 <tspan font-family="Consolas,monospace" font-weight="700">k=3</tspan> 路归并</text>

  <!-- 补虚段说明 -->
  <rect x="24" y="58" width="752" height="40" rx="3" fill="#fdf3e5" stroke="#e5c8a2"/>
  <text x="38" y="74" font-size="10.5" fill="#8a6d3b">① 判满叉：(r−1) mod (k−1) = (6−1) mod 2 = <tspan font-weight="700">1 ≠ 0</tspan> → 补 (k−1) − 1 = <tspan font-weight="700">1 个虚段（权 0）</tspan></text>
  <text x="38" y="91" font-size="10.5" fill="#8a6d3b">② 于是 6+1 = <tspan font-weight="700">7 个叶</tspan>，三叉树内部结点数 = (7−1)/(3−1) = 3，恰好严格三叉（每个内部结点都有 3 个孩子）</text>

  <!-- ===== 树 ===== -->
  <text x="180" y="134" text-anchor="end" font-size="9" fill="#adb8c4">深度 0</text>
  <text x="180" y="209" text-anchor="end" font-size="9" fill="#adb8c4">深度 1</text>
  <text x="180" y="284" text-anchor="end" font-size="9" fill="#adb8c4">深度 2</text>
  <text x="180" y="359" text-anchor="end" font-size="9" fill="#adb8c4">深度 3</text>

  <!-- 连线 -->
  <path d="M450 147L290 188 M450 147L450 188 M450 147L610 188" stroke="#8fa8c4" stroke-width="1.2" fill="none"/>
  <path d="M610 222L550 263 M610 222L610 263 M610 222L670 263" stroke="#8fa8c4" stroke-width="1.2" fill="none"/>
  <path d="M670 297L630 338 M670 297L670 338 M670 297L710 338" stroke="#8fa8c4" stroke-width="1.2" fill="none"/>

  <!-- 根 -->
  <circle cx="450" cy="130" r="17" fill="#fdf3e5" stroke="#d9822b" stroke-width="1.6"/>
  <text x="450" y="135" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a55a12">27</text>

  <!-- 深度 1 -->
  <circle cx="290" cy="205" r="17" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="290" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">6</text>

  <circle cx="450" cy="205" r="17" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="450" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">7</text>

  <circle cx="610" cy="205" r="17" fill="#fdf3e5" stroke="#d9822b" stroke-width="1.6"/>
  <text x="610" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a55a12">14</text>

  <!-- 深度 2 -->
  <circle cx="550" cy="280" r="17" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="550" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">4</text>

  <circle cx="610" cy="280" r="17" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="610" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">5</text>

  <circle cx="670" cy="280" r="17" fill="#fdf3e5" stroke="#d9822b" stroke-width="1.6"/>
  <text x="670" y="285" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a55a12">5</text>

  <!-- 深度 3（含虚段） -->
  <circle cx="630" cy="355" r="17" fill="#fbfcfe" stroke="#adb8c4" stroke-width="1.3" stroke-dasharray="3 2.5"/>
  <text x="630" y="360" text-anchor="middle" font-size="10.5" fill="#8b98a8">0</text>
  <text x="630" y="381" text-anchor="middle" font-size="8.5" fill="#adb8c4">虚段</text>

  <circle cx="670" cy="355" r="17" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="670" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">2</text>

  <circle cx="710" cy="355" r="17" fill="#eef4fb" stroke="#4a7ab8" stroke-width="1.4"/>
  <text x="710" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#2c4a6b">3</text>

  <text x="790" y="140" text-anchor="end" font-size="9" fill="#adb8c4">橙＝内部结点（两段合并后的长度）</text>
  <text x="790" y="156" text-anchor="end" font-size="9" fill="#adb8c4">蓝＝初始段　虚线＝补的虚段</text>

  <!-- ===== 底部：WPL 表 ===== -->
  <text x="24" y="404" font-size="10" fill="#8b98a8">WPL（= 总读写记录次数）＝ 各叶权 × 所在深度，逐项累加</text>

  <rect x="24" y="412" width="408" height="26" fill="#e6eef8" stroke="#c9d9ec"/>
  <text x="54" y="429" font-size="10" font-weight="700" fill="#2c4a6b">叶权</text>
  <text x="108" y="429" text-anchor="middle" font-size="10.5" fill="#2c4a6b">6</text>
  <text x="156" y="429" text-anchor="middle" font-size="10.5" fill="#2c4a6b">7</text>
  <text x="204" y="429" text-anchor="middle" font-size="10.5" fill="#2c4a6b">4</text>
  <text x="252" y="429" text-anchor="middle" font-size="10.5" fill="#2c4a6b">5</text>
  <text x="300" y="429" text-anchor="middle" font-size="10.5" fill="#8b98a8">0</text>
  <text x="348" y="429" text-anchor="middle" font-size="10.5" fill="#2c4a6b">2</text>
  <text x="396" y="429" text-anchor="middle" font-size="10.5" fill="#2c4a6b">3</text>

  <rect x="24" y="438" width="408" height="24" fill="#fbfcfe" stroke="#dce4ee"/>
  <text x="54" y="454" font-size="10" fill="#4a5568">深度</text>
  <text x="108" y="454" text-anchor="middle" font-size="10.5" fill="#4a5568">1</text>
  <text x="156" y="454" text-anchor="middle" font-size="10.5" fill="#4a5568">1</text>
  <text x="204" y="454" text-anchor="middle" font-size="10.5" fill="#4a5568">2</text>
  <text x="252" y="454" text-anchor="middle" font-size="10.5" fill="#4a5568">2</text>
  <text x="300" y="454" text-anchor="middle" font-size="10.5" fill="#8b98a8">3</text>
  <text x="348" y="454" text-anchor="middle" font-size="10.5" fill="#4a5568">3</text>
  <text x="396" y="454" text-anchor="middle" font-size="10.5" fill="#4a5568">3</text>

  <rect x="24" y="462" width="408" height="24" fill="#fbfcfe" stroke="#dce4ee"/>
  <text x="54" y="478" font-size="10" fill="#4a5568">贡献</text>
  <text x="108" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2691a">6</text>
  <text x="156" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2691a">7</text>
  <text x="204" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2691a">8</text>
  <text x="252" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2691a">10</text>
  <text x="300" y="478" text-anchor="middle" font-size="10.5" fill="#8b98a8">0</text>
  <text x="348" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2691a">6</text>
  <text x="396" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c2691a">9</text>

  <!-- 结论 -->
  <rect x="444" y="412" width="332" height="90" rx="4" fill="#eef4fb" stroke="#c9d9ec"/>
  <rect x="444" y="412" width="4" height="90" fill="#4a7ab8"/>
  <text x="458" y="432" font-size="11.5" font-weight="700" fill="#2c4a6b">WPL = 6+7+8+10+0+6+9 = 46</text>
  <text x="458" y="452" font-size="10" fill="#2c4a6b">虚段权为 0，拉低了它那一支的代价，</text>
  <text x="458" y="468" font-size="10" fill="#2c4a6b">但保证树是严格三叉 —— 归并时每一步</text>
  <text x="458" y="484" font-size="10" fill="#2c4a6b">都能凑满 k 个段，不会出现「只剩 2 个」。</text>

  <text x="24" y="518" font-size="10" fill="#8b98a8">对照：若不做最佳归并树、按段号顺序归并，长段会被反复读写，总 I/O 明显大于 46。</text>
  <text x="24" y="536" font-size="10" fill="#8b98a8">易错：虚段个数的分母是 <tspan font-weight="700">k−1</tspan>（不是 k）；最佳归并树优化的是<tspan font-weight="700">读写次数</tspan>，趟数仍由 ⌈log_k r⌉ 决定。</text>
</svg>
