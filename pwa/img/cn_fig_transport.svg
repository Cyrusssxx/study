<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 406" width="680" height="406">
  <defs>
    <marker id="tpArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="406" fill="#ffffff"/>
  <rect x="20" y="10" width="640" height="26" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="32" y="28" font-size="11" font-weight="700" fill="#1e40af">传输层：网络层只送到主机，端口号才决定交给哪个进程</text>

  <rect x="20" y="46" width="180" height="112" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="63" font-size="9.3" font-weight="700" fill="#334155">主机 A（IP 数据报的目的主机）</text>
  <rect x="30" y="70" width="160" height="24" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="86" font-size="8.5" fill="#1e40af">进程 P1　源端口 49152</text>
  <rect x="30" y="98" width="160" height="24" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="114" font-size="8.5" fill="#1e40af">进程 P2　源端口 49153</text>
  <rect x="30" y="126" width="160" height="24" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="38" y="142" font-size="8.5" fill="#1e40af">进程 P3　源端口 49154</text>

  <rect x="470" y="46" width="190" height="112" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="63" font-size="9.3" font-weight="700" fill="#334155">主机 B（另一台主机）</text>
  <rect x="480" y="70" width="170" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="488" y="86" font-size="8.5" fill="#166534">进程 Q1　目的端口 80</text>
  <rect x="480" y="98" width="170" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="488" y="114" font-size="8.5" fill="#166534">进程 Q2　目的端口 53</text>
  <rect x="480" y="126" width="170" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="488" y="142" font-size="8.5" fill="#166534">进程 Q3　目的端口 25</text>

  <rect x="240" y="88" width="190" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="335" y="107" font-size="9" fill="#475569" text-anchor="middle">网络层＋链路层：中间的路由器</text>
  <path d="M 204 82 L 466 82" stroke="#475569" stroke-width="1.4" marker-end="url(#tpArr)" fill="none"/>
  <text x="335" y="76" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">端到端逻辑通信：两个进程像直接对话</text>
  <path d="M 204 136 L 236 136" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
  <text x="220" y="152" font-size="7.8" fill="#64748b" text-anchor="middle">相邻节点</text>
  <path d="M 434 136 L 466 136" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
  <text x="450" y="152" font-size="7.8" fill="#64748b" text-anchor="middle">相邻节点</text>
  <text x="335" y="138" font-size="8.3" fill="#475569" text-anchor="middle">主机到主机（IP 首部写明两台主机 IP）</text>

  <text x="20" y="178" font-size="9" fill="#64748b">三层通信范围辨析（同一条数据，看的层次不同）</text>
  <rect x="20" y="186" width="205" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="204" font-size="9.2" font-weight="700" fill="#334155">数据链路层</text>
  <text x="30" y="220" font-size="8.4" fill="#475569">链路上<tspan font-weight="700">相邻节点</tspan>之间</text>
  <text x="30" y="235" font-size="8.4" fill="#475569">的逻辑通信</text>
  <rect x="237" y="186" width="206" height="58" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="247" y="204" font-size="9.2" font-weight="700" fill="#1e40af">网络层</text>
  <text x="247" y="220" font-size="8.4" fill="#1e40af"><tspan font-weight="700">主机到主机</tspan>的逻辑通信</text>
  <text x="247" y="235" font-size="8.4" fill="#1e40af">IP 首部指明两台主机 IP</text>
  <rect x="455" y="186" width="205" height="58" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="465" y="204" font-size="9.2" font-weight="700" fill="#166534">传输层</text>
  <text x="465" y="220" font-size="8.4" fill="#166534"><tspan font-weight="700">进程到进程</tspan>的逻辑通信</text>
  <text x="465" y="235" font-size="8.4" fill="#166534">运行在不同主机上的进程（端到端）</text>

  <text x="20" y="262" font-size="9" fill="#64748b">端口号：传输层的服务访问点 SAP，16 位，0 ~ 65535</text>
  <rect x="20" y="270" width="200" height="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="120" y="287" font-size="8.8" font-weight="700" fill="#1e40af" text-anchor="middle">熟知端口 0 ~ 1023</text>
  <rect x="220" y="270" width="210" height="26" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="325" y="287" font-size="8.8" font-weight="700" fill="#166534" text-anchor="middle">登记端口 1024 ~ 49151</text>
  <rect x="430" y="270" width="230" height="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="545" y="287" font-size="8.8" font-weight="700" fill="#92400e" text-anchor="middle">动态／短暂端口 49152 ~ 65535</text>
  <text x="20" y="312" font-size="8.5" fill="#475569">熟知端口举例：HTTP 80、FTP 21/20、DNS 53、SMTP 25、POP3 110、Telnet 23、HTTPS 443、RDP 3389；客户端临时用动态端口。</text>

  <rect x="20" y="322" width="640" height="74" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="32" y="340" font-size="8.9" fill="#92400e"><tspan font-weight="700">复用与分用</tspan>：多个应用进程共用一个传输层往下发叫复用；收到后按<tspan font-weight="700">目的端口号</tspan>交给正确进程叫分用。</text>
  <text x="32" y="356" font-size="8.9" fill="#92400e">网络层也有复用分用：把不同传输层协议封装成 IP 数据报／按首部<tspan font-weight="700">协议字段</tspan>交付（与传输层按端口分用不同）。</text>
  <text x="32" y="372" font-size="8.9" fill="#92400e"><tspan font-weight="700">差错检测范围</tspan>：传输层对<tspan font-weight="700">整个报文（首部＋数据）</tspan>校验 —— TCP 出错要求重传、UDP 直接丢弃；IP 只校验首部、不检查数据。</text>
  <text x="32" y="388" font-size="8.9" fill="#92400e">即使网络层不可靠（丢失／失序／重复），传输层仍能为应用提供可靠服务；TCP 的连接是<tspan font-weight="700">逻辑</tspan>的、建立在双方套接字之上，路由器不保存这个状态。</text>
</svg>
