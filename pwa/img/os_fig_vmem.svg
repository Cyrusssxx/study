<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 418" width="680" height="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="vmArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="418" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">虚拟内存 · 只装入一部分，靠调入与置换撑起更大的逻辑空间</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">地基是局部性原理；目标是虚拟性，手段是多次性与对换性 —— 三者对用户全部透明</text>

  <text x="20" y="70" font-size="9.5" font-weight="700" fill="#334155">进程 A 的虚拟地址空间（逻辑上 2³²B，按页划分）</text>

  <rect x="20" y="78" width="230" height="152" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="34" y="96" font-size="9" fill="#1e3a8a">页 0　在内存 ✓</text>
  <line x1="34" y1="104" x2="236" y2="104" stroke="#dbeafe" stroke-width="1"/>
  <text x="34" y="120" font-size="9" fill="#1e3a8a">页 1　在外存</text>
  <line x1="34" y1="128" x2="236" y2="128" stroke="#dbeafe" stroke-width="1"/>
  <text x="34" y="144" font-size="9" fill="#1e3a8a">页 2　在外存</text>
  <line x1="34" y1="152" x2="236" y2="152" stroke="#dbeafe" stroke-width="1"/>
  <text x="34" y="168" font-size="9" fill="#1e3a8a">页 3　在内存 ✓</text>
  <line x1="34" y1="176" x2="236" y2="176" stroke="#dbeafe" stroke-width="1"/>
  <text x="34" y="192" font-size="9" fill="#1e3a8a">页 4 …（暂不访问）</text>
  <line x1="34" y1="200" x2="236" y2="200" stroke="#dbeafe" stroke-width="1"/>
  <text x="34" y="216" font-size="9" fill="#64748b">页 5 及以后：尚未装入</text>

  <text x="20" y="252" font-size="8.5" fill="#b45309">右边两页没装也能启动 —— 这就是「部分装入」，也是虚拟内存的前提</text>

  <path d="M 256 118 L 300 118" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#vmArr)"/>
  <text x="278" y="110" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">调入</text>
  <text x="278" y="134" font-size="8" fill="#64748b" text-anchor="middle">缺页中断</text>

  <path d="M 300 190 L 256 190" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#vmArr)"/>
  <text x="278" y="182" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">换出</text>
  <text x="278" y="206" font-size="8" fill="#64748b" text-anchor="middle">内存不足</text>

  <text x="308" y="70" font-size="9.5" font-weight="700" fill="#334155">物理内存（页框有限）</text>
  <rect x="308" y="78" width="150" height="164" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <rect x="318" y="86" width="130" height="32" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="383" y="105" font-size="9" fill="#166534" text-anchor="middle">进程 A 页 0</text>
  <rect x="318" y="124" width="130" height="32" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="383" y="143" font-size="9" fill="#166534" text-anchor="middle">空闲页框</text>
  <rect x="318" y="162" width="130" height="32" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="383" y="181" font-size="9" fill="#166534" text-anchor="middle">进程 A 页 3</text>
  <rect x="318" y="200" width="130" height="32" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="383" y="219" font-size="9" fill="#166534" text-anchor="middle">进程 B 的页</text>

  <path d="M 383 246 L 383 262" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#vmArr)"/>
  <rect x="308" y="266" width="150" height="34" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="383" y="281" font-size="9" fill="#92400e" text-anchor="middle">外存对换区</text>
  <text x="383" y="294" font-size="8" fill="#92400e" text-anchor="middle">换出的页先睡在这儿</text>

  <rect x="474" y="78" width="186" height="222" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="486" y="98" font-size="10" font-weight="700" fill="#0f172a">容量上限（概念题必考）</text>
  <text x="486" y="118" font-size="8.5" fill="#334155">实际容量 ≤ 内存 ＋ 外存 之和</text>
  <text x="486" y="134" font-size="8.5" fill="#334155">最大容量 ≤ 地址位数决定的逻辑空间</text>
  <text x="486" y="154" font-size="9" font-weight="700" fill="#1e3a8a">上限 = min(内存＋外存, 2^地址位)</text>
  <text x="486" y="174" font-size="8.5" fill="#64748b">32 位地址、按字节编址 → 2³²B = 4GB</text>
  <line x1="486" y1="186" x2="648" y2="186" stroke="#e2e8f0" stroke-width="1"/>
  <text x="486" y="204" font-size="9" font-weight="700" fill="#0f172a">三个特征</text>
  <text x="486" y="222" font-size="8.5" fill="#334155">多次性：分多次调入，不必一次装完</text>
  <text x="486" y="238" font-size="8.5" fill="#334155">对换性：不用的换出，用时再换入</text>
  <text x="486" y="254" font-size="8.5" fill="#166534">虚拟性：用户看到的内存被放大</text>
  <text x="486" y="276" font-size="8.5" fill="#b45309">虚拟性是本质与目标，</text>
  <text x="486" y="290" font-size="8.5" fill="#b45309">多次性与对换性只是手段。</text>

  <rect x="20" y="312" width="206" height="48" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="32" y="330" font-size="10" font-weight="700" fill="#1e40af">时间局部性</text>
  <text x="32" y="346" font-size="8.5" fill="#334155">刚用过的指令/数据很快还会用</text>

  <rect x="237" y="312" width="206" height="48" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="249" y="330" font-size="10" font-weight="700" fill="#166534">空间局部性</text>
  <text x="249" y="346" font-size="8.5" fill="#334155">刚访问的单元，邻近单元也快被访问</text>

  <rect x="454" y="312" width="206" height="48" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="466" y="330" font-size="10" font-weight="700" fill="#92400e">共同点：都是缓存</text>
  <text x="466" y="346" font-size="8.5" fill="#334155">快表、页高速缓存、虚拟内存同理</text>

  <rect x="20" y="368" width="640" height="38" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="32" y="386" font-size="9.5" fill="#92400e"><tspan font-weight="700">传统管理的两个毛病</tspan>：一次性（必须整装才能跑，作业大于内存就根本跑不起来）＋ 驻留性（装入就一直占着，等 I/O 时也白占）。</text>
  <text x="32" y="400" font-size="9.5" fill="#92400e">虚拟内存正是拿「部分装入＋请求调入＋置换」这三件事同时解决这两个毛病。</text>
</svg>
