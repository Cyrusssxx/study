<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="424" fill="#ffffff"/>

  <text x="360" y="26" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">扩展操作码：16 位字长，地址码越少操作码越长</text>
  <text x="360" y="48" font-size="11" fill="#64748b" text-anchor="middle">4 位基本操作码 + 3 个 4 位地址字段；每级留 1111 作「向下一级扩展」的标志</text>

  <!-- 位数标尺 -->
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="172" y="70">b15–b12</text>
    <text x="276" y="70">b11–b8</text>
    <text x="380" y="70">b7–b4</text>
    <text x="484" y="70">b3–b0</text>
  </g>

  <!-- 三地址 -->
  <text x="112" y="106" font-size="11" font-weight="700" fill="#334155" text-anchor="end">三地址</text>
  <rect x="120" y="86" width="104" height="30" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="172" y="106" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">OP</text>
  <rect x="224" y="86" width="104" height="30" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="276" y="106" font-size="11" fill="#3730a3" text-anchor="middle">A1</text>
  <rect x="328" y="86" width="104" height="30" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="380" y="106" font-size="11" fill="#3730a3" text-anchor="middle">A2</text>
  <rect x="432" y="86" width="104" height="30" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="484" y="106" font-size="11" fill="#3730a3" text-anchor="middle">A3</text>
  <text x="548" y="106" font-size="10.5" fill="#166534">0000～1110 · 15 条</text>

  <!-- 二地址 -->
  <text x="112" y="152" font-size="11" font-weight="700" fill="#334155" text-anchor="end">二地址</text>
  <rect x="120" y="132" width="104" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="172" y="152" font-size="10.5" font-weight="700" fill="#7c2d12" text-anchor="middle">1111</text>
  <rect x="224" y="132" width="104" height="30" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="276" y="152" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">OP</text>
  <rect x="328" y="132" width="104" height="30" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="380" y="152" font-size="11" fill="#3730a3" text-anchor="middle">A1</text>
  <rect x="432" y="132" width="104" height="30" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="484" y="152" font-size="11" fill="#3730a3" text-anchor="middle">A2</text>
  <text x="548" y="152" font-size="10.5" fill="#166534">0000～1110 · 15 条</text>

  <!-- 一地址 -->
  <text x="112" y="198" font-size="11" font-weight="700" fill="#334155" text-anchor="end">一地址</text>
  <rect x="120" y="178" width="104" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="172" y="198" font-size="10.5" font-weight="700" fill="#7c2d12" text-anchor="middle">1111</text>
  <rect x="224" y="178" width="104" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="276" y="198" font-size="10.5" font-weight="700" fill="#7c2d12" text-anchor="middle">1111</text>
  <rect x="328" y="178" width="104" height="30" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="380" y="198" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">OP</text>
  <rect x="432" y="178" width="104" height="30" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="484" y="198" font-size="11" fill="#3730a3" text-anchor="middle">A1</text>
  <text x="548" y="198" font-size="10.5" fill="#166534">0000～1110 · 15 条</text>

  <!-- 零地址 -->
  <text x="112" y="244" font-size="11" font-weight="700" fill="#334155" text-anchor="end">零地址</text>
  <rect x="120" y="224" width="104" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="172" y="244" font-size="10.5" font-weight="700" fill="#7c2d12" text-anchor="middle">1111</text>
  <rect x="224" y="224" width="104" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="276" y="244" font-size="10.5" font-weight="700" fill="#7c2d12" text-anchor="middle">1111</text>
  <rect x="328" y="224" width="104" height="30" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="380" y="244" font-size="10.5" font-weight="700" fill="#7c2d12" text-anchor="middle">1111</text>
  <rect x="432" y="224" width="104" height="30" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="484" y="244" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">OP</text>
  <text x="548" y="244" font-size="10.5" fill="#166534">0000～1111 · 16 条</text>

  <!-- 前缀提示 -->
  <text x="548" y="70" font-size="9.5" fill="#b45309">深黄＝扩展标志</text>

  <text x="360" y="278" font-size="11" fill="#334155" text-anchor="middle">共 15 + 15 + 15 + 16 = <tspan font-weight="700" fill="#b91c1c">61 条</tspan>指令（16 位字长能编码 2¹⁶ 种，但按此分配只用了 61 个码点）</text>

  <!-- 底注 -->
  <rect x="20" y="296" width="680" height="112" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="316" font-size="10.8" fill="#92400e">两条铁律：① 短操作码<tspan font-weight="700">不能</tspan>成为长操作码的<tspan font-weight="700">前缀</tspan>；② 各指令的操作码<tspan font-weight="700">不能重复</tspan>。</text>
  <text x="34" y="336" font-size="10.8" fill="#92400e">前缀冲突的后果：译码器读到 0000 时无法判断这是三地址的第 1 条，还是藏在 0000xxxx 下的二地址指令。</text>
  <text x="34" y="356" font-size="10.8" fill="#1e40af">定长操作码：n 位固定表示 <tspan font-weight="700">2ⁿ</tspan> 条指令，译码快、硬件简单，但指令数被定死；扩展操作码牺牲译码时间换指令条数。</text>
  <text x="34" y="376" font-size="10.8" fill="#1e40af">分配原则：<tspan font-weight="700">高频指令给短操作码</tspan>、低频给长操作码，缩短平均译码时间。</text>
  <text x="34" y="396" font-size="10.8" fill="#991b1b">访存次数陷阱：一地址 3 次、二/三地址 4 次，前提是<tspan font-weight="700">地址码全为主存地址</tspan>；一旦用寄存器寻址要另算。</text>
</svg>
