<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="590" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">信道利用率 · 为什么窗口能「填满」往返时间</text>
  <text x="20" y="48" font-size="12" fill="#64748b">U = W·T /(T + R)：T = 一帧的发送时延，R = 往返时间，W = 发送窗口（同时允许多少帧在飞）</text>

  <text x="24" y="82" font-size="12" font-weight="700" fill="#1e3a8a">停等（W = 1）：发一帧就要停下来干等一个 RTT</text>
  <line x1="110" y1="112" x2="632" y2="112" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="110" y="94" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <text x="135" y="114" font-size="10.5" fill="#312e81" text-anchor="middle">帧1</text>
  <rect x="310" y="94" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <text x="335" y="114" font-size="10.5" fill="#312e81" text-anchor="middle">帧2</text>
  <rect x="510" y="94" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <text x="535" y="114" font-size="10.5" fill="#312e81" text-anchor="middle">帧3</text>

  <rect x="160" y="102" width="150" height="14" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="235" y="114" font-size="10.5" fill="#b91c1c" text-anchor="middle">链路空闲（纯浪费）</text>
  <rect x="360" y="102" width="150" height="14" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="435" y="114" font-size="10.5" fill="#b91c1c" text-anchor="middle">链路空闲</text>

  <path d="M110 136 L160 136" stroke="#4338ca" stroke-width="1.1"/>
  <path d="M110 130 L110 142" stroke="#4338ca" stroke-width="1.1"/>
  <path d="M160 130 L160 142" stroke="#4338ca" stroke-width="1.1"/>
  <text x="135" y="154" font-size="10" fill="#4338ca" text-anchor="middle">T</text>

  <path d="M160 136 L310 136" stroke="#f59e0b" stroke-width="1.1"/>
  <path d="M160 130 L160 142" stroke="#f59e0b" stroke-width="1.1"/>
  <path d="M310 130 L310 142" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="235" y="154" font-size="10" fill="#b45309" text-anchor="middle">R（等 ACK 往返）</text>
  <text x="600" y="154" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">U = T/(T+R) ≈ 1/5</text>

  <text x="24" y="196" font-size="12" font-weight="700" fill="#1e3a8a">连续 ARQ（W = 4）：4 帧连着发，刚好把一个周期塞满</text>
  <line x1="110" y1="226" x2="632" y2="226" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="110" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="160" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="210" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="260" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="310" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="360" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="410" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <rect x="460" y="208" width="50" height="30" rx="3" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.3"/>
  <g font-size="10.5" fill="#312e81" text-anchor="middle">
    <text x="135" y="228">1</text><text x="185" y="228">2</text><text x="235" y="228">3</text><text x="285" y="228">4</text>
    <text x="335" y="228">5</text><text x="385" y="228">6</text><text x="435" y="228">7</text><text x="485" y="228">8</text>
  </g>
  <path d="M110 250 L310 250" stroke="#4338ca" stroke-width="1.1"/>
  <path d="M110 244 L110 256" stroke="#4338ca" stroke-width="1.1"/>
  <path d="M310 244 L310 256" stroke="#4338ca" stroke-width="1.1"/>
  <text x="210" y="268" font-size="10" fill="#4338ca" text-anchor="middle">第 1 个周期 4×T</text>
  <text x="600" y="268" font-size="11" font-weight="700" fill="#166534" text-anchor="end">U = 4T/4T = 100%（W·T ≥ T+R）</text>

  <rect x="20" y="292" width="640" height="88" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="312" font-size="11.5" font-weight="700" fill="#312e81">三个必背变形</text>
  <text x="34" y="332" font-size="11.5" fill="#3730a3">停等：U = T/(T+R)　｜　连续 ARQ：U = W·T/(T+R)　（加 ACK 发送时延就写进分母）</text>
  <text x="34" y="352" font-size="11.5" fill="#3730a3">满载条件：W·T ≥ T+R ⇔ <tspan font-weight="700">W ≥ (T+R)/T</tspan>；反推序号位数：由 W 下限取满足 2ⁿ−1 ≥ W 的 n</text>
  <text x="34" y="372" font-size="11.5" fill="#3730a3">求「至少几帧」时：先按最短帧长算 T，再向上取整，别用平均帧长。</text>

  <rect x="20" y="396" width="640" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="416" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="436" font-size="11.5" fill="#7f1d1d">① U 的分子是<tspan font-weight="700">有效发送时间</tspan>，分母是「一帧的完整周期」——别把 ACK 的传播时延漏掉。</text>
  <text x="34" y="456" font-size="11.5" fill="#7f1d1d">② 窗口上限不是「想开多大就多大」：GBN ≤ 2ⁿ−1、SR ≤ 2ⁿ⁻¹，受序号位数约束。</text>
  <text x="34" y="476" font-size="11.5" fill="#7f1d1d">③ 例（128 kb/s、RTT=250 ms、帧 1000 B、要求 U ≥ 80%）：T = 8000/128000 = 62.5 ms，</text>
  <text x="34" y="494" font-size="11.5" fill="#7f1d1d">　 需 W ≥ (62.5+250)/62.5 = 5 → 取 W = 7 时序号至少 3 位（GBN 2³−1=7 刚好够）。</text>
</svg>
