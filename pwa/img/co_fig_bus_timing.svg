<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="btArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">总线定时 · 一次总线事务的时间协议</text>
  <text x="20" y="48" font-size="12" fill="#64748b">同步快但按最慢设备定节拍；异步靠握手；分离式解决「等数据时总线空转」</text>

  <rect x="16" y="60" width="648" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="82" font-size="12.5" font-weight="700" fill="#1e40af">① 同步定时</text>
  <text x="30" y="100" font-size="10.5" fill="#64748b">统一时钟，固定节拍，不需要应答</text>
  <text x="128" y="126" font-size="10" fill="#64748b">时钟</text>
  <path d="M164,124 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20 v16 h20 v-16 h20" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="320" y="140" font-size="10" fill="#94a3b8">节拍固定</text>
  <text x="30" y="150" font-size="11.5" fill="#334155">主设备按最慢从设备定节拍：快的等、慢的跟不上 → 全局节奏被拖慢，但控制最简单</text>

  <rect x="16" y="166" width="648" height="228" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="188" font-size="12.5" font-weight="700" fill="#1e40af">② 异步定时（三种握手，按可靠性递进）</text>

  <text x="30" y="214" font-size="11.5" font-weight="700" fill="#334155">不互锁</text>
  <rect x="120" y="202" width="120" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="180" y="217" font-size="10" fill="#991b1b" text-anchor="middle">主：发请求</text>
  <rect x="250" y="202" width="150" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="325" y="217" font-size="10" fill="#64748b" text-anchor="middle">主：不等应答就撤销</text>
  <text x="410" y="217" font-size="10.5" fill="#991b1b">最快、最不可靠——从设备可能根本没收到</text>

  <text x="30" y="248" font-size="11.5" font-weight="700" fill="#334155">半互锁</text>
  <rect x="120" y="236" width="120" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="180" y="251" font-size="10" fill="#92400e" text-anchor="middle">主：发请求</text>
  <rect x="250" y="236" width="120" height="22" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="310" y="251" font-size="10" fill="#065f46" text-anchor="middle">从：应答</text>
  <rect x="380" y="236" width="130" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="445" y="251" font-size="10" fill="#92400e" text-anchor="middle">主：撤请求（应答不确认）</text>
  <text x="520" y="251" font-size="10.5" fill="#92400e">中速</text>

  <text x="30" y="282" font-size="11.5" font-weight="700" fill="#334155">全互锁</text>
  <rect x="120" y="270" width="104" height="22" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="172" y="285" font-size="10" fill="#065f46" text-anchor="middle">请求</text>
  <rect x="228" y="270" width="104" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="280" y="285" font-size="10" fill="#1e40af" text-anchor="middle">应答</text>
  <rect x="336" y="270" width="104" height="22" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="388" y="285" font-size="10" fill="#065f46" text-anchor="middle">撤请求</text>
  <rect x="444" y="270" width="104" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="496" y="285" font-size="10" fill="#1e40af" text-anchor="middle">撤应答</text>
  <text x="556" y="285" font-size="10.5" fill="#1e40af">最慢、最可靠</text>
  <text x="30" y="306" font-size="10.5" fill="#64748b">异步无公共时钟，完全靠 请求（主→从）/ 应答（从→主） 两根信号的配合确定每一步何时进行</text>

  <text x="30" y="330" font-size="11.5" font-weight="700" fill="#1e40af">③ 半同步定时</text>
  <text x="120" y="330" font-size="10.5" fill="#475569">公共时钟打底，插入 WAIT 信号：慢设备拉低 WAIT 让主设备多等几个节拍 → 兼顾同步的简单与异步的灵活</text>
  <text x="30" y="352" font-size="11.5" font-weight="700" fill="#1e40af">④ 分离式定时</text>
  <text x="120" y="352" font-size="10.5" fill="#475569">主设备发出地址命令后<tspan font-weight="700">立即释放总线</tspan>，从设备备好数据再申请总线传数据——把「准备数据」的空等从总线周期里切出去</text>
  <text x="30" y="376" font-size="11.5" font-weight="700" fill="#dc2626">共同限制</text>
  <text x="120" y="376" font-size="10.5" fill="#991b1b">任一总线周期内只能有一个主设备控制总线，一对一通信或广播，<tspan font-weight="700">不能有多对主从并发</tspan></text>

  <rect x="16" y="404" width="648" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="28" y="426" font-size="11.5" fill="#312e81">前三种（同步 / 异步 / 半同步）都是「独占式事务」：从准备数据到传送结束，总线全程被占，空等期间别人也用不了</text>

  <text x="20" y="462" font-size="11.5" fill="#475569">总线事务 = 请求分配 → 寻址 → 传输 → 释放，完整的一次总线操作；突发传送只发一次首地址，连续传多个数据。</text>
  <text x="20" y="482" font-size="11.5" fill="#475569">选择依据：设备速度集中且差异小 → 同步；速度差异大 → 异步；既要简单又要兼容慢设备 → 半同步；</text>
  <text x="20" y="500" font-size="11.5" fill="#475569">追求总线利用率 → 分离式（代价是协议更复杂、需要拆分请求与应答两个子周期）。</text>
</svg>
