<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="476" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">最小生成树 · Prim 加点 vs Kruskal 加边</text>
  <text x="20" y="48" font-size="12" fill="#64748b">同一张带权无向图，两种贪心策略选出的边集可以不同，但总权值一定相同</text>

  <g stroke="#cbd5e1" stroke-width="1.3">
    <line x1="66" y1="80" x2="196" y2="70"/>
    <line x1="66" y1="80" x2="132" y2="150"/>
    <line x1="66" y1="80" x2="66" y2="224"/>
    <line x1="196" y1="70" x2="132" y2="150"/>
    <line x1="196" y1="70" x2="208" y2="192"/>
    <line x1="66" y1="232" x2="132" y2="150"/>
    <line x1="132" y1="150" x2="208" y2="192"/>
    <line x1="132" y1="150" x2="140" y2="266"/>
    <line x1="66" y1="232" x2="134" y2="268"/>
    <line x1="208" y1="200" x2="142" y2="266"/>
  </g>

  <circle cx="66" cy="80" r="15" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="66" y="85" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">A</text>
  <circle cx="196" cy="66" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="196" y="71" font-size="12" fill="#312e81" text-anchor="middle">B</text>
  <circle cx="132" cy="150" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="132" y="155" font-size="12" fill="#312e81" text-anchor="middle">C</text>
  <circle cx="66" cy="232" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="66" y="237" font-size="12" fill="#312e81" text-anchor="middle">D</text>
  <circle cx="212" cy="196" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="212" y="201" font-size="12" fill="#312e81" text-anchor="middle">E</text>
  <circle cx="136" cy="272" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="136" y="277" font-size="12" fill="#312e81" text-anchor="middle">F</text>

  <text x="132" y="66" font-size="10.5" fill="#dc2626">6</text>
  <text x="86" y="118" font-size="10.5" fill="#dc2626">1</text>
  <text x="54" y="156" font-size="10.5" fill="#dc2626">5</text>
  <text x="174" y="100" font-size="10.5" fill="#dc2626">5</text>
  <text x="212" y="132" font-size="10.5" fill="#dc2626">3</text>
  <text x="88" y="196" font-size="10.5" fill="#dc2626">5</text>
  <text x="176" y="166" font-size="10.5" fill="#dc2626">6</text>
  <text x="120" y="214" font-size="10.5" fill="#dc2626">4</text>
  <text x="88" y="260" font-size="10.5" fill="#dc2626">2</text>
  <text x="184" y="244" font-size="10.5" fill="#dc2626">6</text>

  <text x="20" y="316" font-size="11" fill="#64748b">6 个顶点、10 条边；红色数字为边权</text>

  <text x="316" y="72" font-size="12.5" font-weight="700" fill="#1e40af">Prim（从 A 出发，加点）</text>
  <text x="316" y="94" font-size="10.5" fill="#475569">每步选「已选集 ↔ 未选集」最小边</text>
  <text x="316" y="116" font-size="11" fill="#334155">① AC = 1</text>
  <text x="316" y="136" font-size="11" fill="#334155">② CF = 4</text>
  <text x="316" y="156" font-size="11" fill="#334155">③ DF = 2</text>
  <text x="316" y="176" font-size="11" fill="#334155">④ BC = 5</text>
  <text x="316" y="196" font-size="11" fill="#334155">⑤ BE = 3</text>
  <text x="316" y="220" font-size="11" font-weight="700" fill="#1e40af">总权 = 1+4+2+5+3 = 15</text>
  <text x="316" y="242" font-size="10.5" fill="#64748b">每次只加一个顶点，n 个顶点做 n−1 步</text>
  <text x="316" y="262" font-size="10.5" fill="#64748b">O(n²)，与边数无关 → 稠密图更优</text>

  <text x="500" y="72" font-size="12.5" font-weight="700" fill="#9a3412">Kruskal（加边）</text>
  <text x="500" y="94" font-size="10.5" fill="#475569">按权递增选边，跳过成环的边</text>
  <text x="500" y="116" font-size="11" fill="#334155">① AC = 1</text>
  <text x="500" y="136" font-size="11" fill="#334155">② DF = 2</text>
  <text x="500" y="156" font-size="11" fill="#334155">③ BE = 3</text>
  <text x="500" y="176" font-size="11" fill="#334155">④ CF = 4</text>
  <text x="500" y="196" font-size="11" fill="#334155">⑤ AB = 5</text>
  <text x="500" y="220" font-size="11" font-weight="700" fill="#9a3412">总权 = 1+2+3+4+5 = 15</text>
  <text x="500" y="242" font-size="10.5" fill="#64748b">要先对 e 条边排序，O(e log e)</text>
  <text x="500" y="262" font-size="10.5" fill="#64748b">稀疏图更优；用并查集判环</text>

  <text x="20" y="344" font-size="11.5" fill="#334155">注意：Prim 第 4 步选 BC(5)、Kruskal 选 AB(5) —— <tspan font-weight="700">边的组合不同、总权相同</tspan>，所以「MST 唯一」只在边权互不相同时成立。</text>
  <text x="20" y="364" font-size="11.5" fill="#334155">判环是 Kruskal 的核心：并查集 Find(u) == Find(v) 说明已在同一连通块，这条边必须跳过。</text>

  <rect x="20" y="380" width="640" height="86" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="402" font-size="11.5" font-weight="700" fill="#312e81">易错：</text>
  <text x="34" y="422" font-size="11.5" fill="#3730a3">① Prim 从不同顶点出发，得到的 <tspan font-weight="700">边集可能不同</tspan>，但总权一定相同；题目问「第 2 次选哪条边」必须确认起点。</text>
  <text x="34" y="442" font-size="11.5" fill="#3730a3">② MST 的边数恒为 n−1；若图中存在权值相同的边，MST 可能不唯一，但「最小总权」唯一。</text>
  <text x="34" y="460" font-size="11.5" fill="#3730a3">③ Kruskal 必须按权排序后逐条判环，不能只看最小的 n−1 条边（前 n−1 小可能已构成回路）。</text>
</svg>
