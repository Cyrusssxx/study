<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">磁盘地址怎么排 · 16 位地址＝柱面 8 位 ＋ 盘面 4 位 ＋ 扇区 4 位</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">按「16 个盘面、每面 256 条磁道、每道 16 个扇区」推出来的；柱面号排在最前面是为了少寻道</text>

  <!-- 位域条 -->
  <text x="40" y="76" font-size="10" font-weight="700" fill="#334155">一个 16 位磁盘地址</text>
  <rect x="40" y="84" width="300" height="46" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="190" y="105" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">柱面（磁道）号</text>
  <text x="190" y="121" font-size="9.5" fill="#1e40af" text-anchor="middle">8 位 · 0–255</text>
  <rect x="340" y="84" width="150" height="46" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.3"/>
  <text x="415" y="105" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">盘面（磁头）号</text>
  <text x="415" y="121" font-size="9.5" fill="#15803d" text-anchor="middle">4 位 · 0–15</text>
  <rect x="490" y="84" width="150" height="46" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="565" y="105" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">扇区号</text>
  <text x="565" y="121" font-size="9.5" fill="#b45309" text-anchor="middle">4 位 · 0–15</text>

  <text x="40" y="150" font-size="9" fill="#64748b">位数推导：256 条磁道 → 8 位；16 个盘面 → 4 位；16 个扇区 → 4 位；合计 16 位</text>
  <text x="40" y="166" font-size="9" fill="#64748b">最小读写单位是扇区；盘片与磁头一一对应，盘面号即磁头号</text>

  <!-- 左卡：存取时间 -->
  <rect x="24" y="182" width="316" height="168" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="203" font-size="11" font-weight="700" fill="#0f172a">存取时间 ＝ 寻道 ＋ 旋转等待 ＋ 传输</text>

  <rect x="40" y="214" width="112" height="26" rx="3" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="96" y="231" font-size="9.5" fill="#3730a3" text-anchor="middle">寻道</text>
  <rect x="152" y="214" width="86" height="26" rx="3" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="195" y="231" font-size="9.5" fill="#9a3412" text-anchor="middle">旋转等待</text>
  <rect x="238" y="214" width="58" height="26" rx="3" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="267" y="231" font-size="9.5" fill="#166534" text-anchor="middle">传输</text>
  <rect x="296" y="214" width="28" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="310" y="231" font-size="8" fill="#475569" text-anchor="middle">控</text>

  <text x="40" y="266" font-size="9" fill="#3730a3">平均寻道 ≈ 最大寻道的一半</text>
  <text x="40" y="283" font-size="9" fill="#9a3412">平均旋转等待 ＝ 转半圈（6000 转/分 → 5ms）</text>
  <text x="40" y="300" font-size="9" fill="#166534">传输 ＝ 扫过一个扇区（10ms ÷ 12 ≈ 0.83ms）</text>
  <text x="40" y="319" font-size="9" fill="#b45309">转速翻倍：旋转等待与传输减半，寻道不变</text>
  <text x="40" y="336" font-size="9" fill="#64748b">三件事串行做，机械动作无法重叠</text>

  <!-- 右卡：容量与柱面优先 -->
  <rect x="352" y="182" width="304" height="168" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="368" y="203" font-size="11" font-weight="700" fill="#1e40af">容量两个口径与「柱面优先」</text>
  <text x="368" y="226" font-size="9.5" fill="#334155">容量 ＝ 盘面数 × 每面磁道数 × 每道扇区数 × 扇区大小</text>
  <text x="368" y="246" font-size="9.5" fill="#991b1b">格式化容量 &lt; 非格式化容量</text>
  <text x="368" y="262" font-size="9" fill="#64748b">（扇区要写地址/校验等控制信息，还有扇区间隙）</text>

  <rect x="368" y="274" width="272" height="62" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="380" y="291" font-size="9.5" font-weight="700" fill="#1e40af">为什么柱面号排在盘面号前面</text>
  <text x="380" y="308" font-size="9" fill="#334155">同一柱面的各盘面磁道连续编号，换盘面只切磁头</text>
  <text x="380" y="324" font-size="9" fill="#334155">不用再移动机械臂，省掉的正是最贵的寻道时间</text>

  <text x="20" y="376" font-size="9" fill="#64748b">扇区按固定圆心角划分，越靠内圈线密度越高 —— 容量被最内圈的记录密度卡住</text>
  <text x="20" y="392" font-size="9" fill="#b45309">高速缓存按「簇」成批写，减少频繁的小块写入</text>
</svg>
