<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">一次磁盘数据传送 · 各阶段配哪种 I/O 方式</text>
  <text x="20" y="48" font-size="12" fill="#64748b">不是全程只用一种方式：控制类阶段用查询/中断，成块数据搬运才交给 DMA</text>

  <!-- 表头：浅灰底 -->
  <rect x="20" y="66" width="640" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="87" font-size="11.5" font-weight="700" fill="#334155">磁盘传送阶段</text>
  <text x="300" y="87" font-size="11.5" font-weight="700" fill="#334155">采用的方式</text>
  <text x="452" y="87" font-size="11.5" font-weight="700" fill="#334155">为什么用这种方式</text>
  <line x1="292" y1="66" x2="292" y2="326" stroke="#e2e8f0"/>
  <line x1="444" y1="66" x2="444" y2="326" stroke="#e2e8f0"/>

  <!-- 5 行，按方式配色 -->
  <rect x="20" y="102" width="640" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="34" y="121" font-size="11.5" font-weight="700" fill="#334155">① 传送参数设置（初始化）</text>
  <text x="300" y="121" font-size="10.5" font-weight="700" fill="#475569">程序查询</text>
  <text x="300" y="137" font-size="9.5" fill="#64748b">CPU 主动写控制字</text>
  <text x="452" y="121" font-size="10.5" fill="#334155">只需 CPU 设一次参数，</text>
  <text x="452" y="137" font-size="10.5" fill="#334155">无等待，查询即可</text>

  <rect x="20" y="150" width="640" height="44" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="34" y="169" font-size="11.5" font-weight="700" fill="#1e3a8a">② 寻道</text>
  <text x="300" y="169" font-size="10.5" font-weight="700" fill="#1e40af">程序中断</text>
  <text x="300" y="185" font-size="9.5" fill="#1e40af">磁头移动到目标磁道</text>
  <text x="452" y="169" font-size="10.5" fill="#1e40af">机械动作耗时长，CPU 先</text>
  <text x="452" y="185" font-size="10.5" fill="#1e40af">干别的，寻道完再中断通知</text>

  <rect x="20" y="198" width="640" height="44" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="34" y="217" font-size="11.5" font-weight="700" fill="#1e3a8a">③ 查找扇区</text>
  <text x="300" y="217" font-size="10.5" font-weight="700" fill="#1e40af">程序中断</text>
  <text x="300" y="233" font-size="9.5" fill="#1e40af">盘片旋转到目标扇区</text>
  <text x="452" y="217" font-size="10.5" fill="#1e40af">同样是等待类机械动作，</text>
  <text x="452" y="233" font-size="10.5" fill="#1e40af">中断让 CPU 不空等旋转</text>

  <rect x="20" y="246" width="640" height="44" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="34" y="265" font-size="11.5" font-weight="700" fill="#065f46">④ 连续读写（真正的数据块搬运）</text>
  <text x="300" y="265" font-size="10.5" font-weight="700" fill="#065f46">DMA 方式</text>
  <text x="300" y="281" font-size="9.5" fill="#047857">硬件接管总线成块直传</text>
  <text x="452" y="265" font-size="10.5" fill="#065f46">数据量大、速率高，交给 DMA</text>
  <text x="452" y="281" font-size="10.5" fill="#065f46">不经 CPU、不保存现场</text>

  <rect x="20" y="294" width="640" height="44" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="34" y="313" font-size="11.5" font-weight="700" fill="#1e3a8a">⑤ 结束、校验</text>
  <text x="300" y="313" font-size="10.5" font-weight="700" fill="#1e40af">程序中断</text>
  <text x="300" y="329" font-size="9.5" fill="#1e40af">DMA 发中断通知 CPU</text>
  <text x="452" y="313" font-size="10.5" fill="#1e40af">整块传完才中断一次，CPU</text>
  <text x="452" y="329" font-size="10.5" fill="#1e40af">做校验与后处理</text>

  <!-- 一句话 -->
  <rect x="20" y="350" width="640" height="34" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="32" y="372" font-size="11.5" fill="#78350f">一句话：找位置（寻道/找扇区）靠中断省 CPU，搬数据靠 DMA 成块直传，整块结束再中断一次通知 CPU。</text>

  <!-- DMA 只是其中一段 -->
  <rect x="20" y="396" width="640" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="415" font-size="11" font-weight="700" fill="#334155">关键理解：DMA Controller 只负责第④段</text>
  <text x="34" y="432" font-size="10.5" fill="#475569">寻道、找扇区、结束校验这些「控制类」阶段仍需 CPU 参与；DMA 的「不占 CPU」只针对成块数据搬运本身。</text>

  <!-- 易错点：红色 -->
  <text x="20" y="462" font-size="12" font-weight="700" fill="#b91c1c">易错点</text>
  <text x="20" y="482" font-size="10.5" fill="#dc2626">① 别以为磁盘传送全程 DMA：寻道 / 找扇区是中断方式，只有连续读写阶段才是 DMA。</text>
  <text x="20" y="500" font-size="10.5" fill="#dc2626">② DMA 中断是「整块传完中断一次」，不是每传一个字中断一次，这是它比中断方式省 CPU 的关键。</text>
  <text x="20" y="518" font-size="10.5" fill="#dc2626">③ DMA 请求优先级通常高于中断；DMA 响应可在总线周期结束即响应，中断要等指令执行完。</text>
</svg>
