  <rect x="20" y="418" width="640" height="80" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="438" font-size="11" font-weight="700" fill="#92400e">为什么帧多了反而更差</text>
  <text x="34" y="458" font-size="10.5" fill="#92400e">FIFO 只认「谁来得早」，不认「谁还在用」。帧数一改，队首被淘汰的页就全变了：</text>
  <text x="34" y="476" font-size="10.5" fill="#92400e">4 帧时第 7～12 次连续六次缺页，一次都没命中。<tspan font-weight="700">只有 FIFO 会这样；LRU / OPT 是栈式算法，永不出此异常</tspan>。</text>
