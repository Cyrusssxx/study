<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">快速排序 · 一趟划分（挖坑填数）</text>
  <text x="20" y="48" font-size="12" fill="#64748b">{49, 38, 65, 97, 76, 13, 27} 以 49 为枢轴：high 找小的填左坑、low 找大的填右坑</text>

  <text x="20" y="90" font-size="10.5" font-weight="700" fill="#64748b">初始</text>
  <text x="20" y="106" font-size="10.5" fill="#94a3b8">pivot = 49</text>

  <rect x="150" y="76" width="62" height="40" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.8"/>
  <rect x="216" y="76" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="282" y="76" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="348" y="76" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="414" y="76" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="480" y="76" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="546" y="76" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="181" y="102" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">49</text>
  <text x="247" y="102" font-size="13" fill="#334155" text-anchor="middle">38</text>
  <text x="313" y="102" font-size="13" fill="#334155" text-anchor="middle">65</text>
  <text x="379" y="102" font-size="13" fill="#334155" text-anchor="middle">97</text>
  <text x="445" y="102" font-size="13" fill="#334155" text-anchor="middle">76</text>
  <text x="511" y="102" font-size="13" fill="#334155" text-anchor="middle">13</text>
  <text x="577" y="102" font-size="13" fill="#334155" text-anchor="middle">27</text>

  <text x="20" y="156" font-size="10.5" font-weight="700" fill="#64748b">① high 左移</text>
  <text x="20" y="172" font-size="10.5" fill="#b45309">27 &lt; 49 填左坑</text>

  <rect x="150" y="142" width="62" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="216" y="142" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="282" y="142" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="348" y="142" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="414" y="142" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="480" y="142" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="546" y="142" width="62" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="181" y="168" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">27</text>
  <text x="247" y="168" font-size="13" fill="#334155" text-anchor="middle">38</text>
  <text x="313" y="168" font-size="13" fill="#334155" text-anchor="middle">65</text>
  <text x="379" y="168" font-size="13" fill="#334155" text-anchor="middle">97</text>
  <text x="445" y="168" font-size="13" fill="#334155" text-anchor="middle">76</text>
  <text x="511" y="168" font-size="13" fill="#334155" text-anchor="middle">13</text>
  <text x="577" y="168" font-size="12" fill="#94a3b8" text-anchor="middle">坑</text>

  <text x="20" y="222" font-size="10.5" font-weight="700" fill="#64748b">② low 右移</text>
  <text x="20" y="238" font-size="10.5" fill="#b45309">65 &gt; 49 填右坑</text>

  <rect x="150" y="208" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="216" y="208" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="282" y="208" width="62" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <rect x="348" y="208" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="414" y="208" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="480" y="208" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="546" y="208" width="62" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="181" y="234" font-size="13" fill="#334155" text-anchor="middle">27</text>
  <text x="247" y="234" font-size="13" fill="#334155" text-anchor="middle">38</text>
  <text x="313" y="234" font-size="12" fill="#94a3b8" text-anchor="middle">坑</text>
  <text x="379" y="234" font-size="13" fill="#334155" text-anchor="middle">97</text>
  <text x="445" y="234" font-size="13" fill="#334155" text-anchor="middle">76</text>
  <text x="511" y="234" font-size="13" fill="#334155" text-anchor="middle">13</text>
  <text x="577" y="234" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">65</text>

  <text x="20" y="288" font-size="10.5" font-weight="700" fill="#64748b">③ high 左移</text>
  <text x="20" y="304" font-size="10.5" fill="#b45309">13 &lt; 49 填左坑</text>

  <rect x="150" y="274" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="216" y="274" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="282" y="274" width="62" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="348" y="274" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="414" y="274" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="480" y="274" width="62" height="40" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <rect x="546" y="274" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="181" y="300" font-size="13" fill="#334155" text-anchor="middle">27</text>
  <text x="247" y="300" font-size="13" fill="#334155" text-anchor="middle">38</text>
  <text x="313" y="300" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">13</text>
  <text x="379" y="300" font-size="13" fill="#334155" text-anchor="middle">97</text>
  <text x="445" y="300" font-size="13" fill="#334155" text-anchor="middle">76</text>
  <text x="511" y="300" font-size="12" fill="#94a3b8" text-anchor="middle">坑</text>
  <text x="577" y="300" font-size="13" fill="#334155" text-anchor="middle">65</text>

  <text x="20" y="354" font-size="10.5" font-weight="700" fill="#64748b">④ low 右移</text>
  <text x="20" y="370" font-size="10.5" fill="#b45309">97 &gt; 49 填右坑</text>

  <rect x="150" y="340" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="216" y="340" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="282" y="340" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="348" y="340" width="62" height="40" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.8"/>
  <rect x="414" y="340" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="480" y="340" width="62" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="546" y="340" width="62" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="181" y="366" font-size="13" fill="#334155" text-anchor="middle">27</text>
  <text x="247" y="366" font-size="13" fill="#334155" text-anchor="middle">38</text>
  <text x="313" y="366" font-size="13" fill="#334155" text-anchor="middle">13</text>
  <text x="379" y="366" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">49</text>
  <text x="445" y="366" font-size="13" fill="#334155" text-anchor="middle">76</text>
  <text x="511" y="366" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">97</text>
  <text x="577" y="366" font-size="13" fill="#334155" text-anchor="middle">65</text>
  <text x="379" y="396" font-size="10.5" fill="#4338ca" text-anchor="middle">↑ low 与 high 相遇，把 49 填回这个坑</text>

  <text x="20" y="410" font-size="11.5" fill="#334155">结果 {27,38,13} <tspan font-weight="700" fill="#312e81">49</tspan> {76,97,65}：枢轴落到<tspan font-weight="700">最终位置</tspan>，左全小、右全大，但两段内部仍无序。</text>

  <rect x="20" y="428" width="640" height="80" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="448" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="466" font-size="11.2" fill="#7f1d1d">① 一趟划分只保证枢轴归位 —— 判「是不是快排一趟结果」只看某元素左小右大，不看两段是否有序。</text>
  <text x="34" y="484" font-size="11.2" fill="#7f1d1d">② 已有序 / 逆序且取端点作枢轴 → 最坏 O(n²)、递归深度 n；随机数据才 O(n log n)。</text>
  <text x="34" y="500" font-size="11.2" fill="#7f1d1d">③ 空间是递归栈 O(log n) ~ O(n)，且<tspan font-weight="700">不稳定</tspan>。</text>
</svg>
