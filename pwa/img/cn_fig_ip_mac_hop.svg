<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="hArw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7ab8"/></marker>
  </defs>
  <rect width="780" height="330" fill="#fbfcfe"/>
  <rect x="0" y="0" width="780" height="36" fill="#4a7ab8"/>
  <text x="16" y="24" fill="#ffffff" font-size="15" font-weight="700">跨网络转发：IP 首部始终不变，MAC 帧首部每跳重写</text>

  <rect x="18" y="66" width="128" height="42" rx="6" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="82" y="84" text-anchor="middle" fill="#2c4a6b" font-size="12" font-weight="700">H1（源主机）</text>
  <text x="82" y="100" text-anchor="middle" fill="#2c4a6b" font-size="11">IP1 / MAC-A</text>
  <rect x="226" y="66" width="128" height="42" rx="6" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="290" y="84" text-anchor="middle" fill="#2c4a6b" font-size="12" font-weight="700">R1</text>
  <text x="290" y="100" text-anchor="middle" fill="#4a5568" font-size="11">入 MAC-B / 出 MAC-C</text>
  <rect x="434" y="66" width="128" height="42" rx="6" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="498" y="84" text-anchor="middle" fill="#2c4a6b" font-size="12" font-weight="700">R2</text>
  <text x="498" y="100" text-anchor="middle" fill="#4a5568" font-size="11">入 MAC-D / 出 MAC-E</text>
  <rect x="642" y="66" width="120" height="42" rx="6" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="702" y="84" text-anchor="middle" fill="#2c4a6b" font-size="12" font-weight="700">H2（目的主机）</text>
  <text x="702" y="100" text-anchor="middle" fill="#2c4a6b" font-size="11">IP2 / MAC-F</text>

  <line x1="146" y1="132" x2="220" y2="132" stroke="#4a7ab8" stroke-width="2" marker-end="url(#hArw)"/>
  <line x1="354" y1="132" x2="428" y2="132" stroke="#4a7ab8" stroke-width="2" marker-end="url(#hArw)"/>
  <line x1="562" y1="132" x2="636" y2="132" stroke="#4a7ab8" stroke-width="2" marker-end="url(#hArw)"/>
  <text x="183" y="126" text-anchor="middle" fill="#33618f" font-size="11">第 1 跳</text>
  <text x="391" y="126" text-anchor="middle" fill="#33618f" font-size="11">第 2 跳</text>
  <text x="599" y="126" text-anchor="middle" fill="#33618f" font-size="11">第 3 跳</text>

  <rect x="18" y="154" width="744" height="98" rx="8" fill="#ffffff" stroke="#c9d9ec"/>
  <text x="32" y="175" fill="#2c4a6b" font-size="12.5" font-weight="700">每一跳解封装后重新封装：帧的源/目的 MAC 换成当前链路两端</text>
  <g font-size="11.5" fill="#4a5568">
    <text x="32" y="197">H1 → R1：源 MAC = MAC-A，目的 MAC = MAC-B（用 ARP 解析默认网关 R1 的入接口）</text>
    <text x="32" y="217">R1 → R2：源 MAC = MAC-C，目的 MAC = MAC-D（用 ARP 解析下一跳 R2 的接口）</text>
    <text x="32" y="237">R2 → H2：源 MAC = MAC-E，目的 MAC = MAC-F（末跳用 ARP 解析目的主机 H2）</text>
  </g>

  <rect x="18" y="264" width="744" height="52" rx="8" fill="#eef4fb" stroke="#c9d9ec"/>
  <text x="32" y="284" fill="#33618f" font-size="12" font-weight="700">IP 首部全程不变：源 IP = IP1，目的 IP = IP2（TTL 每跳减 1、首部校验和重算除外）</text>
  <text x="32" y="304" fill="#8a6a2a" font-size="11.5">最常考的一句话：IP 地址不变、MAC 地址逐跳改变；下一跳路由器的 IP 不会写进 IP 首部，只用于 ARP 找 MAC。</text>
</svg>
