<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 672" width="800" height="672" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="800" height="672" fill="#fbfcfe"/>

  <text x="24" y="30" font-size="14.5" font-weight="700" fill="#2c4a6b">caller 调用 add 时的运行栈：局部变量在上，实参 + 返回地址 + 旧 EBP 在下</text>
  <text x="24" y="50" font-size="11" fill="#6b7a8d">状态：add 刚执行完 <tspan font-family="Consolas,monospace" font-weight="700">push ebp; mov ebp,esp</tspan>。ebp 是 caller 的基址指针，ebp′ 是 add 的（ebp′ = ebp − 32）</text>

  <text x="175" y="88" font-size="9.5" fill="#8b98a8">高地址（栈底）</text>

  <!-- 槽 0 -->
  <rect x="175" y="95" width="380" height="40" fill="#f2f6f4" stroke="#c3d6cc"/>
  <text x="185" y="109" font-size="9.5" font-family="Consolas,monospace" fill="#7b8794">[ebp]</text>
  <text x="240" y="126" font-size="11.5" fill="#4a5568">caller 上层过程保存的旧 EBP</text>

  <!-- 槽 1 -->
  <rect x="175" y="135" width="380" height="40" fill="#eef4fb" stroke="#c9d9ec"/>
  <text x="185" y="149" font-size="9.5" font-family="Consolas,monospace" fill="#7b8794">[ebp-4]</text>
  <text x="240" y="166" font-size="11.5" fill="#2c4a6b"><tspan font-family="Consolas,monospace" font-weight="700">sum</tspan>　（call 返回后由 <tspan font-family="Consolas,monospace">mov [ebp-4],eax</tspan> 写入）</text>

  <!-- 槽 2 -->
  <rect x="175" y="175" width="380" height="40" fill="#eef4fb" stroke="#c9d9ec"/>
  <text x="185" y="189" font-size="9.5" font-family="Consolas,monospace" fill="#7b8794">[ebp-8]</text>
  <text x="240" y="206" font-size="11.5" fill="#2c4a6b"><tspan font-family="Consolas,monospace" font-weight="700">temp2 = 80</tspan></text>

  <!-- 槽 3 -->
  <rect x="175" y="215" width="380" height="40" fill="#eef4fb" stroke="#c9d9ec"/>
  <text x="185" y="229" font-size="9.5" font-family="Consolas,monospace" fill="#7b8794">[ebp-12]</text>
  <text x="240" y="246" font-size="11.5" fill="#2c4a6b"><tspan font-family="Consolas,monospace" font-weight="700">temp1 = 125</tspan></text>

  <!-- 槽 4 -->
  <rect x="175" y="255" width="380" height="40" fill="#fbfcfe" stroke="#d9dee5" stroke-dasharray="4 3"/>
  <text x="185" y="269" font-size="9.5" font-family="Consolas,monospace" fill="#9aa6b2">[ebp-16]</text>
  <text x="240" y="286" font-size="11.5" fill="#8b98a8">（未使用：sub esp,24 共 6 个 4 字节槽，只用到 5 个）</text>

  <!-- 槽 5 -->
  <rect x="175" y="295" width="380" height="40" fill="#fdf3e5" stroke="#e5c8a2"/>
  <text x="185" y="309" font-size="9.5" font-family="Consolas,monospace" fill="#a8814a">[ebp-20]</text>
  <text x="240" y="326" font-size="11.5" fill="#8a6d3b"><tspan font-family="Consolas,monospace" font-weight="700">temp2 = 80</tspan>　实参副本（caller 的 [esp+4]）</text>

  <!-- 槽 6 -->
  <rect x="175" y="335" width="380" height="40" fill="#fdf3e5" stroke="#e5c8a2"/>
  <text x="185" y="349" font-size="9.5" font-family="Consolas,monospace" fill="#a8814a">[ebp-24]</text>
  <text x="240" y="366" font-size="11.5" fill="#8a6d3b"><tspan font-family="Consolas,monospace" font-weight="700">temp1 = 125</tspan>　实参副本（caller 的 [esp]）</text>

  <!-- 槽 7 -->
  <rect x="175" y="375" width="380" height="40" fill="#f1eefb" stroke="#c7bfe2"/>
  <text x="185" y="389" font-size="9.5" font-family="Consolas,monospace" fill="#7c6fa8">[ebp-28]</text>
  <text x="240" y="406" font-size="11.5" fill="#4d4380"><tspan font-family="Consolas,monospace" font-weight="700">返回地址</tspan>　call 指令自动压栈</text>

  <!-- 槽 8 -->
  <rect x="175" y="415" width="380" height="40" fill="#eaf6ee" stroke="#b7d8c3"/>
  <text x="185" y="429" font-size="9.5" font-family="Consolas,monospace" fill="#4f8a64">[ebp-32]</text>
  <text x="240" y="446" font-size="11.5" fill="#2f6b48">add 保存的旧 EBP（就是 caller 的 ebp）</text>

  <text x="175" y="472" font-size="9.5" fill="#8b98a8">低地址（栈顶）</text>

  <!-- 左侧指针：ebp -->
  <path d="M132 95H171" stroke="#4a7ab8" stroke-width="1.4"/>
  <path d="M171 95l-7 -3.6v7.2z" fill="#4a7ab8"/>
  <text x="126" y="99" text-anchor="end" font-size="12" font-weight="700" fill="#4a7ab8">ebp</text>

  <!-- 左侧指针：esp -->
  <path d="M132 335H171" stroke="#d9822b" stroke-width="1.4"/>
  <path d="M171 335l-7 -3.6v7.2z" fill="#d9822b"/>
  <text x="126" y="339" text-anchor="end" font-size="12" font-weight="700" fill="#d9822b">esp</text>

  <!-- 左侧指针：ebp' -->
  <path d="M132 415H171" stroke="#2f8f5b" stroke-width="1.4"/>
  <path d="M171 415l-7 -3.6v7.2z" fill="#2f8f5b"/>
  <text x="126" y="419" text-anchor="end" font-size="12" font-weight="700" fill="#2f8f5b">ebp′</text>

  <!-- 右侧 add 视角的偏移 -->
  <path d="M555 395H585" stroke="#2f8f5b" stroke-width="1.1"/>
  <text x="590" y="399" font-size="11" font-family="Consolas,monospace" font-weight="700" fill="#2f8f5b">ebp′+4</text>
  <text x="644" y="399" font-size="9.5" fill="#6b8f7a">→ 返回地址在栈上</text>

  <path d="M555 355H585" stroke="#2f8f5b" stroke-width="1.1"/>
  <text x="590" y="359" font-size="11" font-family="Consolas,monospace" font-weight="700" fill="#2f8f5b">ebp′+8</text>
  <text x="644" y="359" font-size="9.5" fill="#6b8f7a">→ x = 125</text>

  <path d="M555 315H585" stroke="#2f8f5b" stroke-width="1.1"/>
  <text x="590" y="319" font-size="11" font-family="Consolas,monospace" font-weight="700" fill="#2f8f5b">ebp′+12</text>
  <text x="644" y="319" font-size="9.5" fill="#6b8f7a">→ y = 80</text>

  <!-- 底部小结 -->
  <rect x="24" y="486" width="752" height="164" rx="4" fill="#eef4fb" stroke="#c9d9ec"/>
  <rect x="24" y="486" width="4" height="164" fill="#4a7ab8"/>
  <text x="40" y="510" font-size="12" font-weight="700" fill="#2c4a6b">三条链记牢，偏移就不会算错</text>
  <text x="40" y="534" font-size="11" fill="#2c4a6b"><tspan font-weight="700">① caller 建帧</tspan>：<tspan font-family="Consolas,monospace">push ebp</tspan> → <tspan font-family="Consolas,monospace">mov ebp,esp</tspan> → <tspan font-family="Consolas,monospace">sub esp,24</tspan>；局部变量落 [ebp-4]~[ebp-12]，实参副本塞 [esp]、[esp+4]</text>
  <text x="40" y="558" font-size="11" fill="#2c4a6b"><tspan font-weight="700">② add 取参</tspan>：<tspan font-family="Consolas,monospace">push ebp</tspan> → <tspan font-family="Consolas,monospace">mov ebp,esp</tspan>；此后 x 在 [ebp′+8]、y 在 [ebp′+12]，因为 +4 是返回地址、+0 是旧 EBP</text>
  <text x="40" y="582" font-size="11" fill="#2c4a6b"><tspan font-weight="700">③ 回 caller</tspan>：<tspan font-family="Consolas,monospace">mov [ebp-4],eax</tspan> 存返回值 → <tspan font-family="Consolas,monospace">leave</tspan>（= <tspan font-family="Consolas,monospace">mov esp,ebp</tspan> + <tspan font-family="Consolas,monospace">pop ebp</tspan>）→ <tspan font-family="Consolas,monospace">ret</tspan></text>
  <text x="40" y="608" font-size="10.5" fill="#4a5568">返回值走 <tspan font-family="Consolas,monospace" font-weight="700">EAX</tspan>，不占栈；add 没有局部变量、也没用 EBX/ESI/EDI，所以它整张栈帧只有「旧 EBP」这一个槽。</text>
  <text x="40" y="628" font-size="10.5" fill="#4a5568">易错点：参数在 <tspan font-family="Consolas,monospace" font-weight="700">caller</tspan> 的栈帧里（低地址侧），只读不改；被调者看到的是 <tspan font-family="Consolas,monospace" font-weight="700">正偏移</tspan>。</text>
</svg>
