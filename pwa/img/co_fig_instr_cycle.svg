<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="icArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">指令周期 · 四个机器周期与定长 / 变长</text>
  <text x="20" y="48" font-size="12" fill="#64748b">取指必有，间址与中断按需插入，执行必有</text>

  <rect x="18" y="66" width="152" height="128" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="94" y="90" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">取指周期</text>
  <text x="94" y="112" font-size="10.5" fill="#475569" text-anchor="middle">PC → MAR → 主存</text>
  <text x="94" y="129" font-size="10.5" fill="#475569" text-anchor="middle">→ MDR → IR</text>
  <text x="94" y="146" font-size="10.5" fill="#475569" text-anchor="middle">PC 增量</text>
  <text x="94" y="172" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">每条指令必有</text>

  <line x1="170" y1="130" x2="184" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#icArrow)"/>

  <rect x="186" y="66" width="152" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="262" y="90" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">间址周期</text>
  <text x="262" y="112" font-size="10.5" fill="#475569" text-anchor="middle">按形式地址访存</text>
  <text x="262" y="129" font-size="10.5" fill="#475569" text-anchor="middle">取回有效地址</text>
  <text x="262" y="146" font-size="10.5" fill="#475569" text-anchor="middle">写回 MDR</text>
  <text x="262" y="172" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">仅间接寻址才有</text>

  <line x1="338" y1="130" x2="352" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#icArrow)"/>

  <rect x="354" y="66" width="152" height="128" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/>
  <text x="430" y="90" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">执行周期</text>
  <text x="430" y="112" font-size="10.5" fill="#475569" text-anchor="middle">取操作数、运算</text>
  <text x="430" y="129" font-size="10.5" fill="#475569" text-anchor="middle">存结果、改 PC</text>
  <text x="430" y="146" font-size="10.5" fill="#475569" text-anchor="middle">不同指令差别最大</text>
  <text x="430" y="172" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">每条指令必有</text>

  <line x1="506" y1="130" x2="520" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#icArrow)"/>

  <rect x="522" y="66" width="140" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="592" y="90" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">中断周期</text>
  <text x="592" y="112" font-size="10.5" fill="#475569" text-anchor="middle">保存断点</text>
  <text x="592" y="129" font-size="10.5" fill="#475569" text-anchor="middle">关中断、转 ISR</text>
  <text x="592" y="146" font-size="10.5" fill="#475569" text-anchor="middle">（隐指令完成）</text>
  <text x="592" y="172" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">有请求且允许时</text>

  <text x="20" y="222" font-size="12.5" font-weight="700" fill="#334155">定长指令周期（各指令拍数相同）</text>
  <text x="230" y="222" font-size="10.5" fill="#64748b">空拍浪费，但控制简单</text>
  <rect x="20" y="230" width="60" height="26" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="50" y="247" font-size="10" fill="#312e81" text-anchor="middle">取指</text>
  <rect x="84" y="230" width="60" height="26" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="114" y="247" font-size="10" fill="#312e81" text-anchor="middle">间址</text>
  <rect x="148" y="230" width="120" height="26" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="208" y="247" font-size="10" fill="#312e81" text-anchor="middle">执行</text>
  <rect x="272" y="230" width="80" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="247" font-size="10" fill="#94a3b8" text-anchor="middle">空等</text>
  <rect x="356" y="230" width="60" height="26" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="386" y="247" font-size="10" fill="#312e81" text-anchor="middle">中断</text>
  <text x="430" y="247" font-size="10.5" fill="#64748b">← 无论是否需要都留出固定节拍</text>

  <text x="20" y="286" font-size="12.5" font-weight="700" fill="#334155">变长指令周期（按需给拍，现代计算机普遍采用）</text>
  <rect x="20" y="294" width="60" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="50" y="311" font-size="10" fill="#1e40af" text-anchor="middle">取指</text>
  <rect x="84" y="294" width="88" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="128" y="311" font-size="10" fill="#1e40af" text-anchor="middle">执行（短）</text>
  <text x="182" y="311" font-size="10.5" fill="#475569">加法类指令到此处结束</text>
  <rect x="20" y="326" width="60" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="50" y="343" font-size="10" fill="#1e40af" text-anchor="middle">取指</text>
  <rect x="84" y="326" width="60" height="26" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="114" y="343" font-size="10" fill="#92400e" text-anchor="middle">间址</text>
  <rect x="148" y="326" width="140" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="218" y="343" font-size="10" fill="#1e40af" text-anchor="middle">执行（长，多次访存）</text>
  <text x="298" y="343" font-size="10.5" fill="#475569">取数 / 乘法 / 间接寻址指令更长</text>

  <rect x="20" y="372" width="640" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="394" font-size="11.5" fill="#312e81">由大到小：指令周期 ⊇ 机器周期（一次访存/总线操作） ⊇ 时钟周期（节拍）；后两者都是时钟周期的整数倍</text>

  <text x="20" y="428" font-size="11.5" fill="#475569">易错：①无条件转移指令 PC 改两次——取指后 PC+「指令长度」，执行阶段再改为转移目标；</text>
  <text x="20" y="446" font-size="11.5" fill="#475569">②单周期 CPU 的指令周期 = 1 个时钟周期（CPI=1），与「一个机器周期」不是一回事；</text>
  <text x="20" y="464" font-size="11.5" fill="#475569">③乘法指令的指令周期长于加法，不是因为时钟更慢，而是执行的机器周期更多。</text>
</svg>
