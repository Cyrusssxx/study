<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="mpArrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">微程序控制器 · 用「存微指令」代替「拉逻辑」</text>
  <text x="20" y="48" font-size="12" fill="#64748b">执行一条机器指令 = 顺序执行 CM 中对应的一段微程序</text>

  <rect x="36" y="86" width="110" height="54" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="91" y="108" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">IR 操作码</text>
  <text x="91" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">机器指令字段</text>

  <line x1="146" y1="113" x2="172" y2="113" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#mpArrow)"/>

  <rect x="174" y="80" width="164" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="256" y="104" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">微地址形成部件</text>
  <text x="256" y="122" font-size="10.5" fill="#475569" text-anchor="middle">操作码 → 微程序入口地址</text>
  <text x="256" y="137" font-size="10.5" fill="#475569" text-anchor="middle">（操作码译码，非微指令译码）</text>

  <line x1="338" y1="113" x2="364" y2="113" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#mpArrow)"/>

  <rect x="366" y="86" width="96" height="54" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="414" y="108" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">μPC</text>
  <text x="414" y="126" font-size="10.5" fill="#64748b" text-anchor="middle">微指令地址</text>

  <line x1="462" y1="113" x2="488" y2="113" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#mpArrow)"/>

  <rect x="490" y="72" width="154" height="128" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="567" y="94" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">控制存储器 CM</text>
  <rect x="502" y="104" width="130" height="22" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="119" font-size="10.5" fill="#92400e" text-anchor="middle">0 号单元：取指微程序</text>
  <rect x="502" y="130" width="130" height="22" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="145" font-size="10.5" fill="#92400e" text-anchor="middle">1~n：各指令微程序</text>
  <text x="567" y="172" font-size="10.5" fill="#78350f" text-anchor="middle">CM 用户不可编程，只读</text>
  <text x="567" y="189" font-size="10.5" fill="#78350f" text-anchor="middle">微程序条数 = 指令数 + 公共段</text>

  <line x1="567" y1="200" x2="567" y2="228" stroke="#b45309" stroke-width="1.5" marker-end="url(#mpArrow2)"/>

  <rect x="490" y="230" width="154" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="567" y="252" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">μIR 微指令寄存器</text>
  <text x="567" y="270" font-size="10.5" fill="#78350f" text-anchor="middle">控制字段 + 顺序控制字段</text>
  <text x="567" y="284" font-size="10.5" fill="#78350f" text-anchor="middle">（下址字段 / 判别测试字段）</text>

  <path d="M490,260 L452,260 L452,140" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#mpArrow2)"/>
  <text x="404" y="212" font-size="10.5" fill="#059669">下址字段回填 μPC</text>
  <text x="404" y="228" font-size="10.5" fill="#059669">或增量方式 μPC+1</text>

  <line x1="567" y1="290" x2="567" y2="316" stroke="#b45309" stroke-width="1.5" marker-end="url(#mpArrow2)"/>
  <rect x="470" y="318" width="194" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="567" y="343" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">控制信号 → CPU 各部件</text>

  <text x="36" y="200" font-size="12.5" font-weight="700" fill="#334155">术语对照（易混）</text>
  <text x="36" y="222" font-size="11.5" fill="#475569">微命令：最小控制操作，如 PCout、MARin</text>
  <text x="36" y="242" font-size="11.5" fill="#475569">微操作：微命令的执行动作，一个微命令对应一个微操作</text>
  <text x="36" y="262" font-size="11.5" fill="#475569">微指令：若干微命令的集合，一拍内可并行多个</text>
  <text x="36" y="282" font-size="11.5" fill="#475569">微程序：完成一条机器指令的全部微指令序列</text>
  <text x="36" y="302" font-size="11.5" fill="#475569">微周期：读出一条微指令并执行所需的时间</text>

  <rect x="20" y="376" width="640" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="398" font-size="11.5" fill="#312e81">CM 存的是微指令而非机器指令；机器指令由微程序解释执行，微程序由硬件直接执行</text>

  <text x="20" y="432" font-size="11.5" fill="#475569">硬布线：速度更快、修改困难；微程序：规整易扩展、多一级 CM 访问故稍慢。</text>
  <text x="20" y="452" font-size="11.5" fill="#475569">一条机器指令的执行时间 = 对应微程序包含的微指令条数 × 微周期。</text>
</svg>
