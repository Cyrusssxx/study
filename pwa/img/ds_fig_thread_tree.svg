<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="thA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="440" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">中序线索二叉树 · 空指针改存前驱 / 后继</text>
  <text x="20" y="48" font-size="12" fill="#64748b">中序序列 D B E A F C G：把每个结点的空左指针指向前驱、空右指针指向后继</text>

  <g stroke="#cbd5e1" stroke-width="1.3">
    <line x1="200" y1="93" x2="120" y2="123"/>
    <line x1="200" y1="93" x2="280" y2="123"/>
    <line x1="120" y1="153" x2="66" y2="183"/>
    <line x1="120" y1="153" x2="156" y2="183"/>
    <line x1="280" y1="153" x2="240" y2="183"/>
    <line x1="280" y1="153" x2="330" y2="183"/>
  </g>

  <circle cx="200" cy="78" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="200" y="83" font-size="12.5" fill="#312e81" text-anchor="middle">A</text>
  <text x="200" y="60" font-size="9.5" fill="#94a3b8" text-anchor="middle">0 | 0</text>
  <circle cx="120" cy="138" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="120" y="143" font-size="12.5" fill="#312e81" text-anchor="middle">B</text>
  <text x="120" y="120" font-size="9.5" fill="#94a3b8" text-anchor="middle">0 | 0</text>
  <circle cx="280" cy="138" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="280" y="143" font-size="12.5" fill="#312e81" text-anchor="middle">C</text>
  <text x="280" y="120" font-size="9.5" fill="#94a3b8" text-anchor="middle">0 | 0</text>
  <circle cx="66" cy="198" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="66" y="203" font-size="12.5" fill="#312e81" text-anchor="middle">D</text>
  <text x="66" y="180" font-size="9.5" fill="#dc2626" text-anchor="middle">1 | 1</text>
  <circle cx="156" cy="198" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="156" y="203" font-size="12.5" fill="#312e81" text-anchor="middle">E</text>
  <text x="156" y="180" font-size="9.5" fill="#dc2626" text-anchor="middle">1 | 1</text>
  <circle cx="240" cy="198" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="240" y="203" font-size="12.5" fill="#312e81" text-anchor="middle">F</text>
  <text x="240" y="180" font-size="9.5" fill="#dc2626" text-anchor="middle">1 | 1</text>
  <circle cx="330" cy="198" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="330" y="203" font-size="12.5" fill="#312e81" text-anchor="middle">G</text>
  <text x="330" y="180" font-size="9.5" fill="#dc2626" text-anchor="middle">1 | 1</text>

  <g stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" fill="none">
    <path d="M78,208 L106,150" marker-end="url(#thA)"/>
    <path d="M168,190 L206,88" marker-end="url(#thA)"/>
    <path d="M228,190 L196,88" marker-end="url(#thA)"/>
    <path d="M318,190 L294,150" marker-end="url(#thA)"/>
  </g>
  <text x="60" y="228" font-size="10" fill="#dc2626">D 的 rchild → 后继 B</text>
  <text x="176" y="228" font-size="10" fill="#dc2626">E 的 rchild → 后继 A</text>
  <text x="252" y="230" font-size="10" fill="#dc2626">F 的 lchild → 前驱 A</text>
  <text x="352" y="176" font-size="10" fill="#dc2626">G 的 lchild → 前驱 C</text>

  <rect x="376" y="62" width="284" height="196" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="390" y="84" font-size="12" font-weight="700" fill="#312e81">标记位的含义</text>
  <text x="390" y="106" font-size="11" fill="#334155"><tspan font-weight="700">ltag = 0</tspan> → lchild 指左孩子（实线）</text>
  <text x="390" y="126" font-size="11" fill="#334155"><tspan font-weight="700">ltag = 1</tspan> → lchild 指<tspan font-weight="700">中序前驱</tspan>（虚线）</text>
  <text x="390" y="148" font-size="11" fill="#334155"><tspan font-weight="700">rtag = 0</tspan> → rchild 指右孩子（实线）</text>
  <text x="390" y="168" font-size="11" fill="#334155"><tspan font-weight="700">rtag = 1</tspan> → rchild 指<tspan font-weight="700">中序后继</tspan>（虚线）</text>
  <text x="390" y="194" font-size="10.5" fill="#64748b">结点上方小字即「ltag | rtag」；</text>
  <text x="390" y="212" font-size="10.5" fill="#64748b">中序第一个 D 的 lchild、最后一个 G 的</text>
  <text x="390" y="230" font-size="10.5" fill="#64748b">rchild 仍为空（NULL）。</text>
  <text x="390" y="250" font-size="10.5" fill="#059669">线索化后不必递归也能 O(1) 找前驱 / 后继</text>

  <text x="20" y="256" font-size="12.5" font-weight="700" fill="#312e81">线索化的收益：遍历不用栈、找前驱后继 O(1)</text>
  <text x="20" y="278" font-size="11.5" fill="#334155">中序后继：rtag = 1 直接取 rchild；rtag = 0 则走「右子树最左下」的那个结点。</text>
  <text x="20" y="298" font-size="11.5" fill="#334155">中序前驱：ltag = 1 直接取 lchild；ltag = 0 则走「左子树最右下」的那个结点。</text>

  <rect x="20" y="314" width="640" height="110" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="336" font-size="11.5" font-weight="700" fill="#312e81">易错：</text>
  <text x="34" y="358" font-size="11.5" fill="#3730a3">① <tspan font-weight="700">后序线索不能有效求后序后继</tspan>（需要双亲信息，除非用带标志的三叉链表）；先序线索求前驱同样受限。</text>
  <text x="34" y="380" font-size="11.5" fill="#3730a3">② 线索是「指针」不是「指针 + 标记」两套结构：判断走孩子还是走线索，全靠 ltag / rtag。</text>
  <text x="34" y="402" font-size="11.5" fill="#3730a3">③ 在线索树上插入 / 删除结点后必须维护线索，否则线索会指向已释放结点。</text>
</svg>
