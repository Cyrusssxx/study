  <path d="M100 224 L100 230 L218 230 L218 224" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
  <path d="M224 224 L224 230 L342 230 L342 224" stroke="#94a3b8" stroke-width="1.1" fill="none"/>
