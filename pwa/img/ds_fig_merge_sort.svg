  <text x="128" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">13</text>
  <text x="190" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">27</text>
  <text x="252" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">38</text>
  <text x="314" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">49</text>
  <text x="376" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">49*</text>
  <text x="438" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">65</text>
  <text x="500" y="362" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">76</text>
