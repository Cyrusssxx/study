  <path d="M100 384 L100 390 L590 390 L590 384" stroke="#4338ca" stroke-width="1.2" fill="none"/>

  <text x="20" y="412" font-size="11.5" fill="#334155">趟数：8 个元素 ⌈log₂8⌉ = 3 趟；16 个元素 4 趟；6 个初始段合并 ⌈log₂6⌉ = 3 趟 —— <tspan font-weight="700">与初始是否有序无关</tspan>。</text>

  <rect x="20" y="428" width="640" height="82" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="448" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="466" font-size="11.2" fill="#7f1d1d">① 时间最好 = 最坏 = 平均 = O(n log n)，只有空间是 O(n) —— 本章空间代价最大的内部排序，但稳定。</text>
  <text x="34" y="484" font-size="11.2" fill="#7f1d1d">② 一趟归并只合并<tspan font-weight="700">相邻</tspan>两段，跨段合并是错的。</text>
  <text x="34" y="502" font-size="11.2" fill="#7f1d1d">③ 外部排序用 k 路归并减少趟数：m 个初始段 → ⌈log_k m⌉ 趟，k 越大趟数越少。</text>
</svg>
