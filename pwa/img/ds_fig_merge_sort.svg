  <text x="252" y="122" font-size="12.5" fill="#334155" text-anchor="middle">65</text>
  <text x="314" y="122" font-size="12.5" fill="#334155" text-anchor="middle">97</text>
  <text x="376" y="122" font-size="12.5" fill="#334155" text-anchor="middle">76</text>
  <text x="438" y="122" font-size="12.5" fill="#334155" text-anchor="middle">13</text>
  <text x="500" y="122" font-size="12.5" fill="#334155" text-anchor="middle">27</text>
  <text x="562" y="122" font-size="12.5" fill="#334155" text-anchor="middle">49*</text>

  <text x="20" y="200" font-size="11" fill="#64748b">第 1 趟</text>
  <rect x="100" y="176" width="56" height="40" rx="4" fill="#f0fdf4" stroke="#86efac"/>
