<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 524" width="680" height="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="524" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">二路归并排序 · 8 个元素 3 趟</text>
  <text x="20" y="48" font-size="12" fill="#64748b">每一趟只把「相邻」的两个有序段两两合并，段长翻倍：1 → 2 → 4 → 8</text>

  <text x="20" y="120" font-size="11" fill="#64748b">初始</text>
  <rect x="100" y="96" width="56" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="162" y="96" width="56" height="40" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
