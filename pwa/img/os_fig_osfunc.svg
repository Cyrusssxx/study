<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 418" width="680" height="418">
  <rect x="0" y="0" width="680" height="418" fill="#ffffff"/>
  <rect x="20" y="10" width="640" height="26" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="32" y="28" font-size="11" font-weight="700" fill="#1e40af">OS 1.1.2 三大角色：同一个操作系统的三种身份，按「对谁」来分</text>

  <text x="20" y="55" font-size="9" fill="#64748b">教材比喻</text>
  <rect x="20" y="62" width="170" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="105" y="81" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">雇　主</text>
  <text x="105" y="97" font-size="8.5" fill="#64748b" text-anchor="middle">用户：下命令、要结果</text>
  <path d="M 194 85 L 236 85" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <path d="M 230 81 L 236 85 L 230 89" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <rect x="240" y="62" width="180" height="46" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="330" y="81" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">工　人 ＝ 操作系统</text>
  <text x="330" y="97" font-size="8.5" fill="#1e40af" text-anchor="middle">接命令、协调各部件工作</text>
  <path d="M 424 85 L 466 85" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <path d="M 460 81 L 466 85 L 460 89" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <rect x="470" y="62" width="190" height="46" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="565" y="81" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">机　器</text>
  <text x="565" y="97" font-size="8.5" fill="#64748b" text-anchor="middle">处理机 / 存储器 / 设备 / 文件</text>

  <rect x="20" y="120" width="205" height="56" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="32" y="140" font-size="10" font-weight="700" fill="#1e40af">① 资源的管理者</text>
  <text x="32" y="156" font-size="8.8" fill="#1e40af">对「系统资源」—— 四大管理</text>
  <text x="32" y="169" font-size="8.8" fill="#1e40af">为多道程序提供良好运行环境</text>
  <rect x="237" y="120" width="206" height="56" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="249" y="140" font-size="10" font-weight="700" fill="#166534">② 用户与硬件之间的接口</text>
  <text x="249" y="156" font-size="8.8" fill="#166534">对「用户」—— 命令接口与程序接口</text>
  <text x="249" y="169" font-size="8.8" fill="#166534">使用硬件的必经媒介</text>
  <rect x="455" y="120" width="205" height="56" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="467" y="140" font-size="10" font-weight="700" fill="#92400e">③ 扩充机器</text>
  <text x="467" y="156" font-size="8.8" fill="#92400e">对「整机」—— 把复杂机器变简单</text>
  <text x="467" y="169" font-size="8.8" fill="#92400e">充分发挥价值，更好用</text>

  <text x="20" y="194" font-size="9" fill="#64748b">角色一展开：四大核心管理功能</text>
  <rect x="20" y="202" width="155" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="220" font-size="9.5" font-weight="700" fill="#334155">处理机管理</text>
  <text x="30" y="236" font-size="8.4" fill="#475569">以进程（线程）为基本单位</text>
  <text x="30" y="250" font-size="8.4" fill="#475569">控制 / 同步 / 通信 / 死锁</text>
  <text x="30" y="264" font-size="8.4" fill="#475569">处理机调度</text>
  <rect x="183" y="202" width="155" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="193" y="220" font-size="9.5" font-weight="700" fill="#334155">存储器管理</text>
  <text x="193" y="236" font-size="8.4" fill="#475569">分配与回收、地址映射</text>
  <text x="193" y="250" font-size="8.4" fill="#475569">内存保护与共享</text>
  <text x="193" y="264" font-size="8.4" fill="#475569">内存扩充（虚拟内存）</text>
  <rect x="346" y="202" width="155" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="356" y="220" font-size="9.5" font-weight="700" fill="#334155">文件管理</text>
  <text x="356" y="236" font-size="8.4" fill="#475569">文件存储空间管理</text>
  <text x="356" y="250" font-size="8.4" fill="#475569">目录管理、文件读/写</text>
  <text x="356" y="264" font-size="8.4" fill="#475569">访问保护（文件系统）</text>
  <rect x="509" y="202" width="151" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="519" y="220" font-size="9.5" font-weight="700" fill="#334155">设备管理</text>
  <text x="519" y="236" font-size="8.4" fill="#475569">缓冲、设备分配</text>
  <text x="519" y="250" font-size="8.4" fill="#475569">设备驱动处理</text>
  <text x="519" y="264" font-size="8.4" fill="#475569">虚拟设备（SPOOLing）</text>

  <text x="20" y="292" font-size="9" fill="#64748b">角色二展开：两类接口按「服务对象」分</text>
  <rect x="20" y="300" width="310" height="70" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="32" y="318" font-size="9.8" font-weight="700" fill="#166534">用户接口（命令接口）· 面向人</text>
  <text x="32" y="334" font-size="8.6" fill="#166534">联机用户接口：键盘命令＋命令解释程序，交互式立即执行</text>
  <text x="32" y="348" font-size="8.6" fill="#166534">脱机用户接口：作业控制语言，作业说明书一次交清</text>
  <text x="32" y="362" font-size="8.6" fill="#166534">图形用户接口 GUI：图标/菜单/对话框，底层走系统调用</text>
  <rect x="346" y="300" width="314" height="70" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="358" y="318" font-size="9.8" font-weight="700" fill="#1e40af">程序接口 ＝ 系统调用 · 面向程序</text>
  <text x="358" y="334" font-size="8.6" fill="#1e40af">应用程序请求 OS 服务、访问系统资源的唯一合法途径</text>
  <text x="358" y="348" font-size="8.6" fill="#1e40af">每个系统调用对应内核中实现特定功能的子程序</text>
  <text x="358" y="362" font-size="8.6" fill="#1e40af">库函数 ≠ 系统调用：printf 在用户态执行、可跨平台</text>

  <rect x="20" y="380" width="640" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="32" y="399" font-size="9" fill="#92400e"><tspan font-weight="700">两类接口最容易混</tspan>：程序接口面向程序、命令接口面向人；<tspan font-weight="700">系统调用是唯一合法入口</tspan>，用户不能直接调用 OS 内部函数。</text>
</svg>
