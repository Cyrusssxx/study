<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">读者-写者 · 用受保护的计数器 count 当「第一人 / 最后一人的开关」</text>
  <text x="20" y="48" font-size="12" fill="#64748b">rw 管读写互斥，count 数在读人数，mutex 保护 count —— 三层各司其职</text>

  <text x="40" y="80" font-size="11.5" font-weight="700" fill="#334155">时间轴（读者优先）</text>
  <line x1="90" y1="102" x2="640" y2="102" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="100" y="94" width="72" height="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="176" y="94" width="128" height="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="308" y="94" width="88" height="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="400" y="94" width="64" height="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="136" y="106" font-size="9" fill="#1e40af" text-anchor="middle">R1</text>
  <text x="240" y="106" font-size="9" fill="#1e40af" text-anchor="middle">R2 —— 同时在读</text>
  <text x="352" y="106" font-size="9" fill="#1e40af" text-anchor="middle">R3</text>
  <text x="432" y="106" font-size="9" fill="#1e40af" text-anchor="middle">R4</text>

  <rect x="470" y="88" width="120" height="28" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="530" y="107" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">W 一直等（饥饿）</text>

  <text x="48" y="106" font-size="10" fill="#94a3b8" text-anchor="end">开始</text>
  <text x="648" y="106" font-size="10" fill="#94a3b8">结束</text>

  <text x="40" y="138" font-size="10.5" font-weight="700" fill="#334155">count 变化</text>
  <text x="106" y="150" font-size="9" fill="#94a3b8">0→1</text>
  <text x="214" y="150" font-size="9" fill="#94a3b8">1→2</text>
  <text x="322" y="150" font-size="9" fill="#94a3b8">2→3</text>
  <text x="392" y="150" font-size="9" fill="#94a3b8">3→2</text>
  <text x="452" y="150" font-size="9" fill="#94a3b8">2→1</text>
  <text x="492" y="150" font-size="9" fill="#94a3b8">1→0</text>

  <line x1="40" y1="160" x2="640" y2="160" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="184" font-size="11.5" font-weight="700" fill="#334155">关键三步</text>
  <rect x="40" y="194" width="600" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="54" y="216" font-size="11" fill="#334155">读者进门：<tspan font-weight="700">P(mutex); if (count==0) P(rw); count++; V(mutex);</tspan></text>
  <text x="54" y="238" font-size="10.5" fill="#64748b">　　count 从 0 变 1 的那一个读者负责 P(rw) 把写者挡在门外；后来的读者只加计数，不碰 rw。</text>
  <text x="54" y="262" font-size="11" fill="#334155">读者出门：<tspan font-weight="700">P(mutex); count--; if (count==0) V(rw); V(mutex);</tspan></text>
  <text x="54" y="284" font-size="10.5" fill="#64748b">　　count 从 1 变 0 的那一个读者负责 V(rw) 放写者进来——中间任何读者退出都不能放。</text>

  <line x1="40" y1="318" x2="640" y2="318" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="342" font-size="11.5" font-weight="700" fill="#334155">读者优先 vs 写者优先（差在一个「门卫」信号量 w）</text>
  <rect x="40" y="352" width="292" height="86" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="52" y="372" font-size="11" font-weight="700" fill="#1e40af">读者优先（上面这段）</text>
  <text x="52" y="392" font-size="10.5" fill="#1e3a8a">只要还有人在读，新读者直接进；</text>
  <text x="52" y="410" font-size="10.5" fill="#1e3a8a">写者要等所有人退光。</text>
  <text x="52" y="428" font-size="10.5" font-weight="700" fill="#991b1b">读者不断来 → 写者无限等待。</text>

  <rect x="348" y="352" width="292" height="86" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="360" y="372" font-size="11" font-weight="700" fill="#166534">写者优先（读者也先 P(w)）</text>
  <text x="360" y="392" font-size="10.5" fill="#14532d">读者更新完 count 立刻 V(w)；</text>
  <text x="360" y="410" font-size="10.5" fill="#14532d">有写者在排队时，新读者被 w 挡住。</text>
  <text x="360" y="428" font-size="10.5" font-weight="700" fill="#166534">有限优先（FCFS 式唤醒），非绝对。</text>

  <text x="20" y="466" font-size="11.5" fill="#334155">为什么 count 要单独用 mutex 保护：<tspan font-weight="700">count++ 与 count-- 本身不是原子操作</tspan>，两个读者同时改会丢计数——</text>
  <text x="20" y="486" font-size="11.5" fill="#334155">丢掉的那一次可能正好是「0→1」或「1→0」，于是 rw 没被 P 住（写者闯入）或没被 V 开（写者饿死）。</text>
</svg>
