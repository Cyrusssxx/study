<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 588" width="680" height="588" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="588" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">CSMA/CA 的隐藏终端问题 · 与 RTS/CTS 四步解决</text>
  <text x="20" y="48" font-size="12" fill="#64748b">无线不能「边发边听」（自己发的时候听不到别人），所以用 ACK + 预约代替冲突检测</text>

  <circle cx="118" cy="160" r="118" fill="#eff6ff" fill-opacity="0.55" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="335" cy="160" r="118" fill="#f0fdf4" fill-opacity="0.55" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="552" cy="160" r="118" fill="#eff6ff" fill-opacity="0.55" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 4"/>

  <circle cx="118" cy="160" r="19" fill="#4a7ab8"/>
  <text x="118" y="165" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <circle cx="335" cy="160" r="19" fill="#166534"/>
  <text x="335" y="165" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AP</text>
  <circle cx="552" cy="160" r="19" fill="#4a7ab8"/>
  <text x="552" y="165" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>

  <text x="118" y="98" font-size="10.5" fill="#1e40af" text-anchor="middle">A 的覆盖范围</text>
  <text x="335" y="98" font-size="10.5" fill="#166534" text-anchor="middle">AP 的覆盖范围</text>
  <text x="552" y="98" font-size="10.5" fill="#1e40af" text-anchor="middle">C 的覆盖范围</text>

  <line x1="137" y1="160" x2="217" y2="160" stroke="#166534" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="316" y1="160" x2="236" y2="160" stroke="#166534" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="354" y1="160" x2="434" y2="160" stroke="#166534" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="533" y1="160" x2="453" y2="160" stroke="#166534" stroke-width="1.4" stroke-dasharray="5 3"/>

  <line x1="140" y1="196" x2="530" y2="196" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g stroke="#dc2626" stroke-width="2.4">
    <line x1="325" y1="186" x2="345" y2="206"/>
    <line x1="345" y1="186" x2="325" y2="206"/>
  </g>
  <text x="335" y="222" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">A 与 C 互相听不到</text>

  <text x="20" y="248" font-size="11.5" fill="#334155">冲突场景：A 正在给 AP 发数据，C 听不到 A 在发 → 以为信道空闲也开始发 → 在 AP 处<tspan font-weight="700">撞车</tspan>，A 的数据白发了。</text>

  <line x1="20" y1="264" x2="660" y2="264" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="288" font-size="11.5" font-weight="700" fill="#334155">RTS/CTS 预约机制（四步）</text>

  <line x1="90" y1="300" x2="90" y2="482" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="340" y1="300" x2="340" y2="482" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="590" y1="300" x2="590" y2="368" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="90" y="296" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
  <text x="340" y="296" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">AP</text>
  <text x="590" y="296" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">C</text>

  <line x1="90" y1="330" x2="326" y2="330" stroke="#b45309" stroke-width="1.8"/>
  <polygon points="340,330 326,324 326,336" fill="#b45309"/>
  <text x="215" y="324" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">① RTS：我要占多久</text>

  <line x1="340" y1="364" x2="104" y2="364" stroke="#b45309" stroke-width="1.8"/>
  <polygon points="90,364 104,358 104,370" fill="#b45309"/>
  <text x="215" y="358" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">② CTS：准了，大家闭嘴</text>

  <line x1="340" y1="364" x2="576" y2="364" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3"/>
  <polygon points="590,364 576,358 576,370" fill="#b45309"/>
  <text x="470" y="358" font-size="10.5" fill="#b45309" text-anchor="middle">C 也收到 CTS</text>

  <text x="590" y="398" font-size="10.5" fill="#b91c1c" text-anchor="middle">NAV 期间</text>
  <text x="590" y="414" font-size="10.5" fill="#b91c1c" text-anchor="middle">不发送</text>

  <line x1="90" y1="440" x2="326" y2="440" stroke="#4a7ab8" stroke-width="1.8"/>
  <polygon points="340,440 326,434 326,446" fill="#4a7ab8"/>
  <text x="215" y="434" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">③ 数据帧（AP 回 ACK）</text>

  <text x="340" y="470" font-size="10.5" fill="#94a3b8" text-anchor="middle">冲突只可能发生在 RTS 阶段，而 RTS 很短 → 浪费小</text>

  <rect x="20" y="500" width="640" height="76" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="520" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="540" font-size="11.5" fill="#7f1d1d">① 无线<tspan font-weight="700">没有冲突检测（CD）</tspan>：发送时自身信号淹没对方信号，无法「边发边听」，只能事后靠 ACK 判断。</text>
  <text x="34" y="560" font-size="11.5" fill="#7f1d1d">② RTS/CTS 解决的是<tspan font-weight="700">隐藏终端</tspan>；暴露终端（听得到却不必等）它解决不了，反而可能更保守。</text>
</svg>
