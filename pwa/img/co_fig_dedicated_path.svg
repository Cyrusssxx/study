<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="dpArrowCtrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">专用数据通路 · 为每条路径专门拉线，可并行传输</text>
  <text x="20" y="48" font-size="12" fill="#64748b">以单周期处理器为例：取指与访存走各自通路，互不争用</text>

  <rect x="40" y="74" width="110" height="46" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="95" y="102" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">PC</text>
  <rect x="200" y="74" width="140" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="270" y="96" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">指令存储器</text>
  <text x="270" y="112" font-size="10.5" fill="#475569" text-anchor="middle">IM（只读，独立于数据存储器）</text>
  <rect x="390" y="74" width="130" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="455" y="96" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">指令译码 / 控制</text>
  <text x="455" y="112" font-size="10.5" fill="#64748b" text-anchor="middle">无 IR（指令直接进控制）</text>

  <line x1="150" y1="97" x2="196" y2="97" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dpArrow)"/>
  <text x="173" y="90" font-size="10.5" fill="#2563eb" text-anchor="middle">地址</text>
  <line x1="340" y1="97" x2="386" y2="97" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dpArrow)"/>
  <text x="363" y="90" font-size="10.5" fill="#2563eb" text-anchor="middle">指令</text>

  <line x1="95" y1="120" x2="95" y2="190" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="95" y1="190" x2="240" y2="190" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="100" y="184" font-size="10.5" fill="#6366f1">PC+4 独立加法器</text>

  <rect x="40" y="212" width="130" height="56" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="105" y="236" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">通用寄存器堆</text>
  <text x="105" y="253" font-size="10.5" fill="#475569" text-anchor="middle">两组独立读口</text>

  <rect x="220" y="212" width="120" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="280" y="244" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">ALU</text>

  <rect x="390" y="212" width="130" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="455" y="236" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">数据存储器 DM</text>
  <text x="455" y="253" font-size="10.5" fill="#475569" text-anchor="middle">与 IM 分开，可同拍访存</text>

  <line x1="170" y1="240" x2="216" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dpArrow)"/>
  <text x="193" y="233" font-size="10.5" fill="#2563eb" text-anchor="middle">两路</text>
  <line x1="340" y1="240" x2="386" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dpArrow)"/>
  <text x="363" y="233" font-size="10.5" fill="#2563eb" text-anchor="middle">地址/数据</text>

  <path d="M455,268 L455,320 L105,320 L105,272" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#dpArrow)"/>
  <text x="280" y="314" font-size="10.5" fill="#059669" text-anchor="middle">写回通路（独立于总线）</text>

  <path d="M455,74 L600,74 L600,240 L524,240" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dpArrowCtrl)"/>
  <text x="606" y="150" font-size="10.5" fill="#94a3b8">控制信号</text>

  <rect x="20" y="344" width="640" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="32" y="366" font-size="11.5" fill="#312e81">代价：部件不能复用、连线多、面积大　｜　收益：多路同时传，单周期即可完成一条指令</text>

  <text x="20" y="400" font-size="11.5" fill="#475569">对比总线式：总线式分时共享、同一时刻只有一路数据，扩展省线但易成瓶颈；</text>
  <text x="20" y="420" font-size="11.5" fill="#475569">专用通路以面积换速度，各部件无需等待总线空闲，流水线 CPU 普遍采用。</text>
</svg>
