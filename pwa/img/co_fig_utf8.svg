<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="414" fill="#ffffff"/>

  <text x="360" y="26" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">UTF-8 变长编码：首字节前缀定长度，续字节一律 10 开头</text>
  <text x="360" y="46" font-size="10.6" fill="#64748b" text-anchor="middle">红色位＝长度前缀，灰色 10＝续字节标记（不是数据位，只用来认出「这是续字节」）</text>

  <text x="24" y="70" font-size="10.5" font-weight="700" fill="#334155">① 四种长度的字节结构（x 是该字符的编码位）</text>

  <text x="52" y="99" font-size="9.4" font-weight="700" fill="#334155" text-anchor="end">1 字节</text>
  <rect x="60" y="82" width="120" height="26" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="120" y="100" font-size="10.2" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan fill="#dc2626">0</tspan>xxxxxxx</text>
  <text x="196" y="100" font-size="9.2" fill="#475569">U+0000 ~ U+007F　与 ASCII 完全兼容</text>

  <text x="52" y="129" font-size="9.4" font-weight="700" fill="#334155" text-anchor="end">2 字节</text>
  <rect x="60" y="112" width="120" height="26" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="120" y="130" font-size="10.2" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan fill="#dc2626">110</tspan>xxxxx</text>
  <rect x="184" y="112" width="110" height="26" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="239" y="130" font-size="10.2" font-weight="700" fill="#1e3a8a" text-anchor="middle"><tspan fill="#94a3b8">10</tspan>xxxxxx</text>
  <text x="306" y="130" font-size="9.2" fill="#475569">U+0080 ~ U+07FF（希腊、西里尔、阿拉伯字母等）</text>

  <text x="52" y="159" font-size="9.4" font-weight="700" fill="#334155" text-anchor="end">3 字节</text>
  <rect x="60" y="142" width="120" height="26" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="120" y="160" font-size="10.2" font-weight="700" fill="#166534" text-anchor="middle"><tspan fill="#dc2626">1110</tspan>xxxx</text>
  <rect x="184" y="142" width="110" height="26" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="239" y="160" font-size="10.2" font-weight="700" fill="#166534" text-anchor="middle"><tspan fill="#94a3b8">10</tspan>xxxxxx</text>
  <rect x="298" y="142" width="110" height="26" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="353" y="160" font-size="10.2" font-weight="700" fill="#166534" text-anchor="middle"><tspan fill="#94a3b8">10</tspan>xxxxxx</text>
  <text x="420" y="160" font-size="9.2" fill="#166534">U+0800 ~ U+FFFF（BMP，常用汉字都在这）</text>

  <text x="52" y="189" font-size="9.4" font-weight="700" fill="#334155" text-anchor="end">4 字节</text>
  <rect x="60" y="172" width="120" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="190" font-size="10.2" font-weight="700" fill="#334155" text-anchor="middle"><tspan fill="#dc2626">11110</tspan>xxx</text>
  <rect x="184" y="172" width="110" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="239" y="190" font-size="10.2" font-weight="700" fill="#334155" text-anchor="middle"><tspan fill="#94a3b8">10</tspan>xxxxxx</text>
  <rect x="298" y="172" width="110" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="353" y="190" font-size="10.2" font-weight="700" fill="#334155" text-anchor="middle"><tspan fill="#94a3b8">10</tspan>xxxxxx</text>
  <rect x="412" y="172" width="110" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="467" y="190" font-size="10.2" font-weight="700" fill="#334155" text-anchor="middle"><tspan fill="#94a3b8">10</tspan>xxxxxx</text>
  <text x="532" y="190" font-size="9.2" fill="#475569">U+10000 以上（生僻字、emoji）</text>

  <line x1="24" y1="212" x2="696" y2="212" stroke="#e2e8f0" stroke-width="1"/>

  <text x="24" y="232" font-size="10.5" font-weight="700" fill="#334155">② 汉字「中」（U+4E2D）的 3 字节演算</text>

  <text x="24" y="254" font-size="10" fill="#475569">码点 4E2DH 展开成 16 位二进制：</text>
  <rect x="248" y="240" width="190" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="343" y="256" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">0100 1110 0010 1101</text>

  <text x="24" y="286" font-size="10" fill="#475569">按 4 / 6 / 6 位切成三段，填进 3 字节模板：</text>
  <rect x="248" y="272" width="44" height="22" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="270" y="288" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">0100</text>
  <rect x="296" y="272" width="60" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="326" y="288" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">111000</text>
  <rect x="360" y="272" width="60" height="22" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="390" y="288" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">101101</text>

  <rect x="248" y="306" width="130" height="30" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text x="313" y="326" font-size="10.2" font-weight="700" fill="#166534" text-anchor="middle">1110 0100 = E4H</text>
  <rect x="390" y="306" width="130" height="30" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text x="455" y="326" font-size="10.2" font-weight="700" fill="#166534" text-anchor="middle">10 111000 = B8H</text>
  <rect x="532" y="306" width="130" height="30" rx="3" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text x="597" y="326" font-size="10.2" font-weight="700" fill="#166534" text-anchor="middle">10 101101 = ADH</text>
  <text x="248" y="356" font-size="9.6" fill="#166534">首字节 E4 = 1110 0100 → 前缀 1110 说明「共 3 字节」；后两字节都以 10 开头，是续字节。</text>

  <line x1="24" y1="368" x2="696" y2="368" stroke="#e2e8f0" stroke-width="1"/>

  <text x="24" y="388" font-size="9.8" fill="#334155">· ASCII 是 7 位编码（最高位为 0），但存储占 1 字节；'A' = 65、'a' = 97，差 32。</text>
  <text x="24" y="404" font-size="9.8" fill="#334155">· GB2312 汉字内码固定 2 字节（两字节最高位都为 1）—— 与 UTF-8 汉字 3 字节是两套不同的编码，别混。</text>
</svg>
