<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512" width="680" height="512" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="512" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">四种 I/O 控制方式 · 看 CPU 被占了多少就知道谁更先进</text>
  <text x="20" y="46" font-size="12" fill="#64748b">红＝CPU 被 I/O 占着、蓝＝CPU 自由（设备/DMA/通道在干活）、深红点＝一次中断</text>

    <text x="100" y="78" font-size="9.5" fill="#94a3b8">时间 →</text>

  <text x="20" y="112" font-size="11" font-weight="700" fill="#991b1b">程序直接控制</text>
  <text x="20" y="128" font-size="9.5" fill="#64748b">（轮询）</text>
  <rect x="100" y="92" width="420" height="40" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="310" y="117" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">CPU 全程忙等：反复读状态寄存器，一个字一个字搬</text>
  <text x="530" y="110" font-size="10" fill="#991b1b">单位：字</text>
  <text x="530" y="126" font-size="9.5" fill="#64748b">完全串行，最慢</text>

  <text x="20" y="202" font-size="11" font-weight="700" fill="#1e40af">中断驱动</text>
  <text x="20" y="218" font-size="9.5" fill="#64748b">（可抢占）</text>
  <rect x="100" y="182" width="420" height="40" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <rect x="100" y="182" width="26" height="40" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="113" y="207" font-size="8.5" fill="#991b1b" text-anchor="middle">发命令</text>
  <rect x="126" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="176" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="226" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="276" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="326" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="376" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="426" y="182" width="8" height="40" fill="#f87171"/>
  <rect x="476" y="182" width="8" height="40" fill="#f87171"/>
  <text x="310" y="207" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">设备准备数据时可并行，但每传一个字就打断 CPU 一次</text>
  <text x="530" y="200" font-size="10" fill="#1e3a8a">单位：字</text>
  <text x="530" y="216" font-size="9.5" fill="#64748b">中断太密，块设备受不了</text>

  <text x="20" y="292" font-size="11" font-weight="700" fill="#166534">DMA</text>
  <text x="20" y="308" font-size="9.5" fill="#64748b">（直接存储存取）</text>
  <rect x="100" y="272" width="26" height="40" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="113" y="297" font-size="8.5" fill="#991b1b" text-anchor="middle">预处理</text>
  <rect x="126" y="272" width="368" height="40" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="310" y="297" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">DMA 控制器直接搬整块，CPU 不参与</text>
  <rect x="494" y="272" width="26" height="40" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="507" y="297" font-size="8.5" fill="#991b1b" text-anchor="middle">后处理</text>
  <text x="530" y="290" font-size="10" fill="#166534">单位：块</text>
  <text x="530" y="306" font-size="9.5" fill="#64748b">只在首尾介入</text>

  <text x="20" y="382" font-size="11" font-weight="700" fill="#3730a3">通道</text>
  <text x="20" y="398" font-size="9.5" fill="#64748b">（专用 I/O 处理机）</text>
  <rect x="100" y="362" width="18" height="40" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="109" y="387" font-size="8" fill="#991b1b" text-anchor="middle">一条</text>
  <rect x="118" y="362" width="402" height="40" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="319" y="387" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">通道执行内存里的通道程序，自己管多台设备、多个阶段</text>
  <text x="530" y="380" font-size="10" fill="#3730a3">单位：一组块</text>
  <text x="530" y="396" font-size="9.5" fill="#64748b">CPU 只发一条指令</text>

  <rect x="20" y="416" width="640" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="441" font-size="10.5" fill="#334155">演进主线：<tspan font-weight="700">CPU 干预越来越少、传输单位越来越大、并行度越来越高</tspan>——每一种都在修前一种的痛点。</text>

  <rect x="20" y="464" width="640" height="40" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="489" font-size="10.5" fill="#92400e">DMA 与通道的关键差别：<tspan font-weight="700">DMA 由 CPU 预设参数、通常只管一台设备；通道靠执行程序动态取参，能管多台</tspan>。</text>
</svg>
