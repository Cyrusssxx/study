<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">SRAM 与 DRAM 存储元 · 结构决定一切差异</text>
  <text x="20" y="48" font-size="12" fill="#64748b">触发器存信息 vs 电容电荷存信息：读出是否破坏、要不要刷新，全由结构决定</text>

  <rect x="20" y="66" width="312" height="196" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="88" font-size="13.5" font-weight="700" fill="#312e81">SRAM · 六管双稳态触发器</text>
  <rect x="46" y="106" width="86" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="89" y="130" font-size="11" fill="#312e81" text-anchor="middle">反相器 A</text>
  <rect x="212" y="106" width="86" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="255" y="130" font-size="11" fill="#312e81" text-anchor="middle">反相器 B</text>
  <line x1="132" y1="118" x2="212" y2="118" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="172" y="112" font-size="10" fill="#4f46e5" text-anchor="middle">交叉耦合</text>
  <line x1="212" y1="138" x2="132" y2="138" stroke="#4f46e5" stroke-width="1.4"/>
  <line x1="46" y1="158" x2="46" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="298" y1="158" x2="298" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="46" y1="180" x2="298" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="172" y="176" font-size="10.5" fill="#64748b" text-anchor="middle">字线 WL 选中 → 位线 BL / BL̄ 读出</text>
  <rect x="40" y="196" width="272" height="52" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="52" y="215" font-size="11.5" font-weight="700" fill="#065f46">读：非破坏性，触发器状态保持，无须再生</text>
  <text x="52" y="235" font-size="11.5" fill="#065f46">快、集成度低、功耗大、贵 → 作 Cache</text>

  <rect x="348" y="66" width="312" height="196" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="362" y="88" font-size="13.5" font-weight="700" fill="#312e81">DRAM · 1 管 1 电容（1T1C）</text>
  <line x1="380" y1="118" x2="628" y2="118" stroke="#b45309" stroke-width="1.4"/>
  <text x="384" y="112" font-size="10.5" fill="#b45309">字线 WL</text>
  <rect x="452" y="132" width="72" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="488" y="151" font-size="10.5" fill="#92400e" text-anchor="middle">选通管 T</text>
  <line x1="488" y1="162" x2="488" y2="186" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="470" y1="186" x2="506" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <line x1="470" y1="194" x2="506" y2="194" stroke="#94a3b8" stroke-width="2"/>
  <text x="524" y="192" font-size="11" fill="#475569">电容 C（有电荷 = 1）</text>
  <line x1="560" y1="118" x2="560" y2="224" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="566" y="216" font-size="10.5" fill="#64748b">位线 BL</text>
  <rect x="356" y="196" width="296" height="52" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="368" y="215" font-size="11.5" font-weight="700" fill="#991b1b">读：破坏性读出，电荷流失必须再生（读出即刷新）</text>
  <text x="368" y="235" font-size="11.5" fill="#991b1b">慢、集成度高、便宜、需定时刷新 → 作主存</text>

  <rect x="20" y="276" width="640" height="58" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="298" font-size="12.5" font-weight="700" fill="#312e81">由结构推出的三条必考结论</text>
  <text x="34" y="319" font-size="11.5" fill="#3730a3">① DRAM 必须刷新（电容漏电）且行列地址复用，地址线减半；② DRAM 读出后要再生，SRAM 不用；③ 二者都是随机存取，断电都丢数据（易失）。</text>

  <rect x="20" y="344" width="640" height="50" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="34" y="365" font-size="11.5" font-weight="700" fill="#475569">对比速记</text>
  <text x="34" y="384" font-size="11.5" fill="#475569">存储元：6 管 / 1 管 1 电容　｜　读出：非破坏 / 破坏　｜　刷新：无 / 有　｜　用途：Cache / 主存　｜　速度：快 / 慢　｜　成本：高 / 低</text>
</svg>
