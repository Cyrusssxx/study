<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412" width="680" height="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="bwArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="412" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">总线带宽只有一个算法 · 宽度(位) ÷ 8 × 工作频率</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">时钟频率 ≠ 工作频率；宽度是位、带宽是字节 —— 中间那个 ÷ 8 漏掉，答案就差 8 倍</text>

  <text x="20" y="70" font-size="9.5" font-weight="700" fill="#334155">题目通常只给这三个物理参数</text>

  <rect x="20" y="78" width="200" height="62" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="97" font-size="9.5" font-weight="700" fill="#334155">总线宽度</text>
  <text x="34" y="116" font-size="12" font-weight="700" fill="#1e3a8a">16 位 ＝ 2 B</text>
  <text x="34" y="132" font-size="8.5" fill="#64748b">数据线条数，决定一次能并行搬多少位</text>

  <rect x="240" y="78" width="200" height="62" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="254" y="97" font-size="9.5" font-weight="700" fill="#334155">总线时钟频率</text>
  <text x="254" y="116" font-size="12" font-weight="700" fill="#1e3a8a">11 MHz</text>
  <text x="254" y="132" font-size="8.5" fill="#64748b">时钟周期的倒数，早期与 CPU 同频</text>

  <rect x="460" y="78" width="200" height="62" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="474" y="97" font-size="9.5" font-weight="700" fill="#334155">每周期传输次数</text>
  <text x="474" y="116" font-size="12" font-weight="700" fill="#1e3a8a">2 次</text>
  <text x="474" y="132" font-size="8.5" fill="#64748b">早期 1 次，现代 2、4 次甚至更多</text>

  <path d="M 120 140 L 120 158" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#bwArr)"/>
  <path d="M 340 140 L 340 158" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#bwArr)"/>
  <path d="M 560 140 L 560 158" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#bwArr)"/>

  <rect x="20" y="162" width="640" height="70" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="36" y="184" font-size="10" font-weight="700" fill="#1e3a8a">带宽 ＝ 总线宽度(位) ÷ 8 × 总线工作频率　（工作频率 ＝ 时钟频率 × 每周期传输次数）</text>
  <text x="36" y="206" font-size="11" font-weight="700" fill="#1e40af">＝ 16 ÷ 8 × (11 MHz × 2) ＝ 2 B × 22 M ＝ 44 MB/s</text>
  <text x="36" y="221" font-size="8.5" fill="#64748b">单位对照：宽度是「位」、带宽是「字节/秒」，频率是「次/秒」—— 三者相乘前先把位换成字节</text>

  <rect x="20" y="240" width="310" height="112" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="259" font-size="10" font-weight="700" fill="#0f172a">算例逐步走（真题最常给的三个数）</text>
  <text x="34" y="278" font-size="9" fill="#334155">① 时钟 11 MHz、每周期传 2 次 → 工作频率 22 M 次/s</text>
  <text x="34" y="296" font-size="9" fill="#334155">② 宽度 16 位 → 每次搬 16 ÷ 8 ＝ 2 B</text>
  <text x="34" y="314" font-size="9" fill="#334155">③ 带宽 ＝ 2 B × 22 M ＝ 44 MB/s</text>
  <text x="34" y="336" font-size="8.5" fill="#b45309">若一次总线事务占 k 个时钟周期，则工作频率 ＝ 时钟 ÷ k</text>

  <rect x="346" y="240" width="314" height="112" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="360" y="259" font-size="10" font-weight="700" fill="#0f172a">提高带宽只有三条路</text>
  <text x="360" y="278" font-size="9" fill="#166534">✓ 加宽数据线（宽度 ↑）</text>
  <text x="360" y="296" font-size="9" fill="#166534">✓ 提高工作频率（一个时钟多传几次也算）</text>
  <text x="360" y="314" font-size="9" fill="#166534">✓ 减少一次传输的握手开销</text>
  <text x="360" y="336" font-size="9" fill="#b91c1c">✗ 加宽地址线只扩大寻址空间，对带宽没有直接帮助</text>

  <rect x="20" y="362" width="640" height="40" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="32" y="380" font-size="9.5" fill="#92400e"><tspan font-weight="700">三个指标各测什么</tspan>：总线宽度看「一次搬多少位」、总线带宽看「每秒搬多少字节」、总线复用看「同一组线在不同时刻干不同活」。</text>
  <text x="32" y="395" font-size="9.5" fill="#92400e">带宽按物理参数算理论峰值，<tspan font-weight="700">不必</tspan>考虑地址/命令开销与突发细节；只有求「平均数据传输率」时才分析事务时序。</text>
</svg>
