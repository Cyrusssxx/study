<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 474" width="680" height="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="474" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">虚实地址变换：位段怎么切、TLB 与 Cache 各用哪几位</text>
  <text x="20" y="46" font-size="11.5" fill="#64748b">设定：虚拟地址 14 位、物理地址 12 位、页 64B；TLB 4 路组相联共 16 条目；Cache 直接映射、16 组、行 4B。</text>

  <text x="20" y="84" font-size="10.5" font-weight="700" fill="#1e40af">虚拟地址 14 位</text>
  <rect x="150" y="64" width="216" height="32" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="258" y="85" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">TLB 标记 6</text>
  <rect x="366" y="64" width="72" height="32" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="402" y="85" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">组索引 2</text>
  <rect x="438" y="64" width="216" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="546" y="85" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">页内偏移 6</text>
  <text x="20" y="112" font-size="10" fill="#64748b">14 − 6 = 8 位虚拟页号，再按 16÷4 = 4 组拆成：低 2 位当组索引、余下 6 位当 TLB 标记。</text>

  <text x="20" y="146" font-size="10.5" font-weight="700" fill="#166534">物理地址 12 位</text>
  <rect x="150" y="126" width="216" height="32" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="258" y="147" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">物理页号 PPN 6</text>
  <rect x="366" y="126" width="216" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="474" y="147" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">页内偏移 6</text>

  <rect x="150" y="166" width="72" height="24" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="186" y="182" font-size="9" fill="#92400e" text-anchor="middle">高 2 位</text>
  <rect x="222" y="166" width="144" height="24" fill="#bbf7d0" stroke="#86efac" stroke-width="1"/>
  <text x="294" y="182" font-size="9" fill="#166534" text-anchor="middle">低 4 位 → Cache 索引</text>
  <rect x="366" y="166" width="144" height="24" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="438" y="182" font-size="9" fill="#92400e" text-anchor="middle">高 4 位</text>
  <rect x="510" y="166" width="72" height="24" fill="#bbf7d0" stroke="#86efac" stroke-width="1"/>
  <text x="546" y="182" font-size="8.5" fill="#166534" text-anchor="middle">块内 2</text>

  <text x="20" y="212" font-size="10.5" font-weight="700" fill="#1e40af">Cache 侧拼法</text>
  <rect x="150" y="196" width="216" height="26" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="258" y="214" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">Cache 标记 6 ＝ PPN 高 2 + 偏移高 4</text>
  <rect x="366" y="196" width="144" height="26" fill="#bbf7d0" stroke="#86efac" stroke-width="1"/>
  <text x="438" y="214" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">索引 4</text>
  <rect x="510" y="196" width="72" height="26" fill="#bbf7d0" stroke="#86efac" stroke-width="1"/>
  <text x="546" y="214" font-size="9.5" fill="#166534" text-anchor="middle">块内 2</text>

  <text x="20" y="244" font-size="10" fill="#991b1b">Cache 标记由物理地址上<tspan font-weight="700">两段不连续的位</tspan>拼成（PPN 高 2 位 + 页内偏移高 4 位），中间隔着 4 位索引。</text>
  <text x="20" y="264" font-size="10" fill="#64748b">所以不能把物理地址简单横切成「标记｜索引｜偏移」——这是本题最容易画错的一步。</text>

  <rect x="20" y="278" width="200" height="140" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="32" y="298" font-size="10.5" font-weight="700" fill="#166534">0x03D4：TLB 命中</text>
  <text x="32" y="318" font-size="9.5" fill="#14532d">VPN 0x0F ｜ 偏移 0x14</text>
  <text x="32" y="338" font-size="9.5" fill="#14532d">TLB 命中 → PPN 0x0D</text>
  <text x="32" y="358" font-size="9.5" fill="#14532d">物理地址 = 0x0D×64+0x14</text>
  <text x="32" y="378" font-size="9.5" font-weight="700" fill="#166534">= 0x354，Cache 命中 36H</text>

  <rect x="240" y="278" width="200" height="140" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="252" y="298" font-size="10.5" font-weight="700" fill="#92400e">0x00F1：TLB 未命中</text>
  <text x="252" y="318" font-size="9.5" fill="#78350f">VPN 0x03 ｜ 偏移 0x31</text>
  <text x="252" y="338" font-size="9.5" fill="#78350f">查页表：有效位 1、PPN 0x02</text>
  <text x="252" y="358" font-size="9.5" fill="#78350f">物理地址 = 0x02×64+0x31</text>
  <text x="252" y="378" font-size="9.5" font-weight="700" fill="#92400e">= 0x0B1，Cache 未命中</text>

  <rect x="460" y="278" width="200" height="140" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="472" y="298" font-size="10.5" font-weight="700" fill="#991b1b">0x0229：缺页</text>
  <text x="472" y="318" font-size="9.5" fill="#7f1d1d">VPN 0x08 ｜ 偏移 0x29</text>
  <text x="472" y="338" font-size="9.5" fill="#7f1d1d">查页表：页表项有效位 0</text>
  <text x="472" y="358" font-size="9.5" fill="#7f1d1d">页面不在主存 → 缺页中断</text>
  <text x="472" y="378" font-size="9.5" font-weight="700" fill="#991b1b">先从外存调入，再重执行</text>

  <rect x="20" y="430" width="640" height="34" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="452" font-size="10.5" fill="#92400e">顺序永远是：查 TLB → 未命中查页表（顺手回填 TLB）→ 有效位 0 则缺页 → 用物理地址查 Cache → 再未命中才访存。</text>
</svg>
