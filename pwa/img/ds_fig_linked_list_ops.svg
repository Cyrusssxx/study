<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="lkA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="lkR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="lkG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">单链表插入 / 删除 · 指针改写的先后顺序</text>
  <text x="20" y="48" font-size="12" fill="#64748b">后插两句不能反：先让新结点接住后继，再让前驱指向新结点；删除要先存下被删结点</text>

  <text x="20" y="80" font-size="12.5" font-weight="700" fill="#312e81">① 在 p 之后插入 s（图中 p 指向 B）</text>

  <text x="20" y="131" font-size="11.5" fill="#475569">head</text>
  <line x1="52" y1="126" x2="60" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#lkA)"/>

  <rect x="62" y="108" width="58" height="36" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="98" y1="108" x2="98" y2="144" stroke="#4f46e5" stroke-width="1"/>
  <text x="80" y="131" font-size="12" fill="#312e81" text-anchor="middle">A</text>
  <circle cx="110" cy="126" r="2.6" fill="#4f46e5"/>

  <line x1="120" y1="126" x2="150" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#lkA)"/>

  <rect x="152" y="108" width="58" height="36" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.6"/>
  <line x1="188" y1="108" x2="188" y2="144" stroke="#4338ca" stroke-width="1"/>
  <text x="170" y="131" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">B</text>
  <circle cx="200" cy="126" r="2.6" fill="#4338ca"/>
  <text x="152" y="102" font-size="10.5" font-weight="700" fill="#4338ca">p</text>

  <line x1="210" y1="126" x2="240" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#lkA)"/>

  <rect x="242" y="108" width="58" height="36" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="278" y1="108" x2="278" y2="144" stroke="#4f46e5" stroke-width="1"/>
  <text x="260" y="131" font-size="12" fill="#312e81" text-anchor="middle">C</text>
  <circle cx="290" cy="126" r="2.6" fill="#4f46e5"/>

  <line x1="300" y1="126" x2="324" y2="126" stroke="#64748b" stroke-width="1.4" marker-end="url(#lkA)"/>
  <text x="330" y="130" font-size="11" fill="#94a3b8">NULL</text>

  <rect x="152" y="204" width="58" height="36" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <line x1="188" y1="204" x2="188" y2="240" stroke="#059669" stroke-width="1"/>
  <text x="170" y="227" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">s</text>
  <circle cx="200" cy="222" r="2.6" fill="#059669"/>
  <text x="152" y="198" font-size="10.5" font-weight="700" fill="#059669">新结点</text>

  <polyline points="210,222 238,222 238,126 240,126" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#lkR)"/>
  <text x="246" y="180" font-size="11.5" font-weight="700" fill="#dc2626">①</text>

  <line x1="181" y1="144" x2="181" y2="202" stroke="#059669" stroke-width="1.8" marker-end="url(#lkG)"/>
  <text x="174" y="180" font-size="11.5" font-weight="700" fill="#059669" text-anchor="end">②</text>

  <rect x="396" y="92" width="264" height="152" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="412" y="114" font-size="11.5" font-weight="700" fill="#065f46">正确顺序（两步，缺一不可）</text>
  <text x="412" y="138" font-size="11.5" fill="#166534">① <tspan font-weight="700">s-&gt;next = p-&gt;next;</tspan></text>
  <text x="412" y="156" font-size="10.5" fill="#4ade80">　先让 s 记住原来的后继 C</text>
  <text x="412" y="180" font-size="11.5" fill="#166534">② <tspan font-weight="700">p-&gt;next = s;</tspan></text>
  <text x="412" y="198" font-size="10.5" fill="#4ade80">　再让 p 指向新结点</text>
  <text x="412" y="224" font-size="10.5" fill="#059669">两句都是 O(1)：已定位 p 就不必再遍历</text>

  <rect x="396" y="256" width="264" height="112" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="412" y="278" font-size="11.5" font-weight="700" fill="#991b1b">顺序反了会怎样</text>
  <text x="404" y="300" font-size="11" fill="#b91c1c">先 p-&gt;next = s，再 s-&gt;next = p-&gt;next</text>
  <text x="412" y="320" font-size="11" fill="#b91c1c">此时 p-&gt;next 已经是 s，</text>
  <text x="412" y="338" font-size="11" font-weight="700" fill="#dc2626">s-&gt;next 就指向了自己</text>
  <text x="412" y="358" font-size="10.5" fill="#94a3b8">C 及其之后的整条链全部丢失</text>

  <text x="20" y="296" font-size="12.5" font-weight="700" fill="#312e81">② 删除 p 的后继 q（O(1)，不必找前驱）</text>

  <rect x="62" y="316" width="58" height="36" rx="4" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.4"/>
  <line x1="98" y1="316" x2="98" y2="352" stroke="#4338ca" stroke-width="1"/>
  <text x="80" y="339" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">p</text>

  <line x1="120" y1="334" x2="150" y2="334" stroke="#64748b" stroke-width="1.4" marker-end="url(#lkA)"/>

  <rect x="152" y="316" width="58" height="36" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="188" y1="316" x2="188" y2="352" stroke="#cbd5e1" stroke-width="1"/>
  <text x="170" y="339" font-size="12" fill="#94a3b8" text-anchor="middle">q</text>
  <line x1="152" y1="316" x2="210" y2="352" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="210" y1="316" x2="152" y2="352" stroke="#dc2626" stroke-width="1.6"/>

  <line x1="210" y1="334" x2="240" y2="334" stroke="#64748b" stroke-width="1.4" marker-end="url(#lkA)"/>

  <rect x="242" y="316" width="58" height="36" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <line x1="278" y1="316" x2="278" y2="352" stroke="#4f46e5" stroke-width="1"/>
  <text x="260" y="339" font-size="12" fill="#312e81" text-anchor="middle">r</text>

  <text x="330" y="330" font-size="11.5" fill="#334155">q = p-&gt;next;</text>
  <text x="330" y="348" font-size="11.5" fill="#334155">p-&gt;next = q-&gt;next; free(q);</text>
  <text x="330" y="366" font-size="10.5" fill="#94a3b8">先存 q，否则释放后再取 q-&gt;next 就是野指针</text>

  <text x="20" y="398" font-size="11.5" fill="#475569">③ O(1) 前插技巧：在 p 之后插入 s，再 <tspan font-weight="700">交换 s 与 p 的 data 域</tspan> ⇒ 效果等于插在 p 之前。</text>
  <text x="20" y="418" font-size="11.5" fill="#475569">　 同理删 p 本身：把后继数据复制到 p，再删后继 —— <tspan font-weight="700">p 是尾结点时失效</tspan>（找不到前驱）。</text>

  <rect x="20" y="434" width="640" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="455" font-size="11.5" font-weight="700" fill="#312e81">易错：① 头插法建表 → 元素次序与输入相反；尾插法要设尾指针 r 才是 O(1)，否则每插一个都 O(n)。</text>
  <text x="34" y="475" font-size="11.5" fill="#3730a3">② 不带头结点时，首部插入 / 删除必须回传修改头指针（C 用 LinkList *L 或二级指针）。</text>
</svg>
