<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="550" fill="#ffffff"/>
  <text x="40" y="28" font-size="16" font-weight="700" fill="#312e81">直接插入排序 · i 与 j 怎么比</text>
  <text x="40" y="48" font-size="12" fill="#64748b">A = [49, 38, 65, 97, 76, 13, 27, 49′]；i = 2…8 指向待插入元素，j = i−1 在有序区从右往左比</text>
  <text x="40" y="70" font-size="13" fill="#1e293b">放大 i = 8 这一趟：key = 49′，左边 1–7 位已有序</text>

  <text x="69" y="92" font-size="11" text-anchor="middle" fill="#64748b">1</text>
  <text x="132" y="92" font-size="11" text-anchor="middle" fill="#64748b">2</text>
  <text x="195" y="92" font-size="11" text-anchor="middle" fill="#64748b">3</text>
  <text x="258" y="92" font-size="11" text-anchor="middle" fill="#64748b">4</text>
  <text x="321" y="92" font-size="11" text-anchor="middle" fill="#64748b">5</text>
  <text x="384" y="92" font-size="11" text-anchor="middle" fill="#64748b">6</text>
  <text x="447" y="92" font-size="11" text-anchor="middle" fill="#64748b">7</text>
  <text x="510" y="92" font-size="11" text-anchor="middle" fill="#64748b">8</text>

  <rect x="40" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="69" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">13</text>
  <rect x="103" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="132" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">27</text>
  <rect x="166" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="195" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">38</text>
  <rect x="229" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="258" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">49</text>
  <rect x="292" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="321" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">65</text>
  <rect x="355" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="384" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">76</text>
  <rect x="418" y="100" width="58" height="40" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="447" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">97</text>
  <rect x="481" y="100" width="58" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="510" y="120" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e293b">49′</text>
  <text x="447" y="156" font-size="11" text-anchor="middle" fill="#64748b">j=7 开始</text>
  <text x="510" y="156" font-size="11" text-anchor="middle" fill="#64748b">i=8, key=49′</text>

  <text x="40" y="184" font-size="12" fill="#1e293b">1) j=7：97 &gt; 49′ → 97 后移到第 8 位（第 1 次移动），j←6</text>
  <text x="40" y="206" font-size="12" fill="#1e293b">2) j=6：76 &gt; 49′ → 76 后移到第 7 位（第 2 次移动），j←5</text>
  <text x="40" y="228" font-size="12" fill="#1e293b">3) j=5：65 &gt; 49′ → 65 后移到第 6 位（第 3 次移动），j←4</text>
  <text x="40" y="250" font-size="12" fill="#1e293b">4) j=4：49 &gt; 49′ 为假（相等不移动，稳定）→ 49′ 写入第 5 位</text>
  <text x="40" y="278" font-size="13" fill="#1e293b">结果：[13, 27, 38, 49, 49′, 65, 76, 97]；本趟比 4 次、移 3 次</text>

  <text x="40" y="312" font-size="13" fill="#1e293b">逐趟统计（移动 = 元素后移一格，不含 key 的暂存与写回）</text>
  <text x="44" y="336" font-size="11" fill="#64748b">i</text>
  <text x="104" y="336" font-size="11" fill="#64748b">key</text>
  <text x="170" y="336" font-size="11" fill="#64748b">比较次数</text>
  <text x="252" y="336" font-size="11" fill="#64748b">移动次数</text>
  <text x="336" y="336" font-size="11" fill="#64748b">这一趟发生了什么</text>
  <path d="M40 344H630" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>

  <text x="44" y="362" font-size="12" fill="#1e293b">2</text><text x="104" y="362" font-size="12" fill="#1e293b">38</text><text x="170" y="362" font-size="12" fill="#1e293b">1</text><text x="252" y="362" font-size="12" fill="#1e293b">1</text><text x="336" y="362" font-size="12" fill="#1e293b">49 后移 1 格</text>
  <text x="44" y="382" font-size="12" fill="#1e293b">3</text><text x="104" y="382" font-size="12" fill="#1e293b">65</text><text x="170" y="382" font-size="12" fill="#1e293b">1</text><text x="252" y="382" font-size="12" fill="#1e293b">0</text><text x="336" y="382" font-size="12" fill="#1e293b">49 不 &gt; 65，原位</text>
  <text x="44" y="402" font-size="12" fill="#1e293b">4</text><text x="104" y="402" font-size="12" fill="#1e293b">97</text><text x="170" y="402" font-size="12" fill="#1e293b">1</text><text x="252" y="402" font-size="12" fill="#1e293b">0</text><text x="336" y="402" font-size="12" fill="#1e293b">65 不 &gt; 97，原位</text>
  <text x="44" y="422" font-size="12" fill="#1e293b">5</text><text x="104" y="422" font-size="12" fill="#1e293b">76</text><text x="170" y="422" font-size="12" fill="#1e293b">2</text><text x="252" y="422" font-size="12" fill="#1e293b">1</text><text x="336" y="422" font-size="12" fill="#1e293b">97 后移 1 格</text>
  <text x="44" y="442" font-size="12" fill="#1e293b">6</text><text x="104" y="442" font-size="12" fill="#1e293b">13</text><text x="170" y="442" font-size="12" fill="#1e293b">5</text><text x="252" y="442" font-size="12" fill="#1e293b">5</text><text x="336" y="442" font-size="12" fill="#1e293b">97/76/65/49/38 全后移</text>
  <text x="44" y="462" font-size="12" fill="#1e293b">7</text><text x="104" y="462" font-size="12" fill="#1e293b">27</text><text x="170" y="462" font-size="12" fill="#1e293b">6</text><text x="252" y="462" font-size="12" fill="#1e293b">5</text><text x="336" y="462" font-size="12" fill="#1e293b">38~97 后移，13 停</text>
  <text x="44" y="482" font-size="12" fill="#1e293b">8</text><text x="104" y="482" font-size="12" fill="#1e293b">49′</text><text x="170" y="482" font-size="12" fill="#1e293b">4</text><text x="252" y="482" font-size="12" fill="#1e293b">3</text><text x="336" y="482" font-size="12" fill="#1e293b">97/76/65 后移，49 停</text>
  <path d="M40 492H630" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="44" y="512" font-size="12" fill="#1e293b">合计</text><text x="170" y="512" font-size="12" fill="#1e293b">20</text><text x="252" y="512" font-size="12" fill="#1e293b">15</text>
  <text x="40" y="536" font-size="11" fill="#64748b">最好 7 比 0 移（已有序） · 最坏 28 比 28 移（逆序） · 本例 20 / 15</text>
</svg>
