<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" width="680" height="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="448" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">二叉树的四种遍历 · 同一棵树、四条访问序列</text>
  <text x="20" y="48" font-size="12" fill="#64748b">先序 / 中序 / 后序的差别只在「根」被访问的时机；层序靠队列，逐层从左到右</text>

  <g stroke="#cbd5e1" stroke-width="1.3">
    <line x1="200" y1="87" x2="120" y2="119"/>
    <line x1="200" y1="87" x2="280" y2="119"/>
    <line x1="120" y1="149" x2="70" y2="181"/>
    <line x1="120" y1="149" x2="160" y2="181"/>
    <line x1="280" y1="149" x2="240" y2="181"/>
    <line x1="280" y1="149" x2="330" y2="181"/>
    <line x1="70" y1="211" x2="40" y2="243"/>
  </g>

  <circle cx="200" cy="72" r="15" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="200" y="77" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">A</text>
  <circle cx="120" cy="134" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="120" y="139" font-size="12.5" fill="#312e81" text-anchor="middle">B</text>
  <circle cx="280" cy="134" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="280" y="139" font-size="12.5" fill="#312e81" text-anchor="middle">C</text>
  <circle cx="70" cy="196" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="70" y="201" font-size="12.5" fill="#312e81" text-anchor="middle">D</text>
  <circle cx="160" cy="196" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="160" y="201" font-size="12.5" fill="#312e81" text-anchor="middle">E</text>
  <circle cx="240" cy="196" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="240" y="201" font-size="12.5" fill="#312e81" text-anchor="middle">F</text>
  <circle cx="330" cy="196" r="15" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="330" y="201" font-size="12.5" fill="#312e81" text-anchor="middle">G</text>
  <circle cx="40" cy="258" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="40" y="263" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">H</text>

  <text x="386" y="76" font-size="12" font-weight="700" fill="#4338ca">先序（NLR）根 → 左 → 右</text>
  <text x="386" y="96" font-size="12.5" fill="#312e81">A　B　D　H　E　C　F　G</text>
  <text x="386" y="126" font-size="12" font-weight="700" fill="#059669">中序（LNR）左 → 根 → 右</text>
  <text x="386" y="146" font-size="12.5" fill="#065f46">H　D　B　E　A　F　C　G</text>
  <text x="386" y="176" font-size="12" font-weight="700" fill="#b45309">后序（LRN）左 → 右 → 根</text>
  <text x="386" y="196" font-size="12.5" fill="#92400e">H　D　B　E　F　G　C　A</text>
  <text x="386" y="226" font-size="12" font-weight="700" fill="#7c3aed">层序（队列，逐层从左到右）</text>
  <text x="386" y="246" font-size="12.5" fill="#5b21b6">A　B　C　D　E　F　G　H</text>

  <text x="20" y="300" font-size="12.5" font-weight="700" fill="#312e81">由两种序列还原二叉树</text>
  <text x="20" y="322" font-size="11.5" fill="#334155">先序定根（第一个）· 后序定根（最后一个）· 中序用根把左右子树切开 → 递归即可唯一确定。</text>
  <text x="20" y="342" font-size="11.5" fill="#334155">本例：先序首元 A 为根，中序 <tspan font-weight="700">H D B E</tspan> | A | <tspan font-weight="700">F C G</tspan> ⇒ 左子树 4 个结点（B 为根）、右子树 3 个（C 为根）。</text>

  <rect x="20" y="356" width="640" height="80" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="378" font-size="11.5" font-weight="700" fill="#312e81">易错：</text>
  <text x="34" y="398" font-size="11.5" fill="#3730a3">① <tspan font-weight="700">先序 + 后序不能唯一确定</tspan>一棵二叉树（分不清只有一个孩子时是左还是右）；必须配上中序（或层序）。</text>
  <text x="34" y="418" font-size="11.5" fill="#3730a3">② 中序 + 层序也能唯一确定；③ 遍历序列相同 ≠ 树相同，先序与中序相同只可能是「只有右孩子」的单链。</text>
</svg>
