<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 496" width="680" height="496" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="496" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">FCFS 与 SJF 跑同一组作业 · 差就差在 10.0 那一刻把 CPU 给谁</text>
  <text x="20" y="46" font-size="12" fill="#64748b">四个作业提交于 8.0 / 8.4 / 8.8 / 9.0，运行 2 / 1 / 0.5 / 0.2</text>

  <text x="20" y="86" font-size="11.5" font-weight="700" fill="#991b1b">FCFS：按到达顺序，J4 排在最后</text>
  <text x="20" y="122" font-size="10.5" font-weight="700" fill="#334155" text-anchor="end">FCFS</text>
  <rect x="70" y="104" width="270" height="28" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="205" y="123" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">J1（2）</text>
  <rect x="340" y="104" width="135" height="28" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="407" y="123" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">J2（1）</text>
  <rect x="475" y="104" width="67.5" height="28" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="508" y="123" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">J3</text>
  <rect x="542.5" y="104" width="27" height="28" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="588" y="123" font-size="10" fill="#991b1b">J4 等了 2.5</text>

  <text x="20" y="188" font-size="11.5" font-weight="700" fill="#166534">SJF：10.0 一到，先挑最短的 J4，再 J3，最后才 J2</text>
  <text x="20" y="224" font-size="10.5" font-weight="700" fill="#334155" text-anchor="end">SJF</text>
  <rect x="70" y="206" width="270" height="28" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="205" y="225" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">J1（2）</text>
  <rect x="340" y="206" width="27" height="28" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <rect x="367" y="206" width="67.5" height="28" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="225" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">J3</text>
  <rect x="434.5" y="206" width="135" height="28" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="502" y="225" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">J2（1）</text>
  <text x="353" y="196" font-size="9" fill="#15803d" text-anchor="middle">J4</text>

  <line x1="70" y1="246" x2="610" y2="246" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="262" font-size="9.5" fill="#94a3b8" text-anchor="middle">8.0</text>
  <text x="205" y="262" font-size="9.5" fill="#94a3b8" text-anchor="middle">9.0</text>
  <text x="340" y="262" font-size="9.5" fill="#94a3b8" text-anchor="middle">10.0</text>
  <text x="475" y="262" font-size="9.5" fill="#94a3b8" text-anchor="middle">11.0</text>
  <text x="610" y="262" font-size="9.5" fill="#94a3b8" text-anchor="middle">12.0</text>
  <line x1="340" y1="96" x2="340" y2="252" stroke="#4a7ab8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="344" y="94" font-size="9" fill="#4a7ab8">t=10.0 决策点</text>

  <text x="20" y="292" font-size="11.5" font-weight="700" fill="#334155">算出来的三张表</text>

  <rect x="20" y="302" width="312" height="22" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="72" y="317" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">FCFS</text>
  <text x="124" y="317" font-size="9.5" fill="#991b1b" text-anchor="middle">J1</text>
  <text x="176" y="317" font-size="9.5" fill="#991b1b" text-anchor="middle">J2</text>
  <text x="228" y="317" font-size="9.5" fill="#991b1b" text-anchor="middle">J3</text>
  <text x="280" y="317" font-size="9.5" fill="#991b1b" text-anchor="middle">J4</text>

  <rect x="20" y="324" width="312" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="339" font-size="9.5" fill="#475569" text-anchor="middle">等待</text>
  <text x="124" y="339" font-size="9.5" fill="#475569" text-anchor="middle">0</text>
  <text x="176" y="339" font-size="9.5" fill="#475569" text-anchor="middle">1.6</text>
  <text x="228" y="339" font-size="9.5" fill="#475569" text-anchor="middle">2.2</text>
  <text x="280" y="339" font-size="9.5" fill="#475569" text-anchor="middle">2.5</text>

  <rect x="20" y="346" width="312" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="361" font-size="9.5" fill="#475569" text-anchor="middle">周转</text>
  <text x="124" y="361" font-size="9.5" fill="#475569" text-anchor="middle">2</text>
  <text x="176" y="361" font-size="9.5" fill="#475569" text-anchor="middle">2.6</text>
  <text x="228" y="361" font-size="9.5" fill="#475569" text-anchor="middle">2.7</text>
  <text x="280" y="361" font-size="9.5" fill="#475569" text-anchor="middle">2.7</text>

  <rect x="20" y="368" width="312" height="26" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="46" y="385" font-size="9.5" fill="#991b1b" text-anchor="middle">带权</text>
  <text x="124" y="385" font-size="9.5" fill="#991b1b" text-anchor="middle">1</text>
  <text x="176" y="385" font-size="9.5" fill="#991b1b" text-anchor="middle">2.6</text>
  <text x="228" y="385" font-size="9.5" fill="#991b1b" text-anchor="middle">5.4</text>
  <text x="280" y="385" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">13.5</text>

  <rect x="348" y="302" width="312" height="22" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="317" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">SJF</text>
  <text x="452" y="317" font-size="9.5" fill="#166534" text-anchor="middle">J1</text>
  <text x="504" y="317" font-size="9.5" fill="#166534" text-anchor="middle">J2</text>
  <text x="556" y="317" font-size="9.5" fill="#166534" text-anchor="middle">J3</text>
  <text x="608" y="317" font-size="9.5" fill="#166534" text-anchor="middle">J4</text>

  <rect x="348" y="324" width="312" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="374" y="339" font-size="9.5" fill="#475569" text-anchor="middle">等待</text>
  <text x="452" y="339" font-size="9.5" fill="#475569" text-anchor="middle">0</text>
  <text x="504" y="339" font-size="9.5" fill="#475569" text-anchor="middle">2.3</text>
  <text x="556" y="339" font-size="9.5" fill="#475569" text-anchor="middle">1.4</text>
  <text x="608" y="339" font-size="9.5" fill="#475569" text-anchor="middle">1</text>

  <rect x="348" y="346" width="312" height="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="374" y="361" font-size="9.5" fill="#475569" text-anchor="middle">周转</text>
  <text x="452" y="361" font-size="9.5" fill="#475569" text-anchor="middle">2</text>
  <text x="504" y="361" font-size="9.5" fill="#475569" text-anchor="middle">3.3</text>
  <text x="556" y="361" font-size="9.5" fill="#475569" text-anchor="middle">1.9</text>
  <text x="608" y="361" font-size="9.5" fill="#475569" text-anchor="middle">1.2</text>

  <rect x="348" y="368" width="312" height="26" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="374" y="385" font-size="9.5" fill="#166534" text-anchor="middle">带权</text>
  <text x="452" y="385" font-size="9.5" fill="#166534" text-anchor="middle">1</text>
  <text x="504" y="385" font-size="9.5" fill="#166534" text-anchor="middle">3.3</text>
  <text x="556" y="385" font-size="9.5" fill="#166534" text-anchor="middle">3.8</text>
  <text x="608" y="385" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">6</text>

  <rect x="20" y="406" width="640" height="76" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="34" y="426" font-size="11.5" font-weight="700" fill="#92400e">三条平均值一起看结论</text>
  <text x="34" y="446" font-size="10.5" fill="#92400e">平均等待 1.575 → 1.175；平均周转 2.5 → 2.1；平均带权 5.625 → 3.525。指标全降，但 J2 反而变差（2.6 → 3.3）。</text>
  <text x="34" y="466" font-size="10.5" fill="#92400e">带权周转 13.5 是 FCFS 的「罪证」：J4 只跑 0.2 却等了 2.5，比值 12.5 倍——<tspan font-weight="700">短作业被拖长，就体现在这个数上</tspan>。</text>
</svg>
