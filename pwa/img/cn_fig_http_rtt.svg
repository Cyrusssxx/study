<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">HTTP 报文结构 与 RTT：非持久 8 RTT → 持久+流水线 2~3 RTT</text>
  <text x="20" y="46" font-size="11.5" fill="#64748b">例子取自本节：含 3 张图的页面；HTTP 面向文本，字段是 ASCII 串，每行以 CRLF 结束</text>

  <text x="30" y="70" font-size="11" font-weight="700" fill="#334155">请求 / 响应报文：开始行 + 首部行 + 空行 + 实体主体</text>
  <rect x="30" y="80" width="170" height="28" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="200" y="80" width="200" height="28" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <rect x="400" y="80" width="60" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="460" y="80" width="190" height="28" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="115" y="99" font-size="10.5" font-weight="700" fill="#3730a3" text-anchor="middle">请求行（方法 URL 版本）</text>
  <text x="300" y="99" font-size="10.5" fill="#3730a3" text-anchor="middle">首部行（Host / Cookie / …）</text>
  <text x="430" y="99" font-size="10" fill="#64748b" text-anchor="middle">空行</text>
  <text x="555" y="99" font-size="10.5" fill="#5b21b6" text-anchor="middle">实体主体（可为空）</text>
  <text x="30" y="124" font-size="9.5" fill="#64748b">例：GET /index.html HTTP/1.1 · 三个字段用空格分隔 · 行末 CRLF</text>

  <rect x="30" y="134" width="170" height="28" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <rect x="200" y="134" width="200" height="28" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <rect x="400" y="134" width="60" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="460" y="134" width="190" height="28" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="115" y="153" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">状态行（版本 状态码 短语）</text>
  <text x="300" y="153" font-size="10.5" fill="#166534" text-anchor="middle">首部行（Set-Cookie / ETag …）</text>
  <text x="430" y="153" font-size="10" fill="#64748b" text-anchor="middle">空行</text>
  <text x="555" y="153" font-size="10.5" fill="#92400e" text-anchor="middle">实体主体（304 时没有）</text>
  <text x="30" y="178" font-size="9.5" fill="#64748b">例：HTTP/1.1 200 OK · 304 Not Modified 只回首部、不含实体，继续用缓存</text>

  <text x="30" y="202" font-size="11" font-weight="700" fill="#334155">同一个页面（1 个 HTML + 3 张图）在两种连接方式下要花几个 RTT</text>

  <rect x="30" y="212" width="620" height="56" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="42" y="232" font-size="10.5" font-weight="700" fill="#991b1b">HTTP/1.0 非持久</text>
  <rect x="150" y="222" width="92" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <rect x="248" y="222" width="92" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <rect x="346" y="222" width="92" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <rect x="444" y="222" width="92" height="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="196" y="238" font-size="9.5" fill="#991b1b" text-anchor="middle">HTML 2RTT</text>
  <text x="294" y="238" font-size="9.5" fill="#991b1b" text-anchor="middle">图1 2RTT</text>
  <text x="392" y="238" font-size="9.5" fill="#991b1b" text-anchor="middle">图2 2RTT</text>
  <text x="490" y="238" font-size="9.5" fill="#991b1b" text-anchor="middle">图3 2RTT</text>
  <text x="560" y="238" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">= 8 RTT</text>
  <text x="42" y="258" font-size="9.5" fill="#7f1d1d">一对象一连接：1RTT 完成握手 + 1RTT 发请求收响应 → 2 + 3×2 = 8 RTT</text>

  <rect x="30" y="276" width="620" height="56" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="42" y="296" font-size="10.5" font-weight="700" fill="#166534">HTTP/1.1 持久+流水线</text>
  <rect x="150" y="286" width="386" height="24" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="343" y="302" font-size="9.5" fill="#166534" text-anchor="middle">1 个 TCP 连接复用：HTML → 图1 图2 图3 连续请求</text>
  <text x="580" y="302" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">≈ 2~3 RTT</text>
  <text x="42" y="322" font-size="9.5" fill="#166534">非流水线须等前一个响应；流水线可连发多个对象请求，取全部引用对象仅需 1RTT</text>

  <rect x="30" y="344" width="620" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="364" font-size="11" font-weight="700" fill="#334155">真题口径与易错点</text>
  <text x="42" y="384" font-size="10.5" fill="#475569">2024 真题 Q564：非持续且不支持并行，1 页 + 7 图 = 8 个对象 → 8×2 = 16 RTT。</text>
  <text x="42" y="402" font-size="10.5" fill="#475569">Q556：支持并行 TCP 时 = 2RTT（页）+ 2RTT（并行图）= 4RTT；Q551/Q555：100 图 + 1 html = 101 次 TCP。</text>
  <text x="42" y="420" font-size="10.5" fill="#475569">HTTP 三大特点：基于 TCP 保证可靠传输；HTTP 本身「无连接」（不必先建专门的 HTTP 连接）；「无状态」（靠 Cookie 补）。</text>
  <text x="42" y="438" font-size="10.5" fill="#475569">Cookie 存客户端、Session 存服务器；HEAD 只取首部不取实体；GET 幂等、POST 非幂等。</text>
  <text x="42" y="456" font-size="10.5" fill="#475569">HTTP 用 TCP 端口 80、DNS 用 UDP（Q548/Q549）；Connection: keep-alive = 持续、Close = 非持续（2015 Q562）。</text>
  <text x="42" y="476" font-size="10" fill="#b45309">结论：带宽大而 RTT 长时，减少 RTT 比加带宽更有效。</text>
</svg>
