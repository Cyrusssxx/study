<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ioArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ioTime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="540" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">三种 I/O 方式 · CPU 与外设并行度对比</text>
  <text x="20" y="48" font-size="12" fill="#64748b">同一段时间内 CPU 被占用多少，决定了三种方式的效率差别</text>
  <text x="660" y="62" font-size="11" fill="#94a3b8" text-anchor="end">时间 →</text>
  <line x1="136" y1="58" x2="590" y2="58" stroke="#cbd5e1" stroke-width="1" marker-end="url(#ioTime)"/>

  <rect x="16" y="76" width="648" height="138" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="128" y1="88" x2="128" y2="202" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="110" font-size="14" font-weight="700" fill="#312e81">程序查询</text>
  <text x="28" y="130" font-size="11" fill="#64748b">独占 / 定时查询</text>
  <text x="28" y="148" font-size="11" fill="#64748b">CPU 主动轮询</text>
  <text x="136" y="100" font-size="11" fill="#64748b">CPU</text>
  <rect x="136" y="106" width="516" height="28" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="394" y="124" font-size="11.5" fill="#991b1b" text-anchor="middle">CPU 全程循环查询状态 · 忙等，不能执行其他任务</text>
  <text x="136" y="146" font-size="11" fill="#64748b">外设</text>
  <rect x="136" y="152" width="300" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="286" y="170" font-size="11.5" fill="#065f46" text-anchor="middle">外设准备数据</text>
  <rect x="444" y="152" width="80" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="484" y="170" font-size="11" fill="#92400e" text-anchor="middle">传送 1 字</text>
  <rect x="136" y="186" width="516" height="24" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="146" y="202" font-size="11.5" fill="#312e81">CPU 与外设完全串行 · CPU 利用率最低，但硬件最简单</text>

  <rect x="16" y="222" width="648" height="138" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="128" y1="234" x2="128" y2="348" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="256" font-size="14" font-weight="700" fill="#312e81">程序中断</text>
  <text x="28" y="276" font-size="11" fill="#64748b">每字中断一次</text>
  <text x="28" y="294" font-size="11" fill="#64748b">软件控制传送</text>
  <text x="136" y="246" font-size="11" fill="#64748b">CPU</text>
  <rect x="136" y="252" width="264" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="268" y="270" font-size="11.5" fill="#312e81" text-anchor="middle">执行主程序</text>
  <rect x="404" y="252" width="110" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="459" y="270" font-size="11" fill="#92400e" text-anchor="middle">响应中断 + ISR</text>
  <rect x="518" y="252" width="134" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="585" y="270" font-size="11.5" fill="#312e81" text-anchor="middle">返回主程序</text>
  <text x="136" y="292" font-size="11" fill="#64748b">外设</text>
  <rect x="136" y="298" width="258" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="265" y="316" font-size="11.5" fill="#065f46" text-anchor="middle">准备数据（与 CPU 并行）</text>
  <line x1="400" y1="296" x2="400" y2="282" stroke="#b45309" stroke-width="1.5" marker-end="url(#ioArrow)"/>
  <text x="410" y="292" font-size="11" fill="#b45309">中断请求</text>
  <rect x="136" y="332" width="516" height="24" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="146" y="348" font-size="11.5" fill="#312e81">准备阶段并行、传送仍占 CPU · 高速设备会因中断过于频繁而丢数据</text>

  <rect x="16" y="368" width="648" height="138" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="128" y1="380" x2="128" y2="494" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="402" font-size="14" font-weight="700" fill="#312e81">DMA</text>
  <text x="28" y="422" font-size="11" fill="#64748b">整块数据</text>
  <text x="28" y="440" font-size="11" fill="#64748b">硬件控制传送</text>
  <text x="136" y="392" font-size="11" fill="#64748b">CPU</text>
  <rect x="136" y="398" width="64" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="168" y="416" font-size="11" fill="#92400e" text-anchor="middle">预处理</text>
  <rect x="204" y="398" width="386" height="28" rx="5" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="397" y="416" font-size="11.5" fill="#312e81" text-anchor="middle">继续执行主程序（周期挪用仅短暂让出总线）</text>
  <rect x="594" y="398" width="58" height="28" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <text x="623" y="416" font-size="11" fill="#92400e" text-anchor="middle">后处理</text>
  <text x="136" y="438" font-size="11" fill="#64748b">外设 / 主存</text>
  <rect x="136" y="444" width="64" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="204" y="444" width="386" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="397" y="462" font-size="11.5" fill="#065f46" text-anchor="middle">DMA 控制器接管总线：外设 ↔ 主存 成块直传</text>
  <rect x="594" y="444" width="58" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="136" y="478" width="516" height="24" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="146" y="494" font-size="11.5" fill="#312e81">数据不经过 CPU、不保存现场 · CPU 只在预处理 / 后处理介入</text>

  <rect x="16" y="512" width="648" height="24" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="26" y="528" font-size="11.5" fill="#475569">并行度：查询 &lt; 中断 &lt; DMA　｜　CPU 介入粒度：每字 → 每个数据块　｜　请求对象：CPU 处理时间 → 总线使用权</text>
</svg>
