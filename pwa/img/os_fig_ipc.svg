<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ipArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ipArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="452" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">四种进程通信 · 数据要不要过内核、同步由谁负责</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">进程地址空间互相隔离，谁都没法直接读对方内存 —— 四种方式只是「偷渡路径」不同</text>

  <!-- 左卡：三条数据路径 -->
  <rect x="24" y="62" width="372" height="374" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="84" font-size="11" font-weight="700" fill="#0f172a">数据怎么从 A 过到 B</text>

  <!-- 共享存储 -->
  <text x="40" y="108" font-size="10" font-weight="700" fill="#1e40af">共享存储：把同一块物理内存映射进两边</text>
  <rect x="40" y="114" width="72" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="76" y="134" font-size="10" fill="#1e40af" text-anchor="middle">进程 A</text>
  <rect x="152" y="114" width="116" height="32" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="210" y="129" font-size="9.5" fill="#1e3a8a" text-anchor="middle">共享存储区</text>
  <text x="210" y="141" font-size="8.5" fill="#1e40af" text-anchor="middle">映射进两边地址空间</text>
  <rect x="308" y="114" width="72" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="344" y="134" font-size="10" fill="#1e40af" text-anchor="middle">进程 B</text>
  <path d="M 112 130 L 150 130" fill="none" stroke="#2563eb" stroke-width="1.3" marker-start="url(#ipArrowG)" marker-end="url(#ipArrowG)"/>
  <path d="M 268 130 L 306 130" fill="none" stroke="#2563eb" stroke-width="1.3" marker-start="url(#ipArrowG)" marker-end="url(#ipArrowG)"/>
  <text x="40" y="162" font-size="9" fill="#1e40af">用户态直接读写，数据一次都不经过内核</text>
  <text x="40" y="177" font-size="9" fill="#b45309">OS 只负责分配与映射，同步和保护得自己写 P/V</text>

  <!-- 消息传递 -->
  <text x="40" y="204" font-size="10" font-weight="700" fill="#166534">消息传递：以格式化消息为单位，经内核转发</text>
  <rect x="40" y="210" width="62" height="32" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.1"/>
  <text x="71" y="230" font-size="10" fill="#166534" text-anchor="middle">发送</text>
  <rect x="146" y="210" width="136" height="32" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.2"/>
  <text x="214" y="225" font-size="9.5" fill="#14532d" text-anchor="middle">内核消息缓冲区</text>
  <text x="214" y="237" font-size="8.5" fill="#166534" text-anchor="middle">send / receive 原语</text>
  <rect x="318" y="210" width="62" height="32" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.1"/>
  <text x="349" y="230" font-size="10" fill="#166534" text-anchor="middle">接收</text>
  <path d="M 102 226 L 144 226" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#ipArrowG)"/>
  <path d="M 282 226 L 316 226" fill="none" stroke="#059669" stroke-width="1.3" marker-end="url(#ipArrowG)"/>
  <text x="40" y="258" font-size="9" fill="#166534">直接通信指定对方 PID；间接通信投到信箱，双方互不知道</text>
  <text x="40" y="273" font-size="9" fill="#64748b">数据要经内核复制，开销大，但细节全透明、支持分布式</text>

  <!-- 管道 -->
  <text x="40" y="300" font-size="10" font-weight="700" fill="#92400e">管道：内核里一块固定大小的环形缓冲区</text>
  <rect x="40" y="306" width="62" height="32" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="71" y="326" font-size="10" fill="#92400e" text-anchor="middle">写端</text>
  <rect x="148" y="306" width="132" height="32" rx="4" fill="#fde68a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="214" y="321" font-size="9.5" fill="#78350f" text-anchor="middle">环形缓冲区（FIFO）</text>
  <text x="214" y="333" font-size="8.5" fill="#92400e" text-anchor="middle">Linux 约 64KB · 不是磁盘文件</text>
  <rect x="316" y="306" width="62" height="32" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="347" y="326" font-size="10" fill="#92400e" text-anchor="middle">读端</text>
  <path d="M 102 322 L 146 322" fill="none" stroke="#b45309" stroke-width="1.3" marker-end="url(#ipArrow)"/>
  <path d="M 280 322 L 314 322" fill="none" stroke="#b45309" stroke-width="1.3" marker-end="url(#ipArrow)"/>
  <text x="40" y="354" font-size="9" fill="#92400e">半双工：双向要建两条；父子等亲缘进程最常用</text>
  <text x="40" y="369" font-size="9" fill="#92400e">读走即释放（一次性）；满则写阻塞、空则读阻塞</text>

  <text x="40" y="396" font-size="9" fill="#0f766e" font-weight="700">三者都是「高级通信」：能搬大量数据。低级通信只传控制信息，典型是 P/V。</text>
  <text x="40" y="414" font-size="9" fill="#64748b">全局变量不跨进程：每个进程各有一份地址空间副本，改不到别人那里</text>

  <!-- 右卡：信号 -->
  <rect x="408" y="62" width="248" height="374" rx="6" fill="#fef9f3" stroke="#fcd9b6" stroke-width="1"/>
  <text x="424" y="84" font-size="11" font-weight="700" fill="#9a3412">信号：只报「发生了一件事」，不搬数据</text>

  <text x="424" y="106" font-size="9.5" font-weight="700" fill="#92400e">PCB 里两个 n 位向量</text>
  <text x="424" y="122" font-size="9" fill="#78350f">① 待处理</text>
  <rect x="486" y="112" width="22" height="15" rx="2" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <rect x="510" y="112" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="534" y="112" width="22" height="15" rx="2" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <rect x="558" y="112" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="582" y="112" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="606" y="112" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <text x="424" y="145" font-size="9" fill="#78350f">② 被屏蔽</text>
  <rect x="486" y="135" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="510" y="135" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="534" y="135" width="22" height="15" rx="2" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <rect x="558" y="135" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="582" y="135" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <rect x="606" y="135" width="22" height="15" rx="2" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
  <text x="424" y="170" font-size="8.5" fill="#92400e">待处理：处理后清零；被屏蔽：暂存到解除</text>

  <text x="424" y="190" font-size="9.5" font-weight="700" fill="#92400e">谁来发</text>
  <text x="424" y="206" font-size="9" fill="#78350f">内核：遇到系统事件（非法指令 → SIGILL）</text>
  <text x="424" y="221" font-size="9" fill="#78350f">进程：kill() 请求内核发给指定 PID</text>

  <text x="424" y="246" font-size="9.5" font-weight="700" fill="#92400e">什么时候处理</text>
  <text x="424" y="262" font-size="9" fill="#78350f">从内核态返回用户态时检查，</text>
  <text x="424" y="276" font-size="9" fill="#78350f">若有多个，优先处理序号较小的</text>

  <text x="424" y="300" font-size="9.5" font-weight="700" fill="#92400e">怎么处理</text>
  <text x="424" y="316" font-size="9" fill="#78350f">① 默认处理（如 SIGILL 终止进程）</text>
  <text x="424" y="331" font-size="9" fill="#78350f">② 进程自定义的处理函数</text>
  <text x="424" y="346" font-size="9" fill="#78350f">处理完回到被中断处继续执行</text>

  <text x="424" y="372" font-size="9" fill="#0f766e" font-weight="700">判据：传数据 → 共享存储/消息/管道</text>
  <text x="424" y="388" font-size="9" fill="#0f766e" font-weight="700">只通知事件 → 信号</text>
  <text x="424" y="410" font-size="9" fill="#64748b">Linux 约 30 种信号，编号 1～30</text>
</svg>
