<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="476" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">m 阶 B+ 树 · m = 3 的实例</text>
  <text x="20" y="48" font-size="12" fill="#64748b">非叶结点只存索引副本，全部关键字和记录指针都在叶层，叶层按大小顺序链接</text>

  <text x="20" y="68" font-size="11" fill="#475569">根指针</text>
  <line x1="74" y1="64" x2="246" y2="92" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="250" y="78" width="60" height="36" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="310" y="78" width="60" height="36" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="370" y="78" width="60" height="36" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="280" y="102" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">8</text>
  <text x="340" y="102" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">15</text>
  <text x="400" y="102" font-size="12.5" font-weight="700" fill="#312e81" text-anchor="middle">26</text>
  <text x="440" y="72" font-size="10.5" fill="#4338ca">← 根：3 关键字 → 3 棵子树</text>

  <g stroke="#cbd5e1" stroke-width="1.4">
    <line x1="280" y1="114" x2="198" y2="198"/>
    <line x1="340" y1="114" x2="388" y2="198"/>
    <line x1="400" y1="114" x2="578" y2="198"/>
  </g>

  <text x="20" y="232" font-size="11" fill="#475569">最小叶指针</text>
  <line x1="88" y1="228" x2="108" y2="218" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="110" y="200" width="88" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="198" y="200" width="88" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="154" y="224" font-size="12.5" fill="#15803d" text-anchor="middle">5</text>
  <text x="242" y="224" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">8</text>

  <rect x="300" y="200" width="88" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="388" y="200" width="88" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="344" y="224" font-size="12.5" fill="#15803d" text-anchor="middle">12</text>
  <text x="432" y="224" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">15</text>

  <rect x="490" y="200" width="88" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="578" y="200" width="88" height="36" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="534" y="224" font-size="12.5" fill="#15803d" text-anchor="middle">20</text>
  <text x="622" y="224" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">26</text>

  <g stroke="#16a34a" stroke-width="1.4" fill="none">
    <path d="M286 218 L300 218"/><path d="M476 218 L490 218"/>
  </g>
  <text x="410" y="184" font-size="10" fill="#15803d">↓ 叶层：全部关键字 + 记录指针，顺序链接</text>

  <text x="20" y="266" font-size="11.5" fill="#334155">根里的 8、15、26 是叶中最大值的<tspan font-weight="700">副本</tspan>：查找即使在上层碰到相等也<tspan font-weight="700">不能停</tspan>，必须一路走到叶层。</text>
  <text x="20" y="286" font-size="11.5" fill="#334155">m = 3 时：非叶根至少 2 棵子树，其余分支结点至少 ⌈3/2⌉ = 2 棵；每个结点关键字数 = 子树数。</text>

  <rect x="20" y="304" width="205" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="34" y="324" font-size="11" font-weight="700" fill="#312e81">关键字 ↔ 子树数</text>
  <text x="34" y="344" font-size="10.5" fill="#3730a3">B 树：n 个 → n+1 棵</text>
  <text x="34" y="362" font-size="10.5" fill="#3730a3">B+ 树：n 个 → n 棵</text>

  <rect x="237" y="304" width="205" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="251" y="324" font-size="11" font-weight="700" fill="#312e81">关键字数范围</text>
  <text x="251" y="344" font-size="10.5" fill="#3730a3">B 树：⌈m/2⌉−1 … m−1</text>
  <text x="251" y="362" font-size="10.5" fill="#3730a3">B+ 树：⌈m/2⌉ … m</text>

  <rect x="454" y="304" width="206" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="468" y="324" font-size="11" font-weight="700" fill="#312e81">查找终点</text>
  <text x="468" y="344" font-size="10.5" fill="#3730a3">B 树：非叶命中即返回</text>
  <text x="468" y="362" font-size="10.5" fill="#3730a3">B+ 树：必到叶层</text>

  <rect x="20" y="394" width="640" height="72" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="414" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="432" font-size="11.2" fill="#7f1d1d">① 别把 B 树的「n+1 棵子树」套到 B+ 树上；B+ 树关键字数范围整体比 B 树大 1。</text>
  <text x="34" y="450" font-size="11.2" fill="#7f1d1d">② 两个头指针（根 + 最小叶）才有「顺序查找」这条路；统考对 B+ 树只考概念与性质，不考插删过程。</text>
</svg>
