<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="cm2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <!-- ============ 面板 1：直接映射 ============ -->
  <g>
    <rect x="10" y="10" width="230" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="125" y="34" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">① 直接映射</text>
    <text x="125" y="52" font-size="11" fill="#64748b" text-anchor="middle">块号 mod 行数 = 唯一行号</text>

    <text x="20" y="70" font-size="11" fill="#64748b">主存块</text>
    <text x="150" y="70" font-size="11" fill="#64748b">Cache 行</text>

    <!-- 区 0 -->
    <g font-size="11" text-anchor="middle">
      <rect x="20" y="76" width="50" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="45" y="91" fill="#312e81">块 0</text>
      <rect x="20" y="106" width="50" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="45" y="121" fill="#312e81">块 1</text>
      <rect x="20" y="136" width="50" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="45" y="151" fill="#312e81">块 2</text>
      <!-- 区 1 -->
      <rect x="20" y="196" width="50" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="45" y="211" fill="#7c2d12">块 3</text>
      <rect x="20" y="226" width="50" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="45" y="241" fill="#7c2d12">块 4</text>
      <rect x="20" y="256" width="50" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="45" y="271" fill="#7c2d12">块 5</text>

      <rect x="150" y="88" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="180" y="104" fill="#312e81">行 0</text>
      <rect x="150" y="118" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="180" y="134" fill="#312e81">行 1</text>
      <rect x="150" y="148" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="180" y="164" fill="#312e81">行 2</text>
    </g>

    <g stroke="#4f46e5" stroke-width="1.6" fill="none">
      <line x1="72" y1="87" x2="146" y2="100" marker-end="url(#cm)"/>
      <line x1="72" y1="117" x2="146" y2="130" marker-end="url(#cm)"/>
      <line x1="72" y1="147" x2="146" y2="160" marker-end="url(#cm)"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="4 3">
      <line x1="72" y1="207" x2="146" y2="100" marker-end="url(#cm2)"/>
      <line x1="72" y1="237" x2="146" y2="130" marker-end="url(#cm2)"/>
      <line x1="72" y1="267" x2="146" y2="160" marker-end="url(#cm2)"/>
    </g>
    <text x="125" y="310" font-size="11" fill="#64748b" text-anchor="middle">多块争用同一行 → 冲突率高</text>
    <text x="125" y="326" font-size="11" fill="#64748b" text-anchor="middle">无需替换算法，命中即定位</text>
  </g>

  <!-- ============ 面板 2：全相联 ============ -->
  <g>
    <rect x="250" y="10" width="230" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="365" y="34" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">② 全相联映射</text>
    <text x="365" y="52" font-size="11" fill="#64748b" text-anchor="middle">任意块 → 任意行</text>

    <text x="260" y="70" font-size="11" fill="#64748b">主存块</text>
    <text x="400" y="70" font-size="11" fill="#64748b">Cache 行</text>

    <g font-size="11" text-anchor="middle">
      <rect x="260" y="76" width="50" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="285" y="91" fill="#312e81">块 0</text>
      <rect x="260" y="110" width="50" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="285" y="125" fill="#312e81">块 1</text>
      <rect x="260" y="144" width="50" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="285" y="159" fill="#312e81">块 2</text>
      <rect x="260" y="178" width="50" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="285" y="193" fill="#7c2d12">块 3</text>
      <rect x="260" y="212" width="50" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="285" y="227" fill="#7c2d12">块 4</text>
      <rect x="260" y="246" width="50" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="285" y="261" fill="#7c2d12">块 5</text>

      <rect x="400" y="106" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="430" y="122" fill="#312e81">行 0</text>
      <rect x="400" y="150" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="430" y="166" fill="#312e81">行 1</text>
      <rect x="400" y="194" width="60" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="430" y="210" fill="#312e81">行 2</text>
    </g>

    <!-- 汇集竖线 + 三箭头 -->
    <line x1="330" y1="86" x2="330" y2="258" stroke="#4f46e5" stroke-width="1.6"/>
    <g stroke="#4f46e5" stroke-width="1.6" fill="none">
      <line x1="330" y1="118" x2="396" y2="118" marker-end="url(#cm)"/>
      <line x1="330" y1="162" x2="396" y2="162" marker-end="url(#cm)"/>
      <line x1="330" y1="206" x2="396" y2="206" marker-end="url(#cm)"/>
    </g>
    <text x="330" y="286" font-size="11" fill="#4f46e5" text-anchor="middle">任意</text>
    <text x="365" y="310" font-size="11" fill="#64748b" text-anchor="middle">冲突最少，命中率最高</text>
    <text x="365" y="326" font-size="11" fill="#64748b" text-anchor="middle">需按内容比较全部标记 + 替换算法</text>
  </g>

  <!-- ============ 面板 3：组相联 ============ -->
  <g>
    <rect x="490" y="10" width="220" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="600" y="34" font-size="15" font-weight="700" fill="#312e81" text-anchor="middle">③ 组相联映射</text>
    <text x="600" y="52" font-size="11" fill="#64748b" text-anchor="middle">组号 = 块号 mod 组数；组内任意</text>

    <text x="500" y="70" font-size="11" fill="#64748b">主存块</text>
    <text x="630" y="70" font-size="11" fill="#64748b">Cache 行</text>

    <g font-size="11" text-anchor="middle">
      <rect x="500" y="76" width="48" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="524" y="91" fill="#312e81">块 0</text>
      <rect x="500" y="106" width="48" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="524" y="121" fill="#312e81">块 1</text>
      <rect x="500" y="136" width="48" height="22" rx="4" fill="#eef2ff" stroke="#c7d2fe"/><text x="524" y="151" fill="#312e81">块 2</text>

      <rect x="500" y="200" width="48" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="524" y="215" fill="#7c2d12">块 3</text>
      <rect x="500" y="230" width="48" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="524" y="245" fill="#7c2d12">块 4</text>
      <rect x="500" y="260" width="48" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa"/><text x="524" y="275" fill="#7c2d12">块 5</text>

      <rect x="630" y="86" width="56" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="658" y="102" fill="#312e81">行 0</text>
      <rect x="630" y="120" width="56" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="658" y="136" fill="#312e81">行 1</text>
      <rect x="630" y="206" width="56" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="658" y="222" fill="#312e81">行 2</text>
      <rect x="630" y="240" width="56" height="24" rx="4" fill="#e0e7ff" stroke="#4f46e5"/><text x="658" y="256" fill="#312e81">行 3</text>
    </g>

    <!-- 组 0 -->
    <line x1="562" y1="86" x2="562" y2="158" stroke="#4f46e5" stroke-width="1.6"/>
    <g stroke="#4f46e5" stroke-width="1.6" fill="none">
      <line x1="562" y1="98" x2="626" y2="98" marker-end="url(#cm)"/>
      <line x1="562" y1="132" x2="626" y2="132" marker-end="url(#cm)"/>
    </g>
    <text x="562" y="176" font-size="10" fill="#4f46e5" text-anchor="middle">组 0</text>

    <!-- 组 1 -->
    <line x1="562" y1="210" x2="562" y2="282" stroke="#b45309" stroke-width="1.6"/>
    <g stroke="#b45309" stroke-width="1.6" fill="none">
      <line x1="562" y1="218" x2="626" y2="218" marker-end="url(#cm)"/>
      <line x1="562" y1="252" x2="626" y2="252" marker-end="url(#cm)"/>
    </g>
    <text x="562" y="300" font-size="10" fill="#b45309" text-anchor="middle">组 1</text>

    <text x="600" y="320" font-size="11" fill="#64748b" text-anchor="middle">组间直接映射 + 组内全相联（折中）</text>
  </g>

  <text x="360" y="392" font-size="12" fill="#64748b" text-anchor="middle">标记位数：全相联 = 主存块号全长；直接映射 = 区号；组相联 = 区号（组内不再区分）</text>
  <text x="360" y="410" font-size="11" fill="#94a3b8" text-anchor="middle">三种方式对比：冲突率 全相联 &lt; 组相联 &lt; 直接映射；硬件成本与查找开销 全相联 &gt; 组相联 &gt; 直接映射</text>
</svg>
