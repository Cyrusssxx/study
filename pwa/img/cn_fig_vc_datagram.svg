<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="vcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="dgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="480" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#312e81">同一对主机、两种网络层服务 · 虚电路同径按序 vs 数据报独立选路</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">Internet 选数据报：核心简单、分组独立、可靠靠端系统；虚电路把复杂度留在网络内部</text>

  <rect x="24" y="62" width="310" height="252" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="179" y="84" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">虚电路 VC（面向连接）</text>
  <text x="40" y="106" font-size="10.5" fill="#475569">先建链、再传输、后释放；建链时一次决定路由</text>
  <line x1="74" y1="152" x2="103" y2="152" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#vcArrow)"/>
  <line x1="138" y1="152" x2="167" y2="152" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#vcArrow)"/>
  <line x1="202" y1="152" x2="231" y2="152" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#vcArrow)"/>
  <line x1="266" y1="152" x2="295" y2="152" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#vcArrow)"/>
  <circle cx="56" cy="152" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="56" y="157" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">H1</text>
  <circle cx="120" cy="152" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="157" font-size="10" fill="#1e3a8a" text-anchor="middle">R1</text>
  <circle cx="184" cy="152" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="184" y="157" font-size="10" fill="#1e3a8a" text-anchor="middle">R2</text>
  <circle cx="248" cy="152" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="248" y="157" font-size="10" fill="#1e3a8a" text-anchor="middle">R3</text>
  <circle cx="312" cy="152" r="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="312" y="157" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">H2</text>
  <rect x="40" y="184" width="274" height="28" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="177" y="202" font-size="10" fill="#1e40af" text-anchor="middle">三个分组沿同一路径：都只带短虚电路号，按序到达</text>
  <text x="40" y="234" font-size="10.5" fill="#334155">短小的虚电路号寻址，不用完整目的地址</text>
  <text x="40" y="256" font-size="10.5" fill="#334155">各结点记录连接状态（有状态），按序可达</text>
  <text x="40" y="278" font-size="10.5" fill="#334155">差错 / 流量控制由网络负责，建链可预留资源</text>
  <text x="40" y="300" font-size="10.5" font-weight="700" fill="#1d4ed8">类比打电话；故障则整条虚电路失效</text>

  <rect x="350" y="62" width="306" height="252" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="503" y="84" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">数据报（无连接）</text>
  <text x="366" y="106" font-size="10.5" fill="#475569">无需建链；每个分组独立选路、带完整目的地址</text>
  <path d="M 390 182 L 440 132 L 609 176" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#dgArrow)"/>
  <path d="M 390 182 L 609 182" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#dgArrow)"/>
  <path d="M 390 182 L 440 232 L 609 188" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#dgArrow)"/>
  <circle cx="374" cy="182" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="374" y="187" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">H1</text>
  <circle cx="626" cy="182" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="626" y="187" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">H2</text>
  <circle cx="440" cy="132" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="440" y="137" font-size="9" fill="#14532d" text-anchor="middle">R1</text>
  <circle cx="500" cy="182" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="500" y="187" font-size="9" fill="#14532d" text-anchor="middle">R2</text>
  <circle cx="440" cy="232" r="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="440" y="237" font-size="9" fill="#14532d" text-anchor="middle">R3</text>
  <rect x="366" y="246" width="274" height="26" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="503" y="263" font-size="10" fill="#15803d" text-anchor="middle">每分组都写「目的 IP = H2」，路径可不同</text>
  <text x="366" y="288" font-size="10.5" fill="#334155">结点无连接状态（无状态），尽力而为交付</text>
  <text x="366" y="306" font-size="10.5" font-weight="700" fill="#15803d">可能失序 / 丢失；可靠与排序交给端系统</text>

  <rect x="24" y="326" width="632" height="64" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="347" font-size="11.5" font-weight="700" fill="#334155">Internet 的设计哲学：网络核心简单、端系统复杂</text>
  <text x="40" y="369" font-size="10.5" fill="#475569">核心只管查表转发，可靠 / 排序 / 重传交给 TCP；分组独立，某条路由故障时可绕路。</text>
  <text x="40" y="387" font-size="10.5" fill="#475569">虚电路适合需要质量保障、面向连接的场合（电话网）；IP 采用数据报 + 尽最大努力交付。</text>

  <rect x="24" y="402" width="632" height="68" rx="5" fill="#fef9c3" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="424" font-size="11" font-weight="700" fill="#854d0e">三条判据</text>
  <text x="40" y="446" font-size="10.5" fill="#854d0e">谁负责可靠 → 虚电路网络层 / 数据报端系统；路由器要不要记状态 → 虚电路记 / 数据报不记。</text>
  <text x="40" y="466" font-size="10.5" fill="#854d0e">每跳 TTL 减 1 → 首部内容变 → 每跳必须重算首部检验和（Q275–Q279）。</text>
</svg>
