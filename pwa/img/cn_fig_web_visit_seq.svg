<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 770" width="780" height="770" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="wvB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7ab8"/></marker>
    <marker id="wvO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker>
  </defs>
  <rect width="780" height="770" fill="#fbfcfe"/>
  <rect x="0" y="0" width="780" height="36" fill="#4a7ab8"/>
  <text x="16" y="24" fill="#ffffff" font-size="15" font-weight="700">2021-47 · 一次 Web 访问的 t0 → t1：先 DNS 再 ARP，交换机边转发边学</text>
  <text x="16" y="56" fill="#4a5568" font-size="11">t0 时 H1 的 ARP 表、S 的交换表均为空，t0→t1 无其他通信　|　橙色＝广播帧　蓝色＝单播帧　绿色＋＝S 新学到的表项</text>

  <rect x="20" y="68" width="120" height="56" rx="6" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="80" y="88" text-anchor="middle" fill="#2c4a6b" font-size="12.5" font-weight="700">H1</text>
  <text x="80" y="104" text-anchor="middle" fill="#2c4a6b" font-size="10.5">端口 4</text>
  <text x="80" y="118" text-anchor="middle" fill="#4a5568" font-size="10">MAC …44-cc</text>

  <rect x="185" y="68" width="130" height="56" rx="6" fill="#ffffff" stroke="#4a7ab8"/>
  <text x="250" y="88" text-anchor="middle" fill="#2c4a6b" font-size="12.5" font-weight="700">以太网交换机 S</text>
  <text x="250" y="104" text-anchor="middle" fill="#4a5568" font-size="10">4←H1　1→DNS</text>
  <text x="250" y="118" text-anchor="middle" fill="#4a5568" font-size="10">2→R　3→H2</text>

  <rect x="375" y="68" width="130" height="56" rx="6" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="440" y="88" text-anchor="middle" fill="#2c4a6b" font-size="12.5" font-weight="700">本地域名服务器</text>
  <text x="440" y="104" text-anchor="middle" fill="#2c4a6b" font-size="10.5">端口 1</text>
  <text x="440" y="118" text-anchor="middle" fill="#4a5568" font-size="10">MAC …44-bb</text>

  <rect x="517" y="68" width="130" height="56" rx="6" fill="#e8f0fa" stroke="#4a7ab8"/>
  <text x="582" y="88" text-anchor="middle" fill="#2c4a6b" font-size="12.5" font-weight="700">路由器 R（网关）</text>
  <text x="582" y="104" text-anchor="middle" fill="#2c4a6b" font-size="10.5">端口 2</text>
  <text x="582" y="118" text-anchor="middle" fill="#4a5568" font-size="10">MAC …44-aa</text>

  <rect x="655" y="68" width="120" height="56" rx="6" fill="#f2f8f5" stroke="#9cc4b0"/>
  <text x="715" y="88" text-anchor="middle" fill="#1f5c45" font-size="12.5" font-weight="700">H2（端口 3）</text>
  <text x="715" y="104" text-anchor="middle" fill="#1f5c45" font-size="10.5">全程只收不发</text>
  <text x="715" y="118" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">收到 2 个帧</text>

  <line x1="80" y1="124" x2="80" y2="545" stroke="#c9d9ec" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="250" y1="124" x2="250" y2="545" stroke="#c9d9ec" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="440" y1="124" x2="440" y2="545" stroke="#c9d9ec" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="582" y1="124" x2="582" y2="545" stroke="#c9d9ec" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="715" y1="124" x2="715" y2="545" stroke="#c9d9ec" stroke-width="1.2" stroke-dasharray="4 4"/>

  <text x="88" y="146" fill="#b45309" font-size="11">① ARP 请求「谁是本地 DNS 的 IP」 · 广播</text>
  <line x1="80" y1="155" x2="243" y2="155" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <line x1="257" y1="155" x2="433" y2="155" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <line x1="257" y1="155" x2="575" y2="155" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <line x1="257" y1="155" x2="708" y2="155" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <circle cx="250" cy="155" r="3" fill="#059669"/>
  <rect x="256" y="164" width="310" height="14" fill="#fbfcfe"/><text x="258" y="174" fill="#059669" font-size="9.5">＋ H1 的 cc → 端口 4；查表无全 F 表项 → 向 1/2/3 泛洪</text>

  <text x="88" y="204" fill="#2c4a6b" font-size="11">② ARP 应答「DNS 的 MAC 是 bb」 · 单播</text>
  <line x1="433" y1="213" x2="87" y2="213" stroke="#4a7ab8" stroke-width="1.6" marker-end="url(#wvB)"/>
  <circle cx="250" cy="213" r="3" fill="#059669"/>
  <text x="258" y="232" fill="#059669" font-size="9.5">＋ DNS 的 bb → 端口 1</text>

  <text x="88" y="262" fill="#2c4a6b" font-size="11">③ DNS 查询 www.abc.com（UDP / IP）· 单播</text>
  <line x1="87" y1="271" x2="433" y2="271" stroke="#4a7ab8" stroke-width="1.6" marker-end="url(#wvB)"/>

  <text x="88" y="320" fill="#2c4a6b" font-size="11">④ DNS 应答，返回 Web 服务器 IP（UDP / IP）· 单播</text>
  <line x1="433" y1="329" x2="87" y2="329" stroke="#4a7ab8" stroke-width="1.6" marker-end="url(#wvB)"/>

  <text x="88" y="378" fill="#b45309" font-size="11">⑤ ARP 请求「谁是默认网关的 IP」 · 广播（目的 IP 不在本网段）</text>
  <line x1="80" y1="387" x2="243" y2="387" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <line x1="257" y1="387" x2="433" y2="387" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <line x1="257" y1="387" x2="575" y2="387" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <line x1="257" y1="387" x2="708" y2="387" stroke="#d97706" stroke-width="1.8" marker-end="url(#wvO)"/>
  <rect x="256" y="396" width="336" height="14" fill="#fbfcfe"/><text x="258" y="406" fill="#8a6d3b" font-size="9.5">H1 的 cc 已在表中 → 不新增表项，但目的 MAC 是全 F，仍须泛洪</text>

  <text x="88" y="436" fill="#2c4a6b" font-size="11">⑥ ARP 应答「网关的 MAC 是 aa」 · 单播</text>
  <line x1="575" y1="445" x2="87" y2="445" stroke="#4a7ab8" stroke-width="1.6" marker-end="url(#wvB)"/>
  <circle cx="250" cy="445" r="3" fill="#059669"/>
  <text x="258" y="464" fill="#059669" font-size="9.5">＋ 网关的 aa → 端口 2</text>

  <text x="88" y="494" fill="#2c4a6b" font-size="11">⑦ HTTP 请求封装成以太网帧 → 目的 MAC 是网关 aa · 单播</text>
  <line x1="87" y1="503" x2="575" y2="503" stroke="#4a7ab8" stroke-width="2.2" marker-end="url(#wvB)"/>
  <text x="596" y="507" fill="#4a7ab8" font-size="10" font-weight="700">t1</text>

  <rect x="20" y="566" width="740" height="24" fill="#4a7ab8"/>
  <text x="30" y="582" fill="#ffffff" font-size="10.5" font-weight="700">(2) t1 时刻 S 的交换表</text>
  <text x="300" y="582" fill="#ffffff" font-size="10.5" font-weight="700">端口</text>
  <text x="360" y="582" fill="#ffffff" font-size="10.5" font-weight="700">学到于</text>
  <text x="470" y="582" fill="#ffffff" font-size="10.5" font-weight="700">依据（自学习只看源 MAC）</text>

  <rect x="20" y="590" width="740" height="26" fill="#ffffff"/>
  <text x="30" y="607" fill="#2c4a6b" font-size="10.5">00-11-22-33-44-cc　（H1）</text>
  <text x="300" y="607" fill="#2c4a6b" font-size="10.5" font-weight="700">4</text>
  <text x="360" y="607" fill="#4a5568" font-size="10.5">① 广播请求</text>
  <text x="470" y="607" fill="#4a5568" font-size="10.5">H1 发的帧，源 MAC 被记下</text>

  <rect x="20" y="616" width="740" height="26" fill="#f7fafd"/>
  <text x="30" y="633" fill="#2c4a6b" font-size="10.5">00-11-22-33-44-bb　（本地 DNS）</text>
  <text x="300" y="633" fill="#2c4a6b" font-size="10.5" font-weight="700">1</text>
  <text x="360" y="633" fill="#4a5568" font-size="10.5">② 应答</text>
  <text x="470" y="633" fill="#4a5568" font-size="10.5">DNS 回帧，源 MAC 被记下</text>

  <rect x="20" y="642" width="740" height="26" fill="#ffffff"/>
  <text x="30" y="659" fill="#2c4a6b" font-size="10.5">00-11-22-33-44-aa　（路由器 R）</text>
  <text x="300" y="659" fill="#2c4a6b" font-size="10.5" font-weight="700">2</text>
  <text x="360" y="659" fill="#4a5568" font-size="10.5">⑥ 应答</text>
  <text x="470" y="659" fill="#4a5568" font-size="10.5">R 回帧，源 MAC 被记下</text>

  <rect x="20" y="668" width="740" height="26" fill="#fef2f2"/>
  <text x="30" y="685" fill="#b91c1c" font-size="10.5">（无）H2 的 MAC 不在表中</text>
  <text x="300" y="685" fill="#b91c1c" font-size="10.5" font-weight="700">3</text>
  <text x="360" y="685" fill="#b91c1c" font-size="10.5">从未</text>
  <text x="470" y="685" fill="#b91c1c" font-size="10.5">H2 全程只收不发，S 无从学习</text>

  <rect x="20" y="702" width="740" height="56" rx="4" fill="#fff7ed" stroke="#f0c48a"/>
  <rect x="20" y="702" width="4" height="56" fill="#d97706"/>
  <text x="34" y="721" fill="#7c2d12" font-size="10.5"><tspan font-weight="700">(3) </tspan>①⑤ 两帧都是广播（目的 MAC = FF-FF-FF-FF-FF-FF），S 向端口 1/2/3 泛洪 → H2 各收 1 个，<tspan font-weight="700">共 2 个</tspan>，且都是封装 ARP 请求的以太网帧。</text>
  <text x="34" y="741" fill="#7c2d12" font-size="10.5"><tspan font-weight="700">(1) </tspan>DNS 跑在 UDP 上：DNS 报文 → UDP 数据报 → IP 数据报 → CSMA/CD 帧（以太网 V2 MAC 帧）。</text>
</svg>
