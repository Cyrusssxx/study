<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dsUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="396" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1e3a8a">四类域名服务器 · 一层只回答「下一级在哪」，权限服务器才给最终答案</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">根与顶级只做指引，本地域名服务器才是你自己那台（ISP 提供、负责缓存）</text>

  <!-- 左卡：层次 -->
  <rect x="24" y="60" width="356" height="300" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="82" font-size="11" font-weight="700" fill="#1e40af">域名空间的四个层级</text>

  <rect x="132" y="92" width="140" height="28" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
  <text x="202" y="111" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">根（全球 13 个）</text>

  <path d="M 202 120 L 98 148" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 202 120 L 202 148" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 202 120 L 306 148" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <rect x="52" y="150" width="92" height="26" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="98" y="167" font-size="9.5" fill="#1e40af" text-anchor="middle">com</text>
  <rect x="156" y="150" width="92" height="26" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="202" y="167" font-size="9.5" fill="#1e40af" text-anchor="middle">edu</text>
  <rect x="260" y="150" width="92" height="26" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.1"/>
  <text x="306" y="167" font-size="9.5" fill="#1e40af" text-anchor="middle">cn</text>

  <path d="M 98 176 L 98 202" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 306 176 L 306 202" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <rect x="52" y="204" width="120" height="38" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="112" y="219" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">abc.com 的</text>
  <text x="112" y="233" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">权限服务器</text>
  <rect x="246" y="204" width="120" height="38" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="306" y="219" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">edu.cn 的</text>
  <text x="306" y="233" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">权限服务器</text>

  <path d="M 112 242 L 112 264" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <rect x="52" y="266" width="120" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="112" y="283" font-size="9.5" fill="#334155" text-anchor="middle">www.abc.com</text>

  <path d="M 330 266 L 330 244" fill="none" stroke="#b45309" stroke-width="1.1" stroke-dasharray="4 3"
        marker-end="url(#dsUp)"/>
  <text x="336" y="258" font-size="8.5" fill="#b45309">代查</text>
  <rect x="196" y="266" width="170" height="44" rx="4" fill="#fef9c3" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="206" y="283" font-size="9.5" font-weight="700" fill="#92400e">本地域名服务器</text>
  <text x="206" y="299" font-size="9" fill="#92400e">ISP 提供 · 代你递归 · 全程缓存</text>

  <text x="40" y="330" font-size="9" fill="#1e40af">根与顶级只回「下一个该问谁」，权限服务器才返回 A 记录</text>
  <text x="40" y="346" font-size="9" fill="#b45309">缓存命中就直接回答，TTL 到期才重新查</text>

  <!-- 右卡：资源记录 -->
  <rect x="392" y="60" width="264" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="408" y="82" font-size="11" font-weight="700" fill="#0f172a">资源记录 RR 的五个常用类型</text>

  <rect x="408" y="92" width="232" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="416" y="110" font-size="9.5" font-weight="700" fill="#1e3a8a">A</text>
  <text x="452" y="110" font-size="9.5" fill="#334155">域名 → IPv4 地址</text>
  <rect x="408" y="124" width="232" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="416" y="142" font-size="9.5" font-weight="700" fill="#1e3a8a">AAAA</text>
  <text x="452" y="142" font-size="9.5" fill="#334155">域名 → IPv6 地址</text>
  <rect x="408" y="156" width="232" height="28" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="416" y="174" font-size="9.5" font-weight="700" fill="#166534">CNAME</text>
  <text x="452" y="174" font-size="9.5" fill="#334155">别名 → 规范名（还是域名）</text>
  <rect x="408" y="188" width="232" height="28" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="416" y="206" font-size="9.5" font-weight="700" fill="#92400e">MX</text>
  <text x="452" y="206" font-size="9.5" fill="#334155">邮件交换服务器（发信先查它）</text>
  <rect x="408" y="220" width="232" height="28" rx="3" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="416" y="238" font-size="9.5" font-weight="700" fill="#3730a3">NS</text>
  <text x="452" y="238" font-size="9.5" fill="#334155">该域的权威服务器名字</text>

  <text x="408" y="272" font-size="9" fill="#64748b">A / AAAA 给地址，CNAME 给名字</text>
  <text x="408" y="288" font-size="9" fill="#64748b">MX 只给邮件服务器，NS 给「谁说了算」</text>
  <text x="408" y="312" font-size="9" fill="#b45309">域名与 IP 不是一一对应：</text>
  <text x="408" y="328" font-size="9" fill="#b45309">一台主机可有多个域名，一个域名可对应多台</text>
  <text x="408" y="348" font-size="9" fill="#334155">主机必须有 IP，但不一定需要域名</text>
</svg>
