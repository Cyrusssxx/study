<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7ab8"/></marker>
  </defs>
  <rect width="760" height="600" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="34" fill="#4a7ab8"/>
  <text x="16" y="23" fill="#ffffff" font-size="15" font-weight="700">ICMP 报文分类 · 封装在 IP 内（协议号 1）</text>
  <text x="16" y="52" fill="#64748b" font-size="11.5">IP 只管尽力转发、不报告差错；ICMP 负责网络层的差错报告与询问</text>

  <rect x="316" y="66" width="128" height="38" rx="6" fill="#e8f0fa" stroke="#4a7ab8" stroke-width="1.5"/>
  <text x="380" y="90" text-anchor="middle" fill="#2c4a6b" font-size="14" font-weight="700">ICMP 报文</text>

  <path d="M380,104 L380,120 L196,120 L196,136" fill="none" stroke="#4a7ab8" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M380,104 L380,120 L564,120 L564,136" fill="none" stroke="#4a7ab8" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="96" y="138" width="200" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="196" y="162" text-anchor="middle" fill="#991b1b" font-size="13.5" font-weight="700">差错报告报文（5 类）</text>
  <rect x="464" y="138" width="200" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="564" y="162" text-anchor="middle" fill="#166534" font-size="13.5" font-weight="700">询问报文（3 类）</text>

  <g font-size="12">
    <rect x="24" y="190" width="344" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="38" y="212" fill="#7f1d1d">终点不可达 <tspan font-weight="700" fill="#b91c1c">3</tspan></text>
    <text x="210" y="212" fill="#991b1b" font-size="10.5">超过 MTU 且 DF=1 → 需分片</text>

    <rect x="24" y="230" width="344" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="38" y="252" fill="#7f1d1d">源点抑制 <tspan font-weight="700" fill="#b91c1c">4</tspan></text>
    <text x="210" y="252" fill="#991b1b" font-size="10.5">拥塞丢包，已弃用</text>

    <rect x="24" y="270" width="344" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="38" y="292" fill="#7f1d1d">重定向（改变路由）<tspan font-weight="700" fill="#b91c1c"> 5</tspan></text>
    <text x="210" y="292" fill="#991b1b" font-size="10.5">有更好路由，下次改道</text>

    <rect x="24" y="310" width="344" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="38" y="332" fill="#7f1d1d">超时 <tspan font-weight="700" fill="#b91c1c">11</tspan></text>
    <text x="210" y="332" fill="#991b1b" font-size="10.5">TTL=0 → tracert 逐跳试探</text>

    <rect x="24" y="350" width="344" height="34" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="38" y="372" fill="#7f1d1d">参数问题 <tspan font-weight="700" fill="#b91c1c">12</tspan></text>
    <text x="210" y="372" fill="#991b1b" font-size="10.5">首部字段非法</text>
  </g>

  <g font-size="12">
    <rect x="392" y="190" width="344" height="42" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="406" y="209" fill="#14532d">回送请求/应答 <tspan font-weight="700" fill="#15803d">8 / 0</tspan></text>
    <text x="406" y="225" fill="#166534" font-size="10.5">ping 就是它：测连通性</text>

    <rect x="392" y="240" width="344" height="42" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="406" y="259" fill="#14532d">时间戳请求/回答 <tspan font-weight="700" fill="#15803d">13 / 14</tspan></text>
    <text x="406" y="275" fill="#166534" font-size="10.5">测时钟、算往返时延</text>

    <rect x="392" y="290" width="344" height="42" rx="5" fill="#f0fdf4" stroke="#86efac"/>
    <text x="406" y="309" fill="#14532d">掩码请求/应答 <tspan font-weight="700" fill="#15803d">17 / 18</tspan></text>
    <text x="406" y="325" fill="#166534" font-size="10.5">获取子网掩码（已少用）</text>
  </g>

  <rect x="392" y="348" width="344" height="70" rx="6" fill="#eff6ff" stroke="#4a7ab8" stroke-width="1.2"/>
  <text x="406" y="369" fill="#2c4a6b" font-size="11.5" font-weight="700">两个场景对号入座（易考）</text>
  <text x="406" y="389" fill="#1e3a5f" font-size="11">TTL 减到 0 → 超时 11 报文</text>
  <text x="406" y="407" fill="#1e3a5f" font-size="11">超 MTU 且 DF=1 → 终点不可达 3</text>

  <rect x="24" y="440" width="712" height="70" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="38" y="462" fill="#854d0e" font-size="12" font-weight="700">四种情况不发 ICMP 差错报文（高频陷阱）</text>
  <text x="38" y="482" fill="#78350f" font-size="11">① 对 ICMP 差错报文本身不再发　② 非第一个分片不发　③ 多播地址不发　④ 源地址为 0 / 环回 / 广播不发</text>
  <text x="38" y="501" fill="#78350f" font-size="11">判据：ICMP 装进 IP（协议号 1）→ 直接为 ICMP 提供服务的是 IP（2012 真题）</text>

  <rect x="24" y="522" width="712" height="62" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="38" y="543" fill="#334155" font-size="11.5" font-weight="700">速记</text>
  <text x="38" y="562" fill="#475569" font-size="11">差错 5 类：终点不可达 3、源点抑制 4、重定向 5、超时 11、参数问题 12　｜　询问：回送 8/0、时间戳 13/14、掩码 17/18</text>
  <text x="38" y="579" fill="#64748b" font-size="10.5">注意 ICMP 是网络层协议，但封装在 IP 数据报内传送</text>
</svg>
