<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 604" width="680" height="604" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="604" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#312e81">CRC 模 2 除法 · 数据 101001、G(x)=x³+x²+1（即 1101）</text>
  <text x="20" y="48" font-size="12" fill="#64748b">模 2 运算 = 异或：不进位、不借位；被除数 = 数据左移 r 位（r = G 的最高次 = 3）</text>

  <text x="24" y="100" font-size="11.5" font-weight="700" fill="#334155">① 被除数 = 101001 后补 3 个 0 → 101001000</text>

  <g font-family="Consolas,'Courier New',monospace" font-size="15" text-anchor="middle">
    <text x="181" y="140" fill="#1e3a8a">1</text><text x="203" y="140" fill="#1e3a8a">0</text><text x="225" y="140" fill="#1e3a8a">1</text>
    <text x="247" y="140" fill="#1e3a8a">0</text><text x="269" y="140" fill="#1e3a8a">0</text><text x="291" y="140" fill="#1e3a8a">1</text>
    <text x="313" y="140" fill="#94a3b8">0</text><text x="335" y="140" fill="#94a3b8">0</text><text x="357" y="140" fill="#94a3b8">0</text>

    <text x="181" y="180" fill="#b91c1c">1</text><text x="203" y="180" fill="#b91c1c">1</text>
    <text x="225" y="180" fill="#b91c1c">0</text><text x="247" y="180" fill="#b91c1c">1</text>

    <text x="203" y="220" fill="#1e40af">1</text><text x="225" y="220" fill="#1e40af">1</text>
    <text x="247" y="220" fill="#1e40af">1</text><text x="269" y="220" fill="#1e40af">0</text>

    <text x="203" y="260" fill="#b91c1c">1</text><text x="225" y="260" fill="#b91c1c">1</text>
    <text x="247" y="260" fill="#b91c1c">0</text><text x="269" y="260" fill="#b91c1c">1</text>

    <text x="247" y="300" fill="#1e40af">1</text><text x="269" y="300" fill="#1e40af">1</text>
    <text x="291" y="300" fill="#1e40af">1</text><text x="313" y="300" fill="#1e40af">0</text>

    <text x="247" y="340" fill="#b91c1c">1</text><text x="269" y="340" fill="#b91c1c">1</text>
    <text x="291" y="340" fill="#b91c1c">0</text><text x="313" y="340" fill="#b91c1c">1</text>

    <text x="291" y="380" fill="#1e40af">1</text><text x="313" y="380" fill="#1e40af">1</text>
    <text x="335" y="380" fill="#1e40af">0</text><text x="357" y="380" fill="#1e40af">0</text>

    <text x="291" y="420" fill="#b91c1c">1</text><text x="313" y="420" fill="#b91c1c">1</text>
    <text x="335" y="420" fill="#b91c1c">0</text><text x="357" y="420" fill="#b91c1c">1</text>

    <text x="313" y="462" fill="#166534" font-weight="700">0</text>
    <text x="335" y="462" fill="#166534" font-weight="700">0</text>
    <text x="357" y="462" fill="#166534" font-weight="700">1</text>
  </g>

  <line x1="172" y1="190" x2="258" y2="190" stroke="#64748b" stroke-width="1.3"/>
  <line x1="194" y1="270" x2="280" y2="270" stroke="#64748b" stroke-width="1.3"/>
  <line x1="238" y1="350" x2="324" y2="350" stroke="#64748b" stroke-width="1.3"/>
  <line x1="282" y1="430" x2="368" y2="430" stroke="#64748b" stroke-width="1.3"/>
  <line x1="304" y1="472" x2="368" y2="472" stroke="#166534" stroke-width="1.6"/>

  <text x="24" y="216" font-size="10.5" fill="#b91c1c">⊕ 1101</text>
  <text x="24" y="262" font-size="10.5" fill="#b91c1c">⊕ 1101</text>
  <text x="24" y="342" font-size="10.5" fill="#b91c1c">⊕ 1101</text>
  <text x="24" y="422" font-size="10.5" fill="#b91c1c">⊕ 1101</text>
  <text x="24" y="466" font-size="10.5" font-weight="700" fill="#166534">余数</text>

  <text x="24" y="156" font-size="10" fill="#94a3b8">↑ 数据 6 位</text>
  <text x="318" y="156" font-size="10" fill="#94a3b8">↑ 补的 3 个 0</text>

  <rect x="400" y="106" width="260" height="106" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="414" y="126" font-size="11.5" font-weight="700" fill="#1e3a8a">读这张竖式的三步</text>
  <text x="414" y="146" font-size="11" fill="#1e40af">① G(x) 最高次 r = 3 → 补 3 个 0</text>
  <text x="414" y="164" font-size="11" fill="#1e40af">② G 的系数 1·x³+1·x²+0·x+1 → 1101</text>
  <text x="414" y="182" font-size="11" fill="#1e40af">③ 每步只看最左位：1 就异或，0 就移位</text>
  <text x="414" y="202" font-size="11" fill="#1e40af">　 最后剩下的 r 位就是 FCS</text>

  <rect x="400" y="228" width="260" height="76" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="414" y="248" font-size="11.5" font-weight="700" fill="#166534">答案</text>
  <text x="414" y="268" font-size="11.5" fill="#14532d">余数 = 001 → <tspan font-weight="700">FCS = 001</tspan></text>
  <text x="414" y="288" font-size="11.5" fill="#14532d">发送帧 = 数据 + FCS = <tspan font-weight="700">101001 001</tspan></text>

  <text x="24" y="498" font-size="11.5" fill="#334155">验算：接收方用同一 G 去除收到的 101001001，<tspan font-weight="700">余数为 0</tspan> 才认为无错；余数非 0 直接丢弃该帧。</text>

  <rect x="20" y="514" width="640" height="84" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="34" y="534" font-size="11.5" font-weight="700" fill="#991b1b">易错：</text>
  <text x="34" y="554" font-size="11.5" fill="#7f1d1d">① 补 0 的个数 = G 的最高次 r（本例 3），不是 G 的位数（4），也不是数据位数。</text>
  <text x="34" y="574" font-size="11.5" fill="#7f1d1d">② 模 2 除法没有借位：直接异或，别按十进制长除的思路「不够商 0 再借位」。</text>
  <text x="34" y="592" font-size="11.5" fill="#7f1d1d">③ CRC <tspan font-weight="700">只检错不纠错</tspan>；出错的帧丢弃由上层重传，别答成「自动纠正」。</text>
</svg>
