<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="algo.html" class="nav-link">算法讲义</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="page-header">
            <h1>错题本</h1>
            <p>记录你答错的题目，反复练习直到掌握</p>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <select id="subjectFilter" onchange="loadWrongQuestions()">
                <option value="">全部科目</option>
                <option value="os">操作系统</option>
                <option value="co">计算机组成原理</option>
                <option value="ds">数据结构</option>
                <option value="cn">计算机网络</option>
            </select>
            <select id="sortFilter" onchange="loadWrongQuestions()">
                <option value="recent">最近答错优先</option>
                <option value="count">错误次数多优先</option>
            </select>
            <label class="checkbox-label">
                <input type="checkbox" id="realOnly" onchange="loadWrongQuestions()">
                只看统考真题
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="showResolved" onchange="loadWrongQuestions()">
                显示已解决
            </label>
            <button class="btn btn-primary" onclick="startWrongPractice()">开始错题练习</button>
            <button class="btn btn-secondary" onclick="exportWrongList('md')" title="导出当前过滤的错题为 Markdown 文本（含题千/选项/答案/解析）">📄 导出 Markdown</button>
            <button class="btn btn-secondary" onclick="exportWrongList('json')" title="导出当前过滤的错题为 JSON（与学习数据备份同格式，可通过"导入"还原）">💾 导出 JSON</button>
        </div>

        <!-- 错题列表 -->
        <div class="question-list" id="wrongList">
            <div class="loading">加载中...</div>
        </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/backend.js"></script>
    <script>
    async function loadWrongQuestions() {
        const subject = document.getElementById('subjectFilter').value;
        const includeResolved = document.getElementById('showResolved').checked;
        const sort = document.getElementById('sortFilter').value;
        const realOnly = document.getElementById('realOnly').checked;

        const params = new URLSearchParams();
        if (subject) params.set('subject', subject);
        if (includeResolved) params.set('include_resolved', 'true');
        if (sort !== 'recent') params.set('sort', sort);
        if (realOnly) params.set('real_only', 'true');

        try {
            const resp = await api(`/api/wrong?${params}`);
            const data = await resp.json();
            renderWrongList(data.wrong_questions);
        } catch (e) {
            document.getElementById('wrongList').innerHTML = `<div class="error">加载失败</div>`;
        }
    }

    function renderWrongList(questions) {
        const container = document.getElementById('wrongList');

        if (questions.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>暂无错题</h3>
                    <p>继续刷题，答错的题目会自动记录在这里</p>
                </div>
            `;
            return;
        }

        let html = `<div class="list-header"><span>共 ${questions.length} 道错题</span></div>`;

        for (const q of questions) {
            const subjectName = q.subject === 'os' ? '操作系统' :
                               q.subject === 'co' ? '计算机组成原理' :
                               q.subject === 'ds' ? '数据结构' : '计算机网络';
            // 连对满2次才移出错题本，提示还差几次
            const streak = q.correct_streak || 0;
            const needMore = Math.max(0, 2 - streak);
            html += `
                <div class="list-item list-item-link ${q.is_resolved ? 'resolved' : ''}" onclick="location.href='quiz.html?subject=${q.subject}&mode=sequential&goto=${q.question_id}'">
                    <div class="item-header">
                        <span class="item-subject">${subjectName}</span>
                        ${q.is_real_exam ? `<span class="badge-real">${q.exam_year ? q.exam_year + ' ' : ''}统考真题</span>` : ''}
                        <span class="item-info">错误 ${q.wrong_count} 次</span>
                        ${q.is_resolved ? '<span class="badge-resolved">已解决</span>' : `<span class="badge-streak">还需连对 ${needMore} 次</span>`}
                        <button class="btn btn-sm btn-secondary item-goto" onclick="event.stopPropagation(); location.href='quiz.html?subject=${q.subject}&mode=sequential&goto=${q.question_id}'">去练习 →</button>
                        ${q.section ? `<button class="btn btn-sm btn-secondary item-goto" onclick="event.stopPropagation(); location.href='notes.html?subject=${q.subject}&goto=${encodeURIComponent(q.subsection || q.section)}&q=${encodeURIComponent((q.content||'').slice(0,60))}'" title="查看该知识点笔记（已定位到小节）">看知识点 📖</button>` : ''}
                    </div>
                    <div class="item-content">${fmtContent(q.content)}</div>
                    <div class="item-options">
                        ${Object.entries(q.options || {}).map(([k,v]) => `<span class="mini-option">${k}. ${v}</span>`).join('')}
                    </div>
                    ${q.answer ? `<div class="item-answer">正确答案: ${q.multi_blank ? [...q.answer].join('、') : q.answer}</div>` : ''}
                </div>
            `;
        }

        container.innerHTML = html;
    }

    function startWrongPractice() {
        const subject = document.getElementById('subjectFilter').value;
        if (subject) {
            window.location.href = `quiz.html?subject=${subject}&mode=wrong`;
        } else {
            alert('请先选择一个科目');
        }
    }

    // 状态持久化：恢复筛选条件（科目/排序/只看真题/显示已解决）
    const ps = PS.get({ subject: '', sort: '', realOnly: false, showResolved: false });
    const setEl = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    const setCk = (id, v) => { const el = document.getElementById(id); if (el) el.checked = !!v; };
    setEl('subjectFilter', ps.subject); setEl('sortFilter', ps.sort);
    setCk('realOnly', ps.realOnly); setCk('showResolved', ps.showResolved);
    window.addEventListener('pagehide', () => PS.set({
        subject: document.getElementById('subjectFilter').value,
        sort: document.getElementById('sortFilter').value,
        realOnly: document.getElementById('realOnly').checked,
        showResolved: document.getElementById('showResolved').checked
    }));

    loadWrongQuestions();
    PS.restoreScroll();

    /* ============ 错题导出（Markdown / JSON）============
       按当前筛选条件（科目/排序/只看真题/显示已解决）导出
       - Markdown：含题千/选项/答案/解析/章节，可直接打印或转 PDF 复习
       - JSON：与 stats.html 的"导出学习数据"格式同源，含 question 元数据，可通过
         stats.html 的"导入备份文件"还原到原设备（wrong 库里的错题记录字段完整保留） */
    let _exportCache = null;   // 复用最近一次加载结果，避免重复请求
    function stripHtmlForExport(html) {
        if (!html) return '';
        const div = document.createElement('div');
        div.innerHTML = html;
        return (div.textContent || div.innerText || '').replace(/\s+\n/g, '\n').trim();
    }
    function escapeMd(s) {
        return String(s == null ? '' : s)
            .replace(/([_*`\[\]])/g, '\\$1')
            .replace(/\|/g, '\\|')
            .replace(/\n+/g, ' ');
    }
    async function getCurrentWrongList() {
        if (_exportCache && _exportCache.length) return _exportCache;
        const subject = document.getElementById('subjectFilter').value;
        const includeResolved = document.getElementById('showResolved').checked;
        const sort = document.getElementById('sortFilter').value;
        const realOnly = document.getElementById('realOnly').checked;
        const params = new URLSearchParams();
        if (subject) params.set('subject', subject);
        if (includeResolved) params.set('include_resolved', 'true');
        if (sort !== 'recent') params.set('sort', sort);
        if (realOnly) params.set('real_only', 'true');
        const resp = await api('/api/wrong?' + params);
        const data = await resp.json();
        _exportCache = data.wrong_questions || [];
        return _exportCache;
    }
    function downloadFile(filename, content, mime) {
        const blob = new Blob([content], { type: mime + ';charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    }
    function buildWrongMarkdown(list) {
        const SUBJ_NAMES = { os: '操作系统', co: '计算机组成原理', ds: '数据结构', cn: '计算机网络' };
        const subject = list[0] ? list[0].subject : (document.getElementById('subjectFilter').value || 'all');
        const lines = [];
        const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
        lines.push('# 错题本导出');
        lines.push('');
        lines.push(`- 导出时间：${now}`);
        lines.push(`- 科目：${SUBJ_NAMES[subject] || subject || '全部'}`);
        lines.push(`- 错题数：${list.length}`);
        lines.push(`- 含解析：${list.filter(q => q.explanation).length}`);
        lines.push('');
        list.forEach((q, i) => {
            const content = stripHtmlForExport(q.content);
            lines.push('---');
            lines.push('');
            lines.push(`## ${i + 1}. ${SUBJ_NAMES[q.subject] || q.subject} · ${q.chapter || ''}${q.section ? ' · ' + q.section : ''}${q.is_real_exam ? ' · 【' + (q.exam_year || '') + ' 统考真题】' : ''}`);
            lines.push('');
            lines.push('**题干**');
            lines.push('');
            lines.push(content);
            lines.push('');
            if (q.options && Object.keys(q.options).length) {
                lines.push('**选项**');
                lines.push('');
                Object.entries(q.options).forEach(([k, v]) => {
                    lines.push(`- **${k}.** ${stripHtmlForExport(v)}`);
                });
                lines.push('');
            }
            lines.push('**正确答案**：`' + (q.correct_answer || q.answer || '?') + '`');
            if (q.user_answer != null) {
                lines.push('');
                lines.push('**你的作答**：`' + (q.user_answer || '未作答') + '`');
            }
            lines.push('');
            if (q.wrong_count) {
                lines.push(`**错次**：${q.wrong_count}${q.last_wrong_at ? '（上次：' + q.last_wrong_at + '）' : ''}`);
                lines.push('');
            }
            if (q.explanation) {
                lines.push('**解析**');
                lines.push('');
                lines.push(stripHtmlForExport(q.explanation));
                lines.push('');
            }
        });
        return lines.join('\n');
    }
    async function exportWrongList(fmt) {
        const list = await getCurrentWrongList();
        if (!list.length) { alert('当前筛选条件下没有错题可导出'); return; }
        const subject = list[0].subject || 'all';
        const ts = new Date().toISOString().slice(0, 10);
        if (fmt === 'json') {
            // 与 stats.html 全量备份同源结构，单独抽出 wrong 部分便于用户迁移或打印
            const payload = {
                version: 1, exported_at: new Date().toISOString(), source: 'wrong-export',
                subject, wrong: list
            };
            downloadFile(`错题_${subject}_${ts}.json`, JSON.stringify(payload, null, 2), 'application/json');
        } else {
            downloadFile(`错题_${subject}_${ts}.md`, buildWrongMarkdown(list), 'text/markdown');
        }
    }
    </script>
</body>
</html>
