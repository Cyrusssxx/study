    .io { stroke: #777; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 6; }
    .label { font-family: Arial, sans-serif; font-size: 16px; fill: #111; }
    .small { font-family: Arial, sans-serif; font-size: 14px; fill: #111; }
  </style>
  <line class="axis" x1="50" y1="248" x2="685" y2="248"/>
