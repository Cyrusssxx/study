<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516">
<title>sum+=a[i] 四条指令执行全景</title>
<rect x="0" y="0" width="720" height="516" fill="#ffffff"/>
<g font-family="Arial,'Microsoft YaHei',sans-serif">
<text x="24" y="28" font-size="17" font-weight="700" fill="#1f2937">一条 C 语句，怎么变成四条指令</text>
<rect x="24" y="40" width="672" height="36" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="38" y="63" font-family="Consolas,monospace" font-size="14" fill="#1f2937">sum += a[i];</text>
<text x="180" y="63" font-size="12.5" fill="#4b5563">编译器拆成 4 条　r3=a首址　r2=i　r1=sum</text>

<rect x="24" y="88" width="208" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="38" y="114" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#1e3a8a">slli r4, r2, 2</text>
<text x="38" y="136" font-family="Consolas,monospace" font-size="12" fill="#2563eb">R[r4] ← R[r2] &lt;&lt; 2</text>
<rect x="244" y="88" width="452" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="258" y="112" font-size="13" fill="#1f2937">① 算字节偏移：i × 4。int 占 4 字节，左移 2 位</text>
<text x="258" y="136" font-size="12" fill="#6b7280">r4 = 5 × 4 = 20 = 14H　｜　左移位数 ≠ 指令字长</text>

<rect x="24" y="160" width="208" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="38" y="186" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#1e3a8a">add r4, r3, r4</text>
<text x="38" y="208" font-family="Consolas,monospace" font-size="12" fill="#2563eb">R[r4] ← R[r3] + R[r4]</text>
<rect x="244" y="160" width="452" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="258" y="184" font-size="13" fill="#1f2937">② 算完整地址：a首址 + 字节偏移 = &amp;a[i]</text>
<text x="258" y="208" font-size="12" fill="#6b7280">DFF0 + 14 = E004H　｜　这是基址寻址，不是相对寻址</text>

<rect x="24" y="232" width="208" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="38" y="258" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#1e3a8a">lw r5, 0(r4)</text>
<text x="38" y="280" font-family="Consolas,monospace" font-size="12" fill="#2563eb">R[r5] ← M[R[r4]+0]</text>
<rect x="244" y="232" width="452" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="258" y="256" font-size="13" fill="#1f2937">③ 访存取数：拿 r4 的地址去主存取一个字 (4 字节)</text>
<text x="258" y="280" font-size="12" fill="#6b7280">0(r4) = 基址 r4 + 偏移 0　｜　取回 FFFFECDCH</text>

<rect x="24" y="304" width="208" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="38" y="330" font-family="Consolas,monospace" font-size="14" font-weight="700" fill="#1e3a8a">add r1, r1, r5</text>
<text x="38" y="352" font-family="Consolas,monospace" font-size="12" fill="#2563eb">R[r1] ← R[r1] + R[r5]</text>
<rect x="244" y="304" width="452" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="258" y="328" font-size="13" fill="#1f2937">④ 累加写回：sum + a[i] → sum，溢出位直接丢</text>
<text x="258" y="352" font-size="12" fill="#6b7280">1332 + FFFFECDC = 1 0000000E → 0000000EH</text>

<rect x="24" y="380" width="672" height="122" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="40" y="404" font-size="13.5" font-weight="700" fill="#991b1b">三个必须钉死的概念</text>
<text x="40" y="430" font-size="12.5" fill="#b91c1c">左移几位 = 元素字节数的 log₂：int→2，short→1；与指令字长（恒 32 位）无关</text>
<text x="40" y="456" font-size="12.5" fill="#b91c1c">lw 用基址寻址（r4+0）；相对寻址是 PC+偏移量，用于分支跳转，本题没有</text>
<text x="40" y="482" font-size="12.5" fill="#b91c1c">符号扩展针对指令里的 12 位立即数，按最高位补成 32 位再相加</text>
</g>
</svg>