<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424">
<title>slli 指令机器码 32 位字段拼接</title>
<rect x="0" y="0" width="720" height="424" fill="#ffffff"/>
<g font-family="Arial,'Microsoft YaHei',sans-serif">
<text x="24" y="28" font-size="17" font-weight="700" fill="#1f2937">slli r4, r2, 2 → 机器码怎么拼出来</text>
<text x="24" y="49" font-size="12" fill="#6b7280">32 位按 6 个字段从高位到低位排，逐段填入</text>

<rect x="24" y="62" width="132" height="64" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="90" y="83" font-size="11.5" text-anchor="middle" fill="#6b7280">31~25 · imm</text>
<text x="90" y="104" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">0000000</text>
<text x="90" y="120" font-size="11" text-anchor="middle" fill="#9ca3af">7 位 0</text>

<rect x="164" y="62" width="132" height="64" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
<text x="230" y="83" font-size="11.5" text-anchor="middle" fill="#2563eb">24~20 · shamt</text>
<text x="230" y="104" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">00010</text>
<text x="230" y="120" font-size="11" text-anchor="middle" fill="#2563eb">移位量 = 2</text>

<rect x="304" y="62" width="132" height="64" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="370" y="83" font-size="11.5" text-anchor="middle" fill="#6b7280">19~15 · rs1</text>
<text x="370" y="104" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">00010</text>
<text x="370" y="120" font-size="11" text-anchor="middle" fill="#9ca3af">r2 = 02H</text>

<rect x="444" y="62" width="96" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="492" y="83" font-size="11.5" text-anchor="middle" fill="#b91c1c">14~12</text>
<text x="492" y="104" font-family="Consolas,monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#991b1b">010</text>
<text x="492" y="120" font-size="11" text-anchor="middle" fill="#b91c1c">funct3</text>

<rect x="548" y="62" width="148" height="64" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="622" y="83" font-size="11.5" text-anchor="middle" fill="#6b7280">11~7 · rd</text>
<text x="622" y="104" font-family="Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">00100</text>
<text x="622" y="120" font-size="11" text-anchor="middle" fill="#9ca3af">r4 = 04H</text>

<rect x="24" y="134" width="672" height="46" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="38" y="154" font-size="11.5" fill="#6b7280">6~0 · opcode</text>
<text x="38" y="172" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#1f2937">0010011</text>
<text x="150" y="163" font-size="11.5" fill="#6b7280">“由表可知”的操作码，别用标准 RISC-V 记</text>

<rect x="24" y="192" width="672" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
<text x="38" y="215" font-family="Consolas,monospace" font-size="12" fill="#047857">按顺序拼：0000000 00010 00010 010 00100 0010011</text>
<text x="38" y="239" font-family="Consolas,monospace" font-size="15" font-weight="700" fill="#065f46">机器码 = 0021 2213H</text>

<rect x="24" y="262" width="672" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="38" y="286" font-size="13" font-weight="700" fill="#991b1b">陷阱：funct3 取 010，不是标准 RISC-V 的 001</text>
<text x="38" y="308" font-size="12" fill="#b91c1c">这是题 43 自定义 ISA M，解析写明“由表可知为 010”；误用 001 会算成 0021 1213H</text>

<rect x="24" y="336" width="672" height="76" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
<text x="38" y="360" font-size="13" font-weight="700" fill="#5b21b6">a 改为 short：元素 2 字节 → 偏移 ×2 → 左移 1 位</text>
<text x="38" y="383" font-family="Consolas,monospace" font-size="12.5" fill="#4c1d95">slli r4, r2, 1</text>
<text x="38" y="404" font-family="Consolas,monospace" font-size="11.5" fill="#6d28d9">机器码 0011 2213H（仅 shamt 由 00010 变 00001）</text>
</g>
</svg>