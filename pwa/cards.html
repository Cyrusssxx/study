<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>记忆卡 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fc-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="quiz.html" class="nav-link">刷题</a>
                <a href="cards.html" class="nav-link">记忆卡</a>
                <a href="daka.html" class="nav-link">打卡表</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="fc-wrap">
        <!-- 四组卡片：按科目切换 -->
        <div class="fc-chips" id="fcSubjects"></div>

        <div class="fc-progress">
            <span id="fcCount">0 / 0</span>
            <div class="fc-bar"><div class="fc-bar-fill" id="fcBar"></div></div>
            <span id="fcKnown">已掌握 0</span>
        </div>

        <!-- 筛选：全部 / 未掌握 / 已掌握 -->
        <div class="fc-chips" id="fcFilters"></div>

        <div class="fc-stage" id="fcStage">
            <div class="fc-card" id="fcCard">
                <div class="fc-face fc-front" id="fcFront"></div>
                <div class="fc-face fc-back" id="fcBack"></div>
            </div>
        </div>
    </main>

    <!-- 底部操作栏：固定在视口底，触控区 ≥48px，适配 iOS 安全区 -->
    <div class="fc-actions">
        <button class="fc-btn" onclick="prevCard()" title="上一张">←</button>
        <button class="fc-btn fc-btn-main" onclick="flipCard()" id="fcFlipBtn">翻转</button>
        <button class="fc-btn" onclick="toggleKnown()" id="fcKnownBtn">记住了</button>
        <button class="fc-btn" onclick="nextCard()" title="下一张">→</button>
    </div>

    <script src="js/common.js"></script>
    <script src="js/cards.js"></script>
</body>
</html>
