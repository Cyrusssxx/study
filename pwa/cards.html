<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>记忆卡 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fc-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="quiz.html" class="nav-link">刷题</a>
                <a href="daily.html" class="nav-link">每日一题</a>
                <a href="cards.html" class="nav-link">记忆卡</a>
                <a href="daka.html" class="nav-link">打卡表</a>
            </div>
            <div class="nav-tools">
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="fc-wrap">
        <!-- 四组卡片：按科目切换 -->
        <div class="fc-chips" id="fcSubjects"></div>

        <div class="fc-progress">
            <span id="fcCount">0 / 0</span>
            <div class="fc-bar"><div class="fc-bar-fill" id="fcBar"></div></div>
            <span id="fcKnown">熟 0</span>
        </div>

        <!-- 筛选：全部 / 未熟 / 熟 -->
        <div class="fc-chips" id="fcFilters"></div>

        <div class="fc-stage" id="fcStage">
            <div class="fc-card" id="fcCard">
                <!-- 右上角：熟 / 收藏（点按钮不触发卡片查看） -->
                <div class="fc-corner">
                    <button class="fc-corner-btn" id="fcKnownBtn" onclick="event.stopPropagation();toggleKnown()" title="熟了不再加入记忆">熟</button>
                    <button class="fc-corner-btn" id="fcFavBtn" onclick="event.stopPropagation();toggleFav()" title="收藏卡片">☆ 收藏</button>
                </div>
                <div class="fc-body" id="fcBody"></div>
            </div>
        </div>
    </main>

    <!-- 底部操作栏：固定在视口底，触控区 ≥48px，适配 iOS 安全区 -->
    <div class="fc-actions">
        <button class="fc-btn" onclick="prevCard()" title="上一张">←</button>
        <button class="fc-btn" id="fcWeakUBtn" onclick="toggleWeak('u')" title="标记不熟">不熟</button>
        <button class="fc-btn" id="fcWeakDBtn" onclick="toggleWeak('d')" title="标记不会">不会</button>
        <button class="fc-btn" onclick="nextCard()" title="下一张">→</button>
    </div>

    <script src="js/common.js"></script>
    <script src="js/cards.js"></script>
</body>
</html>
