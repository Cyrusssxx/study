<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题 - 408刷题</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if (localStorage.getItem('darkMode') === '1') document.documentElement.classList.add('dark');</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">408刷题</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="wrong.html" class="nav-link">错题本</a>
                <a href="favorites.html" class="nav-link">收藏夹</a>
                <a href="exam.html" class="nav-link">模拟考试</a>
                <a href="stats.html" class="nav-link">学习统计</a>
                <a href="search.html" class="nav-link">搜题</a>
                <a href="dati.html" class="nav-link">大题专项</a>
                <a href="algo.html" class="nav-link">算法讲义</a>
            </div>
            <div class="nav-tools">
                <span class="nav-timer" id="navTimer" title="今日刷题时长（切换到其他窗口时暂停）">⏱ 00:00:00</span>
                <button class="nav-switch" id="reciteSwitch" onclick="toggleRecite()" title="背题模式：直接显示答案与解析，不计入答题记录">
                    背题 <span class="switch-state" id="reciteState">关</span>
                </button>
                <button class="nav-switch" id="autoNextSwitch" onclick="toggleAutoNext()" title="答对自动进入下一题">
                    跳题 <span class="switch-state" id="autoNextState">关</span>
                </button>
                <button class="nav-switch" id="quickSwitch" onclick="toggleQuick()" title="快刷模式：点选项直接判对错，免按提交">
                    快刷 <span class="switch-state" id="quickState">关</span>
                </button>
                <button class="nav-switch" id="darkSwitch" onclick="toggleDark()" title="夜间模式：深色主题护眼">
                    夜间 <span class="switch-state" id="darkState">关</span>
                </button>
            </div>
        </div>
    </nav>
    <main class="container">
        <div class="quiz-layout" id="quizLayout">
            <button class="side-toggle" id="chapterToggle" onclick="toggleQuizSidebar('chapter')"
                title="收起/展开章节导航" aria-label="收起/展开章节导航"></button>
            <aside class="chapter-sidebar">
                <div class="sidebar-title" onclick="this.parentElement.classList.toggle('collapsed')">
                    章节导航 <span class="sidebar-toggle">▾</span>
                </div>
                <div class="chapter-tree" id="chapterTree">
                    <div class="loading">加载中...</div>
                </div>
            </aside>

            <div class="quiz-container">
                <div class="quiz-header">
                    <div class="quiz-info">
                        <h2 id="subjectTitle"></h2>
                        <span class="mode-badge" id="modeBadge"></span>
                        <button class="opt-shuffle-btn" id="shuffleBtn" onclick="toggleShuffle()" title="打乱选项显示顺序（字母跟随内容，答案字母不变）">选项乱序 <span id="shuffleState">关</span></button>
                        <button class="opt-shuffle-btn" onclick="openKeybindDialog()" title="切换练习模式 / 自定义上一题/下一题快捷键">设置 ⚙</button>
                        <select class="quiz-year-filter" id="yearFilter" onchange="onYearChange()" style="display:none" title="按统考真题年份筛选">
                            <option value="">全部年份</option>
                        </select>
                        <button class="opt-shuffle-btn" id="favResetBtn" style="display:none" onclick="resetFavProgress()" title="清空收藏题的作答与错题记录，重新刷一遍（收藏保留）">清空重做 ⟳</button>
                        <button class="opt-shuffle-btn" id="favWrongResetBtn" style="display:none" onclick="resetFavWrong()" title="只把收藏模式下的错题从错题本移除：其他题的错题不受影响，作答记录与正确率保留，收藏也保留">清空收藏错题 🗑</button>
                        <div class="review-chips" id="reviewChips" style="display:none"></div>
                    </div>
                    <div class="quiz-nav-info">
                        <span id="questionProgress">加载中...</span>
                    </div>
                </div>

                <!-- 题目区域 -->
                <div class="question-area" id="questionArea">
                    <div class="loading">正在加载题目...</div>
                </div>

                <!-- 导航按钮 -->
                <div class="quiz-footer">
                    <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()" disabled>上一题</button>
                    <button class="btn btn-primary" id="btnSubmit" onclick="submitAnswer()">提交答案</button>
                    <button class="btn btn-secondary" id="btnNext" onclick="nextQuestion()">下一题</button>
                </div>
            </div>

            <aside class="number-sidebar">
                <div class="sidebar-title">题号</div>
                <div class="number-panel" id="numberPanel"></div>
            </aside>
            <button class="side-toggle" id="numberToggle" onclick="toggleQuizSidebar('number')"
                title="收起/展开题号" aria-label="收起/展开题号"></button>
        </div>
    </main>

    <!-- 练习设置弹窗：模式切换 + 快捷键统一管理 -->
    <div class="kb-overlay" id="kbOverlay" hidden onclick="if(event.target===this)closeKeybindDialog()">
        <div class="kb-dialog">
            <div class="kb-head">
                <span>练习设置</span>
                <button class="kb-close" onclick="closeKeybindDialog()" title="关闭">✕</button>
            </div>
            <div class="kb-sec-title">练习模式</div>
            <div class="mode-switch" id="modeSwitch"></div>
            <p class="kb-hint" id="modeSwitchHint">切换后题目列表立即刷新，无需退出本页；下次进入默认沿用所选模式。</p>
            <div class="kb-sec-title">快捷键</div>
            <div class="kb-row">
                <span class="kb-label">上一题</span>
                <button class="kb-capture" id="kbPrev" onclick="startCapture('prev')" title="点击后按任意键或鼠标侧键">←</button>
            </div>
            <div class="kb-row">
                <span class="kb-label">下一题</span>
                <button class="kb-capture" id="kbNext" onclick="startCapture('next')" title="点击后按任意键或鼠标侧键">→</button>
            </div>
            <label class="kb-row kb-guard">
                <span class="kb-label">侧键拦截<span class="kb-guard-tag">防后退/前进</span></span>
                <input type="checkbox" id="kbSideGuard" onchange="toggleSideGuard()">
            </label>
            <p class="kb-hint">点击方框后按键盘任意键或鼠标侧键（浏览器前进/后退键）即可绑定；默认已绑定鼠标侧键：侧键上=上一题、侧键下=下一题。开启「侧键拦截」后，侧键在本页完全劫持为翻题，绝不会触发浏览器后退/前进。</p>
            <div class="kb-actions">
                <button class="btn btn-secondary" onclick="resetKeybinds()">恢复默认</button>
                <button class="btn btn-primary" onclick="closeKeybindDialog()">完成</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/background.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/backend.js"></script>
    <script>
    // 原 Flask 版由 Jinja 注入，PWA 版改从 URL 参数读取
    const _params = new URLSearchParams(location.search);
    const SUBJECT = _params.get('subject') || 'os';
    const NOTES_SUBJECTS = ['os', 'co', 'ds', 'cn'];  // 已有考点笔记的科目，徽章白名单化防死链
    // 可在练习设置面板内热切换的模式（无需退出页面）
    const SWITCHABLE_MODES = ['sequential', 'favorite', 'real', 'fav_real'];
    let MODE = _params.get('mode') || '';
    const CHAPTER = _params.get('chapter') || '';
    // 记住上次选择的模式：无显式 mode 参数且无定位参数时沿用偏好（首页按钮等显式入口以参数为准）
    if (!MODE && !CHAPTER && !_params.get('goto')) {
        try { MODE = localStorage.getItem('quiz_mode_pref_' + SUBJECT) || ''; } catch (e) { }
    }
    if (!MODE) MODE = 'sequential';
    const SECTION = _params.get('section') || '';
    const YEAR = _params.get('year') || '';   // 真题年份筛选（仅真题模式生效）
    const STAGE = _params.get('stage') || ''; // 复习阶段筛选（仅 review 模式生效）：2/4/7/15 天期
    const FRESH = _params.get('fresh') === '1'; // fresh=1：跳过位置恢复，从第 1 题开始
    let questions = [];
    let quizAllQuestions = [];   // 真题年份前端筛选的基准集合
    let _secOrdinal = {};        // {qid: 节内序号}——按全库编号顺序，题在其 section 内排第几
    let currentIndex = 0;
    let totalQuestions = 0;
    let answered = {};  // {questionId: {answer, isCorrect}}
    let explanationShown = false;  // 当前题解析面板是否展开
    let noteShown = false;  // 当前题笔记面板是否展开
    const hasNoteOf = q => !!(q.note || (q.note_images || []).length);  // 题目是否有笔记（文本或图片）
    let optionOrder = {};  // {qid: [key,...]} 选项乱序开启时每题的显示顺序缓存
    let favWrongCount = 0; // 收藏题当前的错题记录条数（含已解决），给「清空收藏错题」按钮做计数与禁用

    const modeNames = {
        'sequential': '顺序模式',
        'random': '随机模式',
        'wrong': '错题模式',
        'favorite': '收藏模式',
        'unanswered': '未做模式',
        'real': '真题模式',
        'fav_real': '收藏+真题',
        'code': '代码专项',
        'smart': '智能模式',
        'review': '复习模式'
    };

    const SUBJECT_NAME = (SUBJECTS[SUBJECT] || {}).name || SUBJECT;
    document.title = `${SUBJECT_NAME} - 刷题`;
    document.getElementById('subjectTitle').textContent = SUBJECT_NAME;
    document.getElementById('modeBadge').textContent = modeNames[MODE] || MODE;
    document.getElementById('modeBadge').dataset.mode = MODE;

    // 初始化
    async function init() {
        initQuizSidebars();
        loadChapterTree();
        await loadQuizQuestions();
    }

    // ==================== 左右侧栏整栏收起/展开（状态持久化） ====================
    function toggleQuizSidebar(side) {
        const layout = document.getElementById('quizLayout');
        const cls = side === 'chapter' ? 'chapter-collapsed' : 'number-collapsed';
        const collapsed = layout.classList.toggle(cls);
        localStorage.setItem('quiz_sidebar_' + side, collapsed ? '1' : '0');
    }

    function initQuizSidebars() {
        const layout = document.getElementById('quizLayout');
        if (!layout) return;
        ['chapter', 'number'].forEach(side => {
            // v2 改用新 key（旧 key quiz_*_collapsed 残留会让侧栏意外收起，作废）
            localStorage.removeItem('quiz_' + side + '_collapsed');
            if (localStorage.getItem('quiz_sidebar_' + side) === '1') {
                layout.classList.add(side === 'chapter' ? 'chapter-collapsed' : 'number-collapsed');
            }
        });
    }

    // ==================== 自定义快捷键：上一题/下一题（键盘 + 鼠标侧键） ====================
    const KB_KEY = 'quiz_keybinds_v1';
    let keybinds = { prev: 'mouse3', next: 'mouse4' };   // 默认：鼠标侧键上=上一题、侧键下=下一题
    try { keybinds = Object.assign({}, keybinds, JSON.parse(localStorage.getItem(KB_KEY) || '{}')); } catch (e) { }
    let sideGuard = localStorage.getItem('quiz_sideguard') !== '0';  // 默认开：侧键在本页完全劫持
    let capturing = null;

    function toggleSideGuard() {
        sideGuard = document.getElementById('kbSideGuard').checked;
        localStorage.setItem('quiz_sideguard', sideGuard ? '1' : '0');
    }

    function kbName(code) {
        if (code === 'mouse3') return '鼠标侧键 · 上';
        if (code === 'mouse4') return '鼠标侧键 · 下';
        const map = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: '空格', Enter: '回车', Tab: 'Tab', Backspace: '退格', Delete: 'Delete', Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown', Escape: 'Esc' };
        if (map[code]) return map[code];
        return code.replace(/^Key/, '').replace(/^Digit/, '').replace(/^Numpad/, '小键盘 ');
    }

    function openKeybindDialog() {
        document.getElementById('kbPrev').textContent = kbName(keybinds.prev);
        document.getElementById('kbNext').textContent = kbName(keybinds.next);
        document.getElementById('kbSideGuard').checked = sideGuard;
        renderModeSwitch();
        document.getElementById('kbOverlay').hidden = false;
    }

    // ==================== 练习模式热切换（收藏 / 真题 / 收藏+真题 / 顺序） ====================
    function renderModeSwitch() {
        const box = document.getElementById('modeSwitch');
        box.innerHTML = SWITCHABLE_MODES.map(m =>
            `<button class="mode-chip ${m === MODE ? 'active' : ''}" onclick="switchPracticeMode('${m}')" ${m === MODE ? 'disabled' : ''}>${modeNames[m]}</button>`
        ).join('');
        // 当前模式不在可切换列表（如错题/复习模式进入）时给出提示，避免误以为面板失效
        const hint = document.getElementById('modeSwitchHint');
        if (!SWITCHABLE_MODES.includes(MODE)) {
            hint.textContent = `当前为「${modeNames[MODE] || MODE}」，从下方选择一种模式即可切换；切换后立即刷新题目列表。`;
            hint.style.color = 'var(--accent, #b45309)';
        } else {
            hint.textContent = '切换后题目列表立即刷新，无需退出本页；下次进入默认沿用所选模式。';
            hint.style.color = '';
        }
    }

    function updateModeBadge() {
        const badge = document.getElementById('modeBadge');
        badge.textContent = modeNames[MODE] || MODE;
        badge.dataset.mode = MODE;   // 供 CSS 按模式着色（视觉反馈）
    }

    function switchPracticeMode(m) {
        if (m === MODE || !SWITCHABLE_MODES.includes(m)) { closeKeybindDialog(); return; }
        MODE = m;
        try { localStorage.setItem('quiz_mode_pref_' + SUBJECT, m); } catch (e) { }
        // 同步 URL：刷新/分享保持所选模式；清掉定位参数避免被钉回旧题
        try {
            const u = new URL(location.href);
            u.searchParams.set('mode', m);
            u.searchParams.delete('goto');
            history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
        } catch (e) { }
        // 重置瞬态状态后整列重载
        currentIndex = 0;
        document.getElementById('yearFilter').style.display = 'none';
        document.getElementById('favResetBtn').style.display = 'none';
        document.getElementById('favWrongResetBtn').style.display = 'none';
        document.getElementById('reviewChips').style.display = 'none';
        closeKeybindDialog();
        updateModeBadge();
        // 章节树链接是页面加载时按当时模式生成的，热切换后需就地改写，
        // 否则点章节会跳回旧模式（树不重渲染）
        try {
            document.querySelectorAll('#chapterTree a[href]').forEach(a => {
                const u = new URL(a.href, location.href);
                u.searchParams.set('mode', m);
                a.href = u.pathname + u.search;
            });
        } catch (e) { }
        loadQuizQuestions();
    }
    function closeKeybindDialog() { stopCapture(); document.getElementById('kbOverlay').hidden = true; }
    function startCapture(side) {
        stopCapture();
        capturing = side;
        const btn = document.getElementById(side === 'prev' ? 'kbPrev' : 'kbNext');
        btn.classList.add('capturing');
        btn.textContent = '请按键…';
    }
    function stopCapture() {
        if (!capturing) return;
        capturing = null;
        document.querySelectorAll('.kb-capture').forEach(b => b.classList.remove('capturing'));
    }
    function applyCapture(code) {
        if (!capturing) return;
        const side = capturing;
        stopCapture();
        keybinds[side] = code;
        localStorage.setItem(KB_KEY, JSON.stringify(keybinds));
        document.getElementById(side === 'prev' ? 'kbPrev' : 'kbNext').textContent = kbName(code);
    }
    function resetKeybinds() {
        keybinds = { prev: 'mouse3', next: 'mouse4' };
        localStorage.setItem(KB_KEY, JSON.stringify(keybinds));
        openKeybindDialog();
    }
    function inEditable(e) {
        const t = e && e.target;
        return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    }
    // 键盘：捕获 + 触发翻题
    document.addEventListener('keydown', e => {
        if (capturing) { e.preventDefault(); e.stopPropagation(); applyCapture(e.code); return; }
        if (inEditable(e) || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
        if (e.code === keybinds.prev) { e.preventDefault(); prevQuestion(); }
        else if (e.code === keybinds.next) { e.preventDefault(); nextQuestion(); }
    });
    // ==================== 鼠标侧键（button 3/4）：拦截前进/后退 + 翻题 ====================
    // 双层防护：
    //  1) mousedown/mouseup/auxclick 捕获阶段 preventDefault（多数 Chrome 版本有效）
    //  2) popstate 兜底——若某版本 Chrome 在浏览器进程层直接执行后退/前进（JS 拦不住），
    //     导航发生后立即恢复历史锚点，并把侧键转成翻题（用户感知=侧键直接翻题，绝不后退）
    let lastSideKeyAt = 0, lastSideButton = 0, popHandledAt = 0;
    const sideTakeover = e => {   // 该侧键是否应由本页接管
        const code = e.button === 3 ? 'mouse3' : 'mouse4';
        return capturing || sideGuard || code === keybinds.prev || code === keybinds.next;
    };
    ['mousedown', 'mouseup'].forEach(evt => {
        document.addEventListener(evt, e => {
            if (e.button !== 3 && e.button !== 4 || inEditable(e)) return;
            if (sideTakeover(e)) {
                lastSideKeyAt = Date.now();
                lastSideButton = e.button;
                e.preventDefault();
            }
        }, true);
    });
    document.addEventListener('auxclick', e => {
        const b = e.button;
        if (b !== 3 && b !== 4) return;
        lastSideKeyAt = Date.now();
        lastSideButton = b;
        if (capturing) { e.preventDefault(); e.stopPropagation(); applyCapture(b === 3 ? 'mouse3' : 'mouse4'); return; }
        if (inEditable(e)) return;
        if (sideTakeover(e)) {
            e.preventDefault();
            if (Date.now() - popHandledAt < 120) return;   // popstate 兜底刚翻过题，防双翻
            if (b === 3 && keybinds.prev === 'mouse3') prevQuestion();
            else if (b === 4 && keybinds.next === 'mouse4') nextQuestion();
        }
    });
    // popstate 兜底：同文档后退/前进发生瞬间恢复 + 转翻题
    window.addEventListener('popstate', () => {
        if (Date.now() - lastSideKeyAt > 400) return;   // 非侧键引起（手动后退等）→ 放行
        if (Date.now() - popHandledAt < 50) return;
        popHandledAt = Date.now();
        try { history.pushState({ quizGuard: 1 }, '', location.href); } catch (err) { }
        if (lastSideButton === 3 && keybinds.prev === 'mouse3') prevQuestion();
        else if (lastSideButton === 4 && keybinds.next === 'mouse4') nextQuestion();
    });
    // Firefox 专用侧键事件
    document.addEventListener('mouseback', e => {
        e.preventDefault();
        if (capturing) applyCapture('mouse3');
        else if (keybinds.prev === 'mouse3') prevQuestion();
    });
    document.addEventListener('mouseforward', e => {
        e.preventDefault();
        if (capturing) applyCapture('mouse4');
        else if (keybinds.next === 'mouse4') nextQuestion();
    });
    // 进入页面制造同文档历史锚点：否则侧键后退=跨文档导航（页面卸载），popstate 兜底失效
    try { history.pushState({ quizGuard: 1 }, '', location.href); } catch (err) { }

    // 按「全库编号升序」给每题计算其「小节/节」内的序号（题头「小节 · 第 n 题」用）
    // 优先按小节（subsection）分组，无小节字段回落节（section）
    function _buildSecOrdinal(list) {
        _secOrdinal = {};
        const bySec = {};
        for (const q of list) {
            const k = q.subsection || q.section || '';
            (bySec[k] = bySec[k] || []).push(q);
        }
        for (const k of Object.keys(bySec))
            bySec[k].sort((a, b) => a.number - b.number).forEach((q, i) => { _secOrdinal[q.id] = i + 1; });
    }

    // 题头知识点名：优先小节（已精确到小节），回落节
    function secLabel(q) { return q.subsection || q.section || ''; }

    let _loadSeq = 0;   // 加载序号：模式热切换时丢弃过期响应，防止竞态覆盖

    async function loadQuizQuestions() {
        const seq = ++_loadSeq;
        try {
            const stageQ = (MODE === 'review' && STAGE) ? `&stage=${encodeURIComponent(STAGE)}` : '';
            const resp = await api(`/api/questions/${SUBJECT}?mode=${MODE}&page=1&per_page=9999${stageQ}`);
            if (seq !== _loadSeq) return;   // 已有更新的加载，丢弃本次结果
            const data = await resp.json();
            questions = data.questions;
            quizAllQuestions = data.questions;
            // 题头显示「小节 · 节内第几题」：按全库编号顺序给每题算节内序号
            _buildSecOrdinal(data.questions);
            // 非 sequential 模式下当前集合是子集（收藏/错题/随机…），再拉一次全量库作序号基准
            if (MODE !== 'sequential') {
                api(`/api/questions/${SUBJECT}?mode=sequential&page=1&per_page=9999`)
                    .then(r => r.json())
                    .then(full => { if (seq !== _loadSeq) return; _buildSecOrdinal(full.questions); if (questions[currentIndex]) renderQuestion(); })
                    .catch(() => { });
            }
            // 真题年份筛选（P2）：仅真题模式展示下拉，前端按 exam_year 过滤，无需额外请求
            setupYearFilter();
            totalQuestions = questions.length;

            // 恢复历史答题记录（last_status），刷新/跳转页面后不丢失
            for (const q of questions) {
                if (q.last_status && !answered[q.id]) {
                    answered[q.id] = {
                        answer: q.last_status.user_answer,
                        isCorrect: q.answer ? !!q.last_status.is_correct : null,
                        correctAnswer: q.answer || ''
                    };
                }
            }

            if (totalQuestions === 0) {
                document.getElementById('questionArea').innerHTML = `
                    <div class="empty-state">
                        <h3>暂无题目</h3>
                        <p>${MODE === 'wrong' ? '恭喜！没有错题需要复习' : MODE === 'review' ? '今日没有到期的复习题 🎉' : MODE === 'favorite' ? '还没有收藏任何题目' : MODE === 'fav_real' ? '还没有收藏任何统考真题（先在收藏模式收藏真题，或直接用真题模式）' : MODE === 'code' ? '该科目暂无含代码的题目' : '题库为空'}</p>
                        <a href="index.html" class="btn btn-primary">返回首页</a>
                    </div>
                `;
                return;
            }

            // 收藏/收藏+真题模式：显示「清空重做」与「清空收藏错题」按钮
            if (MODE === 'favorite' || MODE === 'fav_real') {
                document.getElementById('favResetBtn').style.display = '';
                document.getElementById('favWrongResetBtn').style.display = '';
                updateFavWrongCount();
            }

            // 章节定位：不限制筛选，直接跳到该章节首题，仍可顺序刷到后面的题
            if (CHAPTER) {
                const idx = questions.findIndex(q =>
                    q.chapter === CHAPTER && (!SECTION || q.section === SECTION));
                if (idx >= 0) currentIndex = idx;
            }

            // 指定题定位（搜索/错题本点击跳转）：?goto=题目ID，优先级高于章节定位
            const GOTO = _params.get('goto');
            if (GOTO) {
                const gi = questions.findIndex(q => q.id === GOTO);
                if (gi >= 0) currentIndex = gi;
                // 定位完成后清掉 goto 参数：否则刷新永远被钉回该题，位置恢复失效
                try {
                    const u = new URL(location.href);
                    u.searchParams.delete('goto');
                    history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
                } catch (e) { }
            }

            // 刷新后自动回到上次做的题：无显式 chapter/goto 定位时恢复
            // fresh=1（首页「顺序刷题」）跳过恢复，从第 1 题开始
            // ① 优先读本页专用位置存档（quiz_pos_<科目>_<模式>，不受全局历史6条上限挤掉）
            // ② 兜底再查 practiceHistory（供首页「继续上次练习」的共享记录）
            if (!CHAPTER && !GOTO && !FRESH) {
                try {
                    const pos = JSON.parse(localStorage.getItem('quiz_pos_' + SUBJECT + '_' + MODE) || 'null');
                    if (pos && pos.qid) {
                        const pi = questions.findIndex(q => q.id === pos.qid);
                        if (pi >= 0) currentIndex = pi;
                    }
                } catch (e) { }
                if (currentIndex === 0) {
                    try {
                        const key = [SUBJECT, MODE, CHAPTER, SECTION].join('|');
                        const list = JSON.parse(localStorage.getItem('practiceHistory')) || [];
                        const rec = list.find(e => [e.subject, e.mode, e.chapter || '', e.section || ''].join('|') === key);
                        if (rec && rec.qid) {
                            const ri = questions.findIndex(q => q.id === rec.qid);
                            if (ri >= 0) currentIndex = ri;
                        }
                    } catch (e) { /* 恢复失败保持首题 */ }
                }
            }

            noteShown = hasNoteOf(questions[currentIndex]);  // 有笔记（文本或图片）的题默认展开笔记面板
            renderQuestion();
        } catch (e) {
            document.getElementById('questionArea').innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
        }
    }

    // 真题年份下拉：从已加载题目的 exam_year 收集可选年份；真题模式才显示
    function setupYearFilter() {
        const ys = document.getElementById('yearFilter');
        if (!ys) return;
        if (!(MODE === 'real' || MODE === 'fav_real')) { ys.style.display = 'none'; return; }
        ys.style.display = '';
        const years = [...new Set(quizAllQuestions.map(q => q.exam_year).filter(Boolean))].sort((a, b) => b - a);
        ys.innerHTML = '<option value="">全部年份</option>' + years.map(y =>
            `<option value="${y}">${y} 年 (${quizAllQuestions.filter(q => q.exam_year === y).length})</option>`).join('');
        if (YEAR) ys.value = YEAR;
        else { const py = PS.get({ year: '' }).year; if (py && [...ys.options].some(o => o.value === py)) ys.value = py; }
        const y = ys.value;
        if (y) questions = quizAllQuestions.filter(q => String(q.exam_year) === String(y));
    }

    // 切换年份：重新筛选题目并回到第一题
    function onYearChange() {
        const y = document.getElementById('yearFilter').value;
        PS.set({ year: y });
        questions = y ? quizAllQuestions.filter(q => String(q.exam_year) === String(y)) : quizAllQuestions.slice();
        totalQuestions = questions.length;
        currentIndex = 0;
        explanationShown = false;
        noteShown = false;
        renderQuestion();
    }

    // ============ 侧边栏章节树 ============
    // 仅在容器内部滚动到目标元素，不带动整页（手机上 scrollIntoView 会把页面拽到侧栏区）
    function scrollInContainer(container, el, center) {
        const cRect = container.getBoundingClientRect();
        const eRect = el.getBoundingClientRect();
        if (center) {
            container.scrollTop += eRect.top - cRect.top - (container.clientHeight - eRect.height) / 2;
        } else if (eRect.top < cRect.top || eRect.bottom > cRect.bottom) {
            container.scrollTop += eRect.top < cRect.top
                ? eRect.top - cRect.top
                : eRect.bottom - cRect.bottom;
        }
    }

    async function loadChapterTree() {
        try {
            const resp = await api('/api/chapters');
            const data = await resp.json();
            renderChapterTree(data);
        } catch (e) {
            document.getElementById('chapterTree').innerHTML = '<div class="error">章节加载失败</div>';
        }
    }

    function chapterLink(subjectKey, chapterName, sectionName) {
        // 保留当前模式（真题/未做等），点章节只收窄范围不退出模式
        let url = `quiz.html?subject=${subjectKey}&mode=${MODE}&chapter=${encodeURIComponent(chapterName)}`;
        if (sectionName) url += `&section=${encodeURIComponent(sectionName)}`;
        return url;
    }

    function renderChapterTree(data) {
        let treeHtml = '';
        for (const [key, sub] of Object.entries(data)) {
            const isCur = key === SUBJECT;
            let chaptersHtml = '';
            sub.chapters.forEach((ch, idx) => {
                const numMatch = ch.name.match(/第(\d+)章/);
                const chNum = String(numMatch ? numMatch[1] : idx + 1).padStart(2, '0');
                const chActive = isCur && CHAPTER === ch.name;
                let sectionsHtml = `
                    <a class="tree-section ${chActive && !SECTION ? 'active' : ''}" href="${chapterLink(key, ch.name, '')}">本章全部<span class="tree-count">${ch.count}题</span></a>`;
                for (const s of ch.sections) {
                    const secActive = chActive && SECTION === s.name;
                    sectionsHtml += `
                    <a class="tree-section ${secActive ? 'active' : ''}" href="${chapterLink(key, ch.name, s.name)}">${s.name}<span class="tree-count">${s.count}题</span></a>`;
                }
                chaptersHtml += `
                <div class="tree-chapter ${chActive ? 'open active' : ''}">
                    <div class="tree-chapter-row" onclick="this.parentElement.classList.toggle('open')">
                        <span class="tree-ch-num">${chNum}</span>
                        <span class="tree-ch-name">${ch.name}</span>
                        <span class="tree-count">${ch.count}题</span>
                        <span class="tree-arrow">›</span>
                    </div>
                    <div class="tree-sections">${sectionsHtml}</div>
                </div>`;
            });
            treeHtml += `
            <div class="tree-subject ${isCur ? 'open' : ''}">
                <div class="tree-subject-header" onclick="this.parentElement.classList.toggle('open')">
                    <span class="tree-subject-name">${sub.name}</span>
                    <span class="tree-count">${sub.total}题</span>
                    <span class="tree-arrow">▾</span>
                </div>
                <div class="tree-chapters">${chaptersHtml}</div>
            </div>`;
        }
        document.getElementById('chapterTree').innerHTML = treeHtml;
        // 滚动到当前选中项（只滚树容器，不滚页面）
        const active = document.querySelector('.tree-section.active');
        if (active) scrollInContainer(document.getElementById('chapterTree'), active, true);
    }

    function renderQuestion() {
        if (currentIndex >= questions.length) return;

        const q = questions[currentIndex];
        const status = answered[q.id];
        const isFav = q.is_favorited;
        const recite = isReciteOn();  // 背题模式：直接显示答案解析，不可作答

        document.getElementById('questionProgress').textContent = `${currentIndex + 1} / ${totalQuestions}`;
        document.getElementById('btnPrev').disabled = currentIndex === 0;

        const isMulti = !!q.multi_blank;  // 多空题：题干多个 ( ) 各选一个字母，答案按顺序拼成字符串
        const locked = !!(status || recite);
        let optionsHtml = '';
        for (const key of getOptionOrder(q)) {
            const value = q.options[key];
            let optClass = 'option-item';
            if (status) {
                if (key === status.correctAnswer) optClass += ' correct';
                else if (key === status.answer && !status.isCorrect) optClass += ' wrong';
            } else if (recite && key === q.answer) {
                optClass += ' correct';  // 背题模式：未作答也直接标出正确选项
            }
            const checked = status && status.answer === key ? 'checked' : '';
            const disabled = locked ? 'disabled' : '';
            optionsHtml += `
                <label class="${optClass}">
                    <input type="radio" name="answer" value="${key}" ${checked} ${disabled} onchange="onOptionPicked()">
                    <span class="option-letter">${key}</span>
                    <span class="option-text">${value}</span>
                </label>
            `;
        }

        let resultHtml = '';
        if (status) {
            if (status.isCorrect === true) {
                resultHtml = '<div class="result-correct">回答正确!</div>';
            } else if (status.isCorrect === false) {
                resultHtml = `<div class="result-wrong">回答错误! 正确答案: ${isMulti && status.correctAnswer ? [...status.correctAnswer].join('、') : status.correctAnswer}</div>`;
            } else {
                resultHtml = '<div class="result-info">该题暂无标准答案</div>';
            }
        }

        // 解析面板（支持HTML格式解析内容；背题模式下常驻展开）
        let explanationHtml = '';
        if (explanationShown || recite) {
            const expl = q.explanation
                ? `<div class="explanation-body">${q.explanation}</div>`
                : '<div class="explanation-empty">该题暂无详细解析</div>';
            explanationHtml = `
                <div class="explanation-panel">
                    <div class="explanation-title">答案解析</div>
                    <div class="explanation-meta">
                        ${q.answer ? `<span class="expl-answer">正确答案：${q.multi_blank ? [...q.answer].join('、') : q.answer}</span>` : '<span class="expl-answer">暂无标准答案</span>'}
                        ${q.chapter ? `<span class="expl-kp">知识点：${q.chapter}${secLabel(q) ? ' · ' + secLabel(q) : ''}</span>` : ''}
                    </div>
                    ${expl}
                </div>`;
        }

        // 笔记面板（内容用DOM赋值，避免HTML转义问题）；已有笔记时仅淡化保存按钮，聚焦编辑恢复
        let noteHtml = '';
        if (noteShown) {
            const hasNote = !!(q.note || (q.note_images || []).length);
            noteHtml = `
                <div class="note-panel">
                    <div class="note-title">我的笔记</div>
                    <textarea id="noteInput" class="note-input" rows="4" spellcheck="false" onfocus="onNoteEdit()" oninput="autoResizeNote(this); onNoteInput()" onpaste="pasteNoteImage(event)" placeholder="记下你的解题思路、易错点...（Ctrl+V 可直接粘贴截图；停顿即自动保存；清空内容保存即删除笔记）"></textarea>
                    <div class="note-images" id="noteImages"></div>
                    <div class="note-actions">
                        <button class="btn btn-primary btn-sm note-save-btn${hasNote ? ' saved' : ''}" id="noteSaveBtn" onclick="saveNote()">保存笔记</button>
                        <span class="note-hint" id="noteHint"></span>
                    </div>
                </div>`;
        }

        document.getElementById('questionArea').innerHTML = `
            <div class="question-card">
                <div class="question-header">
                    <div class="question-meta">
                        <span class="question-number">${secLabel(q) && _secOrdinal[q.id] ? `${secLabel(q)} · 第 ${_secOrdinal[q.id]} 题` : `题号 ${q.number}`}（本轮第 ${currentIndex + 1} 题）</span>
                        ${q.is_real_exam ? `<span class="badge-real">${q.exam_year ? q.exam_year + ' ' : ''}统考真题</span>` : ''}
                        ${q.chapter ? (NOTES_SUBJECTS.includes(SUBJECT) && q.section
                            ? `<a class="chapter-badge chapter-badge-link" href="notes.html?subject=${SUBJECT}&goto=${encodeURIComponent(q.subsection || q.section)}&q=${encodeURIComponent((q.content||'').slice(0,60))}" target="_blank" title="点击新窗口查看该知识点笔记（已定位到小节）">${q.chapter} · ${q.section} 📖</a>`
                            : `<span class="chapter-badge" title="题目来源章节">${q.chapter}${q.section ? ' · ' + q.section : ''}</span>`) : ''}
                    </div>
                    <button class="btn-icon ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${q.id}')" title="${isFav ? '取消收藏' : '收藏'}">
                        ${isFav ? '★' : '☆'}
                    </button>
                </div>
                <div class="question-content">${isMulti ? fmtMultiContent(q, locked) : fmtContent(q.content)}</div>
                ${isMulti
                    ? '<div class="multi-hint">请在题干的每个（ ）下拉框中选择答案，全部选完再提交</div>'
                    : `<div class="options-list">${optionsHtml}</div>`}
                ${resultHtml}
                <div class="question-tools">
                    ${recite ? '' : `<button class="btn-explanation ${explanationShown ? 'active' : ''}" onclick="toggleExplanation()">
                        ${explanationShown ? '收起解析 ▴' : '查看解析 ▾'}
                    </button>`}
                    <button class="btn-explanation ${noteShown ? 'active' : ''} ${(q.note || (q.note_images || []).length) ? 'has-note' : ''}" onclick="toggleNote()">
                        ${(q.note || (q.note_images || []).length) ? '笔记 ●' : '笔记'} ${noteShown ? '▴' : '▾'}
                    </button>
                    ${status ? '<button class="btn-redo" onclick="redoQuestion()">重新作答 ↺</button>' : ''}
                </div>
                ${explanationHtml}
                ${noteHtml}
            </div>
        `;

        // 笔记内容用value赋值，防止笔记里的HTML字符被解析
        const noteInput = document.getElementById('noteInput');
        if (noteInput) {
            noteInput.value = q.note || '';
            autoResizeNote(noteInput);
        }
        renderNoteImages();

        // 更新提交按钮状态（背题/快刷模式下隐藏：背题不可作答，快刷点选即判）
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.style.display = (recite || isQuickOn()) ? 'none' : '';
        btnSubmit.disabled = !!status;
        btnSubmit.textContent = status ? '已提交' : '提交答案';

        // 多空题：回填已选/正确答案到每个下拉，并逐空标对错
        if (isMulti) {
            const ua = status ? (status.answer || '') : (recite ? (q.answer || '') : '');
            const ca = status ? (status.correctAnswer || '') : (recite ? (q.answer || '') : '');
            document.querySelectorAll('.blank-select').forEach((sel, i) => {
                if (ua) sel.value = ua[i] || '';
                if (status) {
                    const ok = ua[i] && ua[i] === ca[i];
                    sel.classList.toggle('blank-ok', !!ok);
                    sel.classList.toggle('blank-bad', !!ua[i] && !ok);
                } else if (recite) {
                    sel.classList.add('blank-ok');
                }
            });
        }

        renderNumberPanel();
        trackPractice();
    }

    // 记录练习位置：供首页「继续上次练习」与最近练习历史展示（本机 localStorage，同科目+模式+章节去重，最多留 6 条）
    function trackPractice() {
        const q = questions[currentIndex];
        if (!q) return;
        try {
            const key = [SUBJECT, MODE, CHAPTER, SECTION].join('|');
            const list = (JSON.parse(localStorage.getItem('practiceHistory')) || [])
                .filter(e => [e.subject, e.mode, e.chapter || '', e.section || ''].join('|') !== key);
            list.unshift({ subject: SUBJECT, mode: MODE, chapter: CHAPTER, section: SECTION, qid: q.id, idx: currentIndex, total: totalQuestions, ts: Date.now() });
            localStorage.setItem('practiceHistory', JSON.stringify(list.slice(0, 6)));
            // 本页专用位置存档（每科目+模式独立一键，不会被全局历史上限挤掉）
            localStorage.setItem('quiz_pos_' + SUBJECT + '_' + MODE, JSON.stringify({ qid: q.id, idx: currentIndex, ts: Date.now() }));
        } catch (e) { /* 存储异常不影响做题 */ }
    }

    // ============ 右侧题号面板：只显示当前章，按小节分组，点击跳转 ============
    function numBtnHtml(i, label) {
        const st = answered[questions[i].id];
        let cls = 'num-btn';
        if (st) cls += st.isCorrect === true ? ' correct' : (st.isCorrect === false ? ' wrong' : ' done');
        if (i === currentIndex) cls += ' current';
        return `<button class="${cls}" onclick="gotoQuestion(${i})">${label}</button>`;
    }

    function renderNumberPanel() {
        const panel = document.getElementById('numberPanel');
        if (!questions.length) { panel.innerHTML = ''; return; }
        const cur = questions[currentIndex];
        let html = '';
        if (cur.chapter) {
            // 收集当前章的题，按小节分组（保持题序）
            const groups = [];
            let g = null;
            questions.forEach((q, i) => {
                if (q.chapter !== cur.chapter) return;
                const sec = q.section || cur.chapter;
                if (!g || g.sec !== sec) { g = {sec, items: []}; groups.push(g); }
                g.items.push(i);
            });
            for (const grp of groups) {
                html += `<div class="num-group-title">${grp.sec}</div><div class="num-grid">`;
                grp.items.forEach((i, k) => { html += numBtnHtml(i, k + 1); });
                html += '</div>';
            }
        } else {
            // 无章节信息（如随机/错题模式）：按本轮序号平铺
            html = '<div class="num-grid">'
                + questions.map((q, i) => numBtnHtml(i, i + 1)).join('') + '</div>';
        }
        panel.innerHTML = html;
        const curBtn = panel.querySelector('.num-btn.current');
        if (curBtn) scrollInContainer(panel, curBtn, false);
    }

    function gotoQuestion(i) {
        // 切题前冲刷挂起的自动保存：此刻 DOM/currentIndex 仍属旧题，存的是旧题内容（输入已实时落内存，双保险）
        flushNoteSave();
        currentIndex = i;
        explanationShown = false;
        noteShown = hasNoteOf(questions[i]);  // 有笔记（文本或图片）默认展开，没有不展开
        renderQuestion();
    }

    function toggleExplanation() {
        explanationShown = !explanationShown;
        renderQuestion();
    }

    function toggleNote() {
        noteShown = !noteShown;
        renderQuestion();
    }

    // 进入编辑态：恢复保存按钮（取消淡化）
    function onNoteEdit() {
        const btn = document.getElementById('noteSaveBtn');
        if (btn) btn.classList.remove('saved');
    }

    // ==================== 笔记自动保存（防抖） ====================
    let _noteTimer = null;
    function onNoteInput() {
        const q = questions[currentIndex];
        const el = document.getElementById('noteInput');
        if (!q || !el) return;
        q.note = el.value;              // 先落内存：切题/重渲染不丢字
        onNoteEdit();
        const hint = document.getElementById('noteHint');
        if (hint) hint.textContent = '自动保存中…';
        clearTimeout(_noteTimer);
        _noteTimer = setTimeout(() => { _noteTimer = null; saveNote(true); }, 800);
    }
    // 页面隐藏/关闭前冲刷未入库的输入（任何异常不得阻断切题/卸载）
    function flushNoteSave() {
        if (_noteTimer) {
            clearTimeout(_noteTimer); _noteTimer = null;
            try { saveNote(true); } catch (e) { }
        }
    }
    window.addEventListener('pagehide', flushNoteSave);

    // 笔记输入框高度自适应：随内容自动增高，超过 60% 视口高时出现滚动条
    function autoResizeNote(el) {
        if (!el) return;
        el.style.height = 'auto';
        const maxH = Math.round(window.innerHeight * 0.6);
        el.style.height = Math.min(el.scrollHeight, maxH) + 'px';
        el.style.overflowY = el.scrollHeight > maxH ? 'auto' : 'hidden';
    }

    async function saveNote(isAuto = false) {
        const q = questions[currentIndex];
        const inputEl = document.getElementById('noteInput');
        const content = inputEl ? inputEl.value : (q.note || '');   // 面板未展开时安全兜底
        // 保存前是否已有笔记：用于区分「已删除」和「本来就是空的」
        const hadNote = !!(q.note || (q.note_images || []).length);
        try {
            const resp = await api(`/api/note/${q.id}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content, images: q.note_images || []})
            });
            const result = await resp.json();
            q.note = result.note || '';
            q.note_images = result.images || [];
            const hasNote = !!(q.note || q.note_images.length);
            const hint = document.getElementById('noteHint');
            hint.textContent = hasNote ? (isAuto ? '已自动保存 ✓' : '已保存 ✓') : (hadNote ? '已删除笔记' : '笔记是空的，没有保存');
            setTimeout(() => { if (hint) hint.textContent = ''; }, 2000);
            // 保存成功后淡化保存按钮（提示已保存），再次编辑时恢复
            const btn = document.getElementById('noteSaveBtn');
            if (btn) btn.classList.toggle('saved', hasNote);
        } catch (e) {
            if (isAuto) {
                // 自动保存失败静默提示，不弹窗打断输入
                const hint = document.getElementById('noteHint');
                if (hint) hint.textContent = '自动保存失败，请点「保存笔记」重试';
            } else {
                alert('笔记保存失败: ' + e.message);
            }
        }
    }

    // ==================== 笔记贴图 ====================

    function renderNoteImages() {
        const box = document.getElementById('noteImages');
        if (!box) return;
        const imgs = questions[currentIndex].note_images || [];
        box.innerHTML = imgs.map((src, i) => `
            <div class="note-img-item">
                <img src="${src}" alt="笔记图片" onclick="viewNoteImage(${i})">
                <span class="note-img-del" onclick="delNoteImage(${i})" title="删除图片">×</span>
            </div>`).join('');
    }

    // 压缩成最长边1200px的JPEG，控制入库体积（透明底先铺白）
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(img.src);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => reject(new Error('图片读取失败'));
            img.src = URL.createObjectURL(file);
        });
    }

    // 从剪贴板粘贴图片（截图后在笔记框 Ctrl+V），压缩后随笔记入库；纯文字粘贴不受影响
    async function pasteNoteImage(event) {
        const files = [...(event.clipboardData ? event.clipboardData.items : [])]
            .filter(it => it.type.startsWith('image/'))
            .map(it => it.getAsFile())
            .filter(Boolean);
        if (!files.length) return;
        event.preventDefault();
        const q = questions[currentIndex];
        try {
            for (const f of files) {
                (q.note_images = q.note_images || []).push(await compressImage(f));
            }
        } catch (e) { alert(e.message); }
        renderNoteImages();
        saveNote();   // 贴图后立即随笔记入库
    }

    function delNoteImage(i) {
        (questions[currentIndex].note_images || []).splice(i, 1);
        renderNoteImages();
        saveNote();
    }

    function viewNoteImage(i) {
        const src = (questions[currentIndex].note_images || [])[i];
        if (!src) return;
        const ov = document.createElement('div');
        ov.className = 'img-lightbox';
        ov.innerHTML = `<img src="${src}" alt="笔记图片">`;
        ov.onclick = () => ov.remove();
        document.body.appendChild(ov);
    }

    function redoQuestion() {
        // 仅解锁当前题允许重新作答，历史记录仍保留在本地库中
        const q = questions[currentIndex];
        delete answered[q.id];
        explanationShown = false;
        renderQuestion();
    }

    async function submitAnswer() {
        if (isReciteOn()) return;  // 背题模式不作答（含 Enter 快捷键）

        const q = questions[currentIndex];
        let userAnswer;
        if (q.multi_blank) {
            // 多空题：收集每个下拉的值，按空位顺序拼成答案（如 BACD）
            const sels = document.querySelectorAll('.blank-select');
            const vals = [...sels].map(s => s.value);
            if (!vals.length || vals.some(v => !v)) {
                alert('请为每个空都选择一个答案');
                return;
            }
            userAnswer = vals.join('');
        } else {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                alert('请选择一个答案');
                return;
            }
            userAnswer = selected.value;
        }

        try {
            const resp = await api('/api/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question_id: q.id, answer: userAnswer})
            });
            const result = await resp.json();

            answered[q.id] = {
                answer: userAnswer,
                isCorrect: result.is_correct,
                correctAnswer: result.correct_answer,
                explanation: result.explanation
            };
            // 提交后自动展开解析，并用最新解析更新本地题目
            if (result.explanation) q.explanation = result.explanation;
            if (result.correct_answer) q.answer = result.correct_answer;

            // 答对自动跳题：开关开启且答对时不展开解析，短暂显示结果后进入下一题
            const autoJump = result.is_correct === true && isAutoNextOn()
                && currentIndex < questions.length - 1;
            if (!autoJump && (result.explanation || result.correct_answer)) {
                explanationShown = true;
            }

            renderQuestion();

            if (autoJump) {
                setTimeout(() => {
                    // 用户可能已手动翻题，仅当还停在当前题时才跳
                    if (questions[currentIndex] && questions[currentIndex].id === q.id) {
                        nextQuestion();
                    }
                }, 800);
            }
        } catch (e) {
            alert('提交失败: ' + e.message);
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            explanationShown = false;
            noteShown = hasNoteOf(questions[currentIndex]);
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            explanationShown = false;
            noteShown = hasNoteOf(questions[currentIndex]);
            renderQuestion();
        }
    }

    async function toggleFavorite(questionId) {
        try {
            const resp = await api(`/api/favorite/${questionId}`, {method: 'POST'});
            const result = await resp.json();
            // 更新当前题目的收藏状态
            const q = questions[currentIndex];
            if (q.id === questionId) {
                q.is_favorited = result.is_favorited;
                renderQuestion();
            }
        } catch (e) {
            console.error('收藏失败:', e);
        }
    }

    async function resetFavProgress() {
        // 收藏模式清空重做：只清收藏题的作答记录，收藏本身保留
        if (!confirm('清空所有收藏题的作答记录，重新刷一遍？（收藏保留，不影响其他题）')) return;
        try {
            await api(`/api/favorites/reset/${SUBJECT}`, {method: 'POST'});
            answered = {};
            questions.forEach(q => { q.last_status = null; });
            updateFavWrongCount();  // 全量重刷后错题记录已清空，同步按钮计数
            gotoQuestion(0);
        } catch (e) {
            alert('清空失败: ' + e.message);
        }
    }

    // 收藏题里有几道「现在还在错题本上」：给按钮显示计数，0 道时禁用避免误点
    // ① 不加 include_resolved → 与错题本页看到的一致（连对2次已移出的历史不计入）
    // ② 用 quizAllQuestions 而非 questions 做交集——年份筛选后 questions 只是子集
    // 注意：计数按「未解决」算，但真删时按「该题的全部错题记录」删（含已解决），
    // 这样这些收藏题会彻底移出错题本，不会因为留了已解决记录又回到30天复盘
    async function updateFavWrongCount() {
        const btn = document.getElementById('favWrongResetBtn');
        if (!btn || btn.style.display === 'none') return 0;
        try {
            const resp = await api(`/api/wrong?subject=${encodeURIComponent(SUBJECT)}`);
            const data = await resp.json();
            const favIds = new Set(quizAllQuestions.map(q => q.id));
            favWrongCount = (data.wrong_questions || []).filter(w => favIds.has(w.question_id)).length;
        } catch (e) {
            favWrongCount = -1;  // 取不到就当有内容，宁可让用户看到确认框
        }
        btn.textContent = favWrongCount > 0 ? `清空收藏错题 ${favWrongCount} 🗑` : '清空收藏错题 🗑';
        btn.disabled = favWrongCount === 0;
        btn.title = favWrongCount === 0
            ? '收藏题中暂无错题（已连对2次移出的历史记录不计入）'
            : `把收藏模式下的 ${favWrongCount} 道错题从错题本移除：只动收藏题，其他题的错题不受影响；作答记录与正确率保留，收藏也保留`;
        return favWrongCount;
    }

    async function resetFavWrong() {
        // 仅清收藏题的错题记录：作答记录/正确率不动，收藏也保留
        // 点下时现取一次计数，避免用户在页面上又答错几题导致按钮上显示的旧数字过期
        const n = await updateFavWrongCount();
        if (n === 0) { alert('收藏模式下的题目里没有错题了'); return; }
        // n<0 表示计数接口取数失败：不带具体数字照样执行，宁可多问一句也不要漏删
        const msg = n > 0
            ? `把收藏模式下的 ${n} 道错题从错题本移除？\n\n只动收藏里的题，其他题的错题记录不受影响\n作答记录与正确率保留，收藏也保留`
            : '把收藏模式下的错题从错题本移除？\n\n（未能读取当前条数；只动收藏里的题，其他题的错题记录不受影响）';
        if (!confirm(msg)) return;
        try {
            await api(`/api/favorites/reset-wrong/${SUBJECT}`, {method: 'POST'});
            await updateFavWrongCount();
        } catch (e) {
            alert('清空失败: ' + e.message);
        }
    }

    // 键盘快捷键（在笔记输入框内不触发，防止打字时误操作）
    document.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'textarea' || tag === 'input') return;
        if (e.key === 'ArrowLeft') prevQuestion();
        else if (e.key === 'ArrowRight') nextQuestion();
        else if (e.key === 'Enter') submitAnswer();
        else if (['a','b','c','d','A','B','C','D'].includes(e.key)) {
            const radio = document.querySelector(`input[name="answer"][value="${e.key.toUpperCase()}"]`);
            if (radio && !radio.disabled) {
                radio.checked = true;
                if (isQuickOn()) submitAnswer();  // 快刷：按键选中即判
            }
        }
    });

    // ============ 选项乱序：只乱显示顺序，字母跟随内容，答案字母不变 ============
    function isShuffleOn() {
        return localStorage.getItem('shuffleOpts') === '1';
    }

    function renderShuffleBtn() {
        const btn = document.getElementById('shuffleBtn');
        btn.classList.toggle('on', isShuffleOn());
        document.getElementById('shuffleState').textContent = isShuffleOn() ? '开' : '关';
    }

    function toggleShuffle() {
        localStorage.setItem('shuffleOpts', isShuffleOn() ? '0' : '1');
        optionOrder = {};  // 重新洗牌
        renderShuffleBtn();
        if (questions.length) renderQuestion();
    }

    function getOptionOrder(q) {
        const keys = Object.keys(q.options);
        if (!isShuffleOn()) return keys;
        if (!optionOrder[q.id]) {
            const arr = keys.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            optionOrder[q.id] = arr;  // 缓存：展开解析/笔记重渲染时顺序不变
        }
        return optionOrder[q.id];
    }

    // 多空题：把题干里每个 ( ) 替换成 A-D 下拉选择（跳过 <pre> 代码块与 malloc() 等函数调用）
    function fmtMultiContent(q, locked) {
        const optHtml = ['<option value=""></option>']
            .concat(Object.entries(q.options || {}).map(([k, v]) => `<option value="${k}">${k}. ${v}</option>`))
            .join('');
        const selHtml = `<select class="blank-select" ${locked ? 'disabled' : ''} onchange="onMultiBlankPicked()">${optHtml}</select>`;
        return fmtContent(q.content).replace(/<pre\b[\s\S]*?<\/pre>|(?<![A-Za-z0-9_])\(\s*\)/g, m =>
            /^<pre/i.test(m) ? m : selHtml);
    }

    renderShuffleBtn();

    // ============ 快刷模式：点选项直接判对错 ============
    function onOptionPicked() {
        if (isQuickOn() && !answered[questions[currentIndex].id]) submitAnswer();
    }

    // 多空题：全部空选满后自动提交（与考试页 pickMultiAnswer 一致，选完即存）
    function onMultiBlankPicked() {
        const q = questions[currentIndex];
        if (!q || answered[q.id]) return;
        const sels = document.querySelectorAll('.blank-select');
        if (!sels.length) return;
        if ([...sels].some(s => !s.value)) return;  // 还有空未选，等用户选满
        submitAnswer();
    }

    // 快刷开关切换时即时显隐提交按钮（common.js 的 toggleQuick 调用）
    function onQuickModeChange() {
        if (questions.length) renderQuestion();
    }

    // 背题模式开关切换时即时刷新当前题（common.js 的 toggleRecite 调用）
    function onReciteModeChange() {
        if (questions.length) renderQuestion();
    }

    init();
    </script>
