<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真题讲解时间点标注</title>
<style>
  :root { --primary:#4f46e5; --border:#e5e7eb; --text:#222; --light:#6b7280; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; font: 14px/1.7 "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); background: #fafafa;
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { color: var(--light); font-size: .85rem; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1080px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: .8rem; color: var(--light); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font: inherit; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid rgba(79,70,229,.25); border-color: var(--primary); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--primary);
    background: var(--primary); color: #fff; font: inherit; cursor: pointer;
  }
  button.ghost { background: #fff; color: var(--primary); }
  button.danger { background: #fff; color: #b91c1c; border-color: #fca5a5; }
  button:hover { filter: brightness(.96); }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .parsed { margin-top: 12px; font-size: .85rem; color: var(--light); min-height: 22px; }
  .parsed b { color: var(--text); }
  .parsed .bad { color: #b91c1c; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--light); font-weight: 600; font-size: .78rem; }
  td.mono { font-family: Consolas, monospace; }
  .empty { color: var(--light); padding: 14px 0; font-size: .85rem; }
  .hint { font-size: .78rem; color: var(--light); margin-top: 8px; line-height: 1.6; }
  .tip {
    margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--primary);
    background: rgba(79,70,229,.04); font-size: .82rem; color: #444;
  }
  kbd {
    background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 4px;
    padding: 0 4px; font-size: .8em; font-family: Consolas, monospace;
  }
</style>
</head>
<body>

<h1>真题讲解时间点标注</h1>
<div class="sub">边听 B 站讲解，边记录「哪道题在哪个分 P 的第几秒」。全部存在本地浏览器，导出 JSON 后可接进站点。</div>

<div class="grid">
  <!-- 左：记录 -->
  <div class="card">
    <label>1. 粘贴 B 站链接（带时间点的更好：…?p=6&amp;t=8883）</label>
    <input type="text" id="url" placeholder="https://www.bilibili.com/video/BV1BcXQYUEiL?p=6&t=8883.0">
    <div class="parsed" id="parsed">等待粘贴…</div>

    <label>2. 这道题属于</label>
    <div class="row">
      <select id="year"></select>
      <select id="subject">
        <option value="ds">数据结构</option>
        <option value="co">计算机组成原理</option>
        <option value="os">操作系统</option>
        <option value="cn">计算机网络</option>
      </select>
      <input type="number" id="qno" min="1" max="47" placeholder="卷面题号 41-47">
    </div>

    <label>3. 备注（可选，例如「第三小问」）</label>
    <input type="text" id="memo" placeholder="可留空">

    <div class="btns">
      <button onclick="addEntry()">记下这一题</button>
      <button class="ghost" onclick="openVideo()">打开视频</button>
    </div>
    <div class="tip">
      听到某题开始时：B 站播放器右键 →「复制视频网址」会带上 <kbd>?t=</kbd> 当前秒数，粘到上面即可。
    </div>
  </div>

  <!-- 右：已记录 -->
  <div class="card">
    <label>已记录 <span id="count" style="color:var(--primary)">0</span> 条</label>
    <div id="list"><div class="empty">还没有记录。每条占几十字节，标多少用多少。</div></div>
    <div class="btns">
      <button class="ghost" onclick="exportJson()">导出 JSON</button>
      <button class="ghost" onclick="copyJson()">复制 JSON</button>
      <button class="danger" onclick="clearAll()">清空</button>
    </div>
    <div class="hint">
      导出格式：<code>{"2014": {"45": {"bvid":"BV…","p":6,"t":8883}}}</code><br>
      接入方式：有映射的题，按钮直接跳 <code>bilibili.com/video/{bvid}?p={p}&amp;t={t}</code>；没有的仍走搜索。
    </div>
  </div>
</div>

<script>
  const KEY = 'ztBiliMap';
  const YEARS = Array.from({ length: 2026 - 2009 + 1 }, (_, i) => 2009 + i).reverse();

  const $ = id => document.getElementById(id);
  $('year').innerHTML = YEARS.map(y => `<option value="${y}">${y} 年</option>`).join('');
  $('year').value = new Date().getFullYear() >= 2009 ? Math.min(new Date().getFullYear(), 2026) : 2026;

  // { "2014": { "45": { bvid, p, t, memo, subject, savedAt } } }
  let map = {};
  try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { map = {}; }

  // 解析 B 站链接：bvid / p / t（t 可能是 8883.0）
  function parseUrl(raw) {
    const s = String(raw || '').trim();
    if (!s) return null;
    const bv = s.match(/(BV[0-9A-Za-z]{10})/);
    if (!bv) return null;
    const p = s.match(/[?&]p=(\d+)/);
    const t = s.match(/[?&]t=([\d.]+)/);
    return {
      bvid: bv[1],
      p: p ? Number(p[1]) : 1,
      t: t ? Math.round(Number(t[1])) : 0
    };
  }

  function fmtDur(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s2 = sec % 60;
    return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s2).padStart(2, '0');
  }

  function showParsed() {
    const r = parseUrl($('url').value);
    const box = $('parsed');
    if (!$('url').value.trim()) { box.textContent = '等待粘贴…'; return; }
    if (!r) { box.innerHTML = '<span class="bad">没认出 BV 号，检查链接</span>'; return; }
    box.innerHTML = `识别到 <b>${r.bvid}</b> ｜ 分P <b>P${r.p}</b> ｜ 时间点 <b>${r.t ? fmtDur(r.t) + '（' + r.t + 's）' : '未带（从头开始）'}</b>`;
  }
  $('url').addEventListener('input', showParsed);

  // 本地时间戳（toISOString 是 UTC，会差 8 小时，别用）
  function nowLocal() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }

  function addEntry() {
    const r = parseUrl($('url').value);
    if (!r) { alert('先粘贴一个含 BV 号的 B 站链接'); return; }
    const y = $('year').value, qno = Number($('qno').value);
    if (!qno || qno < 1 || qno > 47) { alert('题号填 1-47（卷面题号，大题通常是 41-47）'); return; }
    map[y] = map[y] || {};
    map[y][qno] = {
      bvid: r.bvid, p: r.p, t: r.t,
      subject: $('subject').value,
      memo: $('memo').value.trim(),
      savedAt: nowLocal()
    };
    localStorage.setItem(KEY, JSON.stringify(map));
    $('memo').value = '';
    render();
  }

  function del(y, q) {
    if (!confirm(`删除 ${y} 年第 ${q} 题的时间点？`)) return;
    delete map[y][q];
    if (!Object.keys(map[y]).length) delete map[y];
    localStorage.setItem(KEY, JSON.stringify(map));
    render();
  }

  function render() {
    const rows = [];
    let n = 0;
    for (const y of Object.keys(map).sort((a, b) => b - a)) {
      for (const q of Object.keys(map[y]).sort((a, b) => a - b)) {
        const e = map[y][q];
        n++;
        rows.push(`<tr>
          <td>${y}</td><td>第 ${q} 题</td>
          <td class="mono">${e.bvid} P${e.p} @${fmtDur(e.t)}</td>
          <td>${e.memo || ''}</td>
          <td><button class="danger" style="padding:2px 8px;font-size:.78rem" onclick="del('${y}','${q}')">删</button></td>
        </tr>`);
      }
    }
    $('count').textContent = n;
    $('list').innerHTML = rows.length
      ? `<table><thead><tr><th>年</th><th>题</th><th>位置</th><th>备注</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>`
      : '<div class="empty">还没有记录。每条占几十字节，标多少用多少。</div>';
  }

  function openVideo() {
    const r = parseUrl($('url').value);
    if (!r) { alert('先粘贴链接'); return; }
    window.open(`https://www.bilibili.com/video/${r.bvid}?p=${r.p}${r.t ? '&t=' + r.t : ''}`, '_blank', 'noopener');
  }

  function json() { return JSON.stringify(map, null, 1); }

  function exportJson() {
    const blob = new Blob([json()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zt_bili_map.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  async function copyJson() {
    try {
      await navigator.clipboard.writeText(json());
      alert('已复制到剪贴板');
    } catch (e) {
      alert('复制失败，请用「导出 JSON」');
    }
  }

  function clearAll() {
    if (!confirm('清空全部标注？（不可恢复）')) return;
    map = {};
    localStorage.removeItem(KEY);
    render();
  }

  render();
</script>
</body>
</html>
